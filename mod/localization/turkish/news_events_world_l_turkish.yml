  news_events_world.32.d: "[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetNameNoFormatting], [ROOT.Var('news_world_32_news_backdown_target_ref').GetCountry.GetNameNoFormatting] ile diplomatik karşılaşmasında geri adım attı ve anlaşmazlığı savaşa taşımak yerine ana talebi kabul etti. Ulusal kararlılığın sınavı olarak sunulan mesele konferans masasında sona erdi; yabancı başkentler bu geri çekilmenin [ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting] itibarı için ne anlama geldiğini şimdiden tartıyor."
  news_events_world.32.f: "DİPLOMASİ MASASI: Yabancı başkentlerden gelen telgraflar savaşın önlenmesinin derhâl rahatlama yarattığını bildiriyor. Ancak içeride hükûmet muhalifleri barış için fazla ağır bir bedel ödenip ödenmediğini şimdiden soruyor."
