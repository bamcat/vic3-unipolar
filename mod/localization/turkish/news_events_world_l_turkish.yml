l_turkish:
  news_events_world.1.t: "[ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFormatting] ve [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFormatting] Savaşın Eşiğinde!"
  news_events_world.1.d: "[ROOT.Var('news_world_1_news_diplomatic_play_ref').GetDiplomaticPlay.GetName], [ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFlag] ile [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFlag] ülkesini açık bir karşı karşıya gelişe sürükledi. Çağın önde gelen iki gücü artık resmî bir anlaşmazlıkta birbirine bakıyor ve Avrupa başkentleri yıllardır görülmemiş bir hareketlilik içinde. Kuryeler gece gündüz başkentler arasında gidip geliyor, borsalar sarsılıyor ve kulüplerde başka konu konuşulmuyor. Uyuşmazlığın müzakereyle çözülüp çözülmeyeceği ya da savaşa dönüşüp dönüşmeyeceği, önümüzdeki haftalarda ileri sürülecek taleplere, birliklerin sınıra hareketine ve hesaplaşma vakti geldiğinde hangi hükûmetin kimin yanında duracağına bağlı olacak."
  news_events_world.1.f: "DİPLOMASİ MASASI: Her iki tarafın elçilerinin gece yarısından sonra bile çalıştığı söyleniyor. Yabancı bir gözlemci havayı, kamuoyu önünde nazik fakat kapalı kapılar ardında açıkça düşmanca diye niteledi."
  news_events_world.2.t: "KRİZ! [ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFormatting] ile [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFormatting] Arasında"
  news_events_world.2.d: "[ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFlag], [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFlag] ülkesine karşı yürütülen [ROOT.Var('news_world_2_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] meselesine bütün ağırlığını koydu. Birinci sınıf bir güç, aksi hâlde bölgesel kalabilecek bir anlaşmazlığa karışmayı seçti ve bu müdahale krizin niteliğini bütünüyle değiştirdi. Komşular arasındaki bir çekişme artık devletler topluluğunun tamamını ilgilendiren bir mesele oldu. Dışişleri bakanlıkları açıklanan talepleri ve yeni taahhütleri yakından incelerken bölgenin küçük hükûmetleri, iş sonuçlanmadan önce hangi tarafı karşılarına almayı daha az göze alabileceklerini sessizce tartıyor."
  news_events_world.2.f: "ANALİZ: Bölgesel bir çekişme olarak başlayan mesele artık her büyük dışişleri makamının dikkatinde; küçük hükûmetler hangi tarafı gücendirmeyi göze alabileceklerini sessizce hesaplıyor."
  news_events_world.3.t: "SAVAŞ! [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFormatting] ile [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFormatting] Arasında!"
  news_events_world.3.d: "[ROOT.Var('news_world_3_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] artık diplomasiyi aşarak [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFlag] ile [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFlag] arasında açık savaşa dönüştü. Büyükelçiler geri çağrıldı, yedekler kışlalarına çağrıldı ve borsalar altüst oldu. Askere alma bürolarında şafaktan beri kalabalıklar var; demiryolu şirketleri vagonlarını savaş bakanlıklarının emrine verdi. Tüccarlar hangi liman ve güzergâhların açık kalacağını ve sigorta bedellerinin ne olacağını sorarken kıta hükûmetleri antlaşmalarının kendilerine hangi yükümlülükleri getirdiğini tartıyor."
  news_events_world.3.f: "CEPHE HATTI: Yedekler, mühimmat ve atlar savaş alanına taşınırken demiryolu tarifelerinin yerini askerî sevkiyat çizelgeleri alıyor. Tüccarlar hangi liman ve yolların güvenli kalacağını şimdiden soruyor."
  news_events_world.4.t: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFormatting], [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFormatting] Ülkesini İşgale Başladı"
  news_events_world.4.d: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFlag], [ROOT.Var('news_world_4_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] kapsamında [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFlag] ülkesine karşı sahaya indi. İki savaşan taraf arasındaki güç farkı herkesçe görülüyor ve bazı başkentlerde şimdiden hızlı ve ucuz bir zaferden söz ediliyor. Başkaları ise ihtiyat çağrısı yapıyor. Askerî muhabirlerimiz, mesafenin, zorlu arazinin, hastalığın ve üçüncü tarafların sessiz müdahalelerinin kâğıt üzerinde ezici görünen kuvvetleri ne kadar sık küçük düşürdüğünü ve kendinden emin tahminlerle başlayan seferlerin ne kadar seyrek vaat edilen mevsimde bittiğini hatırlatıyor."
  news_events_world.4.f: "ASKERÎ MASA: Kâğıt üzerindeki dengesizlik büyük olabilir, ancak muhabirlerimiz mesafe, arazi ve dış müdahalenin birçok sözde kolay seferi mahvettiğini hatırlatıyor."
  news_events_world.5.t: "[ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFormatting] Ülkesinde Hükûmet Darbesi"
  news_events_world.5.d: "[ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki siyasi düzen zorla devrildi. İktidar artık [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetRuler.GetFullName] elinde ve devlet [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetGovernment.GetName] olarak yönetilecek. Bakanlıklar, telgrafhaneler ve başlıca tren istasyonları şafaktan önce ele geçirildi. Ordunun taşrada da başkentteki kadar kolay yeni efendilere uyup uymayacağı, mevcut yasalarla dış antlaşmaların korunup korunmayacağı ve devrilen tarafların boyun eğip eğmeyeceği konusunda başkentte kimse güvenle konuşamıyor."
  news_events_world.5.f: "BAŞKENTTEN ÖZEL: Halk, bakanlıkların, tren istasyonlarının ve telgrafhanelerin önünde askerlerin nöbet tuttuğunu bildiriyor. Bir memurun sözleriyle, sabaha üniformalar değişmişti ama kimse kimin emrini uyguladıklarını bilmiyordu."
  news_events_world.6.t: "[ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFormatting] [ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] Suikasta Uğradı"
  news_events_world.6.d: "[ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesini yönetmekte olan [ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_6_character_ref').GetCharacter.GetFullName], [ROOT.Var('news_world_6_character_ref').GetCharacter.GetAge] yaşında bir suikastçı tarafından öldürüldü. Devlet başkanının öldürülmesi derhâl şok yarattı; bakanlar başkenti, garnizonu ve hazineyi güvence altına almak ve en azından süreklilik görüntüsünü korumak için harekete geçti. Yabancı hükûmetler antlaşmaların ve askerî komutanlığın aksamadığına dair güvence istiyor. Olayın ardındaki komplonun araştırılması daha yeni başladı ve ülkedeki her hizbin suçun kime yükleneceği konusunda çıkarı var."
  news_events_world.6.f: "GÜVENLİK MASASI: Soruşturmacılar suç ortaklarını ararken bakanlar devletin hâlâ kontrol altında olduğunu kanıtlamaya çalışıyor. Cevapsız soru, suikastçının tek başına mı yoksa harekete geçmeyi bekleyen bir hizip adına mı davrandığı."
  news_events_world.7.t: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullNameNoFormatting] Öldü; [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFormatting] Yasta"
  news_events_world.7.d: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullName], [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesini yönetirken [ROOT.Var('news_world_7_character_ref').GetCharacter.GetAge] yaşında öldü. Kamu binalarına siyah örtüler asıldı, başkent dükkânları kepenklerini kapattı. Veraset artık gelenek ve yasanın öngördüğü usule göre ilerliyor; bakanlar süreklilik ve istikrarlı politika konusunda tek sesle konuşuyor. Ancak yabancı başkentlerin hepsi özel olarak aynı soruyu soruyor: Bu değişim ittifakları, politikayı ya da uzun süredir tahtın çevresinde bulunan hizipler arasındaki dengeyi değiştirecek mi?"
  news_events_world.7.f: "BAŞKENTTEN: Halk veraset haberini beklerken kamu binalarına siyah örtüler asılıyor. Törenlerin ardında bakanlar, yeni saltanatın anlamını belirlemek için şimdiden yarışıyor."
  news_events_world.8.t: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetLastNameNoFormatting], [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFormatting] Ülkesinde Devrildi"
  news_events_world.8.d: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetFullName] hayattayken [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesinde iktidardan uzaklaştırıldı ve devletin dizginlerini [ROOT.Var('news_world_8_new_ruler_ref').GetCharacter.GetFullName] aldı. Ülke [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetGovernment.GetName] olarak yönetilecek. Seçim, ölüm ya da olağan veraset olmaksızın yaşayan bir hükümdarın kenara itilmesinin basit bir açıklaması nadiren vardır ve resmî anlatım pek az kişiyi tatmin etti. Diplomatlar, kapalı kapılar ardında ne yaşandığına ve yeni yönetimin rızaya mı yoksa süngüye mi dayandığına dair ipucu bulmak için bakan atamalarını ve garnizon hareketlerini izliyor."
  news_events_world.8.f: "SİYASİ ANALİZ: Seçim, ölüm veya olağan veraset olmadan görevden alınan yaşayan bir hükümdar, ardında nadiren basit bir açıklama bırakır."
  news_events_world.9.t_presidential: "[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting], [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting] Başkanlık Seçimini Kazandı"
  news_events_world.9.d_presidential: "[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting], [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag] seçimlerini kazandı ve [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName] başkanlığı devralıyor. Partinin adayları kullanılan oyların [ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetCurrentVotingPowerShare|%1] kadarını aldı. Sonuç bazı çevrelerde kutlamayla, bazılarında ise açık hayal kırıklığıyla karşılandı; yenilen çıkar grupları bazı bölgelerde oylamanın yürütülüşünü şimdiden tartışmaya açtı. Yabancı hükûmetler sonucu diplomasi, ticaret, askerî politika ve çağın önde gelen güçlerinden birinin genel siyasi havası açısından inceliyor."
  news_events_world.9.t_party: "[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting], [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting] Seçimlerinde Zafer Kazandı"
  news_events_world.9.d_party: "[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting], [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag] seçim kampanyasının sonunda en güçlü parti olarak çıktı; adayları kullanılan oyların [ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetCurrentVotingPowerShare|%1] kadarını aldı. Büyük kentlerdeki komiteler gece yarısından sonra da sayım yapıyordu ve birden fazla seçim bölgesinde sonuç tartışmalı. Yabancı hükûmetler, yatırımcılar ve siyasi hareketler yeni parti dengesinin iç ve dış politikaya ne getireceğini ve kurulacak hükûmetin ne kadar süre işleyen bir çoğunluğa sahip olabileceğini tartıyor."
  news_events_world.9.t_government: "[ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting], [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting] Hükûmetine Önderlik Edecek"
  news_events_world.9.d_government: "[ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting], seçimlerin ardından [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag] hükûmetinin başlıca partisi durumunda ve kullanılan oyların [ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetCurrentVotingPowerShare|%1] kadarını aldı. Taç siyasi çekişmenin üzerinde kaldığında bir seçim devlet başkanını değiştirmeden altındaki bütün güç dengesini yeniden kurabilir. Yabancı hükûmetler ve iş çevreleri yeni kabineyi yakından izliyor; çünkü bir kabinenin bileşimi çoğu zaman bir ülkenin niyetleri konusunda taht konuşmasından daha güvenilir bir işaret olmuştur."
  news_events_world.9.t: "[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting] Seçimleri Sonuçlandı"
  news_events_world.9.d: "[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesinde seçim sonuçlandı; dünya üzerindeki ağırlığı nedeniyle bu sonuç yalnızca iç mesele değil uluslararası bir olaydır. Sonuçlar ilan edildikten saatler içinde Avrupa'nın bütün başkentlerine telgrafla ulaştı. Yabancı hükûmetler ve siyasi hareketler parti dengesini ve [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName] konumunu inceliyor; ülkenin hükûmeti diplomasi, ticaret, donanma ve orduların konuşlandırılması ile çağın genel havasını etkileyebilir. İçeride ise yeni yönetimi kurma çalışmaları artık ciddi biçimde başlıyor."
  news_events_world.9.f: "SEÇİM MASASI: Parti merkezlerinde kutlama, itiraz ve yeniden sayım aynı anda sürüyor. Sonuç yurtdışında ülkenin bir sonraki diplomatik ve ticari yönünün işareti olarak okunacak."
  news_events_world.10.t_drought: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Kuraklığın Pençesinde"
  news_events_world.10.d_drought: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] bölgesine yağmur düşmedi; yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişi hasada bağımlı. Tarlalar kavruluyor, rezervuarlar her hafta biraz daha çekiliyor ve çiftçiler en kötüsüne hazırlanarak ekimi azaltıyor. Hayvancılar su aramak için sürülerini her gün daha uzağa götürüyor, tahıl tüccarları da vadeli fiyatları yükseltmeye başladı. Pazar kasabalarında yardım komiteleri kuruluyor. Kuraklık mevsim boyunca sürerse kötü bir yıl çok daha ağır bir felakete dönüşebilir ve yük ilk olarak buna en az dayanabileceklerin omuzlarına binecek."
  news_events_world.10.t_flood: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Bölgesinde Felaket Getiren Seller"
  news_events_world.10.d_flood: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] nehirleri taştı; tarlalar ve köyler su altında kaldı, yollar kesildi. Yetkililer kurtarma ekipleri tamamen izole olmuş yerleşimlere ulaşmaya çalışırken köprü ve setlerde hasar tespiti yapıyor. Hayvan kayıplarının ağır olduğu, birçok ailenin kışlık erzağının bütünüyle mahvolduğu bildiriliyor. Yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişinin yaşadığı bu bölgede ekinlere ve ulaşıma verilen zarar, sular çekildikten çok sonra bile pazarlarda hissedilecek."
  news_events_world.10.t_frost: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Bölgesini Şiddetli Don Vurdu"
  news_events_world.10.d_frost: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] üzerine olağanüstü bir don çöktü. Üreticiler kararmış tarlalar ve mahvolmuş meyve bahçeleri bildiriyor; soğuk mevsiminde oldukça ilerlemiş ürünleri vurdu. Yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişinin yaşadığı bir bölgede tek bir hasadın kaybı küçük mesele değildir. Tüccarlar en ağır etkilenen yerlerde ay sonundan önce kıtlık bekliyor; çiftçiler ise geç ekimin kaybın bir bölümünü telafi edip edemeyeceğini görmek için bekliyor."
  news_events_world.10.t_wildfire: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Bölgesindeki Orman Yangınları Tahliyelere Yol Açtı"
  news_events_world.10.d_wildfire: "Yangın [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] boyunca ilerliyor; aileler evlerinden kaçıyor, çiftlikler, kereste alanları ve yollar tehdit altında. Duman bütün bölgeleri kararttı ve öğle güneşinin kırmızı göründüğü bildiriliyor. Yerel makamlar toplayabildikleri ekiplerle yangın şeritleri açıyor, birkaç ilçede milisler göreve çağrıldı. Yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişinin yaşadığı eyalette mülk, mera ve ayakta kereste kayıpları son alev söndürüldükten çok sonra bile bölgeyi etkileyebilir."
  news_events_world.10.t_hailstorm: "Dolu Fırtınası [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Hasadını Mahvetti"
  news_events_world.10.d_hailstorm: "Şiddetli bir dolu fırtınası [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] üzerinden geçti; ayaktaki tahılı parçaladı, çatıları ve camları kırdı, açıkta kalan hayvanları yaraladı. Saatler önce hasada hazır görünen tarlalar şimdi dümdüz. Yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] nüfuslu bir eyalette yerel ürün kaybı bile ekmek fiyatına ve kırsal gelirlerine hızla yansır. Sigorta şirketleri talepleri almaya başladı; yerel makamlar ise sigortasız kalanların zararını hesaplıyor."
  news_events_world.10.t_locust_swarm: "Çekirgeler [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Üzerine İndi"
  news_events_world.10.d_locust_swarm: "Yoğun çekirge sürüleri [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] tarlalarına indi ve köylerin savunabileceğinden hızlı biçimde ürünleri tüketiyor. Ambarlar gece gündüz korunurken çiftçiler ayakta kalanları kurtarmak için böcekleri yakıyor, dövüyor ve dumanla uzaklaştırıyor. Sürülerin geçerken gökyüzünü kararttığı söyleniyor. Etkilenen bölgelerde yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişi yaşıyor; yetkililer salgın sürer ya da komşu tarım bölgelerine yayılırsa böceklerin hemen ardından kıtlığın geleceğinden korkuyor."
  news_events_world.10.t_heatwave: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Üzerine Ezici Sıcaklar Çöktü"
  news_events_world.10.d_heatwave: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] bölgesini ezici bir sıcak dalgası sardı. Kuyular azalıyor, hayvanlar tarlalarda ölüyor, ekinler acımasız güneş altında soluyor. Kentlerde yaşlılar ve küçük çocuklar arasında ölümler bildiriliyor; su arabaları şafaktan karanlığa kadar çalışıyor. Yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişilik eyalet makamları, uzun süren sıcaklığın aynı anda yiyecek, su ve ulaşıma yük bindirdiğini bilerek halk sağlığını hasat kadar kaygıyla izliyor."
  news_events_world.10.t_disease_outbreak: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Tarlalarında Hastalık Yayılıyor"
  news_events_world.10.d_disease_outbreak: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] tarlaları ve sürülerinde hastalık yayılıyor. Müfettişler bulaşma bir sonraki bölgeye ulaşmadan etkilenen arazi ve hayvanları belirlemeye çalışıyor. Karantina ve itlaf daha geniş hasadı kurtarabilir, fakat hayvanları mahkûm edilen ve tarlaları kapatılan çiftçiler için derhâl yıkım demek. Yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişinin yaşadığı eyalette sonuç yalnız üreticileri değil pazardan alışveriş yapan her haneyi etkileyecek."
  news_events_world.10.t_extreme_winds: "Fırtına [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Boyunca Yıkım Bıraktı"
  news_events_world.10.d_extreme_winds: "Aşırı rüzgârlar [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] bölgesini dövdü; çatılar, ağaçlar, telgraf telleri ve ayaktaki ürünler zarar gördü. Ekipler ana güzergâhlardaki enkazı temizlerken kara ve demiryolu trafiği yavaşladı, birkaç yerleşimle iletişim tamamen kesildi. Yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişinin yaşadığı eyalette en büyük kayıp tek bir büyük felaketten değil, ulaşım ve hasadın aynı anda aksamasından doğabilir."
  news_events_world.10.t_torrential_rains: "Sağanak Yağmurlar [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Tarlalarını Boğdu"
  news_events_world.10.d_torrential_rains: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] boyunca yağmur durmaksızın yağıyor; tarlalar suya doydu, alçak yollar ve nehir kıyıları taştı. Çiftçiler köyler kuru kalsa bile durgun suyun ürünü toprakta çürüteceğinden korkuyor. Tüccarlar demiryollarını ve pazar yollarını giderek artan kaygıyla izliyor. Yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] nüfuslu bölgede hasat vaktindeki ıslak mevsim herhangi bir fırtına kadar pahalıya mal olabilir."
  news_events_world.10.t_pollinator_surge: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Meyve Bahçeleri İçin Olağanüstü Mevsim"
  news_events_world.10.d_pollinator_surge: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] çiftçileri olağanüstü arı ve diğer tozlaştırıcı bolluğu bildiriyor. Meyve bahçeleri ve çiçekli ürünler yaşayanların hatırladığı ender bir hızla meyve bağlıyor. Hava böyle sürerse bol hasat umutları yüksek. Yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişinin yaşadığı eyalette güçlü bir mevsim gıda fiyatlarını hafifletip kırsal gelirleri bu olayın başladığı çiftliklerin çok ötesinde artırabilir."
  news_events_world.10.t_optimal_sunlight: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Bölgesinde Altın Bir Mevsim"
  news_events_world.10.d_optimal_sunlight: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] alışılmadık derecede elverişli güneşli bir mevsim yaşıyor. Çiftçiler güçlü büyüme ve uzun, açık gün isteyen ürünler için mükemmel beklentiler bildiriyor. Tüccarlar daha yoğun hasat taşımacılığına hazırlanıyor, nakliyeciler ek arabalar tutmaya başladı. Yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişinin yaşadığı bölgede dolu bir hasat her pazarda ve hanede hissedilir. Üreticiler yalnızca gökyüzünün birkaç hafta daha böyle kalması gerektiğini söylüyor."
  news_events_world.10.t_moderate_rainfall: "Bereketli Yağmurlar [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Bölgesini Kutsadı"
  news_events_world.10.d_moderate_rainfall: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] bölgesine büyüme mevsiminin en uygun anında düzenli ve ölçülü yağmur geldi. Tarlalar ağır fırtınaların getirdiği boğulma olmadan su içiyor; yaşlı çiftçiler memnun olduklarını söylüyor. Yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişinin yaşadığı eyalette güçlü verim beklentisi tahıl piyasalarını şimdiden istikrara kavuşturdu. Tüccarlar bu yıl beklediklerinden daha büyük tahıl ve ürün akışı için depolarında yer açıyor."
  news_events_world.10.t_tsunami: "Büyük Dalga [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Kıyılarını Harap Etti"
  news_events_world.10.d_tsunami: "Büyük bir dalga [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] kıyısını vurdu; limanlar ve alçak yerleşimler boyunca yıkım yarattı. Kurtarma ekipleri enkazı ararken kıyıdan haberler hâlâ parça parça geliyor ve çok sayıda geminin bütün mürettebatıyla kayıp olduğu bildiriliyor. Etkilenen eyalette yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişi yaşıyor; can kaybı henüz hesaplanamıyor ve kıyı ticaretindeki aksamanın kurtarma çalışmaları bittikten çok sonra sürmesi bekleniyor."
  news_events_world.10.t_earthquake: "Deprem [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Kasabalarını Yerle Bir Etti"
  news_events_world.10.d_earthquake: "Güçlü bir deprem [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] bölgesini sarstı; binalar yıkıldı, yollar, demiryolları ve su şebekeleri koptu. Kurtarma ekipleri gece lambaları altında enkaz kazarken artçı sarsıntılar kayıp aramalarını zorlaştırıyor ve hayatta kalanları açık alanlara sürüyor. Bütün mahallelerin harabeye döndüğü bildiriliyor. Yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] nüfuslu eyalette sınırlı bir yıkım bölgesi bile ağır can kaybı ve yıllar sürecek yeniden inşa yükü yaratabilir."
  news_events_world.10.t_calm_waters: "Sakin Denizler [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Limanlarını Sevindirdi"
  news_events_world.10.d_calm_waters: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] kıyılarında olağanüstü sakin denizler bildiriliyor. Balıkçı filoları ve kıyı taşımacılığı çok az gecikmeyle çalışıyor, limanlar kaptanların hatırladığı en elverişli koşullarda yük elleçliyor. Bu durum sürerse tüccarlar deniz kayıplarının azalmasını ve sigorta oranlarının bir miktar düşmesini bekliyor. Yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişilik kalabalık bir kıyı eyaletinde denizde sakin bir mevsim, balık ve ithal malların fiyatı ile arzında doğrudan hissedilir."
  news_events_world.10.t_fog: "Yoğun Sis [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Bölgesini Kör Etti"
  news_events_world.10.d_fog: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] üzerine yoğun sis çöktü; kara yollarında, demiryollarında ve sularda görüş azaldı. Gemiler iskandil atarak limana ağır ağır ilerliyor, trenler işaret kutuları arasında en büyük dikkatle hareket ediyor. En yakın tehlike çarpışmalar ve şimdiden birkaç küçük kaza bildirildi. Yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişinin yaşadığı bölgede kalıcı sis her teslimatı geciktirip kasabaların olağan ticaretini bozacak."
  news_events_world.10.t_cyclone: "Kasırga [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Bölgesini Vurdu"
  news_events_world.10.d_cyclone: "Bir kasırga yıkıcı rüzgâr ve sağanak yağmurla [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] üzerinden geçiyor. Kıyı yerleşimleri çatıların uçtuğunu, ağaçların söküldüğünü ve haberleşmenin kesildiğini bildirirken yetkililer evlerini terk edenlere barınak sağlamaya çalışıyor. Fırtınanın yolunda yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişi var; sel ile rüzgârın birleşimi etkileri haftalar değil aylarla ölçülecek bir felaket korkusu yaratıyor ve tam boyut teller yeniden çalışana dek bilinmeyecek."
  news_events_world.10.t_ice: "Şiddetli Buz [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Bölgesini Kilitledi"
  news_events_world.10.d_ice: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] boyunca şiddetli buzlanma etkili oldu. Yollar ve demiryolları tehlikeli hâle geliyor, su yolları yavaşlıyor, yer yer tamamen duruyor; açıkta kalan ürünler ve hayvanlar soğuktan ağır zarar görüyor. Kömür tam en çok ihtiyaç duyulduğu anda güçlükle taşınıyor. Tüccarlar, yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişilik eyalette don stoklar tükenmeden çözülmezse ulaşım kesintisinin tarlalardaki doğrudan kayıp kadar pahalı olabileceği uyarısında bulunuyor."
  news_events_world.10.t_rough_waters: "Azgın Denizler [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Limanlarını Kapattı"
  news_events_world.10.d_rough_waters: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] kıyılarında sert denizler ulaşımı aksatıyor. Balıkçı tekneleri limanda kalıyor, ticaret gemileri seferlerini erteliyor ve liman makamları tehlikeli yaklaşmalar konusunda uyarılar yayınladı. Birkaç gemi gecikmiş durumda. Yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişinin yaşadığı kıyı eyaletinde denizde tekrar eden kesintiler gıda fiyatlarında, sigorta masraflarında ve kentlerin bağımlı olduğu ithal malların hareketinde hızla hissediliyor."
  news_events_world.10.t_strong_winds: "Sürekli Fırtınalar [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Bölgesini Dövüyor"
  news_events_world.10.d_strong_winds: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] üzerinde sürekli kuvvetli rüzgârlar esiyor. Açık çiftlikler ve ulaşım yolları zarar görüyor; denizcilerle liman görevlileri bütün kıyı boyunca zorlu koşullarla uğraşıyor. Fırtınalar her yerde yıkıcı değil, ancak süreleri hasat işlerine, yerel seyahate ve malların düzenli hareketine engel olmaya başladı. Yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişinin yaşadığı bölgede böyle bir aksama birkaç gün içinde pazarlarda hissedilir."
  news_events_world.10.t_tropical_storm: "Tropik Fırtına [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Üzerine Geliyor"
  news_events_world.10.d_tropical_storm: "Tropik bir fırtına [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] bölgesine girdi; yoğun yağmur, kuvvetli rüzgâr ve tehlikeli denizler getiriyor. Yetkililer alçak yerleşimleri uyarırken limanlar trafiği azaltıyor, çiftçiler ürünlerini ve hayvanlarını korumak için çalışıyor. Etkilenen eyalette yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişi yaşıyor; kasırga gücüne ulaşmayan bir fırtına bile barınma, hasat ve küçük yerleşimlerin bağımlı olduğu kıyı ticaretinde geniş çaplı aksama yaratabilir."
  news_events_world.10.t_fallback: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Bölgesinde Olağanüstü Koşullar Bildirildi"
  news_events_world.10.d_fallback: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] bölgesini olağanüstü bir hava değişimi etkiliyor. Yetkililer bunun felaket mi yoksa nimet mi sayılması gerektiğini anlamak için çiftliklerden, ulaşım dairelerinden ve yerel pazarlardan rapor topluyor; ilk bilgiler çelişkili. Etkilenen eyalette yaklaşık [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] kişi yaşadığından hasat koşullarındaki geçici bir değişim bile ilk etkilenen bölgelerin çok ötesine uzanan sonuçlar doğurabilir."
  news_events_world.10.f: "ETKİLENEN BÖLGEDEN: Çiftçiler ve yerel yetkililer mahvolan hasatlardan, bozulan ulaşımdan ve kaygılı pazarlardan söz ediyor. İlk raporlar eksik; gerçek kaybın boyutu haftalarca bilinmeyebilir."
  news_events_world.11.t: "[ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFormatting] Ülkesinde Devrim"
  news_events_world.11.d: "[ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesine karşı devrimci bir ayaklanma başladı. İsyancılar kendilerini [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetNameNoFlag] adıyla örgütledi ve eski düzenin yerine [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetGovernment.GetName] ilan ediyor. İşçi mahallelerinde barikatlar kuruldu, garnizonun bazı bölümlerinin isyancılara geçtiği bildiriliyor. Çekişme artık ajitasyon olmaktan çıkıp devletin kendisi için silahlı mücadeleye dönüştü. Komşu hükûmetler mevcut rejimin bu meydan okumadan sağ çıkıp çıkamayacağını ve bir zaferin sınır ötesinde nasıl örnek olacağını açık kaygıyla izliyor."
  news_events_world.11.f: "MUHABİRİMİZDEN: Barikatlar bildiriler basılabildiğinden daha hızlı kuruluyor. Halk, otoritenin sokaktan sokağa değiştiği ve söylentinin her resmî emirden hızlı yayıldığı mahallelerden söz ediyor."
  news_events_world.12.t: "Devrimciler [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFormatting] Ülkesinde Zafer Kazandı"
  news_events_world.12.d: "Devrimciler [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki iç savaşı kazandı ve büyük bir devletin mekanizması [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetRuler.GetFullName] yönetimindeki [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetGovernment.GetName] eline geçti. Zafer ülke sınırlarının çok ötesinde hissedilecek; dostlarını cesaretlendirirken düşmanlarını aynı ölçüde kaygılandıracak. Yabancı başkentler galipleri bildirilerine göre değil, çıkaracakları yasalara, tanıyacakları borçlara ve uyacakları antlaşmalara göre değerlendirecek. Yeni hükûmetin ilk ayları, savaşın çözemediği pek çok şeyi belirleyecek."
  news_events_world.12.f: "ANALİZ: Zafer devrimcilere bakanlıkları verir, fakat bürokrasiyi, orduyu veya halkın güvenini kendiliğinden vermez. İktidardaki ilk günleri, onları oraya getiren savaş kadar belirleyici olabilir."
  news_events_world.13.t: "[ROOT.Var('news_world_13_news_event_state_ref').GetState.GetNameNoFormatting] Satın Alımı"
  news_events_world.13.d: "[ROOT.Var('news_world_13_news_treaty_ref').GetTreaty.GetNameNoFormatting] uyarınca [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetName], [ROOT.Var('news_world_13_news_state_giver_ref').GetCountry.GetNameNoFlag] ülkesinden [ROOT.Var('news_world_13_news_state_taker_ref').GetCountry.GetNameNoFlag] ülkesine geçti. Devredilen topraklarda yaklaşık [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetPopulationSize|D] kişi yaşıyor; bu nedenle mesele yalnızca haritada küçük bir düzeltme değildir. İdare, mülkiyet, askerî erişim ve bölge halkının statüsü şimdi yeniden düzenlenmeli; komşu hükûmetler yeni sınırın kendi güvenlikleri için ne anlama geldiğini hesaplıyor. Bölge sakinlerine ise fikirleri sorulmadı."
  news_events_world.13.f: "SINIRDAN: Halk yeni bayrağın ardından hangi yasaların, vergilerin ve memurların geleceğini bekliyor. Devredilen topraklarda yaşayanlar için uzak bir başkentte atılan imza, hükûmetin derhâl değişmesi demek."
  news_events_world.14.t: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFormatting], [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFormatting] Ülkesini Rakibi İlan Etti"
  news_events_world.14.d: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFlag] ile [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFlag] resmen rakip oldu. Birinci derecede iki devlet açık rekabete girdi ve bu ilanın kıta üzerindeki saflaşmaları sertleştirmesi bekleniyor. Büyükelçiler görevlerinde kalsa da alışılmış nezaket belirgin biçimde soğudu. Bundan sonra aralarındaki her anlaşmazlık, ne kadar küçük olursa olsun, bu düşmanlığın ışığında yorumlanacak; eskiden memurlar arasında sessizce çözülebilecek meseleler dünyanın gözü önünde tartışılacak."
  news_events_world.14.f: "DIŞ HABERLER: Diplomatlar, dün sessizce çözülebilecek meseleler dâhil iki rakip arasındaki gelecekteki her anlaşmazlığın yeni düşmanlık çerçevesinde yorumlanacağını düşünüyor."
  news_events_world.15.t: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFormatting], [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetAdjectiveNoFormatting] Silahlı Kuvvetlerine Teslim Oldu"
  news_events_world.15.d: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFlag] bağımsız bir devlet olarak varlığını sona erdirdi; kalan toprakları [ROOT.Var('news_world_15_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] yoluyla dayatılan şartlar uyarınca [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag] tarafından ilhak edildi. Bir hükûmet devletler listesinden silindi, bakanlıkları dağıtıldı ve yurtdışındaki temsilcileri hizmet edecek ülkesiz kaldı. [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag] artık fethedilen toprağın ve halkının yükünü taşıyor; komşu güçler bunun çekişmeyi bitirip bitirmediğini, yoksa yalnızca bir sonrakini mi doğurduğunu düşünüyor."
  news_events_world.15.f: "ESKİ BAŞKENTTEN: Hükûmet tabelaları indiriliyor, memurlar yeni makamlara hizmet edip etmeyeceklerine karar veriyor. Bir devlet haritadan yerel bağlılıkların kaybolduğundan çok daha hızlı silinebilir."
  news_events_world.16.t: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetLastNameNoFormatting], [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFormatting] Ülkesinde İktidarı Devraldı"
  news_events_world.16.d: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetAge] yaşındaki [ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetFullName], önceki hükümdarın ölümü üzerine [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFlag] liderliğini devraldı. Ülke [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetGovernment.GetName] olarak yönetiliyor. Devlet önde gelen güçler arasında olduğundan diplomatlar yeni hükümdarın dostluklarını, inançlarını ve saltanatın savunmasız başlangıcında otoriteyi sağlamlaştırma yeteneğini şimdiden tartıyor. Saray süreklilikten söz ediyor; elçilikler o kadar emin değil ve başkentlerine gönderecekleri raporlar olağanüstü dikkatle okunacak."
  news_events_world.16.f: "SARAY MASASI: Saray mensupları kamuoyu önünde süreklilikten söz ediyor, ancak her veraset nüfuz ve erişim düzenini değiştirir. Yabancı büyükelçiler yeni hükümdara kimin en yakın durduğunu şimdiden inceliyor."
  news_events_world.17.t: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFormatting] ile [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFormatting] İttifak Kurdu"
  news_events_world.17.d: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFlag] ile [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFlag], [ROOT.Var('news_world_17_news_treaty_ref').GetTreaty.GetNameNoFormatting] içine girerek resmî bir ittifak kurdu. Şartların bir kısmı yayımlandı, fakat hiçbir parlamentoya sunulmayan ek mutabakatların bulunduğu yaygın biçimde varsayılıyor. Askerî planlamacılar ve rakip hükûmetler taahhütleri büyük dikkatle inceliyor; çünkü bu ağırlıktaki bir ittifak gelecekteki bir krizin hesaplarını değiştirebilir ve yerel bir çekişmeyi taraflardan biri yeniden düşünmeye fırsat bulamadan genel savaşa çevirebilir."
  news_events_world.17.f: "ASKERÎ ANALİZ: Bir ittifak en çok ilk kurşun atılmadan önce önemlidir. Genelkurmaylar artık bir imzacıyla savaşın ikisiyle birden savaş anlamına gelebileceğini varsayarak planlarını yeniden çizecek."
  news_events_world.18.t: "[ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFormatting] Ülkesinin Yeni Hükûmeti"
  news_events_world.18.d: "[ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFlag], devletin yapısını değiştirecek kadar büyük bir dönüşüm olan [ROOT.Var('news_world_18_news_new_law_ref').GetLaw.GetName] yasasını kabul etti. Ülke artık [ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetGovernment.GetName] olarak yönetiliyor. Yabancı başkentler yeni düzenle ilişkilerini yeniden değerlendirirken içeride dostları kutlama yapıyor, düşmanları ise uzun süredir öngördükleri sonuçlara hazırlanıyor. Hukukçular ve memurlar dönüşümün uygulamasına şimdiden girişti; bir hafta önce kalıcı görünen unvanların, bakanlıkların ve usullerin bütünüyle yeniden yazılması gerekiyor."
  news_events_world.18.f: "ANAYASA MASASI: Hukukçular ve memurlar yeni düzenin pratik sonuçları üzerinde çalışıyor. Bir zamanlar kalıcı görünen unvanlar, bakanlıklar ve eski usuller şimdi yeniden yazılmak zorunda kalabilir."
  news_events_world.19.t: "[ROOT.Var('news_world_19_news_event_state_ref').GetState.GetNameNoFormatting] Ülkesindeki Çalkantı Yerel Ekonomiyi Sarsıyor; Devlet İstikrarsızlığa Sürükleniyor"
  news_events_world.19.d: "[ROOT.Var('news_world_19_news_source_country_ref').GetCountry.GetNameNoFlag] ülkesindeki [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetName] boyunca, yaklaşık [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetPopulationSize|D] nüfuslu bölgede ağır düzensizlik bildiriliyor. Grevler, gösteriler ve hoşnutsuzluğun örgütlenmesi olağan idareyi tehdit edecek düzeye ulaştı. Dükkânlar erken kapanıyor, toplantılar ilan edilen amaçlarının çok ötesinde kalabalık çekiyor ve polis çevre ilçelerden takviye edildi. Çalkantı sürerse hükûmetin elini önemli ölçüde zayıflatabilir ve daha geniş ülke ticaretini bozabilir."
  news_events_world.19.f: "SOKAKLARDAN: Esnaf erken kapandığını, halka açık toplantıların alışılmadık büyüklükte kalabalık çektiğini söylüyor. Yetkililer düzenin sağlanabileceğini savunuyor, ancak sakinler gerilimin herhangi bir ayaklanmadan çok önce hissedildiğini belirtiyor."
  news_events_world.20.t: "[ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFormatting] Ülkesinde Durgunluk"
  news_events_world.20.d: "[ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFlag] ticaretinde keskin ve ani bir daralma yaşadı. Millî üretim bir ay içinde yaklaşık £[ROOT.Var('news_world_20_news_recession_previous_gdp_value').GetValue|D] seviyesinden £[ROOT.Var('news_world_20_news_recession_current_gdp_value').GetValue|D] seviyesine düştü; gerileme [ROOT.Var('news_world_20_news_recession_drop_value').GetValue|%1]. Sipariş defterleri inceliyor, kredi sıkılaşıyor ve sanayiciler yıllardır görmedikleri ölçüde zayıf talepten söz ediyor. İşçiler ücretleri ve işleri için kaygılı; dış piyasalar ise krizin ticaret ve yatırım üzerinden kendini güvende sanan işletmelere yayılmasını endişeyle izliyor."
  news_events_world.20.f: "PİYASALAR: Bankacılar ve sanayiciler daralmanın geçici olduğuna dair işaret arıyor. Bir analist, güvenin işten çıkarmalar ve iflaslar kötü bir ayı kalıcı durgunluğa dönüştürene kadar hızla geri gelebileceği uyarısında bulunuyor."
  news_events_world.21.t: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFormatting] GSYİH'de 1 Milyara Ulaştı"
  news_events_world.21.d: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFlag], yıllık üretimde bir milyar sterlini geçen dünyadaki ilk ülke oldu; hesap yapıldığında rakam yaklaşık £[ROOT.Var('news_world_21_news_billion_gdp_value').GetValue|D] idi. Orada toplanmış imalat, ticaret ve satın alma gücünün büyüklüğü her rakibin kendini ölçmek zorunda kalacağı yeni bir eşik oluşturuyor. İktisatçılar başarının gerçek anlamını tartışıyor ve rakam servetin kime gittiğini söylemiyor, ancak hiçbir hükûmetin artık görmezden gelemeyeceği bir sanayi ölçeğini ilan ediyor."
  news_events_world.21.f: "MALİYE MASASI: İktisatçılar başarının gerçekte ne anlama geldiğini şimdiden tartışıyor. Servetin kime gittiğini pek söylemiyor, fakat rakiplerin görmezden gelemeyeceği bir sanayi ölçeğini gösteriyor."
  news_events_world.22.t: "[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFormatting] Yeni Uluslararası Anlaşmayı İlan Etti"
  news_events_world.22.d: "[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFlag] liderliğinde yeni bir blok kuruldu: [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetIdentity.GetName] ilkesi çevresinde toplanan ve kuruluşunda [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers] üye devletten oluşan [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName]. Diğer hükûmetler tüzüğünü ve üyeliğini dikkatle inceliyor; çünkü böyle bir birlik bütün bölgelerde ticaret, ittifak ve siyasi nüfuzun yönünü değiştirebilir. Kalıcı bir araç mı yoksa anlık kolaylık için kurulmuş bir düzenleme mi olduğu, üyelerinin hiçbirinin seçmediği gerçek bir krizle sınanana kadar bilinmeyecek."
  news_events_world.22.f: "DİPLOMATİK ANALİZ: Yeni bloklar gerçek bir krizle sınanmadan önce birlik görüntüsü vermeye eğilimlidir. Dışişleri bakanlıkları kuruluş töreninden çok üyeler arasındaki ilk anlaşmazlığı izleyecek."
  news_events_world.23.t: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFormatting] Borçlarını Ödeyemedi!"
  news_events_world.23.d: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFlag] yükümlülüklerini yerine getiremedi. Temerrüt anında kamu borcu yaklaşık £[ROOT.Var('news_world_23_news_default_principal_value').GetValue|D], kredi sınırı ise £[ROOT.Var('news_world_23_news_default_credit_limit_value').GetValue|D] idi. Alacaklılar ağır zararlarla karşı karşıya ve devletin gelecekteki borçlanması mümkün olursa bile daha pahalı olacak. Yabancı bankalar ve hükûmetler krizin yayılmasını, siyasi düzensizliği ve hazinenin hükûmet otoritesinin dayandığı ordu ile idareyi artık finanse edemediğine dair işaretleri izliyor."
  news_events_world.23.f: "MALİYE MASASI: Tahvil sahipleri yalnız matematiği değil siyaseti de fiyatlıyor. Müzakere edilmiş bir çözüm güveni geri getirebilir; uzun süren temerrüt kriz geçtikten çok sonra bile her yeni krediyi pahalılaştırabilir."
  news_events_world.24.t: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFormatting] Büyük Güçler Arasındaki Yerini Aldı"
  news_events_world.24.d: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFlag], yıllık üretimi yaklaşık £[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetGDP|D] seviyesine ulaşarak devletlerin birinci sırasına yükseldi. Yükseliş büyük bir servet, silah ve nüfuz birikimini yansıtıyor ve devlete günün büyük diplomatik meselelerinde söz hakkı veriyor. Yerleşik güçler yeni geleni müttefik olarak mı kazanacaklarını yoksa rakip olarak mı karşılayacaklarını şimdiden hesaplıyor; yeni güç de tanınmanın getirdiği yükümlülüklerin ayrıcalıklar kadar ağır olabileceğini görebilir."
  news_events_world.24.f: "DIŞ HABERLER: Davetler, protokol ve diplomatik hesaplar neredeyse hemen değişecek. Yeni gelen, tanınmanın yalnız nüfuz değil, daha önce uzak görülen çekişmelerde taraf olma beklentisini de getirdiğini görebilir."
  news_events_world.25.t: "[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFormatting] Ülkesinin Gerileyişi"
  news_events_world.25.d: "[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFlag] güçlerin birinci sırasından düştü; yıllık üretimi artık yaklaşık £[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetGDP|D] olarak hesaplanıyor. Değişim yalnız törensel değil: dikkat çekme ve dünya dengesini şekillendirme kapasitesinin azaldığını gösteriyor. İçeride bakanlar kaybedilen güç ve itibarı geri kazanma baskısıyla karşı karşıya; muhalefetin kullanacağı malzeme eksik değil. Dışarıda eski ortakların bir yıl öncesine göre daha sert pazarlık etmesi beklenebilir."
  news_events_world.25.f: "ANALİZ: Statü kaybı haritada görünmeden önce konferans salonlarında hissedilecek. Eski ortaklar daha sert pazarlık ederken rakipler gerilemenin geçici mi kalıcı mı olduğunu sınayacak."
  news_events_world.26.t: "[ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFormatting] Liderliği Tartışmaya Açıldı"
  news_events_world.26.d: "[ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName] içinde hâkimiyet mücadelesi başladı; birlik [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers] üye devletten oluşuyor. [ROOT.Var('news_world_26_news_bloc_contender_ref').GetCountry.GetNameNoFlag], mevcut lider [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFlag] karşısında meydan okudu. Yetkililer olağan iş birliğinin etkilenmeden sürdüğünü savunsa da heyetler destekçilerini alışılmadık bir dikkatle sayıyor. Uzun süren bir mücadele birden fazla hükûmeti aynı anda bölebilir ve dış güçleri kargaşadan yararlanmaya davet edebilir."
  news_events_world.26.f: "BLOK İÇİNDEN: Yetkililer olağan iş birliğinin sürdüğünü söylüyor, ancak heyetler destekçilerini olağandışı dikkatle sayıyor. Ordusuz yürütülen bir liderlik mücadelesi bile müttefikleri rakip kamplara bölebilir."
  news_events_world.27.t: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFormatting] İttifakın Liderliğini Ele Geçirdi"
  news_events_world.27.d: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFlag], [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetNumMembers] üye devletli [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetName] liderliği için [ROOT.Var('news_world_27_news_bloc_loser_ref').GetCountry.GetNameNoFlag] karşısında üstün geldi. Birlik içindeki hükûmetler değişimin kendilerini birbirine daha mı sıkı bağlayacağını yoksa eski lideri destekleyenlerde direniş mi yaratacağını tartıyor. Mücadele bitti, fakat açığa çıkardığı sadakatler bu kadar kolay kapanmaz; yeni lider açıkça başka sonucu tercih eden ortakları da devralıyor."
  news_events_world.27.f: "DİPLOMASİ MASASI: Mücadele bitti, ama sadakat meselesi bitmemiş olabilir. Yeni lider, yenileni tercih eden hükûmetlerin de bulunduğu bir örgütü devralıyor."
  news_events_world.28.t: "[ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFormatting] ile [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFormatting] Yollarını Ayırdı"
  news_events_world.28.d: "[ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFlag] ile [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFlag] ülkesini bağlayan [ROOT.Var('news_world_28_news_treaty_ref').GetTreaty.GetNameNoFormatting] feshedildi. Kopuş önemli bir taahhüdü ortadan kaldırıyor ve iki hükûmeti askerî planlarını ve gelecekteki krizlerdeki konumlarını yeniden düşünmeye zorluyor. Her başkent kimseyi ikna etmeyen pişmanlık ifadeleri yayımladı. Rakipleri boşluğun sağlayacağı fırsatları şimdiden inceliyor; artık soru eski ortakların güvenliği nerede arayacağı ve kaybedilen ilişkinin yerini kimin doldurmaya hazır olduğudur."
  news_events_world.28.f: "DIŞ HABERLER: Diplomatlar kopuşun resmî iptalden daha önemli olduğunu söylüyor. Şimdi mesele iki eski ortağın güvenliği nerede arayacağı ve ilişkinin yerini kimin dolduracağı."
  news_events_world.29.t: "PANİK! Dünya Çapında [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] Kıtlığı!"
  news_events_world.29.d: "Dünya piyasasında ağır bir [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] kıtlığı baş gösterdi ve fiyatlar ticaret çevrelerinin olağan saydığı seviyelerin çok üzerine çıktı. Piyasa talebi yaklaşık [ROOT.Var('news_world_29_news_shortage_imports_value').GetValue|D] iken satışa yalnızca [ROOT.Var('news_world_29_news_shortage_exports_value').GetValue|D] sunuldu; bu, bire [ROOT.Var('news_world_29_news_shortage_pressure_value').GetValue|2] oranında bir baskı demek. Sanayiciler, tüccarlar ve hükûmetler kalan stokları güvence altına almak için yarışıyor; yükselen maliyet, bu mala bağımlı her sanayiye yayılıyor."
  news_events_world.29.f: "PİYASALAR: Alıcılar sözleşmelerin saat başı yeniden yazıldığını bildiriyor. Bir komisyoncu [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] yarışını, paranın artık arzı garanti etmediği bir piyasa olarak tanımladı."
  news_events_world.30.t: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] ile [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] Haritayı Yeniden Çizdi"
  news_events_world.30.d_exchange: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] ile [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] toprak değişimi üzerinde anlaştı. Yaklaşık [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D] kişinin yaşadığı [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting], [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] ülkesinden [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] ülkesine geçerken yaklaşık [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D] nüfuslu [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting] ters yönde devrediliyor. Sınırlar savaşla değil anlaşmayla yeniden çizildi ve iki eyaletin halkı kendilerini başka bir hükûmetin tebaası olarak buluyor."
  news_events_world.30.d_a_to_b: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting], [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting] bölgesini [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] ülkesine devretmeyi kabul etti. Bölgede yaklaşık [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D] kişi yaşıyor ve kendilerine bu konuda danışılmadı. İdare, vergilendirme ve güvenlik artık yeni egemen altında yeniden düzenlenmeli; mülkiyet, dil ve yerel makam meseleleri hukukçuları yıllarca meşgul edecek. Komşu hükûmetler silahla değil müzakereyle gerçekleşen bu sınır değişikliğini inceliyor ve kendi sonuçlarını çıkarıyor."
  news_events_world.30.d_b_to_a: "[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting], [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting] bölgesini [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] ülkesine devretmeyi kabul etti. Bölgede yaklaşık [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D] kişi yaşıyor ve kendilerine bu konuda danışılmadı. İdare, vergilendirme ve güvenlik artık yeni egemen altında yeniden düzenlenmeli; mülkiyet, dil ve yerel makam meseleleri hukukçuları yıllarca meşgul edecek. Komşu hükûmetler silahla değil müzakereyle gerçekleşen bu sınır değişikliğini inceliyor ve kendi sonuçlarını çıkarıyor."
  news_events_world.30.f: "SINIRDAN: Haritacılar çizgiyi birkaç günde değiştirebilir, fakat halk sonuçlarıyla yıllarca yaşayacak. Tüccarlar, toprak sahipleri ve yerel memurlar hangi kuralların devirden sonra yürürlükte kalacağını şimdiden soruyor."
  news_events_world.31.t: "GREV! [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] İşçileri Birleşiyor!"
  news_events_world.31.d_nationwide: "Bir grev dalgası [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] ülkesini baştan sona sarıyor. Örgütlü emek hem işverenlere hem bakanlara taleplerini dayatırken fabrikalarda ve kamu işlerinde çalışma durdu. Grev artık bütün ülke üretimini etkileyecek büyüklükte ve bütün parti gazeteleri yalnızca ciddiyeti konusunda hemfikir. Çatışma sürerse radikalizmi besleyip hükûmeti taviz ile baskı arasında seçim yapmaya zorlayacağı korkusu var; iki yolun da bedeli olacak."
  news_events_world.31.d_mining: "[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] ülkesinde büyük bir madenci grevi başladı ve [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] kesintinin merkezinde. İşçiler büyük öfkeyle ocakları terk etti; talebin en yüksek olduğu mevsimde sanayiye kömür ve metal akışı tehdit altında. İşverenler ve bakanlar kıtlık ocak başından fabrikalara ve demiryollarına yayılmadan çözüm bulmaya zorlanıyor. Maden bölgelerinde işçilerin kendi komitelerinin düzeni sağladığı bildiriliyor; yetkililer bunu düzensizliğin kendisi kadar kaygı verici buluyor."
  news_events_world.31.d_industrial: "[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] ülkesinde fabrika işçileri işi bıraktı; [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] grevin başlıca merkezleri arasında. İşçiler ücret ve çalışma saatleri taleplerini öne sürerken üretim kesintiye uğradı. İşverenler kaçırılan siparişlerden, duran tesislerden ve yurtdışına gidip geri dönmeyecek sözleşmelerden söz ediyor; sendikacılar ise grevin uzun süredir söyledikleri şeyi kanıtladığını savunuyor: ülke, nasıl yönetildiği konusunda en az söz sahibi olanların emeğiyle dönüyor."
  news_events_world.31.d_railway: "[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] ülkesinde demiryolu işçileri greve çıktı; kesinti [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] çevresinde yoğunlaşıyor. Uzun bir duruş yalnız hatları değil çok daha fazlasını tehdit ediyor: fabrikalar yakıt ve hammadde, kentler yiyecek, ordu ise hareket için trenlere bağımlı. Bozulabilir mallar istasyon kenarlarında şimdiden çürüyor. Bakanlar felç yayılmadan hizmeti yeniden başlatmaya ya da uzlaşmaya zorlanıyor; bazı çevrelerde demiryollarını bütünüyle başka yöntemlerle işletmekten açıkça söz ediliyor."
  news_events_world.31.d_movement: "[ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] işçileri [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] ülkesinde açıkça siyasi nitelikli bir grev başlattı. Bu duruş tek bir işyeri şikâyetinden çok daha geniş bir harekete bağlı ve fabrika zeminindeki çekişmeleri doğrudan ulusal siyasete taşıyor. İşverenler örneğin diğer kentlere yayılmasından korkuyor; örgütleyiciler ise görünür kesintinin hükûmeti kendileriyle yalnızca polislik edilecek bir huzursuzluk olarak değil siyasi güç olarak görüşmeye zorlamasını umuyor."
  news_events_world.31.d: "[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] ülkesinde büyük bir grev başladı ve bütün ülkenin dikkatini ücretlere, çalışma saatlerine ve işçinin koşullarına çekti. Kesinti bakanları ve sanayicileri kaygılandıracak kadar ciddi; uzun bir duruşun üretimi düşürüp başka yerlerde örnek olmasından korkuyorlar. Birçok kentte grevci aileleri için bağış toplanıyor. Hükûmetin tepkisi, anlaşmazlığın müzakereyle mi, baskıyla mı yoksa hiçbir tarafın amaçlamadığı daha geniş bir huzursuzluk dalgasıyla mı biteceğini belirleyebilir."
  news_events_world.31.f: "GREV HATTINDAN: Örgütleyiciler gerçek tavizler verilene kadar duruşun süreceğini söylüyor; işverenler ise her boş vardiyanın maliyeti artırdığını ve başka yerlerdeki işçileri katılmaya cesaretlendirdiğini belirtiyor."

