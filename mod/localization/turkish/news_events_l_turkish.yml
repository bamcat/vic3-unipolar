l_turkish:

 news.1.t:0 "Dikkate Değer Bir Olay"
 news.1.d:0 "Bir deneme kupürü. Bu pencere bir gazete gibi görünüyorsa, üstte ülkenizin gazete başlığı, kâğıt üzerine dizilmiş haber ve pencerenin çevresinde koyu çerçeve ya da başlık çubuğu YOKSA, pencere türü çalışıyor demektir. Ayrıca hâlâ sürüklenebilir olmalıdır."
 news.1.f:0 "Muhabirlerimiz hazır bekliyor."
 news.1.a:0 "Manşetlik haber!"

 news.2.t:0 "RUSYA’DA DEVRİM"
 news.2.d:0 "[ROOT.Var('news_test_2_news_attacker_ref').GetCountry.GetNameNoFlag], [ROOT.Var('news_test_2_news_defender_ref').GetCountry.GetNameNoFlag] devletine resmen savaş ilan etti. Sınır boyunca birlikler seferber edilirken büyük güçlerin dışişleri makamları gelişmeleri ciddi bir kaygıyla izliyor. Diplomatlar geri çağrıldı ve borsalar kargaşaya sürüklendi. Muhabirlerimiz savaş alanına doğru yola çıktı; akşam postasıyla yeni ayrıntılar bekleniyor. Diplomatlar geri çağrıldı ve borsalar kargaşaya sürüklendi. Muhabirlerimiz savaş alanına doğru yola çıktı; akşam postasıyla yeni ayrıntılar bekleniyor. Diplomatlar geri çağrıldı ve borsalar kargaşaya sürüklendi. Muhabirlerimiz savaş alanına doğru yola çıktı; akşam postasıyla yeni ayrıntılar bekleniyor."
 news.2.f:0 "Diplomasinin sustuğu yerde toplar konuşur."
 news.2.a:0 "Gerçekten vahim haberler."
