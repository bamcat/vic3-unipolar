l_turkish:
 smd_amendment_rural_levies:0 "Kırsal Harçlar"
 smd_amendment_rural_levies_desc:0 "Tarım vergisine ek olarak kasaba ve köy yönetimleri, yerel okulları, yolları ve memurları finanse etmek için köylü hanelerinden harç, tahıl kotası ve angarya toplar. Yük en çok en yoksul çiftçilerin omzuna biner."
 smd_amendment_rural_levies_modifier:0 "Kırsal Harçlar"
 smd_amendment_rural_levies_modifier_desc:0 "Kasaba harçları ve angarya kırsaldan para toplar, ancak köylülerin hoşnutluğunu azaltır."
