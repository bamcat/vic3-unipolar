 smd_agitators.1.t:0 "Tupac Shakur Öldü"
 smd_agitators.1.d:0 "7 Eylül 1996 gecesi [SCOPE.sCharacter('smd_tupac_scope').GetFullName], Las Vegas'ta kırmızı ışıkta beklerken içinde bulunduğu arabada dört kurşunla vuruldu. 13 Eylül'de 25 yaşında aldığı yaralar nedeniyle hayatını kaybetti. Saldırgan kaçtı ve kimse suçlanmadı. Ülke genelinde hayranları onun için yas tutmak üzere bir araya geliyor."
 smd_agitators.1.f:0 "Dördüncü albümü All Eyez on Me o yılın başlarında yayımlanmıştı."
 smd_agitators.1.a:0 "Susturulan bir ses"
