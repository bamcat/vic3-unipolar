l_turkish:
 GDP_TOOLTIP:0 "#header [Country.GetAdjective] [Concept('concept_gdp', 'GSYİH')]'si#!\n@money![Country.MakeScope.ScriptValue('cwp_gdp')|Dv] (#u #tooltippable #tooltip:[Country.GetTooltipTag],COUNTRY_GDP_OWNERSHIP_TOOLTIP [Country.GetDomesticallyOwnedGDPFraction|%1b]#!#!#!) ülke içi sahip olunan $concept_gdp_short$ ([Country.GetGDPRanking])\n@money![Country.MakeScope.ScriptValue('cwp_gdp_per_capita')|2*v] [Concept('concept_gdp_per_capita', '$concept_gdp_per_capita_short$')] ([Country.GetGDPPerCapitaRanking])"
 COUNTRY_GDP_OWNERSHIP_TOOLTIP:0 "#header [Country.GetName] ülkesindeki [concept_gdp_ownership]#!\n#u [Country.GetDomesticallyOwnedGDPFraction|%1b]#! (@money![Country.GetGDP|Dv]) ülke içi sahip olunan $concept_gdp_short$\n$TOOLTIP_DELIMITER$\n[SelectLocalization(IsZero_CFixedPoint(Country.GetForeignOwnedGDPFraction), 'NO_FOREIGNLY_OWNED_PERCENTAGE', 'COUNTRY_FOREIGNLY_OWNED_PERCENTAGE')]\n\n[SelectLocalization(IsZero_CFixedPoint(Country.GetGDPOwnedInForeignCountries), 'NO_OWNED_FOREIGN_GDP_BY_COUNTRY', 'OWNED_FOREIGN_GDP_BY_COUNTRY')]"

 COUNTRY_ALL_GDP:0 "@money!#v [Country.GetGDPWithOwnershipsInForeignCountries|D]#!"
 DOMESTIC_COUNTRY_GDP:0 "@money!#v [Country.GetGDP|D]#!"
 FOREIGN_COUNTRY_GDP:0 "@money!#u [Country.GetGDPOwnedInForeignCountries|Db]#!"
 COUNTRY_ALL_OWNERSHIP:0 "#u [Country.GetDomesticallyOwnedGDPFraction|%1b]#![ConcatIfNeitherEmpty(' + ', AddLocalizationIf(NotZero_CFixedPoint(Country.GetGDPOwnedInForeignCountries), 'FOREIGN_COUNTRY_GDP'))]"

 COUNTRY_POPULATION:0 "#title [Concept('concept_pop','$concept_population$')]#!:\n#variable [Country.MakeScope.ScriptValue('smd_population')|Dv]#!"
 COUNTRY_GDP:0 "#title $GDP_SHORT$#!:\n#variable @money![Country.MakeScope.ScriptValue('cwp_gdp')|Dv]#!"

 ERROR_DEER_TOOLTIP:0 "#header Eyvah!#!\nHata Günlüğü'nü açmak için #instruction sol tıkla#!\nKapatmak için #instruction sağ tıkla#!"
 ERROR_MANUL_TOOLTIP:0 "#header Kılavuzu oku!#!\nHata Günlüğü'nü açmak için #instruction sol tıkla#!\nKapatmak için #instruction sağ tıkla#! (ta ki tekrar bozana kadar)"

 OH_DEER:0 "\"#italic Eyvah,#! #bold [ErrorDeer.NumberOrErrors|v]#! #italic hata oluştu!#!\""
 ERROR_MANUL:0 "#bold [ErrorDeer.NumberOrErrors|v]#! #italic hatamız mı varmış? #!#italic Dur bir kılavuza bakayım!#!"
 ERROR_DEER_SLOW_TICK_OPERATIONS:0 "#header Yavaş Zaman Referansı Operasyonları#!"

 EXPENSES_GOVERNMENT_BUILDING_GOODS:0 "$TAB$#tooltippable #tooltip:[GetPlayer.GetTooltipTag],GOVERNMENT_BUILDINGS_EXPENSES_BREAKDOWN,GovernmentGoodsExpenseTooltip #N @money!-[GetPlayer.GetGovernmentGoodsExpenses|D-]#!#!#! [concept_budget_goods_for_government_buildings]\n$TAB$#tooltippable;tooltip:SMD_HEALTHCARE_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_healthcare_expense_value')|D-]#!#!#! [concept_smd_healthcare]\n$TAB$#tooltippable;tooltip:SMD_EDUCATION_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_education_expense_value')|D-]#!#!#! [concept_smd_education]\n$TAB$#tooltippable;tooltip:SMD_POLICE_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_police_expense_value')|D-]#!#!#! [concept_smd_police]"

 LITERACY_UNINCORPORATED_TOOLTIP:0 "\n$TOOLTIP_DELIMITER$\n[Concept('concept_unincorporated_state', '$concept_unincorporated_states$')] hesaba katıldığında #variable [Country.GetName]#! topraklarındaki toplam #variable [Country.GetTotalPopulation|*]#! nüfustan #variable [Country.GetNumTotalLiteratePops|*]#! kişi okuryazar, yani [Concept('concept_pop', 'Toplumlardaki')] Okuryazarlık Oranı ([Country.GetTotalLiteracyRate|%v]) ([Country.GetTotalLiteracyRanking])"

 POP_TOOLTIP:0 "#tooltip_header [Concept('concept_pop','$concept_population$')]#!\nMevcut: [Country.MakeScope.ScriptValue('smd_population')|Dv] ([Country.GetPopulationRanking])\n[Country.GetPopGrowthDesc]$POP_TOOLTIP_DELAYED$"

 SMD_HEALTHCARE_EXPENSE_TOOLTIP:0 "#header [concept_smd_healthcare] Giderleri#!\nDevlet sağlık sisteminin işletme maliyeti. Esas olarak işlettiğiniz $building_government_administration$ seviyesi sayısına ([concept_bureaucracy]) bağlıdır; ayrıca [concept_institution] yatırım seviyesi, nüfusunuz ($peasants$ hariç) ve ortalama [concept_sol] de etkilidir.\nMevcut aylık maliyet: @money!-[GetPlayer.MakeScope.ScriptValue('smd_healthcare_expense_value')|D-]#!"

