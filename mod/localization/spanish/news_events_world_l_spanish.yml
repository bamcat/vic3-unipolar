l_spanish:
  news_events_world.1.t: "¡[ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFormatting] y [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFormatting] al borde de la guerra!"
  news_events_world.1.d: "La [ROOT.Var('news_world_1_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] ha situado a [ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFlag] y [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFlag] en abierta confrontación. Dos de las principales potencias de la época se enfrentan ahora por una disputa formal, y las cancillerías de Europa viven una actividad que no se veía desde hace años. Los correos viajan entre las capitales a todas horas, las bolsas se han vuelto inestables y los círculos militares apenas hablan de otra cosa. Que la disputa se resuelva mediante negociación o se endurezca hasta convertirse en guerra dependerá de las exigencias de las próximas semanas, del movimiento de tropas hacia la frontera y de qué gobiernos decidan apoyar a cada bando cuando llegue el momento decisivo."
  news_events_world.1.f: "MESA DIPLOMÁTICA: Se dice que los enviados de ambos bandos trabajan hasta pasada la medianoche. Un observador extranjero describió el ambiente como cortés en público e inequívocamente hostil en privado."
  news_events_world.2.t: "¡CRISIS! Entre [ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFormatting] y [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.2.d: "[ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFlag] ha arrojado todo su peso a la [ROOT.Var('news_world_2_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] contra [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFlag]. Una potencia de primer orden ha decidido intervenir en una disputa que de otro modo podría haber permanecido regional, alterando por completo el carácter de la crisis. Lo que era una querella entre vecinos se ha convertido en asunto de todo el concierto de naciones. Los ministerios de exteriores estudian con máxima atención las demandas declaradas y los nuevos compromisos, mientras los gobiernos menores de la región calculan discretamente a qué bando pueden permitirse menos ofender."
  news_events_world.2.f: "ANÁLISIS: Lo que comenzó como una disputa regional exige ahora la atención de todas las grandes cancillerías; los gobiernos pequeños deciden en silencio a qué lado pueden permitirse irritar."
  news_events_world.3.t: "¡GUERRA! ¡Entre [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFormatting] y [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFormatting]!"
  news_events_world.3.d: "La [ROOT.Var('news_world_3_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] ha dejado atrás la diplomacia para convertirse en guerra abierta entre [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFlag] y [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFlag]. Los embajadores han sido llamados a casa, los reservistas convocados a sus depósitos y las bolsas sumidas en el desorden. Las oficinas de reclutamiento registran multitudes desde el amanecer y las compañías ferroviarias han puesto su material rodante a disposición de los ministerios de guerra. Los comerciantes ya preguntan qué puertos y rutas seguirán abiertos y a qué precio podrán asegurarse, mientras los gobiernos del continente sopesan qué obligaciones les imponen ahora sus tratados."
  news_events_world.3.f: "DESDE EL FRENTE: Los horarios ferroviarios ceden ante los convoyes militares mientras reservistas, municiones y caballos se dirigen a la lucha. Los comerciantes ya preguntan qué puertos y rutas seguirán siendo seguros."
  news_events_world.4.t: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFormatting] invade [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.4.d: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFlag] ha salido a campaña contra [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFlag] en la [ROOT.Var('news_world_4_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]. La disparidad entre los dos beligerantes es evidente, y en las capitales ya hay quienes hablan de una conclusión rápida y barata. Otros piden cautela. Nuestros corresponsales militares recuerdan cuántas veces la distancia, el terreno difícil, la enfermedad y la discreta intervención de terceros han humillado a una fuerza que parecía abrumadora sobre el papel, y qué pocas campañas iniciadas con pronósticos confiados han terminado dentro de la estación prometida por sus autores."
  news_events_world.4.f: "MESA MILITAR: El desequilibrio sobre el papel puede ser enorme, pero nuestros corresponsales advierten que distancia, terreno e intervención extranjera han arruinado muchas campañas supuestamente fáciles."
  news_events_world.5.t: "Golpe de Estado en [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.5.d: "El orden político de [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFlag] ha sido derribado por la fuerza. La autoridad recae ahora en [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetRuler.GetFullName], y el Estado será gobernado como [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetGovernment.GetName]. Los ministerios, las oficinas telegráficas y las principales estaciones ferroviarias fueron asegurados antes del amanecer. Si el ejército obedecerá a los nuevos amos en las provincias con la misma facilidad que en la capital, si se respetarán las leyes y tratados existentes y si los partidos desplazados se someterán o se alzarán son preguntas que nadie puede contestar todavía con confianza."
  news_events_world.5.f: "EXCLUSIVA DESDE LA CAPITAL: Los vecinos informan de soldados apostados en ministerios, estaciones y oficinas telegráficas. Al amanecer habían cambiado los uniformes, nos dijo un empleado, pero nadie sabía de quién recibían órdenes."
  news_events_world.6.t: "[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] de [ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFormatting], asesinado"
  news_events_world.6.d: "[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_6_character_ref').GetCharacter.GetFullName], de [ROOT.Var('news_world_6_character_ref').GetCharacter.GetAge] años, ha caído víctima de un asesino mientras gobernaba [ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFlag]. El asesinato de un jefe de Estado ha provocado una conmoción inmediata: los ministros se apresuran a asegurar la capital, la guarnición y el tesoro, y a conservar al menos la apariencia de continuidad. Los gobiernos extranjeros buscan garantías de que tratados y mandos militares siguen intactos. La búsqueda de la conspiración apenas comienza, y todas las facciones tienen interés en dónde recaiga la culpa."
  news_events_world.6.f: "MESA DE SEGURIDAD: Los investigadores buscan cómplices mientras los ministros corren a demostrar que el Estado sigue bajo control. La pregunta es si el asesino actuó solo o en nombre de una facción preparada para moverse después."
  news_events_world.7.t: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullNameNoFormatting] ha muerto; [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFormatting] está de luto"
  news_events_world.7.d: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullName] ha muerto a los [ROOT.Var('news_world_7_character_ref').GetCharacter.GetAge] años mientras gobernaba [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFlag]. Paños negros cubren los edificios públicos y las tiendas de la capital han cerrado sus postigos. La sucesión pasa ahora al mecanismo que dispongan la costumbre y la ley, y los ministros hablan al unísono de continuidad. Sin embargo, toda cancillería extranjera se pregunta en privado si el cambio alterará las alianzas, la política o el equilibrio entre las facciones que durante tanto tiempo rodearon el poder."
  news_events_world.7.f: "DESDE LA CAPITAL: Las multitudes se reúnen en busca de noticias sobre la sucesión mientras se cubren de negro los edificios públicos. Detrás de las ceremonias, los ministros ya compiten por definir qué significará el nuevo reinado."
  news_events_world.8.t: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetLastNameNoFormatting] derrocado en [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.8.d: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetFullName] ha sido apartado del poder en [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFlag] aún con vida, y [ROOT.Var('news_world_8_new_ruler_ref').GetCharacter.GetFullName] ha tomado las riendas del Estado. El país será gobernado como [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetGovernment.GetName]. Un gobernante vivo depuesto sin elección, muerte ni sucesión ordinaria rara vez admite una explicación sencilla, y la versión oficial ha convencido a pocos. Los diplomáticos vigilan los nombramientos ministeriales y los movimientos de la guarnición en busca de indicios sobre lo ocurrido a puerta cerrada y sobre si el nuevo gobierno descansa en el consentimiento o en la bayoneta."
  news_events_world.8.f: "ANÁLISIS POLÍTICO: La destitución de un gobernante vivo sin elecciones, muerte ni sucesión ordinaria rara vez deja una explicación sencilla."
  news_events_world.9.t_presidential: "[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting] gana las elecciones presidenciales [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting]"
  news_events_world.9.d_presidential: "El [ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting] ha ganado las elecciones en [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], y [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName] asume la presidencia. Los candidatos del partido obtuvieron [ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetCurrentVotingPowerShare|%1] de los votos emitidos. El resultado ha sido recibido con celebraciones en unos lugares y abierta consternación en otros, mientras los intereses derrotados ya impugnan la votación en varios distritos. Los gobiernos extranjeros estudian qué puede presagiar el resultado para la diplomacia, el comercio, la política militar y el rumbo general de una de las principales potencias de la época."
  news_events_world.9.t_party: "[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting] triunfa en las elecciones [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting]"
  news_events_world.9.d_party: "El [ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting] ha salido como fuerza principal al final de la campaña en [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], con [ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetCurrentVotingPowerShare|%1] de los votos. En las grandes ciudades, los comités siguieron contando pasada la medianoche y en más de un distrito se disputa el resultado. Gobiernos, inversores y movimientos políticos extranjeros sopesan ahora lo que el nuevo equilibrio de partidos significará para la política interior y exterior y si el ministerio resultante podrá sostener una mayoría efectiva."
  news_events_world.9.t_government: "[ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting] dirigirá el gobierno de [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.9.d_government: "El [ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting] queda como principal partido del gobierno de [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag] tras las elecciones, con [ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetCurrentVotingPowerShare|%1] de los sufragios. Allí donde la Corona permanece por encima de la contienda, unas elecciones pueden transformar el equilibrio político sin alterar en absoluto al jefe de Estado. Los gobiernos extranjeros y los hombres de negocios observan de cerca el nuevo gabinete, pues su composición ha resultado a menudo un indicador más fiable de las intenciones de un país que cualquier discurso del trono."
  news_events_world.9.t: "Concluyen las elecciones en [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.9.d: "Han concluido unas elecciones en [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], país cuyo peso mundial convierte el resultado en un acontecimiento internacional y no en una simple contienda doméstica. Los resultados fueron telegrafiados a todas las capitales de Europa pocas horas después de proclamarse. Gobiernos y movimientos políticos extranjeros estudian el equilibrio de partidos y la posición de [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName], cuyo gobierno aún puede influir en la diplomacia, el comercio, las flotas, los ejércitos y el temperamento general de la época. En casa comienza ahora en serio la formación de gobierno."
  news_events_world.9.f: "MESA ELECTORAL: Las sedes de los partidos celebran, impugnan y recuentan a partes iguales. En el extranjero, el resultado se leerá como una pista del próximo rumbo diplomático y comercial del país."
  news_events_world.10.t_drought: "La sequía atenaza [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_drought: "Las lluvias han faltado en [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], donde unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas dependen de la cosecha. Los campos están resecos, los embalses bajan cada semana y los agricultores reducen la siembra ante lo peor. Los ganaderos llevan cada día más lejos a sus animales en busca de agua y los comerciantes de cereal ya elevan sus precios a futuro. Si la sequía persiste durante la temporada, un mal año puede convertirse en algo mucho peor."
  news_events_world.10.t_flood: "Gran inundación en [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]; se temen numerosas víctimas"
  news_events_world.10.d_flood: "Los ríos se han desbordado por [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], anegando granjas, caminos y poblaciones enteras en una región de unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas. Se inspeccionan puentes y terraplenes ferroviarios mientras los equipos de rescate luchan por alcanzar comunidades aisladas. Las pérdidas de ganado son graves y muchas reservas familiares han quedado destruidas. Los mercados sentirán los daños mucho después de que retrocedan las aguas."
  news_events_world.10.t_frost: "Una helada amarga arruina [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_frost: "Una helada excepcional ha caído sobre [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Los agricultores informan de campos ennegrecidos y huertos arruinados, pues el frío alcanzó cultivos ya avanzados. En una región de unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas, perder una sola cosecha no es asunto menor. Los comerciantes esperan escasez y los campesinos aguardan saber si una siembra tardía podrá recuperar parte de lo perdido."
  news_events_world.10.t_wildfire: "Incendios forestales en [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] provocan evacuaciones"
  news_events_world.10.d_wildfire: "El fuego avanza por [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], expulsando familias de sus hogares y amenazando granjas, bosques y caminos. El humo oscurece distritos enteros y el sol aparece rojo al mediodía. Las autoridades organizan cortafuegos y en varios lugares se ha llamado a la milicia. Para las cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas del estado, las pérdidas seguirán pesando mucho después de extinguirse las llamas."
  news_events_world.10.t_hailstorm: "El granizo arruina la cosecha en [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_hailstorm: "Una violenta granizada ha barrido [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], destrozando el cereal en pie y rompiendo tejados, cristales y ganado expuesto. Campos que estaban a punto de cosecharse han quedado abatidos en pocas horas. En un estado de unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas, incluso una destrucción localizada se refleja rápidamente en el precio del pan y los ingresos rurales."
  news_events_world.10.t_locust_swarm: "Las langostas descienden sobre [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_locust_swarm: "Enormes nubes de langostas han caído sobre [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], despojando los campos más rápido de lo que las comunidades pueden defenderlos. Los graneros se vigilan día y noche mientras los agricultores queman, golpean y ahúman a los insectos. Con unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas en los distritos afectados, las autoridades temen que el hambre siga de cerca a la plaga."
  news_events_world.10.t_heatwave: "Un calor castigador se instala sobre [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_heatwave: "Un calor castigador domina [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Los pozos bajan, el ganado muere y trabajar al aire libre resulta peligroso durante las horas más calurosas. Los médicos advierten a los habitantes de las ciudades y los agricultores temen por los cultivos. En un estado de unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas, una ola prolongada puede convertirse en crisis agrícola y sanitaria."
  news_events_world.10.t_disease_outbreak: "Enfermedad agrícola en [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_disease_outbreak: "Una enfermedad se extiende por cultivos y ganado de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Los agricultores arrancan las plantas afectadas y aíslan a los animales enfermos, pero las pérdidas aumentan. En una región de unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas, una epidemia agrícola persistente amenaza los precios de los alimentos y los ingresos rurales mucho más allá de las explotaciones directamente afectadas."
  news_events_world.10.t_extreme_winds: "Vientos extremos azotan [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_extreme_winds: "Vientos de violencia excepcional barren [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], arrancando tejados, derribando árboles e interrumpiendo carreteras y comunicaciones. Las autoridades evalúan los daños en una región de unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas. Cultivos, transportes y edificios rurales podrían sufrir pérdidas considerables antes de que vuelva la calma."
  news_events_world.10.t_torrential_rains: "Lluvias torrenciales sobre [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_torrential_rains: "Lluvias torrenciales caen sobre [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Los campos están empapados, los caminos se vuelven impracticables y los ríos suben con rapidez. Con unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas en la región, las autoridades temen deslizamientos, pérdidas de cosecha y una larga interrupción de los transportes si continúa el temporal."
  news_events_world.10.t_pollinator_surge: "Abundan los polinizadores en [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_pollinator_surge: "Se informa de una abundancia extraordinaria de abejas y otros polinizadores en [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Los agricultores lo consideran un buen augurio para huertos y cosechas. En una región de unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas, una mejor polinización podría aumentar notablemente la producción si el resto de la estación se mantiene favorable."
  news_events_world.10.t_optimal_sunlight: "Sol ideal favorece a [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_optimal_sunlight: "Los agricultores de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], disfrutan de una luz solar casi ideal. Los cultivos maduran de manera uniforme y mejoran las perspectivas de cosecha. Para unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas, una temporada favorable podría traer abundancia, precios más estables y un alivio muy necesario en el campo."
  news_events_world.10.t_moderate_rainfall: "Lluvias moderadas bendicen [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_moderate_rainfall: "Lluvias regulares y moderadas han caído sobre [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], humedeciendo el suelo sin causar inundaciones. Los agricultores se muestran optimistas. En un estado de unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas, buenas condiciones agrícolas prometen mejor abastecimiento de alimentos y un comercio rural más próspero."
  news_events_world.10.t_tsunami: "Un tsunami golpea [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_tsunami: "Una enorme ola ha golpeado la costa de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], arrasando muelles, viviendas y pueblos costeros. Los supervivientes buscan familiares entre los escombros y los equipos de rescate luchan por llegar a zonas aisladas. En un estado de unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas, el coste humano puede ser enorme y la reconstrucción durar años."
  news_events_world.10.t_earthquake: "Terremoto en [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_earthquake: "Un fuerte terremoto ha golpeado [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], derribando edificios, puentes y chimeneas. Los equipos de rescate excavan entre los escombros a la luz de lámparas mientras las réplicas dificultan la búsqueda. En un estado de unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas, incluso una zona limitada de destrucción puede causar muchas muertes y años de reconstrucción."
  news_events_world.10.t_calm_waters: "Mares tranquilos favorecen los puertos de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_calm_waters: "Se registran aguas excepcionalmente tranquilas frente a la costa de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Las flotas pesqueras y el cabotaje trabajan con pocos retrasos y los puertos manejan las cargas en excelentes condiciones. Para unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas, una temporada serena en el mar se nota directamente en el precio y suministro de pescado e importaciones."
  news_events_world.10.t_fog: "Una niebla densa ciega [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_fog: "Una niebla espesa se ha asentado sobre [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], reduciendo la visibilidad en carreteras, ferrocarriles y aguas. Los barcos avanzan lentamente hacia puerto y los trenes circulan con extrema cautela. En una región de unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas, una niebla persistente retrasará cada entrega y trastornará el comercio ordinario."
  news_events_world.10.t_cyclone: "Ciclón golpea [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_cyclone: "Un ciclón cruza [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], con vientos destructivos y lluvias torrenciales. Las comunidades costeras informan de tejados arrancados, árboles desarraigados y comunicaciones cortadas. Con unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas en la trayectoria, la combinación de viento e inundaciones puede causar una catástrofe cuyos efectos duren meses."
  news_events_world.10.t_ice: "El hielo paraliza [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_ice: "Un hielo severo se ha apoderado de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Carreteras y ferrocarriles se vuelven peligrosos, las vías fluviales se ralentizan o se detienen y cultivos y ganado sufren el frío. En un estado de unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas, la interrupción del transporte puede costar tanto como las pérdidas directas en el campo."
  news_events_world.10.t_rough_waters: "Mares embravecidos cierran los puertos de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_rough_waters: "El mar embravecido altera la costa de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Los pesqueros permanecen en puerto, los mercantes retrasan su salida y varios buques están atrasados. Para un estado costero de unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas, las interrupciones repetidas se sienten pronto en el precio de los alimentos, los seguros y las importaciones."
  news_events_world.10.t_strong_winds: "Vendavales persistentes azotan [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_strong_winds: "Fuertes vientos persistentes barren [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Granjas expuestas y rutas de transporte sufren daños, y los puertos afrontan condiciones difíciles. En una región de unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas, estas perturbaciones empiezan a afectar la cosecha, los desplazamientos y los mercados."
  news_events_world.10.t_tropical_storm: "Tormenta tropical se abate sobre [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_tropical_storm: "Una tormenta tropical ha entrado en [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], trayendo fuertes lluvias, vientos y mares peligrosos. Las autoridades alertan a las comunidades bajas y los puertos reducen su tráfico. Con unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas en el estado, incluso una tormenta menor que un ciclón puede causar amplias perturbaciones a viviendas, cosechas y comercio costero."
  news_events_world.10.t_fallback: "Condiciones extraordinarias en [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_fallback: "Un cambio extraordinario del tiempo afecta a [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Las autoridades reúnen informes de granjas, transportes y mercados para decidir si los efectos deben considerarse calamidad o bendición. Con unas [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personas en el estado, incluso un cambio temporal en la cosecha puede tener consecuencias mucho más allá de los primeros distritos afectados."
  news_events_world.10.f: "DESDE LA ZONA AFECTADA: Agricultores y autoridades locales describen cosechas arruinadas, transportes interrumpidos y mercados nerviosos. Los primeros informes son incompletos y la verdadera magnitud de las pérdidas quizá no se conozca durante semanas."
  news_events_world.11.t: "Revolución en [ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.11.d: "Ha estallado un levantamiento revolucionario contra [ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFlag]. Los rebeldes se han organizado como [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetNameNoFlag] y proclaman un gobierno [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetGovernment.GetName] en lugar del viejo orden. Se levantan barricadas en los barrios obreros y se informa de que partes de la guarnición se han pasado a los insurgentes. La disputa ha pasado de la agitación a una lucha armada por el propio Estado. Los gobiernos vecinos observan con abierta ansiedad si el régimen existente sobrevivirá y qué ejemplo daría una victoria revolucionaria más allá de sus fronteras."
  news_events_world.11.f: "DE NUESTRO CORRESPONSAL: Las barricadas aparecen más rápido de lo que pueden imprimirse las proclamas. Los vecinos describen barrios donde la autoridad cambia de una calle a otra y el rumor viaja más deprisa que cualquier orden oficial."
  news_events_world.12.t: "Revolucionarios triunfan en [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.12.d: "Los revolucionarios han ganado la guerra civil en [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFlag], y la maquinaria de un gran Estado pasa a manos de un gobierno [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetGovernment.GetName] bajo [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetRuler.GetFullName]. La victoria se sentirá mucho más allá de las fronteras, animando a sus amigos y alarmando a sus enemigos. Las capitales extranjeras juzgarán a los vencedores no por sus proclamas sino por las leyes que impongan, las deudas que reconozcan y los tratados que decidan respetar. Los primeros meses del nuevo gobierno resolverán muchas cuestiones que la lucha no solucionó."
  news_events_world.12.f: "ANÁLISIS: La victoria da a los revolucionarios los ministerios, pero no por sí sola la burocracia, el ejército ni la confianza pública. Sus primeros días en el poder pueden ser tan decisivos como los combates que los llevaron allí."
  news_events_world.13.t: "La compra de [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.13.d: "Por el [ROOT.Var('news_world_13_news_treaty_ref').GetTreaty.GetNameNoFormatting], [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetName] ha pasado de [ROOT.Var('news_world_13_news_state_giver_ref').GetCountry.GetNameNoFlag] a [ROOT.Var('news_world_13_news_state_taker_ref').GetCountry.GetNameNoFlag]. El territorio transferido alberga a unas [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetPopulationSize|D] personas, por lo que no se trata de un mero ajuste del mapa. Administración, propiedad, acceso militar y situación de los habitantes deberán resolverse ahora, y los gobiernos vecinos ya calculan qué significa la nueva frontera para su seguridad. A los residentes no se les consultó."
  news_events_world.13.f: "DESDE LA FRONTERA: Los residentes esperan saber qué leyes, impuestos y funcionarios seguirán a la nueva bandera. Para quien vive en la tierra transferida, una firma en una capital lejana supone un cambio inmediato de gobierno."
  news_events_world.14.t: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFormatting] declara rival a [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.14.d: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFlag] y [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFlag] han entrado en una rivalidad declarada. Dos Estados de primera importancia se han colocado en abierta competencia, y la declaración endurecerá previsiblemente los alineamientos del continente. Los embajadores permanecen en sus puestos, pero las cortesías ordinarias se han enfriado notablemente. Todo futuro desacuerdo entre ambos, por pequeño que sea, se leerá ahora a la luz de esta hostilidad, y cuestiones antes resueltas discretamente entre funcionarios se debatirán en público ante un mundo atento."
  news_events_world.14.f: "MESA INTERNACIONAL: Los diplomáticos esperan que cualquier futura disputa entre los dos rivales se interprete a través de esta nueva hostilidad, incluso cuestiones que ayer habrían podido resolverse en silencio."
  news_events_world.15.t: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFormatting] se rinde a las fuerzas [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetAdjectiveNoFormatting]"
  news_events_world.15.d: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFlag] ha dejado de existir como Estado independiente, y su territorio restante ha sido absorbido por [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag] bajo los términos impuestos mediante la [ROOT.Var('news_world_15_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]. Un gobierno ha sido borrado de la lista de naciones, sus ministerios disueltos y sus representantes en el extranjero se han quedado sin país al que servir. [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag] carga ahora con la tierra conquistada y sus habitantes, mientras las potencias vecinas consideran si esto resuelve la disputa o simplemente engendra la siguiente."
  news_events_world.15.f: "DESDE LA ANTIGUA CAPITAL: Se retiran los letreros gubernamentales y los funcionarios deciden si servirán a las nuevas autoridades. Un Estado puede desaparecer del mapa más rápido que las lealtades locales."
  news_events_world.16.t: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetLastNameNoFormatting] sucede en el poder en [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.16.d: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetFullName], de [ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetAge] años, ha sucedido al frente de [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFlag] tras la muerte del gobernante anterior. El país se gobierna como [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetGovernment.GetName]. Como el Estado figura entre las principales potencias, los diplomáticos ya miden las amistades, convicciones y capacidad del nuevo dirigente para consolidar la autoridad durante el vulnerable comienzo de un reinado. La corte habla de continuidad; las embajadas están menos seguras."
  news_events_world.16.f: "MESA DE PALACIO: Los cortesanos hablan públicamente de continuidad, pero toda sucesión redistribuye acceso e influencia. Los embajadores extranjeros ya estudian quién está más cerca del nuevo gobernante."
  news_events_world.17.t: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFormatting] y [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFormatting] concluyen una alianza"
  news_events_world.17.d: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFlag] y [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFlag] han suscrito el [ROOT.Var('news_world_17_news_treaty_ref').GetTreaty.GetNameNoFormatting], comprometiéndose en una alianza formal. Parte de los términos se ha publicado, aunque se supone ampliamente que existen entendimientos adicionales no presentados ante ningún parlamento. Los planificadores militares y gobiernos rivales examinan los compromisos con máxima atención, pues una alianza de este peso puede transformar los cálculos de una crisis futura y convertir una disputa local en guerra general antes de que cualquiera de los firmantes tenga tiempo de reconsiderarlo."
  news_events_world.17.f: "ANÁLISIS MILITAR: Una alianza importa más antes del primer disparo. Los estados mayores revisarán sus planes bajo el supuesto de que la guerra con un firmante puede significar la guerra con ambos."
  news_events_world.18.t: "El nuevo gobierno de [ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.18.d: "[ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFlag] ha promulgado [ROOT.Var('news_world_18_news_new_law_ref').GetLaw.GetName], un cambio lo bastante profundo como para alterar la estructura misma del Estado. El país se gobierna ahora como [ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetGovernment.GetName]. Las capitales extranjeras reconsideran sus relaciones con el nuevo orden, mientras en casa sus amigos celebran y sus enemigos se preparan para consecuencias anunciadas desde hace tiempo. Juristas y funcionarios ya trabajan en las cuestiones prácticas de la transformación, pues títulos, ministerios y procedimientos que parecían permanentes deben reescribirse por completo."
  news_events_world.18.f: "MESA CONSTITUCIONAL: Juristas y funcionarios estudian las consecuencias prácticas del nuevo orden. Títulos, ministerios y viejos procedimientos antes considerados permanentes quizá deban reescribirse."
  news_events_world.19.t: "La agitación en [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetNameNoFormatting] estrangula la economía local mientras el estado cae en la inestabilidad"
  news_events_world.19.d: "Se informa de graves desórdenes por todo [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetName], dentro de [ROOT.Var('news_world_19_news_source_country_ref').GetCountry.GetNameNoFlag], un distrito de unas [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetPopulationSize|D] personas. Huelgas, disturbios y organización del descontento han alcanzado un nivel que amenaza la administración normal. Las tiendas cierran pronto, las reuniones públicas atraen multitudes muy superiores a las anunciadas y se ha reforzado la policía desde zonas vecinas. Si la agitación continúa, puede debilitar considerablemente al gobierno y perturbar el comercio del país entero."
  news_events_world.19.f: "DESDE LAS CALLES: Los comerciantes informan de cierres anticipados y las reuniones públicas congregan multitudes inusuales. Las autoridades aseguran que restaurarán el orden, pero los residentes dicen que la tensión se percibe mucho antes de cualquier motín."
  news_events_world.20.t: "Recesión en [ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.20.d: "[ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFlag] ha sufrido una contracción brusca y repentina de su comercio. El producto nacional ha caído de unas £[ROOT.Var('news_world_20_news_recession_previous_gdp_value').GetValue|D] a £[ROOT.Var('news_world_20_news_recession_current_gdp_value').GetValue|D], un descenso de [ROOT.Var('news_world_20_news_recession_drop_value').GetValue|%1] en un mes. Los libros de pedidos se vacían, el crédito se endurece y los fabricantes hablan de la demanda más débil en años. Los trabajadores temen por sus salarios y empleos, mientras los mercados extranjeros vigilan con inquietud que el contagio se propague mediante comercio e inversión."
  news_events_world.20.f: "MERCADOS: Banqueros e industriales buscan señales de que la contracción sea temporal. Un analista advierte que la confianza puede recuperarse rápido, hasta que despidos y quiebras conviertan un mal mes en una depresión duradera."
  news_events_world.21.t: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFormatting] alcanza mil millones de PIB"
  news_events_world.21.d: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFlag] se ha convertido en la primera nación del mundo en superar mil millones de libras de producto anual, con una cifra aproximada de £[ROOT.Var('news_world_21_news_billion_gdp_value').GetValue|D] al hacerse el cálculo. La concentración de manufactura, comercio y poder adquisitivo allí reunida fija una referencia frente a la que todos sus rivales deberán medirse. Los economistas discuten qué significa realmente el logro, y nada dice sobre quién recibe la riqueza, pero anuncia una escala industrial que ningún gobierno puede ya ignorar."
  news_events_world.21.f: "MESA FINANCIERA: Los economistas ya discuten el verdadero significado del logro. Dice poco sobre quién recibe la riqueza, pero anuncia una escala industrial que los rivales no pueden ignorar."
  news_events_world.22.t: "[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFormatting] proclama un nuevo acuerdo internacional"
  news_events_world.22.d: "Se ha formado un nuevo bloque bajo [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFlag]: [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName], reunido en torno al principio [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetIdentity.GetName] y con [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers] Estados miembros en su fundación. Otros gobiernos examinan su carta y membresía con gran atención, pues una asociación semejante puede redirigir el comercio, las alianzas y la influencia política de regiones enteras. Solo se sabrá si resulta duradero cuando sus miembros sean probados por una crisis que ninguno haya elegido."
  news_events_world.22.f: "ANÁLISIS DIPLOMÁTICO: Los nuevos bloques suelen proclamar unidad antes de sufrir una crisis real. Las cancillerías observarán el primer desacuerdo entre miembros con más atención que la ceremonia fundacional."
  news_events_world.23.t: "¡[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFormatting] incumple su deuda!"
  news_events_world.23.d: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFlag] ha incumplido sus obligaciones. En el momento del impago, el principal público era de unas £[ROOT.Var('news_world_23_news_default_principal_value').GetValue|D], frente a un límite de crédito de £[ROOT.Var('news_world_23_news_default_credit_limit_value').GetValue|D]. Los acreedores afrontan grandes pérdidas y el endeudamiento futuro del Estado será más caro, si es que vuelve a ser posible. Bancos y gobiernos extranjeros vigilan el contagio, los disturbios políticos y cualquier señal de que el tesoro ya no pueda mantener al ejército y a la administración sobre los que descansa la autoridad gubernamental."
  news_events_world.23.f: "MESA FINANCIERA: Los tenedores de bonos valoran tanto la política como la aritmética. Un acuerdo negociado podría restaurar la confianza; un impago prolongado puede encarecer cada préstamo futuro mucho después de terminar la crisis."
  news_events_world.24.t: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFormatting] ocupa su lugar entre las grandes potencias"
  news_events_world.24.d: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFlag] ha ascendido al primer rango de las naciones, con un producto anual aproximado de £[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetGDP|D]. El ascenso refleja una formidable acumulación de riqueza, armas e influencia, y otorga al Estado voz en las grandes cuestiones diplomáticas del día. Las potencias establecidas ya calculan si cortejar al recién llegado como aliado o tratarlo como rival, y éste puede descubrir que el reconocimiento trae obligaciones tan pesadas como sus privilegios."
  news_events_world.24.f: "MESA INTERNACIONAL: Invitaciones, protocolo y cálculo diplomático cambiarán casi de inmediato. El recién llegado puede descubrir que el reconocimiento trae no solo influencia, sino también la expectativa de tomar partido en disputas antes consideradas lejanas."
  news_events_world.25.t: "El declive de [ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.25.d: "[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFlag] ha caído del primer rango de potencias, con un producto anual estimado ahora en unas £[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetGDP|D]. El cambio es más que ceremonial: anuncia una capacidad reducida para exigir atención y moldear el equilibrio mundial. En casa, los ministros enfrentan presiones para restaurar la fuerza y el prestigio perdidos, y la oposición tendrá abundante material. En el extranjero, antiguos socios probablemente negociarán con más dureza que hace un año."
  news_events_world.25.f: "ANÁLISIS: La pérdida de posición se sentirá en las salas de conferencias antes de verse en el mapa. Los antiguos socios pueden negociar con más dureza y los rivales probarán si el declive es temporal o permanente."
  news_events_world.26.t: "Se cuestiona el liderazgo de [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.26.d: "Ha comenzado una lucha por el dominio dentro de [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName], una asociación de [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers] Estados miembros. [ROOT.Var('news_world_26_news_bloc_contender_ref').GetCountry.GetNameNoFlag] ha desafiado a [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFlag], actual dirigente. Los funcionarios insisten en que la cooperación ordinaria continúa sin alteraciones, aunque las delegaciones cuentan sus apoyos con inusual cuidado. Una contienda prolongada puede dividir a varios gobiernos a la vez e invitar a potencias externas a aprovechar la confusión."
  news_events_world.26.f: "DENTRO DEL BLOQUE: Los funcionarios insisten en que continúa la cooperación, pero las delegaciones cuentan apoyos con un cuidado poco habitual. Una lucha por el liderazgo sin ejércitos aún puede dividir a aliados en campos rivales."
  news_events_world.27.t: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFormatting] se apodera del liderazgo de la alianza"
  news_events_world.27.d: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFlag] ha vencido a [ROOT.Var('news_world_27_news_bloc_loser_ref').GetCountry.GetNameNoFlag] por el liderazgo de [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetName], asociación de [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetNumMembers] Estados miembros. Los gobiernos de la organización sopesan si el cambio los unirá más o provocará resistencia entre quienes apoyaron al antiguo líder. La contienda ha terminado, pero las lealtades que reveló no se arreglan tan fácilmente, y el nuevo dirigente hereda colegas que claramente habrían preferido otro resultado."
  news_events_world.27.f: "MESA DIPLOMÁTICA: La contienda terminó, pero quizá no las lealtades. El nuevo dirigente hereda una organización que incluye gobiernos que habrían preferido al perdedor."
  news_events_world.28.t: "[ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFormatting] y [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFormatting] toman caminos separados"
  news_events_world.28.d: "El [ROOT.Var('news_world_28_news_treaty_ref').GetTreaty.GetNameNoFormatting], que unía a [ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFlag] con [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFlag], ha sido disuelto. La ruptura elimina un compromiso importante y obliga a ambos gobiernos a replantear su planificación militar y su posición en cualquier crisis futura. Cada capital ha emitido una declaración de pesar redactada en términos que no convencen a nadie. Sus rivales ya estudian qué oportunidades ofrece la brecha, y la cuestión es ahora dónde buscarán seguridad los antiguos socios y quién está dispuesto a sustituir la relación perdida."
  news_events_world.28.f: "MESA INTERNACIONAL: Los diplomáticos consideran la ruptura más importante que la cancelación formal. La cuestión es dónde buscarán seguridad los antiguos socios y quién está dispuesto a sustituir la relación."
  news_events_world.29.t: "¡PÁNICO! ¡Escasez mundial de [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting]!"
  news_events_world.29.d: "Una grave escasez de [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] se ha apoderado del mercado mundial, y los precios han subido mucho más allá de lo que el comercio considera normal. La demanda se sitúa en unas [ROOT.Var('news_world_29_news_shortage_imports_value').GetValue|D] unidades frente a solo [ROOT.Var('news_world_29_news_shortage_exports_value').GetValue|D] ofrecidas a la venta, una presión de [ROOT.Var('news_world_29_news_shortage_pressure_value').GetValue|2] a uno. Fabricantes, comerciantes y gobiernos luchan por asegurar las existencias restantes, y el mayor coste se extiende a toda industria que dependa del producto."
  news_events_world.29.f: "MERCADOS: Los compradores informan de contratos reescritos por horas. Un corredor describió la pugna por [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] como un mercado donde tener dinero ya no garantiza el suministro."
  news_events_world.30.t: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] y [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] redibujan el mapa"
  news_events_world.30.d_exchange: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] y [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] han acordado un intercambio territorial. [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting], hogar de unas [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D] personas, pasa de [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] a [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting], mientras [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting], con unas [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D] personas, se mueve en dirección opuesta. Las fronteras se han redibujado por acuerdo y no por guerra, y los habitantes de ambas provincias despiertan como súbditos de otro gobierno."
  news_events_world.30.d_a_to_b: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] ha acordado transferir [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting] a [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]. El territorio contiene unas [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D] personas, que no fueron consultadas. Administración, impuestos y seguridad deben reorganizarse bajo el nuevo soberano, y cuestiones de propiedad, lengua y cargos locales ocuparán a los juristas durante años. Los gobiernos vecinos estudian un cambio de frontera logrado por negociación en lugar de la fuerza."
  news_events_world.30.d_b_to_a: "[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] ha acordado transferir [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting] a [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]. El territorio contiene unas [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D] personas, que no fueron consultadas. Administración, impuestos y seguridad deben reorganizarse bajo el nuevo soberano, y cuestiones de propiedad, lengua y cargos locales ocuparán a los juristas durante años. Los gobiernos vecinos estudian un cambio de frontera logrado por negociación en lugar de la fuerza."
  news_events_world.30.f: "DESDE LA FRONTERA: Los agrimensores pueden mover la línea en días, pero los residentes vivirán con las consecuencias durante años. Comerciantes, propietarios y autoridades locales ya preguntan qué normas sobrevivirán a la transferencia."
  news_events_world.31.t: "¡HUELGA! ¡Los trabajadores se unen en [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]!"
  news_events_world.31.d_nationwide: "Una ola de huelgas recorre [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] de extremo a extremo. El trabajo se ha detenido en las fábricas y las obras públicas mientras el movimiento obrero organizado dirige sus demandas contra patrones y ministros. El paro ya es lo bastante grande para afectar a la producción de todo el país, y los periódicos de todos los partidos solo coinciden en su gravedad. Se teme que la confrontación prolongada alimente el radicalismo y obligue al gobierno a elegir entre concesión y represión, ninguna de ellas sin coste."
  news_events_world.31.d_mining: "Ha estallado una gran huelga minera en [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], con [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] en el centro de la perturbación. Los hombres han abandonado los pozos en medio de gran acritud, amenazando el flujo de carbón y metal hacia la industria justo cuando la demanda es mayor. Patrones y ministros reciben presiones para resolver antes de que la escasez pase de la mina a fábricas y ferrocarriles. En los distritos mineros, comités propios mantienen el orden, algo que inquieta a las autoridades tanto como cualquier desorden."
  news_events_world.31.d_industrial: "Los obreros de fábrica han abandonado el trabajo en [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], con [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] entre los principales centros de la huelga. La producción está interrumpida mientras trabajadores y maquinistas exigen mejoras salariales y horarias. Los patrones advierten de pedidos perdidos, fábricas ociosas y contratos que se irán al extranjero; los sindicalistas responden que el paro demuestra precisamente su vieja tesis: el país funciona gracias a quienes menos son consultados sobre cómo se gobierna."
  news_events_world.31.d_railway: "Los ferroviarios están en huelga en [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], con la perturbación centrada en [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]. Un paro largo amenaza mucho más que las líneas: las fábricas dependen de los trenes para combustible y materias, las ciudades para alimentos y el ejército para moverse. Mercancías perecederas ya se pudren en apartaderos. Los ministros reciben presiones para restaurar el servicio o alcanzar un acuerdo antes de que se extienda la parálisis."
  news_events_world.31.d_movement: "Los trabajadores de [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] han iniciado una huelga de claro carácter político en [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]. El paro pertenece a un movimiento más amplio y no a una sola queja del taller, llevando los conflictos de la fábrica directamente a la política nacional. Los patrones temen que el ejemplo se extienda; los organizadores esperan que la perturbación obligue al gobierno a tratarlos como fuerza política y no como simple alteración del orden."
  news_events_world.31.d: "Ha estallado una huelga considerable en [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], centrando la atención nacional en salarios, jornadas y condiciones del trabajador. La perturbación es lo bastante grave para alarmar a ministros e industriales, que temen que un paro largo reduzca la producción y anime imitaciones. En varias ciudades se recaudan fondos para las familias de los huelguistas. La respuesta del gobierno puede determinar si el conflicto acaba en negociación, represión o una ola de agitación más amplia."
  news_events_world.31.f: "DESDE EL PIQUETE: Los organizadores insisten en que el paro continuará hasta conseguir concesiones reales, mientras los patrones advierten que cada turno ocioso aumenta el coste y anima a trabajadores de otros lugares a sumarse."

