  news_events_world.32.t: "¡Los [ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting] se retiran!"
  news_events_world.32.d: "[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetNameNoFormatting] ha retrocedido en su confrontación diplomática con [ROOT.Var('news_world_32_news_backdown_target_ref').GetCountry.GetNameNoFormatting], cediendo a la demanda principal en vez de llevar la disputa a la guerra. Lo que se había presentado como una prueba de resolución nacional ha terminado en la mesa de conferencias, y las cancillerías extranjeras ya sopesan lo que la retirada puede significar para el prestigio [ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting]."
  news_events_world.32.f: "MESA DIPLOMÁTICA: Los telegramas de las capitales extranjeras informan de alivio inmediato porque se evitó la guerra. En casa, sin embargo, los opositores ya preguntan si la paz se compró a un precio demasiado alto."
  news_events_world.32.a: "Así termina la crisis."

