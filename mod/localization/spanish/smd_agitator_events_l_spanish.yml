l_spanish:
 smd_agitators.1.t:0 "Tupac Shakur ha muerto"
 smd_agitators.1.d:0 "La noche del 7 de septiembre de 1996, [SCOPE.sCharacter('smd_tupac_scope').GetFullName] recibió cuatro disparos mientras estaba en un coche detenido en un semáforo en rojo en Las Vegas. Murió a causa de sus heridas el 13 de septiembre, a los 25 años. El tirador huyó y nadie ha sido acusado. En todo el país, sus seguidores se han reunido para llorarlo."
 smd_agitators.1.f:0 "Su cuarto álbum, All Eyez on Me, había salido a principios de ese año."
 smd_agitators.1.a:0 "Una voz silenciada"
