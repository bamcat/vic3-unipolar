l_spanish:

 news.1.t:0 "Un acontecimiento notable"
 news.1.d:0 "Un recorte de prueba. Si esto aparece como un periódico, con la cabecera de su país arriba, la noticia impresa sobre papel y SIN marco oscuro ni barra de título alrededor de la ventana, entonces este tipo de ventana funciona. También debería seguir siendo posible arrastrarla."
 news.1.f:0 "Nuestros corresponsales están preparados."
 news.1.a:0 "¡Noticia de primera!"

 news.2.t:0 "REVOLUCIÓN EN RUSIA"
 news.2.d:0 "[ROOT.Var('news_test_2_news_attacker_ref').GetCountry.GetNameNoFlag] ha declarado formalmente la guerra a [ROOT.Var('news_test_2_news_defender_ref').GetCountry.GetNameNoFlag]. Las tropas se movilizan a lo largo de la frontera y las cancillerías de las grandes potencias observan con grave preocupación. Los diplomáticos han sido llamados de vuelta y las bolsas se han sumido en el caos. Nuestros corresponsales se dirigen al teatro de la guerra y se esperan más detalles con el correo de la tarde. Los diplomáticos han sido llamados de vuelta y las bolsas se han sumido en el caos. Nuestros corresponsales se dirigen al teatro de la guerra y se esperan más detalles con el correo de la tarde. Los diplomáticos han sido llamados de vuelta y las bolsas se han sumido en el caos. Nuestros corresponsales se dirigen al teatro de la guerra y se esperan más detalles con el correo de la tarde."
 news.2.f:0 "Los cañones hablan donde la diplomacia ha fracasado."
 news.2.a:0 "Noticias verdaderamente graves."
