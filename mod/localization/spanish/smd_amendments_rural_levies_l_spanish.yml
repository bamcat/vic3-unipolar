 smd_amendment_rural_levies:0 "Gravámenes rurales"
 smd_amendment_rural_levies_desc:0 "Además del impuesto agrícola, los gobiernos de cantones y aldeas cobran tasas, cuotas de grano y trabajo obligatorio a los hogares campesinos para pagar escuelas, caminos y funcionarios locales. La carga recae sobre todo en los campesinos más pobres."
 smd_amendment_rural_levies_modifier:0 "Gravámenes rurales"
 smd_amendment_rural_levies_modifier_desc:0 "Las tasas cantonales y el trabajo obligatorio recaudan dinero del campo a costa de la buena voluntad campesina."
