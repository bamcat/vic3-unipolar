 great_polarization.2.t:0 "Disparos masivos motivados políticamente"
 great_polarization.2.d:0 "Un tiroteo masivo ligado a la retórica política extremista ha impactado al país. Las facciones rivales argumentan inmediatamente sobre la culpa, la seguridad, las libertades civiles y la ideología."
 great_polarization.2.f:0 "Los muertos están de luto. La narrativa se combate antes de que comiencen los funerales."
 great_polarization.2.a:0 "La indignación alimenta la brecha."
 great_polarization.2.b:0 "Busca una respuesta bipartidista seria."

 great_polarization.3.t:0 "Attempted Assassination"
 great_polarization.3.d:0 "Un intento de asesinato de una figura política ha suscitado temores de que se normalice la violencia política."
 great_polarization.3.f:0 "El disparo perdió su objetivo, pero golpeó la república."
 great_polarization.3.a:0 "El país se recupera."
 great_polarization.3.b:0 "Ampliar la seguridad protectora."

 great_polarization.4.t:0 "Extracto Algorítmico"
 great_polarization.4.d:0 "Las plataformas de redes sociales han amplificado la indignación política, exponiendo millones a contenidos radicales, redes de conspiración y contra-movilización impulsada por la identidad."
 great_polarization.4.f:0 "El pienso no persuade. Se intensifica."
 great_polarization.4.a:0 "La máquina de indignación se acelera."
 great_polarization.4.b:0 "Plataformas de presión a moderada."

 great_polarization.5.t:0 "Una ola de exposición"
 great_polarization.5.d:0 "Una ola de acusaciones públicas contra figuras poderosas ha desencadenado un balance nacional sobre abuso, género e hipocresía institucional."
 great_polarization.5.f:0 "Lo que había sido susurrado ahora es buscable."
 great_polarization.5.a:0 "El cálculo se extiende."
 great_polarization.5.b:0 "Crear canales institucionales para la rendición de cuentas."

 great_polarization.6.t:0 "Minorías dirigidas"
 great_polarization.6.d:0 "Una oleada de hostilidad hacia las comunidades minoritarias ha desencadenado protestas, protestas y un renovado debate sobre el racismo, la identidad y la pertenencia nacional."
 great_polarization.6.f:0 "Para algunos, es retroceso. Para otros, es supervivencia."
 great_polarization.6.a:0 "Las calles se llenan de nuevo."
 great_polarization.6.b:0 "Condena la barra trasera y baja la temperatura."

 great_polarization.20.t:0 "Las caídas de la temperatura"
 great_polarization.20.d:0 "La polarización no ha desaparecido, pero la espiral más peligrosa ha sido interrumpida. Las instituciones políticas han recuperado cierta legitimidad."
 great_polarization.20.f:0 "Una república sobrevive no porque sus ciudadanos estén de acuerdo, sino porque suficientes aceptan perder."
 great_polarization.20.a:0 "El sindicato soporta."

 great_polarization.21.t:0 "El Divide Entrenched"
 great_polarization.21.d:0 "La crisis inmediata no ha explotado en la guerra civil, pero la polarización se ha incrustado en la vida política estadounidense."
 great_polarization.21.f:0 "La fiebre no se rompió. Se volvió crónico."
 great_polarization.21.a:0 "La nueva normalidad."

