 state_pop_support_movement_traditionalist_add_desc:0 "Cambia la atracción pop hacia el movimiento tradicionalista."

 great_polarization.130.t:0 "¿Líder Blue America?"
 great_polarization.130.d:0 "Con los Estados Unidos fracturados, el carácter liberal o central de la administración lo sitúa más cerca de Blue America. Usted puede continuar la guerra como América Azul o permanecer con los restos de los Estados Unidos."
 great_polarization.130.f:0 "Un gobierno puede reclamar continuidad, pero el poder sigue a las instituciones que aún obedecen."
 great_polarization.130.a:0 "Cambia a Blue America."
 great_polarization.130.b:0 "Quedarse como Estados Unidos."

 great_polarization.131.t:0 "¿Llevar América Roja?"
 great_polarization.131.d:0 "Con los Estados Unidos fracturados, el personaje de derecha de la administración lo sitúa más cerca de América Roja. Usted puede continuar la guerra como América Roja o permanecer con los restos de los Estados Unidos."
 great_polarization.131.f:0 "La bandera es la misma forma, pero el país debajo ha cambiado."
 great_polarization.131.a:0 "Cambia a Red America."
 great_polarization.131.b:0 "Quedarse como Estados Unidos."

 great_polarization_switch_blue_tt:0 "Cambiarás el país a неx id=0/año Blue America seleccionx id=1/conferencia."
 great_polarization_switch_red_tt:0 "Usted cambiará país a неx id=0/ título Red America madex id=1/conferencia."
 great_polarization_stay_usa_tt:0 "Usted permanecerá como Estados Unidos."

 great_polarization.38.t:0 "El Capitolio de EE.UU."
 great_polarization.38.d:0 "Una multitud ha torcido el Capitolio de los Estados Unidos después de una elección amargamente controvertida, conmocionando al país y profundizando los temores de que el conflicto político está rompiendo con las restricciones constitucionales."
 great_polarization.38.f:0 "La rotonda se convierte en un campo de batalla de símbolos."
 great_polarization.38.a:0 "La república tembla."
 great_polarization.38.b:0 "Condenar el ataque y reconstruir la confianza."

 ## other western countries

 je_rise_of_the_right:0 "El ascenso de la derecha"
 je_rise_of_the_right_reason:0 "En todo Occidente, los movimientos populistas de derecha están ganando fuerza a través de la fragmentación de los medios, el retroceso de la migración, la política de la cultura y el resentimiento anti-establecimiento. Hasta 2035, los movimientos de derecha son más fuertes y los líderes populistas de derecha son más propensos a emerger."

 rise_of_the_right_status_baseline:0 "Los movimientos de derecha están ganando fuerza."
 rise_of_the_right_status_strong:0 "Una oleada populista de derecha está remodelando la política nacional."
 rise_of_the_right_completion_header:0 "Esta onda se reduce después de 2035."
 rise_of_the_right_ends_2035_tt:0 "El Levántate de la derecha termina después de id=0/año Enero 1, 2035 se hizo id=1/año."
 rise_of_the_right_spawnrate_tt:0 "El líder populista de derecha se incrementa. Las pesas exactas desgastadas se manejan manualmente en los archivos desgastados de la ideología/caracter."

 rise_of_the_right.1.t:0 "El ascenso de la derecha"
 rise_of_the_right.1.d:0 "Una nueva corriente populista de derecha ha entrado en la política nacional. Aprovecha la fuerza de la desconfianza de las instituciones, el enojo de las élites, el retroceso cultural y un ambiente mediático fragmentado."
 rise_of_the_right.1.f:0 "Los viejos partidos todavía mantienen las oficinas. La nueva política está aprendiendo a mantener a la multitud."
 rise_of_the_right.1.a:0 "El centro político ya no es seguro."

 rise_of_the_right.10.t:0 "Algoritmic Anger"
 rise_of_the_right.10.d:0 "Las redes políticas en línea han amplificado la indignación contra el restablecimiento, dando a los movimientos populistas de derecha nuevas formas de organizar fuera de los partidos tradicionales."
 rise_of_the_right.10.f:0 "Un alimento se convierte en un mitin. Una queja se convierte en una plataforma."
 rise_of_the_right.10.a:0 "La indignación se propaga."
 rise_of_the_right.10.b:0 "Retrocedan las instituciones cívicas."

 rise_of_the_right.11.t:0 "Migration Backlash"
 rise_of_the_right.11.d:0 "Una oleada de ira sobre inmigración, integración e identidad nacional ha fortalecido los movimientos de derecha."
 rise_of_the_right.11.f:0 "La frontera se convierte en un símbolo por cada miedo que el viejo orden no puede responder."
 rise_of_the_right.11.a:0 "La reacción crece."
 rise_of_the_right.11.b:0 "Descalar el debate."

 rise_of_the_right.12.t:0 "Los populistas atraviesan"
 rise_of_the_right.12.d:0 "Una facción populista de derecha ha roto a través del sistema del viejo partido, obligando a las partes principales a responder a su idioma y agenda."
 rise_of_the_right.12.f:0 "Estaban una vez fuera de la habitación. Ahora la habitación está construida alrededor de ellos."
 rise_of_the_right.12.a:0 "Las oleadas derechas."
 rise_of_the_right.12.b:0 "Reconstruye el centro."

 rise_of_the_right.13.t:0 "Street Politics"
 rise_of_the_right.13.d:0 "Las manifestaciones, las contra-demonstraciones y los enfrentamientos virales han profundizado el sentido de que la política ha salido del parlamento y a las calles."
 rise_of_the_right.13.f:0 "El canto es política en su forma larval."
 rise_of_the_right.13.a:0 "Las calles se radicalizan."
 rise_of_the_right.13.b:0 "Enfriar la temperatura."

 rise_of_the_right_baseline:0 "El ascenso de la derecha"
 rise_of_the_right_baseline_desc:0 "Los movimientos de derecha están ganando fuerza en la política nacional."

 rise_of_the_right_populist_surge:0 "Surge Populista derechista"
 rise_of_the_right_populist_surge_desc:0 "Los populistas de derecha están remodelando el paisaje político."

 rise_of_the_right_migration_backlash:0 "Migration Backlash"
 rise_of_the_right_migration_backlash_desc:0 "La inmigración y la identidad nacional se han convertido en motores centrales de la movilización política."

 rise_of_the_right_online_radicalization:0 "Algoritmic Anger"
 rise_of_the_right_online_radicalization_desc:0 "La indignación en línea está acelerando la movilización política de derecha."

 rise_of_the_right_establishment_response:0 "Respuesta del establecimiento"
 rise_of_the_right_establishment_response_desc:0 "Las instituciones principales están tratando de absorber o desactivar la oleada populista."

 rise_of_the_right_populist_leader_spawn_tooltip_modifier:0 "Apertura Populista derechista"
 rise_of_the_right_populist_leader_spawn_tooltip_modifier_desc:0 "El líder populista de derecha se incrementa. La ideología real de pesos se maneja manualmente."
 smd_je_crime_wave:0 "Organised Crime Wave"
 smd_je_crime_wave_success_desc:0 "The gangs have been broken. Their leaders are in prison or in exile, and the rule of law has returned to our streets."
 smd_je_crime_wave_failure_desc:0 "Organised crime now runs alongside the state, and in places in place of it. Officials answer to the bosses as often as to the law."
 smd_je_crime_wave_timeout_desc:0 "The crime wave has slowly burned itself out. Neither victory nor defeat, the problem has simply changed shape."
 smd_je_crime_wave_success_tt:0 "The grip of organised crime has been reduced to almost nothing"
 smd_je_crime_wave_failure_tt:0 "Organised crime has captured the state"
 smd_crime_wave_bar:0 "Grip of Organised Crime"
 smd_crime_wave_bar_desc:0 "How deeply criminal networks have penetrated the economy and the state."
 smd_crime_bar_poverty:0 "Widespread poverty"
 smd_crime_bar_transition:0 "Collapse of the old order"
 smd_crime_bar_weak_police:0 "Weak policing laws"
 smd_crime_bar_strong_police:0 "Professional police force"
 smd_crime_bar_police_investment:0 "Police investment"
 smd_crime_bar_courts_investment:0 "Court investment"
 smd_crime_bar_task_force:0 "Anti-mafia task force"
 smd_btn_crime_task_force:0 "Launch an Anti-Mafia Task Force"
 smd_btn_crime_crackdown:0 "Order a Crackdown"
 smd_btn_crime_crackdown_desc:0 "Send in the security forces. Arrests will be swift and numerous, and not all of them will be guilty."
 smd_btn_crime_crackdown_law_tt:0 "We have a National Guard, Secret Police or Militarized Police"
 smd_crime.1.t:0 "The Protection Racket"
 smd_crime.1.d:0 "Shopkeepers across our cities report the same visitors: polite young men offering 'security' for a monthly fee. Those who refuse find their windows smashed or their stock burned. The small business associations are demanding action."
 smd_crime.1.f:0 "\"I pay the tax collector and I pay them. Only one of them ever shows up when there is trouble.\""
 smd_crime.1.a:0 "Fund a dedicated business protection unit."
 smd_crime.1.b:0 "Private security can handle this."
 smd_crime.2.t:0 "A Journalist Silenced"
 smd_crime.2.d:0 "An investigative reporter who had been exposing links between organised crime and local officials was shot dead outside her home this morning. Her colleagues are publishing her unfinished work, and the names in it are uncomfortable ones."
 smd_crime.2.f:0 "Her last article ran under the headline 'Who Protects the Protectors?'"
 smd_crime.2.a:0 "Open a fully independent inquiry."
 smd_crime.2.b:0 "Blame foreign gangs and move on."
 smd_crime.3.t:0 "Police on the Payroll"
 smd_crime.3.d:0 "Wiretaps have revealed that senior officers in several districts are taking regular payments from criminal groups. The interior ministry warns that a full purge would leave the force short staffed for years."
 smd_crime.3.f:0 "The recordings were leaked by a sergeant who had refused his share."
 smd_crime.3.a:0 "Purge them, whatever it costs."
 smd_crime.4.f:0 "Armoured cars now escort the evening bread deliveries in the worst districts."
 smd_crime.4.b:0 "Broker a quiet truce between the bosses."
 smd_crime.5.t:0 "Kingpin in Custody"
 smd_crime.5.d:0 "After months of surveillance, our investigators have arrested one of the country's most powerful crime bosses. The trial will be long and dangerous, but the public is watching with something close to hope."
 smd_crime.5.f:0 "He was arrested at his daughter's wedding, still holding a glass of champagne."
 smd_crime.5.a:0 "Justice will be done, and seen to be done."
 smd_crime.6.t:0 "The Rule of Law Restored"
 smd_crime.6.d:0 "The great criminal networks of the last decade have been dismantled. Businesses no longer pay for protection, and the courts are trusted again. It has been a long fight, and it has been won."
 smd_crime.6.f:0 "For the first time in years, the market traders sleep through the night."
 smd_crime.6.a:0 "Let it stay that way."
 smd_crime.7.t:0 "The Captured State"
 smd_crime.7.d:0 "Organised crime is no longer a threat to the state. It is part of it. Contracts, customs and appointments pass through the hands of the bosses, and those who resist are bought or buried."
 smd_crime.7.f:0 "\"In this country,\" the old joke goes, \"the mafia has a state.\""
 smd_crime.7.a:0 "We will have to live with this."
 smd_crime_task_force:0 "Anti-Mafia Task Force"
 smd_crime_task_force_desc:0 "An elite unit of investigators and prosecutors is dismantling criminal networks."
 smd_crime_crackdown_abuses:0 "Crackdown Abuses"
 smd_crime_crackdown_abuses_desc:0 "Mass arrests have swept up the innocent with the guilty."
 smd_crime_protection_unit:0 "Business Protection Unit"
 smd_crime_protection_unit_desc:0 "A dedicated police unit protects small businesses from racketeers."
 smd_crime_private_security:0 "Private Security Boom"
 smd_crime_private_security_desc:0 "Businesses are paying private guards to do the state's job."
 smd_crime_independent_inquiry:0 "Independent Inquiry"
 smd_crime_independent_inquiry_desc:0 "An independent inquiry is investigating links between crime and officialdom."
 smd_crime_police_purge:0 "Police Purge"
 smd_crime_police_purge_desc:0 "Corrupt officers have been removed, leaving the force short handed but cleaner."
 smd_crime_troops_on_streets:0 "Troops on the Streets"
 smd_crime_troops_on_streets_desc:0 "Soldiers patrol the streets of the capital."
 smd_crime_gang_truce:0 "Gang Truce"
 smd_crime_gang_truce_desc:0 "The state has negotiated with criminals, and everyone knows it."
 smd_crime_kingpin_trial:0 "Kingpin Trial"
 smd_crime_kingpin_trial_desc:0 "The trial of a notorious crime boss shows the state can still enforce the law."
 smd_rule_of_law_restored:0 "Rule of Law Restored"
 smd_rule_of_law_restored_desc:0 "Organised crime has been defeated and public trust in institutions has returned."
 smd_captured_state:0 "Captured State"
 smd_captured_state_desc:0 "Criminal networks have penetrated the state at every level."
 smd_je_democratic_consolidation:0 "Democratic Consolidation"
 smd_je_democratic_consolidation_reason:0 "[ROOT.GetCountry.GetName] has only recently become a democracy. Free elections are a beginning, not an end. Courts must learn independence, the press must learn freedom, and the army must learn to stay in its barracks. New democracies are fragile, and many do not survive their first decade."
 smd_je_democratic_consolidation_success_desc:0 "Democracy has become the only game in town. Power changes hands peacefully, and no serious force contemplates any other way."
 smd_je_democratic_consolidation_failure_desc:0 "The democratic experiment has faltered. Elections still take place, but fewer people believe they matter."
 smd_je_democratic_consolidation_invalid_desc:0 "Free elections have been abolished."
 smd_je_democratic_consolidation_bar_tt:0 "Democratic Stability is at its maximum"
 smd_je_democratic_consolidation_time_tt:0 "At least six years have passed since the transition to democracy"
 smd_je_democratic_consolidation_failure_tt:0 "Democratic Stability has collapsed"
 smd_democracy_bar:0 "Democratic Stability"
 smd_democracy_bar_desc:0 "How deeply democratic institutions have taken root."
 smd_dem_bar_free_speech:0 "Freedom of speech and assembly"
 smd_dem_bar_courts:0 "Court investment"
 smd_dem_bar_legitimacy:0 "Government Legitimacy of at least 50"
 smd_dem_bar_judicial_reform:0 "Judicial reform programme"
 smd_dem_bar_civic_education:0 "Civic education programme"
 smd_dem_bar_repression:0 "Repressive internal security law"
 smd_dem_bar_censorship:0 "Censorship"
 smd_dem_bar_media_capture:0 "State controlled media"
 smd_dem_bar_restless_army:0 "A powerful and unhappy army"
 smd_dem_bar_radicals:0 "At least 20 percent of the population is radical"
 smd_dem_bar_default:0 "We are in default"
 smd_btn_dem_judicial_reform:0 "Fund Judicial Reform"
 smd_btn_dem_judicial_reform_desc:0 "Expand the court system, train new judges and insulate them from political pressure."
 smd_btn_dem_civic_education:0 "Launch Civic Education"
 smd_btn_dem_civic_education_desc:0 "Expand our schools and teach a generation raised under the old regime how democratic institutions work."
 smd_democracy.1.t:0 "Settling Accounts with the Past"
 smd_democracy.1.d:0 "The files of the old regime's security services are now in our hands. Some demand that every official and informer named in them be barred from public life. Others warn that a witch hunt would tear the country apart and that we should draw a thick line under the past."
 smd_democracy.1.f:0 "Somewhere in the archive, every family has a file."
 smd_democracy.1.a:0 "Lustration. Those who served the old regime must step aside."
 smd_democracy.1.b:0 "Draw a thick line. We look forward, not back."
 smd_democracy.3.t:0 "The Constitutional Court Rules"
 smd_democracy.3.d:0 "The constitutional court has ruled that [SCOPE.sLaw('smd_dc_struck_law_scope').GetName] is unconstitutional. If we comply, it will be repealed and the law it replaced will return. Ministers are furious and some are calling for the court to be ignored."
 smd_democracy.3.f:0 "Whether the government obeys will show what the court's rulings are worth."
 smd_democracy.3.a:0 "The court has spoken. We will repeal the law."
 smd_democracy.3.b:0 "The people elected us, not the judges."
 smd_democracy.4.t:0 "Rumblings in the Barracks"
 smd_democracy.4.d:0 "Senior officers are complaining openly about budget cuts and civilian interference in military matters. Intelligence reports suggest some are discussing more than complaints."
 smd_democracy.4.f:0 "\"The army,\" one general told a journalist, \"is the only institution in this country that still works.\""
 smd_democracy.4.a:0 "Raise military pay and keep them content."
 smd_democracy.4.b:0 "Retire the troublemakers and remove the generals from cabinet."
 smd_democracy.5.t:0 "A Consolidated Democracy"
 smd_democracy.5.d:0 "Elections have been held in peace, the courts are independent and the army answers to elected civilians. Political scientists now count [ROOT.GetCountry.GetName] among the world's consolidated democracies."
 smd_democracy.5.f:0 "The losing candidate conceded before midnight. Nobody found this remarkable any more."
 smd_democracy.5.a:0 "The work of a generation."
 smd_democracy.6.t:0 "Democratic Backsliding"
 smd_democracy.6.d:0 "Disillusion with democracy has spread. Turnout is falling, the press is cowed and the public increasingly longs for a strong hand. The forms of democracy remain, but the substance is draining away."
 smd_democracy.6.f:0 "\"At least under the old regime,\" people say, \"there was order.\""
 smd_democracy.6.a:0 "A worrying turn."
 smd_je_illiberal_turn:0 "The Illiberal Turn"
 smd_je_illiberal_turn_reason:0 "Our leader won power at the ballot box and now governs as if the ballot box were the only check that matters. Courts, the press and the opposition are obstacles to the will of the people. Whether this ends in an entrenched regime or a democratic correction depends on how far the government is willing to go, and how hard society pushes back."
 smd_je_illiberal_turn_entrenched_header:0 "The regime entrenches itself"
 smd_je_illiberal_turn_resilience_header:0 "Democracy pushes back"
 smd_je_illiberal_turn_entrenched_desc:0 "Elections continue, but the outcome is no longer in doubt. The regime controls the courts, the airwaves and the electoral machinery."
 smd_je_illiberal_turn_resilience_desc:0 "The leader has fallen from power before the institutions could be captured. The checks and balances held."
 smd_je_illiberal_turn_invalid_desc:0 "The pretence of democracy has been abandoned altogether."
 smd_je_illiberal_turn_entrenched_tt:0 "Regime Entrenchment is complete"
 smd_je_illiberal_turn_resilience_tt:0 "Our head of state is no longer a populist or authoritarian leader"
 smd_illiberal_bar:0 "Regime Entrenchment"
 smd_illiberal_bar_desc:0 "How firmly the governing faction controls the institutions meant to check it."
 smd_ill_bar_media:0 "State controlled media"
 smd_ill_bar_censorship:0 "Censorship"
 smd_ill_bar_secret_police:0 "Secret police"
 smd_ill_bar_courts:0 "Packed courts"
 smd_ill_bar_popular:0 "Government Legitimacy of at least 50"
 smd_ill_bar_backslid:0 "Weakened democratic institutions"
 smd_ill_bar_free_press:0 "Protected speech"
 smd_ill_bar_intelligentsia:0 "A powerful and unhappy Intelligentsia"
 smd_ill_bar_protests:0 "Mass protests"
 smd_ill_bar_bloc_conditionality:0 "Power bloc democratic conditions"
 smd_btn_ill_pack_courts:0 "Pack the Courts"
 smd_btn_ill_pack_courts_desc:0 "Expand the supreme court and fill the new seats with loyalists."
 smd_btn_ill_media_takeover:0 "Bring the Media to Heel"
 smd_btn_ill_media_takeover_desc:0 "Put a state media law before parliament while friendly businessmen buy up the independent channels."
 smd_btn_ill_extend_term:0 "Extend the Leader's Term"
 smd_btn_ill_extend_term_desc:0 "Postpone the next election by four years and amend the constitution so the leader can stand again."
 smd_btn_ill_extend_term_tt:0 "Regime Entrenchment is at least 50"
 smd_illiberal.1.t:0 "Enemies of the People"
 smd_illiberal.1.d:0 "In a televised address, our head of state denounced the country's leading newspaper as a nest of foreign agents and traitors. Journalists are alarmed. Supporters are delighted."
 smd_illiberal.1.f:0 "\"They were not elected,\" the leader said. \"I was.\""
 smd_illiberal.1.a:0 "Every word was true."
 smd_illiberal.1.b:0 "Perhaps a softer tone next time."
 smd_illiberal.2.t:0 "Hundreds of Thousands in the Streets"
 smd_illiberal.2.d:0 "Students, pensioners and workers have filled the capital's squares for a week, demanding an end to the government's assault on the institutions. The interior minister asks for permission to clear them."
 smd_illiberal.2.f:0 "They are banging pots and pans every evening at nine."
 smd_illiberal.2.a:0 "Clear the squares."
 smd_illiberal.2.b:0 "Make concessions to calm the streets."
 smd_illiberal.3.t:0 "Criticism from Our Partners"
 smd_illiberal.3.d:0 "Our partners in the power bloc have issued a joint statement criticising the erosion of judicial independence and press freedom in [ROOT.GetCountry.GetName], and are hinting at consequences."
 smd_illiberal.3.f:0 "The statement was drafted, our ambassador reports, with unusual speed."
 smd_illiberal.3.a:0 "We will not be lectured by foreigners."
 smd_illiberal.3.b:0 "Promise reforms to keep the peace."
 smd_illiberal.4.t:0 "The Regime Entrenched"
 smd_illiberal.4.d:0 "The courts, the media and the electoral commission all answer to the government now. The opposition still contests elections, and still loses them. Observers have a new phrase for what [ROOT.GetCountry.GetName] has become: competitive authoritarianism."
 smd_illiberal.4.f:0 "The result was announced before the polls had closed in the east."
 smd_illiberal.4.a:0 "Stability, at last."
 smd_illiberal.5.t:0 "The Institutions Held"
 smd_illiberal.5.d:0 "The leader who set out to bend the institutions has left office, and the institutions are still standing. Judges, journalists and ordinary citizens refused to give way. Democracy has proved more resilient than anyone expected."
 smd_illiberal.5.f:0 "The outgoing leader's farewell speech was carried live, unedited, by the channels he had tried to silence."
 smd_illiberal.5.a:0 "A hard lesson, well learned."
 smd_je_market_transition:0 "Transition to the Market"
 smd_je_market_transition_reason:0 "The planned economy is gone, but a market economy has not yet taken its place. Prices, property and finance must all be rebuilt from scratch, and the people who lived under the old system will judge the new one by what it does to their wages and savings."
 smd_je_market_transition_success_desc:0 "A functioning market economy has emerged. The transition was painful, but it is over."
 smd_je_market_transition_failure_desc:0 "The planned economy has been restored. The market experiment is over, for now."
 smd_je_market_transition_timeout_desc:0 "The transition has stalled halfway, leaving an economy that is neither planned nor free."
 smd_je_market_transition_success_tt:0 "The market transition is complete"
 smd_transition_bar:0 "Market Transition"
 smd_transition_bar_desc:0 "How far the economy has moved from central planning to markets."
 smd_transition_bar_shock:0 "Shock therapy"
 smd_transition_bar_gradual:0 "Gradual reform"
 smd_transition_bar_market_law:0 "Market economic system"
 smd_transition_bar_free_trade:0 "Free trade"
 smd_transition_bar_privatisation:0 "Privatisation wave"
 smd_transition_bar_cooperative:0 "Cooperative ownership"
 smd_transition_bar_unions:0 "Powerful and unhappy Trade Unions"
 smd_transition_bar_nostalgia:0 "Nostalgia for the old system"
 smd_transition_bar_default:0 "We are in default"
 smd_btn_transition_vouchers:0 "Voucher Privatisation"
 smd_btn_transition_vouchers_desc:0 "Give every citizen vouchers to buy shares in state enterprises."
 smd_btn_transition_asset_sales:0 "Sell the Crown Jewels"
 smd_btn_transition_asset_sales_desc:0 "Auction the largest state companies to private bidders. The treasury needs the money, and the bidders have it."
 smd_transition.1.t:0 "Shock or Gradualism?"
 smd_transition.1.d:0 "Our economists are divided. One camp, backed by Western advisers, wants to free prices, end subsidies and privatise everything at once: a short, sharp shock. The other wants a slower path that protects jobs and living standards while markets grow."
 smd_transition.1.f:0 "\"You cannot cross a chasm in two jumps,\" says one minister. \"You cannot cross it at all if the bridge collapses,\" replies another."
 smd_transition.1.a:0 "Shock therapy. Get it over with."
 smd_transition.1.b:0 "Gradual reform. Protect the people."
 smd_transition.3.t:0 "The Rise of the Oligarchs"
 smd_transition.3.d:0 "A handful of well connected businessmen have bought up privatisation vouchers by the million and now control vast industrial empires. They are buying newspapers and television stations next, and they have friends in the cabinet."
 smd_transition.3.f:0 "Five years ago he managed a cooperative. Now he owns a bank, two steel mills and a football club."
 smd_transition.3.a:0 "They are the new capitalists. Let them be."
 smd_transition.3.b:0 "Prosecute the worst of them."
 smd_transition.4.t:0 "Nostalgia for the Old Days"
 smd_transition.4.d:0 "Factories are closing, pensions are shrinking and crime is rising. Polls show a growing share of the public say life was better under the old system, and the old party is gaining ground."
 smd_transition.4.f:0 "Old portraits are reappearing in kitchens across the country."
 smd_transition.4.a:0 "Index pensions to inflation."
 smd_transition.5.t:0 "A Market Economy"
 smd_transition.5.d:0 "Private enterprise now produces most of our wealth, prices are set by markets and the currency is stable. The transition is over. What kind of capitalism we have built is a question for the next generation."
 smd_transition.5.f:0 "The last state planning office was converted into a shopping centre."
 smd_transition.5.a:0 "We made it."
 smd_transition.6.t:0 "Return of the Plan"
 smd_transition.6.d:0 "The market experiment has been abandoned. The state has reclaimed control of the economy, to the relief of some and the despair of others."
 smd_transition.6.f:0 "The planners have returned to their old offices. Some of the furniture never left."
 smd_transition.6.a:0 "Order restored."
 smd_je_left_turn:0 "The Left Turn"
 smd_je_left_turn_reason:0 "A government of the left has come to power promising to put the country's wealth to work for the many rather than the few. Business is nervous, the poor are hopeful, and the outside world is watching to see whether this will be social democracy or something more radical."
 smd_je_left_turn_success_desc:0 "The social programme has transformed the country. Poverty has fallen and a new social contract has taken hold."
 smd_je_left_turn_failure_desc:0 "The left has lost power before its programme could take root."
 smd_je_left_turn_timeout_desc:0 "The programme has run its course without fundamentally changing the country."
 smd_je_left_turn_success_tt:0 "The social programme is complete"
 smd_je_left_turn_failure_tt:0 "Our head of state is no longer a leader of the left"
 smd_leftturn_bar:0 "Social Programme"
 smd_leftturn_bar_desc:0 "How much of the government's social programme has been delivered."
 smd_left_bar_welfare:0 "Welfare laws"
 smd_left_bar_health:0 "Public health insurance"
 smd_left_bar_economy:0 "Interventionist economic system"
 smd_left_bar_missions:0 "Social missions"
 smd_left_bar_business_hostility:0 "Powerful and angry Industrialists"
 smd_left_bar_capital_flight:0 "Capital flight"
 smd_left_bar_default:0 "We are in default"
 smd_btn_left_social_missions:0 "Launch Social Missions"
 smd_btn_left_social_missions_desc:0 "Expand the health system and social security, and fund clinics, literacy drives and subsidised food in the poorest neighbourhoods."
 smd_leftturn.1.t:0 "A New Social Contract"
 smd_leftturn.1.d:0 "Our new government took office on a wave of hope from the poor and the working class. Now it must decide how far and how fast to go. Some ministers want a clean break with the market order. Others want to build a welfare state step by step."
 smd_leftturn.1.f:0 "The inauguration crowd stretched for three kilometres."
 smd_leftturn.1.a:0 "A radical programme. The time is now."
 smd_leftturn.1.b:0 "A moderate programme. Win the long game."
 smd_leftturn.2.t:0 "Resource Windfall"
 smd_leftturn.2.f:0 "Economists warn that the price will not stay high forever. Nobody is listening."
 smd_leftturn.2.a:0 "Spend it on the people."
 smd_leftturn.3.t:0 "A Business Lockout"
 smd_leftturn.3.d:0 "Business owners have shut factories and shops in protest at the government's policies, hoping to bring it to its knees. Workers want the government to seize the idle plants."
 smd_leftturn.3.f:0 "The supermarket shelves have been empty for nine days."
 smd_leftturn.3.a:0 "Seize the factories and reopen them."
 smd_leftturn.3.b:0 "Negotiate with the employers."
 smd_leftturn.4.t:0 "The Social State"
 smd_leftturn.4.d:0 "The government's social programme is complete. Millions have been lifted out of poverty, and a new generation has grown up with clinics, schools and pensions their parents never had."
 smd_leftturn.4.f:0 "Even the opposition now promises to keep the social missions."
 smd_leftturn.4.a:0 "A fairer country."
 smd_leftturn.5.t:0 "The Left Out of Power"
 smd_leftturn.5.d:0 "The left has lost power, and the new government is already reviewing its predecessor's programmes."
 smd_leftturn.5.f:0 "The new finance minister's first act was to call the IMF."
 smd_leftturn.5.a:0 "The pendulum swings."
 smd_je_fear_of_contagion:0 "Fear of Contagion"
 smd_je_fear_of_contagion_reason:0 "A neighbouring country has been overturned by civil war, and our own radicals have taken note. The #b [SCOPE.sPoliticalMovement('smd_contagion_movement').GetName]#! now has the sympathy of a large share of our population, and conservatives fear it could do here what was done next door. Whether panic or calm prevails depends on how we respond."
 smd_je_fear_of_contagion_success_desc:0 "The fear of contagion has faded. Life has returned to normal."
 smd_je_fear_of_contagion_failure_desc:0 "Panic has given way to emergency rule."
 smd_je_fear_of_contagion_timeout_desc:0 "The crisis across the border has receded, and with it our fears."
 smd_je_fear_of_contagion_success_tt:0 "Public Panic has fully subsided"
 smd_je_fear_of_contagion_failure_tt:0 "Public Panic has reached its peak"
 smd_contagion_bar:0 "Public Panic"
 smd_contagion_bar_desc:0 "How afraid the public and the establishment are that upheaval will spread to our country."
 smd_contagion_bar_decay:0 "Fears fade with time"
 smd_contagion_bar_radicals:0 "At least 15 percent of the population is radical"
 smd_contagion_bar_conservatives:0 "A powerful conservative Interest Group"
 smd_contagion_bar_free_speech:0 "Protected speech"
 smd_btn_contagion_crackdown:0 "Round Up the Dissidents"
 smd_btn_contagion_crackdown_desc:0 "Arrest the organisers and known sympathisers of the movement behind the unrest. It will lose supporters, but those who remain will be more radical."
 smd_btn_contagion_reassure:0 "Reassure the Public"
 smd_btn_contagion_reassure_desc:0 "Fund public information campaigns and visible security measures to calm the public and cool the movement's temper."
 smd_contagion.1.t:0 "Upheaval Across the Border"
 smd_contagion.1.d:0 "Civil war has torn through a neighbouring country, and news of the fighting crosses the border every day. At home, the #b [SCOPE.sPoliticalMovement('smd_contagion_movement').GetName]#! is drawing crowds. Generals, bishops and landowners are asking what the government intends to do about it."
 smd_contagion.1.f:0 "The evening news shows burning ministries less than a day's drive from our border."
 smd_contagion.2.t:0 "The Army Demands a Purge"
 smd_contagion.2.d:0 "Senior officers have presented the defence minister with a list of junior officers they suspect of sympathising with the #b [SCOPE.sPoliticalMovement('smd_contagion_movement').GetName]#!. They want them removed immediately."
 smd_contagion.2.f:0 "Several of the names on the list have no political views at all, only enemies."
 smd_contagion.2.a:0 "Remove them."
 smd_contagion.2.b:0 "We will not purge on suspicion alone."
 smd_contagion.3.t:0 "Emergency Rule?"
 smd_contagion.3.d:0 "Panic has reached the cabinet room. The security chiefs demand emergency powers to break the #b [SCOPE.sPoliticalMovement('smd_contagion_movement').GetName]#!: curfews, detention without trial and control of the press. They say it is the only way to prevent what happened next door."
 smd_contagion.3.f:0 "The decree is already drafted. It needs only a signature."
 smd_contagion.3.a:0 "Sign it and push the security law through."
 smd_contagion.3.b:0 "We will not govern by fear."
 smd_contagion.4.t:0 "Calm Returns"
 smd_contagion.4.d:0 "The upheaval next door has not spread. The #b [SCOPE.sPoliticalMovement('smd_contagion_movement').GetName]#! has lost its momentum, and the public's fears have faded."
 smd_contagion.4.f:0 "The checkpoints on the border roads were quietly removed last week."
 smd_contagion.4.a:0 "Good."
 smd_judicial_reform:0 "Judicial Reform"
 smd_judicial_reform_desc:0 "A programme to train judges and insulate the courts from politics."
 smd_civic_education:0 "Civic Education"
 smd_civic_education_desc:0 "A national programme teaching democratic values and institutions."
 smd_lustration:0 "Lustration"
 smd_lustration_desc:0 "Officials of the old regime have been barred from public office."
 smd_thick_line:0 "The Thick Line"
 smd_thick_line_desc:0 "The past has been set aside in the name of reconciliation."
 smd_annulled_election:0 "Annulled Election"
 smd_annulled_election_desc:0 "An election result has been annulled, damaging faith in the vote."
 smd_court_respected:0 "Court Ruling Respected"
 smd_court_respected_desc:0 "The government has accepted a court ruling against it."
 smd_court_defied:0 "Court Ruling Defied"
 smd_court_defied_desc:0 "The government has ignored a ruling of the constitutional court."
 smd_generals_retired:0 "Generals Retired"
 smd_generals_retired_desc:0 "Politically ambitious officers have been retired."
 smd_consolidated_democracy:0 "Consolidated Democracy"
 smd_consolidated_democracy_desc:0 "Democracy is firmly established and broadly accepted."
 smd_democratic_backsliding:0 "Democratic Backsliding"
 smd_democratic_backsliding_desc:0 "Faith in democratic institutions is eroding."
 smd_courts_packed_mod:0 "Packed Courts"
 smd_courts_packed_mod_desc:0 "The courts have been filled with government loyalists."
 smd_media_takeover:0 "Media Takeover"
 smd_media_takeover_desc:0 "The major media outlets are owned by friends of the government."
 smd_term_extension:0 "Term Limits Removed"
 smd_term_extension_desc:0 "The constitution has been changed to keep the leader in power."
 smd_mass_protests:0 "Mass Protests"
 smd_mass_protests_desc:0 "Large crowds are protesting against the government."
 smd_protest_crackdown:0 "Protest Crackdown"
 smd_protest_crackdown_desc:0 "Protesters have been forcibly dispersed."
 smd_foreign_criticism_defied:0 "Defiance of Foreign Criticism"
 smd_foreign_criticism_defied_desc:0 "The government has rejected foreign criticism, to applause at home and dismay abroad."
 smd_reform_pledge:0 "Reform Pledge"
 smd_reform_pledge_desc:0 "The government has promised its partners to restore democratic standards."
 smd_entrenched_regime:0 "Entrenched Regime"
 smd_entrenched_regime_desc:0 "The ruling faction controls every institution that might challenge it."
 smd_democratic_resilience:0 "Democratic Resilience"
 smd_democratic_resilience_desc:0 "Democratic institutions survived a determined assault."
 smd_shock_therapy:0 "Shock Therapy"
 smd_shock_therapy_desc:0 "Prices have been freed and subsidies ended overnight."
 smd_gradual_reform:0 "Gradual Reform"
 smd_gradual_reform_desc:0 "Markets are being introduced step by step."
 smd_privatisation_wave:0 "Privatisation Wave"
 smd_privatisation_wave_desc:0 "State enterprises are passing into private hands."
 smd_crony_privatisation:0 "Crony Privatisation"
 smd_crony_privatisation_desc:0 "State assets were sold cheaply to well connected insiders."
 smd_oligarch_influence:0 "Oligarch Influence"
 smd_oligarch_influence_desc:0 "A handful of tycoons wield enormous political power."
 smd_oligarchs_prosecuted:0 "Oligarchs Prosecuted"
 smd_oligarchs_prosecuted_desc:0 "The state has taken on the most powerful tycoons."
 smd_pension_indexation:0 "Pension Indexation"
 smd_pension_indexation_desc:0 "Pensions have been protected against inflation."
 smd_market_economy_established:0 "Market Economy Established"
 smd_market_economy_established_desc:0 "A functioning market economy has replaced central planning."
 smd_restoration:0 "Return of the Plan"
 smd_restoration_desc:0 "Central planning has been restored."
 smd_stalled_transition:0 "Stalled Transition"
 smd_stalled_transition_desc:0 "An economy caught halfway between plan and market."
 smd_radical_programme:0 "Radical Programme"
 smd_radical_programme_desc:0 "The government is pursuing a radical break with the market order."
 smd_moderate_programme:0 "Moderate Programme"
 smd_moderate_programme_desc:0 "The government is building a welfare state step by step."
 smd_capital_flight:0 "Capital Flight"
 smd_capital_flight_desc:0 "Investors are moving their money out of the country."
 smd_social_missions:0 "Social Missions"
 smd_social_missions_desc:0 "State funded clinics, schools and food programmes serve the poor."
 smd_factories_seized:0 "Factories Seized"
 smd_factories_seized_desc:0 "The state has taken over factories closed by their owners."
 smd_social_state:0 "The Social State"
 smd_social_state_desc:0 "A durable welfare state has been built."
 smd_left_reversal:0 "Programme Reversed"
 smd_left_reversal_desc:0 "The new government is rolling back its predecessor's social programmes."
 smd_army_purge:0 "Army Purge"
 smd_army_purge_desc:0 "Officers suspected of sympathising with the movement have been removed. The high command is satisfied."
 smd_emergency_powers:0 "Emergency Powers"
 smd_emergency_powers_desc:0 "The government rules by emergency decree."
 smd_emergency_refused:0 "Emergency Powers Refused"
 smd_emergency_refused_desc:0 "The government refused the security chiefs' demands, and they have not forgotten it."
 smd_je_rapid_urbanisation:0 "Rapid Urbanisation"
 smd_je_rapid_urbanisation_reason:0 "Millions are leaving the countryside for our cities in search of work. They arrive faster than housing, water or sewers can be built, and vast informal settlements are spreading around every major city. Whether this becomes the foundation of a modern economy or a permanent ring of slums depends on what we do now."
 smd_je_rapid_urbanisation_success_desc:0 "The great migration to the cities has been absorbed. The settlements have become neighbourhoods, and the new urban workforce is driving the economy."
 smd_je_rapid_urbanisation_failure_desc:0 "Our cities are ringed by vast slums without water, sanitation or law."
 smd_je_rapid_urbanisation_timeout_desc:0 "The pace of migration has slowed, leaving cities that are crowded but coping."
 smd_je_rapid_urbanisation_success_tt:0 "Urban Strain is almost gone"
 smd_je_rapid_urbanisation_failure_tt:0 "Urban Strain has reached its peak"
 smd_urban_bar:0 "Urban Strain"
 smd_urban_bar_desc:0 "The pressure that rapid migration puts on our cities' housing, water and services."
 smd_urban_bar_exodus:0 "Peasants are at least 40 percent of the population"
 smd_urban_bar_poverty:0 "Half the population of a state lives below expected living standards"
 smd_urban_bar_no_housing:0 "No public housing"
 smd_urban_bar_public_housing:0 "Public housing programme"
 smd_urban_bar_housing_projects:0 "Housing projects"
 smd_urban_bar_health:0 "Health system investment"
 smd_urban_bar_upgrading:0 "Slum upgrading programme"
 smd_btn_urban_upgrading:0 "Upgrade the Settlements"
 smd_btn_urban_upgrading_desc:0 "Bring water, sewers, electricity and land titles to the informal settlements, starting with new water works in our poorest state."
 smd_btn_urban_clearances:0 "Clear the Settlements"
 smd_btn_urban_clearances_desc:0 "Bulldoze the worst slums and move their residents to the edge of the city."
 smd_urban.1.t:0 "Fire in the Settlements"
 smd_urban.1.d:0 "A fire has swept through one of the capital's largest informal settlements, destroying thousands of homes built of wood and plastic. Survivors are camping in the streets."
 smd_urban.1.f:0 "The fire brigade could not get its engines through the alleys."
 smd_urban.1.a:0 "Fund relief and rebuilding."
 smd_urban.1.b:0 "They built there at their own risk."
 smd_urban.2.t:0 "The Informal Economy"
 smd_urban.2.d:0 "Street vendors, unlicensed taxis and backyard workshops now employ more of our urban poor than the formal economy does. Shopkeepers complain of unfair competition. Economists say it is the only thing keeping the cities fed."
 smd_urban.2.f:0 "Everything can be bought on the pavement outside the ministry of commerce."
 smd_urban.2.a:0 "Tolerate it. It keeps people working."
 smd_urban.2.b:0 "Enforce the licensing laws."
 smd_urban.3.t:0 "The Taps Run Dry"
 smd_urban.3.d:0 "The capital's water system, built for a city a third its size, has failed during a heatwave. Whole districts have been without water for days."
 smd_urban.3.f:0 "Tankers are selling water by the bucket at ten times the usual price."
 smd_urban.3.a:0 "Emergency investment in the waterworks."
 smd_urban.3.b:0 "Ration water until the rains come."
 smd_urban.4.t:0 "Cities That Work"
 smd_urban.4.d:0 "The settlements of a decade ago are now neighbourhoods with paved streets, schools and clinics. The children of migrants are clerks, engineers and nurses."
 smd_urban.4.f:0 "Tourist guides now take visitors to see the murals in what used to be the city's worst slum."
 smd_urban.4.a:0 "A modern nation."
 smd_urban.5.t:0 "The Megaslums"
 smd_urban.5.d:0 "Our cities have lost the race. Millions live in settlements the state does not reach, ruled by gangs and preachers, without water or sanitation."
 smd_urban.5.f:0 "Some districts do not appear on any official map."
 smd_urban.5.a:0 "We failed them."
 smd_je_cost_of_living:0 "Cost of Living Crisis"
 smd_je_cost_of_living_reason:0 "The price of bread, food or fuel has surged far above normal levels. For the poor, this is not an inconvenience but a crisis, and history shows that governments which cannot feed their people do not last."
 smd_je_cost_of_living_success_desc:0 "Prices have returned to normal and the anger has subsided."
 smd_je_cost_of_living_timeout_desc:0 "Prices have stayed high, but people have learned to live with them."
 smd_je_cost_of_living_prices_tt:0 "Bread, food and fuel prices are close to normal"
 smd_costliving_bar:0 "Street Anger"
 smd_costliving_bar_desc:0 "Public anger at the soaring cost of living."
 smd_costliving_bar_bread:0 "Grain is at least 40 percent above its base price"
 smd_costliving_bar_food:0 "Groceries are at least 40 percent above their base price"
 smd_costliving_bar_fuel:0 "Fuel is at least 40 percent above its base price"
 smd_costliving_bar_poverty:0 "Widespread poverty"
 smd_costliving_bar_easing:0 "Prices are easing"
 smd_costliving_bar_safety_net:0 "Social safety net"
 smd_btn_costliving_subsidies:0 "Subsidise Prices"
 smd_costliving.1.t:0 "Prices Soar"
 smd_costliving.1.d:0 "Prices for basic goods have surged. Families are skipping meals, taxi drivers cannot afford fuel, and the opposition is calling for protests. The government must respond."
 smd_costliving.1.f:0 "The price of a loaf has doubled since the spring."
 smd_costliving.2.t:0 "Bread Riots"
 smd_costliving.2.d:0 "Crowds have looted bakeries and food warehouses in several cities. The police are overstretched and the army is on standby."
 smd_costliving.2.f:0 "The rioters' chant is three words long: bread, work, dignity."
 smd_costliving.2.a:0 "Emergency food aid, now."
 smd_costliving.2.b:0 "Restore order by force."
 smd_costliving.3.t:0 "The Fuel Blockade"
 smd_costliving.3.d:0 "Truckers and farmers have blockaded refineries and motorways in protest at fuel prices. Supermarket shelves are emptying and petrol stations have run dry."
 smd_costliving.3.f:0 "A tractor convoy has parked outside the finance ministry."
 smd_costliving.3.b:0 "Send in the army to clear the roads."
 smd_je_language_question:0 "The Language Question"
 smd_je_language_question_success_desc:0 "The language question has been settled in a way both communities can live with."
 smd_je_language_question_failure_desc:0 "The language question has become a bitter and lasting divide."
 smd_je_language_question_timeout_desc:0 "The language question remains unresolved, but it no longer dominates politics."
 smd_je_language_question_success_tt:0 "Language Settlement is at its maximum"
 smd_je_language_question_failure_tt:0 "Language Settlement has collapsed"
 smd_language_bar:0 "Language Settlement"
 smd_language_bar_desc:0 "How close the majority and the minority are to a settled agreement on language."
 smd_language_bar_rights:0 "Minority language rights"
 smd_language_bar_bilingual:0 "Bilingual schools"
 smd_language_bar_content:0 "Few radicals in the minority"
 smd_language_bar_assimilating:0 "The minority is assimilating"
 smd_language_bar_radicalised:0 "At least 25 percent of the minority is radical"
 smd_language_bar_resentment:0 "Resentment of assimilation policy"
 smd_language_bar_riots:0 "Language riots"
 smd_language.1.t:0 "One Language or Many?"
 smd_language.1.d:0 "The [SCOPE.sCulture('smd_language_minority').GetName] minority is demanding the right to use its own language in schools, courts and local government. Nationalists insist that one country must have one language."
 smd_language.1.f:0 "A bill on the state language has been tabled in parliament. Both sides have promised to fill the streets."
 smd_language.1.a:0 "One nation, one language."
 smd_language.1.b:0 "Recognise minority language rights."
 smd_language.2.t:0 "The Schools Row"
 smd_language.2.d:0 "Parents in minority areas want their children taught in their own language. Majority parents fear their children will be disadvantaged. The education ministry must decide."
 smd_language.2.f:0 "Some schools are teaching two curricula in alternate weeks."
 smd_language.2.a:0 "Fund bilingual schooling."
 smd_language.2.b:0 "Teach in the majority language only."
 smd_language.3.t:0 "Trouble Over the Signs"
 smd_language.3.d:0 "Activists have been painting over majority language road signs in minority areas, and nationalists have been painting them back. Last night the confrontation turned violent."
 smd_language.3.f:0 "Some signposts now carry four layers of paint."
 smd_language.3.a:0 "Open a dialogue with community leaders."
 smd_language.3.b:0 "Let the police restore order."
 smd_language.4.t:0 "The Language Settlement"
 smd_language.4.f:0 "The new road signs are in both languages. Nobody has painted over them."
 smd_language.4.a:0 "Unity in diversity."
 smd_language.5.t:0 "A Divided Country"
 smd_language.5.f:0 "In the border towns, you can tell which side of the street someone lives on by how they say good morning."
 smd_language.5.a:0 "A wound that will not heal."
 smd_slum_upgrading:0 "Settlement Upgrading"
 smd_slum_upgrading_desc:0 "Water, sewers and land titles are reaching the informal settlements."
 smd_slum_clearances:0 "Slum Clearances"
 smd_slum_clearances_desc:0 "Informal settlements are being demolished and their residents moved."
 smd_shanty_fire_relief:0 "Fire Relief"
 smd_shanty_fire_relief_desc:0 "The state is helping victims of a settlement fire."
 smd_shanty_fire_neglect:0 "Fire Victims Abandoned"
 smd_shanty_fire_neglect_desc:0 "Victims of a settlement fire were left to fend for themselves."
 smd_informal_economy_tolerated:0 "Informal Economy Tolerated"
 smd_informal_economy_tolerated_desc:0 "Street trade and unlicensed businesses keep the urban poor afloat."
 smd_informal_economy_crackdown:0 "Informal Economy Crackdown"
 smd_informal_economy_crackdown_desc:0 "Licensing laws are being strictly enforced."
 smd_water_rationing:0 "Water Rationing"
 smd_water_rationing_desc:0 "Water is being rationed in the cities."
 smd_managed_urbanisation:0 "Managed Urbanisation"
 smd_managed_urbanisation_desc:0 "Our cities have successfully absorbed a generation of migrants."
 smd_megaslums:0 "Megaslums"
 smd_megaslums_desc:0 "Vast slums beyond the reach of the state surround our cities."
 smd_price_controls_blamed:0 "Speculators Blamed"
 smd_price_controls_blamed_desc:0 "The government has blamed traders and speculators for high prices."
 smd_bread_riots_crushed:0 "Bread Riots Crushed"
 smd_bread_riots_crushed_desc:0 "Food riots were put down by force."
 smd_emergency_food_aid:0 "Emergency Food Aid"
 smd_emergency_food_aid_desc:0 "The state is distributing food to the hungry."
 smd_blockade_broken:0 "Blockade Broken"
 smd_blockade_broken_desc:0 "Troops cleared fuel protesters from the roads."
 smd_language_assimilation_policy:0 "One Nation, One Language"
 smd_language_assimilation_policy_desc:0 "The majority language is the only language of the state."
 smd_language_rights_policy:0 "Minority Language Rights"
 smd_language_rights_policy_desc:0 "Minority languages are recognised in schools, courts and local government."
 smd_bilingual_schools:0 "Bilingual Schools"
 smd_bilingual_schools_desc:0 "Children are taught in both the majority and minority languages."
 smd_majority_language_schools:0 "Majority Language Schools"
 smd_majority_language_schools_desc:0 "All schooling is in the majority language."
 smd_language_riots:0 "Language Riots"
 smd_language_riots_desc:0 "Clashes over language have turned violent."
 smd_language_dialogue:0 "Language Dialogue"
 smd_language_dialogue_desc:0 "The government is in dialogue with minority community leaders."
 smd_language_settled:0 "Language Settlement"
 smd_language_settled_desc:0 "A lasting settlement on language has been reached."
 smd_language_conflict:0 "Language Conflict"
 smd_language_conflict_desc:0 "Language has become a lasting source of division."
 smd_je_devolution_success_tt:0 "Regional Tension has subsided"
 smd_je_devolution_failure_tt:0 "Regional Tension has reached its peak"
 smd_devolution_bar:0 "Regional Tension"
 smd_devolution_bar_desc:0 "How strongly the region demands to govern itself."
 smd_devolution_bar_turmoil:0 "Turmoil in the region"
 smd_devolution_bar_radicals:0 "At least 20 percent of the region is radical"
 smd_devolution_bar_recentralised:0 "Recentralisation"
 smd_devolution_bar_assembly:0 "A devolved assembly"
 smd_devolution_bar_talks:0 "Ongoing talks"
 smd_devolution_bar_legitimacy:0 "Government Legitimacy of at least 50"
 smd_btn_devolution_assembly:0 "Grant a Devolved Assembly"
 smd_btn_devolution_assembly_desc:0 "Give the region its own parliament with powers over education, health and culture."
 smd_btn_devolution_talks:0 "Open Talks with Regional Leaders"
 smd_btn_devolution_talks_desc:0 "Sit down with the region's elected leaders for a year of negotiations."
 smd_btn_devolution_recentralise:0 "Recentralise"
 smd_btn_devolution_recentralise_desc:0 "Abolish the region's existing privileges and govern it directly from the capital. It will quiet things, for a while."
 smd_devolution.1.t:0 "A Regional Landslide"
 smd_devolution.1.d:0 "A party campaigning for self rule has swept the local elections in [SCOPE.sState('smd_devolution_state').GetName]. Its leader says the result is a mandate to negotiate a new relationship with the capital."
 smd_devolution.1.f:0 "The victory rally was held entirely in the regional language."
 smd_devolution.1.a:0 "We will hear them out."
 smd_devolution.2.t:0 "A Dispute with the Region"
 smd_devolution.2.d:0 "Leaders in [SCOPE.sState('smd_devolution_state').GetName] are demanding control over regional taxes and schools. Nationalists in the capital say any concession is the first step towards breaking up the country."
 smd_devolution.2.f:0 "Both sides have published maps. They do not agree on what is drawn on them."
 smd_devolution.2.a:0 "Offer a compromise."
 smd_devolution.2.b:0 "Refuse. The constitution is clear."
 smd_devolution.3.t:0 "A Settled Question"
 smd_devolution.3.f:0 "The regional flag and the national flag now fly side by side over the town halls."
 smd_devolution.3.a:0 "Unity through diversity."
 smd_devolution.4.t:0 "A Separatist Crisis"
 smd_devolution.4.f:0 "The independence movement's slogan is painted on every bridge in the region."
 smd_devolution.4.a:0 "This is a crisis for the whole nation."
 smd_je_brain_drain:0 "Brain Drain"
 smd_je_brain_drain_reason:0 "Our doctors, engineers and scientists are leaving for better paid jobs abroad. Every graduate who emigrates takes with them an education the country paid for, and leaves a gap that will take years to fill."
 smd_je_brain_drain_success_desc:0 "The exodus has reversed. Talent is returning home and staying."
 smd_je_brain_drain_failure_desc:0 "A generation of skilled workers has left, and they are not coming back."
 smd_je_brain_drain_timeout_desc:0 "Emigration has slowed as conditions at home and abroad have changed."
 smd_je_brain_drain_success_tt:0 "Brain Drain has been almost eliminated"
 smd_je_brain_drain_failure_tt:0 "Brain Drain has reached its peak"
 smd_braindrain_bar:0 "Brain Drain"
 smd_braindrain_bar_desc:0 "How quickly our skilled workers are emigrating."
 smd_braindrain_bar_free_movement:0 "Free movement within our power bloc"
 smd_braindrain_bar_poverty:0 "Widespread poverty"
 smd_braindrain_bar_open_borders:0 "No migration controls"
 smd_braindrain_bar_prosperity:0 "Living standards meet expectations"
 smd_braindrain_bar_universities:0 "A major university"
 smd_braindrain_bar_diaspora:0 "Diaspora return incentives"
 smd_braindrain_bar_research:0 "Research funding"
 smd_btn_braindrain_diaspora:0 "Diaspora Return Incentives"
 smd_btn_braindrain_diaspora_desc:0 "Offer tax breaks and housing to professionals who come home."
 smd_btn_braindrain_research:0 "Fund Research and Universities"
 smd_btn_braindrain_research_desc:0 "Fund our laboratories and build a new university in the capital to give our scientists a reason to stay."
 smd_braindrain.1.t:0 "The Doctors Are Leaving"
 smd_braindrain.1.d:0 "Our hospitals report that a third of last year's medical graduates have already left for jobs abroad, where they earn five times as much. Rural clinics are closing for lack of staff."
 smd_braindrain.1.f:0 "The recruitment agencies set up stalls outside the medical schools on graduation day."
 smd_braindrain.1.a:0 "Raise doctors' pay."
 smd_braindrain.1.b:0 "We cannot compete with foreign salaries."
 smd_braindrain.2.t:0 "Money from Abroad"
 smd_braindrain.2.d:0 "Remittances from our citizens working abroad have become one of the country's largest sources of income. Whole villages are living on money sent home from foreign cities."
 smd_braindrain.2.f:0 "The new houses in the villages are built in the style of the countries that paid for them."
 smd_braindrain.2.a:0 "Every cloud has a silver lining."
 smd_braindrain.3.t:0 "The Return of the Entrepreneurs"
 smd_braindrain.3.d:0 "A wave of emigrants who made their fortunes abroad are coming home to start businesses, bringing capital, skills and contacts with them."
 smd_braindrain.3.f:0 "The new technology park is staffed almost entirely by returnees."
 smd_braindrain.3.a:0 "Welcome home."
 smd_braindrain.4.t:0 "Brain Gain"
 smd_braindrain.4.d:0 "The tide has turned. Our graduates are staying, our emigrants are returning, and foreign talent is starting to arrive."
 smd_braindrain.4.f:0 "This year, more doctors arrived at the airport than left from it."
 smd_braindrain.4.a:0 "A country worth staying in."
 smd_braindrain.5.t:0 "Hollowed Out"
 smd_braindrain.5.d:0 "A generation of our most skilled citizens has left. Hospitals, universities and laboratories are half empty, and those who remain are mostly too old to leave."
 smd_braindrain.5.f:0 "The last person to leave, the joke goes, should turn out the lights."
 smd_braindrain.5.a:0 "We will feel this for decades."
 smd_je_anti_corruption:0 "Clean Hands"
 smd_je_anti_corruption_reason:0 "A corruption scandal reaching into the heart of government has broken. Prosecutors are following the money, and every week brings new arrests and new names. Will the investigation clean up public life, or will it be buried?"
 smd_je_anti_corruption_success_desc:0 "The investigation has run its course. Dozens of politicians and businessmen have been convicted, and public life is cleaner than it has been in decades."
 smd_je_anti_corruption_failure_desc:0 "The investigation was buried. Everyone knows it, and nobody trusts the government any more."
 smd_je_anti_corruption_timeout_desc:0 "The investigation has lost momentum and the public has lost interest."
 smd_je_anti_corruption_success_tt:0 "The investigation is complete"
 smd_je_anti_corruption_failure_tt:0 "The government has obstructed the investigation and it has collapsed"
 smd_corruption_bar:0 "Investigation"
 smd_corruption_bar_desc:0 "How far the prosecutors have got in uncovering the corruption."
 smd_corruption_bar_courts:0 "Court investment"
 smd_corruption_bar_courts_strong:0 "High court investment"
 smd_corruption_bar_judiciary:0 "Independent judiciary"
 smd_corruption_bar_press:0 "A free press"
 smd_corruption_bar_prosecutor:0 "Special prosecutor"
 smd_corruption_bar_weak_courts:0 "Customary or religious courts"
 smd_corruption_bar_obstruction:0 "Investigation obstructed"
 smd_btn_corruption_prosecutor:0 "Appoint a Special Prosecutor"
 smd_btn_corruption_prosecutor_desc:0 "Expand the courts and give an independent prosecutor the staff and powers to follow the money wherever it leads."
 smd_btn_corruption_obstruct:0 "Obstruct the Investigation"
 smd_btn_corruption_obstruct_desc:0 "Transfer the prosecutors, lose the files and protect our friends. If it works, nobody will ever know. If it fails, everyone will."
 smd_corruption.1.t:0 "Scandal Breaks"
 smd_corruption.1.d:0 "Prosecutors have uncovered a vast system of kickbacks linking public contracts, party financing and senior ministers. The newspapers are calling it the biggest scandal in our history."
 smd_corruption.1.f:0 "The first arrest was a minor official. He started talking within an hour."
 smd_corruption.1.a:0 "Implicated ministers must resign."
 smd_corruption.1.b:0 "These are baseless accusations."
 smd_corruption.2.t:0 "A Minister in Handcuffs"
 smd_corruption.2.d:0 "Investigators have arrested a sitting minister on charges of taking bribes. The image of a cabinet member being led away by police is on every front page."
 smd_corruption.2.f:0 "He was arrested on his way to a cabinet meeting about government transparency."
 smd_corruption.2.a:0 "Nobody is above the law."
 smd_corruption.3.t:0 "Prosecutors Threatened"
 smd_corruption.3.d:0 "The lead prosecutor in the corruption investigation has received death threats, and a car bomb was found near her home. She is asking for protection."
 smd_corruption.3.f:0 "She went to work the next morning as usual."
 smd_corruption.3.a:0 "Give her round the clock protection."
 smd_corruption.3.b:0 "The police are stretched thin already."
 smd_corruption.4.t:0 "Clean Hands"
 smd_corruption.4.d:0 "The great corruption investigation is over. Ministers, party treasurers and business leaders have been convicted, and the old parties have been swept away. Something new and cleaner is taking their place."
 smd_corruption.4.f:0 "The prosecutors are the most popular public figures in the country."
 smd_corruption.4.a:0 "A new beginning."
 smd_corruption.5.t:0 "The Cover Up Exposed"
 smd_corruption.5.d:0 "The investigation has collapsed, and documents leaked to the press show exactly how the government buried it. Public trust in politics has hit rock bottom."
 smd_corruption.5.f:0 "The leaked memo was titled 'Damage Limitation'."
 smd_corruption.5.a:0 "A dark day."
 smd_je_veterans:0 "Coming Home"
 smd_je_veterans_reason:0 "A long and bloody war is over and our soldiers are coming home. Many return wounded, traumatised or unemployed. How the country treats them will shape the army's loyalty and the nation's memory of the war."
 smd_je_veterans_success_desc:0 "Our veterans have found their place in civilian life."
 smd_je_veterans_failure_desc:0 "Neglected veterans have become a bitter and organised political force."
 smd_je_veterans_timeout_desc:0 "The war is fading from memory, and so are its veterans."
 smd_je_veterans_success_tt:0 "Veterans' Grievances have been resolved"
 smd_je_veterans_failure_tt:0 "Veterans' Grievances have reached their peak"
 smd_veterans_bar:0 "Veterans' Grievances"
 smd_veterans_bar_desc:0 "How angry returning soldiers are at their treatment."
 smd_veterans_bar_time:0 "Time heals"
 smd_veterans_bar_army:0 "An unhappy army"
 smd_veterans_bar_no_welfare:0 "No social security"
 smd_veterans_bar_welfare:0 "Social safety net"
 smd_veterans_bar_health:0 "Health system investment"
 smd_veterans_bar_benefits:0 "Veterans' benefits"
 smd_btn_veterans_benefits:0 "Pass a Veterans' Benefits Act"
 smd_btn_veterans_benefits_desc:0 "Fund pensions, healthcare and job training for those who served."
 smd_btn_veterans_memorial:0 "Build a War Memorial"
 smd_btn_veterans_memorial_desc:0 "Honour the fallen with a national memorial."
 smd_veterans.1.t:0 "The Soldiers Return"
 smd_veterans.1.d:0 "The first units are returning from the front. Crowds have gathered at the stations, and the defence ministry proposes a parade through the capital to welcome them home."
 smd_veterans.1.f:0 "Mothers are holding up photographs, searching the faces of the men stepping off the trains."
 smd_veterans.1.a:0 "Hold a homecoming parade."
 smd_veterans.2.t:0 "Veterans Protest"
 smd_veterans.2.d:0 "Hundreds of unemployed veterans have marched on the defence ministry demanding jobs and the pensions they were promised."
 smd_veterans.2.f:0 "They marched in their old uniforms, medals pinned to their chests."
 smd_veterans.2.a:0 "Create a job programme for veterans."
 smd_veterans.2.b:0 "There is no money."
 smd_veterans.3.t:0 "A Mysterious Illness"
 smd_veterans.3.d:0 "Thousands of returning soldiers report headaches, fatigue and memory problems that doctors cannot explain. Veterans' groups blame chemicals used during the war. The defence ministry denies any link."
 smd_veterans.3.f:0 "The veterans call it simply 'the sickness'."
 smd_veterans.3.a:0 "Fund research and treatment."
 smd_veterans.3.b:0 "There is no evidence of a link."
 smd_veterans.4.t:0 "Welcome Home"
 smd_veterans.4.d:0 "Our veterans have found jobs, homes and the respect they earned. The army is proud of how the country has treated its soldiers."
 smd_veterans.4.f:0 "The veterans' association now runs its own businesses and sports clubs."
 smd_veterans.4.a:0 "They served us well."
 smd_veterans.5.t:0 "The Veterans' Movement"
 smd_veterans.5.d:0 "Bitter and neglected, our veterans have organised into a political movement that blames the government for betraying them. Many officers sympathise."
 smd_veterans.5.f:0 "Their leader is a decorated colonel with political ambitions."
 smd_veterans.5.a:0 "We have made dangerous enemies."
 smd_devolved_assembly:0 "Devolved Assembly"
 smd_devolved_assembly_desc:0 "This region has its own parliament with powers over local affairs."
 smd_devolution_backlash:0 "Devolution Backlash"
 smd_devolution_backlash_desc:0 "Nationalists and the army resent the concessions made to the region."
 smd_recentralised_state:0 "Recentralised"
 smd_recentralised_state_desc:0 "This region has lost its privileges and is governed directly from the capital."
 smd_regional_party_wins:0 "Regional Party in Power"
 smd_regional_party_wins_desc:0 "A party demanding self rule governs this region."
 smd_regional_compromise:0 "Regional Compromise"
 smd_regional_compromise_desc:0 "The government has made financial concessions to the region."
 smd_regional_hardline:0 "Regional Demands Refused"
 smd_regional_hardline_desc:0 "The government has refused the region's demands."
 smd_devolution_settlement:0 "Regional Settlement"
 smd_devolution_settlement_desc:0 "The question of regional self rule has been settled."
 smd_separatist_crisis:0 "Separatist Crisis"
 smd_separatist_crisis_desc:0 "A separatist movement threatens the unity of the country."
 smd_diaspora_incentives:0 "Diaspora Incentives"
 smd_diaspora_incentives_desc:0 "Tax breaks and housing tempt emigrants home."
 smd_research_funding:0 "Research Funding"
 smd_research_funding_desc:0 "Generous funding keeps our scientists at home."
 smd_doctors_pay_rise:0 "Doctors' Pay Rise"
 smd_doctors_pay_rise_desc:0 "Higher pay is keeping doctors in the country."
 smd_doctors_leave:0 "Doctors Emigrating"
 smd_doctors_leave_desc:0 "Doctors are leaving for jobs abroad."
 smd_remittance_boom:0 "Remittance Boom"
 smd_remittance_boom_desc:0 "Money sent home by emigrants supports many families."
 smd_returning_entrepreneurs:0 "Returning Entrepreneurs"
 smd_returning_entrepreneurs_desc:0 "Emigrants are returning with capital and ideas."
 smd_brain_gain:0 "Brain Gain"
 smd_brain_gain_desc:0 "Talent is flowing into the country rather than out."
 smd_hollowed_out:0 "Hollowed Out"
 smd_hollowed_out_desc:0 "A generation of skilled workers has emigrated."
 smd_special_prosecutor:0 "Special Prosecutor"
 smd_special_prosecutor_desc:0 "An independent prosecutor is investigating corruption."
 smd_investigation_obstructed:0 "Investigation Obstructed"
 smd_investigation_obstructed_desc:0 "The government is protecting its friends from prosecution."
 smd_scandal_resignations:0 "Scandal Resignations"
 smd_scandal_resignations_desc:0 "Ministers have resigned over a corruption scandal."
 smd_scandal_defiance:0 "Scandal Defiance"
 smd_scandal_defiance_desc:0 "The government refuses to accept responsibility for corruption."
 smd_minister_arrested:0 "Minister Arrested"
 smd_minister_arrested_desc:0 "A sitting minister has been arrested for corruption."
 smd_prosecutors_intimidated:0 "Prosecutors Intimidated"
 smd_prosecutors_intimidated_desc:0 "Prosecutors have been left exposed to threats."
 smd_clean_government:0 "Clean Government"
 smd_clean_government_desc:0 "A great anti corruption drive has cleaned up public life."
 smd_party_system_shaken:0 "Party System Shaken"
 smd_party_system_shaken_desc:0 "The old governing parties have been discredited by scandal."
 smd_cover_up_exposed:0 "Cover Up Exposed"
 smd_cover_up_exposed_desc:0 "The government was caught burying a corruption investigation."
 smd_victory_parade:0 "Homecoming Parade"
 smd_victory_parade_desc:0 "The returning troops were welcomed home with a parade through the capital."
 smd_veterans_benefits:0 "Veterans' Benefits"
 smd_veterans_benefits_desc:0 "Veterans receive pensions, healthcare and training."
 smd_war_memorial:0 "War Memorial"
 smd_war_memorial_desc:0 "A national memorial honours those who fell."
 smd_veterans_ignored:0 "Veterans Ignored"
 smd_veterans_ignored_desc:0 "The government has turned its back on returning soldiers."
 smd_war_syndrome_research:0 "War Syndrome Research"
 smd_war_syndrome_research_desc:0 "Doctors are studying the illnesses affecting returning soldiers."
 smd_war_syndrome_denied:0 "War Syndrome Denied"
 smd_war_syndrome_denied_desc:0 "The government denies any link between the war and veterans' illnesses."
 smd_veterans_reintegrated:0 "Veterans Reintegrated"
 smd_veterans_reintegrated_desc:0 "Returning soldiers have found their place in civilian life."
 smd_veterans_movement:0 "Veterans' Movement"
 smd_veterans_movement_desc:0 "Angry veterans have become an organised political force."
 smd_btn_crime_task_force_desc:0 "Fund an elite unit of investigators, prosecutors and witness protection officers for two years, and raise police funding by one level."
 smd_costliving_bar_subsidies:0 "Subventions on grain, groceries or fuel"
 smd_costliving.3.a:0 "Subsidise fuel at the pump."
 smd_je_crime_wave_reason:0 "Years of unrest have let organised crime put down roots in [ROOT.GetCountry.GetCustom('smd_crime_states_list')]. Protection rackets, contract killings and gang wars have become part of daily life, and every month we wait the networks grow more entrenched.\n\nInvest in the police and the courts, and decide how hard the state is willing to hit back. If calm returns to these regions quickly, the gangs will lose their hold on their own."
 smd_je_crime_wave_invalid_desc:0 "Turmoil has receded in the affected regions, and the gangs have lost the disorder they fed on."
 smd_crime_states_list_1:0 "[ROOT.Var('smd_crime_state_1').GetState.GetName]"
 smd_crime_states_list_2:0 "[ROOT.Var('smd_crime_state_1').GetState.GetName] and [ROOT.Var('smd_crime_state_2').GetState.GetName]"
 smd_crime_states_list_3:0 "[ROOT.Var('smd_crime_state_1').GetState.GetName], [ROOT.Var('smd_crime_state_2').GetState.GetName] and [ROOT.Var('smd_crime_state_3').GetState.GetName]"
 smd_crime_states_list_many:0 "[ROOT.Var('smd_crime_state_1').GetState.GetName], [ROOT.Var('smd_crime_state_2').GetState.GetName], [ROOT.Var('smd_crime_state_3').GetState.GetName] and [ROOT.GetCountry.MakeScope.ScriptValue('smd_crime_state_others')|0] other states"
 smd_crime_states_list_none:0 "our most troubled regions"
 smd_crime_bar_turmoil:0 "Turmoil of at least 30 percent in an affected state"
 smd_crime_bar_spread:0 "Organised crime has spread to three or more states"
 smd_crime_bar_calming:0 "No affected state has turmoil above 20 percent"
 smd_crime.3.b:0 "Shield the police from scrutiny."
 smd_crime_police_shielded:0 "Police Shielded"
 smd_crime_police_shielded_desc:0 "The government closed ranks around corrupt officers, and everyone noticed."
 smd_crime.4.t:0 "Gang War in [SCOPE.sState('smd_crime_hotspot').GetName]"
 smd_crime.4.d:0 "Two rival syndicates are fighting for control of the markets and ports of [SCOPE.sState('smd_crime_hotspot').GetName]. Shootouts in broad daylight have killed bystanders, and residents are afraid to leave their homes after dark."
 smd_crime.4.a:0 "Deploy the army to the streets of [SCOPE.sState('smd_crime_hotspot').GetName]."
 smd_btn_costliving_subsidies_tt:0 "Sets #v Low Subventions#! on imports of #v Grain#!, #v Groceries#! and #v Refined Fuel#!. The state pays part of the price, so more supply reaches our market and prices fall. Subventions cost money every week until you remove them in the market panel."
 smd_btn_costliving_rationing:0 "Introduce Rationing"
 smd_btn_costliving_rationing_desc:0 "Limit how much each family may buy and stop grain and groceries from leaving the country, so that everyone gets something."
 smd_btn_costliving_rationing_tt:0 "Sets #v High Tariffs#! on exports of #v Grain#! and #v Groceries#!, keeping more of our harvest on the home market. The tariffs stay until you change them in the market panel."
 smd_costliving_bar_rationing:0 "Rationing"
 smd_rationing:0 "Rationing"
 smd_rationing_desc:0 "Shopkeepers and farmers resent ration cards and export bans."
 smd_costliving.1.a:0 "Blame the speculators and middlemen."
 smd_costliving.1.b:0 "Appeal for calm. Prices will settle."
 smd_costliving.3.a_tt:0 "Sets #v Low Subventions#! on imports of #v Refined Fuel#!"
 smd_costliving.3.c:0 "Let the blockade burn itself out."
 smd_je_cost_of_living_failure_desc:0 "Anger over prices has spilled into a mass protest movement."
 smd_je_cost_of_living_failure_tt:0 "Street Anger has reached its peak"
 smd_costliving.4.t:0 "The Streets Rise"
 smd_costliving.4.d:0 "What began as protests over the price of bread has become something larger. Neighbourhood committees, unions and student groups are coordinating marches in every city, and their demands have moved on from prices to the government itself. Movements that were fringe a year ago are signing up members by the thousand."
 smd_costliving.4.f:0 "Somebody has painted the price of a loaf on the wall of the finance ministry, with a question mark beside it."
 smd_costliving.4.a:0 "We must weather the storm."
 smd_street_revolt:0 "Streets in Revolt"
 smd_street_revolt_desc:0 "Anger over the cost of living has turned into a mass movement. Radicals are multiplying and political movements are drawing in ordinary people at an alarming rate."
 smd_je_language_question_reason:0 "[ROOT.GetCountry.GetCustom('smd_language_minority_name')] speakers make up a large share of our citizens, and a growing number of them feel the state does not speak their language. Which language our schools teach, our courts use and our signs display has become a defining political question.[ROOT.GetCountry.GetCustom('smd_language_other_minorities')]"
 smd_language_minority_name_known:0 "[ROOT.Var('smd_language_minority').GetCulture.GetName]"
 smd_language_minority_name_unknown:0 "Minority language"
 smd_language_others_1:0 "\n\nThe [ROOT.Var('smd_language_other_1').GetCulture.GetName] community is watching closely, because whatever we decide will set the rules for them too."
 smd_language_others_2:0 "\n\nThe [ROOT.Var('smd_language_other_1').GetCulture.GetName] and [ROOT.Var('smd_language_other_2').GetCulture.GetName] communities are watching closely, because whatever we decide will set the rules for them too."
 smd_language_others_many:0 "\n\nThe [ROOT.Var('smd_language_other_1').GetCulture.GetName], [ROOT.Var('smd_language_other_2').GetCulture.GetName] and other minority communities are watching closely, because whatever we decide will set the rules for them too."
 smd_language_others_none:0 ""
 smd_language.4.d:0 "After years of argument, a settlement on the status of the [SCOPE.sCulture('smd_language_minority').GetName] language has been reached that both communities can accept. The issue has faded from the front pages."
 smd_language.5.d:0 "The [SCOPE.sCulture('smd_language_minority').GetName] language question has hardened into a permanent divide. The two communities attend different schools, read different newspapers and vote for different parties."
 smd_je_devolution:0 "Demands for Self Rule in [ROOT.GetCountry.GetCustom('smd_devolution_region')]"
 smd_devolution_region_known:0 "[ROOT.Var('smd_devolution_state').GetState.GetName]"
 smd_devolution_region_unknown:0 "the Regions"
 smd_devolution_people_known:0 "[ROOT.Var('smd_devolution_culture').GetCulture.GetName]"
 smd_devolution_people_unknown:0 "regional"
 smd_je_devolution_reason:0 "[ROOT.GetCountry.GetCustom('smd_devolution_region')] has its own language and its own history, and its [ROOT.GetCountry.GetCustom('smd_devolution_people')] majority is demanding more control over its own affairs. Some want a regional parliament. A few want independence. How we answer will decide whether [ROOT.GetCountry.GetCustom('smd_devolution_region')] stays with us willingly."
 smd_je_devolution_success_desc:0 "Tensions in [ROOT.GetCountry.GetCustom('smd_devolution_region')] have eased. The region's place within the country is settled, for this generation at least."
 smd_je_devolution_failure_desc:0 "Grievances in [ROOT.GetCountry.GetCustom('smd_devolution_region')] have hardened into a full blown separatist crisis."
 smd_je_devolution_invalid_desc:0 "[ROOT.GetCountry.GetCustom('smd_devolution_region')] is no longer part of our country."
 smd_je_devolution_timeout_desc:0 "Self rule for [ROOT.GetCountry.GetCustom('smd_devolution_region')] has faded from the headlines without being settled."
 smd_devolution.3.d:0 "Tensions in [SCOPE.sState('smd_devolution_state').GetName] have faded. Whether through self rule or simply time, its people have made their peace with their place in [ROOT.GetCountry.GetName]."
 smd_devolution.4.d:0 "In [SCOPE.sState('smd_devolution_state').GetName], talk of autonomy has given way to talk of independence. Mass rallies fill the regional capital, and its leaders say they will hold a referendum whether the government permits it or not."
 smd_btn_left_nationalise:0 "Launch a Nationalisation Programme"
 smd_btn_left_nationalise_desc:0 "Prepare the legal and financial ground to bring oil, gas and mining into public hands. Compensation will be cheaper and resistance weaker for the next five years, but investors will take fright."
 smd_btn_left_nationalise_how_tt:0 "Use the #v Nationalize#! action on resource buildings to bring them under state ownership. Majority state ownership of a resource industry advances the #v Left Turn#!."
 smd_btn_left_nationalise_law_tt:0 "Our economic system permits nationalisation"
 smd_left_bar_nationalised:0 "A resource industry is majority state owned"
 smd_nationalisation_programme:0 "Nationalisation Programme"
 smd_nationalisation_programme_desc:0 "The state is preparing to take the resource industries into public ownership."
 smd_leftturn.2.d:0 "High world prices are filling the state treasury with revenue from our state owned oil and gas industry. The money is pouring into social programmes."
 smd_contagion.1.a:0 "Put the movement under watch."
 smd_contagion.1.b:0 "We must stay calm."
 smd_veterans.1.b:0 "Let them return quietly to their families."
 smd_transition.4.b:0 "They will thank us in ten years."
 smd_softer_tone:0 "A Softer Tone"
 smd_softer_tone_desc:0 "The government stepped back from its attack on the press, to the relief of journalists and the disappointment of its own supporters."
 smd_protest_concessions:0 "Protest Concessions"
 smd_protest_concessions_desc:0 "The government gave ground to the crowds in the squares, and everyone saw it blink."
 smd_lockout_settlement:0 "Lockout Settlement"
 smd_lockout_settlement_desc:0 "The government bought an end to the lockout with concessions that the unions call a betrayal."
 smd_alarm_dismissed:0 "Warnings Dismissed"
 smd_alarm_dismissed_desc:0 "The generals feel their warnings about the chaos next door were ignored."
 smd_purge_refused:0 "Purge Refused"
 smd_purge_refused_desc:0 "The government refused the high command's list of suspect officers."
 smd_indifference_charge:0 "Accused of Indifference"
 smd_indifference_charge_desc:0 "Calls for patience while families go hungry have made the government look out of touch."
 smd_btn_costliving_subsidies_desc:0 "Pay part of the price of bread, food and fuel so that the poor can still afford them."
 smd_contagion_bar_movement_support:0 "The movement has the support of at least a quarter of the population"
 smd_contagion_bar_movement_radical:0 "The movement is radicalised"
 smd_contagion_movement_watched:0 "Under Surveillance"
 smd_contagion_movement_watched_desc:0 "The security services are watching this movement closely. Fewer people dare to join it, but those who do are angrier."
 smd_contagion_movement_tolerated:0 "Tolerated"
 smd_contagion_movement_tolerated_desc:0 "The government has chosen calm over confrontation. The movement is growing, but its tone has softened."
 smd_contagion_movement_purged:0 "Purged from the Army"
 smd_contagion_movement_purged_desc:0 "Officers who sympathised with this movement have been removed from the armed forces."
 smd_contagion_movement_crushed:0 "Broken by Emergency Rule"
 smd_contagion_movement_crushed_desc:0 "Curfews and detentions have scattered this movement's supporters. The ones left are desperate."
 smd_contagion_movement_emboldened:0 "Emboldened"
 smd_contagion_movement_emboldened_desc:0 "The government refused to crack down, and this movement has taken it as a sign of weakness."
 smd_contagion_movement_crackdown:0 "Organisers Arrested"
 smd_contagion_movement_crackdown_desc:0 "This movement's organisers and known sympathisers have been rounded up."
 smd_contagion_movement_reassured:0 "Public Reassured"
 smd_contagion_movement_reassured_desc:0 "Public information campaigns have taken some of the anger out of this movement."
 smd_contagion_movement_subsided:0 "Momentum Lost"
 smd_contagion_movement_subsided_desc:0 "With the crisis across the border over, this movement has lost its edge."
 smd_social_state_movement:0 "Social State Legacy"
 smd_social_state_movement_desc:0 "The social state built by the left has given this movement a record it can campaign on. Its attraction is higher and its supporters are less radical."
