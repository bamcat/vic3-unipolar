 great_polarization.1.t:0 "La gran polarización"
 great_polarization.1.d:0 "Estados Unidos está entrando en una nueva era de polarización política, impulsada por la fragmentación mediática, la política de la cultura y el miedo mutuo entre bloques ideológicos."
 great_polarization.1.f:0 "Cada elección se vuelve existencial. Cada escándalo se convierte en prueba. Toda tragedia se convierte en un arma."
 great_polarization.1.a:0 "El centro comienza a romperse."
 great_polarization.30.t:0 "El asesinato de George Floyd"
 great_polarization.30.d:0 "The killing of George Floyd by police has triggered a national protest wave, with demands for accountability, policing reform, and racial justice."
 great_polarization.30.f:0 "El video no se mantiene local. Se convierte en una acusación nacional."
 great_polarization.30.a:0 "Las calles eruptieron."
 great_polarization.30.b:0 "Prométete una reforma seria."
 great_polarization.31.t:0 "CHOP / CHAZ"
 great_polarization.31.d:0 "Una zona de protesta ocupada se ha formado en Seattle, convirtiéndose en un símbolo nacional tanto del activismo antipolicial como de los temores del retiro estatal."
 great_polarization.31.f:0 "Para sus partidarios, es auto-reglamento comunitario. A sus oponentes, se colapsa en miniatura."
 great_polarization.31.a:0 "Deja que el enfrentamiento salga."
 great_polarization.31.b:0 "Limpia la zona."
 great_polarization.32.t:0 "Attempted Assassination in Butler"
 great_polarization.32.d:0 "Un intento de asesinato de Donald Trump en un mitin en Butler, Pennsylvania ha intensificado los temores de violencia política y venganza."
 great_polarization.32.f:0 "La imagen viaja más rápido que los hechos."
 great_polarization.32.a:0 "Los rallyes correctos en ira."
 great_polarization.32.b:0 "Llamamiento a la calma nacional."
 great_polarization.33.t:0 "Sin reyes"
 great_polarization.33.d:0 "Las manifestaciones masivas bajo el lema "No Reyes" han llenado calles por todo el país, enmarcadas por partidarios como defensa de la democracia y por opositores como resistencia desestabilizadora."
 great_polarization.33.f:0 "La multitud canta contra la monarquía en una república que teme que ha olvidado la diferencia."
 great_polarization.33.a:0 "El movimiento se propaga."
 great_polarization.33.b:0 "Desactivar la confrontación."
 great_polarization.34.t:0 "Minnesota Lawmakers Targeted"
 great_polarization.34.d:0 "Disparos dirigidos contra legisladores estatales de Minnesota han profundizado el miedo nacional de que las disputas políticas se deslizan hacia la violencia organizada."
 great_polarization.34.f:0 "Una puerta se convierte en una línea frontal."
 great_polarization.34.a:0 "La seguridad se convierte en política."
 great_polarization.34.b:0 "Condena la violencia política en todo el espectro."
 great_polarization.35.t:0 "Charlie Kirk Asesinado"
 great_polarization.35.d:0 "El asesinato de Charlie Kirk mientras habla en un evento público se ha convertido en un punto de inflexión en la creciente crisis política de Estados Unidos."
 great_polarization.35.f:0 "Un micrófono se calla; un movimiento crece más fuerte."
 great_polarization.35.a:0 "La derecha se radicaliza."
 great_polarization.35.b:0 "Condena el asesinato y baja la temperatura."
 great_polarization.36.t:0 "Disparos ICE"
 great_polarization.36.d:0 "Los tiroteos fatales con agentes federales de inmigración han desencadenado protestas anti-ICE, indignación nacional y argumentos feroces sobre el poder federal."
 great_polarization.36.f:0 "La placa se convierte en el argumento."
 great_polarization.36.a:0 "Las protestas se extendieron."
 great_polarization.36.b:0 "Suspensión de operaciones e investigación."
 great_polarization.37.t:0 "Ley de derechos de voto Gutted"
 great_polarization.37.d:0 "Un fallo del Tribunal Supremo ha debilitado considerablemente la Ley de derechos de voto, en la que se denuncia que se está desmantelando el poder electoral de las minorías antes de las elecciones de 2026."
 great_polarization.37.f:0 "El tribunal habla en doctrina. El país escucha el poder."
 great_polarization.37.a:0 "La confianza colapsa."
 great_polarization.37.b:0 "Legislación de los derechos de voto de emergencia."
 great_polarization.100.t:0 "La Segunda Guerra Civil Americana"
 great_polarization.100.d:0 "Una crisis revolucionaria ha roto Estados Unidos. La autoridad federal es impugnada, y las facciones armadas están empezando a convertir al país en gobiernos rivales."
 great_polarization.100.f:0 "La primera guerra civil preguntó si el sindicato podría sobrevivir. El segundo pregunta qué es el sindicato."
 great_polarization.100.a:0 "Las fracturas sindicales."
