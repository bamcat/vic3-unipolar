 great_polarization.120.d:0 "Blue America ofrece reconocimiento, protección y cooperación en tiempo de guerra a cambio de unirse a su lado en la guerra civil."
 great_polarization.120.f:0 "La neutralidad es difícil de guardar cuando el mapa se quema."
