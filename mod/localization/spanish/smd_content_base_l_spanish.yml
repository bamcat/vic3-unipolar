 je_transit_rights: "¡Sin litoral!"
 je_transit_rights_reason: "No tiene costa. El acceso a los mercados internacionales depende totalmente de la buena voluntad de los países vecinos. Para el comercio y la flexibilidad estratégica es esencial que se llegue a un acuerdo sobre derechos de tránsito con al menos uno de ellos."
 secure_transit_rights_treaty:0 "Firmar un tratado de derechos de tránsito con cualquier país vecino no sin litoral."

 je_covid_pandemic: "COVID-19 Pandemic"
 je_covid_pandemic_reason: "Un nuevo coronavirus respiratorio ha surgido en idx id=0/año y se está propagando rápidamente a través del mundo. COVID-19 se extiende más rápido que cualquier patógeno en memoria viva, explotando las redes densas de comercio y viajes que unen al mundo moderno juntos. La mortalidad se concentra entre los ancianos y los inmunocompromisos, pero su alcance amenaza con abrumar los sistemas de salud en cada país que toca.Seguido: id=1/ título seleccionadox id=2/ títuloUse la decisión de establecer la política. Las cerraduras frenan la propagación pero martillan la economía. Las máscaras y el distanciamiento son menos eficaces pero más sostenibles. No hacer nada es una opción también: uno el electorado y los muertos recordarán."

 covid.1.t: "Un Coronavirus Novel"
 covid.1.d: "Se ha reportado un cúmulo de casos de neumonía inusual en idux id=0/consejo, id=1/Consejo. Análisis preliminar por las autoridades sanitarias de id=2/ título sugieren un coronavirus previamente desconocido, difundiendo humano-a-humano, con un período de incubación suficiente tiempo que los portadores son contagiosos antes de saber que están enfermos. Si esto sigue siendo un brote local o se convierte en algo más depende de las decisiones tomadas en las próximas semanas."
 covid.1.f: "Un nuevo patógeno. Otra vez."
 covid.1.a: "Notificar a la OMS y comenzar el rastreo de contactos"

 covid.2.t: "COVID-19 Reaches ierex id=0/año"
 covid.2.d: "Los casos de la novela coronavirus identificados por primera vez en idx id=0/ título han sido confirmados en <x id=1/año. El virus ha llegado, a través de un viajero, una ruta comercial, o simplemente las corrientes invisibles de un mundo conectado.Seguido id=2/ fieltrox id=3/ Clavex id=4/ iOS Las autoridades sanitarias están activando protocolos de respuesta pandémica. Usar la decisión id=5/ título COVID-19 Respuesta efectuadax id=6/tio para establecer la política."
 covid.2.f: "Sólo era cuestión de tiempo."
 covid.2.a: "Activar protocolos pandémicos"

 covid.3.t: "Variante de Omicron"
 covid.3.d: "Una nueva variante ha causado una nueva ola de infecciones COVID-19. Las autoridades sanitarias están reevaluando protocolos de contención."
 covid.3.f: "El virus sigue con nosotros."

 covid.4.t: "El nuevo virus de Wuhan, China"
 covid.4.a: "Supervisar de cerca la situación"

 covid.5.t: "COVID-19 Response Policy"
 covid.5.d: "¿Cómo debe responder a la pandemia? La elección definirá el paisaje económico y social de los próximos años."
 covid.5.f: "No hay buenas opciones. Sólo oficios."
 covid.5.a: "Bloqueo completo, cerrar negocios, restringir el movimiento"
 covid.5.b: "Mandatos de máscaras y directrices de alejamiento social"
 covid.5.c: "Mantener la economía abierta, priorizar la recuperación"

 covid.7.t: "La pandemia socava el esfuerzo de guerra"
 covid.7.d: "Con la población de COVID-19 ravaging id=0/año, se cuestiona si un país que lucha contra una pandemia puede sostener una guerra simultáneamente. La población está agotada. Los hospitales de campo compiten con la logística de primera línea para los recursos."
 covid.7.f: "Lucha contra el virus o lucha contra el enemigo. Hacer ambos es duro."
 covid.7.a: "La guerra continúa: el virus no cambia eso"
 covid.7.b: "Usar mensajes de salud pública para mantener la moral"
 covid.7.c: "Suprimir la narrativa derrotista"

 covid.8.t: "The Economic Toll of the Pandemic"
 covid.8.d: "La pandemia ha costado miles de trabajadores de id=0/ títulos, y en idx id=1/ título, el desempleo ha superado el 20%. Las familias no pueden pagar alquiler. Los señores de la tierra, respaldados por id=2/año, están presionando para el derecho a desalojar. La pobreza se concentra en las áreas ya más afectadas por el virus."
 covid.8.f: "Una pandemia dentro de la pandemia."
 covid.8.a: "Imposibilidad de una suspensión de alquiler y una moratoria de desalojo"
 covid.8.b: "Ampliar las prestaciones de seguridad social y desempleo"
 covid.8.c: "El mercado lo resolverá"

 covid.9.t: "Anti-Lockdown Protests"
 covid.9.d: "id=0/año, liderado por id=1/ título, ha organizado protestas masivas contra las restricciones pandémicas de id=2/año. Su posición: los mandatos de cierres y máscaras son la sobreexistencia del gobierno, el daño económico es mayor que el riesgo de salud, y los ciudadanos tienen derecho a tomar sus propias decisiones. Las protestas están creciendo. Cómo responder id=5/ título id=6/(conferencia) sentará un precedente."
 covid.9.f: "Máscaras. La colina que eligieron."
 covid.9.a: "Firme: las restricciones permanecen"
 covid.9.b: "Bajar, levantar las restricciones"
 covid.9.c: "Rebuttales científicos de la Comisión y campañas de salud pública"

 covid_response: "COVID-19 Response"
 covid_response_desc: "Establecer la política de id=0/año para gestionar la pandemia COVID-19. Esta decisión puede tomarse cada seis meses para ajustar la política a medida que evoluciona la situación."

