l_japanese:
 smd_agitators.1.t:0 "トゥパック・シャクール死去"
 smd_agitators.1.d:0 "1996年9月7日の夜、[SCOPE.sCharacter('smd_tupac_scope').GetFullName]はラスベガスで赤信号に停車中の車内で4発の銃弾を受けた。彼は9月13日、25歳で息を引き取った。犯人は逃走し、誰も起訴されていない。[ROOT.GetCountry.GetName]各地でファンが集まり、彼の死を悼んでいる。"
 smd_agitators.1.f:0 "彼の4枚目のアルバム『All Eyez on Me』は、この年の初めに発売されたばかりだった。"
 smd_agitators.1.a:0 "沈黙させられた声"
