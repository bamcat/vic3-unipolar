l_japanese:

 news.1.t:0 "注目すべき出来事"
 news.1.d:0 "これは試験用の記事です。国の題字が上部に表示され、記事が紙面に組まれ、ウィンドウの周囲に暗い枠やタイトルバーが表示されていなければ、新聞ウィンドウは正常に機能しています。ウィンドウは引き続きドラッグできるはずです。"
 news.1.f:0 "本紙の特派員はいつでも出動できます。"
 news.1.a:0 "一大ニュースだ！"

 news.2.t:0 "ロシア革命"
 news.2.d:0 "[ROOT.Var('news_test_2_news_attacker_ref').GetCountry.GetNameNoFlag]は[ROOT.Var('news_test_2_news_defender_ref').GetCountry.GetNameNoFlag]に正式に宣戦を布告した。国境では軍隊が動員され、列強の外務当局は深刻な懸念をもって情勢を見守っている。外交官は召還され、取引所は混乱に陥った。本紙の特派員は戦地へ向かっており、夕刊までにはさらに詳しい情報が届く見込みである。外交官は召還され、取引所は混乱に陥った。本紙の特派員は戦地へ向かっており、夕刊までにはさらに詳しい情報が届く見込みである。外交官は召還され、取引所は混乱に陥った。本紙の特派員は戦地へ向かっており、夕刊までにはさらに詳しい情報が届く見込みである。"
 news.2.f:0 "外交が失敗したところで、大砲が語り始める。"
 news.2.a:0 "実に重大な報せだ。"
