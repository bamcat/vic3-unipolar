 smd_amendment_rural_levies:0 "農村の賦課金"
 smd_amendment_rural_levies_desc:0 "農業税に加えて、郷や村の政府は地元の学校、道路、役人の費用をまかなうため、農家から手数料、穀物の割当、労役を徴収しています。その負担は最も貧しい農民に最も重くのしかかります。"
 smd_amendment_rural_levies_modifier:0 "農村の賦課金"
 smd_amendment_rural_levies_modifier_desc:0 "郷の手数料と労役が農村から資金を集めていますが、農民の好感を損なっています。"
