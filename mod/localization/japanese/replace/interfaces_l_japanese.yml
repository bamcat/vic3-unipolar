l_japanese:
 GDP_TOOLTIP:0 "#header [Country.GetAdjective]の[concept_gdp]#!\n@money! [Country.MakeScope.ScriptValue('cwp_gdp')|Dv]（#u #tooltippable #tooltip:[Country.GetTooltipTag],COUNTRY_GDP_OWNERSHIP_TOOLTIP [Country.GetDomesticallyOwnedGDPFraction|%1b]#!#!#!）国内所有の$concept_gdp_short$（[Country.GetGDPRanking]）\n@money! [Country.MakeScope.ScriptValue('cwp_gdp_per_capita')|2*v] [Concept('concept_gdp_per_capita', '$concept_gdp_per_capita_short$')]（[Country.GetGDPPerCapitaRanking]）"
 COUNTRY_GDP_OWNERSHIP_TOOLTIP:0 "#header [Country.GetName]の[concept_gdp_ownership]#!\n#u [Country.GetDomesticallyOwnedGDPFraction|%1b]#!（@money! [Country.GetGDP|Dv]）国内所有の$concept_gdp_short$\n$TOOLTIP_DELIMITER$\n[SelectLocalization(IsZero_CFixedPoint(Country.GetForeignOwnedGDPFraction), 'NO_FOREIGNLY_OWNED_PERCENTAGE', 'COUNTRY_FOREIGNLY_OWNED_PRECENTAGE')]\n\n[SelectLocalization(IsZero_CFixedPoint(Country.GetGDPOwnedInForeignCountries), 'NO_OWNED_FOREIGN_GDP_BY_COUNTRY', 'OWNED_FOREIGN_GDP_BY_COUNTRY')]"

 COUNTRY_ALL_GDP:0 "@money!#v [Country.GetGDPWithOwnershipsInForeignCountries|D]#!"
 DOMESTIC_COUNTRY_GDP:0 "@money!#v [Country.GetGDP|D]#!"
 FOREIGN_COUNTRY_GDP:0 "@money!#u [Country.GetGDPOwnedInForeignCountries|Db]#!"
 COUNTRY_ALL_OWNERSHIP:0 "#u [Country.GetDomesticallyOwnedGDPFraction|%1b]#![ConcatIfNeitherEmpty(' + ', AddLocalizationIf(NotZero_CFixedPoint(Country.GetGDPOwnedInForeignCountries), 'FOREIGN_COUNTRY_GDP'))]"

 COUNTRY_POPULATION:0 "#title [Concept('concept_pop','$concept_population$')]#!:\n#variable [Country.MakeScope.ScriptValue('smd_population')|Dv]#!"
 COUNTRY_GDP:0 "#title $GDP_SHORT$#!:\n#variable @money![Country.MakeScope.ScriptValue('cwp_gdp')|Dv]#!"

 ERROR_DEER_TOOLTIP:0 "#header おおっと！#!\n#instruction 左クリック#!でエラーログを開きます\n#instruction 右クリック#!で消すことができます（再び邪魔になるまで）"
 ERROR_MANUL_TOOLTIP:0 "#header マヌルを確認！#!\n#instruction 左クリック#!でエラーログを開きます\n#instruction 右クリック#!で消すことができます（再び邪魔になるまで）"

 OH_DEER:0 "「#italic おおっと！#! #bold [ErrorDeer.NumberOrErrors|v]#! #italic 件のエラーがあります！#!」"
 ERROR_MANUL:0 "#bold [ErrorDeer.NumberOrErrors|v]#! #italic 件のエラーだって？！#!#italic マヌルを読もう！#!"
 ERROR_DEER_SLOW_TICK_OPERATIONS:0 "#header 遅々として進まぬ作業#!"

 EXPENSES_GOVERNMENT_BUILDING_GOODS:0 "$TAB$#tooltippable #tooltip:[GetPlayer.GetTooltipTag],GOVERNMENT_BUILDINGS_EXPENSES_BREAKDOWN,GovernmentGoodsExpenseTooltip #N @money!-[GetPlayer.GetGovernmentGoodsExpenses|D-]#!#!#! [concept_budget_goods_for_government_buildings]\n$TAB$#tooltippable;tooltip:SMD_HEALTHCARE_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_healthcare_expense_value')|D-]#!#!#! [concept_smd_healthcare]\n$TAB$#tooltippable;tooltip:SMD_EDUCATION_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_education_expense_value')|D-]#!#!#! [concept_smd_education]\n$TAB$#tooltippable;tooltip:SMD_POLICE_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_police_expense_value')|D-]#!#!#! [concept_smd_police]"

 LITERACY_UNINCORPORATED_TOOLTIP:0 "\n$TOOLTIP_DELIMITER$\nまた、[Concept('concept_unincorporated_state','$concept_unincorporated_states$')]も考慮した場合、#variable [Country.GetName]#!の#variable [Concept('concept_pop','$concept_pops$')]#! #variable [Country.GetTotalPopulation|*]#!の内、#variable [Country.GetNumTotalLiteratePops|*]#!（[Country.GetTotalLiteracyRate|%v]）が読み書きができます。([Country.GetTotalLiteracyRanking])"

 POP_TOOLTIP:0 "#tooltip_header [Concept('concept_pop','$concept_population$')]#!\n現在: [Country.MakeScope.ScriptValue('smd_population')|Dv] ([Country.GetPopulationRanking])\n[Country.GetPopGrowthDesc]$POP_TOOLTIP_DELAYED$"

 SMD_HEALTHCARE_EXPENSE_TOOLTIP:0 "#header [concept_smd_healthcare]支出#!\n国営医療制度の運営費です。 主に運営している$building_government_administration$のレベル数（[concept_bureaucracy]）に応じて増減し、さらに[concept_institution]への投資レベル、人口（$peasants$を除く）、平均[concept_sol]の影響を受けます。\n現在の月間費用： @money!-[GetPlayer.MakeScope.ScriptValue('smd_healthcare_expense_value')|D-]#!"

 SMD_EDUCATION_EXPENSE_TOOLTIP:0 "#header [concept_smd_education]支出#!\n公教育の運営費です。 主に運営している$building_government_administration$のレベル数（[concept_bureaucracy]）に応じて増減し、さらに[concept_institution]への投資レベル、人口（$peasants$を除く）、平均[concept_sol]の影響を受けます。\n現在の月間費用： @money!-[GetPlayer.MakeScope.ScriptValue('smd_education_expense_value')|D-]#!"

 SMD_POLICE_EXPENSE_TOOLTIP:0 "#header [concept_smd_police]支出#!\n治安維持の運営費です。 主に運営している$building_government_administration$のレベル数（[concept_bureaucracy]）に応じて増減し、さらに[concept_institution]への投資レベル、人口（$peasants$を除く）、平均[concept_sol]の影響を受けます。\n現在の月間費用： @money!-[GetPlayer.MakeScope.ScriptValue('smd_police_expense_value')|D-]#!"
