l_japanese:
  news_events_world.1.t: "[ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFormatting]と[ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFormatting]、戦争の瀬戸際に！"
  news_events_world.1.d: "[ROOT.Var('news_world_1_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]により、[ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFlag]と[ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFlag]は公然たる対立に入った。当代屈指の二大国が正式な紛争で向かい合い、欧州の各外務省は近年まれに見る慌ただしさに包まれている。首都間を使者が昼夜往来し、相場は不安定となり、社交界でもこの話題でもちきりだ。争いが交渉で収まるか戦争へ硬化するかは、今後数週間の要求、国境への兵力移動、そして各政府が最終的にどちら側へ立つかに懸かっている。"
  news_events_world.1.f: "外交部：双方の使節は深夜を過ぎても協議を続けているという。ある外国人観察者は「表向きは礼儀正しいが、内実は明白に敵対的」と評した。"
  news_events_world.2.t: "危機！ [ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFormatting]と[ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFormatting]の間で"
  news_events_world.2.d: "[ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFlag]は[ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFlag]に対する[ROOT.Var('news_world_2_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]へ本格的に介入した。本来なら地域紛争で終わったかもしれない争いに一等国が加わったことで、危機の性格は一変した。隣国同士の争いは列国全体の問題となり、各国外務省は要求と新たな約束を精査している。地域の小国も、決着までにどちらを敵に回す方がまだましかを水面下で計算している。"
  news_events_world.2.f: "分析：地域紛争として始まった問題は今や主要国すべての外務省の関心事となった。小国は、どちらを怒らせる余地があるのか静かに見極めている。"
  news_events_world.3.t: "戦争！ [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFormatting]対[ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFormatting]！"
  news_events_world.3.d: "[ROOT.Var('news_world_3_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]は外交の段階を越え、[ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFlag]と[ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFlag]の全面戦争へ発展した。大使は召還され、予備役は集結を命じられ、取引所は混乱している。徴兵所には夜明けから人が押し寄せ、鉄道会社は車両を陸軍当局の用に供した。商人はどの港と航路が開かれるのか、保険料がいくらになるのかを案じ、各国政府は条約が今どのような義務を課すかを検討している。"
  news_events_world.3.f: "前線より：予備役、弾薬、馬匹が戦場へ送られ、鉄道時刻表は軍用輸送計画に置き換わりつつある。商人は安全な港と航路を探している。"
  news_events_world.4.t: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFormatting]、[ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFormatting]への侵攻を開始"
  news_events_world.4.d: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFlag]は[ROOT.Var('news_world_4_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]をめぐって[ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFlag]と戦端を開いた。両国の戦力差は明白で、首都では早くも短期かつ安価な勝利を予測する声がある。一方で慎重論も強い。軍事記者は、距離、困難な地形、疾病、第三国の介入が、紙上では圧倒的だった軍を何度も苦しめてきたことを指摘する。自信満々に始まった遠征が予定した季節内に終わることは少ない。"
  news_events_world.4.f: "軍事部：紙上の戦力差は大きくとも、距離、地形、外国の介入が「容易な戦役」を幾度も破綻させてきたと記者は警告する。"
  news_events_world.5.t: "[ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFormatting]でクーデター"
  news_events_world.5.d: "[ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFlag]の政治秩序は武力で覆された。権力は今や[ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetRuler.GetFullName]の手にあり、国家は[ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetGovernment.GetName]として統治される。省庁、電信局、主要鉄道駅は夜明け前に確保された。地方の軍が首都と同じように新政権へ従うのか、既存の法律や対外条約が守られるのか、追われた勢力が服従するのか抵抗するのか、首都ではまだ誰にも断言できない。"
  news_events_world.5.f: "首都特報：省庁、駅、電信局に兵士が配置されたと住民は語る。ある職員は「朝には制服が変わっていたが、誰の命令で動いているのか誰にも分からなかった」と話した。"
  news_events_world.6.t: "[ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFormatting]の[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle]、暗殺される"
  news_events_world.6.d: "[ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFlag]を統治していた[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_6_character_ref').GetCharacter.GetFullName]（[ROOT.Var('news_world_6_character_ref').GetCharacter.GetAge]歳）が暗殺者の凶刃に倒れた。国家元首の殺害は直ちに衝撃を広げ、閣僚は首都、守備隊、国庫を確保し、少なくとも統治の継続を示そうとしている。諸外国は条約と軍の指揮系統が維持されるとの保証を求めている。陰謀の捜査は始まったばかりで、国内の各派は責任が誰に帰されるかを注視している。"
  news_events_world.6.f: "治安部：捜査当局は共犯者を追い、閣僚は国家がなお掌握されていることを示そうとしている。暗殺者が単独犯か、次の行動を待つ派閥の手先かは不明だ。"
  news_events_world.7.t: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullNameNoFormatting]死去、[ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFormatting]は喪に服す"
  news_events_world.7.d: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullName]は[ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFlag]を統治中、[ROOT.Var('news_world_7_character_ref').GetCharacter.GetAge]歳で死去した。公共建築には黒布が掛けられ、首都の商店は戸を閉ざしている。継承は慣習と法に従って進み、閣僚は政策の継続を強調する。しかし各国の外務省は、この交代が同盟、政策、あるいは宮廷諸派の均衡を変えるのかを密かに問うている。"
  news_events_world.7.f: "首都より：継承の報を待つ群衆が集まり、公共建築には喪章が掲げられている。儀礼の裏で、閣僚たちは次の治世の意味を定めようと早くも競っている。"
  news_events_world.8.t: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetLastNameNoFormatting]、[ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFormatting]で失脚"
  news_events_world.8.d: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetFullName]は存命のまま[ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFlag]の権力から退けられ、[ROOT.Var('news_world_8_new_ruler_ref').GetCharacter.GetFullName]が国政を引き継いだ。国家は[ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetGovernment.GetName]として統治される。選挙でも死去でも通常の継承でもない君主の退場には単純な説明がつきにくく、公式説明も疑念を晴らしていない。外交官は閣僚人事と守備隊の動きを追い、新政権が同意に基づくのか、それとも銃剣に支えられているのかを探っている。"
  news_events_world.8.f: "政治分析：選挙、死、通常の継承のいずれでもなく存命の支配者が退けられたなら、その背景が単純であることは稀だ。"
  news_events_world.9.t_presidential: "[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting]、[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting]大統領選に勝利"
  news_events_world.9.d_presidential: "[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting]が[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag]の選挙を制し、[ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName]が大統領に就任する。同党候補は投票総数の[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetCurrentVotingPowerShare|%1]を獲得した。一部では歓喜、他では落胆が広がり、敗れた勢力はすでに複数選挙区で投票手続きに異議を唱えている。諸外国は外交、貿易、軍事政策、そして大国の政治的気風への影響を見極めようとしている。"
  news_events_world.9.t_party: "[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting]、[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting]選挙で勝利"
  news_events_world.9.d_party: "[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting]は[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag]の選挙戦を終えて最大勢力となり、候補者は投票総数の[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetCurrentVotingPowerShare|%1]を得た。大都市の選挙事務所では深夜まで開票が続き、複数の選挙区で結果が争われている。外国政府、投資家、政治運動は新たな党勢が内政・外交に何を意味するか、成立する内閣が安定多数を保てるかを見守っている。"
  news_events_world.9.t_government: "[ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting]、[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting]政府を主導へ"
  news_events_world.9.d_government: "選挙後、[ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting]は[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag]政府の中心政党となり、投票総数の[ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetCurrentVotingPowerShare|%1]を獲得した。君主が政争の上に立つ国では、国家元首を変えずとも選挙でその下の権力均衡が一変しうる。諸外国と実業界は新内閣を注視しており、閣僚構成はしばしば玉座からの演説以上に国の意図を示す。"
  news_events_world.9.t: "[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting]の選挙、決着"
  news_events_world.9.d: "世界に大きな影響力を持つ[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag]で選挙が終わったため、その結果は国内問題にとどまらず国際的事件となっている。開票結果は発表から数時間で欧州各首都へ電送された。各国政府と政治運動は政党勢力と[ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName]の立場を分析しており、今後の政府は外交、貿易、艦隊・陸軍の配置、時代の政治的空気にも影響を与えうる。国内では組閣作業が本格化する。"
  news_events_world.9.f: "選挙部：各党本部では祝賀、異議申立て、再集計が同時に進む。外国ではこの結果が次の外交・通商路線を示す手掛かりとして読まれるだろう。"
  news_events_world.10.t_drought: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]を干ばつが襲う"
  news_events_world.10.d_drought: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]では雨が途絶え、約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人が収穫に依存している。畑は乾き、貯水池は週ごとに低下し、農民は最悪を予想して作付けを減らしている。牧畜民は水を求めて家畜を遠くへ追い、穀物商は先物価格を引き上げ始めた。市場町では救援委員会が組織されている。乾燥が季節を通して続けば、不作はさらに深刻な災厄へ変わり、最も余裕のない者から打撃を受けるだろう。"
  news_events_world.10.t_flood: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]で壊滅的な洪水"
  news_events_world.10.d_flood: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]で河川が氾濫し、畑と村が水没、道路が寸断された。救援隊が孤立した集落へ向かう一方、当局は橋や堤防の損害を調べている。家畜被害は深刻で、多くの家庭の冬季備蓄も失われた。約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人が暮らす地域では、農作物と輸送への損害が水が引いた後も長く市場に影響するだろう。"
  news_events_world.10.t_frost: "厳しい霜が[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]を襲う"
  news_events_world.10.d_frost: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]に異常な霜が降りた。作物は黒く枯れ、果樹園も大きな被害を受け、季節が進んだ作物ほど打撃が大きい。約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人が暮らす地域にとって一季の収穫喪失は重大だ。商人は被害の大きい地区で月末までに不足が生じると見ており、農家は遅い再播種で一部でも取り戻せるかを待っている。"
  news_events_world.10.t_wildfire: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]の山火事、住民避難"
  news_events_world.10.d_wildfire: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]で火勢が拡大し、家族は避難、農場、森林、道路が脅かされている。煙が広域を覆い、正午の太陽が赤く見えるとの報告もある。地方当局は集められる人員で防火帯を設け、複数地区で民兵も動員された。約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人が住む州では、資産、牧草地、立木への損害が鎮火後も長く残る恐れがある。"
  news_events_world.10.t_hailstorm: "雹が[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]の収穫を壊滅"
  news_events_world.10.d_hailstorm: "激しい雹が[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]を襲い、立ち穀を切り裂き、屋根と窓を破壊し、屋外の家畜にも被害を与えた。数時間前まで収穫間近だった畑が押し潰されている。約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人の州では局地的な収穫喪失でもパン価格と農村所得にすぐ響く。保険会社には請求が届き始め、当局は無保険世帯の被害額を調べている。"
  news_events_world.10.t_locust_swarm: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]にイナゴの大群"
  news_events_world.10.d_locust_swarm: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]に濃密なイナゴ群が飛来し、村々が防ぎきれない速さで作物を食い尽くしている。穀倉は昼夜警備され、農民は火、棒、煙で残った作物を守ろうとしている。群れが空を暗くするとの報告もある。被災地には約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人が暮らし、害虫が長引くか近隣農地へ広がれば飢えが続くと当局は恐れている。"
  news_events_world.10.t_heatwave: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]を酷暑が覆う"
  news_events_world.10.d_heatwave: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]は厳しい熱波に見舞われた。井戸は枯れかけ、家畜は畑で倒れ、作物は容赦ない日差しに萎れている。町では高齢者と幼児の死亡が報告され、給水車は夜明けから日没まで走る。約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人の州当局は、長期の暑さが食料、水、輸送を同時に圧迫するため、収穫と同じほど住民の健康を警戒している。"
  news_events_world.10.t_disease_outbreak: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]に病害広がる"
  news_events_world.10.d_disease_outbreak: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]で畑と家畜に病気が広がっている。検査官は感染が次の地区へ及ぶ前に被害農地と家畜を特定しようとしている。隔離や殺処分で広域の収穫を守れる可能性はあるが、対象となる農家には即座の破滅を意味する。約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人の州では、生産者だけでなく市場で買い物をする全家庭が影響を受ける。"
  news_events_world.10.t_extreme_winds: "暴風、[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]に破壊の跡"
  news_events_world.10.d_extreme_winds: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]を強風が襲い、屋根、樹木、電信線、作物が被害を受けた。主要路線から瓦礫を除く間、道路と鉄道は遅れ、複数集落との通信は完全に途絶えた。約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人の州では、一つの大災害より、輸送と収穫が同時に止まることの方が大きな損失となりかねない。"
  news_events_world.10.t_torrential_rains: "豪雨、[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]の畑を水浸しに"
  news_events_world.10.d_torrential_rains: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]では雨が絶えず降り、畑は飽和し、低地の道路や河岸が冠水している。村が乾いていても、滞水で作物が地中から腐るのではないかと農民は恐れる。商人は鉄道と市場道路を懸念している。約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人の地域では、収穫期の長雨は暴風と同じほど大きな損害をもたらしうる。"
  news_events_world.10.t_pollinator_surge: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]の果樹園に驚異の季節"
  news_events_world.10.d_pollinator_surge: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]では蜂など花粉媒介昆虫が異常なほど豊富だと農家が報告している。果樹や花を付ける作物は記憶にないほどよく実を結び、天候が続けば豊作が期待される。約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人の州では、好調な収穫が食料価格を下げ、農村所得を広く押し上げる可能性がある。"
  news_events_world.10.t_optimal_sunlight: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]に黄金の季節"
  news_events_world.10.d_optimal_sunlight: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]は異例に恵まれた日照を享受している。農家は生育が力強く、長い晴天を必要とする作物に絶好の見通しだと話す。商人は大量の収穫輸送に備え、運送業者は追加の荷車を手配し始めた。約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人の地域では豊作がすべての市場と家庭に恩恵を及ぼす。ただし生産者は、あと数週間この天候が続くまでは楽観できないとしている。"
  news_events_world.10.t_moderate_rainfall: "恵みの雨、[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]を潤す"
  news_events_world.10.d_moderate_rainfall: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]に、生育期として最も好ましい時期に穏やかな雨が続いている。畑は豪雨のように水没せず十分な水を得ており、古参農民も満足を口にしている。約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人の州では豊作見通しが穀物相場を早くも安定させ、商人は予想以上の穀物と農産物を収める場所を用意している。"
  news_events_world.10.t_tsunami: "大波、[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]沿岸を壊滅"
  news_events_world.10.d_tsunami: "大波が[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]沿岸を襲い、港と低地集落を破壊した。海岸からの情報は断片的で、救助隊が瓦礫を捜索し、複数の船が乗員もろとも行方不明とされる。被災州には約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人が暮らし、犠牲者数はまだ算定できない。沿岸貿易の混乱も救助終了後まで長く続く恐れがある。"
  news_events_world.10.t_earthquake: "地震、[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]の町々を倒壊"
  news_events_world.10.d_earthquake: "強い地震が[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]を揺らし、建物を倒壊させ、道路、鉄道、水道を寸断した。救助隊は灯火の下で瓦礫を掘り、余震が行方不明者の捜索を妨げ、生存者を屋外へ追いやっている。地区全体が廃墟との報告もある。約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人の州では、限られた範囲の破壊でも多数の死者と数年に及ぶ復興負担を生みうる。"
  news_events_world.10.t_calm_waters: "穏やかな海、[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]の港に好機"
  news_events_world.10.d_calm_waters: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]沿岸では例外的に海が穏やかだ。漁船団と沿岸航路はほとんど遅れなく動き、港も船長たちが覚えている限り最良の条件で荷役している。この状態が続けば海難損失と保険料の低下が期待される。約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人の沿岸州では、静穏な海は魚と輸入品の価格・供給に直接反映される。"
  news_events_world.10.t_fog: "濃霧、[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]を覆う"
  news_events_world.10.d_fog: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]に濃霧が立ちこめ、道路、鉄道、水上の視界が悪化した。船は測深しながら港へ進み、列車も信号所間を最大限の注意で走る。最大の危険は衝突で、すでに小事故が複数報告されている。約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人の地域では、霧が長引けば配送と都市の通常商業が広く遅れる。"
  news_events_world.10.t_cyclone: "サイクロン、[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]を直撃"
  news_events_world.10.d_cyclone: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]をサイクロンが横断し、破壊的な風雨をもたらしている。沿岸集落では屋根の損壊、倒木、通信断が報告され、当局は避難者の収容を急ぐ。暴風域には約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人が暮らし、洪水と強風の複合被害は数週間ではなく数か月に及ぶ恐れがある。全容は通信が復旧するまで分からない。"
  news_events_world.10.t_ice: "厚い氷、[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]を封鎖"
  news_events_world.10.d_ice: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]は厳しい凍結に見舞われた。道路と鉄道は危険となり、水路は遅れ、場所によっては完全に停止している。作物と家畜も寒気に苦しむ。最も必要な時期に石炭輸送まで滞っている。約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人の州では、備蓄が尽きる前に寒波が緩まなければ、輸送停止の損害が畑の直接被害に匹敵しかねない。"
  news_events_world.10.t_rough_waters: "荒海、[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]の港を閉ざす"
  news_events_world.10.d_rough_waters: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]沿岸で荒天が続き、漁船は港に残り、商船は出航を延期し、港湾当局は危険な入港を警告している。複数船が予定より遅れている。約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人の沿岸州では、海上輸送の反復停止は食料価格、保険料、都市が依存する輸入品の流通にすぐ表れる。"
  news_events_world.10.t_strong_winds: "強風、[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]を悩ませる"
  news_events_world.10.d_strong_winds: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]では強風が長く続いている。露出した農地と輸送路が損害を受け、船員と港湾職員も沿岸一帯で厳しい条件に直面している。どこでも破壊的というわけではないが、長期化により収穫、地域交通、物資流通への妨げが目立ち始めた。約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人の地域では数日で市場に影響が及ぶ。"
  news_events_world.10.t_tropical_storm: "熱帯暴風雨、[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]へ接近"
  news_events_world.10.d_tropical_storm: "熱帯暴風雨が[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]へ入り、大雨、強風、危険な海況をもたらしている。当局は低地住民へ警告し、港は交通を縮小、農民は作物と家畜を守ろうとしている。被災州には約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人が暮らし、サイクロン級に達しなくても住居、収穫、沿岸交易に広範な混乱を生じうる。"
  news_events_world.10.t_fallback: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]で異常な気象条件"
  news_events_world.10.d_fallback: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]の[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]を異常な天候が襲っている。当局は農場、交通機関、市場から報告を集め、災害なのか恩恵なのかを見極めているが、初報は一致しない。被災州には約[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人が暮らすため、収穫条件の一時的変化でも最初の地域を越えて影響する可能性がある。"
  news_events_world.10.f: "被災地より：農民と地方当局は収穫の損失、交通障害、不安定な市場を報告している。初報は不完全で、真の被害規模が判明するまで数週間かかるかもしれない。"
  news_events_world.11.t: "[ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFormatting]で革命"
  news_events_world.11.d: "[ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFlag]に対する革命蜂起が始まった。反乱側は[ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetNameNoFlag]として組織され、旧秩序に代わる[ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetGovernment.GetName]を宣言している。労働者地区にはバリケードが築かれ、守備隊の一部が寝返ったとの報告もある。争いは扇動から国家そのものをめぐる武装闘争へ移った。近隣政府は現体制が生き残れるか、成功が国境を越えてどのような前例を作るかを不安げに見ている。"
  news_events_world.11.f: "現地記者より：宣言文が刷られるより速くバリケードが築かれている。住民は、権力が通りごとに入れ替わり、噂がどんな公文書より速く広がる地区を語る。"
  news_events_world.12.t: "[ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFormatting]で革命派勝利"
  news_events_world.12.d: "革命派が[ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFlag]の内戦に勝利し、大国の国家機構は[ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetRuler.GetFullName]のもと[ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetGovernment.GetName]の手へ移った。勝利は国外にも響き、友好勢力を勇気づけ、敵対勢力を警戒させる。諸外国は宣言ではなく、新政府が制定する法律、承認する債務、履行する条約によって勝者を評価するだろう。最初の数か月が、戦闘では決まらなかった多くを決める。"
  news_events_world.12.f: "分析：勝利で省庁は手に入るが、官僚機構、軍、国民の信頼まで自動的に得られるわけではない。政権の最初の日々は戦闘と同じほど重要になるだろう。"
  news_events_world.13.t: "[ROOT.Var('news_world_13_news_event_state_ref').GetState.GetNameNoFormatting]の購入"
  news_events_world.13.d: "[ROOT.Var('news_world_13_news_treaty_ref').GetTreaty.GetNameNoFormatting]により、[ROOT.Var('news_world_13_news_event_state_ref').GetState.GetName]は[ROOT.Var('news_world_13_news_state_giver_ref').GetCountry.GetNameNoFlag]から[ROOT.Var('news_world_13_news_state_taker_ref').GetCountry.GetNameNoFlag]へ移った。移管地には約[ROOT.Var('news_world_13_news_event_state_ref').GetState.GetPopulationSize|D]人が暮らし、単なる地図上の修正ではない。行政、財産、軍事通行、住民の地位を定め直す必要があり、近隣政府は新国境が自国の安全保障に何を意味するか計算している。住民自身には意見を求められなかった。"
  news_events_world.13.f: "国境より：住民は新しい旗とともにどの法律、税、役人が来るのかを待っている。遠い首都の署名は、現地では即日の統治変更を意味する。"
  news_events_world.14.t: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFormatting]、[ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFormatting]を宿敵に指定"
  news_events_world.14.d: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFlag]と[ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFlag]は公然たる競争関係に入った。重要な二国が正式に対抗を宣言したことで、大陸の陣営はさらに固まるとみられる。大使は留任しているが、通常の礼儀は目に見えて冷えた。今後のあらゆる争点は大小を問わずこの敵意を通して解釈され、かつて官僚間で静かに処理できた問題も世界の注目の中で争われるだろう。"
  news_events_world.14.f: "外報部：外交官は、昨日なら静かに解決できた問題さえ、今後は新たな敵対関係の一部として受け取られると見ている。"
  news_events_world.15.t: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFormatting]、[ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetAdjectiveNoFormatting]軍に降伏"
  news_events_world.15.d: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFlag]は独立国家として消滅し、残存領土は[ROOT.Var('news_world_15_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]を通じて強制された条件のもと[ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag]に吸収された。一つの政府が国家の列から消え、省庁は解散、在外代表は仕える国を失った。[ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag]は征服地と住民を統治する責任を負い、近隣諸国はこれが争いの終わりなのか次の争いの始まりなのかを見極めている。"
  news_events_world.15.f: "旧首都より：官庁の看板が外され、役人は新当局に仕えるかどうかを決めている。国家は地図から消えても、地域の忠誠心はそう早く消えない。"
  news_events_world.16.t: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetLastNameNoFormatting]、[ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFormatting]で権力を継承"
  news_events_world.16.d: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetAge]歳の[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetFullName]が前支配者の死去を受け[ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFlag]の指導者となった。国家は[ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetGovernment.GetName]として統治されている。大国であるため外交官は、新支配者の友好関係、信条、治世初期の不安定な時期に権威を固める能力をすでに測っている。宮廷は継続性を強調するが、各国大使館はより慎重である。"
  news_events_world.16.f: "宮廷部：廷臣は公には継続性を語るが、継承は必ず接近できる人物と影響力の配置を変える。外国大使は新支配者に最も近い人物を調べている。"
  news_events_world.17.t: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFormatting]と[ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFormatting]、同盟を締結"
  news_events_world.17.d: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFlag]と[ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFlag]は[ROOT.Var('news_world_17_news_treaty_ref').GetTreaty.GetNameNoFormatting]に入り、正式な同盟関係を結んだ。条項の一部は公表されたが、議会に示されていない追加了解もあると広く考えられている。軍事計画担当者と対立国は義務を精査している。この規模の同盟は将来の危機計算を変え、地域紛争を双方が再考する暇もないまま全面戦争へ拡大させうる。"
  news_events_world.17.f: "軍事分析：同盟は最初の一発が撃たれる前に最も大きな意味を持つ。参謀本部は、一方との戦争が両国との戦争になる前提で計画を練り直すだろう。"
  news_events_world.18.t: "[ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFormatting]の新政府"
  news_events_world.18.d: "[ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFlag]は国家構造そのものを変えるほど重大な[ROOT.Var('news_world_18_news_new_law_ref').GetLaw.GetName]を制定した。国は今や[ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetGovernment.GetName]として統治される。外国首都は新体制との関係を再検討し、国内では支持者が祝賀し、反対派は長年予言してきた結果に備えている。法律家と官僚は変革の実務に入り、一週間前まで恒久的に見えた称号、省庁、手続きが書き換えられつつある。"
  news_events_world.18.f: "憲政部：法律家と官僚が新秩序の実務上の結果を整理している。かつて恒久的と思われた称号、省庁、手続きも改定が必要になるかもしれない。"
  news_events_world.19.t: "[ROOT.Var('news_world_19_news_event_state_ref').GetState.GetNameNoFormatting]の混乱、地域経済を圧迫し不安定化"
  news_events_world.19.d: "[ROOT.Var('news_world_19_news_source_country_ref').GetCountry.GetNameNoFlag]内の[ROOT.Var('news_world_19_news_event_state_ref').GetState.GetName]、人口約[ROOT.Var('news_world_19_news_event_state_ref').GetState.GetPopulationSize|D]の地域で深刻な騒乱が報告されている。ストライキ、騒動、組織的な不満は通常行政を脅かす水準に達した。商店は早じまいし、集会は予定をはるかに超える群衆を集め、警察は周辺地域から増援を受けている。騒擾が続けば政府の統治力が大きく弱まり、国全体の商業にも影響しかねない。"
  news_events_world.19.f: "街頭より：店主は早く閉店し、集会には異例の大群衆が集まるという。当局は秩序回復を主張するが、住民は暴動が起きる前から緊張が目に見えると話す。"
  news_events_world.20.t: "[ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFormatting]で不況"
  news_events_world.20.d: "[ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFlag]の商業は急激な縮小に見舞われた。国内総生産は一か月で約£[ROOT.Var('news_world_20_news_recession_previous_gdp_value').GetValue|D]から£[ROOT.Var('news_world_20_news_recession_current_gdp_value').GetValue|D]へ下がり、[ROOT.Var('news_world_20_news_recession_drop_value').GetValue|%1]の減少となった。受注は細り、信用は引き締まり、製造業者は何年も見なかった需要低迷を訴えている。労働者は賃金と職を心配し、海外市場は貿易と投資を通じた波及を警戒している。"
  news_events_world.20.f: "市場部：銀行家と製造業者は縮小が一時的である兆候を探している。ある分析家は、解雇や企業倒産が悪い一か月を長期不況へ変える前なら信頼回復は早いかもしれないと警告する。"
  news_events_world.21.t: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFormatting]、GDP10億に到達"
  news_events_world.21.d: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFlag]は年間生産10億ポンドを超えた世界初の国となり、集計時点で約£[ROOT.Var('news_world_21_news_billion_gdp_value').GetValue|D]に達した。そこに集積した製造、貿易、購買力は、すべての競争国が自国を測る新たな基準となる。経済学者は成果の意味を議論し、富が誰に渡るかを示す数字ではないと指摘するが、もはやどの政府も無視できない工業規模を示している。"
  news_events_world.21.f: "金融部：経済学者はすでにこの数字の意味を論じている。富の分配は示さないが、競争国が無視できない産業規模を示す。"
  news_events_world.22.t: "[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFormatting]、新たな国際協定を宣言"
  news_events_world.22.d: "[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFlag]のもと、新たなブロック[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName]が成立した。[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetIdentity.GetName]の原則を掲げ、創設時点で[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers]か国が加盟している。諸外国は憲章と加盟国を慎重に調べており、このような結社は地域全体の貿易、同盟、政治的影響力を変えうる。長期的な制度か一時的な便宜かは、加盟国が望まなかった危機で試されるまで分からない。"
  news_events_world.22.f: "外交分析：新ブロックは実際の危機に試される前ほど結束を強調する。外務省は創設式より加盟国間の最初の不一致を注視するだろう。"
  news_events_world.23.t: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFormatting]、債務不履行！"
  news_events_world.23.d: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFlag]は債務義務を履行できなかった。デフォルト時の公的元本は約£[ROOT.Var('news_world_23_news_default_principal_value').GetValue|D]、信用限度は£[ROOT.Var('news_world_23_news_default_credit_limit_value').GetValue|D]だった。債権者は大損失に直面し、今後の借入は可能でも高くつく。外国銀行と政府は波及、政治混乱、そして国庫が政府権力を支える軍と行政を維持できなくなる兆候を見守っている。"
  news_events_world.23.f: "金融部：債券保有者は計算だけでなく政治も価格に織り込んでいる。交渉による解決なら信頼回復も可能だが、長期デフォルトは危機後も借入費用を高止まりさせる。"
  news_events_world.24.t: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFormatting]、列強の仲間入り"
  news_events_world.24.d: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFlag]は年間生産約£[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetGDP|D]に達し、国家の最上位層へ上昇した。昇格は富、軍備、影響力の大きな蓄積を示し、主要外交問題で発言権を与える。既存列強は新顔を同盟国として取り込むか競争相手として警戒するかを考え、新列強自身も承認には特権と同じほど重い義務が伴うことを知るだろう。"
  news_events_world.24.f: "外報部：招待、儀礼、外交計算はすぐ変わる。新顔は、承認が影響力だけでなく、かつて遠いと思われた争いで立場を示す期待も伴うことを知るだろう。"
  news_events_world.25.t: "[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFormatting]の衰退"
  news_events_world.25.d: "[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFlag]は列強の第一線から転落し、年間生産は約£[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetGDP|D]となった。これは儀礼上の変化だけではなく、国際的な注目と世界の均衡を動かす力が低下したことを示す。国内で閣僚は失われた力と地位の回復を迫られ、野党は攻撃材料に事欠かない。国外では旧来の相手国が以前より厳しく交渉してくるだろう。"
  news_events_world.25.f: "分析：地位低下は地図より先に会議室で感じられる。旧友はより厳しく交渉し、競争国は衰退が一時的か恒久的かを試すだろう。"
  news_events_world.26.t: "[ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFormatting]の指導権に挑戦"
  news_events_world.26.d: "[ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers]か国からなる[ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName]内部で主導権争いが始まった。[ROOT.Var('news_world_26_news_bloc_contender_ref').GetCountry.GetNameNoFlag]が現指導国[ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFlag]へ挑戦している。当局は通常の協力が続くと主張するが、代表団は異例の慎重さで支持票を数えている。争いが長引けば複数政府を同時に分断し、外部勢力に混乱を利用する機会を与えかねない。"
  news_events_world.26.f: "ブロック内部：当局は協力継続を強調するが、代表団は支持者を慎重に数えている。軍隊を使わない指導権争いでも同盟国を敵対陣営に分けうる。"
  news_events_world.27.t: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFormatting]、同盟指導権を獲得"
  news_events_world.27.d: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFlag]は[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetNumMembers]か国からなる[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetName]の指導権争いで[ROOT.Var('news_world_27_news_bloc_loser_ref').GetCountry.GetNameNoFlag]を破った。加盟政府は交代が結束を強めるのか、旧指導国支持者の反発を招くのかを検討している。争い自体は終わったが、露呈した忠誠関係は簡単には消えない。新指導国は別の結果を望んでいた仲間も引き継ぐ。"
  news_events_world.27.f: "外交部：争いは終わっても忠誠問題は残る。新指導国は敗者を望んでいた政府も含む組織を引き継いだ。"
  news_events_world.28.t: "[ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFormatting]と[ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFormatting]、袂を分かつ"
  news_events_world.28.d: "[ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFlag]と[ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFlag]を結んでいた[ROOT.Var('news_world_28_news_treaty_ref').GetTreaty.GetNameNoFormatting]が解消された。この断絶で重要な義務が消え、両政府は軍事計画と将来の危機での立場を再考せざるを得ない。双方の首都は遺憾声明を出したが、説得力は乏しい。競争国は亀裂が生む機会を探っており、旧パートナーが安全保障をどこに求め、誰が失われた関係を埋めるのかが焦点だ。"
  news_events_world.28.f: "外報部：外交官は正式な破棄以上に関係断絶そのものが重要だと見る。今後は両国がどこに安全保障を求め、誰が関係を代替するかが問題となる。"
  news_events_world.29.t: "恐慌！ 世界的な[ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting]不足！"
  news_events_world.29.d: "世界市場で[ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting]が深刻に不足し、価格は商人が通常と考える水準を大きく超えた。市場需要は約[ROOT.Var('news_world_29_news_shortage_imports_value').GetValue|D]に対し売り出された量は[ROOT.Var('news_world_29_news_shortage_exports_value').GetValue|D]にすぎず、需給圧力は1対[ROOT.Var('news_world_29_news_shortage_pressure_value').GetValue|2]となっている。製造業者、商人、政府は残る在庫を確保しようと競い合い、値上がりはこの品目を必要とするあらゆる産業へ波及している。"
  news_events_world.29.f: "市場部：買い手によれば契約は時間ごとに書き換えられている。ある仲買人は[ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting]争奪を「金があっても供給を保証できない市場」と表現した。"
  news_events_world.30.t: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]と[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]、地図を書き換える"
  news_events_world.30.d_exchange: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]と[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]は領土交換を締結した。約[ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D]人が暮らす[ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting]は[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]から[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]へ移り、約[ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D]人の[ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting]は反対方向へ移管される。国境は戦争ではなく合意によって引き直され、両地域の住民は別の政府の臣民となった。"
  news_events_world.30.d_a_to_b: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]は[ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting]を[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]へ移管することに同意した。この地には約[ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D]人が住むが、住民には意見を求められなかった。行政、課税、治安は新たな主権者の下で組み直され、財産、言語、地方官職をめぐる問題は長く法律家を悩ませるだろう。近隣政府は武力ではなく交渉で実現した国境変更を研究している。"
  news_events_world.30.d_b_to_a: "[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]は[ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting]を[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]へ移管することに同意した。この地には約[ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D]人が住むが、住民には意見を求められなかった。行政、課税、治安は新たな主権者の下で組み直され、財産、言語、地方官職をめぐる問題は長く法律家を悩ませるだろう。近隣政府は武力ではなく交渉で実現した国境変更を研究している。"
  news_events_world.30.f: "国境より：測量官は数日で線を動かせても、住民はその結果と何年も暮らす。商人、地主、地方官はどの規則が移管後も残るのかを問うている。"
  news_events_world.31.t: "ストライキ！ [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]の労働者が団結！"
  news_events_world.31.d_nationwide: "ストライキの波が[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]全土を覆っている。組織労働者が雇用主と閣僚の双方に要求を突きつけ、工場と公共事業で仕事が止まった。停止は国全体の生産に影響する規模となり、各党の新聞も重大性だけは認めている。対立が続けば急進主義を育て、政府を譲歩か弾圧かの選択へ追い込むとの懸念がある。どちらにも代償が伴う。"
  news_events_world.31.d_mining: "[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]で大規模な鉱山労働者ストライキが起こり、[ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]が混乱の中心となっている。労働者は強い不満を抱えて坑口を離れ、需要が最も高い時期に石炭と金属の工業への供給が脅かされている。不足が工場と鉄道へ広がる前に解決せよとの圧力が経営者と政府にかかる。鉱山地区では労働者委員会が独自に秩序を維持しており、当局はそれ自体を不穏視している。"
  news_events_world.31.d_industrial: "[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]で工場労働者が職場を離れ、[ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]は主要なストライキ中心地となった。賃金と労働時間を求める労働者と機械工により生産は中断している。経営者は失注、遊休設備、国外へ流れる契約を警告する一方、組合側はこの停止こそ「国は統治への発言権が最も少ない者の労働で動いている」ことの証明だと主張する。"
  news_events_world.31.d_railway: "[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]で鉄道労働者がストライキに入り、[ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]が中心となっている。長期停止は線路だけでなく、燃料と原料を必要とする工場、食料を必要とする都市、移動を鉄道に頼る軍隊まで脅かす。傷みやすい貨物はすでに側線で腐り始めた。麻痺が広がる前に運行再開か妥結を求める圧力が閣僚へかかり、別の手段で鉄道を動かす案まで公然と語られている。"
  news_events_world.31.d_movement: "[ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]の労働者は[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]で明白に政治的なストライキを始めた。この停止は一工場の苦情ではなく、より広い運動に属し、工場内の争いを直接国政へ持ち込んでいる。経営者は他都市への波及を恐れ、組織者は混乱を可視化することで政府が彼らを単なる治安問題ではなく政治勢力として扱うよう望んでいる。"
  news_events_world.31.d: "[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]で大規模なストライキが起こり、賃金、労働時間、労働者の境遇が全国的議題となった。長期停止が生産を落とし、他地域へ広がることを恐れ、閣僚と製造業者は警戒している。複数都市ではストライキ参加者の家族への募金も始まった。政府の対応次第で、争いが交渉、弾圧、あるいは誰も望まない広範な騒乱へ向かうかが決まるだろう。"
  news_events_world.31.f: "ピケラインより：組織者は実質的な譲歩が得られるまで停止を続けると主張する。経営側は、一つ一つの休止シフトが損失を増やし、他地域の労働者を勢いづかせると警告している。"

  ## Reader responses, one per story.
  news_events_world.1.a: "賢明な者が勝ることを願おう。"
  news_events_world.2.a: "事態は日に日に大きくなる。"
  news_events_world.3.a: "神よ、双方を救いたまえ。"
  news_events_world.4.a: "力の差がある争いは早く決着するものだ。"
  news_events_world.5.a: "銃剣は政権の良い土台にはならない。"
  news_events_world.6.a: "なんと忌まわしい事件だ。"
  news_events_world.7.a: "安らかに眠られんことを。"
  news_events_world.8.a: "新聞に書かれている以上の事情がありそうだ。"
  news_events_world.9.a: "民意は示された。"
  news_events_world.10.a: "農村には厳しい季節だ。"
  news_events_world.11.a: "今や街頭が決着をつける。"
  news_events_world.12.a: "旧秩序は終わった。"
  news_events_world.13.a: "まるで土地のように売買された。"
  news_events_world.14.a: "二匹の犬に一つの骨。"
  news_events_world.15.a: "完全に地図から消えた。"
  news_events_world.16.a: "御代の長からんことを。"
  news_events_world.17.a: "今日は署名、明日は兵士。"
  news_events_world.18.a: "憲法が作り替えられた。"
  news_events_world.19.a: "当局には十分な警告があった。"
  news_events_world.20.a: "厳しい年が続きそうだ。"
  news_events_world.21.a: "まさに世界の工場だ。"
  news_events_world.22.a: "列強の新たな配置だ。"
  news_events_world.23.a: "債権者は忘れまい。"
  news_events_world.24.a: "大国の卓に新たな声が加わった。"
  news_events_world.25.a: "どの帝国にも黄昏は来る。"
  news_events_world.26.a: "同盟国も敵国と同じほど激しく争う。"
  news_events_world.27.a: "ひとまず決着だ。"
  news_events_world.28.a: "永遠の友情とはこの程度か。"
  news_events_world.29.a: "値上がりはあらゆる家庭に響くだろう。"
  news_events_world.30.a: "今回は国境がペンで動いた。"
  news_events_world.31.a: "労働者は声を届かせた。"
  news_events_world.32.t: "[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting]、後退！"
  news_events_world.32.d: "[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetNameNoFormatting]は[ROOT.Var('news_world_32_news_backdown_target_ref').GetCountry.GetNameNoFormatting]との外交対立で後退し、戦争へ進む代わりに主要要求を受け入れた。国家の決意を試すものとされた危機は会議卓で終わり、諸外国の外務省はこの後退が[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting]の威信に何を意味するかをすでに計っている。"
  news_events_world.32.f: "外交部：各国外首都からの電報は戦争回避への即時の安堵を伝えている。しかし国内では政府の反対派が、平和の代価が高すぎなかったかを問い始めている。"
  news_events_world.32.a: "こうして危機は終わる。"

  news_events_world.1.t2: "欧州に緊張走る：[ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFormatting]、[ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFormatting]と対峙"
