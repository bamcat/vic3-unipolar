l_simp_chinese:
  news_events_world.1.t: "[ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFormatting]与[ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFormatting]濒临战争！"
  news_events_world.1.d: "[ROOT.Var('news_world_1_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]使[ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFlag]与[ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFlag]陷入公开对峙。当代两个最强大的国家如今因正式争端彼此相向，欧洲各国外交机关陷入多年未见的忙碌。信使昼夜往返于各首都，交易所动荡，社交场所也几乎只谈论此事。争端究竟会通过谈判解决，还是恶化为战争，将取决于未来数周提出的要求、向边境调动的部队，以及最终各政府选择站在哪一边。"
  news_events_world.1.f: "外交专栏：据称双方使节都工作到午夜之后。一名外国观察家形容气氛“公开场合彬彬有礼，私下里却毫无疑问充满敌意”。"
  news_events_world.2.t: "危机！[ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFormatting]与[ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFormatting]之间"
  news_events_world.2.d: "[ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFlag]已全力介入[ROOT.Var('news_world_2_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]，对抗[ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFlag]。一个一流强国选择卷入原本可能只是地区性的争端，彻底改变了危机的性质。邻国之间的纠纷如今成为列国共同关注的问题。各国外务机关正在仔细研究公开要求和新的承诺，而地区小国则低调盘算，在事情结束前究竟更能承受得罪哪一方。"
  news_events_world.2.f: "分析：一场地区争端如今吸引了所有主要外交部门的注意；小国正悄悄决定自己究竟得罪得起哪一边。"
  news_events_world.3.t: "战争！[ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFormatting]对[ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFormatting]！"
  news_events_world.3.d: "[ROOT.Var('news_world_3_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]已越过外交阶段，演变为[ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFlag]与[ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFlag]之间的公开战争。大使被召回，预备役奉命报到，交易所陷入混乱。征兵处从天亮起便挤满人群，铁路公司也把车辆交给战争部门使用。商人已经在询问哪些港口和航线还能开放、保险费会涨到多少；大陆各国政府则重新衡量条约如今可能要求它们承担的义务。"
  news_events_world.3.f: "前线来报：随着预备役、弹药和马匹向战区运输，铁路时刻表正在让位于军用调度。商人已经开始询问哪些港口和路线还能保持安全。"
  news_events_world.4.t: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFormatting]发动对[ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFormatting]的入侵"
  news_events_world.4.d: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFlag]已在[ROOT.Var('news_world_4_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]中对[ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFlag]开战。双方实力差距有目共睹，一些首都已经有人预测战争会迅速而廉价地结束，另一些人则呼吁谨慎。我们的军事记者提醒读者，距离、恶劣地形、疾病和第三方干预曾无数次让纸面上占尽优势的军队蒙羞；以自信预言开局的战役，很少能在预定的季节内结束。"
  news_events_world.4.f: "军事专栏：纸面实力差距也许很大，但记者提醒，距离、地形与外国干预曾毁掉许多所谓“轻而易举”的战役。"
  news_events_world.5.t: "[ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFormatting]发生政变"
  news_events_world.5.d: "[ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFlag]的政治秩序被武力推翻。权力如今掌握在[ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetRuler.GetFullName]手中，国家将以[ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetGovernment.GetName]形式治理。各部、各电报局和主要火车站在黎明前便被控制。军队是否会像首都一样在地方服从新主人，现行法律和国际条约是否继续有效，被赶下台的势力会屈服还是转入反抗，目前首都无人能有把握地回答。"
  news_events_world.5.f: "首都独家：居民称各部、车站和电报局都有士兵把守。一名职员告诉本报：“到了早晨制服已经换了，但没人知道他们究竟听谁的命令。”"
  news_events_world.6.t: "[ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFormatting]的[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle]遇刺"
  news_events_world.6.d: "统治[ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_6_character_ref').GetCharacter.GetFullName]，时年[ROOT.Var('news_world_6_character_ref').GetCharacter.GetAge]岁，已遭刺客杀害。国家元首之死立即造成震动，部长们正确保首都、驻军和国库安全，并努力维持至少表面上的政权连续性。外国政府要求保证条约与军事指挥体系不受影响。对幕后阴谋的调查才刚开始，国内各派都高度关注最终责任会落到谁身上。"
  news_events_world.6.f: "安全专栏：调查人员正在追捕同谋，部长们则急于证明国家仍在掌控之中。尚未解答的问题是：刺客是独自行事，还是代表某个等待下一步行动的派系？"
  news_events_world.7.t: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullNameNoFormatting]去世；[ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFormatting]举国哀悼"
  news_events_world.7.d: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullName]在统治[ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFlag]期间去世，享年[ROOT.Var('news_world_7_character_ref').GetCharacter.GetAge]岁。公共建筑披上黑布，首都商店纷纷关闭。继承将按照习俗与法律规定的方式进行，部长们一致强调政策和政权的连续性。然而外国各大使馆私下都在问同一个问题：这次更替是否会改变同盟、政策，或长期围绕王位形成的各派力量平衡。"
  news_events_world.7.f: "首都来报：群众聚集等待继承消息，公共建筑挂起丧布。仪式背后，部长们已开始争夺对下一个统治时期意义的解释权。"
  news_events_world.8.t: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetLastNameNoFormatting]在[ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFormatting]被赶下台"
  news_events_world.8.d: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetFullName]尚在人世便被逐出[ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFlag]的权力中心，[ROOT.Var('news_world_8_new_ruler_ref').GetCharacter.GetFullName]已接掌国家。该国将以[ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetGovernment.GetName]形式治理。一个在没有选举、死亡或正常继承的情况下被撤换的在世统治者，很少能有简单解释，官方说法也没有说服多少人。外交官正关注部长任命和驻军动向，试图弄清闭门之后发生了什么，以及新政府究竟建立在同意之上还是刺刀之上。"
  news_events_world.8.f: "政治分析：一个活着的统治者若并非因选举、死亡或正常继承而离位，背后往往不会只有一个简单解释。"
  news_events_world.9.t_presidential: "[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting]赢得[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting]总统选举"
  news_events_world.9.d_presidential: "[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting]赢得了[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag]的选举，[ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName]将出任总统。该党候选人获得总票数的[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetCurrentVotingPowerShare|%1]。一些地方举行庆祝，另一些地方则公开失望，败方利益集团已开始质疑若干选区的投票过程。外国政府正在评估这一结果对外交、贸易、军事政策以及这个当代强国整体政治风向可能意味着什么。"
  news_events_world.9.t_party: "[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting]在[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting]选举中大获全胜"
  news_events_world.9.d_party: "[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting]在[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag]选举结束时成为最强党，其候选人获得总票数的[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetCurrentVotingPowerShare|%1]。大城市的委员会直到午夜后仍在计票，多个选区的结果受到争议。外国政府、投资者和政治运动正在衡量新的党派平衡将如何影响内政与外交，以及新政府能否长期维持有效多数。"
  news_events_world.9.t_government: "[ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting]将领导[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting]政府"
  news_events_world.9.d_government: "选举后，[ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting]成为[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag]政府中的主要政党，获得总票数的[ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetCurrentVotingPowerShare|%1]。在王室超然于党争之上的国家，一场选举可以彻底改变其下方的权力平衡而不触动国家元首。外国政府和商界正密切观察新内阁，因为内阁组成往往比任何御前演说更能反映一个国家的真实意图。"
  news_events_world.9.t: "[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting]选举结束"
  news_events_world.9.d: "[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag]的选举已经结束。由于该国在世界上的分量，这一结果不只是国内竞赛，更是国际事件。结果公布数小时内便通过电报传到欧洲各首都。外国政府和政治运动正在研究各党力量以及[ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName]的地位，因为新政府可能影响外交、贸易、舰队和陆军部署乃至整个时代的政治气氛。国内则正式进入组阁阶段。"
  news_events_world.9.f: "选举专栏：各党总部同时在庆祝、争议和重新计票。国外会把结果视为该国下一步外交与商业方向的线索。"
  news_events_world.10.t_drought: "干旱笼罩[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_drought: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]久旱无雨，约[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的生计依赖收成。田地龟裂，水库水位逐周下降，农民因预期最坏情况而减少播种。牧民每天把牲畜赶得更远寻找水源，粮商也已提高远期报价。集镇开始组织救济委员会。若干旱持续整个季节，一次歉收可能恶化为更严重的灾难，而最先承受重担的将是最无力负担的人。"
  news_events_world.10.t_flood: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]遭遇毁灭性洪水"
  news_events_world.10.d_flood: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]河流泛滥，田地和村庄被淹，道路中断。救援队艰难前往完全孤立的社区，当局则检查桥梁和堤坝损失。牲畜死亡据报十分严重，许多家庭的冬季储备也被彻底毁掉。这个约有[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的地区，农作物与运输遭受的损失将在洪水退去很久后仍影响市场。"
  news_events_world.10.t_frost: "严霜摧残[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_frost: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]遭遇异常严霜。种植者报告田地发黑、果园被毁，寒冷袭击了已进入生长期后段的作物。在约有[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的地区，失去一季收成绝非小事。商人预计受灾最重地区月底前就会出现短缺，农民则等待看晚播能否挽回部分损失。"
  news_events_world.10.t_wildfire: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]山火迫使居民撤离"
  news_events_world.10.d_wildfire: "大火正穿过[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]，迫使家庭离开家园，并威胁农场、林木与道路。烟雾笼罩大片地区，据称正午太阳都呈红色。地方当局正用能召集到的人手开辟防火带，多个教区已经动员民兵。这个约有[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的州，财产、牧场和林木损失可能在最后一处火焰熄灭后仍长期拖累当地。"
  news_events_world.10.t_hailstorm: "冰雹毁掉[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]收成"
  news_events_world.10.d_hailstorm: "猛烈冰雹横扫[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]，撕碎成熟庄稼，砸破屋顶和玻璃，并重伤露天牲畜。几小时前还接近收割的田地如今被打平。在约[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的州，即便局部作物损失也会迅速推高面包价格并打击农村收入。保险公司已收到索赔，地方当局则在统计没有保险者的损失。"
  news_events_world.10.t_locust_swarm: "蝗群降临[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_locust_swarm: "密集蝗群扑向[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]，啃食田地的速度超过村民防守能力。粮仓昼夜有人守卫，农民用火、棍棒与烟驱赶虫群。报道称蝗群经过时甚至遮暗天空。受灾地区约有[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人，当局担心若虫灾持续或蔓延到邻近农区，饥荒将紧随其后。"
  news_events_world.10.t_heatwave: "酷热笼罩[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_heatwave: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]被严酷热浪笼罩。水井见底，牲畜死在田野，庄稼在无情烈日下枯萎。城镇报告老人和幼童死亡，运水车从黎明一直工作到天黑。这个约有[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的州，其当局对居民健康的担忧不亚于收成，因为长期高温会同时压迫食物、水和运输。"
  news_events_world.10.t_disease_outbreak: "病害蔓延[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_disease_outbreak: "疾病正在[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]田地和畜群中传播。检查员努力在疫病扩散至下一地区前确定受害土地和牲畜。隔离和扑杀也许能保住更广泛的收成，却会立即毁掉被扑杀牲畜或封闭农田的农户。在约[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的州，后果不仅影响种植者，也会影响每一个在市场购买食物的家庭。"
  news_events_world.10.t_extreme_winds: "暴风在[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]留下毁灭之路"
  news_events_world.10.d_extreme_winds: "极端强风袭击[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]，屋顶、树木、电报线和庄稼均受损。工人清理主要道路上的碎片时，公路和铁路运输放缓，与多个社区的通信完全中断。在约[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的州，最大损失可能并非某一场显眼灾难，而是运输与收成同时受阻。"
  news_events_world.10.t_torrential_rains: "暴雨淹没[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]田野"
  news_events_world.10.d_torrential_rains: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]大雨不停，田地完全浸透，低洼道路与河岸被淹。农民担心即便村庄保持干燥，积水也会让作物烂在地里。商人越来越担忧铁路与集市道路。在约[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的地区，收获季的长期湿雨足以造成与风暴相当的损失。"
  news_events_world.10.t_pollinator_surge: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]果园迎来非凡季节"
  news_events_world.10.d_pollinator_surge: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]农民报告蜜蜂等授粉昆虫数量异常丰富。果园和开花作物的坐果情况达到人们记忆中罕见的水平。若天气保持，丰收前景十分乐观。在约[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的州，好年景会降低食品价格，并提高远超最初受益农场范围的农村收入。"
  news_events_world.10.t_optimal_sunlight: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]迎来黄金季节"
  news_events_world.10.d_optimal_sunlight: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]正享受异常理想的日照季。农民报告作物生长旺盛，尤其需要长日照的品种前景极佳。商人已准备应对更大的收获运输量，承运人也开始雇用更多车辆。在约[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的地区，丰收会惠及每个市场和家庭；农民只提醒说，还需再保持数周好天气才可真正放心。"
  news_events_world.10.t_moderate_rainfall: "甘霖滋润[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_moderate_rainfall: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]在生长季最合适的时刻迎来持续适中的降雨。田地得到水分，却没有暴雨造成的积水，老农也罕见地表示满意。在约[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的州，丰收预期已经稳定粮价。商人正在仓库腾出空间，准备接收比原先预期更多的粮食和农产品。"
  news_events_world.10.t_tsunami: "巨浪摧毁[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]海岸"
  news_events_world.10.d_tsunami: "巨浪袭击[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]海岸，摧毁港口与低洼聚落。沿岸消息仍十分零碎，救援队在残骸中搜索，多艘船被报告连同全体船员失踪。受灾州约有[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人，死亡人数尚无法统计；沿海贸易的中断恐怕也会持续到救援结束很久以后。"
  news_events_world.10.t_earthquake: "地震夷平[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]城镇"
  news_events_world.10.d_earthquake: "强烈地震震动[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]，建筑倒塌，道路、铁路和供水设施断裂。救援人员在灯光下挖掘废墟，余震妨碍寻找失踪者，也迫使幸存者留在露天。已有整片地区化为废墟的报告。在约[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的州，即便破坏范围有限也可能造成重大伤亡和持续数年的重建负担。"
  news_events_world.10.t_calm_waters: "平静海面惠及[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]港口"
  news_events_world.10.d_calm_waters: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]沿岸海面异常平静。渔船与沿海航运几乎不受延误，港口正在船长们记忆中最理想的条件下装卸货物。若这种状况持续，商人预计海上损失会减少，保险费也会略有下降。对于约有[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的沿海州，平静海况会直接反映在鱼类和进口商品的价格与供应上。"
  news_events_world.10.t_fog: "浓雾笼罩[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_fog: "浓雾笼罩[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]，公路、铁路和水上能见度同时下降。船只测深缓慢进港，列车在信号站之间谨慎行驶。眼下最大危险是碰撞，已有数起小事故报告。在约[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的地区，若浓雾持续，所有运输都会延误，城镇日常商业也将受阻。"
  news_events_world.10.t_cyclone: "气旋袭击[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_cyclone: "气旋正横扫[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]，带来破坏性强风和倾盆大雨。沿海社区报告屋顶掀落、树木连根拔起、通信中断，当局则急于为被迫离家的居民提供住所。风暴路径上约有[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人，风灾与洪水叠加，令人担忧灾害影响将以月而非周计算；在通信恢复前，全部损失仍无从得知。"
  news_events_world.10.t_ice: "严冰封锁[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_ice: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]遭受严重冰冻。道路和铁路变得危险，水道减速，部分地区甚至完全停航，露天作物和牲畜也饱受严寒。最需要煤炭的时候，煤炭运输反而严重受阻。商人警告，若库存耗尽前冰冻仍不解除，在约[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的州，运输中断的损失可能与田间直接损失一样严重。"
  news_events_world.10.t_rough_waters: "恶劣海况关闭[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]港口"
  news_events_world.10.d_rough_waters: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]沿岸海况恶劣。渔船留在港内，商船推迟启航，港务部门也警告进港危险。数艘船已误期。对于约有[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的沿海州，海运反复中断会迅速推高食品价格和保险费用，并阻碍城市依赖的各种进口商品流通。"
  news_events_world.10.t_strong_winds: "持续大风侵袭[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_strong_winds: "持续强风正吹袭[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]。暴露的农场和交通线路受到损害，水手与港务人员也在整条海岸线上应对恶劣条件。风并非处处造成毁灭，但持续时间已开始妨碍收获、地方交通和正常货物流通。在约[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人的地区，这类干扰几天内就会反映到市场上。"
  news_events_world.10.t_tropical_storm: "热带风暴逼近[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_tropical_storm: "热带风暴进入[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]，带来暴雨、强风和危险海况。当局警告低洼社区，港口减少交通，农民则尽力保护作物和牲畜。受影响州约有[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人，即使风暴未达到气旋强度，也可能广泛破坏住房、收成和许多小型聚落赖以生存的沿海贸易。"
  news_events_world.10.t_fallback: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]出现异常气候"
  news_events_world.10.d_fallback: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]的[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]正遭遇异常天气变化。当局从农场、运输部门和地方市场收集报告，以判断影响究竟是灾祸还是福音，而最初消息彼此矛盾。受影响州约有[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]人，即便收成条件只是短期改变，也可能产生远超最初受影响地区的后果。"
  news_events_world.10.f: "灾区来报：农民和地方官员描述收成毁损、运输中断以及市场不安。早期报告仍不完整，真正损失规模可能数周后才会明确。"
  news_events_world.11.t: "[ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFormatting]爆发革命"
  news_events_world.11.d: "反对[ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFlag]的革命起义已经爆发。叛军组织为[ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetNameNoFlag]，并宣布以[ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetGovernment.GetName]取代旧秩序。工人区已经筑起街垒，据报部分驻军也已倒戈。争端已从政治鼓动变成争夺国家本身的武装斗争。邻国政府公开不安地观察现政权能否经受挑战，以及一旦革命成功会给境外树立怎样的榜样。"
  news_events_world.11.f: "本报记者：街垒建立的速度比宣言印刷还快。居民描述一些街区权力逐街变化，谣言传播得比任何官方命令都快。"
  news_events_world.12.t: "革命者在[ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFormatting]获胜"
  news_events_world.12.d: "革命者赢得了[ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFlag]的内战，一个大国的国家机器如今落入[ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetRuler.GetFullName]领导下的[ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetGovernment.GetName]手中。这场胜利会远远超出国界，令朋友振奋，也令敌人担忧。外国首都会依据新政府颁布的法律、承认的债务和履行的条约，而不是口号来判断胜者。新政府最初数月将决定许多战场无法决定的问题。"
  news_events_world.12.f: "分析：胜利让革命者掌握各部，却不会自动带来官僚体系、军队或公众信任。执政最初几天可能与把他们送上台的战斗同样关键。"
  news_events_world.13.t: "购买[ROOT.Var('news_world_13_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.13.d: "根据[ROOT.Var('news_world_13_news_treaty_ref').GetTreaty.GetNameNoFormatting]，[ROOT.Var('news_world_13_news_event_state_ref').GetState.GetName]已从[ROOT.Var('news_world_13_news_state_giver_ref').GetCountry.GetNameNoFlag]转交给[ROOT.Var('news_world_13_news_state_taker_ref').GetCountry.GetNameNoFlag]。被转让领土约有[ROOT.Var('news_world_13_news_event_state_ref').GetState.GetPopulationSize|D]人，这绝非地图上的微小调整。行政、财产、军事通行权和居民地位都需重新确定，邻国政府也在计算新边界对自身安全的影响。当地居民本人并未被征询意见。"
  news_events_world.13.f: "边境来报：居民等待得知新旗帜会带来哪些法律、税收与官员。对于住在被转让土地上的人，一份在遥远首都签署的文件就是立即更换政府。"
  news_events_world.14.t: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFormatting]宣布[ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFormatting]为宿敌"
  news_events_world.14.d: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFlag]与[ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFlag]正式进入公开竞争。两个举足轻重的国家把彼此置于对立地位，预计这会使大陆各方阵营更加僵硬。大使仍留任，但日常礼节明显冷淡。未来双方每一次争端，无论大小，都将透过这层敌意解读；过去可能由官员私下解决的问题，如今也会在世界注视下公开较量。"
  news_events_world.14.f: "国际专栏：外交官预计，今后两国任何争端都会被视作新敌意的一部分，甚至包括昨天还可能悄悄解决的小事。"
  news_events_world.15.t: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFormatting]向[ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetAdjectiveNoFormatting]武装力量投降"
  news_events_world.15.d: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFlag]已不再作为独立国家存在，剩余领土依照[ROOT.Var('news_world_15_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]强加的条件被[ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag]吸收。一个政府从国家名册上被抹去，各部解散，驻外代表也失去了可服务的祖国。[ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag]如今必须承担征服土地及其居民的治理责任，而邻国则在判断这究竟结束了一场争端，还是孕育下一场争端。"
  news_events_world.15.f: "前首都来报：政府招牌正在拆除，官员必须决定是否为新当局效力。国家可以迅速从地图消失，但地方忠诚不会同样迅速消散。"
  news_events_world.16.t: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetLastNameNoFormatting]在[ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFormatting]继承权力"
  news_events_world.16.d: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetAge]岁的[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetFullName]在前任统治者去世后接掌[ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFlag]。国家以[ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetGovernment.GetName]形式治理。由于该国属于世界主要强国，外交官已开始评估新统治者的友谊、信念，以及在统治初期脆弱阶段巩固权威的能力。宫廷强调延续性，各使馆则没有那么确信。"
  news_events_world.16.f: "宫廷专栏：廷臣公开强调延续，但每次继承都会重排接近权力核心的机会和影响力。外国大使正研究谁最靠近新统治者。"
  news_events_world.17.t: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFormatting]与[ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFormatting]缔结同盟"
  news_events_world.17.d: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFlag]与[ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFlag]加入[ROOT.Var('news_world_17_news_treaty_ref').GetTreaty.GetNameNoFormatting]，建立正式同盟。部分条款已经公布，但普遍认为还存在未提交任何议会的进一步谅解。军事规划人员和敌对政府正仔细研究义务，因为如此重要的同盟可能重写未来危机的计算，使一场地方争端在任何一方有时间重新考虑前就扩大为全面战争。"
  news_events_world.17.f: "军事分析：同盟最大的作用往往在第一枪打响之前。参谋部现在必须按“与一方开战可能意味着同时与双方开战”的假设重画计划。"
  news_events_world.18.t: "[ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFormatting]的新政府"
  news_events_world.18.d: "[ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFlag]颁布了[ROOT.Var('news_world_18_news_new_law_ref').GetLaw.GetName]，这一变化足以改变国家本身的结构。国家如今以[ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetGovernment.GetName]形式治理。外国首都重新评估与新秩序的关系，国内支持者欢庆，反对者则准备迎接自己长期预言的后果。律师和公务员已经开始处理改革的实际问题，一周前还似乎永久不变的头衔、部门和程序如今都可能需要彻底改写。"
  news_events_world.18.f: "宪政专栏：律师和公务员正在处理新秩序的实际后果。曾被视为永久不变的头衔、部门和旧程序如今可能都需改写。"
  news_events_world.19.t: "[ROOT.Var('news_world_19_news_event_state_ref').GetState.GetNameNoFormatting]局势动荡，地方经济受挫并陷入不稳"
  news_events_world.19.d: "[ROOT.Var('news_world_19_news_source_country_ref').GetCountry.GetNameNoFlag]境内的[ROOT.Var('news_world_19_news_event_state_ref').GetState.GetName]，约有[ROOT.Var('news_world_19_news_event_state_ref').GetState.GetPopulationSize|D]居民，正在报告严重骚乱。罢工、骚动和有组织的不满已达到威胁正常行政的程度。商店提前关门，公众集会吸引远超原定规模的人群，警察也从邻近地区获得增援。若动荡持续，政府的控制力可能显著削弱，并扰乱更广泛的国家商业。"
  news_events_world.19.f: "街头来报：店主说他们正在提前关门，公共集会也吸引异常庞大的人群。当局坚称秩序可以恢复，但居民表示在任何暴乱发生前，紧张气氛就已清晰可见。"
  news_events_world.20.t: "[ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFormatting]陷入衰退"
  news_events_world.20.d: "[ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFlag]的商业活动突然大幅收缩。国内产值在一个月内从约£[ROOT.Var('news_world_20_news_recession_previous_gdp_value').GetValue|D]降至£[ROOT.Var('news_world_20_news_recession_current_gdp_value').GetValue|D]，跌幅为[ROOT.Var('news_world_20_news_recession_drop_value').GetValue|%1]。订单减少，信贷收紧，制造商称需求弱到多年未见。工人担忧工资和职位，外国市场则紧张观察衰退是否会通过贸易与投资蔓延到原本自认为安全的企业。"
  news_events_world.20.f: "市场专栏：银行家和制造商寻找收缩只是暂时现象的迹象。一位分析人士警告，信心或许能迅速恢复，但裁员与企业倒闭也可能把糟糕的一个月变成长期萧条。"
  news_events_world.21.t: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFormatting]的GDP达到10亿"
  news_events_world.21.d: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFlag]成为世界首个年产值超过十亿英镑的国家，统计时约为£[ROOT.Var('news_world_21_news_billion_gdp_value').GetValue|D]。其制造、贸易和购买力的集中程度为所有竞争者树立了新的比较标准。经济学家争论这一成就究竟说明什么；它并不能显示财富由谁获得，却宣告了一种任何政府都无法再忽视的工业规模。"
  news_events_world.21.f: "金融专栏：经济学家已经在争论这一成就真正意味着什么。它几乎不说明财富落到谁手中，但展示了竞争者无法忽视的工业规模。"
  news_events_world.22.t: "[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFormatting]宣布新的国际协定"
  news_events_world.22.d: "在[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFlag]领导下，一个新的集团[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName]成立，以[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetIdentity.GetName]原则为核心，创立时共有[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers]个成员国。其他政府正仔细研究其章程和成员，因为这样的组织可能重塑整个地区的贸易、同盟与政治影响。它究竟会成为持久制度还是一时便利，只有当成员面对一场无人主动选择的危机时才会知道。"
  news_events_world.22.f: "外交分析：新集团常在真正危机考验前最爱强调团结。各国外务机关会比成立典礼更仔细观察成员间的第一次争执。"
  news_events_world.23.t: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFormatting]债务违约！"
  news_events_world.23.d: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFlag]未能履行债务义务。违约时公共本金约为£[ROOT.Var('news_world_23_news_default_principal_value').GetValue|D]，信用上限为£[ROOT.Var('news_world_23_news_default_credit_limit_value').GetValue|D]。债权人面临重大损失，国家未来即便还能借款，成本也会更高。外国银行与政府正观察危机蔓延、政治失序，以及国库是否已经无法维持政府权威所依赖的军队和行政体系。"
  news_events_world.23.f: "金融专栏：债券持有人定价的不只是算术，还有政治。协商解决可能恢复信心；长期违约则会让危机结束后很久的每笔新贷款都更昂贵。"
  news_events_world.24.t: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFormatting]跻身列强"
  news_events_world.24.d: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFlag]已升入世界强国第一梯队，年产值约为£[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetGDP|D]。这一晋升反映了财富、军备和影响力的巨大积累，也让该国在当今重大外交问题上拥有发言权。既有列强正在判断应拉拢新成员为盟友，还是把它视为对手；新列强也可能发现，承认带来的义务与特权一样沉重。"
  news_events_world.24.f: "国际专栏：邀请、礼仪与外交算计几乎会立即变化。新晋列强可能发现，承认不仅意味着影响力，也意味着必须在过去看似遥远的争端中选边站。"
  news_events_world.25.t: "[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFormatting]的衰落"
  news_events_world.25.d: "[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFlag]已经跌出强国第一梯队，年产值现约为£[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetGDP|D]。这不仅是礼仪变化，而是表明其吸引国际重视、塑造世界均势的能力下降。国内部长面临恢复失去实力与地位的压力，反对派也获得了大量攻击材料。国外旧伙伴很可能会比一年前更强硬地谈判。"
  news_events_world.25.f: "分析：地位下降会先在会议室而非地图上被感受到。旧伙伴可能更强硬，竞争对手则会试探这种衰落究竟暂时还是长期。"
  news_events_world.26.t: "[ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFormatting]的领导权受到挑战"
  news_events_world.26.d: "由[ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers]个成员国组成的[ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName]内部爆发领导权争夺。[ROOT.Var('news_world_26_news_bloc_contender_ref').GetCountry.GetNameNoFlag]正在挑战现任领袖[ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFlag]。官员坚称日常合作不受影响，但各代表团正在格外仔细地清点支持者。若争夺长期持续，可能同时分裂多个政府，并给外部强国利用混乱的机会。"
  news_events_world.26.f: "集团内部：官员强调正常合作仍在继续，但代表团正异常仔细地计算支持者。即使不用军队，领导权斗争也足以把盟友分成对立阵营。"
  news_events_world.27.t: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFormatting]夺取同盟领导权"
  news_events_world.27.d: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFlag]在由[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetNumMembers]个成员国组成的[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetName]领导权争夺中击败[ROOT.Var('news_world_27_news_bloc_loser_ref').GetCountry.GetNameNoFlag]。组织内各政府正在判断，这次变化会加强团结，还是激起原领袖支持者的抵抗。争夺已经结束，但它暴露出来的忠诚关系不会轻易消失；新领导国也继承了一批明显更希望另一方获胜的伙伴。"
  news_events_world.27.f: "外交专栏：竞争结束了，忠诚问题却未必结束。新领袖接手的组织中，有些政府原本更希望败者获胜。"
  news_events_world.28.t: "[ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFormatting]与[ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFormatting]分道扬镳"
  news_events_world.28.d: "把[ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFlag]与[ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFlag]联系在一起的[ROOT.Var('news_world_28_news_treaty_ref').GetTreaty.GetNameNoFormatting]已经解散。关系破裂取消了一项重要承诺，迫使双方政府重新考虑军事计划和未来危机中的立场。双方首都都发表了措辞遗憾却无人真正相信的声明。对手已在研究裂痕可能带来的机会；如今的问题是原伙伴会到哪里寻找安全，以及谁准备填补这段关系留下的空缺。"
  news_events_world.28.f: "国际专栏：外交官认为关系破裂本身比正式取消更重要。接下来要看两位旧伙伴去哪里寻求安全，又有谁愿意替代原有关系。"
  news_events_world.29.t: "恐慌！全球[ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting]短缺！"
  news_events_world.29.d: "世界市场出现严重[ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting]短缺，价格已远高于商界认为正常的水平。市场需求约为[ROOT.Var('news_world_29_news_shortage_imports_value').GetValue|D]，而出售量只有[ROOT.Var('news_world_29_news_shortage_exports_value').GetValue|D]，供需压力达到1比[ROOT.Var('news_world_29_news_shortage_pressure_value').GetValue|2]。制造商、商人和各国政府都在争夺剩余库存，更高成本正传导到所有依赖该商品的行业。"
  news_events_world.29.f: "市场专栏：买家称合同几乎每小时都在重写。一名经纪人把争夺[ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting]形容为“有钱也不再能保证买得到货”的市场。"
  news_events_world.30.t: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]与[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]重绘地图"
  news_events_world.30.d_exchange: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]与[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]达成领土交换。约有[ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D]人的[ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting]从[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]转交[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]，而约有[ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D]人的[ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting]则向相反方向转移。边界不是通过战争，而是通过协议重新划定，两地居民醒来后发现自己已成为另一个政府的臣民。"
  news_events_world.30.d_a_to_b: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]同意把[ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting]转交[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]。该地区约有[ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D]人，而他们并未被征询意见。行政、税收和安全必须在新主权者之下重新安排，财产、语言和地方官职问题会让律师忙上多年。邻国政府正在研究这次通过谈判而非武力完成的边界变化，并各自作出判断。"
  news_events_world.30.d_b_to_a: "[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]同意把[ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting]转交[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]。该地区约有[ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D]人，而他们并未被征询意见。行政、税收和安全必须在新主权者之下重新安排，财产、语言和地方官职问题会让律师忙上多年。邻国政府正在研究这次通过谈判而非武力完成的边界变化，并各自作出判断。"
  news_events_world.30.f: "边境来报：测量员几天就能移动边界线，但居民要用多年承受后果。商人、地主和地方官员已在询问转交后哪些规则仍然有效。"
  news_events_world.31.t: "罢工！[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]工人联合起来！"
  news_events_world.31.d_nationwide: "罢工浪潮正席卷[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]全国。组织起来的劳工同时向雇主和部长提出要求，工厂和公共工程停工。停工规模已经足以影响全国生产，各党报纸虽然意见不一，却都承认局势严重。人们担心持续对抗会滋生激进主义，迫使政府在让步与镇压之间选择，而两条路都有代价。"
  news_events_world.31.d_mining: "[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]爆发大规模矿工罢工，[ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]是混乱中心。矿工在强烈不满中离开矿井，而恰逢需求最高之际，工业所需煤炭和金属供应受到威胁。雇主和部长受到压力，必须在短缺从井口蔓延到工厂和铁路前解决争端。矿区报告工人委员会正在自行维持秩序，当局对此的忧虑不亚于真正的骚乱。"
  news_events_world.31.d_industrial: "[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]的工厂工人已经罢工，[ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]是主要中心之一。工人与机械工要求提高工资并缩短工时，生产因此中断。雇主警告订单流失、工厂闲置以及合同转往海外一去不返；工会则认为，停工恰好证明了他们长期主张的一点：国家靠那些最少参与决定如何治理国家的人劳动运转。"
  news_events_world.31.d_railway: "[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]铁路工人罢工，混乱集中在[ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]。长期停运威胁的不只是铁路本身：工厂靠火车获得燃料和材料，城市靠它获得食物，军队靠它调动。易腐货物已经在侧线上变质。部长们被要求在瘫痪扩散前恢复服务或达成协议，一些地方甚至公开讨论用完全不同的方式运营铁路。"
  news_events_world.31.d_movement: "[ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]的工人在[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]发动了一场明显具有政治性质的罢工。这次停工属于更广泛的运动，而非某个车间的单一不满，它把工厂内部的争议直接带入国家政治。雇主担心示范效应蔓延到其他城市，组织者则希望可见的混乱迫使政府把他们当作政治力量谈判，而非仅仅当作需要警察处理的骚扰。"
  news_events_world.31.d: "[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]爆发重大罢工，全国注意力转向工资、工时和工人处境。局势严重到足以让部长和制造商担忧，他们害怕长期停工会削减生产并鼓励其他地方仿效。多个城镇正在为罢工者家庭募捐。政府的回应可能决定争端最终以谈判、镇压，还是比任何一方预想都更广泛的骚乱收场。"
  news_events_world.31.f: "纠察线来报：组织者坚持在获得真正让步前不会复工；雇主则警告，每一个空转班次都会增加损失，并鼓舞其他地区工人加入。"

  ## Reader responses, one per story.
  news_events_world.1.a: "愿更明智的人占上风。"
  news_events_world.2.a: "事情一天比一天大。"
  news_events_world.3.a: "愿上帝帮助双方。"
  news_events_world.4.a: "强弱悬殊的争端通常很快就有结果。"
  news_events_world.5.a: "刺刀可不是好根基。"
  news_events_world.6.a: "真是邪恶的勾当。"
  news_events_world.7.a: "愿其安息。"
  news_events_world.8.a: "事情恐怕比报纸说的更多。"
  news_events_world.9.a: "人民已经发声。"
  news_events_world.10.a: "乡村要熬过一个艰难季节。"
  news_events_world.11.a: "现在要由街头决定了。"
  news_events_world.12.a: "旧秩序结束了。"
  news_events_world.13.a: "像一块地产一样被买卖。"
  news_events_world.14.a: "两条狗，一根骨头。"
  news_events_world.15.a: "彻底从地图上抹去了。"
  news_events_world.16.a: "愿其长久统治。"
  news_events_world.17.a: "今天签字，明天出兵。"
  news_events_world.18.a: "宪制被重新塑造。"
  news_events_world.19.a: "当局早就得到了充分警告。"
  news_events_world.20.a: "艰难岁月就在前头。"
  news_events_world.21.a: "果真是世界工厂。"
  news_events_world.22.a: "强国之间又有了新的安排。"
  news_events_world.23.a: "债权人不会忘记。"
  news_events_world.24.a: "大国桌上又多了一个声音。"
  news_events_world.25.a: "每个帝国都有黄昏。"
  news_events_world.26.a: "盟友争起来也和敌人一样狠。"
  news_events_world.27.a: "至少暂时算解决了。"
  news_events_world.28.a: "所谓永恒友谊也不过如此。"
  news_events_world.29.a: "每个家庭都会感受到价格上涨。"
  news_events_world.30.a: "这一次，边界是用笔移动的。"
  news_events_world.31.a: "工人终于让人听见了声音。"
  news_events_world.32.t: "[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting]退让了！"
  news_events_world.32.d: "[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetNameNoFormatting]在与[ROOT.Var('news_world_32_news_backdown_target_ref').GetCountry.GetNameNoFormatting]的外交对峙中退让，选择接受主要要求，而不是把争端带向战争。原本被描绘为国家决心考验的危机最终在会议桌上结束，各国外务机关已经在衡量这次撤退会给[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting]威望带来什么影响。"
  news_events_world.32.f: "外交专栏：各国首都传来的电报显示，战争得以避免后人们立即松了一口气。然而在国内，政府反对派已经开始追问：和平的代价是否太高？"
