l_simp_chinese:

 news.1.t:0 "一件值得注意的大事"
 news.1.d:0 "这是一则测试剪报。如果这里显示得像一张报纸, , 顶部有本国报头，文章排印在纸面上，而且窗口周围没有深色边框或标题栏, , 那么这种窗口类型就运行正常。它也应当仍然可以拖动。"
 news.1.f:0 "本报通讯员已整装待发。"
 news.1.a:0 "头等大新闻！"

 news.2.t:0 "俄国革命"
 news.2.d:0 "[ROOT.Var('news_test_2_news_attacker_ref').GetCountry.GetNameNoFlag]已正式向[ROOT.Var('news_test_2_news_defender_ref').GetCountry.GetNameNoFlag]宣战。边境沿线正在动员军队，各大国外交部门对此深感忧虑。外交官已被召回，交易所陷入混乱。本报通讯员正赶赴战区，预计晚间邮报送达时会有更多详情。外交官已被召回，交易所陷入混乱。本报通讯员正赶赴战区，预计晚间邮报送达时会有更多详情。外交官已被召回，交易所陷入混乱。本报通讯员正赶赴战区，预计晚间邮报送达时会有更多详情。"
 news.2.f:0 "外交失败之处，炮声开始说话。"
 news.2.a:0 "实在是令人不安的消息。"
