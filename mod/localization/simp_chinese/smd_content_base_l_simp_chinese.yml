 je_transit_rights: "内陆!"
 je_transit_rights_reason: "[ROOT.GetCountry.GetName]没有海岸线。 进入国际市场完全取决于邻国的善意。 确保与其中至少一方达成过境权利协定对于贸易和战略灵活性至关重要。"
