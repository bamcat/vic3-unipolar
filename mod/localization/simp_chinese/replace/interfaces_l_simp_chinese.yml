l_simp_chinese:
 GDP_TOOLTIP:0 "#header [Country.GetAdjective]的[concept_gdp]#!\n本国拥有的$concept_gdp_short$（[Country.GetGDPRanking]）：@money![Country.MakeScope.ScriptValue('cwp_gdp')|Dv]（#u #tooltippable #tooltip:[Country.GetTooltipTag],COUNTRY_GDP_OWNERSHIP_TOOLTIP [Country.GetDomesticallyOwnedGDPFraction|%1b]#!#!#!）\n@money![Country.MakeScope.ScriptValue('cwp_gdp_per_capita')|2*v][Concept('concept_gdp_per_capita', '$concept_gdp_per_capita_short$')]（[Country.GetGDPPerCapitaRanking]）"
 COUNTRY_GDP_OWNERSHIP_TOOLTIP:0 "#header [Country.GetName]的[concept_gdp_ownership]#!\n本国拥有的$concept_gdp_short$：#u [Country.GetDomesticallyOwnedGDPFraction|%1b]#!（@money![Country.GetGDP|Dv]）\n$TOOLTIP_DELIMITER$\n[SelectLocalization(IsZero_CFixedPoint(Country.GetForeignOwnedGDPFraction), 'NO_FOREIGNLY_OWNED_PERCENTAGE', 'COUNTRY_FOREIGNLY_OWNED_PERCENTAGE')]\n\n[SelectLocalization(IsZero_CFixedPoint(Country.GetGDPOwnedInForeignCountries), 'NO_OWNED_FOREIGN_GDP_BY_COUNTRY', 'OWNED_FOREIGN_GDP_BY_COUNTRY')]"

 COUNTRY_ALL_GDP:0 "@money!#v [Country.GetGDPWithOwnershipsInForeignCountries|D]#!"
 DOMESTIC_COUNTRY_GDP:0 "@money!#v [Country.GetGDP|D]#!"
 FOREIGN_COUNTRY_GDP:0 "@money!#u [Country.GetGDPOwnedInForeignCountries|Db]#!"
 COUNTRY_ALL_OWNERSHIP:0 "#u [Country.GetDomesticallyOwnedGDPFraction|%1b]#![ConcatIfNeitherEmpty(' + ', AddLocalizationIf(NotZero_CFixedPoint(Country.GetGDPOwnedInForeignCountries), 'FOREIGN_COUNTRY_GDP'))]"

 COUNTRY_POPULATION:0 "#title [Concept('concept_pop','$concept_population$')]#!：\n#variable [Country.MakeScope.ScriptValue('smd_population')|Dv]#!"
 COUNTRY_GDP:0 "#title $GDP_SHORT$#!：\n#variable @money![Country.MakeScope.ScriptValue('cwp_gdp')|Dv]#!"

 ERROR_DEER_TOOLTIP:0 "#header 噢完了！#!\n#instruction 左键点击#!打开错误日志\n#instruction 右键点击#!让它消失（直到你再次感到沮丧）"
 ERROR_MANUL_TOOLTIP:0 "#header 阅读手册！#!\n#instruction 左键点击#!打开错误日志\n#instruction 右键点击#!让它消失（直到你再次感到沮丧）"

 OH_DEER:0 "“#italic 天呐，我们有#!#bold [ErrorDeer.NumberOrErrors|v]#!个#italic 错误！#!”"
 ERROR_MANUL:0 "#italic 我们有#!#bold [ErrorDeer.NumberOrErrors|v]个#!#italic 错误？！让我瞧瞧手册！#!"
 ERROR_DEER_SLOW_TICK_OPERATIONS:0 "#header 慢速行动#!"

 EXPENSES_GOVERNMENT_BUILDING_GOODS:0 "$TAB$#tooltippable #tooltip:[GetPlayer.GetTooltipTag],GOVERNMENT_BUILDINGS_EXPENSES_BREAKDOWN,GovernmentGoodsExpenseTooltip #N @money!-[GetPlayer.GetGovernmentGoodsExpenses|D-]#!#!#![concept_budget_goods_for_government_buildings]\n$TAB$#tooltippable;tooltip:SMD_HEALTHCARE_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_healthcare_expense_value')|D-]#!#!#! [concept_smd_healthcare]\n$TAB$#tooltippable;tooltip:SMD_EDUCATION_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_education_expense_value')|D-]#!#!#! [concept_smd_education]\n$TAB$#tooltippable;tooltip:SMD_POLICE_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_police_expense_value')|D-]#!#!#! [concept_smd_police]"

 LITERACY_UNINCORPORATED_TOOLTIP:0 "\n$TOOLTIP_DELIMITER$\n将[Concept('concept_unincorporated_state','$concept_unincorporated_states$')]也纳入计算时，#variable [Country.GetName]#!#variable [Country.GetTotalPopulation|*]#![Concept('concept_pop','人口')]中有#variable [Country.GetNumTotalLiteratePops|*]#!（[Country.GetTotalLiteracyRate|%v]）识字（[Country.GetTotalLiteracyRanking]）"

 POP_TOOLTIP:0 "#tooltip_header [Concept('concept_pop','$concept_population$')]#!\n当前：[Country.MakeScope.ScriptValue('smd_population')|Dv]（[Country.GetPopulationRanking]）\n[Country.GetPopGrowthDesc]$POP_TOOLTIP_DELAYED$"

 SMD_HEALTHCARE_EXPENSE_TOOLTIP:0 "#header [concept_smd_healthcare]支出#!\n国家医疗体系的运行成本。 主要取决于你运营的$building_government_administration$等级数量（[concept_bureaucracy]），同时受[concept_institution]投资水平、人口（不含$peasants$）和平均[concept_sol]影响。\n当前每月成本： @money!-[GetPlayer.MakeScope.ScriptValue('smd_healthcare_expense_value')|D-]#!"

 SMD_EDUCATION_EXPENSE_TOOLTIP:0 "#header [concept_smd_education]支出#!\n公共教育的运行成本。 主要取决于你运营的$building_government_administration$等级数量（[concept_bureaucracy]），同时受[concept_institution]投资水平、人口（不含$peasants$）和平均[concept_sol]影响。\n当前每月成本： @money!-[GetPlayer.MakeScope.ScriptValue('smd_education_expense_value')|D-]#!"

 SMD_POLICE_EXPENSE_TOOLTIP:0 "#header [concept_smd_police]支出#!\n执法机构的运行成本。 主要取决于你运营的$building_government_administration$等级数量（[concept_bureaucracy]），同时受[concept_institution]投资水平、人口（不含$peasants$）和平均[concept_sol]影响。\n当前每月成本： @money!-[GetPlayer.MakeScope.ScriptValue('smd_police_expense_value')|D-]#!"
