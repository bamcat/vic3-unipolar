l_simp_chinese:
 smd_agitators.1.t:0 "图派克·夏库尔去世"
 smd_agitators.1.d:0 "1996年9月7日夜，[SCOPE.sCharacter('smd_tupac_scope').GetFullName]在拉斯维加斯一处红灯前停车时身中四枪。他于9月13日伤重不治，年仅25岁。枪手逃脱，至今无人被起诉。[ROOT.GetCountry.GetName]各地的歌迷聚集在一起悼念他。"
 smd_agitators.1.f:0 "他的第四张专辑《All Eyez on Me》于当年早些时候发行。"
 smd_agitators.1.a:0 "被迫沉默的声音"
