 smd_amendment_rural_levies:0 "Prélèvements ruraux"
 smd_amendment_rural_levies_desc:0 "En plus de l’impôt agricole, les cantons et les villages prélèvent des frais, des quotas de grain et des corvées sur les foyers paysans pour payer les écoles, les routes et les fonctionnaires locaux. Le fardeau pèse surtout sur les paysans les plus pauvres."
 smd_amendment_rural_levies_modifier:0 "Prélèvements ruraux"
 smd_amendment_rural_levies_modifier_desc:0 "Les frais cantonaux et les corvées rapportent de l’argent des campagnes, au prix de la bonne volonté paysanne."
