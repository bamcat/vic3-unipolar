l_french:

 news.1.t:0 "Un événement remarquable"
 news.1.d:0 "Une coupure de test. Si ceci apparaît comme un journal, avec la manchette de votre pays en haut, l’article imprimé sur le papier et AUCUN cadre sombre ni barre de titre autour de la fenêtre, alors ce type de fenêtre fonctionne. Elle doit également rester déplaçable."
 news.1.f:0 "Nos correspondants sont prêts."
 news.1.a:0 "Une nouvelle de première importance !"

 news.2.t:0 "RÉVOLUTION EN RUSSIE"
 news.2.d:0 "[ROOT.Var('news_test_2_news_attacker_ref').GetCountry.GetNameNoFlag] a officiellement déclaré la guerre à [ROOT.Var('news_test_2_news_defender_ref').GetCountry.GetNameNoFlag]. Les troupes se mobilisent le long de la frontière et les chancelleries des grandes puissances observent la situation avec une profonde inquiétude. Les diplomates ont été rappelés et les marchés sont en plein tumulte. Nos correspondants sont en route vers le théâtre des opérations, et de nouveaux détails sont attendus par le courrier du soir. Les diplomates ont été rappelés et les marchés sont en plein tumulte. Nos correspondants sont en route vers le théâtre des opérations, et de nouveaux détails sont attendus par le courrier du soir. Les diplomates ont été rappelés et les marchés sont en plein tumulte. Nos correspondants sont en route vers le théâtre des opérations, et de nouveaux détails sont attendus par le courrier du soir."
 news.2.f:0 "Les canons parlent là où la diplomatie a échoué."
 news.2.a:0 "Une nouvelle bien grave."
