l_french:
 smd_agitators.1.t:0 "Tupac Shakur est mort"
 smd_agitators.1.d:0 "Dans la nuit du 7 septembre 1996, [SCOPE.sCharacter('smd_tupac_scope').GetFullName] a été touché par quatre balles alors qu'il se trouvait dans une voiture arrêtée à un feu rouge à Las Vegas. Il a succombé à ses blessures le 13 septembre, à l'âge de 25 ans. Le tireur a pris la fuite et personne n'a été inculpé. Partout dans le pays, ses admirateurs se sont rassemblés pour lui rendre hommage."
 smd_agitators.1.f:0 "Son quatrième album, All Eyez on Me, était sorti plus tôt dans l'année."
 smd_agitators.1.a:0 "Une voix réduite au silence"
