 RUS_WN_KREMLIN_FAMILY: "[concept_rus_family]"
 RUS_WN_KREMLIN_PM: "[concept_prime_minister]"
 RUS_WN_KREMLIN_PRESIDENT: "The President"
 amendment_rus_balanced_constitution: "Balanced Constitution"
 amendment_rus_balanced_constitution_desc: "A compromise constitution that divides power between the President and parliament."
 amendment_rus_parliamentary_oversight: "Parliamentary Oversight"
 amendment_rus_parliamentary_oversight_desc: "After the deputies' victory, every act of the executive answers to parliament."
 amendment_rus_presidential_decree_powers: "Presidential Decree Powers"
 amendment_rus_presidential_decree_powers_desc: "The 1993 constitution lets the President govern by [Concept('concept_rus_ukaz','decree')] wherever the law is silent, and makes him very hard to remove."
 character_role_rus_family: "The Family"
 company_aeroflot: "Aeroflot"
 company_alrosa: "Alrosa"
 company_avtovaz: "AvtoVAZ"
 company_gazprom: "Gazprom"
 company_lukoil: "Lukoil"
 company_norilsk_nickel: "Norilsk Nickel"
 company_rosneft: "Rosneft"
 company_severstal: "Severstal"
 company_sibneft: "Sibneft"
 company_svyazinvest: "Svyazinvest"
 company_yukos: "Yukos"
 ig_rus_agrarian_lobby: "Agrarian Lobby"
 ig_rus_agrarian_lobby_desc: "The chairmen of the collective and state farms and the agrarian politicians who speak for them. They want subsidies, cheap credit and no private market in land."
 ig_rus_oligarchs: "Oligarchs"
 ig_rus_oligarchs_desc: "A handful of bankers and financiers who bought the commanding heights of the Russian economy for a fraction of their worth. They own the television channels, the oil fields and, some say, the government."
 ig_rus_red_directors: "Red Directors"
 ig_rus_red_directors_desc: "The managers of the great Soviet factories, combines and trusts. They kept the lights on when the plan collapsed, and they expect the state to keep the credit flowing in return."
 ig_rus_siloviki: "Siloviki"
 ig_rus_siloviki_desc: "Veterans of the security services, the army and the police who have moved into the commanding posts of the state. They believe Russia needs order before it needs anything else."
 ig_trait_rus_asset_stripping: "Asset Stripping"
 ig_trait_rus_asset_stripping_desc: "When the directors stop believing in the state, they sell off what they manage and keep the proceeds."
 ig_trait_rus_loans_for_shares: "Captains of Industry"
 ig_trait_rus_loans_for_shares_desc: "With the great companies in private hands, some of the profit finds its way back into new investment."
 ig_trait_rus_media_empires: "Media Empires"
 ig_trait_rus_media_empires_desc: "The [Concept('concept_rus_oligarchs','oligarchs')]' television channels and newspapers sell the government to the public, as long as the government stays on their side."
 ig_trait_rus_offshore_accounts: "Offshore Accounts"
 ig_trait_rus_offshore_accounts_desc: "Money earned in Russia leaves for Cyprus and London as fast as it can be wired."
 ig_trait_rus_protected_factories: "Protected Factories"
 ig_trait_rus_protected_factories_desc: "The directors keep their plants running at almost any cost."
 ig_trait_rus_state_credit: "State Credit"
 ig_trait_rus_state_credit_desc: "Friends in the Central Bank keep cheap loans flowing to industry."
 je_group_wild_nineties: "The Wild Nineties"
 je_rus_dvoe_compromise_conclusion_desc: "Neither side won. A compromise constitution divides power between the President and parliament."
 je_rus_dvoe_parliament_conclusion_desc: "The deputies have won. Boris Yeltsin is out, and Russia will be governed from the White House."
 je_rus_dvoe_president_conclusion_desc: "The President has won. A new constitution gives the Kremlin powers no Russian parliament can easily challenge."
 je_rus_dvoe_stalemate_conclusion_desc: "The crisis ended without a clear winner and with blood on the streets of Moscow. A new constitution has been adopted, but nobody trusts it."
 je_rus_lfs_cancelled_conclusion_desc: "The government has refused to sell the crown jewels. The bankers will remember it."
 je_rus_lfs_done_conclusion_desc: "The commanding heights of the Russian economy now belong to a handful of bankers. They will expect a say in how the country is run."
 je_rus_lfs_timeout_conclusion_desc: "The window for the auctions has closed. Whatever was not sold will stay in state hands for now."
 je_rus_loans_for_shares: "Loans for Shares"
 je_rus_loans_for_shares_reason: "The treasury is empty and the state owns some of the most valuable companies on earth. The bankers propose to lend the government money against shares in those companies, then auction the shares among themselves when the loans go unpaid.\n\nEach auction brings cash into the budget and turns a banker into an oligarch. Once enough of them hold the great companies, the [concept_rus_red_directors] will give way to a new class with very different interests."
 je_rus_shock_therapy: "Shock Therapy"
 je_rus_shock_therapy_default_conclusion_desc: "The bond pyramid has collapsed and the state has defaulted on its debts. The economy will recover from this, but not soon."
 je_rus_shock_therapy_reason: "The planned economy is dead and the market economy is not yet born. Prices are being freed, savings are evaporating, the state cannot pay its own employees, and anyone with money is moving it abroad.\n\n#bold Consumer Prices#! track what groceries, grain, clothes, furniture, liquor and household appliances actually cost on the Russian market compared with their normal level. Your economic course moves them for real: freeing prices removes the state-backed output that kept them down, and the Central Bank's stance pushes minting and wages up or down. You can also follow and change the stance from the Central Banking panel.\n\nFrom 1995 the government can cover its deficit by selling short-term bonds. The money arrives every month, and every bond in circulation raises the interest on the state's loans. If the debt nears its ceiling, or the bond pile grows large while capital is fleeing, the state will default."
 je_rus_shock_therapy_stabilized_conclusion_desc: "Inflation is tamed, wages are paid and money is staying in the country. Russia has survived its transition to the market."
 je_rus_shock_therapy_timeout_conclusion_desc: "The decade of [Concept('concept_rus_shock_therapy','shock therapy')] is over. Whatever its results, Russia now has a market economy."
 je_rus_wn_other_path_conclusion_desc: "The decade has ended without the handover Yeltsin's circle planned. Russia enters the new century on a road of its own."
 je_rus_wn_putin_conclusion_desc: "Boris Yeltsin has handed the Kremlin to Vladimir Putin, the man the [Concept('concept_rus_family','Family')] chose to protect them. The Wild Nineties are over."
 je_rus_wn_successor_conclusion_desc: "A new President sits in the Kremlin. The decade of chaos is over, and a different Russia begins."
 je_russia_wild_nineties: "The Wild Nineties"
 je_russia_wild_nineties_reason: "The Soviet Union is gone and nobody quite knows what has replaced it. The President governs by [Concept('concept_rus_ukaz','decree')] from the Kremlin, his health is failing, and a small circle of relatives, aides and bankers known as the [Concept('concept_rus_family','Family')] stands ever closer to the throne.\n\nKeep the President healthy and his authority intact. Use the [concept_prime_minister] to absorb the [Concept('concept_rus_blame','blame')] for what goes wrong, and replace him when the blame grows too heavy. Rule by #bold ukaz#! when the deputies will not cooperate, but every decree ties up authority while it is in force.\n\nBy the end of the decade the Kremlin will need an heir. Who it is depends on everything that happens before then."
 je_russian_constitutional_crisis: "Dvoevlastie"
 je_russian_constitutional_crisis_reason: "Russia has two centres of power. The President was elected by the people. The Congress of People's Deputies and its Supreme Soviet were elected under Soviet rules and still hold the right to amend the constitution at will.\n\nSix institutions will decide who comes out on top: the #bold Army#!, the #bold Interior Ministry#!, #bold Moscow#!, the #bold Constitutional Court#!, the #bold regions#! and the #bold Church#!. Each one that backs a side pushes the balance its way.\n\nAfter the spring referendum the President can issue #bold [Concept('concept_rus_decree_1400','Decree 1400')]#! and dissolve the parliament. If the Army is with him when the deputies resist, he wins outright. If it is not, he may lose everything."
 rus_1993_referendum_lost: "Referendum Defeat"
 rus_1993_referendum_lost_desc: "The voters turned on the President."
 rus_1993_referendum_won: "Da, Da, Net, Da"
 rus_1993_referendum_won_desc: "The voters backed the President."
 rus_1998_default: "The 1998 Default"
 rus_1998_default_desc: "The state has defaulted on its debts and the rouble has collapsed."
 rus_appoint_pm_button: "Appoint a [concept_prime_minister]"
 rus_appoint_pm_button_desc: "Name someone to head the government and take the [Concept('concept_rus_blame','blame')] for it."
 rus_bankers_war: "The Bankers' War"
 rus_bankers_war_desc: "The [Concept('concept_rus_oligarchs','oligarchs')] are fighting each other through their newspapers."
 rus_dismiss_pm_blame_tt: "The [concept_prime_minister] carries at least 20 [Concept('concept_rus_blame','blame')]"
 rus_dismiss_pm_button: "Dismiss the [concept_prime_minister]"
 rus_dismiss_pm_button_desc: "Send the [concept_prime_minister] into retirement and take some of the anger with him. Finding a replacement is a decision in its own right."
 rus_dvoe_army_button: "Win Over the Generals"
 rus_dvoe_army_button_desc: "Promise the officers housing, pay and a voice in the reform of the armed forces."
 rus_dvoe_chernomyrdin_tt: "Chernomyrdin is acceptable to the deputies"
 rus_dvoe_church_button: "Seek the Patriarch's Blessing"
 rus_dvoe_church_button_desc: "Ask Patriarch Alexy to lend the President the authority of the Church."
 rus_dvoe_court_army: "Courting the Army"
 rus_dvoe_court_army_desc: "The Kremlin is spending favours to win this institution over."
 rus_dvoe_court_button: "Court the Constitutional Court"
 rus_dvoe_court_button_desc: "Persuade the judges that the old constitution cannot survive. They will take more convincing than the others."
 rus_dvoe_court_church: "Courting the Church"
 rus_dvoe_court_church_desc: "The Kremlin is spending favours to win this institution over."
 rus_dvoe_court_court: "Courting the Constitutional Court"
 rus_dvoe_court_court_desc: "The Kremlin is spending favours to win this institution over."
 rus_dvoe_court_moscow: "Courting Moscow"
 rus_dvoe_court_moscow_desc: "The Kremlin is spending favours to win this institution over."
 rus_dvoe_court_mvd: "Courting the Interior Ministry"
 rus_dvoe_court_mvd_desc: "The Kremlin is spending favours to win this institution over."
 rus_dvoe_court_regions: "Courting the regions"
 rus_dvoe_court_regions_desc: "The Kremlin is spending favours to win this institution over."
 rus_dvoe_decree_1400_button: "Issue [Concept('concept_rus_decree_1400','Decree 1400')]"
 rus_dvoe_decree_1400_button_desc: "Dissolve the Congress and the Supreme Soviet and call new elections. If the army is not with you, this is how you lose the presidency."
 rus_dvoe_gaidar_tt: "The deputies [Concept('concept_rus_blame','blame')] Gaidar for inflation"
 rus_dvoe_khasbulatov_tt: "Khasbulatov's deputies obstruct the government"
 rus_dvoe_moscow_button: "Win Over Moscow"
 rus_dvoe_moscow_button_desc: "Give Mayor Luzhkov what he wants for the capital, and the capital's streets will belong to the President."
 rus_dvoe_mvd_button: "Win Over the Interior Ministry"
 rus_dvoe_mvd_button_desc: "Make sure the police and the interior troops answer to the Kremlin."
 rus_dvoe_referendum_tt: "The April referendum gave the President a mandate"
 rus_dvoe_regions_button: "Promise the Regions Autonomy"
 rus_dvoe_regions_button_desc: "Offer governors and republic presidents more control over their own affairs, in exchange for their support in Moscow."
 rus_dvoe_rule_by_decree_tt: "Rule by [Concept('concept_rus_ukaz','decree')] angers the deputies"
 rus_dvoe_zero_option_button: "Propose the Zero Option"
 rus_dvoe_zero_option_button_desc: "Offer simultaneous early elections for President and parliament. Nobody wins, and nobody gets shot."
 rus_dvoevlastie: "Dvoevlastie"
 rus_dvoevlastie_bar: "Balance of Power"
 rus_dvoevlastie_bar_desc: "Who holds the upper hand between the Kremlin and the White House. The further right, the stronger the President. See [concept_rus_dual_power] and [concept_rus_institutions]."
 rus_dvoevlastie_desc: "The President and the parliament are at war over who governs Russia."
 rus_econ_delay_wages_button: "Delay Wages"
 rus_econ_delay_wages_button_desc: "Hold back the wages of soldiers, officials and teachers for a few more months. It saves real money, and costs real loyalty."
 rus_econ_gko_start_button: "Sell Short-Term Bonds"
 rus_econ_gko_start_button_desc: "Cover the deficit with high-yield bonds. Each month brings a large sum into the treasury, and each month the interest rate on every state loan climbs."
 rus_econ_gko_stop_button: "Stop Selling Bonds"
 rus_econ_gko_stop_button_desc: "Stop issuing new bonds. The ones already sold will mature over the next few years, and the extra interest will fade as they do."
 rus_econ_gradual: "Gradual Reform"
 rus_econ_gradual_button: "Course: Gradual Reform"
 rus_econ_gradual_button_desc: "Keep partial [Concept('concept_price_controls','price controls')] and a neutral Central Bank. Slower, gentler, and inflation lingers."
 rus_econ_gradual_desc: "The government is reforming slowly."
 rus_econ_imf: "IMF Programme"
 rus_econ_imf_button: "Course: IMF Programme"
 rus_econ_imf_button_desc: "Accept the International Monetary Fund's conditions: free prices and tight money, in exchange for a loan and cheaper borrowing."
 rus_econ_imf_desc: "The government is following the IMF's conditions."
 rus_econ_red_credit: "Credits to Industry"
 rus_econ_red_credit_button: "Course: Credits to Industry"
 rus_econ_red_credit_button_desc: "Have the Central Bank print money for the factories and pay off [Concept('concept_wage_arrears','wage arrears')]. More money is minted and wages rise."
 rus_econ_red_credit_desc: "The Central Bank is printing money for the factories."
 rus_econ_shock: "Shock Therapy"
 rus_econ_shock_button: "Course: [concept_rus_shock_therapy]"
 rus_econ_shock_button_desc: "Free prices, tighten the money supply and balance the budget. [concept_consumer_prices] jump at first, wages go unpaid, and inflation is then squeezed out."
 rus_econ_shock_desc: "The government is pursuing rapid market reform."
 rus_econ_status_arrears_0: "Wages and pensions are being paid on time."
 rus_econ_status_arrears_1: "#negative Wages are running a few months late.#!"
 rus_econ_status_arrears_2: "#negative Soldiers, teachers and doctors have not been paid in half a year.#!"
 rus_econ_status_arrears_3: "#negative The state has all but stopped paying its own employees.#!"
 rus_events.1.a: "The President answers to the people, not to the deputies."
 rus_events.1.b: "Keep a door open to the Congress."
 rus_events.1.d: "Russia has a President elected by the people and a Congress of People's Deputies elected under Soviet rules, and both claim the final word. [SCOPE.sCharacter('rus_khasbulatov_scope').GetFullName], Chairman of the Supreme Soviet, stood beside Boris Yeltsin on the barricades in August 1991. Now he runs the parliament as his own fortress, and every reform [Concept('concept_rus_ukaz','decree')] from the Kremlin comes back from the deputies amended, delayed or reversed.\n\nRussians reach for a word from 1917 to describe it: #italic dvoevlastie#!, dual power. One side will have to give way before the country can be governed."
 rus_events.1.f: "Win over the institutions that matter and the balance tips. Lose them, and the deputies will be the ones writing the next constitution."
 rus_events.1.t: "Two Masters in One House"
 rus_events.2.a: "Accept Chernomyrdin."
 rus_events.2.b: "Stand by Gaidar."
 rus_events.2.c: "Appeal to the people over the deputies' heads."
 rus_events.2.d: "The Seventh Congress of People's Deputies has refused to confirm Yegor Gaidar as [concept_prime_minister]. Eleven months of freed prices have cost him the deputies, the factory directors and most of the country.\n\nThe deputies will accept a candidate from a shortlist, and at the top of it stands [SCOPE.sCharacter('rus_chernomyrdin_scope').GetFullName], the gas industry chief who speaks the language of the red directors. Yeltsin could also take the fight over the deputies' heads and ask the voters to choose between him and the Congress."
 rus_events.2.t: "The Congress Turns on Gaidar"
 rus_events.3.a: "The motion falls short. The President survives."
 rus_events.3.b: "The Congress removes the President."
 rus_events.3.d: "Yeltsin's televised announcement of a special order of government has handed the Congress its pretext. The deputies have tabled a motion to remove the President from office, and two thirds of them must vote for it to pass.\n\nThe count will show who has been working the corridors more effectively these past months."
 rus_events.3.t: "The Impeachment Vote"
 rus_events.4.a: "The people answer Da, Da, Net, Da."
 rus_events.4.b: "The country turns on the Kremlin."
 rus_events.4.d: "Russians have voted on four questions. Do you trust President Yeltsin? Do you approve of his social and economic policy? Should early presidential elections be held? Should early parliamentary elections be held?\n\nThe Kremlin campaigned on a single slogan, #bold Da, Da, Net, Da#!, and printed it on everything from posters to bus tickets. The answer the country gives will decide which side walks into the summer with a mandate."
 rus_events.4.t: "Da, Da, Net, Da"
 rus_events.5.a: "Write the regions into the draft."
 rus_events.5.b: "Keep the pen in the Kremlin's hand."
 rus_events.5.d: "The President has summoned a Constitutional Assembly to draft a new basic law, going around the Supreme Soviet's own drafting commission. Governors, republic presidents, mayors and party leaders have crowded into the Kremlin. Khasbulatov's deputies walked out on the first day.\n\nThe regions want a constitution that leaves them room to breathe. The Kremlin wants one that leaves the President room to govern."
 rus_events.5.t: "The Constitutional Assembly"
 rus_events.6.a: "Cut off the White House. Phones, power, water."
 rus_events.6.b: "Let the Patriarch try to mediate."
 rus_events.6.d: "The President has signed [Concept('concept_rus_decree_1400','Decree No. 1400')], #italic On Gradual Constitutional Reform#!, dissolving the Congress and the Supreme Soviet and calling elections for a new parliament in December.\n\nThe deputies answered within hours. Meeting in the White House, they declared the President removed from office and swore in Vice President [SCOPE.sCharacter('rus_rutskoy_scope').GetFullName] in his place. Russia now has two presidents, and only one of them controls the Kremlin."
 rus_events.6.t: "[Concept('concept_rus_decree_1400','Decree 1400')]"
 rus_events.7.a: "The tanks fire on the White House."
 rus_events.7.b: "The army goes over to the parliament."
 rus_events.7.c: "The army stays in its barracks."
 rus_events.7.d: "On Sunday the parliament's supporters broke through the police cordon around the White House, stormed the mayor's office next door and, on Rutskoy's orders, moved on the Ostankino television centre. The fighting there has left dozens dead.\n\nThe fate of the country now turns on one question: will the army obey the President? Defence Minister [SCOPE.sCharacter('rus_grachev_scope').GetFullName] has been on the telephone all night."
 rus_events.7.t: "Black October"
 rus_events.8.a: "Accept the zero option."
 rus_events.8.b: "Not yet."
 rus_events.8.d: "Mediators from the regions and the Constitutional Court have pressed a compromise on both sides. The President and the deputies give up their mandates together, and the country elects a new president and a new parliament on the same day.\n\nNobody wins. Nobody gets shot."
 rus_events.8.t: "The Zero Option"
 rus_events.9.a: "A new basic law for a new country."
 rus_events.9.d: "On 12 December Russians approved a new constitution by referendum and elected the first State Duma on the same day.\n\nThe surprise of the night belongs to [SCOPE.sCharacter('rus_zhirinovsky_scope').GetFullName], whose misleadingly named Liberal Democratic Party took nearly a quarter of the party list vote with promises of cheap vodka and a march to the Indian Ocean. The new parliament will be louder than the old one. Whether it will be any easier to govern with is another matter."
 rus_events.9.t: "The December Constitution"
 rus_events.10.a: "The Kremlin writes the new constitution."
 rus_events.10.b: "Settle for a shared constitution."
 rus_events.10.d: "Another winter is coming and Russia still runs on a Soviet constitution amended so many times that nobody can say with confidence what it means. Both sides are exhausted.\n\nThe only question left is who sets the terms of the truce."
 rus_events.10.t: "The Year Runs Out"
