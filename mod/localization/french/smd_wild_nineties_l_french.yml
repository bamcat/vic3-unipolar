 concept_rus_kremlin_standing:0 "Kremlin Standing"
 concept_rus_kremlin_standing_desc:0 "In Yeltsin's Russia, power flowed from being close to the President. Ministers rose and fell on whether he still trusted them, and the men who would one day inherit his office were the ones who had stood beside him longest.\n\nEvery politician has a Kremlin Standing. A [concept_prime_minister] gains a little every month in office, and loyal service in events raises it further. When the time comes to choose a successor, Yeltsin will only consider candidates whose standing is high enough, usually 20 or more."
 concept_rus_blame:0 "Blame"
 concept_rus_blame_desc:0 "Russians in the 1990s rarely blamed the President himself for unpaid wages and empty shops. They blamed his government, and above all the [concept_prime_minister], who could be thrown overboard to save the captain.\n\nBlame builds up every month while consumer prices are more than 30% above normal, while wages are months behind, and after a default. Once it reaches 20 the President can dismiss his [concept_prime_minister], which releases some of the anger and turns people into loyalists, more so if blame was above 50. A new [concept_prime_minister] starts with a clean slate."
 concept_rus_health:0 "Presidential Health"
 concept_rus_health_desc:0 "Boris Yeltsin suffered at least five heart attacks during his presidency and drank heavily for most of it. His health was a matter of state, hidden from voters and watched closely by everyone who hoped to replace him.\n\nHealth falls slowly with age, faster with drink and the strain of crisis, and recovers after heart surgery. Above 50 it makes your Authority stronger, below 50 weaker. If it reaches zero the President dies and the [concept_prime_minister] takes power."
 concept_rus_family:0 "The Family"
 concept_rus_family_desc:0 "Muscovites called the President's inner circle the Family: his daughter Tatyana Dyachenko, his bodyguard Alexander Korzhakov, chief of staff Valentin Yumashev and the financier Boris Berezovsky. As Yeltsin weakened, they increasingly governed in his name.\n\nThe Family's Influence grows when the President's health falls below 50 and faster below 30, and grows further while Dyachenko or Berezovsky sit in the circle. A strong President pushes it back. Every point of Influence adds Authority but costs Legitimacy, and the Family must hold at least 30 Influence before Putin can be brought forward as Prime Minister or successor."
 concept_rus_oligarch_power:0 "Oligarch Power"
 concept_rus_oligarch_power_desc:0 "A handful of bankers and industrialists bought up Russia's oil, metals and media in the 1990s, often for a fraction of their worth. By 1996 they were financing the President's reelection, and by 1998 they were close to running the state.\n\nOligarch Power rises once the Oligarchs have formed and while they are in government or powerful, and falls after a default or under a successor who reins them in. Every point strengthens the Industrialists and weakens tax collection, and above 50 it speeds up Capital Flight."
 concept_rus_dual_power:0 "Dual Power"
 concept_rus_dual_power_desc:0 "Dvoevlastie, dual power, was the name Russians gave to 1917, when the Provisional Government and the Petrograd Soviet both claimed to rule. In 1993 it came back: an elected President against a Congress elected under Soviet rules, each declaring the other illegal.\n\nThe balance runs from 0 (the Supreme Soviet holds the upper hand) to 100 (the President does). It moves every month with the institutions that back each side, the spring referendum and how hard the President rules by decree. The Zero Option compromise can only be offered while the balance is between 40 and 60, and the events of autumn 1993, including the fate of [concept_rus_decree_1400], are decided by how far ahead the President is."
 concept_rus_institutions:0 "Institutions"
 concept_rus_institutions_desc:0 "Neither the President nor the parliament had a reliable army of its own in 1993. Whoever won would be the side that the generals, the police, the Moscow mayor, the judges, the regional bosses and the Church decided to back.\n\nEach institution has an alignment from -100 to +100. At +20 or more it backs the President, at -20 or less the Supreme Soviet, and each one that backs a side moves Dual Power its way every month. Courting an institution pulls it toward the President but ties up Authority while the effort lasts, and every favour has a price: each institution has a rival that drifts toward the Supreme Soviet when it is courted. The Army and the Interior Ministry resent each other, Moscow and the Regional Governors compete for the same money, the Church unsettles the Muslim regions, and the Court's rulings constrain the police. The Army matters most: if it is with the President when Decree 1400 is resisted, he wins outright."
 concept_rus_inst_army:0 "The Army"
 concept_rus_inst_army_desc:0 "Defence Minister Pavel Grachev kept the Army out of politics for as long as he could. In October 1993 the generals hesitated for a whole night before sending tanks to the White House.\n\nPart of [concept_rus_institutions]. The decisive institution if the crisis turns violent."
 concept_rus_inst_mvd:0 "The Interior Ministry"
 concept_rus_inst_mvd_desc:0 "Viktor Yerin's Interior Ministry commanded the riot police and the Dzerzhinsky Division, the only armed force in Moscow that answered to the government day to day.\n\nPart of [concept_rus_institutions]."
 concept_rus_inst_moscow:0 "Moscow City Hall"
 concept_rus_inst_moscow_desc:0 "Mayor Yuri Luzhkov controlled the capital's streets, utilities and money. When the White House was cut off from power and water in 1993, it was the city that cut it.\n\nPart of [concept_rus_institutions]."
 concept_rus_inst_court:0 "The Constitutional Court"
 concept_rus_inst_court_desc:0 "Chief Justice Valery Zorkin ruled again and again that the President had overstepped the constitution, giving the deputies the legal cover they needed.\n\nPart of [concept_rus_institutions]."
 concept_rus_inst_regions:0 "The Regional Governors"
 concept_rus_inst_regions_desc:0 "Russia's regions used the quarrel in Moscow to grab tax revenue and autonomy for themselves. Most waited to see who would win before choosing a side.\n\nPart of [concept_rus_institutions]."
 concept_rus_inst_church:0 "The Orthodox Church"
 concept_rus_inst_church_desc:0 "Patriarch Alexy II offered to mediate between the President and the deputies and threatened to excommunicate whoever fired first.\n\nPart of [concept_rus_institutions]."
 concept_rus_ukaz:0 "Ukaz"
 concept_rus_ukaz_desc:0 "An ukaz (plural ukazy) is a decree signed by the President alone. Yeltsin issued them by the hundred to privatise industry, free prices and fight crime when parliament would not pass his laws, and the deputies hated him for it.\n\nEach ukaz ties up Authority for as long as it is in force, so you can only keep a few running at once. Ruling with three or more pushes [concept_rus_dual_power] toward the Supreme Soviet, and governing by decree wears down the President's [Concept('concept_rus_health','Health')]."
