 rus_lfs_cancel_button: "Keep the Crown Jewels"
 rus_lfs_cancel_button_desc: "Refuse the bankers' scheme and keep the great companies in state hands, at the price of the money they would have brought in."
 rus_lfs_norilsk_button: "Auction Norilsk Nickel"
 rus_lfs_norilsk_button_desc: "Vladimir Potanin's Oneximbank will take the world's largest nickel producer for a fraction of its worth."
 rus_lfs_sibneft_button: "Auction Sibneft"
 rus_lfs_sibneft_button_desc: "Boris Berezovsky's friends will acquire the Siberian Oil Company. Berezovsky will want a seat closer to the President."
 rus_lfs_spurned: "Spurned by the Kremlin"
 rus_lfs_spurned_desc: "The government has refused big business."
 rus_lfs_status_named: "The [concept_rus_oligarchs] now speak for Russian big business."
 rus_lfs_status_unnamed: "The [concept_rus_red_directors] still speak for Russian industry. Two completed auctions will change that."
 rus_lfs_svyazinvest_button: "Auction Svyazinvest"
 rus_lfs_svyazinvest_button_desc: "Sell a stake in the national telephone company to the highest bidder, for once. The bankers who lose will not take it quietly."
 rus_lfs_yukos_button: "Auction Yukos"
 rus_lfs_yukos_button_desc: "Mikhail Khodorkovsky's Menatep bank will lend the government money against the Yukos oil company, and win the auction it runs itself."
 rus_long_october: "The Long October"
 rus_long_october_desc: "The army stayed neutral and the crisis dragged on."
 rus_october_1993_storming: "Black October"
 rus_october_1993_storming_desc: "The army shelled the White House to end the crisis."
 rus_parliament_victory: "Parliament Victorious"
 rus_parliament_victory_desc: "The deputies defeated the President."
 rus_pm_chernomyrdin: "[concept_prime_minister] Chernomyrdin"
 rus_pm_chernomyrdin_desc: "The former head of Gazprom is running the government."
 rus_pm_gaidar: "[concept_prime_minister] Gaidar"
 rus_pm_gaidar_desc: "A young economist is running the government."
