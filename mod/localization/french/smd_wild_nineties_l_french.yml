 rus_ukaz_voucher: "Voucher Privatisation"
 rus_ukaz_voucher_button: "[concept_rus_ukaz]: [concept_rus_vouchers]"
 rus_ukaz_voucher_button_desc: "Every citizen receives a [Concept('concept_rus_vouchers','voucher')] worth ten thousand roubles, exchangeable for shares in the enterprises being privatised. Most of them will be sold for a bottle of vodka to whoever is buying."
 rus_ukaz_voucher_desc: "State enterprises are passing into private hands through [Concept('concept_rus_vouchers','vouchers')]."
 rus_ukaz_wage_arrears: "Paying the Arrears"
