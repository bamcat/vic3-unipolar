 rus_wn_status_blame_high: "#negative The [concept_prime_minister] is carrying the [Concept('concept_rus_blame','blame')] for the country's misery ([GetPlayer.MakeScope.Var('rus_wn_pm_blame').GetValue|0] out of 100). Replacing him would release some of the pressure.#!"
 rus_wn_status_blame_low: "The [concept_prime_minister] has not yet worn out his welcome ([GetPlayer.MakeScope.Var('rus_wn_pm_blame').GetValue|0] out of 100)."
 rus_wn_status_blame_medium: "The [concept_prime_minister] is taking some of the [Concept('concept_rus_blame','blame')] for the country's troubles ([GetPlayer.MakeScope.Var('rus_wn_pm_blame').GetValue|0] out of 100)."
 rus_zero_option: "The Zero Option"
 rus_zero_option_desc: "Both sides gave up their mandates together."
 wild_nineties.1.a: "Let the reforms begin."
 wild_nineties.1.d: "The Soviet Union is gone. On the second of January the government freed most prices overnight, and within days the shelves filled with goods that almost nobody could afford. Savings that took a lifetime to build are evaporating with every week of inflation.\n\nBoris Yeltsin governs from the Kremlin with the authority of the man who stood on a tank in August 1991, a young economist named Yegor Gaidar running the reforms, and a Congress of People's Deputies that is already in revolt. Around them a new class of bankers, security men and fixers is forming, and all of them are watching the President's health."
 wild_nineties.1.f: "#bold The Wild Nineties#! follows Russia from the fall of the Soviet Union to the end of the decade. Keep the President healthy, manage the [concept_prime_minister] as a lightning rod, rule by [Concept('concept_rus_ukaz','decree')] when you must, and decide who inherits the Kremlin when Yeltsin goes."
 wild_nineties.1.t: "The Wild Nineties"
 wild_nineties.10.a: "Bring back Chernomyrdin, the steady hand."
 wild_nineties.10.b: "Give Gaidar another chance to finish the reforms."
 wild_nineties.10.c: "Promote Kiriyenko, the young technocrat."
 wild_nineties.10.d: "Ask Primakov to steady the ship."
 wild_nineties.10.e: "Appoint Stepashin, the loyal security man."
 wild_nineties.10.f: "[concept_rus_family] recommends Putin."
 wild_nineties.10.g: "Give the job to Nemtsov, the young governor."
 wild_nineties.10.h: "Run the government from the Kremlin for now."
 wild_nineties.10.t: "A New [concept_prime_minister]"
 wild_nineties.12.a: "Stand by the [concept_prime_minister], for now."
 wild_nineties.12.b: "Let the [Concept('concept_rus_family','Family')] find out who leaked it."
 wild_nineties.12.d: "A Moscow tabloid has published transcripts of what it claims are the [concept_prime_minister]'s private telephone calls, complete with remarks about the President that nobody in the Kremlin wanted printed. The leak has the fingerprints of a rival faction all over it.\n\n[SCOPE.sCharacter('rus_wn_pm_scope').GetFullName] insists every word is fabricated."
 wild_nineties.12.t: "Kompromat"
 wild_nineties.13.a: "Let the [Concept('concept_rus_family','Family')] carry the load while he rests."
 wild_nineties.13.b: "The President will see his ministers himself."
 wild_nineties.13.d: "The President spends more and more time at the Gorki-9 residence, and the people who see him there are fewer and closer. Papers reach him through his daughter and a handful of trusted aides, and decisions come back the same way.\n\nMinisters have started to ask, quietly, who exactly they are taking orders from."
 wild_nineties.13.t: "Evenings at the Dacha"
 wild_nineties.14.a: "Sign it. We need our friends."
 wild_nineties.14.b: "Refuse him."
 wild_nineties.14.d: "One of the new bankers has asked for a small thing: an export licence here, a customs exemption there, the right signature on a tender. In return he offers what his television channel and his bank can do for the government's friends.\n\nNobody in the Kremlin pretends to be shocked anymore."
 wild_nineties.14.t: "A Favour Between Friends"
 wild_nineties.20.a: "The [concept_prime_minister] takes the oath."
 wild_nineties.20.d: "The Kremlin has announced the death of [SCOPE.sCharacter('rus_wn_yeltsin_scope').GetFullName]. The heart that doctors had warned about for years finally gave out.\n\nUnder the constitution the [concept_prime_minister] becomes acting President. Whatever plans the [Concept('concept_rus_family','Family')] had for an orderly handover will have to be improvised in the next few hours."
 wild_nineties.20.t: "The President Is Dead"
 wild_nineties.21.a: "The President is on holiday."
 wild_nineties.21.b: "Tell the country the truth."
 wild_nineties.21.d: "The press office says the President is on holiday. The doctors at the Central Clinical Hospital say something different: a serious heart attack, the first of what they fear will not be the last.\n\nFor several weeks the country will be governed by whoever controls the door to his room."
 wild_nineties.21.t: "The President Is Resting"
 wild_nineties.22.a: "Operate."
 wild_nineties.22.b: "Postpone it. He is needed now."
 wild_nineties.22.d: "Specialists brought in from abroad have examined the President and reached a blunt conclusion: without a quintuple bypass operation he will not see the end of his term. With it, he faces weeks under anaesthetic and months of recovery while the [concept_prime_minister] holds the nuclear briefcase."
 wild_nineties.22.t: "The Bypass"
 wild_nineties.30.a: "Vladimir Putin, the quiet man from the security services."
 wild_nineties.30.b: "Sergei Stepashin, loyal and unthreatening."
 wild_nineties.30.c: "Yevgeny Primakov, the elder statesman."
 wild_nineties.30.d: "Yuri Luzhkov, master of Moscow."
 wild_nineties.30.e: "Viktor Chernomyrdin, the man who kept the gas flowing."
 wild_nineties.30.f: "Boris Nemtsov, the reformers' great hope."
 wild_nineties.30.g: "Alexander Lebed, the general the soldiers trust."
 wild_nineties.30.h: "The current [concept_prime_minister] will do."
 wild_nineties.30.i: "There will be no handover. The President stays."
 wild_nineties.30.t: "[concept_rus_operation_successor]"
 wild_nineties.31.a: "The decade is over."
 wild_nineties.31.d: "On the last day of the millennium Boris Yeltsin appeared on television, looking older than his sixty-eight years. He asked the country's forgiveness for the dreams that had not come true, and announced that he was resigning, effective at noon. The constitution makes the [concept_prime_minister] acting President until an election that will now be a formality.\n\nThe Wild Nineties end with a new face in the Kremlin."
 wild_nineties.31.t: "I Am Tired, I Am Leaving"
 wild_nineties.40.a: "Default and devalue."
 wild_nineties.40.b: "Burn the reserves defending the rouble first."
 wild_nineties.40.d: "The government has announced that it will stop paying its short-term bonds and let the rouble float. The rouble is already in free fall. Banks that had bet everything on government paper are shutting their doors, depositors are queueing in the rain, and imported goods have vanished from the shops.\n\nThe pyramid of bonds that kept the budget afloat has collapsed under its own weight."
 wild_nineties.40.t: "Black Monday"
 wild_nineties.41.a: "Tolerate it. At least the factories still run."
 wild_nineties.41.b: "Find the money to pay them in roubles."
 wild_nineties.41.d: "Workers at a tyre plant in the Urals have not been paid in cash for seven months. Instead the management hands out tyres, which the workers sell at the roadside to buy bread. Across the country the story repeats with saucepans, coffins, vodka and fertiliser.\n\nMuch of the Russian economy no longer uses money at all."
 wild_nineties.41.t: "Paid in Saucepans"
 wild_nineties.42.a: "Find the money and pay them."
 wild_nineties.42.b: "Send in the riot police."
 wild_nineties.42.d: "Coal miners who have not been paid for months have sat down on the Trans-Siberian Railway, blocking traffic between European Russia and the Far East. Their banners say the same thing everywhere: pay us what we are owed.\n\nThe railway ministry says freight is backing up for hundreds of kilometres."
 wild_nineties.42.t: "Miners on the Rails"
 wild_nineties.50.a: "Qu'elle fasse venir Tchoubaïs."
 wild_nineties.50.b: "Laisser faire les hommes de Korjakov."
 wild_nineties.50.d: "[SCOPE.sCharacter('rus_wn_dyachenko_scope').GetFullName], la fille cadette du président, a rejoint l'équipe du Kremlin, officiellement comme conseillère en image. En réalité, elle est la seule personne dont tout le monde admet qu'elle peut dire la vérité à son père, et chaque clan autour de lui la veut désormais de son côté.\n\nLes banquiers veulent qu'elle fasse venir Anatoli Tchoubaïs. Les hommes de Korjakov préféreraient qu'elle reste chez elle."
 wild_nineties.50.t: "La fille du président"
 wild_nineties.60.a: "Hear the proposal out."
 wild_nineties.60.d: "The banker [SCOPE.sCharacter('rus_wn_potanin_scope').GetFullName] has brought the government a proposal. The budget is short of money and the state owns some of the most valuable companies on earth. Let the banks lend the government what it needs, and take shares in those companies as collateral. If the loans are not repaid, the banks auction the shares.\n\nEveryone in the room understands that the loans will not be repaid, and that the banks will be running the auctions."
 wild_nineties.60.t: "[concept_rus_loans_for_shares]"
 wild_nineties.61.a: "Defend the reformers."
 wild_nineties.61.b: "Sacrifice the reformers to buy peace."
 wild_nineties.61.d: "The Svyazinvest telecoms auction went to the highest bidder, which was not the bidder the other bankers had agreed on. Within days [SCOPE.sCharacter('rus_wn_gusinsky_scope').GetFullName]'s television channel and Berezovsky's newspapers turned their guns on the reformers in government, publishing everything from book advances to dacha purchases.\n\nThe men who financed the President's re-election are now at war with his ministers."
 wild_nineties.61.t: "The Bankers' War"
