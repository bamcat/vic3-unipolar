 rus_ukaz_signature: "Signed in His Name"
 rus_ukaz_signature_button: "Sign in the President's Name"
 rus_ukaz_signature_button_desc: "Let the [Concept('concept_rus_family','Family')] put the President's signature on [Concept('concept_rus_ukaz','decrees')] while he rests. It gets things done, and it shows."
 rus_ukaz_signature_desc: "[concept_rus_family] is signing [Concept('concept_rus_ukaz','decrees')] for the President."
