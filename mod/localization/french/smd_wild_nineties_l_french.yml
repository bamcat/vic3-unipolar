 RUS_ST_BASKET:0 "The Shopping Basket"
 RUS_ST_BASKET_TT:0 "#header The Shopping Basket#!\nThe six everyday goods that make up [concept_consumer_prices], priced live on your market. Hover a good to see its exact price.\n\n#lore In 1992 a Russian family spent around two thirds of its income on food alone.#!"
 RUS_ST_CPI_TITLE:0 "[concept_consumer_prices]"
 RUS_ST_CPI_TT:0 "#header [concept_consumer_prices]#!\nThe average price change across the shopping basket, live from your market. Above +30% the government takes [concept_rus_blame] and [concept_capital_flight] rises. The economic course is only stabilized once prices stay below +20% with wages paid, no bonds on sale, [concept_capital_flight] under 30 and state debt under half of GDP.\n\nEffects are checked once a month."
 RUS_ST_TREND_UP_TT:0 "Prices have risen since the last monthly check"
 RUS_ST_TREND_DOWN_TT:0 "Prices have fallen since the last monthly check"
 RUS_ST_TREND_FLAT_TT:0 "Prices are about where they were at the last monthly check"
 RUS_ST_FLIGHT_TITLE:0 "[concept_capital_flight]"
 RUS_ST_FLIGHT_TT:0 "#header [concept_capital_flight]#!\nCurrently [GetPlayer.MakeScope.Var('fin_capital_flight').GetValue|0] out of 100. Your pops are sending #n [GetPlayer.MakeScope.ScriptValue('fin_capital_flight_outflow_pct')|0]%#! of their savings abroad instead of into your investment pool. While [concept_short_term_bonds] are in circulation it also raises the interest rate on your loans.\n\nIt falls by 1 a month while prices stay under +15% and bonds in circulation are under 10% of GDP, and slowly while prices are under +30%.\n\n#lore Suitcases of dollars left Sheremetyevo airport every day, bound for Cyprus and Switzerland.#!"
 RUS_ST_BONDS_TITLE:0 "[concept_short_term_bonds]"
 RUS_ST_BONDS_TT:0 "#header [concept_short_term_bonds]#!\nIn circulation: @money![GetPlayer.MakeScope.Var('fin_bond_stock').GetValue|0v], equal to [GetPlayer.MakeScope.Var('fin_bond_ratio_var').GetValue|1]% of GDP.\nState debt: @money![GetPlayer.MakeScope.ScriptValue('principal')|0v], equal to [GetPlayer.MakeScope.Var('fin_debt_ratio_var').GetValue|1]% of GDP.\n\nWhile on sale, bonds bring in @money![GetPlayer.MakeScope.ScriptValue('fin_bond_issue_amount')|0v] a month. The bonds in circulation add #n [GetPlayer.MakeScope.ScriptValue('fin_bond_rate')|%1]#! to the interest rate on your loans, and the extra fades as they mature after sales stop.\n\n#lore By the summer of 1998 [Concept('concept_short_term_bonds','GKOs')] were paying over 100% a year, and the Central Bank was spending a billion dollars a week defending the ruble.#!"
 RUS_ST_BONDS_RISK_TT:0 "#negative Default risk.#! The debt is very high. If the state runs out of credit and defaults, the bonds are wiped out and [concept_capital_flight] soars."
 RUS_ST_WAGES_TITLE:0 "[Concept('concept_wage_arrears','Public Wages')]"
 RUS_ST_WAGES_TT:0 "#header [concept_wage_arrears]#!\nWhether soldiers, teachers and doctors are being paid. Delaying wages saves money now, but every level of arrears angers the people who are owed and adds [concept_rus_blame] to the government.\n\n#lore In 1996 miners in the Kuzbass blocked the Trans Siberian Railway for days over months of unpaid wages.#!"
 RUS_ST_GOOD_GROCERIES_TT:0 "#header [Goods.GetName]#!\nMarket price: @money![Goods.GetMarketPrice|1v], normal price @money![Goods.GetBasePrice|1v] ([Goods.GetPercentageDeltaAgainstBasePrice(Goods.GetMarketPrice)|%0=-]). This is the same price your market panel shows, and it counts toward [concept_consumer_prices].\n\n#lore Bread, sausage and tinned fish. When prices were freed, pensioners sold their belongings on the pavement outside metro stations to afford them.#!"
 RUS_ST_GOOD_GRAIN_TT:0 "#header [Goods.GetName]#!\nMarket price: @money![Goods.GetMarketPrice|1v], normal price @money![Goods.GetBasePrice|1v] ([Goods.GetPercentageDeltaAgainstBasePrice(Goods.GetMarketPrice)|%0=-]). This is the same price your market panel shows, and it counts toward [concept_consumer_prices].\n\n#lore Collective farms held back their harvests, waiting for prices to climb, while the cities waited for flour.#!"
 RUS_ST_GOOD_CLOTHES_TT:0 "#header [Goods.GetName]#!\nMarket price: @money![Goods.GetMarketPrice|1v], normal price @money![Goods.GetBasePrice|1v] ([Goods.GetPercentageDeltaAgainstBasePrice(Goods.GetMarketPrice)|%0=-]). This is the same price your market panel shows, and it counts toward [concept_consumer_prices].\n\n#lore Shuttle traders, the chelnoki, hauled bags of clothing from Turkey and China to sell in open air markets across the country.#!"
 RUS_ST_GOOD_FURNITURE_TT:0 "#header [Goods.GetName]#!\nMarket price: @money![Goods.GetMarketPrice|1v], normal price @money![Goods.GetBasePrice|1v] ([Goods.GetPercentageDeltaAgainstBasePrice(Goods.GetMarketPrice)|%0=-]). This is the same price your market panel shows, and it counts toward [concept_consumer_prices].\n\n#lore Soviet families queued for years to buy a wall unit. Now the shops had them, and almost nobody could pay.#!"
 RUS_ST_GOOD_LIQUOR_TT:0 "#header [Goods.GetName]#!\nMarket price: @money![Goods.GetMarketPrice|1v], normal price @money![Goods.GetBasePrice|1v] ([Goods.GetPercentageDeltaAgainstBasePrice(Goods.GetMarketPrice)|%0=-]). This is the same price your market panel shows, and it counts toward [concept_consumer_prices].\n\n#lore Vodka was the one thing everyone kept buying. The state monopoly collapsed and bootleg spirits poisoned thousands.#!"
 RUS_ST_GOOD_APPLIANCES_TT:0 "#header [Goods.GetName]#!\nMarket price: @money![Goods.GetMarketPrice|1v], normal price @money![Goods.GetBasePrice|1v] ([Goods.GetPercentageDeltaAgainstBasePrice(Goods.GetMarketPrice)|%0=-]). This is the same price your market panel shows, and it counts toward [concept_consumer_prices].\n\n#lore Imported televisions and refrigerators filled the kiosks, priced in dollars and out of reach for most families.#!"
 rus_dvoe_army_rivalry_tt:0 "#lore Every ruble and medal for the generals is one the Interior Ministry's troops do not get. Yerin's men resent being second in line.#!"
 rus_dvoe_mvd_rivalry_tt:0 "#lore The generals watch the Interior Ministry's divisions grow better armed than their own regiments, and they do not like it.#!"
 rus_dvoe_moscow_rivalry_tt:0 "#lore Luzhkov's capital already swallows a lifetime of subsidies. Every new favour for Moscow is noted by the governors who get nothing.#!"
 rus_dvoe_regions_rivalry_tt:0 "#lore Tax breaks for the provinces come straight out of the capital's budget, and Luzhkov is not a man who forgives being shortchanged.#!"
 rus_dvoe_church_rivalry_tt:0 "#lore Embracing the Patriarch unsettles the Muslim republics of the Volga and the Caucasus, who wonder whose Russia this is.#!"
 rus_dvoe_court_rivalry_tt:0 "#lore Promising to respect the Court's rulings means tying the hands of the police. The Interior Ministry wants a free hand, not a judge looking over its shoulder.#!"
 RUS_WN_CHECHEN_WAR_POSSIBLE:0 "Chechnya is still an independent state at peace with Russia"
 NOT_RUS_WN_CHECHEN_WAR_POSSIBLE:0 "Chechnya is no longer an independent state at peace with Russia"
 concept_rus_oligarchs:0 "Oligarchs"
 concept_rus_oligarchs_desc:0 "A small group of bankers and industrialists who bought Russia's oil, metals, banks and television stations in the 1990s, often for a fraction of their worth. Berezovsky, Gusinsky, Khodorkovsky and Potanin financed Yeltsin's reelection in 1996 and expected to be paid back.\n\nOnce two companies have been auctioned in [concept_rus_loans_for_shares], the [concept_rus_red_directors] give way to the Oligarchs, who take over the Industrialists with new traits. From then on [concept_rus_oligarch_power] starts to grow."
 concept_rus_red_directors:0 "Red Directors"
 concept_rus_red_directors_desc:0 "The managers of the great Soviet factories. They kept their plants running on state credit, protected their workers from the market, and quietly sold off whatever could be sold.\n\nAt the start of the decade the Industrialists are the Red Directors, with traits built around protected factories, state credit and asset stripping. They lose their grip once the [concept_rus_oligarchs] arrive."
 concept_rus_siloviki:0 "Siloviki"
 concept_rus_siloviki_desc:0 "From silovye struktury, the power structures: veterans of the KGB, the army and the police. Under Putin they moved into the commanding posts of the state and of its largest companies.\n\nThe Armed Forces become the Siloviki if Vladimir Putin succeeds Yeltsin."
 concept_rus_loans_for_shares:0 "Loans for Shares"
 concept_rus_loans_for_shares_desc:0 "In 1995 the government, desperate for money, let a handful of banks lend it cash in exchange for control of its best companies. The auctions were run by the banks themselves, and the loans were never repaid.\n\nFrom 1995 you can auction off Yukos, Norilsk Nickel, Sibneft and Svyazinvest. Each sale brings money into the treasury, makes its buyer more powerful and raises [concept_rus_oligarch_power]. After two sales the [concept_rus_oligarchs] take shape."
 concept_rus_vouchers:0 "Voucher Privatisation"
 concept_rus_vouchers_desc:0 "In 1992 every Russian citizen received a voucher worth ten thousand roubles to exchange for shares in state enterprises. Most were sold for a bottle of vodka or a few dollars to whoever was buying them up.\n\nThe voucher ukaz speeds up private investment and pleases the Industrialists, but feeds [concept_rus_oligarch_power] and [concept_capital_flight]."
 concept_rus_shock_therapy:0 "Shock Therapy"
 concept_rus_shock_therapy_desc:0 "The plan of Yegor Gaidar and his Western advisers: free prices, cut subsidies and privatise everything as fast as possible, before the old system could fight back. Prices rose 2,500% in 1992.\n\nYour economic course decides how fast the shock comes: shock therapy, a gradual transition, red credit for the factories or an IMF programme. Each sets your [concept_monetary_stance] and [concept_price_controls] and changes [concept_wage_arrears]. Stabilise [concept_consumer_prices] and stop borrowing to see it through."
 concept_rus_operation_successor:0 "Operation Successor"
 concept_rus_operation_successor_desc:0 "By 1999 the Family needed someone who would protect Yeltsin and his circle after he left office. They chose a little known former KGB officer, Vladimir Putin.\n\nIn August 1999 Yeltsin chooses his successor from the politicians whose [concept_rus_kremlin_standing] is high enough. Putin also needs [concept_rus_family] to hold at least 30 Influence. At the end of the year Yeltsin resigns and the successor takes power."
 concept_rus_decree_1400:0 "Decree 1400"
 concept_rus_decree_1400_desc:0 "On 21 September 1993 Yeltsin signed Decree No. 1400, dissolving the Congress of People's Deputies and the Supreme Soviet. The deputies refused to leave the White House, and two weeks later the army shelled it.\n\nOnce the spring referendum has been held, from September 1993 the President can issue Decree 1400 for 150 Authority. What happens next depends on [concept_rus_dual_power] and above all on whether [concept_rus_inst_army] backs him."
 je_rus_wn_ousted_oligarchs_conclusion_desc:0 "Boris Yeltsin has lost the Kremlin before he could choose his own successor. The [concept_rus_oligarchs] he enriched have outlasted him, and whoever governs now will govern with their permission."
 je_rus_wn_ousted_conclusion_desc:0 "Boris Yeltsin has lost the Kremlin before he could choose his own successor. The [concept_rus_oligarchs] never grew strong enough to capture the state, and the new government inherits a country still finding its shape."
 RUS_WN_NINETIES_OVER:0 "The Wild Nineties are over"
 NOT_RUS_WN_NINETIES_OVER:0 "The Wild Nineties are not over"
 rus_wn_oligarchs_outside_tt:0 "The [concept_rus_oligarchs] are out of government and out of favour"
