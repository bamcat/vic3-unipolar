 rus_appoint_prime_minister:0 "Nommer le Premier ministre"
 rus_appoint_prime_minister_desc:0 "Faire de ce politicien le [concept_prime_minister]. Le choix du président ne nécessite aucun vote, mais chaque remaniement coûte de l'autorité au Kremlin, satisfait le [concept_interest_group] du nouveau chef du gouvernement et froisse celui du sortant."
 rus_pm_appointment_authority:0 "Remaniement récent"
 rus_pm_appointment_authority_desc:0 "Le président vient de remplacer le gouvernement."
 rus_pm_appointed_ig:0 "Leur homme à la Maison-Blanche"
 rus_pm_appointed_ig_desc:0 "L'un des leurs a été nommé Premier ministre."
 rus_pm_dismissed_ig:0 "Renvoyé de la Maison-Blanche"
 rus_pm_dismissed_ig_desc:0 "Leur Premier ministre a été renvoyé."
