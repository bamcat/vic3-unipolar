  news_events_world.31.a: "Le travailleur s'est fait entendre."
  news_events_world.32.t: "Les [ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting] reculent !"
  news_events_world.32.d: "[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetNameNoFormatting] a reculé dans sa confrontation diplomatique avec [ROOT.Var('news_world_32_news_backdown_target_ref').GetCountry.GetNameNoFormatting], cédant sur la demande principale plutôt que de mener le différend jusqu'à la guerre. Ce qui avait été présenté comme une épreuve de détermination nationale s'est terminé à la table des négociations, et les chancelleries étrangères évaluent déjà ce que cette retraite peut signifier pour le prestige [ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting]."
  news_events_world.32.f: "SERVICE DIPLOMATIQUE : Les télégrammes des capitales étrangères signalent un soulagement immédiat : la guerre a été évitée. Au pays, cependant, les adversaires du gouvernement demandent déjà si la paix n'a pas été achetée trop cher."
  news_events_world.32.a: "Ainsi s'achève la crise."

  news_events_world.1.t2: "L’Europe retient son souffle tandis que [ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFormatting] Affronte [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFormatting]"
