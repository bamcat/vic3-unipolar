l_french:
  news_events_world.1.t: "[ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFormatting] et [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFormatting] au bord de la guerre !"
  news_events_world.1.d: "La [ROOT.Var('news_world_1_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] a placé [ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFlag] et [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFlag] dans une confrontation ouverte. Deux des principales puissances de l'époque se font désormais face dans une querelle officielle, et les chancelleries d'Europe connaissent une activité qu'elles n'avaient plus vue depuis des années. Les courriers circulent entre les capitales à toute heure, les marchés chancellent et les cercles militaires ne parlent de rien d'autre. Le règlement par la négociation ou le passage à la guerre dépendra des exigences formulées dans les semaines à venir, des mouvements de troupes vers la frontière et des gouvernements qui choisiront leur camp lorsque viendra l'heure du règlement de comptes."
  news_events_world.1.f: "SERVICE DIPLOMATIQUE : Les envoyés des deux camps travailleraient bien après minuit. Un observateur étranger décrit une atmosphère courtoise en public et incontestablement hostile en privé."
  news_events_world.2.t: "CRISE ! Entre [ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFormatting] et [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.2.d: "[ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFlag] a jeté tout son poids dans la [ROOT.Var('news_world_2_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] contre [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFlag]. Une puissance de premier rang a choisi de s'engager dans un différend qui aurait autrement pu rester régional, transformant entièrement la nature de la crise. Une querelle de voisins est devenue une affaire pour le concert des nations. Les ministères des Affaires étrangères examinent avec la plus grande attention les demandes et les nouveaux engagements, tandis que les petits gouvernements de la région déterminent discrètement quel camp ils peuvent le moins se permettre d'offenser."
  news_events_world.2.f: "ANALYSE : Ce qui n'était qu'une querelle régionale retient désormais l'attention de toutes les grandes chancelleries ; les petits gouvernements décident en silence quel camp ils peuvent se permettre de mécontenter."
  news_events_world.3.t: "GUERRE ! Entre [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFormatting] et [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFormatting] !"
  news_events_world.3.d: "La [ROOT.Var('news_world_3_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] a dépassé le cadre de la diplomatie pour devenir une guerre ouverte entre [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFlag] et [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFlag]. Les ambassadeurs ont été rappelés, les réservistes convoqués dans leurs dépôts et les marchés jetés dans le désordre. Les bureaux de recrutement sont bondés depuis l'aube et les compagnies de chemin de fer ont placé leur matériel roulant à la disposition des ministères de la Guerre. Les négociants se demandent déjà quels ports et quelles routes resteront ouverts, et à quel prix ils pourront s'assurer, tandis que les gouvernements du continent évaluent les obligations que leurs traités pourraient désormais leur imposer."
  news_events_world.3.f: "DU FRONT : Les horaires ferroviaires cèdent la place aux convois militaires tandis que réservistes, munitions et chevaux gagnent les zones de combat. Les négociants se demandent déjà quels ports et quelles routes resteront sûrs."
  news_events_world.4.t: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFormatting] envahit [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.4.d: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFlag] est entré en campagne contre [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFlag] dans la [ROOT.Var('news_world_4_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]. La disproportion entre les deux belligérants est évidente et certains, dans les capitales, annoncent déjà une conclusion rapide et peu coûteuse. D'autres recommandent la prudence. Nos correspondants militaires rappellent combien la distance, le terrain difficile, la maladie et l'ingérence discrète de tiers ont souvent humilié une force qui paraissait écrasante sur le papier, et combien rarement une campagne commencée sous d'optimistes prédictions s'est achevée dans la saison promise."
  news_events_world.4.f: "SERVICE MILITAIRE : Le déséquilibre sur le papier peut être considérable, mais nos correspondants rappellent que la distance, le terrain et l'intervention étrangère ont ruiné bien des campagnes réputées faciles."
  news_events_world.5.t: "Coup d'État en [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.5.d: "L'ordre politique de [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFlag] a été renversé par la force. L'autorité appartient désormais à [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetRuler.GetFullName], et l'État sera gouverné comme [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetGovernment.GetName]. Les ministères, les bureaux du télégraphe et les principales gares ont été occupés avant l'aube. L'armée suivra-t-elle les nouveaux maîtres dans les provinces aussi docilement que dans la capitale, les lois et traités existants seront-ils respectés, et les partis renversés se soumettront-ils ou prendront-ils les armes ? Personne dans la capitale ne peut encore répondre avec assurance."
  news_events_world.5.f: "EXCLUSIF DE LA CAPITALE : Des habitants signalent des soldats aux ministères, dans les gares et aux bureaux du télégraphe. Au matin, les uniformes avaient changé, nous dit un employé, mais nul ne savait de qui ils recevaient leurs ordres."
  news_events_world.6.t: "[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] de [ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFormatting] assassiné"
  news_events_world.6.d: "[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_6_character_ref').GetCharacter.GetFullName], âgé de [ROOT.Var('news_world_6_character_ref').GetCharacter.GetAge] ans, a été abattu par un assassin alors qu'il gouvernait [ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFlag]. Le meurtre d'un chef d'État a provoqué un choc immédiat : les ministres s'emploient à sécuriser la capitale, la garnison et le trésor, et à préserver au moins l'apparence de la continuité. Les gouvernements étrangers demandent l'assurance que traités et commandements militaires demeurent inchangés. La recherche du complot derrière le crime ne fait que commencer, et chaque faction a intérêt à orienter les soupçons."
  news_events_world.6.f: "SERVICE DE SÉCURITÉ : Les enquêteurs recherchent des complices tandis que les ministres s'efforcent de démontrer que l'État reste maître de la situation. Reste à savoir si l'assassin a agi seul ou pour une faction prête à frapper ensuite."
  news_events_world.7.t: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullNameNoFormatting] est mort ; [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFormatting] en deuil"
  news_events_world.7.d: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullName] est mort à l'âge de [ROOT.Var('news_world_7_character_ref').GetCharacter.GetAge] ans alors qu'il gouvernait [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFlag]. Des draperies noires couvrent les bâtiments publics et les boutiques de la capitale ont fermé leurs volets. La succession revient désormais au mécanisme prévu par la coutume et la loi, tandis que les ministres parlent d'une seule voix de continuité. Mais chaque chancellerie étrangère se demande en privé si ce changement modifiera les alliances, la politique ou l'équilibre entre les factions qui entouraient depuis longtemps le pouvoir."
  news_events_world.7.f: "DE LA CAPITALE : La foule se rassemble pour apprendre les nouvelles de la succession tandis que les bâtiments publics se couvrent de noir. Derrière les cérémonies, les ministres se disputent déjà le sens du nouveau règne."
  news_events_world.8.t: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetLastNameNoFormatting] renversé en [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.8.d: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetFullName] a été écarté du pouvoir en [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFlag] de son vivant, et [ROOT.Var('news_world_8_new_ruler_ref').GetCharacter.GetFullName] a pris les rênes de l'État. Le pays sera gouverné comme [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetGovernment.GetName]. Un souverain vivant renversé sans élection, sans décès et sans succession ordinaire se prête rarement à une explication simple, et le récit officiel convainc peu de monde. Les diplomates observent les nominations ministérielles et les mouvements de la garnison afin de comprendre ce qui s'est passé derrière les portes closes et si le nouveau gouvernement repose sur le consentement ou sur la baïonnette."
  news_events_world.8.f: "ANALYSE POLITIQUE : L'éviction d'un dirigeant vivant sans élection, sans décès ni succession ordinaire laisse rarement derrière elle une explication simple."
  news_events_world.9.t_presidential: "[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting] remporte l'élection présidentielle [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting]"
  news_events_world.9.d_presidential: "Le [ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting] a remporté l'élection en [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], et [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName] accède à la présidence. Les candidats du parti ont recueilli [ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetCurrentVotingPowerShare|%1] des suffrages exprimés. Le résultat est accueilli par des célébrations ici et par une franche consternation ailleurs, tandis que les vaincus contestent déjà le déroulement du scrutin dans plusieurs districts. Les gouvernements étrangers étudient ce que l'issue peut annoncer en matière de diplomatie, de commerce, de politique militaire et d'orientation générale de l'une des principales puissances de l'époque."
  news_events_world.9.t_party: "[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting] triomphe aux élections [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting]"
  news_events_world.9.d_party: "Le [ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting] sort en tête de la campagne en [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], avec [ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetCurrentVotingPowerShare|%1] des suffrages exprimés. Dans les grandes villes, les comités comptaient encore bien après minuit et plusieurs résultats sont contestés. Gouvernements, investisseurs et mouvements politiques étrangers évaluent désormais ce que le nouvel équilibre des partis signifie pour la politique intérieure et extérieure, et si le ministère qui en sortira pourra disposer longtemps d'une majorité de travail."
  news_events_world.9.t_government: "[ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting] dirigera le gouvernement de [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.9.d_government: "Le [ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting] devient le principal parti du gouvernement de [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag] après l'élection, avec [ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetCurrentVotingPowerShare|%1] des suffrages. Là où la Couronne demeure au-dessus de la lutte, une élection peut bouleverser tout l'équilibre du pouvoir sans changer le chef de l'État. Les gouvernements étrangers et les milieux d'affaires observent de près le nouveau ministère, car la composition d'un cabinet a souvent mieux indiqué les intentions d'un pays qu'un discours du trône."
  news_events_world.9.t: "L'élection en [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting] s'achève"
  news_events_world.9.d: "Une élection s'est achevée en [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], pays dont le poids mondial fait du résultat un événement international plutôt qu'une simple affaire intérieure. Les résultats ont été télégraphiés à toutes les capitales d'Europe quelques heures après leur proclamation. Les gouvernements et mouvements politiques étrangers étudient l'équilibre des partis et la position de [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName], dont le gouvernement peut encore influer sur la diplomatie, le commerce, les flottes et les armées, et le climat général de l'époque. Chez lui, le travail de formation d'un gouvernement commence réellement."
  news_events_world.9.f: "SERVICE ÉLECTORAL : Les états-majors des partis célèbrent, contestent et recomptent avec la même ardeur. À l'étranger, le résultat sera lu comme un indice de la prochaine orientation diplomatique et commerciale du pays."
  news_events_world.10.t_drought: "La sécheresse frappe [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_drought: "Les pluies ont fait défaut dans [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], où quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] âmes dépendent de la récolte. Les champs sont desséchés, les réservoirs baissent chaque semaine et les cultivateurs réduisent leurs semis en prévision du pire. Les éleveurs conduisent leurs bêtes toujours plus loin pour trouver de l'eau, tandis que les négociants en céréales relèvent déjà leurs prix à terme. Si le temps sec persiste, une mauvaise année pourrait devenir une véritable catastrophe."
  news_events_world.10.t_flood: "Grande inondation à [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] ; de nombreuses victimes redoutées"
  news_events_world.10.d_flood: "Les rivières ont débordé dans [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], noyant fermes, routes et villages dans une région de quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants. Les ponts et remblais ferroviaires sont inspectés tandis que les secours tentent d'atteindre les localités isolées. Les pertes de bétail sont graves et les réserves de nombreuses familles sont détruites. Les marchés ressentiront les dégâts longtemps après le retrait des eaux."
  news_events_world.10.t_frost: "Un gel terrible ravage [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_frost: "Un gel exceptionnel s'est abattu sur [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Les cultivateurs signalent des champs noircis et des vergers ruinés, le froid ayant frappé des cultures déjà avancées. Dans une région de quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants, la perte d'une récolte n'est pas mince affaire. Les marchands prévoient des pénuries et les fermiers espèrent qu'un semis tardif sauvera une partie de l'année."
  news_events_world.10.t_wildfire: "Incendies à [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] ; évacuations en cours"
  news_events_world.10.d_wildfire: "Le feu progresse à travers [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], chassant les familles de leurs foyers et menaçant fermes, forêts et routes. La fumée obscurcit des districts entiers et le soleil paraît rouge à midi. Les autorités organisent des coupe-feu et la milice est appelée dans plusieurs paroisses. Pour les quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants de l'État, les pertes se feront sentir longtemps après l'extinction des flammes."
  news_events_world.10.t_hailstorm: "La grêle détruit la récolte à [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_hailstorm: "Une violente tempête de grêle a balayé [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], déchiquetant les céréales et brisant toitures, vitres et bétail exposé. Des champs presque prêts à moissonner ont été couchés en quelques heures. Dans un État de quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants, la destruction des récoltes se répercute vite sur le prix du pain et les revenus ruraux."
  news_events_world.10.t_locust_swarm: "Les sauterelles s'abattent sur [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_locust_swarm: "Des nuées de sauterelles se sont abattues sur [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], dépouillant les champs plus vite que les paroisses ne peuvent les défendre. Les greniers sont gardés jour et nuit tandis que les fermiers brûlent, battent et enfument les insectes. Avec quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants dans les districts touchés, les autorités craignent que la disette ne suive de près le fléau."
  news_events_world.10.t_heatwave: "Une chaleur accablante s'installe sur [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_heatwave: "Une chaleur accablante étreint [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Les puits baissent, le bétail meurt et le travail extérieur devient dangereux aux heures les plus chaudes. Les médecins mettent en garde les habitants des villes tandis que les fermiers craignent pour leurs cultures. Dans un État de quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] personnes, une chaleur prolongée peut devenir une crise agricole et sanitaire."
  news_events_world.10.t_disease_outbreak: "Maladie dans les récoltes de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_disease_outbreak: "Une maladie s'étend dans les cultures et les troupeaux de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Les agriculteurs arrachent les plants atteints et isolent les bêtes malades, mais les pertes augmentent. Dans une région de quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants, une épidémie agricole durable menace les prix alimentaires et les revenus ruraux bien au-delà des exploitations touchées."
  news_events_world.10.t_extreme_winds: "Des vents violents ravagent [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_extreme_winds: "Des vents d'une violence exceptionnelle balayent [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], arrachant des toitures, couchant des arbres et interrompant routes et communications. Les autorités évaluent les dégâts dans une région de quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants. Les récoltes, les transports et les bâtiments ruraux risquent de subir des pertes considérables avant le retour au calme."
  news_events_world.10.t_torrential_rains: "Pluies torrentielles sur [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_torrential_rains: "Des pluies torrentielles s'abattent sur [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Les champs sont gorgés d'eau, les routes deviennent impraticables et les cours d'eau montent rapidement. Avec quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants dans la région, les autorités craignent des glissements de terrain, des pertes de récoltes et une interruption durable des transports si les pluies persistent."
  news_events_world.10.t_pollinator_surge: "Les pollinisateurs abondent à [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_pollinator_surge: "Une abondance inhabituelle d'abeilles et d'autres pollinisateurs est signalée dans [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Les cultivateurs y voient un présage favorable pour les vergers et les cultures. Dans une région de quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants, une meilleure fécondation pourrait sensiblement améliorer la récolte si le reste de la saison demeure clément."
  news_events_world.10.t_optimal_sunlight: "Un soleil idéal favorise [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_optimal_sunlight: "Les agriculteurs de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], bénéficient d'un ensoleillement presque idéal. Les cultures mûrissent régulièrement et les perspectives de récolte s'améliorent. Pour quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants, une saison favorable pourrait apporter des récoltes abondantes, des prix plus stables et un répit bienvenu au monde rural."
  news_events_world.10.t_moderate_rainfall: "Des pluies modérées bénissent [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_moderate_rainfall: "Des pluies régulières et modérées sont tombées sur [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], humidifiant les sols sans provoquer d'inondations. Les agriculteurs se montrent optimistes quant à la récolte. Dans un État de quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants, de bonnes conditions agricoles promettent une meilleure offre alimentaire et un commerce rural plus prospère."
  news_events_world.10.t_tsunami: "Raz-de-marée sur [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_tsunami: "Une énorme vague a frappé la côte de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], balayant quais, maisons et villages côtiers. Les survivants cherchent leurs proches parmi les débris et les secours peinent à atteindre les zones coupées. Dans un État de quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants, le bilan pourrait être très lourd et la reconstruction durer des années."
  news_events_world.10.t_earthquake: "Tremblement de terre à [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_earthquake: "Un violent séisme a frappé [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], renversant bâtiments, ponts et cheminées. Les équipes de secours fouillent les décombres à la lumière des lampes tandis que les répliques ralentissent les recherches. Dans un État de quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants, même une zone de destruction limitée peut entraîner de lourdes pertes humaines et des années de reconstruction."
  news_events_world.10.t_calm_waters: "Des mers calmes favorisent les ports de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_calm_waters: "Des eaux exceptionnellement calmes sont signalées au large de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Les flottilles de pêche et le cabotage travaillent sans retard, et les ports chargent dans d'excellentes conditions. Pour quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants, une saison paisible en mer se traduit directement par de meilleures arrivées de poisson et de marchandises importées."
  news_events_world.10.t_fog: "Un épais brouillard aveugle [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_fog: "Un épais brouillard s'est installé sur [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], réduisant la visibilité sur les routes, les voies ferrées et les eaux. Les navires avancent lentement vers les ports et les trains circulent avec la plus grande prudence. Dans une région de quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants, un brouillard persistant retardera les livraisons et le commerce ordinaire."
  news_events_world.10.t_cyclone: "Un cyclone frappe [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_cyclone: "Un cyclone traverse [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], avec des vents destructeurs et des pluies diluviennes. Les communautés côtières signalent des toitures arrachées, des arbres déracinés et des communications coupées. Avec quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants sur la trajectoire de la tempête, les dégâts du vent et des inondations pourraient se compter pendant des mois."
  news_events_world.10.t_ice: "La glace paralyse [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_ice: "Un froid et une glace sévères se sont installés sur [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Routes et chemins de fer deviennent dangereux, les voies d'eau ralentissent et les cultures comme le bétail souffrent. Dans un État de quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants, l'interruption des transports pourrait coûter aussi cher que les pertes directes dans les champs."
  news_events_world.10.t_rough_waters: "Une mer démontée ferme les ports de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_rough_waters: "Une mer forte perturbe la côte de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Les pêcheurs restent au port, les navires marchands retardent leur départ et plusieurs bâtiments sont signalés en retard. Pour quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants du littoral, les interruptions répétées se répercutent vite sur les prix alimentaires, les assurances et les importations."
  news_events_world.10.t_strong_winds: "Des coups de vent persistants harcèlent [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_strong_winds: "Des vents forts et persistants balayent [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Les fermes exposées et les voies de transport subissent des dommages, tandis que les ports affrontent des conditions difficiles. Dans une région de quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants, ces perturbations commencent à se faire sentir sur les récoltes, les déplacements et les marchés."
  news_events_world.10.t_tropical_storm: "Une tempête tropicale fond sur [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_tropical_storm: "Une tempête tropicale a atteint [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], apportant fortes pluies, vents violents et mer dangereuse. Les autorités avertissent les communautés basses et les ports réduisent leur trafic. Pour quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants, même une tempête moins forte qu'un cyclone peut causer de vastes dégâts aux habitations, aux récoltes et au commerce côtier."
  news_events_world.10.t_fallback: "Conditions extraordinaires signalées à [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_fallback: "Un changement extraordinaire du temps affecte [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], en [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Les autorités rassemblent les rapports des fermes, des transports et des marchés afin de savoir s'il faut parler de calamité ou de bénédiction. Avec quelque [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitants dans l'État, même une modification temporaire des conditions de récolte peut avoir des conséquences bien au-delà des districts d'abord touchés."
  news_events_world.10.f: "DE LA RÉGION TOUCHÉE : Agriculteurs et responsables locaux décrivent des récoltes ruinées, des transports perturbés et des marchés inquiets. Les premiers rapports restent incomplets et l'ampleur réelle des pertes pourrait ne pas être connue avant plusieurs semaines."
  news_events_world.11.t: "Révolution en [ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.11.d: "Un soulèvement révolutionnaire a éclaté contre [ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFlag]. Les rebelles se sont organisés sous le nom de [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetNameNoFlag] et proclament un gouvernement [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetGovernment.GetName] à la place de l'ancien ordre. Des barricades s'élèvent dans les quartiers ouvriers et une partie de la garnison serait passée aux insurgés. L'agitation est devenue une lutte armée pour l'État lui-même. Les gouvernements voisins observent avec une inquiétude non dissimulée si le régime pourra survivre et quel exemple donnerait une victoire révolutionnaire."
  news_events_world.11.f: "DE NOTRE CORRESPONDANT : Les barricades apparaissent plus vite que les proclamations ne peuvent être imprimées. Des habitants décrivent des quartiers où l'autorité change d'une rue à l'autre et où la rumeur court plus vite que les ordres officiels."
  news_events_world.12.t: "Les révolutionnaires triomphent en [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.12.d: "Les révolutionnaires ont remporté la guerre civile en [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFlag], et l'appareil d'un grand État passe aux mains d'un gouvernement [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetGovernment.GetName] dirigé par [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetRuler.GetFullName]. La victoire se fera sentir bien au-delà des frontières, réjouissant ses amis et alarmant ses ennemis. Les capitales étrangères jugeront les vainqueurs d'après les lois qu'ils imposeront, les dettes qu'ils reconnaîtront et les traités qu'ils choisiront d'honorer. Les premiers mois du nouveau gouvernement régleront beaucoup de choses que les combats n'ont pas tranchées."
  news_events_world.12.f: "ANALYSE : La victoire donne aux révolutionnaires les ministères, mais pas automatiquement la bureaucratie, l'armée ou la confiance du public. Leurs premiers jours au pouvoir pourraient être aussi décisifs que les combats qui les y ont conduits."
  news_events_world.13.t: "L'achat de [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.13.d: "Par le [ROOT.Var('news_world_13_news_treaty_ref').GetTreaty.GetNameNoFormatting], [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetName] est passé de [ROOT.Var('news_world_13_news_state_giver_ref').GetCountry.GetNameNoFlag] à [ROOT.Var('news_world_13_news_state_taker_ref').GetCountry.GetNameNoFlag]. Le territoire transféré compte quelque [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetPopulationSize|D] habitants, ce qui dépasse un simple ajustement cartographique. Administration, propriété, accès militaire et statut des habitants doivent maintenant être réglés, tandis que les gouvernements voisins calculent les effets de la nouvelle frontière sur leur sécurité. Les résidents, eux, n'ont pas été consultés."
  news_events_world.13.f: "DE LA FRONTIÈRE : Les habitants attendent de savoir quelles lois, quels impôts et quels fonctionnaires suivront le nouveau drapeau. Pour ceux qui vivent sur la terre transférée, une signature dans une capitale lointaine constitue un changement immédiat de gouvernement."
  news_events_world.14.t: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFormatting] désigne [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFormatting] comme rival"
  news_events_world.14.d: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFlag] et [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFlag] ont déclaré leur rivalité. Deux États de première importance se placent en concurrence ouverte, et cette déclaration devrait durcir les alignements à travers le continent. Les ambassadeurs restent à leur poste, mais les courtoisies ordinaires sont devenues nettement plus froides. Désormais, tout différend entre eux, même minime, sera lu à travers cette hostilité, et des questions autrefois réglées discrètement seront disputées en public sous les yeux du monde."
  news_events_world.14.f: "SERVICE ÉTRANGER : Les diplomates s'attendent à ce que chaque futur différend entre les deux rivaux soit interprété à travers cette nouvelle hostilité, même pour des questions qui auraient pu hier être réglées discrètement."
  news_events_world.15.t: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFormatting] se rend aux forces [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetAdjectiveNoFormatting]"
  news_events_world.15.d: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFlag] a cessé d'exister comme État indépendant, son territoire restant ayant été absorbé par [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag] selon les conditions imposées par la [ROOT.Var('news_world_15_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]. Un gouvernement a été rayé du registre des nations, ses ministères dissous et ses représentants à l'étranger laissés sans pays à servir. [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag] porte désormais le fardeau de la terre conquise et de sa population, tandis que les voisins se demandent si cela règle la querelle ou prépare la prochaine."
  news_events_world.15.f: "DE L'ANCIENNE CAPITALE : Les enseignes gouvernementales sont retirées et les fonctionnaires décident s'ils serviront les nouvelles autorités. Un État peut disparaître des cartes plus vite que les loyautés locales."
  news_events_world.16.t: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetLastNameNoFormatting] accède au pouvoir en [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.16.d: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetFullName], âgé de [ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetAge] ans, a pris la tête de [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFlag] à la mort du précédent dirigeant. Le pays est gouverné comme [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetGovernment.GetName]. Comme cet État compte parmi les principales puissances, les diplomates évaluent déjà les amitiés, les convictions et la capacité du nouveau chef à consolider son autorité durant les débuts vulnérables du règne. La cour parle de continuité ; les ambassades en sont moins certaines."
  news_events_world.16.f: "SERVICE DU PALAIS : Les courtisans parlent publiquement de continuité, mais toute succession redistribue l'accès et l'influence. Les ambassadeurs étrangers étudient déjà ceux qui se tiennent au plus près du nouveau dirigeant."
  news_events_world.17.t: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFormatting] et [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFormatting] concluent une alliance"
  news_events_world.17.d: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFlag] et [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFlag] ont conclu le [ROOT.Var('news_world_17_news_treaty_ref').GetTreaty.GetNameNoFormatting], se liant par une alliance formelle. Les termes ont été publiés en partie, bien que l'on suppose généralement l'existence d'accords supplémentaires non présentés aux parlements. Les planificateurs militaires et les gouvernements rivaux examinent ces engagements avec la plus grande attention, car une alliance de ce poids peut bouleverser les calculs d'une future crise et transformer une querelle locale en guerre générale avant même que les signataires aient le temps de reconsidérer leur position."
  news_events_world.17.f: "ANALYSE MILITAIRE : Une alliance compte surtout avant le premier coup de feu. Les états-majors vont désormais refaire leurs plans en supposant qu'une guerre contre un signataire peut signifier la guerre contre les deux."
  news_events_world.18.t: "Le nouveau gouvernement de [ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.18.d: "[ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFlag] a promulgué [ROOT.Var('news_world_18_news_new_law_ref').GetLaw.GetName], un changement assez important pour modifier la structure même de l'État. Le pays est désormais gouverné comme [ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetGovernment.GetName]. Les capitales étrangères réévaluent leurs relations avec le nouvel ordre, tandis qu'à l'intérieur ses amis célèbrent et ses ennemis se préparent aux conséquences annoncées de longue date. Juristes et fonctionnaires s'occupent déjà des détails pratiques, car titres, ministères et procédures qui paraissaient permanents doivent être entièrement réécrits."
  news_events_world.18.f: "SERVICE CONSTITUTIONNEL : Juristes et fonctionnaires examinent les conséquences pratiques du nouvel ordre. Titres, ministères et anciennes procédures jadis réputés permanents peuvent désormais devoir être réécrits."
  news_events_world.19.t: "La situation tumultueuse à [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetNameNoFormatting] étouffe l'économie locale tandis que l'État sombre dans l'instabilité"
  news_events_world.19.d: "De graves troubles sont signalés dans tout [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetName], au sein de [ROOT.Var('news_world_19_news_source_country_ref').GetCountry.GetNameNoFlag], district de quelque [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetPopulationSize|D] habitants. Grèves, troubles et organisation du mécontentement ont atteint un niveau qui menace l'administration ordinaire. Les boutiques ferment tôt, les réunions publiques attirent des foules bien supérieures à ce qui était annoncé et la police a reçu des renforts des comtés voisins. Si l'agitation se poursuit, elle pourrait considérablement affaiblir le gouvernement et perturber le commerce du pays tout entier."
  news_events_world.19.f: "DANS LES RUES : Les commerçants ferment plus tôt et les réunions publiques attirent des foules inhabituelles. Les autorités assurent pouvoir rétablir l'ordre, mais les habitants disent que la tension est visible bien avant la première émeute."
  news_events_world.20.t: "Récession en [ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.20.d: "[ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFlag] a subi une contraction brutale de son commerce. Le produit national est tombé d'environ £[ROOT.Var('news_world_20_news_recession_previous_gdp_value').GetValue|D] à £[ROOT.Var('news_world_20_news_recession_current_gdp_value').GetValue|D], soit une baisse de [ROOT.Var('news_world_20_news_recession_drop_value').GetValue|%1] en un mois. Les carnets de commandes se vident, le crédit se resserre et les fabricants parlent d'une demande plus faible qu'ils n'en ont connu depuis des années. Les travailleurs craignent pour leurs salaires et leurs emplois, tandis que les marchés étrangers redoutent la propagation de la crise par le commerce et l'investissement."
  news_events_world.20.f: "MARCHÉS : Banquiers et industriels cherchent des signes d'un recul temporaire. Un analyste avertit que la confiance peut revenir vite, jusqu'à ce que licenciements et faillites transforment un mauvais mois en dépression durable."
  news_events_world.21.t: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFormatting] atteint un PIB d'un milliard"
  news_events_world.21.d: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFlag] est devenue la première nation au monde à dépasser mille millions de livres de produit annuel, le chiffre atteignant environ £[ROOT.Var('news_world_21_news_billion_gdp_value').GetValue|D] au moment du calcul. La concentration de manufactures, de commerce et de pouvoir d'achat qui s'y trouve fixe une référence à laquelle chaque rival doit désormais se mesurer. Les économistes discutent de ce que cet accomplissement signifie réellement, et il ne dit rien de la répartition des richesses, mais il annonce une échelle industrielle qu'aucun gouvernement ne peut plus ignorer."
  news_events_world.21.f: "SERVICE FINANCIER : Les économistes discutent déjà de la véritable signification de l'exploit. Il dit peu de choses sur la répartition de la richesse, mais révèle une échelle industrielle que les rivaux ne peuvent ignorer."
  news_events_world.22.t: "[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFormatting] proclame un nouvel accord international"
  news_events_world.22.d: "Un nouveau bloc s'est formé sous la direction de [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFlag] : [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName], rassemblé autour du principe [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetIdentity.GetName] et comptant [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers] États membres à sa fondation. Les autres gouvernements examinent sa charte et sa composition avec attention, car une telle association peut rediriger le commerce, les alliances et l'influence politique dans des régions entières. Sa durabilité ne sera connue que lorsqu'une crise imprévue mettra ses membres à l'épreuve."
  news_events_world.22.f: "ANALYSE DIPLOMATIQUE : Les nouveaux blocs affichent souvent leur unité avant d'être éprouvés par une véritable crise. Les chancelleries observeront leur premier désaccord plus attentivement que la cérémonie de fondation."
  news_events_world.23.t: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFormatting] fait défaut sur sa dette !"
  news_events_world.23.d: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFlag] a manqué à ses obligations. Au moment du défaut, le principal public s'élevait à environ £[ROOT.Var('news_world_23_news_default_principal_value').GetValue|D], pour une limite de crédit de £[ROOT.Var('news_world_23_news_default_credit_limit_value').GetValue|D]. Les créanciers subissent de lourdes pertes et les futurs emprunts de l'État coûteront plus cher, s'ils restent possibles. Banques et gouvernements étrangers surveillent la contagion, les troubles politiques et tout signe que le trésor ne puisse plus soutenir l'armée et l'administration sur lesquelles repose l'autorité du gouvernement."
  news_events_world.23.f: "SERVICE FINANCIER : Les détenteurs d'obligations évaluent autant la politique que les chiffres. Un accord négocié pourrait restaurer la confiance ; un défaut prolongé renchérira peut-être chaque emprunt futur bien après la crise."
  news_events_world.24.t: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFormatting] prend place parmi les grandes puissances"
  news_events_world.24.d: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFlag] est montée au premier rang des nations, son produit annuel atteignant environ £[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetGDP|D]. Cette promotion reflète une formidable accumulation de richesse, d'armes et d'influence et donne à l'État voix au chapitre dans les grandes questions diplomatiques du jour. Les puissances établies calculent déjà s'il faut courtiser le nouveau venu comme allié ou compter avec lui comme rival, tandis que celui-ci découvrira peut-être que la reconnaissance impose des devoirs aussi lourds que les privilèges qu'elle confère."
  news_events_world.24.f: "SERVICE ÉTRANGER : Invitations, protocole et calcul diplomatique changeront presque immédiatement. Le nouveau venu découvrira peut-être que la reconnaissance apporte non seulement de l'influence, mais aussi l'obligation de prendre parti dans des querelles autrefois lointaines."
  news_events_world.25.t: "Le déclin de [ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.25.d: "[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFlag] est tombée du premier rang des puissances, son produit annuel étant désormais estimé à environ £[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetGDP|D]. Le changement est plus que cérémoniel : il annonce une capacité réduite à imposer son attention et à façonner l'équilibre mondial. À l'intérieur, les ministres subissent la pression de restaurer la puissance et le prestige perdus ; à l'étranger, les anciens partenaires négocieront probablement avec davantage de fermeté."
  news_events_world.25.f: "ANALYSE : La perte de rang se fera sentir dans les salles de conférence avant d'apparaître sur les cartes. Les anciens partenaires pourront marchander plus durement, tandis que les rivaux testeront si le déclin est temporaire ou durable."
  news_events_world.26.t: "La direction de [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFormatting] contestée"
  news_events_world.26.d: "Une lutte pour la direction a commencé au sein de [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName], association de [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers] États membres. [ROOT.Var('news_world_26_news_bloc_contender_ref').GetCountry.GetNameNoFlag] a lancé un défi à [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFlag], le dirigeant actuel. Les responsables assurent que la coopération ordinaire se poursuit sans perturbation, mais les délégations comptent leurs soutiens avec un soin inhabituel. Une lutte prolongée pourrait diviser plusieurs gouvernements à la fois et inviter les puissances extérieures à profiter de la confusion."
  news_events_world.26.f: "AU SEIN DU BLOC : Les responsables assurent que la coopération se poursuit, mais les délégations comptent leurs soutiens avec un soin inhabituel. Une lutte de leadership sans armées peut tout de même diviser des alliés en camps rivaux."
  news_events_world.27.t: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFormatting] s'empare de la direction de l'alliance"
  news_events_world.27.d: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFlag] a vaincu [ROOT.Var('news_world_27_news_bloc_loser_ref').GetCountry.GetNameNoFlag] pour la direction de [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetName], association comptant [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetNumMembers] États membres. Les gouvernements de l'organisation se demandent si le changement les rapprochera ou suscitera la résistance de ceux qui soutenaient l'ancien dirigeant. Le concours est terminé, mais les loyautés qu'il a révélées ne le sont pas, et le nouveau chef hérite de collègues qui auraient clairement préféré une autre issue."
  news_events_world.27.f: "SERVICE DIPLOMATIQUE : Le concours est terminé, mais les loyautés ne le sont peut-être pas. Le nouveau chef hérite d'une organisation où certains gouvernements auraient préféré le vaincu."
  news_events_world.28.t: "[ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFormatting] et [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFormatting] se séparent"
  news_events_world.28.d: "Le [ROOT.Var('news_world_28_news_treaty_ref').GetTreaty.GetNameNoFormatting], qui liait [ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFlag] à [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFlag], a été dissous. La rupture supprime un engagement important et oblige les deux gouvernements à revoir leurs plans militaires et leur position dans toute crise future. Chaque capitale a publié une déclaration de regret formulée en termes qui ne convainquent personne. Leurs rivaux étudient déjà les possibilités offertes par la brèche, et la question est désormais de savoir où les anciens partenaires chercheront leur sécurité et qui remplacera la relation perdue."
  news_events_world.28.f: "SERVICE ÉTRANGER : Les diplomates jugent la rupture plus importante que l'annulation formelle. La question est maintenant de savoir où les deux anciens partenaires chercheront leur sécurité et qui se proposera pour remplacer cette relation."
  news_events_world.29.t: "PANIQUE ! Pénurie mondiale de [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] !"
  news_events_world.29.d: "Une grave pénurie de [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] s'est emparée du marché mondial, et les prix ont dépassé de loin ce que le commerce considère comme normal. La demande s'établit à environ [ROOT.Var('news_world_29_news_shortage_imports_value').GetValue|D] pour seulement [ROOT.Var('news_world_29_news_shortage_exports_value').GetValue|D] offerts à la vente, soit une pression de [ROOT.Var('news_world_29_news_shortage_pressure_value').GetValue|2] contre un. Industriels, négociants et gouvernements se disputent les stocks restants, et la hausse des coûts se propage à toutes les industries dépendantes de cet article."
  news_events_world.29.f: "MARCHÉS : Les acheteurs rapportent que les contrats sont réécrits d'heure en heure. Un courtier décrit la ruée vers [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] comme un marché où avoir de l'argent ne garantit plus l'approvisionnement."
  news_events_world.30.t: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] et [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] redessinent la carte"
  news_events_world.30.d_exchange: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] et [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] ont conclu un échange de territoires. [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting], où vivent quelque [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D] personnes, passe de [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] à [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting], tandis que [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting], peuplé d'environ [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D] habitants, suit le chemin inverse. Les frontières ont été redessinées par accord plutôt que par guerre, et les habitants des deux provinces se réveillent sujets d'un autre gouvernement."
  news_events_world.30.d_a_to_b: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] a accepté de céder [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting] à [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]. Le territoire compte environ [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D] habitants, qui n'ont pas été consultés. Administration, fiscalité et sécurité doivent être réorganisées sous le nouveau souverain, tandis que les questions de propriété, de langue et de fonctions locales occuperont les juristes pendant des années. Les gouvernements voisins étudient cette modification de frontière obtenue par négociation plutôt que par la force."
  news_events_world.30.d_b_to_a: "[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] a accepté de céder [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting] à [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]. Le territoire compte environ [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D] habitants, qui n'ont pas été consultés. Administration, fiscalité et sécurité doivent être réorganisées sous le nouveau souverain, tandis que les questions de propriété, de langue et de fonctions locales occuperont les juristes pendant des années. Les gouvernements voisins étudient cette modification de frontière obtenue par négociation plutôt que par la force."
  news_events_world.30.f: "DE LA FRONTIÈRE : Les géomètres peuvent déplacer la ligne en quelques jours, mais les habitants en subiront les conséquences pendant des années. Négociants, propriétaires et responsables locaux demandent déjà quelles règles survivront au transfert."
  news_events_world.31.t: "GRÈVE ! Les travailleurs s'unissent en [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] !"
  news_events_world.31.d_nationwide: "Une vague de grèves traverse [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] de part en part. Le travail s'est arrêté dans les manufactures et les travaux publics tandis que le mouvement ouvrier organisé adresse ses revendications aux patrons comme aux ministres. L'arrêt est désormais assez vaste pour toucher la production du pays tout entier, et les journaux de tous les partis ne s'accordent que sur sa gravité. On craint qu'une confrontation prolongée n'alimente le radicalisme et n'oblige le gouvernement à choisir entre concession et répression, deux options coûteuses."
  news_events_world.31.d_mining: "Une grande grève de mineurs a éclaté en [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], avec [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] au cœur du mouvement. Les hommes ont quitté les puits dans un climat amer, menaçant l'approvisionnement de l'industrie en charbon et en métal au moment où la demande est la plus forte. Patrons et ministres sont pressés de régler le conflit avant que la pénurie ne gagne les usines et les chemins de fer. Dans les bassins miniers, des comités ouvriers maintiennent eux-mêmes l'ordre, ce qui inquiète les autorités autant que le désordre."
  news_events_world.31.d_industrial: "Les ouvriers d'usine ont débrayé en [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], et [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] figure parmi les principaux centres de la grève. La production est interrompue tandis que ouvriers et machinistes réclament de meilleurs salaires et horaires. Les patrons avertissent que les commandes seront perdues et les contrats partiront à l'étranger ; les syndicalistes répondent que l'arrêt prouve précisément ce qu'ils répètent depuis longtemps : le pays repose sur le travail de ceux qui sont le moins consultés sur sa conduite."
  news_events_world.31.d_railway: "Les cheminots sont en grève en [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], avec [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] au centre de la perturbation. Un long arrêt menace bien plus que les lignes elles-mêmes : les usines dépendent des trains pour le combustible et les matériaux, les villes pour leur nourriture et l'armée pour ses mouvements. Des marchandises périssables pourrissent déjà dans les voies de garage. Les ministres sont pressés de rétablir le service ou de parvenir à un accord avant que la paralysie ne s'étende."
  news_events_world.31.d_movement: "Les travailleurs de [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] ont lancé une grève clairement politique en [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]. L'arrêt appartient à un mouvement plus large plutôt qu'à un grief particulier d'atelier et transporte les conflits de l'usine directement dans la politique nationale. Les patrons craignent que l'exemple ne se propage ; les organisateurs espèrent que la perturbation obligera le gouvernement à les traiter comme une force politique plutôt que comme un simple trouble à réprimer."
  news_events_world.31.d: "Une grève importante a éclaté en [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], attirant l'attention du pays sur les salaires, les horaires et la condition ouvrière. La perturbation est assez grave pour alarmer ministres et industriels, qui craignent qu'un long arrêt ne réduise la production et n'encourage l'imitation ailleurs. Des souscriptions sont levées dans plusieurs villes pour les familles des grévistes. La réponse du gouvernement déterminera peut-être si le conflit se termine par la négociation, la répression ou une vague d'agitation plus large."
  news_events_world.31.f: "DU PIQUET DE GRÈVE : Les organisateurs assurent que l'arrêt continuera jusqu'à l'obtention de concessions réelles, tandis que les patrons avertissent que chaque poste inoccupé augmente les coûts et encourage les travailleurs d'ailleurs à les rejoindre."

  ## Reader responses, one per story.
  news_events_world.1.a: "Espérons que les esprits les plus sages l'emportent."
