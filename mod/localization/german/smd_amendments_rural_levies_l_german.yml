 smd_amendment_rural_levies:0 "Ländliche Abgaben"
 smd_amendment_rural_levies_desc:0 "Zusätzlich zur Agrarsteuer erheben Gemeinde- und Dorfverwaltungen Gebühren, Getreidequoten und Arbeitsdienste von bäuerlichen Haushalten, um örtliche Schulen, Straßen und Beamte zu bezahlen. Die Last trifft die ärmsten Bauern am härtesten."
 smd_amendment_rural_levies_modifier:0 "Ländliche Abgaben"
 smd_amendment_rural_levies_modifier_desc:0 "Gemeindegebühren und Arbeitsdienste bringen Geld vom Land ein, kosten aber das Wohlwollen der Bauern."
