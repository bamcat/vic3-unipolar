 news.2.t:0 "REVOLUTION IN RUSSLAND"
 news.2.d:0 "[ROOT.Var('news_test_2_news_attacker_ref').GetCountry.GetNameNoFlag] hat [ROOT.Var('news_test_2_news_defender_ref').GetCountry.GetNameNoFlag] formell den Krieg erklärt. Entlang der Grenze werden Truppen mobilisiert, und die Kanzleien der Großmächte beobachten die Lage mit großer Sorge. Diplomaten wurden zurückgerufen und die Börsen in Aufruhr versetzt. Unsere Korrespondenten sind auf dem Weg zum Kriegsschauplatz; weitere Einzelheiten werden mit der Abendpost erwartet. Diplomaten wurden zurückgerufen und die Börsen in Aufruhr versetzt. Unsere Korrespondenten sind auf dem Weg zum Kriegsschauplatz; weitere Einzelheiten werden mit der Abendpost erwartet. Diplomaten wurden zurückgerufen und die Börsen in Aufruhr versetzt. Unsere Korrespondenten sind auf dem Weg zum Kriegsschauplatz; weitere Einzelheiten werden mit der Abendpost erwartet."
 news.2.f:0 "Die Kanonen sprechen, wo die Diplomatie versagt hat."
 news.2.a:0 "Wahrlich ernste Nachrichten."
