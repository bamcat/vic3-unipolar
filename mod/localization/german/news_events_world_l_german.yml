  news_events_world.31.a: "Der Arbeiter hat sich Gehör verschafft."
  news_events_world.32.t: "Die [ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting] geben nach!"
  news_events_world.32.d: "[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetNameNoFormatting] ist in seiner diplomatischen Auseinandersetzung mit [ROOT.Var('news_world_32_news_backdown_target_ref').GetCountry.GetNameNoFormatting] zurückgewichen und hat der Hauptforderung nachgegeben, statt den Streit zum Krieg zu führen. Was als Prüfung nationaler Entschlossenheit dargestellt worden war, endete am Konferenztisch, und ausländische Kanzleien wägen bereits ab, was der Rückzug für das [ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting] Ansehen bedeutet."
  news_events_world.32.f: "DIPLOMATISCHE REDAKTION: Telegramme aus den Hauptstädten melden unmittelbare Erleichterung darüber, dass ein Krieg vermieden wurde. Zu Hause fragen Gegner der Regierung jedoch bereits, ob der Frieden zu teuer erkauft wurde."
  news_events_world.32.a: "So endet die Krise."

  news_events_world.1.t2: "Europa hält den Atem an, während [ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFormatting] [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFormatting] gegenübersteht"
  news_events_world.1.t3: "Die Mächte spalten sich: [ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFormatting] gegen [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.2.t2: "Ultimatum Überreicht: [ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFormatting] Konfrontiert [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.2.t3: "Der Streit zwischen [ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFormatting] und [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFormatting] Verschärft sich"
  news_events_world.3.t2: "Die Geschütze Sprechen: [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFormatting] und [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFormatting] im Krieg"
  news_events_world.3.t3: "[ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFormatting] und [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFormatting] Geraten aneinander"
  news_events_world.4.t2: "Die Armeen von [ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFormatting] Überschreiten die Grenze nach [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.4.t3: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFormatting] Fällt über [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFormatting] her"
  news_events_world.5.t2: "Die Armee Ergreift die Macht in [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.5.t3: "Regierung in [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFormatting] Gestürzt"
  news_events_world.6.t2: "Attentäter Streckt den/die [ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] von [ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFormatting] Nieder"
  news_events_world.6.t3: "Ein Niederträchtiger Mord: [ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] in [ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFormatting] Ermordet"
  news_events_world.7.t2: "Der Tod von [ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullNameNoFormatting]; [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFormatting] Trauert"
