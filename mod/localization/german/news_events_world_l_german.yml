l_german:
  news_events_world.1.t: "[ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFormatting] und [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFormatting] am Rande des Krieges!"
  news_events_world.1.d: "Die [ROOT.Var('news_world_1_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] hat [ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFlag] und [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFlag] in eine offene Konfrontation geführt. Zwei der bedeutendsten Mächte des Zeitalters stehen sich nun in einem förmlichen Streit gegenüber, und die Kanzleien Europas sind in eine Geschäftigkeit geraten, wie man sie seit Jahren nicht gesehen hat. Kuriere verkehren zu jeder Stunde zwischen den Hauptstädten, die Börsen sind nervös und in den Offiziersklubs spricht man von kaum etwas anderem. Ob der Streit durch Verhandlungen beigelegt wird oder zum Krieg verhärtet, hängt von den Forderungen der kommenden Wochen, den Truppenbewegungen an die Grenze und davon ab, welche Regierungen sich im entscheidenden Augenblick auf welche Seite stellen."
  news_events_world.1.f: "DIPLOMATISCHE REDAKTION: Gesandte beider Seiten sollen bis weit nach Mitternacht arbeiten. Ein ausländischer Beobachter beschrieb die Stimmung als öffentlich höflich und privat unmissverständlich feindselig."
  news_events_world.2.t: "KRISE! Zwischen [ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFormatting] und [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.2.d: "[ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFlag] hat sein ganzes Gewicht in die [ROOT.Var('news_world_2_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] gegen [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFlag] geworfen. Eine Macht ersten Ranges hat sich in einen Streit eingemischt, der sonst womöglich eine regionale Angelegenheit geblieben wäre, und ihr Eintritt verändert den Charakter der Krise grundlegend. Aus einer Nachbarschaftsfehde ist eine Frage für das gesamte Konzert der Nationen geworden. Außenministerien prüfen die gestellten Forderungen und neue Verpflichtungen mit größter Aufmerksamkeit, während die kleineren Regierungen der Region still abwägen, welche Seite sie sich am wenigsten leisten können zu verärgern."
  news_events_world.2.f: "ANALYSE: Was als regionaler Streit begann, beschäftigt nun jedes größere Außenministerium; kleinere Regierungen entscheiden still, welche Seite sie sich eher leisten können zu verprellen."
  news_events_world.3.t: "KRIEG! Zwischen [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFormatting] und [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFormatting]!"
  news_events_world.3.d: "Die [ROOT.Var('news_world_3_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] ist über die Diplomatie hinaus in einen offenen Krieg zwischen [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFlag] und [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFlag] übergegangen. Botschafter wurden zurückgerufen, Reservisten zu ihren Depots beordert und die Börsen in Unruhe versetzt. Seit Tagesanbruch melden die Rekrutierungsstellen Andrang, und die Eisenbahngesellschaften haben ihr rollendes Material den Kriegsministerien zur Verfügung gestellt. Händler fragen bereits, welche Häfen und Routen offen bleiben und zu welchen Versicherungsprämien, während Regierungen auf dem ganzen Kontinent prüfen, welche Pflichten ihre Verträge ihnen nun auferlegen könnten."
  news_events_world.3.f: "VON DER FRONT: Fahrpläne weichen Truppentransporten, während Reservisten, Munition und Pferde in Richtung Kampfgebiet gehen. Händler fragen bereits, welche Häfen und Routen noch sicher sind."
  news_events_world.4.t: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFormatting] beginnt Invasion von [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.4.d: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFlag] ist in der [ROOT.Var('news_world_4_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] gegen [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFlag] ins Feld gezogen. Das Missverhältnis zwischen den beiden Kriegführenden ist jedem Beobachter deutlich, und in manchen Hauptstädten ist bereits von einem schnellen und billigen Ende die Rede. Andere mahnen zur Vorsicht. Unsere Militärkorrespondenten erinnern daran, wie oft Entfernung, schwieriges Gelände, Krankheit und das stille Eingreifen Dritter eine auf dem Papier überlegene Streitmacht gedemütigt haben, und wie selten ein mit selbstsicheren Prognosen begonnener Feldzug in der versprochenen Jahreszeit endete."
  news_events_world.4.f: "MILITÄRREDAKTION: Das Kräfteverhältnis mag auf dem Papier eindeutig sein, doch Entfernung, Gelände und ausländische Einmischung haben schon viele vermeintlich leichte Feldzüge ruiniert."
  news_events_world.5.t: "Staatsstreich in [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.5.d: "Die politische Ordnung von [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFlag] ist mit Gewalt gestürzt worden. Die Macht liegt nun bei [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetRuler.GetFullName], und der Staat soll als [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetGovernment.GetName] regiert werden. Ministerien, Telegraphenämter und die wichtigsten Bahnhöfe wurden noch vor Tagesanbruch gesichert. Ob die Armee den neuen Herren in den Provinzen ebenso bereitwillig folgt wie in der Hauptstadt, ob bestehende Gesetze und ausländische Verträge geehrt werden und ob die verdrängten Parteien sich fügen oder ins Land gehen, vermag in der Hauptstadt noch niemand mit Sicherheit zu sagen."
  news_events_world.5.f: "EXKLUSIV AUS DER HAUPTSTADT: Einwohner berichten von Soldaten an Ministerien, Bahnhöfen und Telegraphenämtern. Am Morgen, sagte uns ein Beamter, hätten sich die Uniformen geändert, doch niemand habe sagen können, wessen Befehlen sie folgten."
  news_events_world.6.t: "[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] von [ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFormatting] ermordet"
  news_events_world.6.d: "[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_6_character_ref').GetCharacter.GetFullName], [ROOT.Var('news_world_6_character_ref').GetCharacter.GetAge] Jahre alt, ist während der Herrschaft über [ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFlag] einem Attentäter zum Opfer gefallen. Die Ermordung eines Staatsoberhaupts hat sofortigen Schock ausgelöst; Minister sichern Hauptstadt, Garnison und Staatskasse und versuchen wenigstens den Anschein von Kontinuität zu wahren. Ausländische Regierungen verlangen Zusicherungen, dass Verträge und militärische Befehlswege unberührt bleiben. Die Suche nach der Verschwörung hinter der Tat hat erst begonnen, und jede politische Gruppe hat ein Interesse daran, wem die Schuld zugeschrieben wird."
  news_events_world.6.f: "SICHERHEITSREDAKTION: Ermittler suchen nach Mitverschwörern, während Minister beweisen wollen, dass der Staat unter Kontrolle bleibt. Offen ist, ob der Attentäter allein handelte oder für eine Fraktion, die auf ihren nächsten Schritt wartet."
  news_events_world.7.t: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullNameNoFormatting] ist tot; [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFormatting] trauert"
  news_events_world.7.d: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullName] ist im Alter von [ROOT.Var('news_world_7_character_ref').GetCharacter.GetAge] Jahren während der Herrschaft über [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFlag] gestorben. Schwarzer Stoff hängt an öffentlichen Gebäuden, und die Geschäfte der Hauptstadt haben ihre Läden geschlossen. Die Nachfolge folgt nun dem durch Brauch und Gesetz vorgesehenen Verfahren, während die Minister mit einer Stimme von Kontinuität sprechen. Doch im Ausland stellt jede Kanzlei dieselbe Frage: ob der Wechsel Bündnisse, Politik oder das Gleichgewicht der Fraktionen verändern wird, die seit Langem den Thron umgeben."
  news_events_world.7.f: "AUS DER HAUPTSTADT: Menschenmengen warten auf Nachrichten über die Nachfolge, während öffentliche Gebäude Trauerflor tragen. Hinter den Zeremonien ringen Minister bereits darum, die Bedeutung der nächsten Herrschaft zu bestimmen."
  news_events_world.8.t: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetLastNameNoFormatting] in [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFormatting] gestürzt"
  news_events_world.8.d: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetFullName] ist in [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFlag] noch zu Lebzeiten aus der Macht entfernt worden, und [ROOT.Var('news_world_8_new_ruler_ref').GetCharacter.GetFullName] hat die Staatsführung übernommen. Das Land wird als [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetGovernment.GetName] regiert. Ein lebender Herrscher, der ohne Wahl, Tod oder gewöhnliche Nachfolge beiseitegeschoben wird, lässt sich selten einfach erklären, und der amtliche Bericht überzeugt nur wenige. Diplomaten beobachten Ministerernennungen und Garnisonsbewegungen auf der Suche nach Hinweisen darauf, was hinter verschlossenen Türen geschah und ob die neue Regierung auf Zustimmung oder auf Bajonetten ruht."
  news_events_world.8.f: "POLITISCHE ANALYSE: Ein lebender Herrscher, der ohne Wahl, Tod oder gewöhnliche Nachfolge entfernt wird, hinterlässt selten eine einfache Erklärung."
  news_events_world.9.t_presidential: "[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting] gewinnt die [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting] Präsidentschaftswahl"
  news_events_world.9.d_presidential: "Die [ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting] hat die Wahl in [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag] gewonnen, und [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName] übernimmt das Präsidentenamt. Die Kandidaten der Partei erhielten [ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetCurrentVotingPowerShare|%1] der abgegebenen Stimmen. In manchen Kreisen wird gefeiert, in anderen herrscht offene Bestürzung, und die unterlegenen Kräfte bestreiten bereits in mehreren Bezirken den Ablauf der Wahl. Ausländische Regierungen prüfen das Ergebnis auf seine Bedeutung für Diplomatie, Handel, Militärpolitik und die allgemeine Richtung einer der führenden Mächte der Zeit."
  news_events_world.9.t_party: "[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting] triumphiert bei den [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting] Wahlen"
  news_events_world.9.d_party: "Die [ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting] ist am Ende des Wahlkampfs in [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag] als stärkste Kraft hervorgegangen; ihre Kandidaten erhielten [ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetCurrentVotingPowerShare|%1] der Stimmen. In den großen Städten wurde bis weit nach Mitternacht gezählt, und in mehr als einem Wahlkreis wird das Ergebnis angefochten. Regierungen, Investoren und politische Bewegungen im Ausland wägen nun ab, was das neue Kräfteverhältnis der Parteien für Innen- und Außenpolitik bedeutet und ob die daraus entstehende Regierung auf Dauer über eine arbeitsfähige Mehrheit verfügen wird."
  news_events_world.9.t_government: "[ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting] führt die Regierung von [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.9.d_government: "Die [ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting] ist nach der Wahl die führende Regierungspartei in [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag] und erhielt [ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetCurrentVotingPowerShare|%1] der Stimmen. Wo die Krone über dem Parteienkampf steht, kann eine Wahl das gesamte Machtgefüge darunter verändern, ohne das Staatsoberhaupt zu berühren. Ausländische Regierungen und Geschäftsleute beobachten das neue Kabinett genau, denn seine Zusammensetzung ist häufig ein besserer Hinweis auf die Absichten eines Landes als jede Thronrede."
  news_events_world.9.t: "Die Wahl in [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting] ist beendet"
  news_events_world.9.d: "Eine Wahl ist in [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag] beendet worden, einem Land, dessen Gewicht in der Welt das Ergebnis zu einem internationalen Ereignis statt nur zu einem inneren Wettbewerb macht. Die Resultate wurden binnen Stunden in alle europäischen Hauptstädte telegraphiert. Regierungen und politische Bewegungen im Ausland studieren das Kräfteverhältnis der Parteien und die Stellung von [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName], dessen Regierung noch Diplomatie, Handel, Flotten, Armeen und die allgemeine Stimmung des Zeitalters beeinflussen kann. Zu Hause beginnt nun ernsthaft die Bildung einer Regierung."
  news_events_world.9.f: "WAHLREDAKTION: In den Parteizentralen wird gleichermaßen gefeiert, gestritten und nachgezählt. Im Ausland gilt das Ergebnis als Hinweis auf die nächste diplomatische und wirtschaftliche Richtung des Landes."
  news_events_world.10.t_drought: "Dürre erfasst [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_drought: "In [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] ist der Regen ausgeblieben; rund [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Menschen hängen dort von der Ernte ab. Die Felder sind ausgedörrt, die Speicher sinken Woche für Woche und Bauern bestellen weniger Land. Viehhalter treiben ihre Tiere immer weiter auf der Suche nach Wasser, Getreidehändler erhöhen bereits ihre Preise und in den Marktstädten bilden sich Hilfskomitees. Hält die Trockenheit an, kann aus einem schlechten Jahr eine schwere Notlage werden, die zuerst die Ärmsten trifft."
  news_events_world.10.t_flood: "Große Flut in [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]; viele Vermisste befürchtet"
  news_events_world.10.d_flood: "Die Flüsse in [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] sind über die Ufer getreten und haben Höfe, Straßen und ganze Ortschaften in einem Gebiet mit rund [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Einwohnern überschwemmt. Brücken und Bahndämme werden auf Schäden geprüft, während Rettungsmannschaften abgeschnittene Gemeinden zu erreichen versuchen. Viehverluste sind schwer, Vorräte vieler Familien vernichtet. Die Folgen für Ernte und Verkehr werden noch lange nach dem Rückgang des Wassers auf den Märkten zu spüren sein."
  news_events_world.10.t_frost: "Bitterer Frost vernichtet die Ernte in [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_frost: "Außergewöhnlicher Frost liegt über [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Bauern melden geschwärzte Felder und zerstörte Obstgärten, nachdem die Kälte bereits weit entwickelte Pflanzen getroffen hat. In einem Gebiet mit etwa [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Menschen ist der Verlust einer einzigen Ernte keine Kleinigkeit. Händler rechnen noch vor Monatsende mit Knappheit in den am stärksten betroffenen Gemeinden, während die Bauern hoffen, durch spätere Aussaat noch einen Teil retten zu können."
  news_events_world.10.t_wildfire: "Waldbrände in [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] erzwingen Evakuierungen"
  news_events_world.10.d_wildfire: "Feuer breitet sich durch [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] aus, vertreibt Familien und bedroht Höfe, Wälder und Verkehrswege. Rauch verdunkelt ganze Bezirke, und zur Mittagszeit wird von einer roten Sonne berichtet. Die Behörden legen Brandschneisen an und rufen vielerorts die Miliz zu Hilfe. Bei rund [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Einwohnern können die Verluste an Besitz, Weideland und Holz die Region noch lange nach dem Erlöschen der letzten Flammen belasten."
  news_events_world.10.t_hailstorm: "Hagelsturm vernichtet die Ernte in [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_hailstorm: "Ein heftiger Hagelsturm ist über [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] hinweggezogen und hat stehendes Getreide zerfetzt sowie Dächer, Glas und ungeschütztes Vieh getroffen. Felder, die vor Stunden noch erntereif schienen, liegen flach. In einem Staat mit etwa [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Einwohnern schlägt selbst örtliche Zerstörung rasch auf Brotpreise und bäuerliche Einkommen durch. Versicherer erhalten bereits Schadensmeldungen, während Gemeinden die Verluste der Unversicherten zählen."
  news_events_world.10.t_locust_swarm: "Heuschrecken fallen über [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] her"
  news_events_world.10.d_locust_swarm: "Dichte Heuschreckenschwärme sind über [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] niedergegangen und fressen die Felder schneller kahl, als die Gemeinden sie verteidigen können. Speicher werden Tag und Nacht bewacht, während Bauern die Tiere mit Feuer, Rauch und Schlägen vertreiben. Die Schwärme sollen den Himmel verdunkeln. Bei rund [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Menschen in den betroffenen Bezirken fürchten die Behörden, dass der Hunger den Insekten unmittelbar folgen wird, sollte sich die Plage halten oder ausbreiten."
  news_events_world.10.t_heatwave: "Drückende Hitze über [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_heatwave: "Eine unerbittliche Hitzewelle hat [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] erfasst. Brunnen sinken, Vieh verendet auf den Feldern und die Pflanzen welken unter einer Sonne ohne Nachsicht. In den Städten werden Todesfälle unter Alten und kleinen Kindern gemeldet, Wasserwagen arbeiten von morgens bis abends. In einem Staat mit etwa [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Menschen beobachten die Behörden die Volksgesundheit ebenso besorgt wie die Ernte, denn anhaltende Hitze belastet Nahrung, Wasser und Verkehr zugleich."
  news_events_world.10.t_disease_outbreak: "Seuche breitet sich in [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] aus"
  news_events_world.10.d_disease_outbreak: "Eine Krankheit breitet sich durch Felder und Herden von [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] aus. Inspektoren versuchen, betroffene Flächen und Tiere zu bestimmen, bevor die Ansteckung den nächsten Bezirk erreicht. Quarantäne und Schlachtung könnten die größere Ernte retten, bedeuten aber unmittelbaren Ruin für betroffene Bauern. In einem Staat mit rund [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Einwohnern werden die Folgen nicht nur die Erzeuger, sondern jeden Haushalt treffen, der auf dem Markt einkauft."
  news_events_world.10.t_extreme_winds: "Sturm zieht eine Spur der Verwüstung durch [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_extreme_winds: "Extreme Winde haben [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] getroffen und Dächer, Bäume, Telegraphendrähte und stehende Feldfrüchte beschädigt. Straßen- und Bahnverkehr stocken, während Trupps Trümmer räumen; mehrere Gemeinden sind ganz von der Kommunikation abgeschnitten. In einem Staat mit rund [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Menschen dürfte der größte Schaden nicht aus einer einzigen Katastrophe, sondern aus dem gleichzeitigen Ausfall von Verkehr und Ernte entstehen."
  news_events_world.10.t_torrential_rains: "Sturzregen ertränken die Felder von [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_torrential_rains: "Über [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] regnet es ohne Unterlass, die Böden sind gesättigt und tiefliegende Straßen sowie Flussufer überschwemmt. Bauern fürchten, stehendes Wasser werde die Ernte im Boden verfaulen lassen, selbst wo Dörfer trocken bleiben. Händler beobachten Bahn- und Marktstraßen mit wachsender Sorge. In einem Gebiet mit rund [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Einwohnern kann eine nasse Erntezeit ebenso teuer werden wie jeder Sturm."
  news_events_world.10.t_pollinator_surge: "Bemerkenswerte Saison für die Obstgärten von [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_pollinator_surge: "Bauern in [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] berichten von einer ungewöhnlichen Fülle an Bienen und anderen Bestäubern. Obstgärten und blühende Feldfrüchte setzen Früchte in einem Maß an, an das sich kaum jemand erinnern kann. Hält das Wetter, wird eine reiche Ernte erwartet. In einem Staat mit etwa [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Menschen würde eine starke Saison Lebensmittelpreise senken und ländliche Einkommen weit über die betroffenen Höfe hinaus anheben."
  news_events_world.10.t_optimal_sunlight: "Eine goldene Saison in [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_optimal_sunlight: "Außergewöhnlich günstiger Sonnenschein herrscht in [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Getreide und Früchte reifen gut, und die Bauern sprechen von einer überdurchschnittlichen Ernte, wenn das Wetter hält. Händler bereiten sich bereits auf stärkeren Ernteverkehr vor. In einem Gebiet mit rund [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Einwohnern macht sich eine volle Ernte auf jedem Markt und in jedem Haushalt bemerkbar; die Bauern mahnen nur, dass der Himmel noch einige Wochen so bleiben muss."
  news_events_world.10.t_moderate_rainfall: "Gütige Regenfälle segnen [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_moderate_rainfall: "Gleichmäßiger, mäßiger Regen ist zur günstigsten Zeit der Wachstumsperiode nach [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] gekommen. Die Felder erhalten Wasser ohne die Schäden schwerer Unwetter, und selbst die alten Bauern zeigen sich zufrieden. In einem Staat mit etwa [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Menschen hat die Aussicht auf einen hohen Ertrag die Getreidemärkte bereits beruhigt. Händler schaffen Platz für mehr Korn und Erzeugnisse als noch vor kurzem erwartet."
  news_events_world.10.t_tsunami: "Große Welle verwüstet die Küste von [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_tsunami: "Eine gewaltige Welle hat die Küste von [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] getroffen und Häfen sowie tiefliegende Siedlungen verwüstet. Nachrichten von der Küste bleiben lückenhaft, während Rettungsmannschaften die Trümmer durchsuchen und mehrere Schiffe mit Mann und Maus vermisst werden. Bei etwa [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Einwohnern im betroffenen Staat lässt sich die Zahl der Opfer noch nicht bestimmen, und der Küstenhandel wird wohl lange nach den Rettungsarbeiten gestört bleiben."
  news_events_world.10.t_earthquake: "Erdbeben legt Städte in [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] in Trümmer"
  news_events_world.10.d_earthquake: "Ein starkes Erdbeben hat [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] erschüttert, Gebäude zum Einsturz gebracht und Straßen, Bahnen und Wasserleitungen zerstört. Rettungsmannschaften graben bei Lampenlicht, während Nachbeben die Suche behindern und Überlebende ins Freie treiben. Ganze Bezirke sollen in Trümmern liegen. In einem Staat mit rund [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Einwohnern kann selbst ein begrenztes Zerstörungsgebiet viele Menschenleben und jahrelangen Wiederaufbau kosten."
  news_events_world.10.t_calm_waters: "Ruhige See begünstigt die Häfen von [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_calm_waters: "Außergewöhnlich ruhiges Wasser wird an der Küste von [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] gemeldet. Fischereiflotten und Küstenschifffahrt arbeiten mit wenigen Verzögerungen, und die Häfen schlagen Waren unter besten Bedingungen um. Hält dies an, erwarten Händler weniger Verluste auf See und niedrigere Versicherungsprämien. In einem Küstenstaat mit etwa [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Menschen wirkt sich eine ruhige Saison unmittelbar auf Preise und Versorgung mit Fisch und Importwaren aus."
  news_events_world.10.t_fog: "Dichter Nebel legt [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] lahm"
  news_events_world.10.d_fog: "Dichter Nebel liegt über [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] und nimmt Straßen, Bahnen und Gewässern gleichermaßen die Sicht. Schiffe tasten sich in die Häfen, Züge verkehren mit äußerster Vorsicht. Die unmittelbare Gefahr sind Zusammenstöße; mehrere kleinere Unfälle werden bereits gemeldet. In einem Gebiet mit rund [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Einwohnern wird anhaltender Nebel jede Lieferung verzögern und den normalen Handel der Städte stören."
  news_events_world.10.t_cyclone: "Zyklon trifft [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_cyclone: "Ein Zyklon zieht mit zerstörerischem Wind und sintflutartigem Regen durch [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Küstengemeinden melden abgedeckte Häuser, entwurzelte Bäume und unterbrochene Verbindungen, während die Behörden Notunterkünfte schaffen. Bei etwa [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Menschen im Pfad des Sturms weckt die Verbindung aus Flut und Wind Furcht vor einer Katastrophe, deren Folgen in Monaten statt Wochen gemessen werden."
  news_events_world.10.t_ice: "Strenges Eis hält [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] gefangen"
  news_events_world.10.d_ice: "Strenges Eis hat [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] erfasst. Straßen und Bahnen werden gefährlich, Wasserwege verlangsamen sich oder stehen ganz still, Pflanzen und Vieh leiden bitter unter der Kälte. Kohle lässt sich gerade dann schlecht bewegen, wenn sie am dringendsten gebraucht wird. Händler warnen, dass in einem Staat mit etwa [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Menschen der Verkehrsausfall ebenso teuer werden kann wie die direkten Feldverluste."
  news_events_world.10.t_rough_waters: "Raue See schließt die Häfen von [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_rough_waters: "Raue See stört die Küste von [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Fischerboote bleiben im Hafen, Handelsschiffe verschieben ihre Abfahrt und die Hafenbehörden warnen vor gefährlichen Zufahrten; mehrere Schiffe sind überfällig. In einem Küstenstaat mit rund [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Einwohnern zeigt sich wiederholte Unterbrechung auf See rasch bei Lebensmittelpreisen, Versicherungen und der Versorgung mit Importwaren."
  news_events_world.10.t_strong_winds: "Anhaltende Stürme peitschen [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_strong_winds: "Anhaltend starke Winde fegen über [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Offene Höfe und Verkehrswege nehmen Schaden, Seeleute und Hafenbeamte kämpfen mit schwierigen Bedingungen entlang der ganzen Küste. Die Stürme sind nicht überall zerstörerisch, doch ihre Dauer behindert Erntearbeit, Reisen und den regelmäßigen Warenverkehr. In einem Gebiet mit rund [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Menschen macht sich dies binnen Tagen auf den Märkten bemerkbar."
  news_events_world.10.t_tropical_storm: "Tropensturm zieht auf [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] zu"
  news_events_world.10.d_tropical_storm: "Ein Tropensturm ist über [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] gezogen und bringt schweren Regen, starken Wind und gefährliche See. Die Behörden warnen tiefliegende Gemeinden, Häfen drosseln den Verkehr und Bauern sichern Ernte und Vieh. Bei etwa [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Einwohnern kann selbst ein Sturm unter Zyklonstärke Unterkünfte, Ernte und Küstenhandel weitreichend stören."
  news_events_world.10.t_fallback: "Außergewöhnliche Bedingungen in [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_fallback: "Außergewöhnliches Wetter wirkt sich auf [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] aus. Beamte sammeln Berichte von Höfen, Verkehrsstellen und Märkten, um zu entscheiden, ob die Folgen als Unglück oder Segen gelten müssen; die ersten Meldungen widersprechen einander. Bei rund [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] Menschen im betroffenen Staat kann selbst eine vorübergehende Veränderung der Erntebedingungen Folgen weit über die zuerst betroffenen Bezirke hinaus haben."
  news_events_world.10.f: "AUS DEM BETROFFENEN BEZIRK: Bauern und örtliche Beamte berichten von zerstörten Ernten, gestörtem Verkehr und nervösen Märkten. Die ersten Meldungen sind unvollständig, und das wahre Ausmaß der Verluste wird womöglich erst in Wochen bekannt."
  news_events_world.11.t: "Revolution in [ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.11.d: "Gegen [ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFlag] ist ein revolutionärer Aufstand ausgebrochen. Die Rebellen haben sich als [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetNameNoFlag] organisiert und rufen anstelle der alten Ordnung eine [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetGovernment.GetName] aus. In den Arbeitervierteln stehen Barrikaden, und Teile der Garnison sollen übergelaufen sein. Aus Agitation ist ein bewaffneter Kampf um den Staat selbst geworden. Nachbarregierungen beobachten mit unverhohlener Sorge, ob das bestehende Regime die Herausforderung übersteht und welches Beispiel ein Sieg jenseits der Grenzen geben würde."
  news_events_world.11.f: "VON UNSEREM KORRESPONDENTEN: Barrikaden entstehen schneller, als Proklamationen gedruckt werden können. Einwohner berichten von Vierteln, in denen die Autorität von Straße zu Straße wechselt und Gerüchte schneller reisen als jeder amtliche Befehl."
  news_events_world.12.t: "Revolutionäre siegen in [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.12.d: "Die Revolutionäre haben den Bürgerkrieg in [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFlag] gewonnen, und die Staatsmaschinerie geht in die Hände einer [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetGovernment.GetName] unter [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetRuler.GetFullName] über. Der Sieg wird weit über die Grenzen hinaus wirken, Freunde ermutigen und Feinde alarmieren. Ausländische Hauptstädte werden die Sieger nicht nach ihren Proklamationen beurteilen, sondern nach den Gesetzen, die sie erlassen, den Schulden, die sie anerkennen, und den Verträgen, die sie ehren. Die ersten Monate der neuen Regierung werden vieles entscheiden, was der Kampf offenließ."
  news_events_world.12.f: "ANALYSE: Der Sieg gibt den Revolutionären die Ministerien, aber nicht automatisch die Bürokratie, die Armee oder das Vertrauen der Öffentlichkeit. Ihre ersten Tage an der Macht können ebenso entscheidend sein wie die Kämpfe, die sie dorthin brachten."
  news_events_world.13.t: "Der Kauf von [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.13.d: "Durch den [ROOT.Var('news_world_13_news_treaty_ref').GetTreaty.GetNameNoFormatting] ist [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetName] von [ROOT.Var('news_world_13_news_state_giver_ref').GetCountry.GetNameNoFlag] an [ROOT.Var('news_world_13_news_state_taker_ref').GetCountry.GetNameNoFlag] übergegangen. In dem übertragenen Gebiet leben etwa [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetPopulationSize|D] Menschen; es handelt sich also keineswegs nur um eine Korrektur auf der Karte. Verwaltung, Eigentum, militärischer Zugang und die Stellung der Einwohner müssen neu geregelt werden, und die Nachbarregierungen berechnen bereits, was die neue Grenze für ihre Sicherheit bedeutet. Die Bewohner selbst wurden nicht gefragt."
  news_events_world.13.f: "VON DER GRENZE: Die Einwohner warten darauf zu erfahren, welche Gesetze, Steuern und Beamten der neuen Flagge folgen. Für die Menschen im übertragenen Land bedeutet eine Unterschrift in einer fernen Hauptstadt einen unmittelbaren Regierungswechsel."
  news_events_world.14.t: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFormatting] erklärt [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFormatting] zum Rivalen"
  news_events_world.14.d: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFlag] und [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFlag] haben eine erklärte Rivalität begonnen. Zwei Staaten ersten Ranges haben sich in offenen Wettbewerb begeben, und die Erklärung dürfte die Lagerbildung auf dem Kontinent verhärten. Die Botschafter bleiben auf ihren Posten, doch die üblichen Höflichkeiten sind merklich kühler geworden. Jeder künftige Streit, wie gering er auch sein mag, wird nun im Licht dieser Feindschaft gelesen, und Fragen, die einst still zwischen Beamten hätten geregelt werden können, werden öffentlich vor den Augen der Welt ausgetragen."
  news_events_world.14.f: "AUSLANDSREDAKTION: Diplomaten erwarten, dass jeder künftige Streit zwischen den Rivalen durch diese neue Feindschaft gedeutet wird, selbst Fragen, die gestern noch still hätten beigelegt werden können."
  news_events_world.15.t: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFormatting] ergibt sich den [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetAdjectiveNoFormatting] Streitkräften"
  news_events_world.15.d: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFlag] hat aufgehört, als unabhängiger Staat zu bestehen; sein verbleibendes Gebiet wurde nach den Bedingungen der [ROOT.Var('news_world_15_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] von [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag] aufgenommen. Eine Regierung ist aus der Liste der Nationen gestrichen, ihre Ministerien sind aufgelöst und ihre Vertreter im Ausland ohne Land. [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag] trägt nun die Last des eroberten Landes und seiner Bevölkerung, während die Nachbarn überlegen, ob dies den Streit beendet oder nur den nächsten hervorbringt."
  news_events_world.15.f: "AUS DER EHEMALIGEN HAUPTSTADT: Regierungsschilder werden abgenommen, und Beamte entscheiden, ob sie den neuen Behörden dienen wollen. Ein Staat kann schneller von der Karte verschwinden als örtliche Loyalitäten."
  news_events_world.16.t: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetLastNameNoFormatting] übernimmt die Macht in [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.16.d: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetFullName], [ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetAge] Jahre alt, hat nach dem Tod des vorherigen Herrschers die Führung von [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFlag] übernommen. Das Land wird als [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetGovernment.GetName] regiert. Weil der Staat zu den führenden Mächten zählt, prüfen Diplomaten bereits die Freundschaften, Überzeugungen und die Fähigkeit des neuen Herrschers, im verwundbaren Beginn einer Herrschaft Autorität zu sichern. Der Hof spricht von Kontinuität; die Botschaften sind weniger sicher und lesen jedes Signal genau."
  news_events_world.16.f: "PALASTREDAKTION: Höflinge sprechen öffentlich von Kontinuität, doch jede Nachfolge ordnet Zugang und Einfluss neu. Ausländische Botschafter beobachten bereits, wer dem neuen Herrscher am nächsten steht."
  news_events_world.17.t: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFormatting] und [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFormatting] schließen ein Bündnis"
  news_events_world.17.d: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFlag] und [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFlag] sind dem [ROOT.Var('news_world_17_news_treaty_ref').GetTreaty.GetNameNoFormatting] beigetreten und haben sich förmlich verbündet. Die Bedingungen sind nur teilweise veröffentlicht; weithin wird angenommen, dass zusätzliche Absprachen bestehen. Militärplaner und Rivalen prüfen die Verpflichtungen genau, denn ein Bündnis dieses Gewichts kann die Berechnungen einer künftigen Krise verändern und einen örtlichen Streit in einen allgemeinen Krieg verwandeln, bevor einer der Unterzeichner noch umkehren kann."
  news_events_world.17.f: "MILITÄRISCHE ANALYSE: Ein Bündnis ist vor dem ersten Schuss am wichtigsten. Die Generalstäbe werden nun davon ausgehen, dass Krieg mit einem Unterzeichner Krieg mit beiden bedeuten kann."
  news_events_world.18.t: "Die neue Regierung von [ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.18.d: "[ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFlag] hat [ROOT.Var('news_world_18_news_new_law_ref').GetLaw.GetName] erlassen, eine Änderung, die groß genug ist, die Struktur des Staates selbst zu verändern. Das Land wird nun als [ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetGovernment.GetName] regiert. Ausländische Hauptstädte überdenken ihre Beziehungen zur neuen Ordnung, während ihre Freunde im Inland feiern und ihre Gegner sich auf längst vorhergesagte Folgen vorbereiten. Juristen und Beamte arbeiten bereits an der praktischen Umsetzung; Titel, Ministerien und Verfahren, die vor einer Woche noch dauerhaft schienen, müssen neu geschrieben werden."
  news_events_world.18.f: "VERFASSUNGSREDAKTION: Juristen und Beamte arbeiten die praktischen Folgen der neuen Ordnung durch. Titel, Ministerien und alte Verfahren, die einst dauerhaft schienen, müssen womöglich umgeschrieben werden."
  news_events_world.19.t: "Unruhen in [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetNameNoFormatting] lähmen die Wirtschaft und erschüttern die Ordnung"
  news_events_world.19.d: "In [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetName] innerhalb von [ROOT.Var('news_world_19_news_source_country_ref').GetCountry.GetNameNoFlag], einem Bezirk mit etwa [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetPopulationSize|D] Einwohnern, werden schwere Unruhen gemeldet. Streiks, Ausschreitungen und organisierter Unmut bedrohen die gewöhnliche Verwaltung. Geschäfte schließen früher, öffentliche Versammlungen ziehen weit größere Menschenmengen an als angekündigt, und die Polizei wurde aus Nachbarbezirken verstärkt. Hält die Agitation an, kann sie die Hand der Regierung erheblich schwächen und den Handel des ganzen Landes stören."
  news_events_world.19.f: "VON DEN STRASSEN: Ladenbesitzer schließen früher, öffentliche Versammlungen ziehen ungewöhnlich große Mengen an. Die Behörden versichern, die Ordnung wiederherstellen zu können, doch Einwohner sagen, die Spannung sei lange vor jedem Aufruhr sichtbar."
  news_events_world.20.t: "Rezession in [ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.20.d: "[ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFlag] hat einen scharfen und plötzlichen Einbruch seiner Wirtschaft erlitten. Das Nationaleinkommen fiel innerhalb eines Monats von etwa £[ROOT.Var('news_world_20_news_recession_previous_gdp_value').GetValue|D] auf £[ROOT.Var('news_world_20_news_recession_current_gdp_value').GetValue|D], ein Rückgang um [ROOT.Var('news_world_20_news_recession_drop_value').GetValue|%1]. Auftragsbücher leeren sich, Kredit wird knapper, und Fabrikanten sprechen von einer Nachfrage, wie sie seit Jahren nicht mehr so schwach war. Arbeiter fürchten um Löhne und Stellen, während ausländische Märkte nervös beobachten, ob sich die Krise über Handel und Investitionen ausbreitet."
  news_events_world.20.f: "MÄRKTE: Banker und Hersteller suchen nach Anzeichen, dass der Einbruch vorübergehend ist. Ein Analyst warnt, Vertrauen könne rasch zurückkehren, bis Entlassungen und Firmenpleiten aus einem schlechten Monat eine dauerhafte Flaute machen."
  news_events_world.21.t: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFormatting] erreicht ein BIP von 1 Milliarde"
  news_events_world.21.d: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFlag] ist die erste Nation der Welt, deren jährliches Produkt eintausend Millionen Pfund übersteigt; bei der Berechnung lag es bei etwa £[ROOT.Var('news_world_21_news_billion_gdp_value').GetValue|D]. Die dort versammelte Konzentration von Industrie, Handel und Kaufkraft setzt einen Maßstab für jeden Rivalen. Ökonomen streiten darüber, was der Erfolg wirklich bedeutet, und er sagt nichts darüber, wer den Reichtum erhält, doch er zeigt eine industrielle Größenordnung, die keine Regierung mehr ignorieren kann."
  news_events_world.21.f: "FINANZREDAKTION: Ökonomen streiten bereits über die Bedeutung. Der Wert sagt wenig darüber, wer den Wohlstand erhält, aber er zeigt eine industrielle Größe, die Rivalen nicht ignorieren können."
  news_events_world.22.t: "[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFormatting] verkündet neues internationales Abkommen"
  news_events_world.22.d: "Unter [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFlag] ist ein neuer Block entstanden: [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName], gegründet um das Prinzip [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetIdentity.GetName] und mit [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers] Mitgliedstaaten. Andere Regierungen prüfen Satzung und Mitglieder genau, denn eine solche Vereinigung kann Handel, Bündnisse und politischen Einfluss ganzer Regionen neu ordnen. Ob sie sich als dauerhaftes Instrument oder als Zweckgemeinschaft erweist, wird sich erst in einer Krise zeigen, die ihre Mitglieder nicht selbst gewählt haben."
  news_events_world.22.f: "DIPLOMATISCHE ANALYSE: Neue Blöcke verkünden oft Einheit, bevor eine echte Krise sie prüft. Außenministerien werden den ersten Streit unter Mitgliedern genauer beobachten als die Gründungsfeier."
  news_events_world.23.t: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFormatting] bedient seine Schulden nicht mehr!"
  news_events_world.23.d: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFlag] ist seinen Verpflichtungen nicht nachgekommen. Zum Zeitpunkt des Zahlungsausfalls lag die öffentliche Hauptschuld bei etwa £[ROOT.Var('news_world_23_news_default_principal_value').GetValue|D] gegenüber einem Kreditlimit von £[ROOT.Var('news_world_23_news_default_credit_limit_value').GetValue|D]. Gläubiger müssen schwere Verluste hinnehmen, und künftige Kredite werden teurer, falls sie überhaupt noch gewährt werden. Ausländische Banken und Regierungen achten auf Ansteckung, politische Unruhe und Zeichen dafür, dass die Staatskasse Armee und Verwaltung nicht mehr tragen kann."
  news_events_world.23.f: "FINANZREDAKTION: Anleihegläubiger bewerten Politik ebenso wie Zahlen. Ein ausgehandelter Vergleich könnte Vertrauen zurückbringen; ein langer Zahlungsausfall kann jeden künftigen Kredit noch Jahre verteuern."
  news_events_world.24.t: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFormatting] tritt in den Kreis der Großmächte ein"
  news_events_world.24.d: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFlag] ist in den ersten Rang der Nationen aufgestiegen; sein Jahresprodukt beträgt rund £[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetGDP|D]. Der Aufstieg spiegelt eine gewaltige Ansammlung von Reichtum, Waffen und Einfluss wider und verschafft dem Staat eine Stimme in den großen diplomatischen Fragen des Tages. Die etablierten Mächte überlegen bereits, ob sie den Neuling als Verbündeten umwerben oder als Rivalen behandeln sollen; zugleich wird er feststellen, dass Anerkennung Pflichten mit sich bringt, die so schwer wie ihre Vorrechte sein können."
  news_events_world.24.f: "AUSLANDSREDAKTION: Einladungen, Protokoll und diplomatische Berechnungen ändern sich fast sofort. Der Neuling wird feststellen, dass Anerkennung nicht nur Einfluss bringt, sondern auch die Erwartung, in früher fernen Streitfragen Partei zu ergreifen."
  news_events_world.25.t: "Der Niedergang von [ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.25.d: "[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFlag] ist aus dem ersten Rang der Mächte gefallen; sein Jahresprodukt wird nun auf rund £[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetGDP|D] geschätzt. Die Veränderung ist mehr als zeremoniell: Sie zeigt eine geringere Fähigkeit, Aufmerksamkeit zu erzwingen und das Weltgleichgewicht zu formen. Zu Hause stehen Minister unter Druck, verlorene Stärke und Stellung wiederherzustellen; im Ausland dürften frühere Partner härter handeln als noch vor einem Jahr."
  news_events_world.25.f: "ANALYSE: Der Verlust an Rang wird in Konferenzzimmern spürbar sein, bevor er auf einer Karte sichtbar wird. Frühere Partner können härter verhandeln, Rivalen prüfen, ob der Niedergang vorübergehend oder dauerhaft ist."
  news_events_world.26.t: "Die Führung von [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFormatting] wird angefochten"
  news_events_world.26.d: "Innerhalb von [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName], einem Verband von [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers] Mitgliedstaaten, hat ein Kampf um die Führung begonnen. [ROOT.Var('news_world_26_news_bloc_contender_ref').GetCountry.GetNameNoFlag] fordert [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFlag], den gegenwärtigen Führer, heraus. Beamte versichern, die normale Zusammenarbeit gehe weiter, doch Delegationen zählen ihre Unterstützer mit ungewöhnlicher Sorgfalt. Ein langer Streit kann mehrere Regierungen zugleich spalten und Außenmächte einladen, aus der Verwirrung Nutzen zu ziehen."
  news_events_world.26.f: "IM BLOCK: Beamte versichern, die gewöhnliche Zusammenarbeit gehe weiter, doch Delegationen zählen ihre Anhänger genau. Auch ein Führungskampf ohne Armeen kann Verbündete in rivalisierende Lager teilen."
  news_events_world.27.t: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFormatting] übernimmt die Führung des Bündnisses"
  news_events_world.27.d: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFlag] hat [ROOT.Var('news_world_27_news_bloc_loser_ref').GetCountry.GetNameNoFlag] im Kampf um die Führung von [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetName] geschlagen, einem Verband von [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetNumMembers] Mitgliedstaaten. Die Regierungen im Bund überlegen, ob der Wechsel sie enger zusammenschweißt oder Widerstand unter jenen hervorruft, die den bisherigen Führer unterstützt hatten. Der Wettbewerb ist beendet, doch die offengelegten Loyalitäten sind nicht so leicht zu ordnen."
  news_events_world.27.f: "DIPLOMATISCHE REDAKTION: Der Wettbewerb ist beendet, die Loyalitäten vielleicht nicht. Der neue Führer übernimmt einen Verband, in dem manche Regierungen den Verlierer bevorzugt hätten."
  news_events_world.28.t: "[ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFormatting] und [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFormatting] gehen getrennte Wege"
  news_events_world.28.d: "Der [ROOT.Var('news_world_28_news_treaty_ref').GetTreaty.GetNameNoFormatting], der [ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFlag] und [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFlag] verband, ist aufgelöst worden. Der Bruch beseitigt eine wichtige Verpflichtung und zwingt beide Regierungen, ihre militärischen Planungen und ihre Lage in künftigen Krisen neu zu bewerten. Beide Hauptstädte haben bedauernde Erklärungen veröffentlicht, denen niemand recht glaubt. Rivalen untersuchen den Bruch bereits auf Chancen; nun stellt sich die Frage, wo die ehemaligen Partner Sicherheit suchen und wer bereit ist, die verlorene Beziehung zu ersetzen."
  news_events_world.28.f: "AUSLANDSREDAKTION: Diplomaten halten den Bruch für wichtiger als die formale Kündigung. Entscheidend ist nun, wo beide ehemaligen Partner Sicherheit suchen und wer bereit ist, die Beziehung zu ersetzen."
  news_events_world.29.t: "PANIK! Weltweiter Mangel an [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting]!"
  news_events_world.29.d: "Ein schwerer Mangel an [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] hat den Weltmarkt erfasst, und die Preise sind weit über das im Handel Gewohnte gestiegen. Die Marktnachfrage lag bei etwa [ROOT.Var('news_world_29_news_shortage_imports_value').GetValue|D], während nur [ROOT.Var('news_world_29_news_shortage_exports_value').GetValue|D] zum Verkauf angeboten wurden, ein Druckverhältnis von [ROOT.Var('news_world_29_news_shortage_pressure_value').GetValue|2] zu eins. Hersteller, Händler und Regierungen ringen um die verbleibenden Vorräte, und die höheren Kosten schlagen auf jede Industrie durch, die von der Ware abhängt."
  news_events_world.29.f: "MÄRKTE: Käufer berichten von Verträgen, die stündlich neu geschrieben werden. Ein Makler beschrieb den Kampf um [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] als einen Markt, in dem Geld allein keine Lieferung mehr garantiert."
  news_events_world.30.t: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] und [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] zeichnen die Karte neu"
  news_events_world.30.d_exchange: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] und [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] haben einen Gebietstausch vereinbart. [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting] mit etwa [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D] Einwohnern geht von [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] an [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting], während [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting] mit rund [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D] Bewohnern in die Gegenrichtung wechselt. Grenzen wurden durch Einigung statt Krieg verschoben, und die Bewohner beider Provinzen wachen unter einer anderen Regierung auf."
  news_events_world.30.d_a_to_b: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] hat zugestimmt, [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting] an [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] abzutreten. Das Gebiet hat etwa [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D] Einwohner, die nicht gefragt wurden. Verwaltung, Besteuerung und Sicherheit müssen unter dem neuen Souverän neu geordnet werden; Fragen von Eigentum, Sprache und örtlichen Ämtern werden Juristen jahrelang beschäftigen. Die Nachbarregierungen untersuchen eine Grenzänderung, die durch Verhandlung statt Gewalt zustande kam."
  news_events_world.30.d_b_to_a: "[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] hat zugestimmt, [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting] an [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] abzutreten. Das Gebiet hat etwa [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D] Einwohner, die nicht gefragt wurden. Verwaltung, Besteuerung und Sicherheit müssen unter dem neuen Souverän neu geordnet werden; Fragen von Eigentum, Sprache und örtlichen Ämtern werden Juristen jahrelang beschäftigen. Die Nachbarregierungen untersuchen eine Grenzänderung, die durch Verhandlung statt Gewalt zustande kam."
  news_events_world.30.f: "VON DER GRENZE: Vermesser können die Linie binnen Tagen verschieben, doch die Bewohner müssen jahrelang mit den Folgen leben. Händler, Grundbesitzer und örtliche Beamte fragen bereits, welche Regeln den Übergang überdauern."
  news_events_world.31.t: "STREIK! Arbeiter vereinigen sich in [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]!"
  news_events_world.31.d_nationwide: "Eine Streikwelle zieht durch ganz [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]. In Fabriken und bei öffentlichen Arbeiten ruht die Arbeit, während die organisierte Arbeiterschaft ihre Forderungen an Unternehmer und Minister richtet. Der Ausstand ist groß genug, die Produktion des ganzen Landes zu treffen, und die Zeitungen aller Parteien sind sich nur über seinen Ernst einig. Es besteht die Sorge, anhaltende Konfrontation könne Radikalismus fördern und die Regierung zu einer Wahl zwischen Zugeständnissen und Repression zwingen."
  news_events_world.31.d_mining: "Ein großer Bergarbeiterstreik ist in [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] ausgebrochen, mit [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] im Zentrum. Die Männer haben die Gruben verlassen, und die Versorgung der Industrie mit Kohle und Metall ist bedroht. Unternehmer und Minister stehen unter Druck, eine Einigung zu finden, bevor die Knappheit von den Zechen in Fabriken und Bahnen übergreift. Eigene Komitees der Bergleute halten in den Revieren Ordnung, was die Behörden fast ebenso beunruhigt wie Unordnung."
  news_events_world.31.d_industrial: "Fabrikarbeiter sind in [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] in den Ausstand getreten, wobei [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] zu den wichtigsten Zentren zählt. Die Produktion ruht, während Arbeiter und Maschinisten höhere Löhne und bessere Arbeitszeiten verlangen. Unternehmer warnen vor verlorenen Aufträgen und Verträgen, die ins Ausland abwandern; Gewerkschafter entgegnen, der Streik beweise gerade ihren alten Punkt: Das Land ruht auf der Arbeit jener, die am wenigsten darüber bestimmen, wie es regiert wird."
  news_events_world.31.d_railway: "Die Eisenbahner streiken in [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], mit Schwerpunkt in [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]. Ein langer Ausstand bedroht weit mehr als die Bahnlinien selbst: Fabriken brauchen Züge für Brennstoff und Material, Städte für Lebensmittel und die Armee für ihre Bewegungen. Verderbliche Waren faulen bereits auf Nebengleisen. Minister sollen den Dienst wiederherstellen oder sich einigen, bevor die Lähmung weitergreift."
  news_events_world.31.d_movement: "Die Arbeiter von [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] haben in [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] einen eindeutig politischen Streik begonnen. Der Ausstand gehört zu einer breiteren Bewegung und nicht nur zu einer einzelnen Werkstattbeschwerde; damit trägt er die Konflikte des Fabrikbodens direkt in die nationale Politik. Unternehmer fürchten Nachahmung in anderen Städten, während Organisatoren hoffen, dass sichtbare Störung die Regierung zwingt, sie als politische Kraft statt als bloßes Polizeiproblem zu behandeln."
  news_events_world.31.d: "Ein bedeutender Streik ist in [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] ausgebrochen und richtet die Aufmerksamkeit des ganzen Landes auf Löhne, Arbeitszeiten und die Lage des Arbeiters. Die Störung ist schwer genug, Minister und Fabrikanten zu alarmieren; sie fürchten Produktionsausfälle und Nachahmung. In mehreren Städten werden Sammlungen für Streikfamilien organisiert. Die Reaktion der Regierung kann entscheiden, ob der Streit in Verhandlung, Repression oder einer breiteren Unruhewelle endet."
  news_events_world.31.f: "VON DER STREIKPOSTENKETTE: Die Organisatoren bestehen darauf, den Ausstand bis zu echten Zugeständnissen fortzusetzen, während die Unternehmer warnen, jede stillstehende Schicht erhöhe die Kosten und ermutige Arbeiter andernorts zum Mitmachen."

  ## Reader responses, one per story.
  news_events_world.1.a: "Hoffen wir, dass die Vernunft siegt."
