  news_events_world.22.a: "Eine neue Ordnung der Mächte."
  news_events_world.23.a: "Die Gläubiger werden das nicht vergessen."
  news_events_world.24.a: "Eine neue Stimme am Tisch."
  news_events_world.25.a: "Jedes Reich kennt seinen Abend."
