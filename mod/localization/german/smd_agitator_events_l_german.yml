l_german:
 smd_agitators.1.t:0 "Tupac Shakur ist tot"
 smd_agitators.1.d:0 "In der Nacht zum 7. September 1996 wurde [SCOPE.sCharacter('smd_tupac_scope').GetFullName] in Las Vegas von vier Kugeln getroffen, als er in einem Auto an einer roten Ampel stand. Am 13. September erlag er im Alter von 25 Jahren seinen Verletzungen. Der Schütze entkam, und niemand wurde angeklagt. Überall im Land versammeln sich Fans, um um ihn zu trauern."
 smd_agitators.1.f:0 "Sein viertes Album, All Eyez on Me, war Anfang des Jahres erschienen."
 smd_agitators.1.a:0 "Eine verstummte Stimme"
