l_polish:

 news.1.t:0 "Godne uwagi wydarzenie"
 news.1.d:0 "Wycinek testowy. Jeżeli wygląda to jak gazeta, z winietą państwa u góry, artykułem złożonym na papierze i BEZ ciemnej ramki ani paska tytułu wokół okna, oznacza to, że ten typ okna działa. Powinno również nadal dać się je przeciągać."
 news.1.f:0 "Nasi korespondenci pozostają w gotowości."
 news.1.a:0 "Wiadomość pierwszorzędnej wagi!"

 news.2.t:0 "REWOLUCJA W ROSJI"
 news.2.d:0 "[ROOT.Var('news_test_2_news_attacker_ref').GetCountry.GetNameNoFlag] formalnie wypowiedziało wojnę państwu [ROOT.Var('news_test_2_news_defender_ref').GetCountry.GetNameNoFlag]. Wojska są mobilizowane wzdłuż granicy, a kancelarie wielkich mocarstw obserwują sytuację z poważnym niepokojem. Dyplomatów odwołano, a giełdy ogarnęło zamieszanie. Nasi korespondenci są w drodze na teatr wojny, a dalszych szczegółów oczekuje się wraz z wieczorną pocztą. Dyplomatów odwołano, a giełdy ogarnęło zamieszanie. Nasi korespondenci są w drodze na teatr wojny, a dalszych szczegółów oczekuje się wraz z wieczorną pocztą. Dyplomatów odwołano, a giełdy ogarnęło zamieszanie. Nasi korespondenci są w drodze na teatr wojny, a dalszych szczegółów oczekuje się wraz z wieczorną pocztą."
 news.2.f:0 "Tam, gdzie zawiodła dyplomacja, przemawiają działa."
 news.2.a:0 "Doprawdy ponure wieści."
