l_polish:
 concept_budapest_memorandum:0 "Budapest Memorandum"
 concept_budapest_memorandum_desc:0 "Signed in Budapest on 5 December 1994, the Memoranda on Security Assurances bound the United States, the United Kingdom and Russia to respect the independence and existing borders of Ukraine, Belarus and Kazakhstan, and never to threaten or use force against them. In return the three states gave up the Soviet nuclear weapons left on their soil and joined the Non-Proliferation Treaty as non-nuclear states.\n\nThe assurances were political promises, not a defence pact. Nobody was obliged to fight for the signatories, only to refrain from attacking them."
 concept_lisbon_protocol:0 "Lisbon Protocol"
 concept_lisbon_protocol_desc:0 "An addendum to the START I treaty signed in Lisbon on 23 May 1992. It made Ukraine, Belarus and Kazakhstan parties to START as successors of the Soviet Union, and committed all three to join the Non-Proliferation Treaty as non-nuclear states "in the shortest possible time". How short that time would be was left open."
 je_budapest_memorandum:0 "The Budapest Memorandum"
 je_budapest_memorandum_reason:0 "When the Soviet Union fell apart, the third largest nuclear arsenal in the world was suddenly Ukrainian. The missiles sit in silos across the country, but the launch codes are in Moscow and the warheads need Russian maintenance to stay safe.\n\nWashington and Moscow both want them gone. Kyiv wants to know what it gets in return: money, fuel for its reactors, and above all a promise that its borders will be respected. The [concept_lisbon_protocol] is the first step and the [concept_budapest_memorandum] the last.\n\n#bold Disarming#! earns aid and security assurances from the United States, Britain and Russia. #bold Refusing#! makes us a pariah to the international community."
 je_budapest_memorandum_disarmed_conclusion_desc:0 "The last warhead has left Ukraine. The country is now a non-nuclear state under the Non-Proliferation Treaty, with the word of three great powers that its borders are safe."
 je_budapest_memorandum_refused_conclusion_desc:0 "Ukraine has refused to give up its warheads. It keeps the bomb and loses the trust of most of the world."
 je_kzk_denuclearization:0 "A Nuclear-Free Kazakhstan"
 je_kzk_denuclearization_reason:0 "Kazakhstan inherited strategic bombers, missile silos and the Semipalatinsk test site, where the Soviet Union set off more than four hundred nuclear explosions. The people of the steppe have no love for the bomb.\n\nThe [concept_lisbon_protocol] commits us to give up the warheads, and the Americans are interested in more than just the missiles. Hundreds of kilograms of weapons-grade uranium sit in a poorly guarded plant at Ust-Kamenogorsk.\n\n#bold Disarming#! earns aid and security assurances under the [concept_budapest_memorandum]. #bold Refusing#! makes us a pariah to the international community."
 je_kzk_denuclearization_disarmed_conclusion_desc:0 "The last warhead has left Kazakhstan. The country is a non-nuclear state, and its president can tell the world it chose to be one."
 je_kzk_denuclearization_refused_conclusion_desc:0 "Kazakhstan has refused to give up its warheads, and the international community has turned its back."
 budapest_status_start:0 "Warheads on our soil: #bold [ROOT.GetCountry.MakeScope.Var('nukes').GetValue|0]#!.\nNext: the [concept_lisbon_protocol] in #bold May 1992#!, where we decide whether to commit to disarmament."
 budapest_status_committed:0 "Warheads on our soil: #bold [ROOT.GetCountry.MakeScope.Var('nukes').GetValue|0]#!. We have committed to disarm.\nNext: the [concept_budapest_memorandum] in #bold December 1994#!. Signing it starts the handover."
 budapest_status_stalling:0 "Warheads on our soil: #bold [ROOT.GetCountry.MakeScope.Var('nukes').GetValue|0]#!. We are holding our arsenal back as leverage.\nNext: the [concept_budapest_memorandum] in #bold December 1994#!. It is our last chance. Refusing there makes us a #bold Nuclear Holdout#!."
 budapest_status_transfer:0 "Warheads still on our soil: #bold [ROOT.GetCountry.MakeScope.Var('nukes').GetValue|0]#!. #bold [ROOT.GetCountry.MakeScope.Var('budapest_transfer_rate').GetValue|0]#! leave for dismantling in Russia every month."
 BUDAPEST_TRANSFER_STARTED:0 "The warheads are being handed over under the [concept_budapest_memorandum]"
 NOT_BUDAPEST_TRANSFER_STARTED:0 "The warheads are not yet being handed over under the [concept_budapest_memorandum]"
 BUDAPEST_NO_WARHEADS_LEFT:0 "No nuclear warheads remain on our soil"
 NOT_BUDAPEST_NO_WARHEADS_LEFT:0 "Nuclear warheads remain on our soil"
 BUDAPEST_REFUSED:0 "We have refused to give up our nuclear weapons"
 NOT_BUDAPEST_REFUSED:0 "We have not refused to give up our nuclear weapons"
 budapest_transfer_tt:0 "The warheads leave in monthly shipments and are all gone within about a year and a half. The journal entry completes when the last one is gone."
 budapest_lisbon_goodwill:0 "Lisbon Commitments"
 budapest_lisbon_goodwill_desc:0 "We have promised to give up our nuclear weapons under the [concept_lisbon_protocol], and the world has noticed."
 budapest_fuel_deliveries:0 "Russian Reactor Fuel"
 budapest_fuel_deliveries_desc:0 "Under the Trilateral Statement, Russia supplies fuel rods for our nuclear power plants in exchange for the uranium in our warheads."
 budapest_security_assurances:0 "Budapest Security Assurances"
 budapest_security_assurances_desc:0 "The United States, Britain and Russia have promised under the [concept_budapest_memorandum] to respect our independence and our borders."
 budapest_non_nuclear_state:0 "Non-Nuclear State"
 budapest_non_nuclear_state_desc:0 "We gave up the bomb of our own free will, and other governments find it easier to trust us."
 budapest_nuclear_holdout:0 "Nuclear Holdout"
 budapest_nuclear_holdout_desc:0 "We refused to hand over the Soviet warheads on our soil. The great powers treat us as a proliferation risk, and much of the world follows their lead."
 budapest.1.t:0 "The Lisbon Protocol"
 budapest.1.d_ukr:0 "In Lisbon, the foreign ministers of the United States, Russia, Ukraine, Belarus and Kazakhstan have gathered to settle who inherits the Soviet Union's obligations under the START treaty. The Americans want one thing above all: a written promise that only one nuclear power will emerge from the wreck of the Union, and that it will be Russia.\n\nThe Rada is divided. Some deputies call the warheads a burden we cannot afford to maintain. Others call them the only guarantee of independence Ukraine has ever had."
 budapest.1.d_kzk:0 "In Lisbon, the foreign ministers of the United States, Russia, Ukraine, Belarus and Kazakhstan have gathered to settle who inherits the Soviet Union's obligations under the START treaty. The Americans want a written promise that only one nuclear power will emerge from the wreck of the Union.\n\nPresident Nazarbayev closed the Semipalatinsk test site before independence and has little appetite for the bomb. Still, a few advisers argue that the warheads are worth more on the negotiating table than in a Russian dismantling plant."
 budapest.1.f:0 ""We will not be a nuclear state, but we will not be a cheap one either.""
 budapest.1.a:0 "Sign the protocol and commit to disarm"
 budapest.1.b:0 "Keep the warheads on the table for now"
 budapest.2.t:0 "The Trilateral Statement"
 budapest.2.d:0 "Presidents Clinton and Yeltsin have come to Moscow with an offer for Kyiv. Russia will take the warheads, dismantle them, and send back the uranium as fuel for Ukrainian power stations. The United States will pay for the dismantling and add economic aid on top.\n\nIt is a better deal than anyone expected a year ago. Some in the Rada still think it is not good enough."
 budapest.2.f:0 "The Trilateral Statement was signed in Moscow on 14 January 1994."
 budapest.2.a:0 "Accept the offer"
 budapest.2.b:0 "Hold out for better terms"
 budapest.3.t:0 "The Budapest Memorandum"
 budapest.3.d:0 "At the summit of the Conference on Security and Cooperation in Europe in Budapest, the leaders of the United States, the United Kingdom and Russia are ready to sign security assurances for us. They promise to respect our independence and our borders, and never to use force or economic pressure against us. In return, we hand over every remaining warhead and join the Non-Proliferation Treaty as a non-nuclear state.\n\nThe pens are on the table."
 budapest.3.d_stalling:0 "At the summit of the Conference on Security and Cooperation in Europe in Budapest, the leaders of the United States, the United Kingdom and Russia are ready to sign security assurances for us, in return for every remaining warhead.\n\nWe have kept them waiting a long time. This is the last offer. If we walk away from the table now, we walk away from the international community with it."
 budapest.3.f:0 "Promises are not treaties. Whether they are worth anything depends on who keeps them."
 budapest.3.a:0 "Sign the memorandum and hand over the warheads"
 budapest.3.b:0 "Refuse. The bomb stays."
 budapest.4.t:0 "Project Sapphire"
 budapest.4.d:0 "The Americans have made a quiet proposal. At the Ulba Metallurgical Plant in Ust-Kamenogorsk lie some six hundred kilograms of weapons-grade uranium, enough for dozens of bombs and guarded by little more than a padlock. Washington will buy the lot and fly it out in secret on its own transport planes.\n\nNobody else needs to know until the planes have landed in Tennessee."
 budapest.4.f:0 "Three American C-5 Galaxy transports left Kazakhstan in November 1994 carrying the uranium."
 budapest.4.a:0 "Sell the uranium to the Americans"
 budapest.4.b:0 "The uranium stays in Kazakhstan"
 budapest.5.t:0 "The Last Warhead"
 budapest.5.d_ukr:0 "The last train carrying nuclear warheads has crossed the border into Russia. For the first time since independence, there are no nuclear weapons on Ukrainian soil.\n\nThe country that held the third largest arsenal in the world has given it up of its own free will. What remains is the word of three great powers."
 budapest.5.d_kzk:0 "The last nuclear warhead has left Kazakhstan for dismantling in Russia. The steppe that suffered more nuclear explosions than anywhere else on earth is free of the bomb."
 budapest.5.f:0 ""The world must see that a country can give up nuclear weapons and gain respect for it.""
 budapest.5.a:0 "A safer world"
 budapest_status_committed_ukr_trilateral:0 "Warheads on our soil: #bold [ROOT.GetCountry.MakeScope.Var('nukes').GetValue|0]#!. We have committed to disarm.\nNext: the Trilateral Statement in #bold January 1994#!, where Washington and Moscow offer aid and reactor fuel. Then the [concept_budapest_memorandum] in #bold December 1994#!."
 budapest_status_stalling_ukr_trilateral:0 "Warheads on our soil: #bold [ROOT.GetCountry.MakeScope.Var('nukes').GetValue|0]#!. We are holding our arsenal back as leverage.\nNext: the Trilateral Statement in #bold January 1994#!, where we can still accept a deal. Then the [concept_budapest_memorandum] in #bold December 1994#!, our last chance before we become a pariah."
 budapest_status_committed_kzk_sapphire:0 "Warheads on our soil: #bold [ROOT.GetCountry.MakeScope.Var('nukes').GetValue|0]#!. We have committed to disarm.\nNext: the Americans will make an offer for our weapons-grade uranium in #bold November 1994#!. Then the [concept_budapest_memorandum] in #bold December 1994#!."
 budapest_status_stalling_kzk_sapphire:0 "Warheads on our soil: #bold [ROOT.GetCountry.MakeScope.Var('nukes').GetValue|0]#!. We are holding our arsenal back as leverage.\nNext: an American offer for our uranium in #bold November 1994#!, then the [concept_budapest_memorandum] in #bold December 1994#!, our last chance before we become a pariah."
 budapest_commit_tt:0 "We will hand over our warheads once the [concept_budapest_memorandum] is signed in December 1994. Until then we keep them."
 budapest_stall_tt:0 "We keep our options open. We will get one last chance to disarm at Budapest in December 1994. Refusing there means leaving the Non-Proliferation Treaty, +15 infamy, worse relations with nearly every country, and ten years as a #bold Nuclear Holdout#!."
 budapest_trilateral_accept_tt:0 "We commit to disarm. The warheads leave once the [concept_budapest_memorandum] is signed in December 1994."
 budapest_sapphire_tt:0 "The uranium is flown out of the country. This does not affect our warheads."
 budapest_sign_tt:0 "When the last warhead is gone we lose [concept_nuclear_weapon|nuclear weapons] and the prestige they bring, remain in the Non-Proliferation Treaty, and gain #bold Non-Nuclear State#! for ten years: relations improve 25% faster and infamy fades 25% faster."
 budapest_refuse_tt:0 "#negative We keep the bomb and become a pariah.#! The journal entry fails, and we cannot disarm through it later."
