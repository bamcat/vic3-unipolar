l_polish:
 smd_wot_afghan_expedition.t:0 "Expeditionary Force for Afghanistan"
 smd_wot_afghan_expedition.d:0 "The Northern Alliance is holding the line from [SCOPE.sState('wot_ana_capital').GetName], and the coalition wants troops on the ground beside it. [SCOPE.sCharacter('wot_afghan_general').GetFullName] has volunteered to lead one of our formations there."
 smd_wot_afghan_expedition.f:0 "The transport aircraft are fuelled and waiting."
 smd_wot_afghan_expedition.a:0 "Send them to Afghanistan."
 smd_wot_afghan_expedition.b:0 "Our forces are needed at home."
 smd_cn_fahim:0 "Fahim"
 smd_dp_intifada:0 "Intifada"
 smd_dp_intifada_desc:0 "Sets the initiating [concept_war_goal] to completely annex the targeted [concept_country]."
 smd_dp_intifada_tooltip:0 "#header Start a $smd_dp_intifada$ [concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$smd_dp_intifada_desc$"
 smd_second_intifada_play:0 "The Second Intifada"
