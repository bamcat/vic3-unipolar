 NOT_RUS_L90_INSURGENCY_BELOW_1:0 "The insurgency in Chechnya is still active"
 RUS_L90_INSURGENCY_ABOVE_40:0 "The insurgency in Chechnya is at least 40"
 NOT_RUS_L90_INSURGENCY_ABOVE_40:0 "The insurgency in Chechnya is below 40"
