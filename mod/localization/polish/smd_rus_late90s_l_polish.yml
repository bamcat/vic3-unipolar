l_polish:
 concept_rus_ichkeria:0 "Ichkeria"
 concept_rus_ichkeria_desc:0 "The Chechen Republic of Ichkeria declared its independence from Russia in 1991. Between the two Chechen wars it governed itself in all but name: it had its own president, its own army and its own courts, but no country in the world recognised it, and its economy lay in ruins."
 concept_rus_khasavyurt:0 "Khasavyurt Accord"
 concept_rus_khasavyurt_desc:0 "Signed on 31 August 1996 by Alexander Lebed and Aslan Maskhadov in the Dagestani town of Khasavyurt, the accord ended the First Chechen War. Russian troops withdrew and the question of Chechnya's status was postponed for five years. Many in Moscow saw it as a surrender."
 concept_rus_radicalisation:0 "Radicalisation"
 concept_rus_radicalisation_desc:0 "How far power in [concept_rus_ichkeria] has passed from its elected government to armed field commanders, kidnapping gangs and foreign volunteers. It runs from 0 to 100.\n\nRadicalisation rises every month on its own, and faster when Ichkeria is not ruled by a moderate. Russian aid, a sealed border and a government that reins in the warlords all bring it down.\n\nAt 45 the first Islamist enclaves appear in Dagestan. At 65, armed groups may cross into Dagestan. At 80, Russia can launch a counter-terrorist operation without any other cause. Below 30, Russia can consider recognising Ichkeria."
 concept_rus_chechenization:0 "Chechenization"
 concept_rus_chechenization_desc:0 "Handing the war in Chechnya over to Chechens loyal to Moscow. Local forces take over the fighting and the government, and in return Moscow pays for reconstruction and asks few questions about how they rule."
 concept_csto:0 "Collective Security Treaty Organization"
 concept_csto_desc:0 "A Russian-led military alliance of former Soviet republics, grown out of the Collective Security Treaty signed in Tashkent in 1992. If any member is attacked from outside the alliance, every other member joins the war on its side."
 concept_rus_union_state:0 "Union State"
 concept_rus_union_state_desc:0 "A union of Russia and Belarus, built in stages: the Community of 1996, the Union of 1997 and the Union State treaty of 1999. It promised a common market, a shared currency and eventually common institutions, though much of it stayed on paper."
