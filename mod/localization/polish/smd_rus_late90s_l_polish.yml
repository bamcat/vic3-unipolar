 RUS_L90_BYL_OPEN_TO_UNION:0 "Belarus is led by someone open to integration with Russia"
 NOT_RUS_L90_BYL_OPEN_TO_UNION:0 "Belarus is led by a liberal or a nationalist who will not merge with Russia"
 RUS_L90_BYL_RELATIONS_AMICABLE:0 "Our relations with Belarus are at least Amicable"
 NOT_RUS_L90_BYL_RELATIONS_AMICABLE:0 "Our relations with Belarus are worse than Amicable"
 RUS_L90_BYL_RELATIONS_CORDIAL:0 "Our relations with Belarus are at least Cordial"
 NOT_RUS_L90_BYL_RELATIONS_CORDIAL:0 "Our relations with Belarus are worse than Cordial"
 RUS_L90_BYL_NOT_WESTERN:0 "Belarus is not in NATO or the EU and is nobody else's subject"
 NOT_RUS_L90_BYL_NOT_WESTERN:0 "Belarus has joined NATO or the EU, or become someone else's subject"
 RUS_L90_CSTO_WILLING_PARTNERS:0 "At least two other CIS members outside NATO have Cordial relations with us"
 NOT_RUS_L90_CSTO_WILLING_PARTNERS:0 "Fewer than two other CIS members outside NATO have Cordial relations with us"
