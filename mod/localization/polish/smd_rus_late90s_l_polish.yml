 NOT_RUS_L90_ICHKERIA_RECOGNISED:0 "Russia has not recognised [concept_rus_ichkeria]"
 RUS_L90_SECOND_WAR_BEGUN:0 "The second war in Chechnya has begun"
 NOT_RUS_L90_SECOND_WAR_BEGUN:0 "The second war in Chechnya has not begun"
 RUS_L90_WAR_OVER_ICHKERIA_STANDS:0 "The war has ended and [concept_rus_ichkeria] still stands"
 NOT_RUS_L90_WAR_OVER_ICHKERIA_STANDS:0 "The war goes on, or [concept_rus_ichkeria] has fallen"
 RUS_L90_UNION_STATE_FORMED:0 "The [concept_rus_union_state] treaty has been signed"
 NOT_RUS_L90_UNION_STATE_FORMED:0 "The [concept_rus_union_state] treaty has not been signed"
 RUS_L90_UNION_REJECTED:0 "Belarus has walked away from the union"
 NOT_RUS_L90_UNION_REJECTED:0 "Belarus has not walked away from the union"
 RUS_L90_CSTO_RUSSIA_FRIENDLY:0 "Russia has at least Cordial relations with us and is not at war with us"
 NOT_RUS_L90_CSTO_RUSSIA_FRIENDLY:0 "Our relations with Russia are worse than Cordial, or we are at war"
 RUS_L90_BYL_IN_CIS:0 "Belarus is a member of the CIS"
 NOT_RUS_L90_BYL_IN_CIS:0 "Belarus is not a member of the CIS"
