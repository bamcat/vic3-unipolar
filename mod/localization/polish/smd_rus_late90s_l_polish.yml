 RUS_L90_INSURGENCY_CHANGE:0 "Insurgency in Chechnya: $VALUE|+0$"
 RUS_L90_PM_STANDING:0 "The [concept_prime_minister]'s [concept_rus_kremlin_standing]: $VALUE|+0$"
 RUS_WN_STANDING_RUS_YEVGENY_PRIMAKOV:0 "Yevgeny Primakov [concept_rus_kremlin_standing]: $VALUE|+0$"
 rus_l90_radicalisation_bar:0 "[concept_rus_radicalisation]"
 rus_l90_radicalisation_bar_desc:0 "How far armed radicals have taken over [concept_rus_ichkeria]. At 45 enclaves appear in Dagestan, at 65 raids into Dagestan become possible, and at 80 we can strike without other cause."
 cch_l90_radicalisation_bar:0 "[concept_rus_radicalisation]"
 cch_l90_radicalisation_bar_desc:0 "How far the field commanders and foreign volunteers have slipped out of the government's control. The higher it climbs, the closer Russia comes to a second war."
 rus_l90_insurgency_bar:0 "Insurgency"
 rus_l90_insurgency_bar_desc:0 "The strength of the armed underground in Chechnya. The counter-terrorist operation ends when it reaches zero."
 rus_l90_insurgency_regroup_tt:0 "Militants regroup in the mountains"
 rus_l90_insurgency_chechenization_tt:0 "[concept_rus_chechenization]"
 rus_l90_insurgency_rebuilding_tt:0 "Reconstruction of Grozny"
 rus_l90_insurgency_sweeps_backlash_tt:0 "Backlash from the sweeps"
 rus_l90_insurgency_garrison_tt:0 "Permanent garrison"
 rus_l90_union_bar:0 "Integration"
 rus_l90_union_bar_desc:0 "Months of good relations toward the next step of the [concept_rus_union_state]. When the bar is full, Minsk is asked to sign the next treaty and the bar starts again. There are three treaties: the Community, the Union and the [concept_rus_union_state]. When Minsk signs the third, this entry is complete."
 rus_l90_union_relations_good_tt:0 "Relations with Belarus are Amicable or better"
 rus_l90_union_relations_bad_tt:0 "Relations with Belarus are worse than Cordial"
 rus_l90_union_byl_hostile_tt:0 "Belarus is led by an opponent of integration"
 je_rus_ichkeria:0 "The Ichkeria Question"
 je_rus_ichkeria_reason:0 "[concept_rus_ichkeria] governs itself, but nobody knows for how long. Its president controls Grozny and little else. In the mountains, field commanders answer to no one, kidnapping has become an industry, and foreign volunteers preach a harder faith than Chechnya has ever known.\n\nKeep [concept_rus_radicalisation] down and Ichkeria may become a quiet, if unrecognised, neighbour, or even one we can let go. Let it climb and the war will come to us."
 rus_l90_ichkeria_status_low:0 "[concept_rus_radicalisation]: #bold [GetGlobalVariable('ichkeria_radicalisation').GetValue|0]#!. The government in Grozny still holds the field commanders in check."
 rus_l90_ichkeria_status_medium:0 "[concept_rus_radicalisation]: #bold [GetGlobalVariable('ichkeria_radicalisation').GetValue|0]#!. The field commanders are slipping out of Grozny's control. Islamist enclaves may soon appear across the border in Dagestan."
 rus_l90_ichkeria_status_high:0 "[concept_rus_radicalisation]: #bold [GetGlobalVariable('ichkeria_radicalisation').GetValue|0]#!. Armed groups openly prepare to carry the fight beyond Chechnya. A raid into Dagestan becomes possible at 65."
 je_rus_ichkeria_recognised_conclusion_desc:0 "Russia has recognised Ichkeria. Grozny has its independence, and Moscow has one fewer war."
 je_rus_ichkeria_war_conclusion_desc:0 "The uneasy peace is over. Russian troops are going back into Chechnya."
 je_cch_ichkeria:0 "Free Ichkeria"
 je_cch_ichkeria_reason:0 "We won the war, or at least we did not lose it. Now we must govern. Grozny is rubble, the treasury is empty and the men who fought for independence do not want to give up their guns.\n\nIf the field commanders and the foreign volunteers take over, Russia will come back. Keep [concept_rus_radicalisation] down and we may yet win recognition."
 cch_l90_ichkeria_status_low:0 "[concept_rus_radicalisation]: #bold [GetGlobalVariable('ichkeria_radicalisation').GetValue|0]#!. The government still commands the loyalty of most fighters."
 cch_l90_ichkeria_status_high:0 "[concept_rus_radicalisation]: #bold [GetGlobalVariable('ichkeria_radicalisation').GetValue|0]#!. The field commanders act on their own. Russia is watching."
 je_cch_ichkeria_recognised_conclusion_desc:0 "Russia has recognised our independence. Ichkeria is free."
 je_cch_ichkeria_war_conclusion_desc:0 "Russia has come back. The peace is over."
 je_rus_second_chechen_war:0 "The Second Chechen War"
 je_rus_second_chechen_war_reason:0 "Federal forces are going back into Chechnya. This time Moscow calls it a counter-terrorist operation, not a war.\n\nFirst we must break [concept_rus_ichkeria]'s army and take Grozny. After that comes the long work of hunting the fighters who escape to the mountains, through force, through money, or by handing Chechnya to Chechens who will fight for us."
 rus_l90_second_war_status_war:0 "Federal forces are fighting Ichkeria's army. When Ichkeria falls, the insurgency phase begins."
 rus_l90_second_war_status_insurgency:0 "Ichkeria has fallen, but fighters remain in the mountains. Bring the insurgency down to zero to end the operation."
 je_rus_second_war_pacified_conclusion_desc:0 "The counter-terrorist operation is over. Chechnya is quiet, for now."
 je_rus_second_war_defeat_conclusion_desc:0 "For the second time, Russia has failed to take Chechnya. Ichkeria's independence is now beyond question."
 je_rus_union_state:0 "The Union State"
 je_rus_union_state_reason:0 "Minsk and Moscow are talking about something no two former Soviet republics have tried: putting the Union back together, one treaty at a time.\n\nKeep relations with Belarus warm and each year Minsk will be asked to sign the next step: the Community, then the Union, then the [concept_rus_union_state] itself."
 rus_l90_union_status_0:0 "Next step: the Community of Belarus and Russia."
 rus_l90_union_status_1:0 "We are a Community. Next step: the Union of Belarus and Russia."
 rus_l90_union_status_2:0 "We are a Union. Next step: the [concept_rus_union_state] treaty."
 je_rus_union_state_formed_conclusion_desc:0 "The [concept_rus_union_state] treaty is signed. Russia and Belarus are bound together more closely than any two states since the Soviet Union."
 je_rus_union_state_failed_conclusion_desc:0 "The union has collapsed. Minsk has chosen its own road."
 rus_l90_fund_maskhadov_button:0 "Fund the Government in Grozny"
 rus_l90_fund_maskhadov_button_desc:0 "Send money to the moderate government in Grozny so it can pay its men and keep the field commanders in line."
 rus_l90_fund_maskhadov_tt:0 "For a year, [concept_rus_radicalisation] falls by 2 more each month."
 rus_l90_border_cordon_button:0 "Seal the Chechen Border"
 rus_l90_border_cordon_button_desc:0 "Put interior troops along the administrative border to stop fighters, weapons and hostages moving in and out."
 rus_l90_border_cordon_tt:0 "For a year, [concept_rus_radicalisation] falls by 1 more each month."
 rus_l90_recognise_ichkeria_button:0 "Recognise Ichkeria"
 rus_l90_recognise_ichkeria_button_desc:0 "End the question for good. Recognise Ichkeria as an independent state and close the border for good."
 rus_l90_recognise_ichkeria_tt:0 "Russia recognises [concept_rus_ichkeria]. There will be no second war."
 rus_l90_counter_terror_button:0 "Launch a Counter-Terrorist Operation"
 rus_l90_counter_terror_button_desc:0 "Send federal forces back into Chechnya to destroy the armed groups and restore federal control."
 rus_l90_start_second_war_tt:0 "#negative War with Ichkeria begins.#! The Second Chechen War journal entry opens."
 cch_l90_rein_warlords_button:0 "Rein in the Field Commanders"
 cch_l90_rein_warlords_button_desc:0 "Order the field commanders to disarm their private armies and hand over their hostages."
 cch_l90_rein_warlords_tt:0 "For a year, [concept_rus_radicalisation] falls by 2 more each month."
 cch_l90_welcome_volunteers_button:0 "Welcome Foreign Volunteers"
 cch_l90_welcome_volunteers_button_desc:0 "Let fighters and money from abroad flow in. They will make the army stronger, and Russia more nervous."
 cch_l90_welcome_volunteers_tt:0 "For two years, [concept_rus_radicalisation] rises by 1 more each month."
 rus_l90_chechenization_button:0 "Chechenization"
 rus_l90_chechenization_button_desc:0 "Hand the war to Kadyrov's men. Moscow pays, Chechens fight Chechens."
 rus_l90_chechenization_tt:0 "The insurgency falls by 1.5 each month instead of growing. Costs 0.1% of GDP each month while it lasts. When the operation ends, Chechnya keeps Kadyrov's rule."
 rus_l90_sweeps_button:0 "Order Sweep Operations"
 rus_l90_sweeps_button_desc:0 "Cordon off villages and search them house by house. Effective, and brutal."
 rus_l90_rebuild_grozny_button:0 "Rebuild Grozny"
 rus_l90_rebuild_grozny_button_desc:0 "Pour money into rebuilding the ruined capital to win back the people who still live there."
 rus_l90_rebuild_grozny_tt:0 "For two years, the insurgency falls by 1 more each month."
 rus_l90_garrison_button:0 "Station a Permanent Division"
 rus_l90_garrison_button_desc:0 "Base a full division in Chechnya for good."
 rus_l90_garrison_tt:0 "The insurgency falls by 0.5 more each month for the rest of the operation."
 rus_l90_unlock_ichkeria_tt:0 "The [concept_rus_ichkeria] journal entry opens. Keep an eye on [concept_rus_radicalisation]."
 rus_l90_casus_belli_tt:0 "We now have cause to send federal forces back into Chechnya."
 rus_l90_kadyrov_tt:0 "Unlocks [concept_rus_chechenization] once Ichkeria falls."
 rus_l90_insurgency_start_tt:0 "The insurgency phase begins. Bring the insurgency down to zero to end the operation."
 rus_l90_primakov_dismissed_tt:0 "Primakov leaves government. We need a new [concept_prime_minister]."
 rus_l90_impeachment_bought_tt:0 "Enough deputies change their minds. The vote fails."
 rus_l90_impeachment_regions_tt:0 "The governors lean on their deputies. The vote fails, but the governors will want something in return."
 rus_l90_impeachment_gamble_tt:0 "We let the Duma vote. The lower our legitimacy, the worse the odds."
 rus_l90_found_csto_tt:0 "Every CIS member outside NATO with at least Cordial relations with us joins the [concept_csto]. From now on, if any member is attacked, every other member joins its side."
 rus_l90_join_csto_tt:0 "We join the [concept_csto]. If we are attacked, every other member joins our side, and we join theirs."
 rus_l90_leave_csto_tt:0 "We leave the [concept_csto] and lose its protection. Relations with Moscow fall by 30. We cannot rejoin for five years."
 rus_l90_propose_union_tt:0 "The [concept_rus_union_state] journal entry opens."
 io_csto_defensive_pact_name:0 "CSTO Mutual Defence"
 rus_l90_found_csto:0 "Found the [concept_csto]"
 rus_l90_found_csto_desc:0 "Turn the Collective Security Treaty into a standing alliance under Russian leadership."
 rus_l90_join_csto:0 "Join the [concept_csto]"
 rus_l90_join_csto_desc:0 "Place our security under Moscow's umbrella."
 rus_l90_leave_csto:0 "Leave the [concept_csto]"
 rus_l90_leave_csto_desc:0 "End our military alliance with Russia."
 rus_l90_propose_union_state:0 "Propose a Union with Belarus"
 rus_l90_propose_union_state_desc:0 "Offer Minsk a step by step union, from a community of states to a single Union State."
 rus_l90_khasavyurt_signed:0 "[concept_rus_khasavyurt]"
 rus_l90_khasavyurt_signed_desc:0 "The army calls it a betrayal. The country calls it peace."
 rus_l90_khasavyurt_refused:0 "No Peace in Chechnya"
 rus_l90_khasavyurt_refused_desc:0 "We refused to sign. Troops stand along the border with nothing settled."
 cch_l90_khasavyurt:0 "[concept_rus_khasavyurt]"
 cch_l90_khasavyurt_desc:0 "The Russians have left. For now, Ichkeria is ours."
 cch_l90_war_ruins:0 "Ruins of War"
 cch_l90_war_ruins_desc:0 "Grozny lies in ruins and half the country has fled."
 rus_l90_maskhadov_aid:0 "Aid to Grozny"
 rus_l90_maskhadov_aid_desc:0 "We are paying the government in Grozny to keep its own fighters in line."
 rus_l90_border_cordon:0 "Chechen Border Cordon"
 rus_l90_border_cordon_desc:0 "Interior troops seal the border with Chechnya."
 cch_l90_warlords_reined:0 "Warlords Reined In"
 cch_l90_warlords_reined_desc:0 "The government is forcing the field commanders to disarm. They do not like it."
 cch_l90_foreign_volunteers:0 "Foreign Volunteers"
 cch_l90_foreign_volunteers_desc:0 "Fighters and money from abroad are flowing into Ichkeria."
 cch_l90_recognised:0 "Recognised Independence"
 cch_l90_recognised_desc:0 "Moscow has recognised us. Ichkeria is a state like any other."
 rus_l90_ichkeria_let_go:0 "Ichkeria Let Go"
 rus_l90_ichkeria_let_go_desc:0 "The generals will never forgive us for letting Chechnya go."
 rus_l90_kadar_blockade:0 "Blockade of the Kadar Zone"
 rus_l90_kadar_blockade_desc:0 "Police surround the Islamist villages of Dagestan."
 rus_l90_dagestan_militias:0 "Dagestani Militias"
 rus_l90_dagestan_militias_desc:0 "Villagers in Dagestan have taken up arms to defend their homes."
 rus_l90_dagestan_shaken:0 "Dagestan Shaken"
 rus_l90_dagestan_shaken_desc:0 "The raid into Dagestan went unanswered, and Dagestanis wonder whether Moscow will protect them."
 rus_l90_security_crackdown:0 "Heightened Security"
 rus_l90_security_crackdown_desc:0 "Checkpoints, document checks and police raids are part of everyday life."
 rus_l90_public_inquiry:0 "Public Inquiry"
 rus_l90_public_inquiry_desc:0 "An independent commission is investigating the explosions in full view of the public."
 rus_l90_rally_round_flag:0 "Rallying Around the Flag"
 rus_l90_rally_round_flag_desc:0 "The country has rallied behind the government's tough response."
 cch_l90_kadyrov_split:0 "Kadyrov's Defection"
 cch_l90_kadyrov_split_desc:0 "The Mufti and his men have gone over to the Russians."
 rus_l90_chechenization:0 "[concept_rus_chechenization]"
 rus_l90_chechenization_desc:0 "Chechens loyal to Moscow are taking over the fight."
 rus_l90_sweeps:0 "Sweep Operations"
 rus_l90_sweeps_desc:0 "Villages are cordoned off and searched house by house."
 rus_l90_grozny_rebuilding:0 "Rebuilding Grozny"
 rus_l90_grozny_rebuilding_desc:0 "Cranes are rising over the ruins of Grozny."
 rus_l90_second_defeat:0 "Second Defeat in Chechnya"
 rus_l90_second_defeat_desc:0 "Russia has failed in Chechnya twice. The army and the public are furious."
 rus_l90_chechnya_pacified:0 "Chechnya Pacified"
 rus_l90_chechnya_pacified_desc:0 "The counter-terrorist operation is over and Chechnya is quiet."
 rus_l90_kadyrov_chechnya:0 "Kadyrov's Chechnya"
 rus_l90_kadyrov_chechnya_desc:0 "Chechnya is run by the Kadyrov family. It is quiet, it pays almost no taxes and Moscow does not ask questions."
 rus_l90_primakov_compromise:0 "The Primakov Compromise"
 rus_l90_primakov_compromise_desc:0 "A government the Duma can live with has calmed the country after the crash."
 rus_l90_duma_defied:0 "Defying the Duma"
 rus_l90_duma_defied_desc:0 "The Kremlin forced its candidate on a hostile Duma."
 rus_l90_impeachment_scar:0 "Impeachment Vote"
 rus_l90_impeachment_scar_desc:0 "The Duma voted to impeach the President. The vote did not remove him, but the damage is done."
 rus_l90_unity_bloc:0 "Unity"
 rus_l90_unity_bloc_desc:0 "A new pro-Kremlin bloc, built in a few weeks, is rising in the polls."
 rus_l90_atlantic_turn:0 "The Loop over the Atlantic"
 rus_l90_atlantic_turn_desc:0 "Russia turned its back on Washington when NATO bombs began to fall on Belgrade."
 rus_l90_pristina_dash:0 "The Dash to Pristina"
 rus_l90_pristina_dash_desc:0 "Russian paratroopers reached Pristina airport before NATO did."
 io_csto_member:0 "[concept_csto] Member"
 io_csto_member_desc:0 "We are a member of the [concept_csto]."
 rus_l90_csto_leader:0 "Leader of the [concept_csto]"
 rus_l90_csto_leader_desc:0 "Russia leads a military alliance of former Soviet republics."
 rus_l90_union_community:0 "Community of Belarus and Russia"
 rus_l90_union_community_desc:0 "Russia and Belarus have agreed to coordinate their economies and foreign policy."
 rus_l90_union_union:0 "Union of Belarus and Russia"
 rus_l90_union_union_desc:0 "Russia and Belarus have formed a Union with common goals and shared institutions."
 rus_l90_union_state:0 "[concept_rus_union_state]"
 rus_l90_union_state_desc:0 "Russia and Belarus are bound together in a single Union State."
 rus_l90.1.t:0 "The [concept_rus_khasavyurt]"
 rus_l90.1.d:0 "The guns have fallen silent in Chechnya. In the Dagestani town of Khasavyurt, our negotiators sit across from the Chechen chief of staff Aslan Maskhadov with a draft agreement. Russian troops will leave Chechnya. The question of its status will be put off for five years.\n\nThe generals call it a surrender. The mothers of the soldiers call it the first sensible thing anyone in Moscow has done in two years."
 rus_l90.1.f:0 ""We will decide in five years. Perhaps by then both sides will have learned something.""
 rus_l90.1.a:0 "Sign the accord"
 rus_l90.1.b:0 "We sign nothing"
 rus_l90.2.t:0 "The Russians Have Left"
 rus_l90.2.d:0 "The last Russian columns have crossed the border. Ichkeria is ours, at least for now. Grozny is a ruin, half the country has fled and the men who won the war are in no hurry to put down their guns."
 rus_l90.2.a:0 "Now we must build a state"
 rus_l90.3.t:0 "Elections in Ichkeria"
 rus_l90.3.d:0 "Ichkeria goes to the polls to choose a president. Foreign observers have come to watch. The chief of staff Aslan Maskhadov, the man who negotiated the peace, is the favourite. The field commander Shamil Basayev, famous for the raid on Budennovsk, is running too."
 rus_l90.3.f:0 "Observers from the OSCE judged the January 1997 election in Chechnya largely free and fair."
 rus_l90.3.a:0 "Maskhadov wins"
 rus_l90.3.b:0 "Basayev wins"
 rus_l90.3.c:0 "The vote changes nothing"
 rus_l90.5.t:0 "Hostages in the Caucasus"
 rus_l90.5.d:0 "Another group of hostages has been seized near the Chechen border: two engineers, a journalist and a local official. The kidnappers want money, and they have already sent a video to prove the hostages are alive."
 rus_l90.5.a:0 "Pay quietly"
 rus_l90.5.b:0 "We do not negotiate"
 rus_l90.5.c:0 "Send in the special forces"
 rus_l90.6.t:0 "The Kadar Zone"
 rus_l90.6.d:0 "In the Dagestani villages of Karamakhi and Chabanmakhi, a group of Islamist preachers has expelled the local police, set up its own courts and declared the villages a separate Islamic territory. Armed men from across the Chechen border come and go freely."
 rus_l90.6.a:0 "Leave them be for now"
 rus_l90.6.b:0 "Surround the villages"
 rus_l90.7.t:0 "The Ichkeria Question"
 rus_l90.7.d:0 "Chechnya has governed itself for years now, and we have never sent the army to stop it. Grozny's government is weak, the field commanders are strong and the border is full of holes. Sooner or later Moscow will have to decide what Ichkeria is to us."
 rus_l90.7.a:0 "We will watch it closely"
 rus_l90.10.t:0 "Incursion into Dagestan"
 rus_l90.10.d:0 "Several hundred armed men have crossed from Chechnya into the mountains of western Dagestan and seized a string of villages around Botlikh. They have proclaimed an Islamic state and called on Dagestanis to rise. Local police are outgunned. The villagers, to the surprise of many, are fighting back."
 rus_l90.10.f:0 "In August 1999, armed groups crossed from Chechnya into the Botlikh and Tsumadi districts of Dagestan."
 rus_l90.10.a:0 "Send in federal forces"
 rus_l90.10.b:0 "Arm the Dagestani militias"
 rus_l90.10.c:0 "Negotiate their withdrawal"
 rus_l90.11.t:0 "Explosions in the Night"
 rus_l90.11.d:0 "In the space of two weeks, bombs have destroyed apartment buildings while their residents slept: a block for military families in Buynaksk, a building on Guryanova Street in Moscow, another on the Kashirskoye Highway in Moscow, and one in Volgodonsk. Nearly three hundred people are dead and more than a thousand injured.\n\nThe country is in shock. People are sleeping in the courtyards rather than in their flats, and neighbours are patrolling the stairwells at night. Everyone is waiting to see what the government will do."
 rus_l90.11.a:0 "Strike at the bases in Chechnya"
 rus_l90.11.b:0 "Tighten security at home"
 rus_l90.11.c:0 "Call for a full public inquiry"
 rus_l90.12.t:0 "The Russians Are Coming Back"
 rus_l90.12.d:0 "Russian columns are rolling toward the border again. This time Moscow does not call it a war. It calls it a counter-terrorist operation, and it does not intend to stop halfway."
 rus_l90.12.a:0 "We have done this before"
 rus_l90.13.t:0 "The Mufti Changes Sides"
 rus_l90.13.d:0 "Akhmad Kadyrov, the Mufti of Ichkeria who once declared holy war on Russia, has broken with the field commanders over the rise of the foreign Islamists. He has let it be known that Gudermes will not resist, and that he is ready to talk to Moscow."
 rus_l90.13.f:0 ""I fought the Russians once. Now I see a greater danger to my people.""
 rus_l90.13.a:0 "Make him our man in Chechnya"
 rus_l90.13.b:0 "No deals with former rebels"
 rus_l90.14.t:0 "Attack in the North Caucasus"
 rus_l90.14.d:0 "Militants have attacked a police checkpoint in the North Caucasus, killing several officers before slipping back into the forest. It is the third such attack this month."
 rus_l90.14.a:0 "Step up the hunt"
 rus_l90.14.b:0 "Avoid heavy-handed reprisals"
 rus_l90.15.t:0 "Grozny Has Fallen"
 rus_l90.15.d:0 "The federal flag flies over the ruins of Grozny. Ichkeria's government has fled, and its army has broken up. But thousands of fighters have melted into the mountains and the forests, and the hard part is only beginning."
 rus_l90.15.a:0 "Now we hunt them down"
 rus_l90.20.t:0 "The Duma Says No"
 rus_l90.20.d:0 "With the ruble in free fall and the banks shut, the President has asked the Duma to approve a new [concept_prime_minister]. The deputies have made it clear they will not accept another Kremlin loyalist. There is one man both sides might live with: Yevgeny Primakov, the foreign minister, a former spy chief respected by communists and liberals alike."
 rus_l90.20.f:0 "Primakov was confirmed by the Duma on 11 September 1998 with 317 votes."
 rus_l90.20.a:0 "Nominate Primakov"
 rus_l90.20.b:0 "Force Chernomyrdin through"
 rus_l90.20.c:0 "Wait them out"
 rus_l90.21.t:0 "Primakov and the Family"
 rus_l90.21.d:0 "Prime Minister Primakov has stabilised the economy, and the country trusts him more than it trusts the President. Now his prosecutors have begun asking questions about Kremlin contracts and about Boris Berezovsky. The President's inner circle is alarmed and wants him gone."
 rus_l90.21.a:0 "Dismiss him"
 rus_l90.21.b:0 "Let him continue"
 rus_l90.22.t:0 "The Governors' Bloc"
 rus_l90.22.d:0 "Moscow mayor Yuri Luzhkov and a coalition of powerful regional governors have formed Fatherland and All Russia, a bloc that intends to win the Duma and then the Kremlin. The Kremlin has no party of its own to stand against them."
 rus_l90.22.a:0 "Build a party of our own"
 rus_l90.22.b:0 "Make peace with Luzhkov"
 rus_l90.22.c:0 "Ignore them"
 rus_l90.23.t:0 "Five Charges"
 rus_l90.23.d:0 "The Duma has brought five articles of impeachment against the President: the breakup of the Soviet Union, the shelling of parliament in 1993, the war in Chechnya, the collapse of the army and the \"genocide of the Russian people\" through economic reform. The vote is set for this week."
 rus_l90.23.f:0 "On 15 May 1999 no charge reached the 300 votes needed."
 rus_l90.23.a:0 "Make sure the votes are not there"
 rus_l90.23.b:0 "Lean on the governors"
 rus_l90.23.c:0 "Let the Duma decide"
 rus_l90.30.t:0 "Bombs over Belgrade"
 rus_l90.30.d:0 "NATO aircraft have begun bombing Yugoslavia. Moscow was not asked and was not told. Across Russia, crowds are gathering outside the American embassy."
 rus_l90.30.d_primakov:0 "Prime Minister Primakov was flying to Washington when he was told that NATO had begun bombing Yugoslavia. Over the Atlantic, he must decide whether to continue to Washington or turn the plane around."
 rus_l90.30.a:0 "Turn around"
 rus_l90.30.b:0 "Keep the channels open"
 rus_l90.31.t:0 "The Road to Pristina"
 rus_l90.31.d:0 "The war in Kosovo is over and NATO troops are about to enter the province. A battalion of Russian paratroopers serving with the peacekeepers in Bosnia is ready to drive through the night and seize Pristina airport before NATO gets there."
 rus_l90.31.a:0 "Go"
 rus_l90.31.b:0 "Join the peacekeepers on NATO's terms"
 rus_l90.40.t:0 "The [concept_csto]"
 rus_l90.40.d:0 "Moscow has turned the Collective Security Treaty into a standing alliance, and we have signed. An attack on any member will now be treated as an attack on Russia."
 rus_l90.40.a:0 "We are not alone"
 rus_l90.41.t:0 "Moscow Proposes a Union"
 rus_l90.41.d_0:0 "Moscow is ready to sign the first step of a union between our two countries: a Community of Belarus and Russia, coordinating our economies and our foreign policy."
 rus_l90.41.d_1:0 "Moscow proposes to deepen the Community into a Union of Belarus and Russia, with shared goals and common institutions."
 rus_l90.41.d_2:0 "Moscow is ready to sign the last step: a treaty creating a single Union State of Belarus and Russia."
 rus_l90.41.a:0 "Sign"
 rus_l90.41.b:0 "Not yet"
 rus_l90.41.c:0 "Walk away from the union"
 rus_l90.42.t:0 "Minsk Signs"
 rus_l90.42.d_1:0 "Belarus has signed the treaty creating the Community of Belarus and Russia."
 rus_l90.42.d_2:0 "Belarus has signed the treaty creating the Union of Belarus and Russia."
 rus_l90.42.d_3:0 "Belarus has signed the [concept_rus_union_state] treaty."
 rus_l90.42.a:0 "Excellent"
 smd_cn_akhmad:0 "Akhmad"
 smd_cn_kadyrov:0 "Kadyrov"
 second_chechen_war:0 "Second Chechen War"
 io_csto_name:0 "Collective Security Treaty Organization"
 io_csto_desc:0 "A Russian-led military alliance of former Soviet republics. If any member is attacked from outside the alliance, every other member joins the war on its side. Only CIS members outside NATO with at least Cordial relations with Russia may join. A country that leaves cannot rejoin for five years."
 io_mod_csto_pact:0 "Defensive pact with Russia"
 RUS_L90_CSTO_IN_CIS:0 "We are a member of the CIS"
 NOT_RUS_L90_CSTO_IN_CIS:0 "We are not a member of the CIS"
