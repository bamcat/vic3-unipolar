l_polish:

 smd_news_hist.1.t:0 "DENG TOURS THE SOUTH, CALLS FOR REFORM"
 smd_news_hist.1.d:0 "Deng Xiaoping has set out on a closely watched tour of the special economic zones of southern [ROOT.Var('smd_news_hist_1_news_source_country_ref').GetCountry.GetNameNoFlag]. In [ROOT.Var('smd_news_hist_1_news_event_state_ref').GetState.GetName] and beyond, he has urged party officials to press ahead with market reform and to stop debating whether each measure is socialist or capitalist. Hardliners in Beijing have so far kept silent. Foreign investors are reading every word. Diplomats in Hong Kong report a rush of enquiries from foreign firms hoping to expand."
 smd_news_hist.1.f:0 "FROM SHENZHEN: Factory managers lined the route of the motorcade, and local officials say the visit has already settled arguments that Beijing had left open for years."
 smd_news_hist.1.a:0 "The reformers have their champion."

 smd_news_hist.2.t:0 "RIOTS ENGULF LOS ANGELES"
 smd_news_hist.2.d:0 "The acquittal of the police officers charged in the beating of Rodney King has set Los Angeles alight. Crowds have poured into the streets, stores are burning and looting has spread across whole districts of [ROOT.Var('smd_news_hist_2_news_event_state_ref').GetState.GetName]. Officials in [ROOT.Var('smd_news_hist_2_news_source_country_ref').GetCountry.GetNameNoFlag] are struggling to restore order as the damage climbs past a billion dollars. Television pictures of the violence are being broadcast around the world. Community leaders are pleading for calm while the city counts its dead and injured."
 smd_news_hist.2.f:0 "FROM SOUTH CENTRAL: Smoke hangs over whole blocks, shopkeepers stand guard on their roofs, and the National Guard is moving into the city."
 smd_news_hist.2.a:0 "A city in flames."

 smd_news_hist.3.t:0 "SARAJEVO UNDER SIEGE"
 smd_news_hist.3.d:0 "Reports from [ROOT.Var('smd_news_hist_3_news_event_state_ref').GetState.GetName] describe a city encircled, its streets under constant shelling and its people short of food, water and medicine. Forces aligned with [ROOT.Var('smd_news_hist_3_news_source_country_ref').GetCountry.GetNameNoFlag] hold the hills around the Bosnian capital. Foreign governments have condemned the siege and investigators are already gathering evidence of war crimes. Relief convoys are being turned back at checkpoints, and the city's hospitals are working without power. Diplomats in Geneva and New York are pressing for a ceasefire, but the fighting around the city shows no sign of easing."
 smd_news_hist.3.f:0 "FROM SARAJEVO: Residents dash across intersections watched by snipers, and the queues for water form long before dawn."
 smd_news_hist.3.a:0 "Europe has a war on its doorstep."

 smd_news_hist.4.t:0 "HURRICANE ANDREW FLATTENS SOUTH FLORIDA"
 smd_news_hist.4.d:0 "Hurricane Andrew has made landfall in [ROOT.Var('smd_news_hist_4_news_event_state_ref').GetState.GetName] with winds of more than 165 miles per hour. Whole communities south of Miami have been reduced to splinters, and tens of thousands are homeless. Disaster officials in [ROOT.Var('smd_news_hist_4_news_source_country_ref').GetCountry.GetNameNoFlag] warn that this may prove one of the costliest storms in the nation's history. The National Guard has been deployed to keep order and distribute water, food and tents. Insurance companies are bracing for claims on a scale they have never faced, and several smaller insurers may not survive."
 smd_news_hist.4.f:0 "FROM HOMESTEAD: Residents are picking through what remains of their homes while relief convoys struggle along roads blocked by debris."
 smd_news_hist.4.a:0 "A disaster of terrible scale."

 smd_news_hist.5.t:0 "CZECHOSLOVAKIA DISSOLVED"
 smd_news_hist.5.d:0 "Czechoslovakia is no more. In its place stand two new states, [ROOT.Var('smd_news_hist_5_news_source_country_ref').GetCountry.GetNameNoFlag] and [ROOT.Var('smd_news_hist_5_news_other_country_ref').GetCountry.GetNameNoFlag], after the federal parliament agreed to dissolve the union. The separation was negotiated rather than fought, and no shots have been fired. Crowds in [ROOT.Var('smd_news_hist_5_news_event_state_ref').GetState.GetName] watched the federal flag come down with more resignation than celebration. Both governments have promised to keep close economic ties and an open border, and the division of federal property is under way."
 smd_news_hist.5.f:0 "FROM PRAGUE: There were no celebrations at midnight, only a quiet change of flags on public buildings and a sense that something had ended."
 smd_news_hist.5.a:0 "Two nations where there was one."

 smd_news_hist.6.t:0 "CZECHOSLOVAKIA HOLDS TOGETHER"
 smd_news_hist.6.d:0 "The constitutional crisis in [ROOT.Var('smd_news_hist_6_news_source_country_ref').GetCountry.GetNameNoFlag] has passed without a break-up. A new settlement grants Slovakia greater autonomy and rebalances the federal budget, but the common state survives. Politicians in [ROOT.Var('smd_news_hist_6_news_event_state_ref').GetState.GetName] are calling it a hard-won compromise. Not everyone in Bratislava is convinced it will last. Federal ministers have pledged to honour the new arrangements on taxation and investment, and the currency remains shared. Foreign governments welcomed the outcome, which avoids the cost and uncertainty of a separation."
 smd_news_hist.6.f:0 "FROM BRATISLAVA: Nationalists grumble that the compromise gives too little, but most citizens seem relieved that the crisis is over."
 smd_news_hist.6.a:0 "The union endures."

 smd_news_hist.7.t:0 "BOMB ROCKS WORLD TRADE CENTER"
 smd_news_hist.7.d:0 "A truck bomb has exploded in the parking garage beneath the North Tower of the World Trade Center in [ROOT.Var('smd_news_hist_7_news_event_state_ref').GetState.GetName], killing six people and injuring more than a thousand. Thousands of office workers were led down smoke-filled stairwells. Investigators in [ROOT.Var('smd_news_hist_7_news_source_country_ref').GetCountry.GetNameNoFlag] say the attack exposes how vulnerable the country is to terrorism at home. The city's police department and federal agents have launched a manhunt for those responsible. Security at public buildings, airports and landmarks across the country is being tightened."
 smd_news_hist.7.f:0 "FROM LOWER MANHATTAN: Office workers emerged from the towers with faces blackened by smoke, and investigators are already sifting the wreckage of the garage."
 smd_news_hist.7.a:0 "Terror strikes New York."

 smd_news_hist.8.t:0 "CLEAN HANDS PROBE SHAKES ITALY"
 smd_news_hist.8.d:0 "Magistrates in [ROOT.Var('smd_news_hist_8_news_event_state_ref').GetState.GetName] have gone public with the evidence of a vast system of kickbacks on public contracts in [ROOT.Var('smd_news_hist_8_news_source_country_ref').GetCountry.GetNameNoFlag]. The newspapers call it Tangentopoli, Bribesville. Party treasurers, ministers and industrialists are receiving notices of investigation, and the parties that governed the Republic for decades are in open panic. Business leaders are cancelling public appearances, and some party offices have been shuttered as treasurers are arrested. Public anger is turning against the entire political class, and the magistrates have become popular heroes."
 smd_news_hist.8.f:0 "FROM MILAN: The courthouse steps are crowded with reporters each morning, waiting to learn which politician will be named next."
 smd_news_hist.8.a:0 "The old order trembles."

 smd_news_hist.9.t:0 "GREAT FLOOD SWAMPS THE MIDWEST"
 smd_news_hist.9.d:0 "Weeks of heavy rain have pushed the Mississippi and Missouri rivers far beyond their banks, submerging towns and farmland across the American Midwest. Levees have failed in [ROOT.Var('smd_news_hist_9_news_event_state_ref').GetState.GetName] and neighbouring states, and tens of thousands have been evacuated. Federal officials in [ROOT.Var('smd_news_hist_9_news_source_country_ref').GetCountry.GetNameNoFlag] describe the damage as unprecedented. Agricultural losses are expected to run into billions of dollars, and river traffic on the Mississippi has come to a halt. Volunteers from across the country are arriving to help fill sandbags."
 smd_news_hist.9.f:0 "FROM ST. LOUIS: Sandbag walls line the riverfront, and farmers watch their fields disappear under brown water."
 smd_news_hist.9.a:0 "The waters are still rising."

 smd_news_hist.10.t:0 "TANKS SHELL PARLIAMENT IN MOSCOW"
 smd_news_hist.10.d:0 "The standoff between the President and the Supreme Soviet of [ROOT.Var('smd_news_hist_10_news_source_country_ref').GetCountry.GetNameNoFlag] has ended in gunfire. Army tanks have shelled the White House in [ROOT.Var('smd_news_hist_10_news_event_state_ref').GetState.GetName], and the parliament's defenders have surrendered. The death toll is still unknown. The President has promised a new constitution and fresh elections. Hundreds of people are reported dead or wounded in the fighting around the parliament and the television centre. Leaders of the uprising have been taken into custody."
 smd_news_hist.10.f:0 "FROM THE MOSKVA EMBANKMENT: Crowds gathered on the bridges to watch the shells strike the upper floors of the parliament building."
 smd_news_hist.10.a:0 "Moscow's October has ended in blood."

 smd_news_hist.11.t:0 "THE EUROPEAN UNION IS BORN"
 smd_news_hist.11.d:0 "The Maastricht Treaty has entered into force and the European Union has formally come into being. The new Union builds on the old Economic Community with common policies on foreign affairs, justice and, in time, a single currency. Officials gathered in [ROOT.Var('smd_news_hist_11_news_event_state_ref').GetState.GetName] spoke of a new chapter for the continent. Sceptics in several member states are less enthusiastic. European leaders gathered for a ceremony marking the occasion, and citizens of the member states now share a common citizenship of the Union."
 smd_news_hist.11.f:0 "FROM MAASTRICHT: Officials toasted the treaty with quiet satisfaction, though in several capitals opposition parties are already campaigning against it."
 smd_news_hist.11.a:0 "A new Europe takes shape."

 smd_news_hist.12.t:0 "OSLO ACCORD SIGNED"
 smd_news_hist.12.d:0 "[ROOT.Var('smd_news_hist_12_news_source_country_ref').GetCountry.GetNameNoFlag] and [ROOT.Var('smd_news_hist_12_news_other_country_ref').GetCountry.GetNameNoFlag] have accepted a Declaration of Principles providing for mutual recognition and an interim Palestinian self-government. The agreement, negotiated in secret in Norway, opens a five-year process toward a final settlement. In [ROOT.Var('smd_news_hist_12_news_event_state_ref').GetState.GetName] the news has been met with hope, suspicion and, in places, open anger. The leaders of both sides are expected to meet abroad to mark the occasion, and foreign governments have promised aid to support the new arrangements."
 smd_news_hist.12.f:0 "FROM THE WEST BANK: In some towns people handed olive branches to soldiers; in others, posters denounced the agreement as surrender."
 smd_news_hist.12.a:0 "Peace has a chance."

 smd_news_hist.13.t:0 "DOWNING STREET DECLARATION ISSUED"
 smd_news_hist.13.d:0 "The governments of [ROOT.Var('smd_news_hist_13_news_source_country_ref').GetCountry.GetNameNoFlag] and [ROOT.Var('smd_news_hist_13_news_other_country_ref').GetCountry.GetNameNoFlag] have issued a joint declaration affirming that the future of Northern Ireland is for its people to decide. The statement invites parties that renounce violence to join talks. In [ROOT.Var('smd_news_hist_13_news_event_state_ref').GetState.GetName], politicians on both sides are studying the text closely, and the paramilitaries have yet to respond. Paramilitary groups on both sides are being urged to declare ceasefires so their political representatives can take part in negotiations."
 smd_news_hist.13.f:0 "FROM BELFAST: In the pubs and on the doorsteps people are reading the declaration line by line, and few are willing to say what they make of it."
 smd_news_hist.13.a:0 "A door has opened."

 smd_news_hist.14.t:0 "EARTHQUAKE STRIKES LOS ANGELES"
 smd_news_hist.14.d:0 "A magnitude 6.7 earthquake has struck the San Fernando Valley before dawn, collapsing freeways, apartment blocks and a parking structure across [ROOT.Var('smd_news_hist_14_news_event_state_ref').GetState.GetName]. Dozens are dead and thousands injured. Engineers in [ROOT.Var('smd_news_hist_14_news_source_country_ref').GetCountry.GetNameNoFlag] warn that the repair bill will run into tens of billions of dollars. Thousands of buildings have been declared unsafe and power and water have been cut to large parts of the region. Emergency shelters are filling with families afraid to return home. Engineers are asking hard questions about why structures built to earthquake standards failed so badly."
 smd_news_hist.14.f:0 "FROM THE SAN FERNANDO VALLEY: Collapsed overpasses have cut the freeways, and families are camping in parks for fear of aftershocks."
 smd_news_hist.14.a:0 "A city shaken."

 smd_news_hist.15.t:0 "MASSACRES SWEEP RWANDA"
 smd_news_hist.15.d:0 "Following the death of the President in a plane crash, extremist militias in [ROOT.Var('smd_news_hist_15_news_source_country_ref').GetCountry.GetNameNoFlag] have begun systematic killings of the Tutsi minority and of moderate Hutu. Aid workers in [ROOT.Var('smd_news_hist_15_news_event_state_ref').GetState.GetName] describe roadblocks where people are killed for the ethnicity on their identity cards. Neighbouring countries are bracing for a flood of refugees fleeing the violence. Humanitarian organisations warn that the killing is organised and systematic, and that the death toll could reach hundreds of thousands."
 smd_news_hist.15.f:0 "FROM KIGALI: Correspondents who escaped the capital describe bodies on the roads and radio broadcasts urging the killers on."
 smd_news_hist.15.a:0 "The world looks away."

 smd_news_hist.16.t:0 "RUSSIAN ARMOUR ROLLS INTO CHECHNYA"
 smd_news_hist.16.d:0 "[ROOT.Var('smd_news_hist_16_news_source_country_ref').GetCountry.GetNameNoFlag] has sent its army into Chechnya to restore federal control over the breakaway republic. Columns of armour are moving through [ROOT.Var('smd_news_hist_16_news_event_state_ref').GetState.GetName] toward Grozny. The Defence Ministry promises a swift operation, but the mountains and the determination of the Chechen fighters suggest otherwise. Casualties are already heavier than the generals predicted, and the first reports of civilian deaths in the bombardment of the capital are reaching Moscow. Human rights groups are demanding access to the war zone."
 smd_news_hist.16.f:0 "FROM GROZNY: The first columns entered the outskirts to find barricades, burning vehicles and fighters who knew every street."
 smd_news_hist.16.a:0 "War in the Caucasus."

 smd_news_hist.17.t:0 "BUDAPEST MEMORANDUM SIGNED"
 smd_news_hist.17.d:0 "At the security summit in [ROOT.Var('smd_news_hist_17_news_event_state_ref').GetState.GetName], the United States, the United Kingdom and Russia have signed security assurances for [ROOT.Var('smd_news_hist_17_news_source_country_ref').GetCountry.GetNameNoFlag]. In return the country will give up the nuclear warheads left on its soil and join the Non-Proliferation Treaty as a non-nuclear state. Arms control experts call it a landmark. Critics ask what the assurances will be worth in a crisis. The agreement removes one of the world's largest nuclear arsenals from a country that never sought to build it."
 smd_news_hist.17.f:0 "FROM BUDAPEST: Diplomats signed beneath the chandeliers while experts outside debated how long the promises would hold."
 smd_news_hist.17.a:0 "The arsenal will be dismantled."

 smd_news_hist.18.t:0 "TROOPS LAND IN HAITI"
 smd_news_hist.18.d:0 "Forces of [ROOT.Var('smd_news_hist_18_news_source_country_ref').GetCountry.GetNameNoFlag] have landed in [ROOT.Var('smd_news_hist_18_news_other_country_ref').GetCountry.GetNameNoFlag] to restore the elected government overthrown in the 1991 coup. Helicopters are ferrying troops into [ROOT.Var('smd_news_hist_18_news_event_state_ref').GetState.GetName] as the military junta steps aside. Washington promises that the operation will be brief and that democracy will be restored. The deposed leaders have been offered safe passage abroad, and the elected President is expected to return within weeks. Aid agencies are preparing to resume operations that had been suspended under the military government."
 smd_news_hist.18.f:0 "FROM PORT-AU-PRINCE: Crowds lined the roads to watch the helicopters come in, and soldiers of the junta have quietly left their posts."
 smd_news_hist.18.a:0 "The junta yields."

 smd_news_hist.19.t:0 "BOMB DESTROYS FEDERAL BUILDING IN OKLAHOMA CITY"
 smd_news_hist.19.d:0 "A truck bomb has torn the face off the Alfred P. Murrah Federal Building in [ROOT.Var('smd_news_hist_19_news_event_state_ref').GetState.GetName], killing 168 people, among them children at the building's day care centre. Investigators say the suspects are citizens of [ROOT.Var('smd_news_hist_19_news_source_country_ref').GetCountry.GetNameNoFlag] driven by hatred of the federal government. It is the deadliest act of domestic terrorism in the nation's history. The federal government has offered every resource to the search and rescue effort. Security at federal buildings across the country is being reviewed, and the investigation has already led to arrests."
 smd_news_hist.19.f:0 "FROM OKLAHOMA CITY: Rescue workers are still searching the ruins, and the city has fallen silent around the shattered building."
 smd_news_hist.19.a:0 "A nation mourns."

 smd_news_hist.20.t:0 "MASSACRE REPORTED AT SREBRENICA"
 smd_news_hist.20.d:0 "Reports are emerging of mass killings after forces aligned with [ROOT.Var('smd_news_hist_20_news_source_country_ref').GetCountry.GetNameNoFlag] overran the United Nations safe area at Srebrenica in [ROOT.Var('smd_news_hist_20_news_event_state_ref').GetState.GetName]. Thousands of men and boys are missing. International investigators are demanding access, and governments around the world have condemned the killings. Survivors' accounts are reaching the outside world through refugees and aid workers. The United Nations peacekeepers who were meant to protect the town are facing intense criticism."
 smd_news_hist.20.f:0 "FROM TUZLA: Survivors arriving at the camps describe columns of men led away and never seen again."
 smd_news_hist.20.a:0 "The world demands answers."

 smd_news_hist.21.t:0 "QUEBEC VOTES NO"
 smd_news_hist.21.d:0 "Voters in [ROOT.Var('smd_news_hist_21_news_event_state_ref').GetState.GetName] have rejected sovereignty and chosen to remain part of [ROOT.Var('smd_news_hist_21_news_source_country_ref').GetCountry.GetNameNoFlag]. Turnout was enormous and the debate bitter. Federalists are celebrating, but separatist leaders say the question is far from settled. The margin was narrow, and the losing side has promised to keep fighting for its cause. Federal politicians are pledging to address the grievances that brought the province so close to leaving. Markets that fell in the days before the vote have recovered some of their losses."
 smd_news_hist.21.f:0 "FROM MONTREAL: The final count was watched in silence at both campaign headquarters, and the winning side celebrated with more relief than joy."
 smd_news_hist.21.a:0 "Canada remains whole."

 smd_news_hist.22.t:0 "QUEBEC VOTES TO LEAVE CANADA"
 smd_news_hist.22.d:0 "Voters in [ROOT.Var('smd_news_hist_22_news_event_state_ref').GetState.GetName] have chosen sovereignty, and [ROOT.Var('smd_news_hist_22_news_source_country_ref').GetCountry.GetNameNoFlag] has declared its independence from [ROOT.Var('smd_news_hist_22_news_other_country_ref').GetCountry.GetNameNoFlag]. Crowds in Montreal are waving the fleur-de-lis, while Ottawa faces the break-up of the country. Negotiations over borders, debt and currency will begin at once. Federal and provincial leaders now face the task of negotiating how a separation will work in practice. Indigenous nations in the north of the province insist that they will not be bound by the result."
 smd_news_hist.22.f:0 "FROM MONTREAL: Fireworks rose over the old port as the result was announced, while the federal government called an emergency cabinet meeting."
 smd_news_hist.22.a:0 "A new country in North America."

 smd_news_hist.23.t:0 "SECOND OSLO AGREEMENT SIGNED"
 smd_news_hist.23.d:0 "[ROOT.Var('smd_news_hist_23_news_source_country_ref').GetCountry.GetNameNoFlag] and [ROOT.Var('smd_news_hist_23_news_other_country_ref').GetCountry.GetNameNoFlag] have signed the Interim Agreement, the next stage of the Oslo process. Palestinian self-government will be expanded across parts of the West Bank, divided into zones of differing control. In [ROOT.Var('smd_news_hist_23_news_event_state_ref').GetState.GetName], supporters call it progress and opponents on both sides call it a betrayal. Security coordination between the two sides is expected to expand under the new arrangements. Settlers and militants have both promised to resist the agreement, and the coming months will test whether it can survive."
 smd_news_hist.23.f:0 "FROM JERUSALEM: Supporters spoke of momentum, but security forces are preparing for the protests that each new agreement now brings."
 smd_news_hist.23.a:0 "The process moves forward."

 smd_news_hist.24.t:0 "MASSACRE AT DUNBLANE SCHOOL"
 smd_news_hist.24.d:0 "A gunman has entered the primary school at Dunblane in [ROOT.Var('smd_news_hist_24_news_event_state_ref').GetState.GetName] and killed sixteen children and their teacher before turning the gun on himself. It is the deadliest shooting in the history of [ROOT.Var('smd_news_hist_24_news_source_country_ref').GetCountry.GetNameNoFlag]. Parents and survivors are already calling for a ban on private handgun ownership. The killings have provoked an outpouring of grief across the country. Messages of sympathy have arrived from governments and ordinary people around the world."
 smd_news_hist.24.f:0 "FROM DUNBLANE: Flowers and teddy bears fill the school gates, and the whole town seems to be in mourning."
 smd_news_hist.24.a:0 "Never again, they say."

 smd_news_hist.25.t:0 "TUPAC SHAKUR DIES AFTER LAS VEGAS SHOOTING"
 smd_news_hist.25.d:0 "The rapper and actor Tupac Shakur has died of gunshot wounds, six days after he was shot in a car at a red light in [ROOT.Var('smd_news_hist_25_news_event_state_ref').GetState.GetName]. He was 25. The gunman escaped and no arrests have been made. Fans across [ROOT.Var('smd_news_hist_25_news_source_country_ref').GetCountry.GetNameNoFlag] have gathered in vigils to mourn him. His death has prompted tributes from fellow artists and public figures, and his albums are selling out across the country. Some commentators blame the bitter rivalry within the music industry for the violence."
 smd_news_hist.25.f:0 "FROM LAS VEGAS: Fans gathered outside the hospital through the night, and police say witnesses are unwilling to talk."
 smd_news_hist.25.a:0 "A voice silenced."

 smd_news_hist.26.t:0 "CEASEFIRE IN CHECHNYA"
 smd_news_hist.26.d:0 "Negotiators for [ROOT.Var('smd_news_hist_26_news_source_country_ref').GetCountry.GetNameNoFlag] and the Chechen separatists have signed an agreement at Khasavyurt in [ROOT.Var('smd_news_hist_26_news_event_state_ref').GetState.GetName]. Russian troops will withdraw from Chechnya, and the question of its status has been postponed for five years. Generals in Moscow call it a surrender. Soldiers' mothers call it the first sensible decision of the war. The Russian army will now begin to withdraw from the republic it entered nearly two years ago. Nationalist politicians in Moscow are denouncing the agreement as a humiliating defeat."
 smd_news_hist.26.f:0 "FROM KHASAVYURT: The delegations shook hands without smiling, and soldiers on both sides fired their rifles into the air at the news."
 smd_news_hist.26.a:0 "The troops are coming home."

 smd_news_hist.27.t:0 "GUN BATTLE IN NORTH HOLLYWOOD"
 smd_news_hist.27.d:0 "Two bank robbers in body armour and armed with automatic rifles have fought a running battle with police in [ROOT.Var('smd_news_hist_27_news_event_state_ref').GetState.GetName]. Outgunned officers borrowed rifles from a nearby gun store before both gunmen were killed. Police chiefs across [ROOT.Var('smd_news_hist_27_news_source_country_ref').GetCountry.GetNameNoFlag] are asking whether patrol officers are equipped for what they now face. Several officers and civilians were wounded in the shootout before both gunmen were killed. The incident has prompted demands that patrol officers be issued heavier weapons and better body armour."
 smd_news_hist.27.f:0 "FROM LOS ANGELES: Television helicopters broadcast the gun battle live, and viewers watched officers drag the wounded behind patrol cars."
 smd_news_hist.27.a:0 "The police are outgunned."

 smd_news_hist.28.t:0 "U.S. EMBASSIES BOMBED IN EAST AFRICA"
 smd_news_hist.28.d:0 "Near simultaneous truck bombs have struck the embassies of [ROOT.Var('smd_news_hist_28_news_source_country_ref').GetCountry.GetNameNoFlag] in Nairobi and Dar es Salaam. More than 200 people are dead, most of them local civilians, and thousands are wounded. A network led by Osama bin Laden is being blamed. Rescue teams in [ROOT.Var('smd_news_hist_28_news_event_state_ref').GetState.GetName] are still digging through the rubble. Officials have pledged to bring those responsible to justice, and intelligence agencies are focusing on networks in Afghanistan and Sudan. Security at diplomatic missions worldwide has been reinforced."
 smd_news_hist.28.f:0 "FROM NAIROBI: Volunteers are digging through the rubble with their bare hands, and hospitals are overwhelmed with the injured."
 smd_news_hist.28.a:0 "Terror reaches Africa."

 smd_news_hist.29.t:0 "AGREEMENT REACHED IN BELFAST"
 smd_news_hist.29.d:0 "After nearly two years of talks, the governments of [ROOT.Var('smd_news_hist_29_news_source_country_ref').GetCountry.GetNameNoFlag] and [ROOT.Var('smd_news_hist_29_news_other_country_ref').GetCountry.GetNameNoFlag] and most of the parties of Northern Ireland have signed an agreement on Good Friday. It creates a power-sharing assembly and cross-border bodies, and confirms that the status of [ROOT.Var('smd_news_hist_29_news_event_state_ref').GetState.GetName] can only change with the consent of its people. Referendums north and south will follow. Voters will now be asked to approve the agreement in referendums on both sides of the border."
 smd_news_hist.29.f:0 "FROM STORMONT: Exhausted negotiators emerged into the morning light after a night of talks, and the bells of nearby churches rang."
 smd_news_hist.29.a:0 "Peace in Northern Ireland."

 smd_news_hist.30.t:0 "RUSSIA DEFAULTS, ROUBLE COLLAPSES"
 smd_news_hist.30.d:0 "The government of [ROOT.Var('smd_news_hist_30_news_source_country_ref').GetCountry.GetNameNoFlag] has stopped paying its short-term debts and let the rouble float. The currency is in free fall. Banks in [ROOT.Var('smd_news_hist_30_news_event_state_ref').GetState.GetName] have shut their doors, depositors are queueing in the rain and imported goods are vanishing from the shelves. Foreign investors are counting their losses. Western governments and international lenders are considering whether to provide emergency support. The crisis is already spreading to other emerging markets."
 smd_news_hist.30.f:0 "FROM MOSCOW: Exchange booths have stopped posting rates, and pensioners are buying whatever is left on the shelves."
 smd_news_hist.30.a:0 "A financial catastrophe."

 smd_news_hist.31.t:0 "YANGTZE FLOODS DEVASTATE CENTRAL CHINA"
 smd_news_hist.31.d:0 "After months of heavy rain the Yangtze and its tributaries have burst their banks across central [ROOT.Var('smd_news_hist_31_news_source_country_ref').GetCountry.GetNameNoFlag]. Soldiers are piling sandbags along the dikes in [ROOT.Var('smd_news_hist_31_news_event_state_ref').GetState.GetName] as millions are driven from their homes. Thousands have died and vast areas of farmland lie under water. Officials warn that the flood season is not yet over and that more rain is forecast. The government has promised massive investment in flood defences once the waters recede. Questions are also being asked about deforestation upstream and its role in the disaster."
 smd_news_hist.31.f:0 "FROM WUHAN: Soldiers and volunteers work through the night on the dikes, and the water is still rising."
 smd_news_hist.31.a:0 "The dikes are holding, barely."

 smd_news_hist.32.t:0 "CRISIS DEEPENS IN KOSOVO"
 smd_news_hist.32.d:0 "Unrest and repression in [ROOT.Var('smd_news_hist_32_news_event_state_ref').GetState.GetName] have turned into a crisis that could draw neighbouring Albania and the NATO alliance into conflict with [ROOT.Var('smd_news_hist_32_news_source_country_ref').GetCountry.GetNameNoFlag]. Villages are emptying as refugees flee the fighting. Western diplomats are demanding an end to the violence. Foreign ministers are meeting to discuss sanctions and the possibility of military action. Neighbouring states are preparing camps for the refugees crossing their borders. Diplomats fear that the conflict could spread across the southern Balkans if it is not contained quickly."
 smd_news_hist.32.f:0 "FROM PRISTINA: Refugees with tractors and carts crowd the roads south, and the international monitors say they cannot guarantee anyone's safety."
 smd_news_hist.32.a:0 "The Balkans burn again."

 smd_news_hist.33.t:0 "NATO BOMBS YUGOSLAVIA"
 smd_news_hist.33.d:0 "NATO aircraft have begun striking targets across [ROOT.Var('smd_news_hist_33_news_source_country_ref').GetCountry.GetNameNoFlag], including the capital at [ROOT.Var('smd_news_hist_33_news_event_state_ref').GetState.GetName]. The alliance says the campaign will continue until Yugoslav forces withdraw from Kosovo. Belgrade has denounced the strikes as aggression, and Moscow has protested loudly. Civilian casualties have been reported, and the bombing has drawn fierce criticism from several governments. Refugees continue to stream out of Kosovo into Albania and Macedonia. Alliance officials insist that the campaign will continue until their demands are met, while Belgrade vows to resist."
 smd_news_hist.33.f:0 "FROM BELGRADE: Residents wore paper targets on their coats at an open-air concert in defiance of the bombers."
 smd_news_hist.33.a:0 "The alliance goes to war."

 smd_news_hist.34.t:0 "MASSACRE AT COLUMBINE HIGH SCHOOL"
 smd_news_hist.34.d:0 "Two heavily armed students have attacked Columbine High School in [ROOT.Var('smd_news_hist_34_news_event_state_ref').GetState.GetName], killing classmates and a teacher before taking their own lives. The attack has stunned [ROOT.Var('smd_news_hist_34_news_source_country_ref').GetCountry.GetNameNoFlag] and set off a national debate over guns, school safety and the culture that produced the killers. Funerals for the victims are drawing thousands of mourners, and schools across the country are reviewing their security. Investigators are examining how the attackers obtained their weapons and explosives. Politicians are debating new restrictions on firearms, though few expect quick agreement."
 smd_news_hist.34.f:0 "FROM LITTLETON: Students ran from the school with their hands raised while police secured the building room by room."
 smd_news_hist.34.a:0 "A nation asks why."

 smd_news_hist.35.t:0 "APARTMENT BLOCKS BOMBED IN MOSCOW"
 smd_news_hist.35.d:0 "A series of bombs has destroyed apartment buildings in [ROOT.Var('smd_news_hist_35_news_event_state_ref').GetState.GetName] and other cities of [ROOT.Var('smd_news_hist_35_news_source_country_ref').GetCountry.GetNameNoFlag], killing almost 300 people as they slept. The authorities blame Chechen separatists, though some observers question the evidence. Public pressure for a decisive military response is enormous. Security services have arrested several suspects and promise more arrests to come. The government is under pressure to respond with force, and troops are reported to be moving toward the Caucasus. Questions about who was really behind the attacks are being asked quietly in the capital."
 smd_news_hist.35.f:0 "FROM MOSCOW: Residents are organising night patrols in apartment buildings, and basements are being searched across the city."
 smd_news_hist.35.a:0 "Fear grips Russia."

 smd_news_hist.36.t:0 "THE WORLD WELCOMES THE YEAR 2000"
 smd_news_hist.36.d:0 "The clocks have passed midnight on the last night of 1999, and the feared millennium bug has failed to bring down the world's computers on any great scale. Crowds in [ROOT.Var('smd_news_hist_36_news_event_state_ref').GetState.GetName] and in capitals around the globe greeted the new year with fireworks. The programmers who spent years patching old code are quietly taking the credit. Governments and businesses spent enormous sums preparing for the date change, and some critics now ask whether the danger was exaggerated."
 smd_news_hist.36.f:0 "FROM AROUND THE WORLD: From Sydney to New York the fireworks went off on schedule, and computer engineers reported a quiet night."
 smd_news_hist.36.a:0 "Happy New Year!"

 smd_news_hist.37.t:0 "USS COLE BOMBED IN ADEN"
 smd_news_hist.37.d:0 "A small boat packed with explosives has blown a hole in the side of the destroyer USS Cole while she refuelled in the port of Aden, in [ROOT.Var('smd_news_hist_37_news_event_state_ref').GetState.GetName]. Seventeen sailors of [ROOT.Var('smd_news_hist_37_news_source_country_ref').GetCountry.GetNameNoFlag] have been killed and dozens injured. The attack is being attributed to al-Qaeda. Investigators have been dispatched to Yemen, and the government has promised that the attackers will be found and punished. The attack has raised questions about the security of warships in foreign ports. Officials are increasingly concerned about the reach of the al-Qaeda network."
 smd_news_hist.37.f:0 "FROM ADEN: Sailors fought for hours to keep the damaged destroyer afloat while the port authorities sealed off the harbour."
 smd_news_hist.37.a:0 "The Navy has been struck."

 smd_news_hist.38.t:0 "UPRISING ERUPTS IN PALESTINE"
 smd_news_hist.38.d:0 "The Palestinian territories have erupted. After years of stalled negotiations, an uprising has broken out across [ROOT.Var('smd_news_hist_38_news_event_state_ref').GetState.GetName], and [ROOT.Var('smd_news_hist_38_news_other_country_ref').GetCountry.GetNameNoFlag] has sent in its forces to put it down. Stone throwing, gunfire and bombings are being reported daily. The peace process appears to be in ruins. Casualties are mounting on both sides, and hospitals report being overwhelmed. Diplomats from Washington, Cairo and Europe are trying to arrange a truce, so far without success. Analysts fear that the gains of the Oslo years may be lost entirely if the fighting continues."
 smd_news_hist.38.f:0 "FROM RAMALLAH: Funerals become demonstrations, and demonstrations become clashes, almost every day."
 smd_news_hist.38.a:0 "The Second Intifada has begun."

 smd_news_hist.39.t:0 "AMERICA UNDER ATTACK"
 smd_news_hist.39.d:0 "Hijacked airliners have been flown into the World Trade Center in [ROOT.Var('smd_news_hist_39_news_event_state_ref').GetState.GetName] and into the Pentagon. Both towers have collapsed. Thousands are feared dead. [ROOT.Var('smd_news_hist_39_news_source_country_ref').GetCountry.GetNameNoFlag] has grounded all civil aviation and the President has vowed that those responsible will be hunted down. Leaders around the world have condemned the attacks and expressed solidarity with the American people. Financial markets have been closed, and airspace over the country has been shut. Intelligence agencies are already pointing to the al-Qaeda network based in Afghanistan."
 smd_news_hist.39.f:0 "FROM NEW YORK: A vast cloud of dust and smoke covers lower Manhattan, and the city's hospitals wait for survivors who are not coming."
 smd_news_hist.39.a:0 "The world will never be the same."

 smd_news_hist.40.t:0 "NATO INVOKES ARTICLE FIVE"
 smd_news_hist.40.d:0 "For the first time in its history, the North Atlantic alliance has invoked Article Five of its founding treaty. An attack on [ROOT.Var('smd_news_hist_40_news_source_country_ref').GetCountry.GetNameNoFlag] is now formally treated as an attack on every member. Allied governments are preparing to support whatever response Washington chooses. Member states are offering military support, intelligence sharing and access to their airspace and bases. Alliance officials say the decision reflects the unity of the Western democracies in the face of terrorism. The details of any military response are still being worked out."
 smd_news_hist.40.f:0 "FROM BRUSSELS: Ambassadors met in emergency session and agreed the decision without dissent."
 smd_news_hist.40.a:0 "The alliance stands together."

 smd_news_hist.41.t:0 "ANTHRAX LETTERS SPREAD FEAR"
 smd_news_hist.41.d:0 "Letters containing anthrax spores have been mailed to newsrooms and to the offices of senators in [ROOT.Var('smd_news_hist_41_news_event_state_ref').GetState.GetName]. Several people have died and post offices across [ROOT.Var('smd_news_hist_41_news_source_country_ref').GetCountry.GetNameNoFlag] are being tested for contamination. Investigators do not yet know who is responsible. Public anxiety is high, and stocks of antibiotics are being distributed to those who may have been exposed. Investigators are examining whether the letters are linked to foreign terrorist groups or a domestic source. The scare has disrupted government work and mail delivery across the country."
 smd_news_hist.41.f:0 "FROM WASHINGTON: Mailrooms in government buildings have been sealed, and staff are lining up for antibiotics."
 smd_news_hist.41.a:0 "A new kind of terror."

 smd_news_hist.42.t:0 "U.S. LAUNCHES WAR IN AFGHANISTAN"
 smd_news_hist.42.d:0 "[ROOT.Var('smd_news_hist_42_news_source_country_ref').GetCountry.GetNameNoFlag] has gone to war against [ROOT.Var('smd_news_hist_42_news_other_country_ref').GetCountry.GetNameNoFlag], whose Taliban rulers refused to surrender the al-Qaeda leadership. Strikes have begun on targets around [ROOT.Var('smd_news_hist_42_news_event_state_ref').GetState.GetName], and ground forces are preparing to follow. Washington says the campaign will last as long as it takes. Allied governments have pledged military and logistical support for the campaign. Aid agencies warn of a humanitarian crisis as refugees flee toward the borders. Officials in Washington say the aim is to destroy al-Qaeda's bases and remove the government that sheltered it."
 smd_news_hist.42.f:0 "FROM KABUL: The night sky flashes with anti-aircraft fire as the first bombing raids strike the city."
 smd_news_hist.42.a:0 "The bombing has begun."

 smd_news_hist.43.t:0 "WAR IN IRAQ"
 smd_news_hist.43.d:0 "With the United Nations divided, [ROOT.Var('smd_news_hist_43_news_source_country_ref').GetCountry.GetNameNoFlag] has gone to war against [ROOT.Var('smd_news_hist_43_news_other_country_ref').GetCountry.GetNameNoFlag]. Cruise missiles and bombers are striking [ROOT.Var('smd_news_hist_43_news_event_state_ref').GetState.GetName], and ground forces are crossing the border. Washington insists that Iraq's weapons programmes leave it no choice. Protesters in cities around the world disagree. Allied governments are divided, and several have refused to take part. Aid agencies are preparing for refugees and civilian casualties."
 smd_news_hist.43.f:0 "FROM BAGHDAD: Explosions light up the city as the first wave of strikes hits government buildings along the Tigris."
 smd_news_hist.43.a:0 "The invasion has begun."

 smd_news_hist.44.t:0 "TSUNAMI DEVASTATES INDIAN OCEAN COASTS"
 smd_news_hist.44.d:0 "A massive undersea earthquake has sent waves crashing onto coasts across South and Southeast Asia. The worst damage has been reported in [ROOT.Var('smd_news_hist_44_news_event_state_ref').GetState.GetName], in [ROOT.Var('smd_news_hist_44_news_source_country_ref').GetCountry.GetNameNoFlag], where whole towns have been washed away. The death toll is rising by the hour and aid agencies are appealing for help. Governments around the world are pledging aid, and military ships and aircraft are being sent to help with relief efforts. Experts warn that disease could spread among survivors without clean water."
 smd_news_hist.44.f:0 "FROM BANDA ACEH: Boats lie in the streets far from the shore, and survivors search the mud for missing relatives."
 smd_news_hist.44.a:0 "A catastrophe without borders."

 smd_news_hist.45.t:0 "CEASEFIRE ENDS THE SECOND INTIFADA"
 smd_news_hist.45.d:0 "After years of violence, [ROOT.Var('smd_news_hist_45_news_source_country_ref').GetCountry.GetNameNoFlag] and [ROOT.Var('smd_news_hist_45_news_other_country_ref').GetCountry.GetNameNoFlag] have agreed a ceasefire. Exhaustion, security measures and diplomatic pressure have brought the uprising to an end. In [ROOT.Var('smd_news_hist_45_news_event_state_ref').GetState.GetName] people are cautiously returning to the streets, but no one is speaking of peace yet. Security forces are scaling back some operations, and political leaders on both sides are cautiously talking about new negotiations. Thousands have died during the years of violence. Observers warn that the underlying disputes over land and security remain unresolved."
 smd_news_hist.45.f:0 "FROM GAZA: Shops are reopening and children are back in the streets, though no one trusts the quiet to last."
 smd_news_hist.45.a:0 "An uneasy calm."

 smd_news_hist.46.t:0 "32 KILLED AT VIRGINIA TECH"
 smd_news_hist.46.d:0 "A gunman has killed 32 students and staff at Virginia Tech in Blacksburg, [ROOT.Var('smd_news_hist_46_news_event_state_ref').GetState.GetName], before killing himself. It is the deadliest school shooting in the history of [ROOT.Var('smd_news_hist_46_news_source_country_ref').GetCountry.GetNameNoFlag]. Questions are already being asked about how he was able to buy his weapons. The university has cancelled classes, and counsellors have been brought in to help students and staff. The shooting has renewed debate over gun laws, campus security and the treatment of mental illness. Mourners have gathered across the country to remember the victims."
 smd_news_hist.46.f:0 "FROM BLACKSBURG: Students hold candles on the drill field as the names of the dead are read aloud."
 smd_news_hist.46.a:0 "Another massacre."

 smd_news_hist.47.t:0 "KOSOVO DECLARES INDEPENDENCE"
 smd_news_hist.47.d:0 "Kosovo has declared its independence from [ROOT.Var('smd_news_hist_47_news_other_country_ref').GetCountry.GetNameNoFlag] and [ROOT.Var('smd_news_hist_47_news_source_country_ref').GetCountry.GetNameNoFlag] now claims its place among the nations. Crowds in [ROOT.Var('smd_news_hist_47_news_event_state_ref').GetState.GetName] are celebrating with flags and fireworks. Belgrade refuses to recognise the declaration, and the world is divided on whether to follow. Several governments have already announced their recognition of the new state, while others insist that Kosovo remains part of Serbia. International officials will continue to oversee the transition for the time being. The declaration is expected to be debated at the United Nations."
 smd_news_hist.47.f:0 "FROM PRISTINA: Crowds danced in the streets under a sea of flags while Serbian leaders denounced the declaration."
 smd_news_hist.47.a:0 "A new flag over Pristina."

 smd_news_hist.48.t:0 "PROTESTS SWEEP THE ARAB WORLD"
 smd_news_hist.48.d:0 "Mass protests against entrenched rulers are spreading across the Middle East and North Africa. In [ROOT.Var('smd_news_hist_48_news_source_country_ref').GetCountry.GetNameNoFlag], crowds have filled the streets of [ROOT.Var('smd_news_hist_48_news_event_state_ref').GetState.GetName] demanding the fall of the regime. Governments across the region are watching nervously, and some are already making concessions. Regimes that once seemed permanent are now under pressure, and several leaders have promised reforms or dismissed their governments. Social media is playing a major role in organising the protests."
 smd_news_hist.48.f:0 "FROM THE REGION: The protests began with one man's despair and have become a movement no police force has yet been able to stop."
 smd_news_hist.48.a:0 "An Arab Spring."

 smd_news_hist.49.t:0 "NUCLEAR DISASTER AT FUKUSHIMA"
 smd_news_hist.49.d:0 "After a massive earthquake and tsunami struck [ROOT.Var('smd_news_hist_49_news_event_state_ref').GetState.GetName], the Fukushima Daiichi nuclear plant has suffered catastrophic failures, releasing radiation into the surrounding area. Tens of thousands have been evacuated. Governments far beyond [ROOT.Var('smd_news_hist_49_news_source_country_ref').GetCountry.GetNameNoFlag] are reviewing the safety of their own reactors. Engineers are struggling to cool the damaged reactors, and the government has expanded the evacuation zone. Food from the region is being tested for contamination. Several countries have announced reviews of their nuclear programmes, and some are considering phasing out nuclear power entirely."
 smd_news_hist.49.f:0 "FROM FUKUSHIMA: Evacuees wait in school gymnasiums for news of their homes, and radiation readings are posted on the walls each morning."
 smd_news_hist.49.a:0 "A nuclear catastrophe."

 smd_news_hist.50.t:0 "SOUTH SUDAN WINS INDEPENDENCE"
 smd_news_hist.50.d:0 "After decades of war and a decisive referendum, the southern states of Sudan have seceded as [ROOT.Var('smd_news_hist_50_news_source_country_ref').GetCountry.GetNameNoFlag]. Crowds in [ROOT.Var('smd_news_hist_50_news_event_state_ref').GetState.GetName] cheered as the new flag was raised. The government of [ROOT.Var('smd_news_hist_50_news_other_country_ref').GetCountry.GetNameNoFlag] must now decide whether to accept the new state or fight to reclaim it. International leaders have welcomed the new country, which faces enormous challenges after decades of war. Disputes over oil revenue and the border remain unresolved. Aid agencies warn that the new government will need substantial support to build basic services."
 smd_news_hist.50.f:0 "FROM JUBA: Crowds sang and danced through the night as the new flag was raised for the first time."
 smd_news_hist.50.a:0 "A new flag in Africa."

 smd_news_hist.51.t:0 "BIN LADEN KILLED IN RAID"
 smd_news_hist.51.d:0 "Special forces of [ROOT.Var('smd_news_hist_51_news_source_country_ref').GetCountry.GetNameNoFlag] have raided a compound in Abbottabad, Pakistan, in a night operation against Osama bin Laden. Officials say the al-Qaeda leader is dead. Crowds have gathered outside the White House, while the government in [ROOT.Var('smd_news_hist_51_news_event_state_ref').GetState.GetName] faces hard questions about how he hid there. Leaders around the world have reacted, some with approval and others with concern about the operation's legality. Security has been tightened at embassies and military bases worldwide in case of reprisals. Analysts say al-Qaeda has lost its most important symbolic figure."
 smd_news_hist.51.f:0 "FROM ABBOTTABAD: Neighbours describe helicopters in the night, gunfire, and a compound sealed off by soldiers by morning."
 smd_news_hist.51.a:0 "The hunt is over."

 smd_news_hist.52.t:0 "BIN LADEN HANDED OVER"
 smd_news_hist.52.d:0 "In a surprising breakthrough, the authorities in [ROOT.Var('smd_news_hist_52_news_event_state_ref').GetState.GetName] have agreed to extradite Osama bin Laden to [ROOT.Var('smd_news_hist_52_news_source_country_ref').GetCountry.GetNameNoFlag]. The al-Qaeda leader is now in custody. Officials in Washington are calling it a major victory in the war on terror. He is expected to be brought to trial, and his lawyers have already begun preparing his defence. Security has been increased in case his supporters attempt reprisals. Analysts say the case will be watched closely around the world as a test of the war on terror."
 smd_news_hist.52.f:0 "FROM WASHINGTON: Officials called the handover a turning point, though few expect it to end the war."
 smd_news_hist.52.a:0 "Bin Laden will stand trial."

 smd_news_hist.53.t:0 "ISLAMIC STATE PROCLAIMED"
 smd_news_hist.53.d:0 "Jihadist forces exploiting the chaos of revolution and civil war have seized territory and proclaimed [ROOT.Var('smd_news_hist_53_news_source_country_ref').GetCountry.GetNameNoFlag], with its seat at [ROOT.Var('smd_news_hist_53_news_event_state_ref').GetState.GetName]. Reports describe mass executions and the destruction of ancient sites. Governments across the region and beyond are considering how to respond. Neighbouring governments are reinforcing their borders, and foreign fighters are reported to be joining the group. The United Nations has condemned the atrocities. Military planners in several capitals are discussing air strikes and support for local forces fighting the group."
 smd_news_hist.53.f:0 "FROM RAQQA: Refugees speak of public executions in the squares and of black flags flying from every government building."
 smd_news_hist.53.a:0 "A new menace."

 smd_news_hist.54.t:0 "TRAGEDY AT SANDY HOOK"
 smd_news_hist.54.d:0 "A gunman has killed twenty young children and six staff members at Sandy Hook Elementary School in Newtown, [ROOT.Var('smd_news_hist_54_news_event_state_ref').GetState.GetName]. There are no adequate words. [ROOT.Var('smd_news_hist_54_news_source_country_ref').GetCountry.GetNameNoFlag] is in mourning, and the debate over guns has begun again with new urgency. Investigators are examining how the gunman obtained his weapons and why he targeted the school. Vigils have been held across the country. Politicians from both parties are under pressure to respond, though the debate over gun control remains as divided as ever."
 smd_news_hist.54.f:0 "FROM NEWTOWN: Churches are open through the night, and a small town is trying to understand what cannot be understood."
 smd_news_hist.54.a:0 "A nation weeps."

 smd_news_hist.55.t:0 "NEW VIRUS SPREADS FROM CHINA"
 smd_news_hist.55.d:0 "Health authorities in [ROOT.Var('smd_news_hist_55_news_source_country_ref').GetCountry.GetNameNoFlag] have confirmed that a previously unknown coronavirus is spreading from person to person, after a cluster of pneumonia cases in [ROOT.Var('smd_news_hist_55_news_event_state_ref').GetState.GetName]. Cases are now being reported abroad. The World Health Organization is warning governments to prepare. Governments are introducing travel restrictions and screening at airports. Health officials warn that the virus may already be spreading in many countries without being detected. Economists are beginning to warn about the damage that a global pandemic would do to trade and supply chains."
 smd_news_hist.55.f:0 "FROM THE QUARANTINE ZONE: Hospitals have set up tents outside their doors, and the streets are emptying as residents stay home."
 smd_news_hist.55.a:0 "Wash your hands."

 smd_news_hist.56.t:0 "PROTESTS ERUPT AFTER DEATH OF GEORGE FLOYD"
 smd_news_hist.56.d:0 "The killing of George Floyd by police in Minneapolis, in [ROOT.Var('smd_news_hist_56_news_event_state_ref').GetState.GetName], has set off protests in cities across [ROOT.Var('smd_news_hist_56_news_source_country_ref').GetCountry.GetNameNoFlag]. Demonstrators are demanding accountability, police reform and racial justice. In some cities the protests have turned violent, and curfews have been imposed. Police departments are facing calls for reform and, in some cities, for cuts to their budgets. Statues and symbols linked to past injustices are being removed or defaced. The protests have spread beyond the country, with demonstrations held in cities around the world."
 smd_news_hist.56.f:0 "FROM MINNEAPOLIS: Thousands march past the corner where he died, and murals of his face appear on walls across the country."
 smd_news_hist.56.a:0 "A reckoning in the streets."

 smd_news_hist.57.t:0 "MOB STORMS THE CAPITOL"
 smd_news_hist.57.d:0 "A crowd has forced its way into the United States Capitol in [ROOT.Var('smd_news_hist_57_news_event_state_ref').GetState.GetName] after a bitterly contested election, interrupting the certification of the result. Lawmakers were evacuated as rioters roamed the halls. Leaders across [ROOT.Var('smd_news_hist_57_news_source_country_ref').GetCountry.GetNameNoFlag] are warning that political conflict has broken through constitutional limits. Order has been restored and the certification has resumed, but the shock remains. Hundreds of participants are expected to face charges."
 smd_news_hist.57.f:0 "FROM CAPITOL HILL: Broken windows, scattered papers and the smell of tear gas remain in the halls of Congress."
 smd_news_hist.57.a:0 "Democracy under siege."

 smd_news_hist.58.t:0 "SHOTS FIRED AT RALLY IN BUTLER"
 smd_news_hist.58.d:0 "A gunman has opened fire at a campaign rally for Donald Trump in Butler, [ROOT.Var('smd_news_hist_58_news_event_state_ref').GetState.GetName], in an attempt to assassinate him. The candidate was wounded but survived, and the gunman was shot dead. The attack has deepened fears of political violence across [ROOT.Var('smd_news_hist_58_news_source_country_ref').GetCountry.GetNameNoFlag]. The Secret Service is facing intense criticism over how the gunman was able to reach a rooftop with a clear line of fire. Leaders across the political spectrum have condemned the attack. Commentators warn that the country's political divisions have reached a dangerous point."
 smd_news_hist.58.f:0 "FROM BUTLER: The rally ground was cleared within minutes, and the image of a raised fist has already spread around the world."
 smd_news_hist.58.a:0 "Political violence returns."

 smd_news_hist.59.t:0 "CURE FOR CANCER ANNOUNCED"
 smd_news_hist.59.d:0 "Scientists in [ROOT.Var('smd_news_hist_59_news_source_country_ref').GetCountry.GetNameNoFlag] have announced a reliable cure for cancer, after years of research and clinical trials. Doctors in [ROOT.Var('smd_news_hist_59_news_event_state_ref').GetState.GetName] describe the results as beyond anything they had dared to hope. Health systems around the world are racing to obtain the treatment. The discovery is being hailed as one of the greatest achievements in the history of medicine. Pharmaceutical companies are negotiating production agreements, and governments are debating how to make the treatment affordable. Doctors caution that it will take time before every patient can be treated."
 smd_news_hist.59.f:0 "FROM GENEVA: Health officials from every continent are lining up for briefings on how quickly the treatment can be produced."
 smd_news_hist.59.a:0 "A miracle of science."

 smd_news_hist.60.t:0 "AMERICA AT WAR WITH ITSELF"
 smd_news_hist.60.d:0 "A revolutionary crisis has broken [ROOT.Var('smd_news_hist_60_news_source_country_ref').GetCountry.GetNameNoFlag]. Federal authority is contested and armed factions are carving the country into rival governments. From [ROOT.Var('smd_news_hist_60_news_event_state_ref').GetState.GetName], officials are appealing for calm that few expect. The world's greatest power has turned its guns inward. Foreign governments are evacuating their citizens and debating which authorities to recognise. Financial markets around the world have fallen sharply. Military officers are reported to be divided, and observers fear that the fighting could become long and bloody."
 smd_news_hist.60.f:0 "FROM WASHINGTON: Federal buildings are under armed guard, and few believe the crisis can be resolved by negotiation."
 smd_news_hist.60.a:0 "The Union is broken."
