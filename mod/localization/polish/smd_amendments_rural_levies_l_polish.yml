l_polish:
 smd_amendment_rural_levies:0 "Daniny wiejskie"
 smd_amendment_rural_levies_desc:0 "Oprócz podatku rolnego władze gmin i wsi pobierają od gospodarstw chłopskich opłaty, kontyngenty zboża i świadczenia w pracy, aby opłacić lokalne szkoły, drogi i urzędników. Ciężar najmocniej dotyka najbiedniejszych chłopów."
 smd_amendment_rural_levies_modifier:0 "Daniny wiejskie"
 smd_amendment_rural_levies_modifier_desc:0 "Opłaty gminne i świadczenia w pracy przynoszą pieniądze ze wsi kosztem przychylności chłopów."
