l_polish:
  news_events_world.1.t: "[ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFormatting] i [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFormatting] na krawędzi wojny!"
  news_events_world.1.d: "[ROOT.Var('news_world_1_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] postawiła [ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFlag] i [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFlag] w otwartej konfrontacji. Dwie z najważniejszych potęg epoki stoją naprzeciw siebie w formalnym sporze, a europejskie kancelarie ogarnęła aktywność niewidziana od lat. Kurierzy krążą między stolicami o każdej porze, giełdy są niespokojne, a kluby oficerskie mówią niemal wyłącznie o kryzysie. To, czy spór zakończy się negocjacjami, czy przerodzi w wojnę, zależy od żądań wysuwanych w najbliższych tygodniach, ruchów wojsk ku granicy oraz od tego, które rządy zdecydują się stanąć po której stronie."
  news_events_world.1.f: "DZIAŁ DYPLOMATYCZNY: Posłowie obu stron podobno pracują długo po północy. Jeden zagraniczny obserwator opisał atmosferę jako uprzejmą publicznie i jednoznacznie wrogą za zamkniętymi drzwiami."
  news_events_world.2.t: "KRYZYS! Między [ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFormatting] a [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.2.d: "[ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFlag] rzuciła cały swój ciężar w [ROOT.Var('news_world_2_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] przeciwko [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFlag]. Potęga pierwszego rzędu zdecydowała się wejść w spór, który w innych okolicznościach mógł pozostać regionalny, całkowicie zmieniając charakter kryzysu. Kłótnia sąsiadów stała się sprawą dla całego koncertu mocarstw. Ministerstwa spraw zagranicznych badają żądania i nowe zobowiązania, podczas gdy mniejsze rządy regionu po cichu rozważają, której strony najmniej mogą sobie pozwolić obrazić."
  news_events_world.2.f: "ANALIZA: To, co zaczęło się jako spór regionalny, przyciąga teraz uwagę wszystkich wielkich kancelarii; mniejsze państwa w ciszy wybierają, którego obozu mogą sobie pozwolić rozgniewać."
  news_events_world.3.t: "WOJNA! Między [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFormatting] a [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFormatting]!"
  news_events_world.3.d: "[ROOT.Var('news_world_3_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] przeszła od dyplomacji do otwartej wojny między [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFlag] a [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFlag]. Ambasadorowie zostali odwołani, rezerwiści wezwani do koszar, a giełdy pogrążone w chaosie. Od świtu biura werbunkowe są pełne, a koleje oddały tabor do dyspozycji ministerstw wojny. Kupcy już pytają, które porty i szlaki pozostaną otwarte i po jakich stawkach ubezpieczenia, podczas gdy rządy kontynentu sprawdzają, jakie obowiązki nakładają na nie traktaty."
  news_events_world.3.f: "Z FRONTU: Rozkłady jazdy ustępują transportom wojskowym, gdy rezerwiści, amunicja i konie jadą ku walkom. Kupcy już pytają, które porty i trasy pozostaną bezpieczne."
  news_events_world.4.t: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFormatting] rozpoczyna inwazję na [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.4.d: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFlag] ruszyła do walki przeciw [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFlag] w ramach [ROOT.Var('news_world_4_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]. Dysproporcja sił jest oczywista, a w stolicach już mówi się o szybkim i tanim zwycięstwie. Inni zalecają ostrożność. Nasi korespondenci wojskowi przypominają, jak często odległość, trudny teren, choroby i cicha interwencja państw trzecich upokarzały siłę wyglądającą na papierze przytłaczająco, i jak rzadko kampania rozpoczęta z pewnymi siebie prognozami kończyła się w obiecanym terminie."
  news_events_world.4.f: "DZIAŁ WOJSKOWY: Przewaga na papierze może być ogromna, lecz odległość, teren i zagraniczna interwencja zniszczyły niejedną rzekomo łatwą kampanię."
  news_events_world.5.t: "Zamach stanu w [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.5.d: "Porządek polityczny w [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFlag] został obalony siłą. Władza spoczywa teraz w rękach [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetRuler.GetFullName], a państwo ma być rządzone jako [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetGovernment.GetName]. Ministerstwa, urzędy telegraficzne i główne stacje kolejowe zabezpieczono jeszcze przed świtem. Czy armia pójdzie za nowymi panami w prowincjach równie łatwo jak w stolicy, czy istniejące prawa i traktaty będą honorowane oraz czy odsunięte partie się podporządkują, na te pytania nikt jeszcze nie potrafi odpowiedzieć z pewnością."
  news_events_world.5.f: "EKSKLUZYWNIE ZE STOLICY: Mieszkańcy donoszą o żołnierzach przy ministerstwach, dworcach i urzędach telegraficznych. Rano mundury były już inne, powiedział nam jeden urzędnik, ale nikt nie wiedział, czyich rozkazów słuchają."
  news_events_world.6.t: "[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] państwa [ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFormatting] zamordowany"
  news_events_world.6.d: "[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_6_character_ref').GetCharacter.GetFullName], w wieku [ROOT.Var('news_world_6_character_ref').GetCharacter.GetAge] lat, padł ofiarą zamachowca podczas rządów w [ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFlag]. Zabójstwo głowy państwa wywołało natychmiastowy szok; ministrowie zabezpieczają stolicę, garnizon i skarb, starając się zachować choć pozory ciągłości. Zagraniczne rządy domagają się zapewnień, że traktaty i rozkazy wojskowe pozostają bez zmian. Poszukiwanie spisku dopiero się zaczyna, a każdej frakcji zależy na tym, na kogo spadnie wina."
  news_events_world.6.f: "DZIAŁ BEZPIECZEŃSTWA: Śledczy szukają wspólników, a ministrowie próbują dowieść, że państwo nadal pozostaje pod kontrolą. Nie wiadomo, czy zamachowiec działał sam, czy w imieniu frakcji czekającej na następny ruch."
  news_events_world.7.t: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullNameNoFormatting] nie żyje; [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFormatting] pogrążone w żałobie"
  news_events_world.7.d: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullName] zmarł w wieku [ROOT.Var('news_world_7_character_ref').GetCharacter.GetAge] lat, rządząc [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFlag]. Budynki publiczne okryto czernią, a sklepy stolicy zamknęły okiennice. Sukcesja przebiegnie teraz według prawa i zwyczaju, a ministrowie mówią jednym głosem o ciągłości. Za granicą każda kancelaria pyta jednak, czy zmiana wpłynie na sojusze, politykę lub układ frakcji, które od dawna otaczają tron."
  news_events_world.7.f: "ZE STOLICY: Tłumy czekają na wieści o sukcesji, a budynki publiczne pokrywają żałobne tkaniny. Za kulisami ceremonii ministrowie już walczą o to, kto zdefiniuje znaczenie nowego panowania."
  news_events_world.8.t: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetLastNameNoFormatting] obalony w [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.8.d: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetFullName] został odsunięty od władzy w [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFlag] jeszcze za życia, a [ROOT.Var('news_world_8_new_ruler_ref').GetCharacter.GetFullName] przejął ster państwa. Kraj ma być rządzony jako [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetGovernment.GetName]. Żyjący władca usunięty bez wyborów, śmierci i zwyczajnej sukcesji rzadko ma proste wyjaśnienie, a oficjalna wersja przekonała niewielu. Dyplomaci obserwują nominacje ministerialne i ruchy garnizonu, szukając wskazówek, co wydarzyło się za zamkniętymi drzwiami i czy nowa administracja opiera się na zgodzie, czy na bagnetach."
  news_events_world.8.f: "ANALIZA POLITYCZNA: Żyjący władca usunięty bez wyborów, śmierci czy normalnej sukcesji rzadko pozostawia po sobie prostą historię."
  news_events_world.9.t_presidential: "[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting] wygrywa [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting] wybory prezydenckie"
  news_events_world.9.d_presidential: "[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting] wygrała wybory w [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], a [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName] obejmuje prezydenturę. Kandydaci partii zdobyli [ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetCurrentVotingPowerShare|%1] oddanych głosów. W jednych środowiskach wynik wywołał świętowanie, w innych otwartą rozpacz, a pokonani już kwestionują przebieg głosowania w kilku okręgach. Zagraniczne rządy analizują rezultat pod kątem przyszłej dyplomacji, handlu i polityki wojskowej jednej z najważniejszych potęg epoki."
  news_events_world.9.t_party: "[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting] triumfuje w [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting] wyborach"
  news_events_world.9.d_party: "[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting] zakończyła kampanię jako najsilniejsza partia w [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], zdobywając [ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetCurrentVotingPowerShare|%1] głosów. W wielkich miastach liczono głosy długo po północy, a w niejednym okręgu wynik jest kwestionowany. Rządy, inwestorzy i ruchy polityczne za granicą rozważają, co nowy układ partii oznacza dla polityki wewnętrznej i zagranicznej oraz czy powstały gabinet utrzyma roboczą większość."
  news_events_world.9.t_government: "[ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting] poprowadzi rząd [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.9.d_government: "Po wyborach [ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting] jest główną partią rządową w [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], zdobywszy [ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetCurrentVotingPowerShare|%1] głosów. Tam, gdzie Korona stoi ponad partyjną rywalizacją, wybory mogą całkowicie zmienić układ sił poniżej niej bez zmiany głowy państwa. Zagraniczne rządy i ludzie interesu uważnie obserwują nowy gabinet, bo jego skład często lepiej zdradza intencje państwa niż przemówienie tronowe."
  news_events_world.9.t: "Wybory w [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting] dobiegają końca"
  news_events_world.9.d: "Wybory zakończyły się w [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], kraju, którego znaczenie na świecie czyni wynik wydarzeniem międzynarodowym. Rezultaty telegrafowano do stolic Europy w ciągu kilku godzin. Rządy i ruchy polityczne za granicą badają układ partii oraz pozycję [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName], którego rząd może wpływać na dyplomację, handel, rozmieszczenie flot i armii. W kraju rozpoczyna się właściwe formowanie administracji."
  news_events_world.9.f: "DZIAŁ WYBORCZY: Sztaby partyjne jednocześnie świętują, protestują i liczą ponownie. Za granicą wynik będzie odczytywany jako wskazówka co do następnego kierunku dyplomacji i handlu."
  news_events_world.10.t_drought: "Susza ściska [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_drought: "Deszcze zawiodły w [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], gdzie około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] ludzi zależy od zbiorów. Pola wyschły, zbiorniki opadają z tygodnia na tydzień, a rolnicy ograniczają zasiewy, spodziewając się najgorszego. Hodowcy pędzą stada coraz dalej po wodę, handlarze zbożem podnoszą ceny, a w miasteczkach powstają komitety pomocy. Jeśli susza potrwa przez cały sezon, słaby rok może przerodzić się w znacznie poważniejszą klęskę."
  news_events_world.10.t_flood: "Wielka powódź w [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]; wielu uznanych za zaginionych"
  news_events_world.10.d_flood: "Rzeki wystąpiły z brzegów w [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], zalewając gospodarstwa, drogi i całe osady w regionie liczącym około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] mieszkańców. Mosty i nasypy kolejowe są sprawdzane, a ratownicy próbują dotrzeć do miejscowości całkowicie odciętych wodą. Straty w bydle są ciężkie, a zimowe zapasy wielu rodzin zniszczone. Skutki dla zbiorów i transportu będą widoczne na rynkach długo po opadnięciu wody."
  news_events_world.10.t_frost: "Srogi mróz niszczy [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_frost: "Wyjątkowy mróz osiadł nad [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Rolnicy donoszą o poczerniałych polach i zniszczonych sadach; zimno uderzyło w uprawy już zaawansowane w sezonie. W regionie utrzymującym około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] ludzi utrata jednych zbiorów to sprawa poważna. Kupcy spodziewają się niedoborów w najbardziej dotkniętych parafiach jeszcze przed końcem miesiąca."
  news_events_world.10.t_wildfire: "Pożary w [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] wymuszają ewakuacje"
  news_events_world.10.d_wildfire: "Ogień posuwa się przez [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], wypędzając rodziny z domów i zagrażając gospodarstwom, lasom oraz drogom. Dym zaciemnił całe okręgi, a słońce w południe ma podobno czerwony kolor. Władze organizują pasy przeciwpożarowe i wzywają milicję. Przy około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] mieszkańców straty w mieniu, pastwiskach i drewnie będą ciążyć na regionie długo po ugaszeniu ognia."
  news_events_world.10.t_hailstorm: "Gradobicie niszczy zbiory w [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_hailstorm: "Gwałtowne gradobicie przeszło przez [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], siekąc stojące zboże i niszcząc dachy, szyby oraz zwierzęta na otwartym terenie. Pola, które kilka godzin wcześniej były prawie gotowe do żniw, leżą przybite do ziemi. W państwie liczącym około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] mieszkańców nawet lokalne straty szybko odbijają się na cenie chleba i dochodach wsi. Ubezpieczyciele już przyjmują zgłoszenia."
  news_events_world.10.t_locust_swarm: "Szarańcza spada na [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_locust_swarm: "Gęste roje szarańczy opadły na [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], ogołacając pola szybciej, niż miejscowości są w stanie je chronić. Spichlerze pilnowane są dzień i noc, a rolnicy palą ogniska i dymią, by odpędzić owady. Roje podobno zaciemniają niebo. Przy około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] ludzi w dotkniętych okręgach władze obawiają się, że za owadami szybko nadejdzie głód."
  news_events_world.10.t_heatwave: "Niszczycielski upał nad [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_heatwave: "Dotkliwy upał ogarnął [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Studnie opadają, bydło pada na polach, a uprawy więdną pod bezlitosnym słońcem. Miasta donoszą o zgonach wśród starszych i małych dzieci, wozy z wodą pracują od świtu do zmroku. Władze państwa liczącego około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] ludzi obserwują zdrowie ludności równie uważnie jak stan zbiorów."
  news_events_world.10.t_disease_outbreak: "Zaraza rozprzestrzenia się w [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_disease_outbreak: "Choroba rozprzestrzenia się po polach i stadach [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Inspektorzy próbują ustalić dotknięte ziemie i zwierzęta, zanim zakażenie przejdzie do kolejnego okręgu. Kwarantanna i ubój mogą ochronić większą część zbiorów, ale oznaczają natychmiastową ruinę dla gospodarzy, których zwierzęta zostaną skazane. W państwie z około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] mieszkańców skutki odczuje każdy kupujący na targu."
  news_events_world.10.t_extreme_winds: "Nawałnica zostawia pas ruin w [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_extreme_winds: "Skrajnie silne wiatry uderzyły w [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], zrywając dachy, łamiąc drzewa, linie telegraficzne i stojące uprawy. Ruch drogowy i kolejowy zwalnia, a kilka miejscowości całkowicie straciło łączność. W państwie liczącym około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] ludzi największe straty mogą wynikać nie z jednej katastrofy, lecz z jednoczesnego zakłócenia transportu i żniw."
  news_events_world.10.t_torrential_rains: "Ulewne deszcze topią pola [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_torrential_rains: "Deszcz pada bez przerwy nad [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], nasycając pola i zalewając niskie drogi oraz brzegi rzek. Rolnicy obawiają się, że stojąca woda zgnije plony w ziemi nawet tam, gdzie wsie pozostają suche. Kupcy z rosnącym niepokojem obserwują koleje i drogi targowe. W okręgu liczącym około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] mieszkańców mokry sezon podczas żniw może kosztować tyle samo co gwałtowna burza."
  news_events_world.10.t_pollinator_surge: "Niezwykły sezon w sadach [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_pollinator_surge: "Rolnicy w [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] donoszą o niezwykłej obfitości pszczół i innych zapylaczy. Sady i kwitnące uprawy zawiązują owoce w tempie rzadko spotykanym w pamięci żyjących. Jeśli pogoda się utrzyma, oczekuje się hojnych zbiorów. W państwie liczącym około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] ludzi dobry sezon obniży ceny żywności i podniesie dochody wsi."
  news_events_world.10.t_optimal_sunlight: "Złoty sezon w [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_optimal_sunlight: "Wyjątkowo sprzyjające słońce utrzymuje się nad [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Zboża i owoce dobrze dojrzewają, a rolnicy mówią o plonach ponad normę, jeśli pogoda się nie zmieni. Kupcy już szykują się na większy ruch w czasie żniw. W okręgu liczącym około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] ludzi pełne zbiory odczuje każdy rynek i każdy dom."
  news_events_world.10.t_moderate_rainfall: "Łaskawe deszcze błogosławią [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_moderate_rainfall: "Równy, umiarkowany deszcz przyszedł do [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] w najkorzystniejszym momencie sezonu. Pola otrzymują wodę bez szkód ciężkich ulew, a nawet najstarsi rolnicy są zadowoleni. W państwie liczącym około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] ludzi perspektywa dobrych zbiorów już uspokoiła rynki zbożowe, a kupcy szykują więcej miejsca w magazynach."
  news_events_world.10.t_tsunami: "Wielka fala pustoszy wybrzeże [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_tsunami: "Wielka fala uderzyła w wybrzeże [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], niszcząc porty i nisko położone osady. Wiadomości z brzegu pozostają fragmentaryczne, ratownicy przeszukują ruiny, a kilka statków zaginęło wraz z całymi załogami. Przy około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] mieszkańców w dotkniętym państwie liczby ofiar nie sposób jeszcze ustalić, a handel przybrzeżny pozostanie zakłócony długo po zakończeniu akcji ratunkowej."
  news_events_world.10.t_earthquake: "Trzęsienie ziemi równuje miasta z ziemią w [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_earthquake: "Silne trzęsienie ziemi wstrząsnęło [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], zawalając budynki i niszcząc drogi, koleje oraz wodociągi. Ratownicy kopią w gruzach przy świetle lamp, a kolejne wstrząsy utrudniają poszukiwania i zmuszają ocalałych do pozostania na otwartym terenie. Całe dzielnice leżą w ruinie. W państwie liczącym około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] mieszkańców nawet ograniczony obszar zniszczeń może oznaczać wielkie ofiary i lata odbudowy."
  news_events_world.10.t_calm_waters: "Spokojne morza sprzyjają portom [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_calm_waters: "U wybrzeży [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] panuje wyjątkowo spokojna pogoda na morzu. Floty rybackie i żegluga przybrzeżna pracują niemal bez opóźnień, a porty obsługują towary w najlepszych warunkach od lat. Jeśli sytuacja się utrzyma, kupcy spodziewają się mniejszych strat i niższych stawek ubezpieczeń. W nadmorskim państwie z około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] ludźmi spokojny sezon bezpośrednio wpływa na cenę ryb i towarów importowanych."
  news_events_world.10.t_fog: "Gęsta mgła oślepia [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_fog: "Gęsta mgła osiadła nad [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], ograniczając widoczność na drogach, kolei i wodzie. Statki pełzną ku portom, a pociągi poruszają się z największą ostrożnością. Bezpośrednim zagrożeniem są zderzenia; zgłoszono już kilka drobnych wypadków. W okręgu liczącym około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] mieszkańców długotrwała mgła opóźni każdą dostawę i zakłóci zwykły handel miast."
  news_events_world.10.t_cyclone: "Cyklon uderza w [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_cyclone: "Cyklon przechodzi przez [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], niosąc niszczycielski wiatr i ulewny deszcz. Nadmorskie miejscowości donoszą o zerwanych dachach, powalonych drzewach i przerwanych liniach łączności, podczas gdy władze szukają schronienia dla bezdomnych. Przy około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] mieszkańców na drodze burzy połączenie wiatru i powodzi grozi klęską, której skutki będą liczone w miesiącach."
  news_events_world.10.t_ice: "Twardy lód skuwa [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_ice: "Silne oblodzenie ogarnęło [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Drogi i koleje stają się zdradliwe, szlaki wodne zwalniają lub zamierają, a uprawy i zwierzęta cierpią od zimna. Węgiel dociera źle właśnie wtedy, gdy jest najbardziej potrzebny. W państwie liczącym około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] ludzi przerwy w transporcie mogą kosztować równie dużo jak bezpośrednie straty w polu."
  news_events_world.10.t_rough_waters: "Wzburzone morze zamyka porty [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_rough_waters: "Wzburzone wody zakłócają życie wybrzeża [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Łodzie rybackie pozostają w portach, statki handlowe opóźniają wyjście, a władze ostrzegają przed niebezpiecznymi podejściami; kilka jednostek jest spóźnionych. W nadmorskim państwie liczącym około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] mieszkańców powtarzające się przerwy szybko odbijają się na cenach żywności, ubezpieczeniach i imporcie."
  news_events_world.10.t_strong_winds: "Uporczywe wichry nękają [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_strong_winds: "Silne, utrzymujące się wiatry wieją przez [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Otwarte gospodarstwa i szlaki transportowe ponoszą szkody, a marynarze i portowcy zmagają się z trudnymi warunkami na całym wybrzeżu. Wichury nie wszędzie są niszczycielskie, lecz ich długość zaczyna utrudniać żniwa, lokalne podróże i regularny przepływ towarów. W regionie liczącym około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] ludzi skutki trafiają na rynki w ciągu kilku dni."
  news_events_world.10.t_tropical_storm: "Burza tropikalna nadciąga na [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_tropical_storm: "Burza tropikalna wkroczyła do [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], przynosząc ciężkie opady, silny wiatr i niebezpieczne morze. Władze ostrzegają nisko położone miejscowości, porty ograniczają ruch, a rolnicy zabezpieczają plony i zwierzęta. Przy około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] mieszkańców nawet burza słabsza od cyklonu może szeroko zakłócić mieszkania, zbiory i handel przybrzeżny."
  news_events_world.10.t_fallback: "Nadzwyczajne warunki w [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_fallback: "Niezwykła zmiana pogody wpływa na [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Urzędnicy zbierają raporty z gospodarstw, transportu i lokalnych targów, próbując ocenić, czy skutki są klęską, czy błogosławieństwem; pierwsze relacje są sprzeczne. Ponieważ w dotkniętym państwie żyje około [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] ludzi, nawet chwilowa zmiana warunków zbiorów może mieć konsekwencje daleko poza pierwszymi dotkniętymi okręgami."
  news_events_world.10.f: "Z DOTKNIĘTEGO OKRĘGU: Rolnicy i miejscowi urzędnicy opisują zniszczone zbiory, zakłócony transport i nerwowe rynki. Pierwsze raporty są niepełne, a prawdziwa skala strat może być znana dopiero za kilka tygodni."
  news_events_world.11.t: "Rewolucja w [ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.11.d: "Przeciwko [ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFlag] wybuchło powstanie rewolucyjne. Rebelianci zorganizowali się jako [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetNameNoFlag] i ogłaszają [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetGovernment.GetName] w miejsce starego porządku. W dzielnicach robotniczych stanęły barykady, a część garnizonu podobno przeszła na ich stronę. Spór przeszedł od agitacji do zbrojnej walki o samo państwo. Sąsiednie rządy z jawnym niepokojem obserwują, czy obecny reżim przetrwa i jaki przykład zwycięstwo da poza granicami."
  news_events_world.11.f: "OD NASZEGO KORESPONDENTA: Barykady wyrastają szybciej, niż można drukować proklamacje. Mieszkańcy opisują dzielnice, w których władza zmienia się z ulicy na ulicę, a plotki biegną szybciej niż rozkazy urzędowe."
  news_events_world.12.t: "Rewolucjoniści triumfują w [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.12.d: "Rewolucjoniści wygrali wojnę domową w [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFlag], a aparat wielkiego państwa przechodzi w ręce [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetGovernment.GetName] pod rządami [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetRuler.GetFullName]. Zwycięstwo będzie odczuwalne daleko poza granicami, dodając odwagi przyjaciołom i budząc strach wrogów. Zagraniczne stolice ocenią zwycięzców nie po odezwach, lecz po prawach, które wprowadzą, długach, które uznają, i traktatach, które zechcą honorować. Pierwsze miesiące nowej władzy rozstrzygną wiele kwestii, których nie rozstrzygnęły walki."
  news_events_world.12.f: "ANALIZA: Zwycięstwo daje rewolucjonistom ministerstwa, ale nie automatycznie biurokrację, armię ani zaufanie społeczeństwa. Pierwsze dni przy władzy mogą okazać się równie ważne jak walki, które ich do niej doprowadziły."
  news_events_world.13.t: "Zakup [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.13.d: "Na mocy [ROOT.Var('news_world_13_news_treaty_ref').GetTreaty.GetNameNoFormatting] [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetName] przeszło od [ROOT.Var('news_world_13_news_state_giver_ref').GetCountry.GetNameNoFlag] do [ROOT.Var('news_world_13_news_state_taker_ref').GetCountry.GetNameNoFlag]. Na przekazanym terytorium mieszka około [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetPopulationSize|D] ludzi, więc nie jest to zwykła korekta mapy. Trzeba teraz rozstrzygnąć sprawy administracji, własności, dostępu wojskowego i statusu mieszkańców, a sąsiednie rządy już liczą, co nowa granica oznacza dla ich bezpieczeństwa. Samych mieszkańców nie zapytano o zdanie."
  news_events_world.13.f: "Z GRANICY: Mieszkańcy czekają, jakie prawa, podatki i urzędnicy przyjdą z nową flagą. Dla ludzi mieszkających na przekazanej ziemi podpis w odległej stolicy oznacza natychmiastową zmianę rządu."
  news_events_world.14.t: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFormatting] uznaje [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFormatting] za rywala"
  news_events_world.14.d: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFlag] i [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFlag] weszły w oficjalną rywalizację. Dwa państwa pierwszego znaczenia ustawiły się w otwartej konkurencji, a deklaracja zapewne zaostrzy podziały na kontynencie. Ambasadorowie pozostają na stanowiskach, lecz zwykłe uprzejmości wyraźnie ochłodły. Każdy przyszły spór między nimi, nawet drobny, będzie odtąd interpretowany przez pryzmat tej wrogości, a kwestie, które dawniej załatwiono by po cichu między urzędnikami, będą rozgrywane publicznie przed całym światem."
  news_events_world.14.f: "DZIAŁ ZAGRANICZNY: Dyplomaci oczekują, że każdy przyszły spór między rywalami będzie tłumaczony nową wrogością, nawet jeśli jeszcze wczoraj można go było rozstrzygnąć w ciszy."
  news_events_world.15.t: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFormatting] poddaje się [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetAdjectiveNoFormatting] siłom zbrojnym"
  news_events_world.15.d: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFlag] przestało istnieć jako niepodległe państwo, a jego pozostałe terytorium zostało wchłonięte przez [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag] na warunkach wymuszonych przez [ROOT.Var('news_world_15_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]. Rząd został wykreślony z listy państw, ministerstwa rozwiązano, a jego przedstawiciele za granicą zostali bez kraju. [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag] przejmuje teraz ciężar podbitej ziemi i jej ludności, podczas gdy sąsiednie mocarstwa rozważają, czy to kończy spór, czy tylko rodzi następny."
  news_events_world.15.f: "Z BYŁEJ STOLICY: Z budynków znikają rządowe szyldy, a urzędnicy decydują, czy służyć nowej władzy. Państwo może zniknąć z mapy szybciej niż lokalne lojalności."
  news_events_world.16.t: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetLastNameNoFormatting] obejmuje władzę w [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.16.d: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetFullName], w wieku [ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetAge] lat, objął przywództwo w [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFlag] po śmierci poprzedniego władcy. Kraj jest rządzony jako [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetGovernment.GetName]. Ponieważ państwo należy do głównych potęg, dyplomaci już oceniają przyjaźnie, przekonania i zdolność nowego władcy do utrwalenia władzy w niebezpiecznym początku rządów. Dwór mówi o ciągłości, ale ambasady są mniej pewne."
  news_events_world.16.f: "DZIAŁ PAŁACOWY: Dworzanie publicznie mówią o ciągłości, lecz każda sukcesja przetasowuje dostęp i wpływy. Zagraniczni ambasadorowie już obserwują, kto stoi najbliżej nowego władcy."
  news_events_world.17.t: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFormatting] i [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFormatting] zawierają sojusz"
  news_events_world.17.d: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFlag] i [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFlag] zawarły [ROOT.Var('news_world_17_news_treaty_ref').GetTreaty.GetNameNoFormatting], wiążąc się formalnym sojuszem. Warunki opublikowano tylko częściowo, a powszechnie zakłada się istnienie dalszych porozumień nieprzedstawionych parlamentom. Planiści wojskowi i rywalizujące rządy dokładnie badają zobowiązania, ponieważ sojusz tej wagi może zmienić rachuby przyszłego kryzysu i przekształcić lokalny spór w wojnę powszechną, zanim którekolwiek z państw zdąży się wycofać."
  news_events_world.17.f: "ANALIZA WOJSKOWA: Sojusz ma największe znaczenie przed pierwszym strzałem. Sztaby generalne będą odtąd zakładać, że wojna z jednym sygnatariuszem może oznaczać wojnę z oboma."
  news_events_world.18.t: "Nowy rząd [ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.18.d: "[ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFlag] uchwaliło [ROOT.Var('news_world_18_news_new_law_ref').GetLaw.GetName], zmianę na tyle wielką, by przekształcić samą strukturę państwa. Kraj jest teraz rządzony jako [ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetGovernment.GetName]. Zagraniczne stolice na nowo rozważają relacje z nowym porządkiem, podczas gdy w kraju jego zwolennicy świętują, a przeciwnicy przygotowują się na od dawna przewidywane konsekwencje. Prawnicy i urzędnicy już pracują nad praktyczną stroną przemiany, ponieważ tytuły, ministerstwa i procedury, które tydzień temu wydawały się trwałe, muszą zostać napisane od nowa."
  news_events_world.18.f: "DZIAŁ KONSTYTUCYJNY: Prawnicy i urzędnicy analizują praktyczne skutki nowego porządku. Tytuły, ministerstwa i stare procedury, kiedyś uznawane za trwałe, mogą wymagać przepisania."
  news_events_world.19.t: "Niepokoje w [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetNameNoFormatting] dławią lokalną gospodarkę i pogłębiają niestabilność"
  news_events_world.19.d: "Poważne niepokoje ogarnęły [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetName] w [ROOT.Var('news_world_19_news_source_country_ref').GetCountry.GetNameNoFlag], region liczący około [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetPopulationSize|D] mieszkańców. Strajki, zamieszki i zorganizowane niezadowolenie osiągnęły poziom zagrażający zwykłej administracji. Sklepy zamykają się wcześniej, publiczne zebrania przyciągają tłumy znacznie większe, niż zapowiadano, a policję wzmocniono z sąsiednich okręgów. Jeśli agitacja potrwa, może poważnie osłabić rząd i zakłócić handel całego kraju."
  news_events_world.19.f: "Z ULIC: Sklepikarze mówią o wcześniejszym zamykaniu, a publiczne zebrania przyciągają niezwykłe tłumy. Władze twierdzą, że porządek da się przywrócić, lecz mieszkańcy mówią, że napięcie widać długo przed pierwszym zamieszaniem."
  news_events_world.20.t: "Recesja w [ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.20.d: "[ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFlag] doznało gwałtownego i nagłego skurczenia gospodarki. Produkt narodowy spadł z około £[ROOT.Var('news_world_20_news_recession_previous_gdp_value').GetValue|D] do £[ROOT.Var('news_world_20_news_recession_current_gdp_value').GetValue|D], czyli o [ROOT.Var('news_world_20_news_recession_drop_value').GetValue|%1] w ciągu miesiąca. Portfele zamówień chudną, kredyt się zacieśnia, a przemysłowcy mówią o najsłabszym popycie od lat. Robotnicy obawiają się o płace i miejsca pracy, a rynki zagraniczne nerwowo obserwują, czy kryzys rozprzestrzeni się przez handel i inwestycje."
  news_events_world.20.f: "RYNKI: Bankierzy i przemysłowcy szukają oznak, że spadek jest chwilowy. Jeden analityk ostrzega, że zaufanie może szybko wrócić, dopóki zwolnienia i bankructwa nie zamienią złego miesiąca w długotrwałą recesję."
  news_events_world.21.t: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFormatting] osiąga PKB 1 miliarda"
  news_events_world.21.d: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFlag] stało się pierwszym państwem świata, którego roczny produkt przekroczył tysiąc milionów funtów, osiągając około £[ROOT.Var('news_world_21_news_billion_gdp_value').GetValue|D]. Skupienie przemysłu, handlu i siły nabywczej wyznacza nowy punkt odniesienia dla wszystkich rywali. Ekonomiści spierają się, co naprawdę oznacza to osiągnięcie, a liczba nic nie mówi o podziale bogactwa, lecz skala przemysłu jest już czymś, czego żaden rząd nie może ignorować."
  news_events_world.21.f: "DZIAŁ FINANSOWY: Ekonomiści już spierają się o znaczenie tego wyniku. Niewiele mówi on o tym, kto otrzymuje bogactwo, lecz pokazuje skalę przemysłu, której rywale nie mogą ignorować."
  news_events_world.22.t: "[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFormatting] ogłasza nowe porozumienie międzynarodowe"
  news_events_world.22.d: "Pod przywództwem [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFlag] powstał nowy blok: [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName], skupiony wokół zasady [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetIdentity.GetName] i liczący w chwili powstania [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers] państw członkowskich. Inne rządy uważnie badają statut i skład, ponieważ taki związek może przekierować handel, sojusze i wpływy polityczne w całych regionach. Czy okaże się trwałym narzędziem czy tylko chwilową wygodą, wyjdzie na jaw dopiero w kryzysie, którego członkowie sami nie wybiorą."
  news_events_world.22.f: "ANALIZA DYPLOMATYCZNA: Nowe bloki zwykle pokazują jedność, zanim przyjdzie prawdziwy test. Ministerstwa spraw zagranicznych będą śledzić pierwszy spór między członkami uważniej niż ceremonię założycielską."
  news_events_world.23.t: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFormatting] ogłasza niewypłacalność!"
  news_events_world.23.d: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFlag] nie wywiązało się ze swoich zobowiązań. W chwili niewypłacalności kapitał długu publicznego wynosił około £[ROOT.Var('news_world_23_news_default_principal_value').GetValue|D] przy limicie kredytowym £[ROOT.Var('news_world_23_news_default_credit_limit_value').GetValue|D]. Wierzyciele poniosą ciężkie straty, a przyszłe pożyczki będą droższe, jeśli w ogóle zostaną udzielone. Zagraniczne banki i rządy wypatrują efektu domina, niepokojów politycznych i oznak, że skarb nie jest już w stanie utrzymać armii oraz administracji."
  news_events_world.23.f: "DZIAŁ FINANSOWY: Posiadacze obligacji wyceniają politykę równie mocno jak liczby. Ugoda może przywrócić zaufanie; długi brak płatności może podrożyć każdy przyszły kredyt długo po zakończeniu kryzysu."
  news_events_world.24.t: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFormatting] zajmuje miejsce wśród wielkich mocarstw"
  news_events_world.24.d: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFlag] awansowało do pierwszego szeregu państw, z rocznym produktem około £[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetGDP|D]. Awans odzwierciedla potężne nagromadzenie bogactwa, uzbrojenia i wpływów oraz daje państwu głos w największych sprawach dyplomatycznych dnia. Uznane mocarstwa już rozważają, czy zabiegać o nowego gracza jako sojusznika, czy traktować go jako rywala, a on sam może odkryć, że uznanie przynosi obowiązki równie ciężkie jak przywileje."
  news_events_world.24.f: "DZIAŁ ZAGRANICZNY: Zaproszenia, protokół i kalkulacje dyplomatyczne zmienią się niemal natychmiast. Nowe mocarstwo odkryje, że uznanie oznacza nie tylko wpływ, ale i oczekiwanie, by zajmować stanowisko w dawniej odległych sporach."
  news_events_world.25.t: "Upadek [ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.25.d: "[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFlag] spadło z pierwszego szeregu mocarstw, a jego roczny produkt szacuje się teraz na około £[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetGDP|D]. Zmiana ma więcej niż ceremonialne znaczenie: oznacza mniejszą zdolność narzucania uwagi i kształtowania światowej równowagi. W kraju ministrowie są pod presją, by przywrócić utraconą siłę i pozycję; za granicą dawni partnerzy zapewne będą negocjować twardziej niż rok temu."
  news_events_world.25.f: "ANALIZA: Utrata pozycji będzie odczuwalna w salach konferencyjnych, zanim pojawi się na mapie. Dawni partnerzy mogą targować się twardziej, a rywale sprawdzą, czy upadek jest przejściowy."
  news_events_world.26.t: "Przywództwo [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFormatting] zakwestionowane"
  news_events_world.26.d: "W [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName], związku [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers] państw członkowskich, rozpoczęła się walka o przywództwo. [ROOT.Var('news_world_26_news_bloc_contender_ref').GetCountry.GetNameNoFlag] rzuciło wyzwanie [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFlag], obecnemu liderowi. Urzędnicy zapewniają, że zwykła współpraca trwa, lecz delegacje wyjątkowo dokładnie liczą zwolenników. Przedłużający się spór może podzielić kilka rządów naraz i zachęcić państwa zewnętrzne do wykorzystania zamieszania."
  news_events_world.26.f: "WEWNĄTRZ BLOKU: Urzędnicy twierdzą, że codzienna współpraca trwa, lecz delegacje skrupulatnie liczą poparcie. Walka o przywództwo bez armii także może podzielić sojuszników na przeciwne obozy."
  news_events_world.27.t: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFormatting] przejmuje przywództwo sojuszu"
  news_events_world.27.d: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFlag] pokonało [ROOT.Var('news_world_27_news_bloc_loser_ref').GetCountry.GetNameNoFlag] w walce o przywództwo [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetName], związku liczącego [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetNumMembers] państw. Rządy w organizacji rozważają, czy zmiana zacieśni ich więzi, czy wywoła opór wśród tych, którzy popierali poprzedniego lidera. Rywalizacja się skończyła, ale ujawnione lojalności nie znikną tak łatwo."
  news_events_world.27.f: "DZIAŁ DYPLOMATYCZNY: Walka się skończyła, ale niekoniecznie podziały. Nowy lider dziedziczy organizację, w której część rządów wolałaby inny wynik."
  news_events_world.28.t: "[ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFormatting] i [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFormatting] rozchodzą się"
  news_events_world.28.d: "[ROOT.Var('news_world_28_news_treaty_ref').GetTreaty.GetNameNoFormatting], który łączył [ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFlag] z [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFlag], został rozwiązany. Zerwanie usuwa ważne zobowiązanie i zmusza oba rządy do ponownego przemyślenia planów wojskowych i pozycji w przyszłych kryzysach. Obie stolice wydały oświadczenia o żalu, którym mało kto wierzy. Rywale już badają, jakie możliwości daje rozłam; pytanie brzmi teraz, gdzie dawni partnerzy będą szukać bezpieczeństwa i kto zastąpi utraconą relację."
  news_events_world.28.f: "DZIAŁ ZAGRANICZNY: Dyplomaci twierdzą, że sam rozłam znaczy więcej niż formalne wypowiedzenie. Teraz liczy się, gdzie byli partnerzy będą szukać bezpieczeństwa i kto jest gotów zająć zwolnione miejsce."
  news_events_world.29.t: "PANIKA! Światowy niedobór [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting]!"
  news_events_world.29.d: "Poważny niedobór [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] ogarnął rynek światowy, a ceny wzrosły daleko ponad zwykły poziom. Popyt wynosił około [ROOT.Var('news_world_29_news_shortage_imports_value').GetValue|D], podczas gdy na sprzedaż oferowano tylko [ROOT.Var('news_world_29_news_shortage_exports_value').GetValue|D], co daje presję [ROOT.Var('news_world_29_news_shortage_pressure_value').GetValue|2] do jednego. Przemysłowcy, kupcy i rządy ścigają się o pozostałe zapasy, a wyższe koszty przechodzą na każdą gałąź zależną od tego towaru."
  news_events_world.29.f: "RYNKI: Kupcy donoszą o umowach przepisywanych z godziny na godzinę. Jeden makler opisał walkę o [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] jako rynek, na którym posiadanie pieniędzy nie gwarantuje już dostawy."
  news_events_world.30.t: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] i [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] przerysowują mapę"
  news_events_world.30.d_exchange: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] i [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] zawarły wymianę terytoriów. [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting], zamieszkane przez około [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D] osób, przechodzi od [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] do [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting], podczas gdy [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting], z około [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D] mieszkańców, idzie w przeciwną stronę. Granice zmieniono porozumieniem, a nie wojną, a mieszkańcy obu prowincji budzą się pod innym rządem."
  news_events_world.30.d_a_to_b: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] zgodziło się przekazać [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting] państwu [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]. Terytorium liczy około [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D] ludzi, których nie zapytano o zdanie. Administracja, podatki i bezpieczeństwo muszą zostać uporządkowane pod nowym suwerenem, a kwestie własności, języka i lokalnych urzędów zajmą prawników na lata. Sąsiednie rządy badają zmianę granicy osiągniętą negocjacjami zamiast siłą."
  news_events_world.30.d_b_to_a: "[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] zgodziło się przekazać [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting] państwu [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]. Terytorium liczy około [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D] ludzi, których nie zapytano o zdanie. Administracja, podatki i bezpieczeństwo muszą zostać uporządkowane pod nowym suwerenem, a kwestie własności, języka i lokalnych urzędów zajmą prawników na lata. Sąsiednie rządy badają zmianę granicy osiągniętą negocjacjami zamiast siłą."
  news_events_world.30.f: "Z GRANICY: Geodeci mogą przesunąć linię w kilka dni, lecz mieszkańcy będą żyć z konsekwencjami przez lata. Kupcy, właściciele ziemscy i lokalni urzędnicy już pytają, które zasady przetrwają zmianę."
  news_events_world.31.t: "STRAJK! Robotnicy jednoczą się w [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]!"
  news_events_world.31.d_nationwide: "Fala strajków przetacza się przez całe [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]. Praca stanęła w fabrykach i na robotach publicznych, a zorganizowani robotnicy naciskają na przedsiębiorców i ministrów. Przestój jest już tak duży, że dotyka produkcji całego kraju, a gazety wszystkich partii zgadzają się tylko co do jego powagi. Istnieją obawy, że długie starcie pobudzi radykalizm i zmusi rząd do wyboru między ustępstwami a represją."
  news_events_world.31.d_mining: "W [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] wybuchł wielki strajk górników, z [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] w jego centrum. Ludzie opuścili kopalnie, a dopływ węgla i metalu do przemysłu jest zagrożony właśnie wtedy, gdy popyt jest najwyższy. Przedsiębiorców i ministrów naciska się, by zawarli ugodę, zanim niedobór przeniesie się z kopalń do fabryk i kolei. W zagłębiach własne komitety robotnicze utrzymują porządek, co niepokoi władze niemal tak bardzo jak chaos."
  news_events_world.31.d_industrial: "Robotnicy fabryczni odeszli od stanowisk w [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], a [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] należy do głównych ośrodków strajku. Produkcja stoi, a robotnicy i maszyniści domagają się lepszych płac i godzin pracy. Właściciele ostrzegają przed utraconymi zamówieniami i kontraktami, które pójdą za granicę; związkowcy odpowiadają, że strajk dowodzi ich starej tezy: kraj działa dzięki pracy tych, których najmniej pyta się o sposób rządzenia."
  news_events_world.31.d_railway: "Kolejarze strajkują w [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], a centrum zakłóceń znajduje się w [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]. Długi przestój zagraża znacznie więcej niż liniom kolejowym: fabryki potrzebują pociągów do paliwa i materiałów, miasta do żywności, a armia do ruchu. Towary łatwo psujące się już gniją na bocznicach. Ministrowie są naciskani, by przywrócić ruch lub porozumieć się, zanim paraliż się rozszerzy."
  news_events_world.31.d_movement: "Robotnicy [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] rozpoczęli wyraźnie polityczny strajk w [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]. Przestój jest częścią szerszego ruchu, a nie tylko pojedynczej skargi warsztatowej, i przenosi spory z fabryk bezpośrednio do polityki krajowej. Właściciele boją się naśladownictwa w innych miastach, a organizatorzy liczą, że widoczne zakłócenia zmuszą rząd do traktowania ich jako siły politycznej, a nie jedynie problemu policyjnego."
  news_events_world.31.d: "Znaczący strajk wybuchł w [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], kierując uwagę całego kraju na płace, godziny i położenie robotnika. Zakłócenia są wystarczająco poważne, by niepokoić ministrów i przemysłowców, którzy obawiają się długiego spadku produkcji i naśladownictwa. W kilku miastach zbiera się pieniądze dla rodzin strajkujących. Reakcja rządu może zdecydować, czy spór zakończy się negocjacją, represją czy szerszą falą niepokojów."
  news_events_world.31.f: "Z LINII PIKIET: Organizatorzy zapewniają, że strajk potrwa do uzyskania rzeczywistych ustępstw, a przedsiębiorcy ostrzegają, że każda bezczynna zmiana zwiększa koszty i zachęca robotników gdzie indziej do przyłączenia się."

  ## Reader responses, one per story.
  news_events_world.1.a: "Miejmy nadzieję, że rozsądek zwycięży."
  news_events_world.2.a: "Sprawa rośnie z każdym dniem."
  news_events_world.3.a: "Niech Bóg pomoże obu stronom."
  news_events_world.4.a: "Spór nierównych zwykle kończy się szybko."
  news_events_world.5.a: "Bagnety to kiepski fundament władzy."
  news_events_world.6.a: "Podła sprawa."
  news_events_world.7.a: "Niech spoczywa w pokoju."
  news_events_world.8.a: "Jest w tym więcej, niż piszą gazety."
  news_events_world.9.a: "Lud przemówił."
  news_events_world.10.a: "Ciężki sezon dla wsi."
  news_events_world.11.a: "Teraz zdecydują ulice."
  news_events_world.12.a: "Stary porządek się skończył."
  news_events_world.13.a: "Kupione i sprzedane jak majątek."
  news_events_world.14.a: "Dwa psy i jedna kość."
  news_events_world.15.a: "Całkowicie wymazane z mapy."
  news_events_world.16.a: "Niech długo panuje."
  news_events_world.17.a: "Podpisy dziś, żołnierze jutro."
  news_events_world.18.a: "Konstytucja zostaje przebudowana."
  news_events_world.19.a: "Władze miały dość ostrzeżeń."
  news_events_world.20.a: "Przed nami chude lata."
  news_events_world.21.a: "Prawdziwy warsztat świata."
  news_events_world.22.a: "Nowy układ sił."
  news_events_world.23.a: "Wierzyciele tego nie zapomną."
  news_events_world.24.a: "Nowy głos przy stole."
  news_events_world.25.a: "Każde imperium ma swój zmierzch."
  news_events_world.26.a: "Sojusznicy kłócą się równie zajadle jak wrogowie."
  news_events_world.27.a: "Sprawa rozstrzygnięta, na razie."
  news_events_world.28.a: "Tyle z wiecznej przyjaźni."
  news_events_world.29.a: "Ceny odczuje każdy dom."
  news_events_world.30.a: "Tym razem granice przesunęło pióro."
  news_events_world.31.a: "Robotnik dał się usłyszeć."
  news_events_world.32.t: "[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting] strona ustępuje!"
  news_events_world.32.d: "[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetNameNoFormatting] ustąpiło w dyplomatycznej konfrontacji z [ROOT.Var('news_world_32_news_backdown_target_ref').GetCountry.GetNameNoFormatting], przyjmując główne żądanie zamiast doprowadzić spór do wojny. To, co przedstawiano jako próbę narodowej determinacji, zakończyło się przy stole konferencyjnym, a zagraniczne kancelarie już oceniają, co odwrót może oznaczać dla [ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting] prestiżu."
  news_events_world.32.f: "DZIAŁ DYPLOMATYCZNY: Telegramy z zagranicznych stolic donoszą o natychmiastowej uldze, że wojny uniknięto. W kraju przeciwnicy rządu już pytają jednak, czy pokój nie został kupiony zbyt drogo."
  news_events_world.32.a: "Tak kończy się kryzys."

