l_polish:
 smd_agitators.1.t:0 "Tupac Shakur nie żyje"
 smd_agitators.1.d:0 "W nocy 7 września 1996 roku [SCOPE.sCharacter('smd_tupac_scope').GetFullName] został trafiony czterema kulami, gdy siedział w samochodzie na czerwonym świetle w Las Vegas. Zmarł od odniesionych ran 13 września w wieku 25 lat. Strzelec uciekł i nikomu nie postawiono zarzutów. W całym kraju fani gromadzą się, by go opłakiwać."
 smd_agitators.1.f:0 "Jego czwarty album, All Eyez on Me, ukazał się na początku tego roku."
 smd_agitators.1.a:0 "Uciszony głos"
