l_polish:
 GDP_TOOLTIP:0 "#header [concept_gdp] państwa o nazwie [Country.GetName]#!\n[Country.MakeScope.ScriptValue('cwp_gdp')|Dv] @money! (#u #tooltippable #tooltip:[Country.GetTooltipTag],COUNTRY_GDP_OWNERSHIP_TOOLTIP [Country.GetDomesticallyOwnedGDPFraction|%1b]#!#!#!) to wartość $concept_gdp_short$ będąca własnością rodzimą ([Country.GetGDPRanking])\n[Country.MakeScope.ScriptValue('cwp_gdp_per_capita')|2*v] @money! [Concept('concept_gdp_per_capita', '$concept_gdp_per_capita_short$')] ([Country.GetGDPPerCapitaRanking])"
 COUNTRY_GDP_OWNERSHIP_TOOLTIP:0 "#header [concept_gdp_ownership] w państwie o nazwie [Country.GetName]#!\n#u [Country.GetDomesticallyOwnedGDPFraction|%1b]#! ([Country.GetGDP|Dv] @money!) to wartość $concept_gdp_short$ będąca własnością rodzimą\n$TOOLTIP_DELIMITER$\n[SelectLocalization(IsZero_CFixedPoint(Country.GetForeignOwnedGDPFraction), 'NO_FOREIGNLY_OWNED_PERCENTAGE', 'COUNTRY_FOREIGNLY_OWNED_PERCENTAGE')]\n\n[SelectLocalization(IsZero_CFixedPoint(Country.GetGDPOwnedInForeignCountries), 'NO_OWNED_FOREIGN_GDP_BY_COUNTRY', 'OWNED_FOREIGN_GDP_BY_COUNTRY')]"

 COUNTRY_ALL_GDP:0 "#v [Country.GetGDPWithOwnershipsInForeignCountries|D]#! @money!"
 DOMESTIC_COUNTRY_GDP:0 "#v [Country.GetGDP|D]#! @money!"
 FOREIGN_COUNTRY_GDP:0 "#u [Country.GetGDPOwnedInForeignCountries|Db]#! @money!"
 COUNTRY_ALL_OWNERSHIP:0 "#u [Country.GetDomesticallyOwnedGDPFraction|%1b]#![ConcatIfNeitherEmpty(' + ', AddLocalizationIf(NotZero_CFixedPoint(Country.GetGDPOwnedInForeignCountries), 'FOREIGN_COUNTRY_GDP'))]"

 COUNTRY_POPULATION:0 "#title [Concept('concept_pop', '$concept_population$')]#!:\n#variable [Country.MakeScope.ScriptValue('smd_population')|Dv]#!"
 COUNTRY_GDP:0 "#title $GDP_SHORT$#!:\n#variable [Country.MakeScope.ScriptValue('cwp_gdp')|Dv] @money!#!"

 ERROR_DEER_TOOLTIP:0 "#header O nie, to błędny jeleń!#!\n#instruction Kliknij lewym przyciskiem myszy#!, aby otworzyć dziennik błędów\n#instruction Kliknij prawym przyciskiem myszy#!, aby go przepędzić (do czasu, aż znów zajdziesz mu za skórę)"
 ERROR_MANUL_TOOLTIP:0 "#header Manul? To ten wesoły kotek, tak?#!\n#instruction Kliknij lewym przyciskiem myszy#!, aby otworzyć dziennik błędów\n#instruction Kliknij prawym przyciskiem myszy#!, aby go przepędzić (do czasu, aż znów zajdziesz mu za skórę)"

 OH_DEER:0 "„#italic O nie, błędny jeleń wykrył następującą liczbę#! #italic błędów:#! #bold [ErrorDeer.NumberOrErrors|v]#!!”"
 ERROR_MANUL:0 "#italic Wykryto następującą liczbę błędów: #! #bold [ErrorDeer.NumberOrErrors|v]#! #italic . Może ten wesoły kotek wie, jak je rozwiązać.#!"
 ERROR_DEER_SLOW_TICK_OPERATIONS:0 "#header Pobieranie informacji o błędach trwa zbyt długo#!"

 EXPENSES_GOVERNMENT_BUILDING_GOODS:0 "$TAB$[concept_budget_goods_for_government_buildings]: #tooltippable #tooltip:[GetPlayer.GetTooltipTag],GOVERNMENT_BUILDINGS_EXPENSES_BREAKDOWN,GovernmentGoodsExpenseTooltip #N -[GetPlayer.GetGovernmentGoodsExpenses|D-] @money!#!#!#!\n$TAB$#tooltippable;tooltip:SMD_HEALTHCARE_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_healthcare_expense_value')|D-]#!#!#! [concept_smd_healthcare]\n$TAB$#tooltippable;tooltip:SMD_EDUCATION_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_education_expense_value')|D-]#!#!#! [concept_smd_education]\n$TAB$#tooltippable;tooltip:SMD_POLICE_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_police_expense_value')|D-]#!#!#! [concept_smd_police]"

 LITERACY_UNINCORPORATED_TOOLTIP:0 "\n$TOOLTIP_DELIMITER$\n#variable [Country.GetName]#! – jeśli wziąć pod uwagę również [Concept('concept_unincorporated_state', '$concept_unincorporated_states$')|l] tego państwa, wówczas #variable [Country.GetNumTotalLiteratePops|*]#! z #variable [Country.GetTotalPopulation|*]#! zbiorowości ([Country.GetTotalLiteracyRate|%v]) to [Concept('concept_pop', '$concept_pops$')|l] piśmienne ([Country.GetTotalLiteracyRanking])"

 POP_TOOLTIP:0 "#tooltip_header [Concept('concept_pop', '$concept_population$')]#!\nObecnie: [Country.MakeScope.ScriptValue('smd_population')|Dv] ([Country.GetPopulationRanking])\n[Country.GetPopGrowthDesc]$POP_TOOLTIP_DELAYED$"

 SMD_HEALTHCARE_EXPENSE_TOOLTIP:0 "#header Wydatki: [concept_smd_healthcare]#!\nBieżący koszt państwowego systemu ochrony zdrowia. Zależy głównie od liczby poziomów budynku $building_government_administration$ ([concept_bureaucracy]). Wpływ mają też poziom inwestycji w [concept_institution], liczba ludności (bez grupy $peasants$) oraz średni [concept_sol].\nObecny koszt miesięczny: @money!-[GetPlayer.MakeScope.ScriptValue('smd_healthcare_expense_value')|D-]#!"

 SMD_EDUCATION_EXPENSE_TOOLTIP:0 "#header Wydatki: [concept_smd_education]#!\nBieżący koszt publicznej edukacji. Zależy głównie od liczby poziomów budynku $building_government_administration$ ([concept_bureaucracy]). Wpływ mają też poziom inwestycji w [concept_institution], liczba ludności (bez grupy $peasants$) oraz średni [concept_sol].\nObecny koszt miesięczny: @money!-[GetPlayer.MakeScope.ScriptValue('smd_education_expense_value')|D-]#!"

 SMD_POLICE_EXPENSE_TOOLTIP:0 "#header Wydatki: [concept_smd_police]#!\nBieżący koszt egzekwowania prawa. Zależy głównie od liczby poziomów budynku $building_government_administration$ ([concept_bureaucracy]). Wpływ mają też poziom inwestycji w [concept_institution], liczba ludności (bez grupy $peasants$) oraz średni [concept_sol].\nObecny koszt miesięczny: @money!-[GetPlayer.MakeScope.ScriptValue('smd_police_expense_value')|D-]#!"
