 io_vote_projection_eec_tt:0 "#header EEC accession#!\nAccession completes once we meet every criterion and no member vetoes us. Members who would veto us right now: #negative [GetPlayer.MakeScope.ScriptValue('io_vote_eec_against_projected')|0]#! out of [GetPlayer.MakeScope.ScriptValue('io_vote_eec_members')|0]\nAny single member can veto us, but only with a real reason: we are rivals, at war, under embargo, they are antagonistic or belligerent toward us, or relations are poor or worse."
