 concept_prime_minister:0 "Prime Minister"
 concept_prime_minister_desc:0 "The head of government in a monarchy where people vote. The leader of the governing [concept_interest_group] with the most [concept_clout] serves as [concept_prime_minister] and is replaced whenever the [concept_government] changes. In some countries, such as Russia in the 1990s, the [concept_head_of_state] appoints the [concept_prime_minister] instead."
 concept_consumer_prices:0 "Consumer Prices"
 concept_consumer_prices_desc:0 "When prices were freed in January 1992 they rose 245% in a single month. Savings that families had built over a lifetime were gone within the year.\n\nConsumer Prices are the average change in what your capital's market charges for groceries, grain, clothes, furniture, liquor and appliances, compared with their normal price. They are read straight from the market every month. Shortages, tight supply and loose money push them up. Above +30% people blame the government and money starts leaving the country."
 concept_capital_flight:0 "Capital Flight"
 concept_capital_flight_desc:0 "Between 1992 and 1999 well over a hundred billion dollars left Russia, smuggled out through offshore accounts by people who trusted neither the ruble nor the state.\n\nCapital Flight runs from 0 to 100. Every point cuts what your pops pay into the investment pool by 0.75% and, while [concept_short_term_bonds] are in circulation, adds 0.1% to the interest rate on your loans. It also brings penalties once it passes 20, 45 and 70. High inflation, heavy bond sales and powerful oligarchs push it up. Stable prices bring it down quickly, and outside support helps. It ends with the Wild Nineties."
 concept_short_term_bonds:0 "Short Term Bonds"
 concept_short_term_bonds_desc:0 "Unable to collect taxes, the Russian government borrowed through GKOs, short term treasury bonds paying ever higher interest. By 1998 the state was issuing new bonds just to pay off the old ones, and in August the scheme collapsed.\n\nWhile bonds are on sale they add a large sum to your treasury every month. If the state is in debt, that money pays down its loans first. The price is interest: every bond still in circulation raises the interest rate on all of your loans, and [concept_capital_flight] pushes it higher still. Once sales stop, the bonds mature slowly and the extra interest fades with them. If the state runs out of credit and defaults, the bonds are wiped out along with the debt."
 concept_wage_arrears:0 "Wage Arrears"
 concept_wage_arrears_desc:0 "By 1996 Russian workers were owed billions in unpaid wages. Miners blocked railways, teachers went on hunger strike and soldiers sold their own equipment to eat.\n\nDelaying public wages saves money right away, but each level of arrears worsens the mood of the people who are owed and adds [concept_rus_blame] to the government. The levels run from paid on time to months late, half a year behind and unpaid."
 concept_monetary_stance:0 "Monetary Stance"
 concept_monetary_stance_desc:0 "How much money the central bank prints decides whether prices hold or run away. In 1992 the Central Bank under Viktor Gerashchenko flooded the economy with credit for failing factories. Later governments starved it of money to defend the ruble.\n\nA loose stance mints more money and props up wages but drives prices up. A tight stance does the opposite. The stance works the same way as the central bank policy in your budget panel and is set there or by your economic course."
 concept_price_controls:0 "Price Controls"
 concept_price_controls_desc:0 "The Soviet state set the price of almost everything, which kept bread cheap and shelves empty. Freeing prices filled the shops overnight, at prices few could afford.\n\nPrice controls hold down what people pay for everyday goods by boosting their output, which keeps [concept_consumer_prices] lower. They can be lifted, partial or full, and are set by your economic course."
 io_eu_prestige_anchor:0 "European Institutions"
 io_eu_prestige_anchor_desc:0 "The Commission, the Council and the Court in Luxembourg speak for the whole Union. No single member, however large, can claim to lead Europe in their place. This keeps the Union's standing above that of its strongest member, so that no member can seize the leadership of the bloc."
