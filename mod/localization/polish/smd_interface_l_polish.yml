 io_vote_projection_opec_tt:0 "#header Projected OPEC vote#!\nFor: #positive [GetPlayer.MakeScope.ScriptValue('io_vote_opec_for_projected')|0]#!  Against: #negative [GetPlayer.MakeScope.ScriptValue('io_vote_opec_against_projected')|0]#!  out of [GetPlayer.MakeScope.ScriptValue('io_vote_opec_members')|0] members\nTwo thirds of the members must vote for us. Members vote against us if relations are cold or worse, or for any reason that would justify a veto."
