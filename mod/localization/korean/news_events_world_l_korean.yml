  news_events_world.30.a: "이번만큼은 펜으로 국경이 움직였다."
  news_events_world.31.a: "노동자가 자신의 목소리를 들려주었다."
  news_events_world.32.t: "[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting], 물러서다!"
  news_events_world.32.d: "[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetNameNoFormatting]가 [ROOT.Var('news_world_32_news_backdown_target_ref').GetCountry.GetNameNoFormatting]와의 외교적 대치에서 물러나 분쟁을 전쟁으로 끌고 가는 대신 핵심 요구를 양보했다. 국가적 결의를 시험하는 문제로 포장되었던 위기는 회의석상에서 끝났고, 외국 외교부들은 이번 후퇴가 [ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting]의 위신에 어떤 의미를 가질지 벌써 따져 보고 있다."
  news_events_world.32.f: "외교면: 외국 수도에서 온 전보들은 전쟁이 피했다는 즉각적인 안도감을 전한다. 하지만 국내에서는 정부 반대파가 평화를 얻기 위해 너무 큰 대가를 치른 것 아니냐고 벌써 묻고 있다."
  news_events_world.32.a: "이렇게 위기는 끝났다."

