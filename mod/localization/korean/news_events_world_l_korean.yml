l_korean:
  news_events_world.1.t: "[ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFormatting]와 [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFormatting], 전쟁 직전!"
  news_events_world.1.d: "[ROOT.Var('news_world_1_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]로 인해 [ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFlag]와 [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFlag]가 공개적으로 맞서게 되었다. 당대의 손꼽히는 두 강국이 이제 공식적인 분쟁을 사이에 두고 서로를 노려보며, 유럽 각국의 외교부는 수년 만에 보기 드문 분주함에 휩싸였다. 수도 사이를 오가는 전령은 밤낮이 없고, 거래소는 불안정해졌으며, 사교 클럽에서는 이 문제 외에는 거의 다른 이야기가 나오지 않는다. 이 분쟁이 협상으로 봉합될지, 아니면 전쟁으로 굳어질지는 앞으로 몇 주 동안 제시될 요구와 국경으로 향하는 병력의 움직임, 그리고 결판의 순간 각 정부가 어느 편에 설 것인지에 달려 있다."
  news_events_world.1.f: "외교면: 양측 사절들은 자정을 넘겨서까지 협상을 이어가고 있다고 한다. 한 외국 관측통은 분위기를 두고 “겉으로는 예의 바르지만, 속으로는 분명 적대적”이라고 평했다."
  news_events_world.2.t: "위기! [ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFormatting]와 [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFormatting] 사이의 대치"
  news_events_world.2.d: "[ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFlag]가 [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFlag]를 상대로 벌어진 [ROOT.Var('news_world_2_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]에 힘을 실었다. 자칫 지역 분쟁에 머물 수도 있었던 사안에 최상위 강국이 개입하기로 하면서 위기의 성격은 완전히 달라졌다. 이웃 나라들 사이의 다툼이 이제 열강 전체가 주시하는 문제가 되었다. 각국 외무부는 제시된 요구와 새로 맺어진 약속을 면밀히 검토하고 있으며, 주변의 작은 국가들은 사태가 끝나기 전에 어느 쪽을 적으로 돌리는 것이 더 위험한지 조용히 따져 보고 있다."
  news_events_world.2.f: "분석: 지역적 다툼으로 시작된 문제가 이제 모든 주요 외교부의 관심사가 되었다. 작은 나라들은 어느 쪽의 심기를 거스르는 것이 그나마 덜 위험한지 계산하고 있다."
  news_events_world.3.t: "전쟁! [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFormatting]와 [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFormatting] 격돌!"
  news_events_world.3.d: "[ROOT.Var('news_world_3_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]는 외교의 단계를 넘어 [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFlag]와 [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFlag] 사이의 공개 전쟁으로 번졌다. 대사들은 소환되고, 예비군은 집결지로 불려가며, 거래소는 혼란에 빠졌다. 동이 트기도 전부터 모병소에는 군중이 몰렸고 철도 회사들은 차량과 선로를 전쟁부의 요구에 내놓고 있다. 상인들은 어느 항구와 항로가 계속 열려 있을지, 보험료가 얼마나 치솟을지부터 묻고 있으며, 대륙 각국 정부는 이제 조약이 자신들에게 어떤 의무를 부과하는지 재고하고 있다."
  news_events_world.3.f: "전선에서: 철도 시간표는 병력 수송 일정으로 바뀌고 있다. 예비군과 탄약, 말이 전장으로 향하는 가운데 상인들은 어느 항구와 항로가 안전할지 벌써부터 걱정한다."
  news_events_world.4.t: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFormatting], [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFormatting] 침공 개시"
  news_events_world.4.d: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFlag]가 [ROOT.Var('news_world_4_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]에서 [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFlag]를 상대로 전쟁에 나섰다. 두 교전국의 국력 차이는 누구에게나 분명해 보이며, 수도의 일부 인사들은 벌써부터 빠르고 값싼 승리를 말한다. 그러나 신중론도 만만치 않다. 본지의 군사 특파원들은 거리와 험준한 지형, 질병, 그리고 제3국의 은밀한 개입이 서류상 압도적으로 보이던 군대를 얼마나 자주 무너뜨렸는지 상기시킨다. 자신만만한 전망으로 시작된 전쟁이 약속한 한 철 안에 끝난 사례는 생각보다 드물다."
  news_events_world.4.f: "군사면: 서류상 전력 차이는 클 수 있지만, 거리와 지형, 외국의 개입은 많은 ‘쉬운 전쟁’을 망쳐 왔다고 본지 특파원들은 경고한다."
  news_events_world.5.t: "[ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFormatting]에서 쿠데타 발생"
  news_events_world.5.d: "[ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFlag]의 정치 질서가 무력으로 뒤집혔다. 현재 권력은 [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetRuler.GetFullName]에게 넘어갔고, 국가는 [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetGovernment.GetName] 체제로 운영될 예정이다. 새벽이 오기 전 각 부처와 전신국, 주요 철도역이 장악되었다. 군대가 수도에서처럼 지방에서도 새 권력에 순순히 따를지, 기존 법률과 외국과의 조약이 지켜질지, 밀려난 세력이 굴복할지 아니면 지방에서 저항에 나설지는 아직 수도의 누구도 자신 있게 답하지 못한다."
  news_events_world.5.f: "수도 독점 취재: 주민들은 각 부처와 철도역, 전신국에 병사들이 배치되었다고 전한다. 한 서기는 “아침이 되니 제복은 바뀌어 있었지만 누구의 명령을 따르는지 아무도 몰랐다”고 말했다."
  news_events_world.6.t: "[ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFormatting]의 [ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] 암살당해"
  news_events_world.6.d: "[ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFlag]를 통치하던 [ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_6_character_ref').GetCharacter.GetFullName]이 [ROOT.Var('news_world_6_character_ref').GetCharacter.GetAge]세의 나이로 암살자의 손에 쓰러졌다. 국가 원수의 피살은 즉각적인 충격을 불러왔고, 장관들은 수도와 주둔군, 국고를 확보하고 최소한의 통치 연속성을 보여 주기 위해 분주히 움직이고 있다. 외국 정부들은 조약과 군 지휘 체계에 변함이 없다는 보장을 요구하고 있다. 범행 배후를 추적하는 수사는 이제 막 시작되었으며, 국내의 모든 세력은 책임이 누구에게 돌아갈지 촉각을 곤두세우고 있다."
  news_events_world.6.f: "치안면: 수사관들이 공범을 추적하는 동안 장관들은 국가가 여전히 통제되고 있음을 증명하려 애쓴다. 남은 의문은 암살범이 단독으로 움직였는지, 아니면 다음 행동을 기다리던 세력을 대신했는지이다."
  news_events_world.7.t: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullNameNoFormatting] 사망; [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFormatting] 애도"
  news_events_world.7.d: "[ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFlag]를 통치하던 [ROOT.Var('news_world_7_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullName]이 [ROOT.Var('news_world_7_character_ref').GetCharacter.GetAge]세로 사망했다. 공공건물에는 검은 천이 걸리고 수도의 상점들은 덧문을 내렸다. 이제 계승은 관습과 법이 정한 절차에 따라 진행되며, 장관들은 정책과 통치의 연속성을 한목소리로 강조하고 있다. 그러나 해외의 모든 외교부는 사적으로 같은 질문을 던진다. 이번 변화가 동맹과 정책, 그리고 오랫동안 권좌 주변을 둘러싸고 경쟁해 온 세력 간 균형을 바꿀 것인가 하는 문제다."
  news_events_world.7.f: "수도에서: 계승 소식을 기다리는 군중이 모이는 가운데 공공건물에는 검은 천이 내걸렸다. 의식 뒤에서는 장관들이 벌써 다음 치세의 의미를 누가 정의할 것인지를 놓고 경쟁하고 있다."
  news_events_world.8.t: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetLastNameNoFormatting], [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFormatting]에서 축출"
  news_events_world.8.d: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetFullName]가 생존한 채 [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFlag]의 권좌에서 밀려났고, [ROOT.Var('news_world_8_new_ruler_ref').GetCharacter.GetFullName]가 국정을 장악했다. 국가는 앞으로 [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetGovernment.GetName] 체제로 운영될 예정이다. 선거도, 죽음도, 정상적인 계승도 없이 살아 있는 통치자가 물러난 일에는 좀처럼 단순한 설명이 붙지 않으며, 공식 발표만으로는 의문이 가라앉지 않았다. 외교관들은 닫힌 문 뒤에서 실제로 무슨 일이 있었는지, 새 정부가 동의에 기반하는지 아니면 총검에 기대는지를 알아내기 위해 각료 인선과 주둔군의 움직임을 지켜보고 있다."
  news_events_world.8.f: "정치 분석: 선거도 죽음도 정상적 계승도 없이 살아 있는 통치자가 제거되었다면, 그 배경에는 대개 공식 설명보다 훨씬 복잡한 사정이 있다."
  news_events_world.9.t_presidential: "[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting], [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting] 대통령 선거 승리"
  news_events_world.9.d_presidential: "[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting]가 [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag] 선거에서 승리했고 [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName]가 대통령직에 오른다. 이 당의 후보들은 전체 투표의 [ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetCurrentVotingPowerShare|%1]를 얻었다. 일부 지역에서는 축하가 이어지는 반면 다른 곳에서는 노골적인 실망이 터져 나오고 있으며, 패배한 세력은 벌써 여러 선거구의 투표 절차를 문제 삼고 있다. 외국 정부들은 이번 결과가 외교와 무역, 군사 정책, 그리고 당대 주요 강국 가운데 하나의 전반적 정치 분위기에 어떤 변화를 가져올지 면밀히 살피고 있다."
  news_events_world.9.t_party: "[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting], [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting] 선거에서 대승"
  news_events_world.9.d_party: "[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting]가 [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag]의 선거 운동이 끝난 뒤 가장 강력한 정당으로 떠올랐으며, 후보들은 전체 투표의 [ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetCurrentVotingPowerShare|%1]를 얻었다. 대도시의 선거 사무실에서는 자정을 훌쩍 넘겨서도 개표가 이어졌고, 둘 이상의 선거구에서 결과에 이의가 제기되고 있다. 해외의 정부와 투자자, 정치 운동들은 새로운 정당 구도가 국내 정책과 대외 행동에 어떤 의미를 갖는지, 그리고 새 내각이 얼마나 오래 실질적인 다수를 유지할 수 있을지 따져 보고 있다."
  news_events_world.9.t_government: "[ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting], [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting] 정부 이끌어"
  news_events_world.9.d_government: "선거 결과 [ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting]가 [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag] 정부의 핵심 정당이 되었으며 전체 투표의 [ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetCurrentVotingPowerShare|%1]를 얻었다. 군주가 정쟁 위에 남아 있는 나라에서는 국가 원수를 바꾸지 않고도 선거 하나가 그 아래의 권력 균형 전체를 뒤흔들 수 있다. 외국 정부와 상업계는 새 내각을 면밀히 지켜보고 있다. 한 나라의 의도를 파악하는 데는 왕좌에서 나온 연설보다 내각 구성 자체가 더 정확한 지표였던 경우가 적지 않기 때문이다."
  news_events_world.9.t: "[ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting] 선거 종료"
  news_events_world.9.d: "세계에서 차지하는 비중 때문에 국내 선거에 그치지 않는 [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag]의 선거가 끝났다. 결과가 발표된 지 몇 시간 만에 유럽 각국 수도로 전보가 날아들었다. 해외 정부와 정치 운동들은 정당 간 균형과 [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName]의 위치를 살피고 있다. 새 정부는 외교와 무역, 함대와 육군의 배치, 나아가 시대 전체의 정치적 분위기에도 영향을 미칠 수 있다. 국내에서는 이제 실제 정부 구성 작업이 본격적으로 시작된다."
  news_events_world.9.f: "선거면: 각 정당 본부에서는 축하와 항의, 재검표가 동시에 벌어지고 있다. 해외에서는 이번 결과를 이 나라의 다음 외교·통상 노선을 가늠할 단서로 받아들일 것이다."
  news_events_world.10.t_drought: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]에 가뭄 엄습"
  news_events_world.10.d_drought: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]에서 비가 끊겼다. 이 지역에서는 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 수확에 생계를 의존한다. 들판은 바싹 말랐고 저수지는 매주 낮아지며, 농민들은 최악을 예상해 파종 면적을 줄이고 있다. 목축업자들은 물을 찾아 가축을 더 멀리 몰고 가고, 곡물 상인들은 벌써 선물 가격을 올리고 있다. 장터가 있는 읍마다 구호위원회가 조직되는 중이다. 건조한 날씨가 계절 내내 이어진다면 흉년은 훨씬 심각한 사태로 번질 수 있으며, 가장 먼저 고통받는 이들은 이를 견딜 여력이 가장 적은 사람들일 것이다."
  news_events_world.10.t_flood: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] 대홍수; 다수 실종 우려"
  news_events_world.10.d_flood: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] 전역에서 강물이 둑을 넘으며 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 사는 지역의 농장과 도로, 마을 전체를 물에 잠기게 했다. 교량과 철도 제방의 피해가 조사되는 동안 구조대는 물에 완전히 고립된 공동체로 접근하려 애쓰고 있다. 가축 피해가 심각한 것으로 전해지며 많은 가정의 겨울 비축 식량도 완전히 망가졌다. 농작물과 교통망에 입은 피해는 물이 밭에서 빠진 뒤에도 오랫동안 시장에 영향을 줄 것이다."
  news_events_world.10.t_frost: "혹한의 서리, [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] 농작물 망쳐"
  news_events_world.10.d_frost: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]에 이례적인 서리가 내렸다. 재배 농가들은 이미 상당히 자란 작물까지 냉해를 입어 들판이 검게 변하고 과수원이 망가졌다고 보고한다. 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 살아가는 지역에서 한 철의 수확을 잃는 것은 결코 작은 일이 아니다. 상인들은 이달이 끝나기 전 피해가 심한 교구에서 부족 현상이 나타날 것으로 내다보며, 농민들은 늦은 파종으로 손실 일부라도 되찾을 수 있을지 아니면 올해를 포기하고 견뎌야 할지 기다리고 있다."
  news_events_world.10.t_wildfire: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] 산불로 주민 대피"
  news_events_world.10.d_wildfire: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]에서 불길이 번지며 주민들을 집에서 몰아내고 농장과 목재, 그 사이를 잇는 도로까지 위협하고 있다. 연기가 지역 전체를 뒤덮어 한낮의 해가 붉게 보인다는 보고도 들어온다. 지방 당국은 동원 가능한 인력으로 방화선을 만들고 있으며 여러 교구에서는 민병대까지 투입되었다. 해당 주에 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 살고 있는 만큼 재산과 목초지, 입목의 손실은 마지막 불길이 꺼진 뒤에도 오랫동안 지역 경제를 짓누를 수 있다."
  news_events_world.10.t_hailstorm: "우박, [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] 수확 파괴"
  news_events_world.10.d_hailstorm: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]을 거센 우박이 휩쓸며 서 있는 곡식을 찢어 놓고 지붕과 유리를 깨뜨렸으며 노출된 가축에도 큰 피해를 입혔다. 불과 몇 시간 전만 해도 수확을 앞두었던 밭이 완전히 눕혀진 모습을 농민들이 망연히 바라보고 있다. 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 사는 주에서는 국지적인 작물 피해조차 빵값과 농촌 소득에 빠르게 반영된다. 보험사에는 벌써 청구가 쏟아지고 있으며 교구 당국은 보험조차 없던 농가의 손실을 계산하고 있다."
  news_events_world.10.t_locust_swarm: "메뚜기 떼, [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] 덮쳐"
  news_events_world.10.d_locust_swarm: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]에 거대한 메뚜기 떼가 내려앉아 교구 주민들이 막아 내는 속도보다 더 빠르게 밭을 먹어 치우고 있다. 곡물 창고는 밤낮으로 지켜지고, 농민들은 불과 연기, 두드림으로 남은 작물에서 벌레를 몰아낸다. 떼가 지나갈 때 하늘이 어두워진다는 보고도 있다. 피해 지역에는 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 살고 있어, 재앙이 계속되거나 인근 농업 지대로 번질 경우 곤궁이 곧 뒤따를 것이라는 우려가 커지고 있다."
  news_events_world.10.t_heatwave: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]에 살인적 폭염"
  news_events_world.10.d_heatwave: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]을 혹독한 더위가 덮쳤다. 우물은 바닥을 드러내고 가축은 들판에서 죽어 가며, 작물은 좀처럼 누그러지지 않는 햇볕 아래 시들고 있다. 도시에서는 노인과 어린아이의 사망이 보고되고 물 수레는 새벽부터 해 질 때까지 움직인다. 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 사는 주의 당국은 수확 상태만큼이나 주민 건강을 불안하게 지켜보고 있다. 장기간의 폭염은 식량과 물, 교통을 동시에 압박하기 때문이다."
  news_events_world.10.t_disease_outbreak: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]에 병해 확산"
  news_events_world.10.d_disease_outbreak: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]에서 농작물과 가축 사이로 질병이 퍼지고 있다. 검사관들은 전염이 다음 지역으로 넘어가기 전에 피해 토지와 가축을 찾아내기 위해 분투한다. 격리와 도살로 더 넓은 수확을 지킬 수 있을지 모르지만, 가축이 처분되고 밭이 폐쇄된 농가에는 즉각적인 파산을 뜻할 수 있다. 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 사는 주에서는 그 여파가 생산자뿐 아니라 시장에서 식량을 사는 모든 가정에 미칠 것이다."
  news_events_world.10.t_extreme_winds: "폭풍, [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]에 폐허 남겨"
  news_events_world.10.d_extreme_winds: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]을 극심한 강풍이 강타해 지붕과 나무, 전신선, 서 있는 작물을 가리지 않고 뜯어냈다. 주요 도로와 철도에서는 잔해를 치우느라 교통이 느려졌고, 몇몇 교구와의 통신은 완전히 끊겼다. 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 사는 주 전체에서 가장 큰 손실은 하나의 극적인 참사보다 교통과 수확이 동시에 멈춘 데서 생길 가능성이 크다. 하필 둘 다 지체를 감당하기 어려운 계절이다."
  news_events_world.10.t_torrential_rains: "폭우, [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] 들판 침수"
  news_events_world.10.d_torrential_rains: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]에 비가 그치지 않아 들판이 물에 잠기고 낮은 도로와 강변이 범람하고 있다. 마을 자체가 마른 곳에서도 고인 물이 땅속 작물을 썩게 만들까 농민들은 두려워한다. 상인들도 철도와 장터로 가는 도로를 점점 불안하게 지켜본다. 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 사는 지역에서 수확기의 긴 장마는 어떤 폭풍만큼이나 큰 손실을 낳을 수 있다. 피해는 조용히 진행되어 곡물 자루를 열 때까지 드러나지 않는 경우가 많다."
  news_events_world.10.t_pollinator_surge: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] 과수원에 보기 드문 호황"
  news_events_world.10.d_pollinator_surge: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] 농민들은 벌과 다른 수분 곤충이 유례없이 많다고 보고한다. 과수원과 꽃피는 작물은 살아 있는 이들의 기억에서 보기 드문 속도로 열매를 맺고 있으며, 마을의 노인들에게 비슷한 해를 기억하는지 묻는 이들이 끊이지 않는다. 날씨만 유지된다면 풍작에 대한 기대가 높다. 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 사는 주에서 좋은 수확은 식량 가격을 낮추고 현상이 시작된 농장 너머까지 농촌 소득을 끌어올릴 것이다."
  news_events_world.10.t_optimal_sunlight: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]에 황금 같은 계절"
  news_events_world.10.d_optimal_sunlight: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]에 유난히 좋은 햇볕이 이어지고 있다. 농민들은 생육이 왕성하고 맑고 긴 낮을 필요로 하는 작물의 전망이 특히 좋다고 전한다. 상인들은 벌써 늘어날 수확 운송에 대비하고 운송업자들은 마차를 추가로 확보하고 있다. 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 사는 지역에서 풍작은 모든 시장과 가정에 체감된다. 다만 농민들은 이 약속이 현실이 되려면 앞으로 몇 주간 하늘이 지금처럼 유지되어야 한다고 신중하게 말한다."
  news_events_world.10.t_moderate_rainfall: "단비, [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]에 풍작 기대"
  news_events_world.10.d_moderate_rainfall: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]에 생육기 가장 알맞은 시점에 꾸준하고 적당한 비가 내리고 있다. 밭은 폭우에 잠기지 않으면서 충분한 물을 머금고 있고, 좀처럼 칭찬하지 않는 노농들마저 만족을 표시한다. 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 사는 주에서는 풍작 전망만으로 이미 곡물 시장이 안정되었다. 상인들은 올해 예상보다 많은 곡물과 농산물이 들어올 것에 대비해 창고를 비우고 있다."
  news_events_world.10.t_tsunami: "거대한 파도, [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] 해안 초토화"
  news_events_world.10.d_tsunami: "거대한 파도가 [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] 해안을 덮쳐 항구와 저지대 정착지에 파괴를 몰고 왔다. 구조대가 잔해를 뒤지는 동안 해안에서 들어오는 소식은 여전히 단편적이며, 여러 선박이 승선자 전원과 함께 실종된 것으로 전해진다. 피해 주에는 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 살고 있어 인명 피해 규모는 아직 가늠할 수 없다. 해안 무역의 혼란도 긴급 구조가 끝난 뒤 오랫동안 계속될 전망이다."
  news_events_world.10.t_earthquake: "대지진, [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]의 마을들 무너뜨려"
  news_events_world.10.d_earthquake: "강력한 지진이 [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]을 뒤흔들어 건물을 무너뜨리고 도로와 철도, 수도 시설을 파괴했다. 구조대는 등불 아래 잔해를 파헤치지만 여진이 실종자 수색을 방해하고 생존자들을 공터로 몰아내고 있다. 여러 구역이 완전히 폐허가 되었다는 보고도 있다. 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 사는 주에서는 파괴 지역이 제한적이라 해도 막대한 인명 피해와 수년간 이어질 재건 부담을 낳을 수 있다."
  news_events_world.10.t_calm_waters: "잔잔한 바다, [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] 항구에 호재"
  news_events_world.10.d_calm_waters: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] 해안에 유난히 잔잔한 바다가 이어지고 있다. 어선단과 연안 선박은 거의 지연 없이 움직이고, 항구는 선장들이 기억하는 가장 좋은 조건에서 화물을 처리한다. 이런 날씨가 계속된다면 해상 손실이 줄고 보험료도 다소 내려갈 것으로 상인들은 기대한다. 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 사는 인구 많은 해안 주에서 평온한 바다는 생선과 수입품의 가격과 공급에 곧바로 영향을 준다."
  news_events_world.10.t_fog: "짙은 안개, [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] 시야 가려"
  news_events_world.10.d_fog: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]에 짙은 안개가 내려 도로와 철도, 수로 모두의 시야가 크게 줄었다. 배들은 수심을 재며 천천히 항구로 들어가고 열차도 신호소 사이를 극도로 조심스럽게 움직인다. 당장 가장 큰 위험은 충돌이며 이미 몇 건의 경미한 사고가 보고되었다. 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 사는 지역에서 안개가 오래가면 모든 배송이 늦어지고 도시의 일상 상업도 차질을 빚을 것이다."
  news_events_world.10.t_cyclone: "사이클론, [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] 강타"
  news_events_world.10.d_cyclone: "파괴적인 바람과 폭우를 동반한 사이클론이 [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]을 지나고 있다. 해안 공동체에서는 지붕이 날아가고 나무가 뽑히며 통신이 끊겼다는 보고가 이어지고, 당국은 집을 잃은 주민들에게 피난처를 마련하느라 분주하다. 폭풍의 진로에 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 있어, 홍수와 강풍이 합쳐진 이번 재난은 몇 주가 아니라 몇 달 동안 영향을 남길 수 있다. 전신선이 복구되기 전까지는 전체 피해 규모조차 알기 어렵다."
  news_events_world.10.t_ice: "혹한과 결빙, [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] 마비"
  news_events_world.10.d_ice: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] 전역에 심한 결빙이 닥쳤다. 도로와 철도는 위험해지고 수로는 느려지거나 아예 멈췄으며, 노출된 작물과 가축은 혹독한 추위에 시달린다. 석탄은 가장 필요한 순간에 제대로 운송되지 못하고 있다. 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 사는 주에서 비축물이 바닥나기 전에 추위가 풀리지 않는다면 교통 중단으로 인한 손실이 밭에서 입은 직접 피해만큼 커질 수 있다고 상인들은 경고한다."
  news_events_world.10.t_rough_waters: "거친 바다, [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] 항구 폐쇄"
  news_events_world.10.d_rough_waters: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] 해안이 거친 파도로 혼란을 겪고 있다. 어선은 항구에 묶여 있고 상선은 출항을 미루며 항만 당국은 접근 항로가 위험하다는 경고를 내렸다. 몇몇 선박은 예정 시각이 지나도록 돌아오지 않았다. 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 사는 해안 주에서는 해상 운송이 반복해서 끊기면 식량 가격과 보험료, 도시가 의존하는 모든 수입품의 이동에 빠르게 여파가 나타난다."
  news_events_world.10.t_strong_winds: "지속되는 강풍, [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] 괴롭혀"
  news_events_world.10.d_strong_winds: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]에 강한 바람이 계속 불고 있다. 노출된 농장과 교통로가 피해를 입고 선원과 항만 관리들은 해안 전역의 어려운 조건과 씨름한다. 모든 곳에서 파괴적일 정도는 아니지만, 바람이 오래 지속되면서 수확 작업과 지역 이동, 정기적인 물자 운송이 차질을 빚기 시작했다. 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 사는 지역에서는 이런 방해가 며칠 만에 시장 가격에 반영된다."
  news_events_world.10.t_tropical_storm: "열대성 폭풍, [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] 접근"
  news_events_world.10.d_tropical_storm: "열대성 폭풍이 [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]에 들어서며 폭우와 강풍, 위험한 바다를 몰고 왔다. 당국은 저지대 주민들에게 경고를 내리고 항구는 운항을 줄였으며 농민들은 가능한 만큼 작물과 가축을 보호하려 애쓰고 있다. 피해 주에는 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 살고 있어, 사이클론에 미치지 못하는 폭풍이라도 주거와 수확, 작은 정착지들이 의존하는 연안 무역에 광범위한 혼란을 일으킬 수 있다."
  news_events_world.10.t_fallback: "[ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]에 이례적 기상 현상"
  news_events_world.10.d_fallback: "[ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName]에서 이례적인 기상 변화가 나타나고 있다. 당국은 농장과 교통 기관, 지방 시장의 보고를 모아 그 영향이 재난인지 축복인지 판단하려 하지만 초기 보고는 서로 엇갈린다. 피해 주에는 약 [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]명이 살고 있어 수확 조건의 일시적 변화조차 처음 영향을 받은 지역을 넘어 넓은 결과를 낳을 수 있다."
  news_events_world.10.f: "피해 지역에서: 농민과 지방 관리들은 망가진 수확, 끊긴 교통, 불안한 시장을 전하고 있다. 초기 보고는 아직 불완전하며 실제 손실 규모가 드러나기까지 몇 주가 걸릴 수 있다."
  news_events_world.11.t: "[ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFormatting]에서 혁명 발발"
  news_events_world.11.d: "[ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFlag]에 맞선 혁명 봉기가 일어났다. 반군은 [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetNameNoFlag]라는 이름으로 조직되어 구체제 대신 [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetGovernment.GetName]를 세우겠다고 선언했다. 노동자 지구에는 바리케이드가 세워졌고 주둔군 일부가 반군 편으로 넘어갔다는 보고도 있다. 갈등은 이제 선동의 단계를 넘어 국가 자체의 지배권을 둘러싼 무장투쟁이 되었다. 이웃 정부들은 현 체제가 도전을 견뎌낼 수 있을지, 그리고 혁명이 성공할 경우 국경 밖에 어떤 선례를 남길지 노골적인 불안 속에서 지켜보고 있다."
  news_events_world.11.f: "특파원 전보: 선언문이 인쇄되는 속도보다 바리케이드가 더 빨리 세워지고 있다. 주민들은 길 하나를 건널 때마다 권력이 바뀌고, 소문이 어떤 공식 명령보다도 빠르게 퍼지는 동네가 있다고 전한다."
  news_events_world.12.t: "[ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFormatting] 혁명군 승리"
  news_events_world.12.d: "혁명군이 [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFlag]의 내전에서 승리했고, 대국의 국가 기구가 [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetRuler.GetFullName]가 이끄는 [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetGovernment.GetName]의 손에 넘어갔다. 이 승리는 국경 밖에서도 크게 느껴져 친구들에게는 용기를, 적들에게는 같은 만큼의 불안을 줄 것이다. 외국 수도들은 승자들의 선언보다 실제로 제정하는 법, 인정하는 부채, 지키기로 한 조약을 보고 판단할 것이다. 새 정부의 첫 몇 달이 전투가 해결하지 못한 많은 문제를 결정하게 된다."
  news_events_world.12.f: "분석: 혁명군은 승리로 각 부처를 손에 넣었지만, 관료제와 군대, 대중의 신뢰까지 자동으로 얻은 것은 아니다. 집권 첫 며칠은 그들을 권력에 올린 전투만큼이나 결정적일 수 있다."
  news_events_world.13.t: "[ROOT.Var('news_world_13_news_event_state_ref').GetState.GetNameNoFormatting] 매입"
  news_events_world.13.d: "[ROOT.Var('news_world_13_news_treaty_ref').GetTreaty.GetNameNoFormatting]에 따라 [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetName]가 [ROOT.Var('news_world_13_news_state_giver_ref').GetCountry.GetNameNoFlag]에서 [ROOT.Var('news_world_13_news_state_taker_ref').GetCountry.GetNameNoFlag]로 넘어갔다. 양도된 영토에는 약 [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetPopulationSize|D]명이 살고 있어 단순히 지도 위 선을 조금 옮긴 일로 볼 수 없다. 행정과 재산권, 군사 통행, 주민들의 법적 지위까지 모두 새로 정리해야 하며, 이웃 정부들은 새 국경이 자국 안보에 무엇을 뜻하는지 벌써부터 계산하고 있다. 정작 그 땅의 주민들에게는 의견을 묻지 않았다."
  news_events_world.13.f: "국경에서: 주민들은 새 깃발과 함께 어떤 법과 세금, 관리들이 따라올지 기다리고 있다. 양도된 땅에 사는 사람들에게 먼 수도에서의 서명은 즉각적인 정부 교체를 뜻한다."
  news_events_world.14.t: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFormatting], [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFormatting]를 경쟁국으로 지목"
  news_events_world.14.d: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFlag]와 [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFlag]가 공식적인 경쟁 관계에 들어갔다. 국제적으로 큰 비중을 가진 두 나라가 공개적인 경쟁을 선언하면서 대륙의 외교 구도는 한층 경직될 전망이다. 대사들은 여전히 자리를 지키고 있지만 통상적인 외교적 예의는 눈에 띄게 차가워졌다. 앞으로 두 나라 사이의 어떤 분쟁도, 아무리 사소하더라도, 이 적대관계의 관점에서 해석될 것이다. 과거라면 관리들끼리 조용히 해결했을 문제도 이제는 세계가 지켜보는 가운데 공개적으로 다투게 될 가능성이 크다."
  news_events_world.14.f: "외신면: 외교관들은 앞으로 두 경쟁국 사이의 모든 분쟁이 이 새로운 적대관계를 통해 해석될 것으로 본다. 어제라면 조용히 해결됐을 문제조차 예외가 아닐 것이다."
  news_events_world.15.t: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFormatting], [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetAdjectiveNoFormatting] 군에 항복"
  news_events_world.15.d: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFlag]는 더 이상 독립국으로 존재하지 않는다. 남은 영토는 [ROOT.Var('news_world_15_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]의 결과로 [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag]에 흡수되었다. 한 정부가 국제사회에서 사라지고 각 부처는 해체되었으며, 해외 대표들은 섬길 나라를 잃었다. 이제 [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag]는 정복지와 주민들을 통치해야 할 부담을 떠안았고, 주변 열강은 이것이 분쟁의 끝인지 아니면 다음 분쟁의 씨앗인지 판단하고 있다."
  news_events_world.15.f: "옛 수도에서: 정부 간판이 내려가고 공무원들은 새 당국에 계속 봉사할지 결정하고 있다. 국가는 지도에서는 순식간에 사라질 수 있지만 지역의 충성심까지 그렇게 빨리 사라지지는 않는다."
  news_events_world.16.t: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetLastNameNoFormatting], [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFormatting]의 권력 승계"
  news_events_world.16.d: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetFullName]가 [ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetAge]세의 나이로 전임 통치자의 사망 뒤 [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFlag]의 지도자가 되었다. 국가는 [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetGovernment.GetName] 체제로 통치된다. 이 나라가 세계의 주요 강국 가운데 하나인 만큼 외교관들은 새 통치자의 우정 관계와 신념, 그리고 집권 초기의 취약한 시기에 권위를 굳힐 능력을 벌써부터 평가하고 있다. 궁정은 연속성을 강조하지만 각국 대사관은 그만큼 확신하지 못하며, 본국으로 보내는 보고서는 평소보다 훨씬 주의 깊게 읽힐 것이다."
  news_events_world.16.f: "궁정면: 궁정인들은 공개적으로 연속성을 말하지만 모든 계승은 접근권과 영향력의 질서를 다시 짠다. 외국 대사들은 이미 새 통치자와 가장 가까운 이가 누구인지 살피고 있다."
  news_events_world.17.t: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFormatting]와 [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFormatting], 동맹 체결"
  news_events_world.17.d: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFlag]와 [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFlag]가 [ROOT.Var('news_world_17_news_treaty_ref').GetTreaty.GetNameNoFormatting]를 체결해 공식 동맹으로 묶였다. 조약의 일부 조건은 공개되었지만 의회에 제시되지 않은 추가 합의가 있을 것이라는 관측도 널리 퍼져 있다. 군사 기획자들과 경쟁국 정부들은 약속의 범위를 면밀히 검토하고 있다. 이 정도 무게의 동맹은 미래의 위기 계산을 완전히 바꾸고, 어느 서명국도 다시 생각할 틈을 갖기 전에 지역 분쟁을 대전쟁으로 번지게 할 수 있기 때문이다."
  news_events_world.17.f: "군사 분석: 동맹의 진정한 영향력은 첫 총성이 울리기 전부터 나타난다. 이제 각국 참모본부는 한 서명국과의 전쟁이 곧 두 나라 모두와의 전쟁이 될 수 있다는 전제로 계획을 다시 짤 것이다."
  news_events_world.18.t: "[ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFormatting]의 새 정부"
  news_events_world.18.d: "[ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFlag]가 [ROOT.Var('news_world_18_news_new_law_ref').GetLaw.GetName]를 제정해 국가 구조 자체를 바꿀 만큼 큰 변화를 단행했다. 이제 국가는 [ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetGovernment.GetName] 체제로 통치된다. 외국 수도들은 새 질서와의 관계를 다시 검토하고 있고, 국내에서는 지지자들이 환호하는 한편 반대자들은 오래전부터 경고해 온 결과에 대비하고 있다. 법률가와 공무원들은 벌써 제도 전환의 실무에 착수했다. 불과 일주일 전만 해도 영구적으로 보였던 직함과 부처, 절차를 이제는 전면적으로 다시 써야 하기 때문이다."
  news_events_world.18.f: "헌정면: 법률가와 공무원들은 새 질서의 실질적 결과를 정리하고 있다. 한때 영원할 것 같던 직함과 부처, 낡은 절차가 이제는 모두 다시 쓰여야 할 수 있다."
  news_events_world.19.t: "[ROOT.Var('news_world_19_news_event_state_ref').GetState.GetNameNoFormatting]의 격동, 지역 경제 흔들어 불안 심화"
  news_events_world.19.d: "[ROOT.Var('news_world_19_news_source_country_ref').GetCountry.GetNameNoFlag]의 [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetName] 전역에서 심각한 소요가 보고되고 있다. 이 지역에는 약 [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetPopulationSize|D]명이 살고 있다. 파업과 시위, 불만 세력의 조직화가 일상 행정을 위협할 수준에 이르렀다. 상점들은 일찍 문을 닫고 공개 집회에는 예고된 목적을 훨씬 넘어선 군중이 모이며, 경찰은 인근 지역에서 증원되고 있다. 동요가 계속된다면 정부의 통치력은 크게 약해지고 더 넓은 나라의 상업 활동까지 흔들릴 수 있다."
  news_events_world.19.f: "거리에서: 상인들은 평소보다 일찍 문을 닫고 있으며 공개 집회에는 이례적으로 많은 군중이 모인다고 전한다. 당국은 질서를 회복할 수 있다고 주장하지만 주민들은 폭동이 일어나기 전부터 긴장이 눈에 보일 정도라고 말한다."
  news_events_world.20.t: "[ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFormatting] 경기 침체"
  news_events_world.20.d: "[ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFlag]의 경제가 급격하고 갑작스러운 수축을 겪었다. 국민생산은 한 달 사이 약 £[ROOT.Var('news_world_20_news_recession_previous_gdp_value').GetValue|D]에서 £[ROOT.Var('news_world_20_news_recession_current_gdp_value').GetValue|D]로 줄어 [ROOT.Var('news_world_20_news_recession_drop_value').GetValue|%1] 감소했다. 주문장은 얇아지고 신용은 조여들며 제조업자들은 수년간 보지 못한 약한 수요를 호소한다. 노동자들은 임금과 일자리를 걱정하고, 해외 시장은 무역과 투자를 통해 위기가 자신들은 안전하다고 믿었던 곳까지 번질지 불안하게 지켜보고 있다."
  news_events_world.20.f: "시장면: 은행가와 제조업자들은 이번 수축이 일시적이라는 신호를 찾고 있다. 한 분석가는 신뢰가 빠르게 회복될 수도 있지만 해고와 기업 도산이 시작되면 나쁜 한 달이 장기 불황으로 바뀔 수 있다고 경고한다."
  news_events_world.21.t: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFormatting], GDP 10억 파운드 돌파"
  news_events_world.21.d: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFlag]가 세계 최초로 연간 생산 10억 파운드를 넘어섰다. 집계 당시 규모는 약 £[ROOT.Var('news_world_21_news_billion_gdp_value').GetValue|D]였다. 이곳에 집중된 제조업과 무역, 구매력은 이제 모든 경쟁국이 자신을 비교해야 할 새로운 기준이 되었다. 경제학자들은 이 성취가 실제로 무엇을 의미하는지 논쟁하고 있으며, 부가 누구에게 돌아가는지는 전혀 말해 주지 못한다. 하지만 어떤 정부도 더는 무시할 수 없는 산업 규모에 도달했다는 사실만큼은 분명하다."
  news_events_world.21.f: "금융면: 경제학자들은 벌써 이 기록의 진정한 의미를 두고 논쟁하고 있다. 부가 누구에게 돌아가는지는 거의 알려 주지 않지만, 경쟁국들이 무시할 수 없는 산업 규모를 보여 준다."
  news_events_world.22.t: "[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFormatting], 새 국제 협약 선포"
  news_events_world.22.d: "[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFlag]의 주도 아래 새로운 블록 [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName]가 결성되었다. [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetIdentity.GetName] 원칙을 중심으로 하며 창립 당시 회원국은 [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers]개국이다. 다른 정부들은 이 결사체가 광범위한 지역의 무역과 동맹, 정치적 영향력을 재편할 수 있다고 보고 헌장과 회원국 구성을 면밀히 검토하고 있다. 이 블록이 오래가는 제도가 될지, 순간의 편의에 따른 조합에 그칠지는 회원국 누구도 원하지 않았던 실제 위기를 맞아 보아야 알 수 있을 것이다."
  news_events_world.22.f: "외교 분석: 새 블록은 실제 위기를 겪기 전부터 단결을 과시하곤 한다. 외무부들은 창립식보다 회원국 사이 첫 번째 불화를 더 주의 깊게 지켜볼 것이다."
  news_events_world.23.t: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFormatting], 국가 부채 채무불이행!"
  news_events_world.23.d: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFlag]가 채무 의무를 이행하지 못했다. 디폴트 당시 공공부채 원금은 약 £[ROOT.Var('news_world_23_news_default_principal_value').GetValue|D], 신용 한도는 £[ROOT.Var('news_world_23_news_default_credit_limit_value').GetValue|D]였다. 채권자들은 큰 손실을 입게 되었고 앞으로 국가의 차입 비용은 훨씬 비싸질 것이며, 아예 차입 자체가 어려워질 수도 있다. 외국 은행과 정부들은 위기가 다른 곳으로 번질지, 정치적 혼란이 생길지, 그리고 재무부가 더는 군대와 행정을 유지할 수 없게 되는 징후가 나타날지 주시하고 있다."
  news_events_world.23.f: "금융면: 채권자들은 숫자만큼이나 정치를 가격에 반영한다. 협상을 통한 타결은 신뢰를 회복할 수 있지만 장기 디폴트는 위기가 끝난 뒤에도 모든 신규 대출을 비싸게 만들 수 있다."
  news_events_world.24.t: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFormatting], 열강 대열 합류"
  news_events_world.24.d: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFlag]가 국제사회의 최상위권으로 올라섰으며 연간 생산은 약 £[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetGDP|D]로 집계된다. 이번 승격은 막대한 부와 군사력, 영향력의 축적을 반영하며 주요 국제 문제에 발언권을 부여한다. 기존 열강들은 새 강국을 동맹으로 끌어들일지 경쟁자로 경계할지 벌써 계산하고 있고, 새로 인정받은 나라 역시 지위가 특권만큼 무거운 의무를 가져온다는 사실을 곧 알게 될 수 있다."
  news_events_world.24.f: "외신면: 초청과 의전, 외교 계산이 거의 즉시 바뀔 것이다. 새 강국은 영향력뿐 아니라 과거에는 먼 문제로 여겼던 분쟁에서도 편을 들라는 기대까지 얻게 될 수 있다."
  news_events_world.25.t: "[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFormatting]의 쇠퇴"
  news_events_world.25.d: "[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFlag]가 열강의 최상위권에서 밀려났으며 연간 생산은 약 £[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetGDP|D]로 집계된다. 이는 단순한 의전상의 변화가 아니다. 세계의 관심을 끌고 국제 균형을 좌우할 능력이 줄었다는 신호다. 국내에서는 장관들이 잃어버린 힘과 위상을 회복하라는 압력을 받고, 야당에는 정부를 공격할 소재가 넘쳐난다. 해외에서는 과거의 협력국들이 작년보다 더 강하게 조건을 요구할 가능성이 크다."
  news_events_world.25.f: "분석: 위상 하락의 영향은 지도보다 회의실에서 먼저 드러날 것이다. 옛 협력국들은 더 강하게 흥정하고 경쟁국들은 이 쇠퇴가 일시적인지 장기적인지 시험하려 할 것이다."
  news_events_world.26.t: "[ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFormatting] 지도권 도전받아"
  news_events_world.26.d: "[ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers]개 회원국으로 구성된 [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName] 내부에서 지도권 다툼이 시작되었다. [ROOT.Var('news_world_26_news_bloc_contender_ref').GetCountry.GetNameNoFlag]가 현재 지도국 [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFlag]에 도전장을 냈다. 관계자들은 일상적 협력이 평소처럼 계속된다고 주장하지만 각 대표단은 유난히 세심하게 지지국 수를 세고 있다. 경쟁이 길어지면 여러 정부를 동시에 갈라놓고 외부 열강이 혼란을 이용하도록 만들 수 있으며, 역사상 그런 사례는 이미 충분히 많았다."
  news_events_world.26.f: "블록 내부: 관계자들은 일상 협력이 차질 없이 계속된다고 말하지만 대표단들은 지지국을 꼼꼼히 세고 있다. 군대가 동원되지 않은 지도권 경쟁도 동맹을 서로 다른 진영으로 갈라놓을 수 있다."
  news_events_world.27.t: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFormatting], 동맹 지도권 장악"
  news_events_world.27.d: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFlag]가 [ROOT.Var('news_world_27_news_bloc_loser_ref').GetCountry.GetNameNoFlag]를 꺾고 [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetNumMembers]개 회원국으로 구성된 [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetName]의 지도권을 차지했다. 조직 내 각 정부는 이번 변화가 결속을 강화할지, 아니면 전임 지도국을 지지했던 나라들의 반발을 부를지 따져 보고 있다. 경쟁 자체는 끝났지만 그 과정에서 드러난 충성 관계까지 쉽게 정리되지는 않는다. 새 지도국은 분명 다른 결과를 원했던 동료 정부들까지 함께 이끌어야 한다."
  news_events_world.27.f: "외교면: 경쟁은 끝났지만 충성의 문제까지 끝난 것은 아니다. 새 지도국은 패자를 원했던 정부들이 포함된 조직을 물려받았다."
  news_events_world.28.t: "[ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFormatting]와 [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFormatting], 결별"
  news_events_world.28.d: "[ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFlag]와 [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFlag]를 묶던 [ROOT.Var('news_world_28_news_treaty_ref').GetTreaty.GetNameNoFormatting]가 해체되었다. 이 결별로 중요한 약속 하나가 사라졌고 두 정부 모두 군사 계획과 향후 위기에서의 입지를 다시 검토해야 한다. 양국 수도는 유감 성명을 냈지만 누구도 진심이라 믿지 않는 문구로 가득하다. 경쟁국들은 벌써 이 틈에서 얻을 기회를 찾고 있으며, 이제 남은 질문은 옛 동맹국들이 어디에서 안보를 구할지, 그리고 누가 사라진 관계를 대신할 준비가 되어 있는지이다."
  news_events_world.28.f: "외신면: 외교관들은 공식 취소 자체보다 결별의 정치적 의미가 더 크다고 본다. 이제 관심은 두 옛 동맹국이 어디에서 안보를 찾고 누가 빈자리를 메울지에 쏠린다."
  news_events_world.29.t: "공황! 전 세계 [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] 부족!"
  news_events_world.29.d: "세계 시장에 [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting]가 심각하게 부족해져 가격이 업계가 정상이라고 여기는 수준을 훨씬 넘어섰다. 시장 수요는 약 [ROOT.Var('news_world_29_news_shortage_imports_value').GetValue|D]에 달했지만 판매 물량은 [ROOT.Var('news_world_29_news_shortage_exports_value').GetValue|D]에 불과해 수요 압력이 [ROOT.Var('news_world_29_news_shortage_pressure_value').GetValue|2] 대 1에 이르렀다. 제조업체와 상인, 각국 정부가 남은 재고를 확보하려 경쟁하고 있으며, 높아진 비용은 이 상품에 의존하는 모든 산업으로 번지고 있다."
  news_events_world.29.f: "시장면: 구매자들은 계약 조건이 시간마다 다시 쓰이고 있다고 전한다. 한 중개인은 [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] 확보 경쟁을 두고 “돈이 있어도 물건을 보장받을 수 없는 시장”이라고 표현했다."
  news_events_world.30.t: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]와 [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting], 국경 다시 그려"
  news_events_world.30.d_exchange: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]와 [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]가 영토 교환에 합의했다. 약 [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D]명이 사는 [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting]는 [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]에서 [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]로 넘어가고, 약 [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D]명이 사는 [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting]는 반대 방향으로 이동한다. 전쟁이 아니라 합의로 국경이 다시 그어졌으며 두 지역 주민들은 하루아침에 다른 정부의 신민이 되었다."
  news_events_world.30.d_a_to_b: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]가 [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting]를 [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]에 넘기기로 합의했다. 해당 영토에는 약 [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D]명이 살고 있지만 주민들에게는 의견을 묻지 않았다. 행정과 과세, 치안을 새 주권자 아래 다시 정비해야 하며 재산권과 언어, 지방 관직 문제는 수년 동안 법률가들을 바쁘게 할 것이다. 주변 정부들은 무력이 아니라 협상으로 바뀐 국경을 면밀히 살피며 각자의 결론을 내리고 있다."
  news_events_world.30.d_b_to_a: "[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]가 [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting]를 [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]에 넘기기로 합의했다. 해당 영토에는 약 [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D]명이 살고 있지만 주민들에게는 의견을 묻지 않았다. 행정과 과세, 치안을 새 주권자 아래 다시 정비해야 하며 재산권과 언어, 지방 관직 문제는 수년 동안 법률가들을 바쁘게 할 것이다. 주변 정부들은 무력이 아니라 협상으로 바뀐 국경을 면밀히 살피며 각자의 결론을 내리고 있다."
  news_events_world.30.f: "국경에서: 측량사는 며칠 만에 선을 옮길 수 있지만 주민들은 그 결과를 수년 동안 안고 살아야 한다. 상인과 지주, 지방 관리들은 어떤 규칙이 양도 뒤에도 살아남을지 벌써 묻고 있다."
  news_events_world.31.t: "파업! [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] 노동자들 단결!"
  news_events_world.31.d_nationwide: "파업의 물결이 [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] 전역을 휩쓸고 있다. 조직 노동자들이 고용주와 장관 모두에게 요구를 제시하면서 공장과 공공사업 현장의 작업이 멈췄다. 중단 규모는 이제 국가 전체 생산에 영향을 줄 만큼 커졌고, 모든 정파의 신문들도 적어도 사태가 심각하다는 점에는 동의한다. 대치가 계속되면 급진주의가 퍼지고 정부가 양보와 탄압 중 하나를 택해야 할 수 있다는 우려가 나온다. 어느 쪽도 대가 없이 선택할 수 없다."
  news_events_world.31.d_mining: "[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]에서 광부들의 대규모 파업이 시작되었고 [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]가 혼란의 중심에 있다. 광부들은 격앙된 분위기 속에서 갱도를 떠났고, 수요가 가장 높은 시기에 석탄과 금속의 산업 공급이 위협받고 있다. 고용주와 장관들은 부족 사태가 광산 입구에서 공장과 철도로 번지기 전에 합의하라는 압력을 받는다. 탄광 지역에서는 노동자 위원회가 자체적으로 질서를 유지한다는 보고가 있는데, 당국은 무질서 못지않게 이를 우려한다."
  news_events_world.31.d_industrial: "[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]의 공장 노동자들이 작업장을 떠났고 [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]가 주요 파업 중심지 가운데 하나가 되었다. 노동자와 기계공들이 임금과 노동시간 문제를 제기하면서 생산이 중단됐다. 고용주들은 주문 손실과 공장 정지, 해외로 빠져나가 돌아오지 않을 계약을 경고한다. 반면 노조 측은 바로 이 파업이 자신들이 오래 주장해 온 사실, 즉 나라가 통치 방식에 가장 적게 발언하는 노동자들의 노동으로 돌아간다는 점을 증명한다고 말한다."
  news_events_world.31.d_railway: "[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]의 철도 노동자들이 파업에 들어갔고 [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]가 중단의 중심이다. 장기 파업은 철도 그 자체보다 훨씬 넓은 피해를 줄 수 있다. 공장은 연료와 원자재를, 도시는 식량을, 군대는 이동을 열차에 의존한다. 부패하기 쉬운 화물은 이미 측선에서 썩기 시작했다. 장관들은 마비가 퍼지기 전에 운행을 복구하거나 합의에 이르라는 압력을 받고 있으며, 일부에서는 다른 수단으로 철도를 운영해야 한다는 공개적인 주장까지 나온다."
  news_events_world.31.d_movement: "[ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]의 노동자들이 [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]에서 뚜렷한 정치적 성격의 파업을 시작했다. 이번 중단은 특정 작업장의 불만 하나가 아니라 더 넓은 운동의 일부이며, 공장 안의 갈등을 곧바로 국가 정치로 끌어들인다. 고용주들은 다른 도시로 본보기가 번질까 두려워하고, 조직자들은 눈에 보이는 혼란을 통해 정부가 자신들을 단순한 치안 문제가 아니라 정치 세력으로 상대하게 되기를 기대한다."
  news_events_world.31.d: "[ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]에서 상당한 규모의 파업이 일어나 임금과 노동시간, 노동자의 처우 문제가 전국적 관심사가 되었다. 생산이 오래 멈추고 다른 지역에서 모방 파업이 번질까 장관들과 제조업자들은 크게 우려하고 있다. 여러 도시에서는 파업 노동자 가족을 위한 모금도 진행 중이다. 정부의 대응은 분쟁이 협상으로 끝날지, 탄압으로 끝날지, 아니면 어느 정파도 의도하지 않은 더 큰 소요의 물결로 번질지를 결정할 수 있다."
  news_events_world.31.f: "파업 현장에서: 조직자들은 실질적인 양보가 있을 때까지 파업을 계속하겠다고 주장한다. 고용주들은 쉬는 교대 하나하나가 비용을 키우고 다른 지역 노동자들에게 동참할 용기를 준다고 경고한다."

  ## Reader responses, one per story.
  news_events_world.1.a: "현명한 이들이 이기기를 바랄 뿐이다."
