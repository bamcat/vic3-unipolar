l_korean:

 news.1.t:0 "주목할 만한 사건"
 news.1.d:0 "시험용 기사입니다. 화면 위에 국가의 제호가 보이고, 기사가 종이 위에 배치되며, 창 주위에 어두운 테두리나 제목 표시줄이 없다면 신문 창이 정상적으로 작동하는 것입니다. 창은 계속 드래그할 수 있어야 합니다."
 news.1.f:0 "본지 특파원들이 대기하고 있다."
 news.1.a:0 "대단한 소식이다!"

 news.2.t:0 "러시아 혁명"
 news.2.d:0 "[ROOT.Var('news_test_2_news_attacker_ref').GetCountry.GetNameNoFlag]가 [ROOT.Var('news_test_2_news_defender_ref').GetCountry.GetNameNoFlag]에 공식적으로 선전포고했다. 국경에서는 병력이 동원되고 있으며 열강의 외교부는 심각한 우려 속에서 사태를 지켜보고 있다. 외교관들은 소환되었고 거래소는 혼란에 빠졌다. 본지 특파원들은 전쟁터로 향하고 있으며 저녁 우편까지 추가 소식이 도착할 것으로 보인다. 외교관들은 소환되었고 거래소는 혼란에 빠졌다. 본지 특파원들은 전쟁터로 향하고 있으며 저녁 우편까지 추가 소식이 도착할 것으로 보인다. 외교관들은 소환되었고 거래소는 혼란에 빠졌다. 본지 특파원들은 전쟁터로 향하고 있으며 저녁 우편까지 추가 소식이 도착할 것으로 보인다."
 news.2.f:0 "외교가 실패한 곳에서 대포가 말한다."
 news.2.a:0 "참으로 심각한 소식이다."
