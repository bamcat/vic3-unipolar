 je_second_american_civil_war:0 "The Second American Civil War"
 je_second_american_civil_war_reason:0 "The United States has fractured into rival governments. Red America and Blue America are the main combatants, while breakaway states can be courted through diplomatic proposals."
 second_american_civil_war_status:0 "The union has fractured."
 second_american_civil_war_blue_status:0 "Blue America seeks to preserve a liberal-social democratic order while winning over breakaway states."
 second_american_civil_war_red_status:0 "Red America seeks to consolidate conservative America while winning over breakaway states."
 second_american_civil_war_complete_header:0 "The civil war ends when either Red America or Blue America is destroyed, annexed, or subordinated."
