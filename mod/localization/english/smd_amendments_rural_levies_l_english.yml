 smd_amendment_rural_levies:0 "Rural Levies"
 smd_amendment_rural_levies_desc:0 "On top of the agricultural tax, township and village governments collect fees, grain quotas and labour levies from peasant households to pay for local schools, roads and officials. The burden falls hardest on the poorest farmers."
 smd_amendment_rural_levies_modifier:0 "Rural Levies"
 smd_amendment_rural_levies_modifier_desc:0 "Township fees and labour levies are raising money from the countryside at the cost of peasant goodwill."
