l_english:
 smd_agitators.1.t:0 "Tupac Shakur Is Dead"
 smd_agitators.1.d:0 "On the night of 7 September 1996, [SCOPE.sCharacter('smd_tupac_scope').GetFullName] was shot four times while sitting in a car at a red light in Las Vegas. He died of his wounds on 13 September at the age of 25. The gunman escaped and no one has been charged. Across [ROOT.GetCountry.GetName], fans have gathered to mourn him."
 smd_agitators.1.f:0 "His fourth album, All Eyez on Me, had been released earlier that year."
 smd_agitators.1.a:0 "A voice silenced"
