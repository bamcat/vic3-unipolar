l_english:

 news.1.t:0 "A Notable Occurrence"
 news.1.d:0 "A test clipping. If this reads as a newspaper, your nation's masthead across the top, the story set on paper, and NO dark frame or title bar around the window, then the window type is working. It should also still be draggable."
 news.1.f:0 "Our correspondents stand ready."
 news.1.a:0 "Capital news!"

 news.2.t:0 "REVOLUTION IN RUSSIA"
 news.2.d:0 "[ROOT.Var('news_test_2_news_attacker_ref').GetCountry.GetNameNoFlag] has formally declared war upon [ROOT.Var('news_test_2_news_defender_ref').GetCountry.GetNameNoFlag]. Troops are mobilising along the frontier, and the chancelleries of the great powers watch with grave concern.Diplomats have been recalled and the exchanges thrown into turmoil. Our correspondents are en route to the seat of war, and further particulars are expected by the evening post. Diplomats have been recalled and the exchanges thrown into turmoil. Our correspondents are en route to the seat of war, and further particulars are expected by the evening post.  Diplomats have been recalled and the exchanges thrown into turmoil. Our correspondents are en route to the seat of war, and further particulars are expected by the evening post."
 news.2.f:0 "The guns speak where diplomacy has failed."
 news.2.a:0 "Grave news indeed."
