 copper:0 "Copper"
 copper_desc:0 "Refined copper cathode. The nervous system of an electrified economy: wiring, motors, generators and transformers all begin here."
 aluminium:0 "Aluminium"
 aluminium_desc:0 "Light, corrosion-resistant and enormously electricity-hungry to smelt. Aircraft, packaging and modern vehicles depend on it."
 rare_earths:0 "Rare Earths"
 rare_earths_desc:0 "Lanthanides separated from monazite and bastnasite ores. Tiny quantities are indispensable to magnets, phosphors and semiconductors."
 uranium:0 "Uranium"
 uranium_desc:0 "Uranium oxide concentrate (yellowcake) milled from mined ore. Enriched into fuel, it is what nuclear power plants burn."
 refined_fuel:0 "Refined Fuel"
 refined_fuel_desc:0 "Petrol, diesel and kerosene cracked from crude. What actually moves vehicles, ships and aircraft."
 building_copper_mine:0 "Copper Mine"
 building_copper_mine_desc:0 "Extracts and concentrates copper ore."
 building_rare_earth_mine:0 "Rare Earth Mine"
 building_rare_earth_mine_desc:0 "Extracts and separates rare earth elements."
 building_uranium_mine:0 "Uranium Mine"
 building_uranium_mine_desc:0 "Mines uranium ore and mills it into yellowcake for nuclear fuel."
 building_aluminium_smelter:0 "Aluminium Smelter"
 building_aluminium_smelter_desc:0 "Reduces alumina to aluminium metal. Consumes vast amounts of electricity."
 building_oil_refinery:0 "Fuel Refinery"
 building_oil_refinery_desc:0 "Cracks crude oil into usable fuels."
