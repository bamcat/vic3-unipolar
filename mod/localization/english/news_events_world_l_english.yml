l_english:
  news_events_world.1.t: "[ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFormatting] and [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFormatting] on the Brink of War!"
  news_events_world.1.d: "The [ROOT.Var('news_world_1_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] has set [ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFlag] and [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFlag] in open confrontation. Two of the foremost powers of the age now face one another across a formal quarrel, and the chancelleries of Europe have been thrown into a state of activity not seen for years. Couriers pass between the capitals at all hours, the exchanges have grown unsteady, and the service clubs speak of little else. Whether the dispute is composed by negotiation or hardens into war will depend upon the demands pressed in the coming weeks, upon the movement of troops toward the frontier, and upon which governments elect to stand with whom when the reckoning comes."
  news_events_world.1.f: "DIPLOMATIC DESK: Envoys on both sides are said to be working past midnight. One foreign observer described the atmosphere as polite in public and unmistakably hostile in private."
  news_events_world.2.t: "[ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFormatting] Intervenes in Diplomatic Crisis Against [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.2.d: "[ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFlag] has thrown its weight into the [ROOT.Var('news_world_2_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] against [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFlag]. A power of the first rank has chosen to involve itself in a dispute that might otherwise have remained a regional affair, and its entry alters the character of the crisis entirely. What was a quarrel between neighbours has become a question for the whole concert of nations. Foreign ministries are studying the stated demands and any fresh commitments with the closest attention, while the smaller governments of the region consider, quietly and without publicity, which side they can least afford to offend before the matter is concluded."
  news_events_world.2.f: "ANALYSIS: What began as a regional quarrel now commands the attention of every major foreign ministry; smaller governments are quietly deciding which side they can afford to offend."
  news_events_world.3.t: "War Between [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFormatting] and [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFormatting] !"
  news_events_world.3.d: "The [ROOT.Var('news_world_3_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] has passed beyond diplomacy into open war between [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFlag] and [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFlag]. Ambassadors have been recalled, reservists summoned to their depots, and the exchanges thrown into disorder. Recruiting offices report crowds since first light and the railway companies have placed their rolling stock at the disposal of the war departments. Merchants are already asking which ports and routes will remain open to them, and at what rate of insurance, while governments across the continent weigh what obligations their treaties may now impose upon them."
  news_events_world.3.f: "FROM THE FRONT: Railway timetables are giving way to troop schedules as reservists, ammunition and horses move toward the fighting. Merchants are already asking which ports and routes will remain safe."
  news_events_world.4.t: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFormatting] Launches invasion of [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.4.d: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFlag] has taken the field against [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFlag] in the [ROOT.Var('news_world_4_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]. The disparity between the two belligerents is plain to every observer, and there are those in the capitals who speak already of a swift and inexpensive conclusion. Others counsel caution. Our military correspondents recall how often distance, difficult country, disease and the quiet interference of third parties have humbled a force that appeared overwhelming upon paper, and how seldom a campaign begun with confident predictions has ended within the season its authors promised."
  news_events_world.4.f: "MILITARY DESK: The imbalance on paper may be considerable, but our correspondents caution that distance, terrain and foreign intervention have ruined many a supposedly easy campaign."
  news_events_world.5.t: "Coup d'État in [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.5.d: "The political order of [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFlag] has been overturned by force. Authority now rests with [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetRuler.GetFullName], and the state is to be governed as a [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetGovernment.GetName]. The ministries, the telegraph offices and the principal railway stations were secured before daybreak. Whether the army will follow the new masters in the provinces as readily as in the capital, whether existing laws and foreign treaties are to be honoured, and whether the displaced parties will submit or take to the country are questions that no one in the capital can yet answer with any confidence."
  news_events_world.5.f: "EXCLUSIVE FROM THE CAPITAL: Residents report soldiers posted at the ministries, the railway stations and the telegraph offices. By morning the uniforms had changed, one clerk told us, but nobody could say whose orders they were following."
  news_events_world.6.t: "[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] of [ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFormatting] Assassinated"
  news_events_world.6.d: "[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_6_character_ref').GetCharacter.GetFullName], aged [ROOT.Var('news_world_6_character_ref').GetCharacter.GetAge], has been struck down by an assassin while ruling [ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFlag]. The killing of a head of state has produced an immediate shock, with ministers moving to secure the capital, the garrison and the treasury, and to preserve at least the appearance of continuity. Foreign governments are seeking assurances that treaties and military commands remain undisturbed. The search for the conspiracy behind the deed has only begun, and every faction in the country has an interest in where the blame is seen to fall."
  news_events_world.6.f: "SECURITY DESK: Investigators hunt for accomplices while ministers race to prove the state remains in hand. The unanswered question is whether the assassin acted alone, or for a faction waiting to move next."
  news_events_world.7.t: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullNameNoFormatting] is Dead; [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFormatting] Mourns"
  news_events_world.7.d: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullName] has died at the age of [ROOT.Var('news_world_7_character_ref').GetCharacter.GetAge] while ruling [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFlag]. Black cloth hangs from the public buildings and the shops of the capital have closed their shutters. The succession now passes to whatever mechanism custom and law provide, and the ministers speak with one voice of continuity and settled policy. Yet every chancellery abroad is asking the same question in private: whether the change will alter alliances, alter policy, or alter the balance among the factions that have long surrounded the throne and now find it occupied anew."
  news_events_world.7.f: "FROM THE CAPITAL: Crowds gather for news of the succession while black cloth is hung from the public buildings. Behind the ceremonies, ministers are already competing to define what the next reign will mean."
  news_events_world.8.t: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetLastNameNoFormatting] Cast Down in [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.8.d: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetFullName] has been removed from power in [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFlag] while yet living, and [ROOT.Var('news_world_8_new_ruler_ref').GetCharacter.GetFullName] has taken the reins of state. The country is to be governed as a [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetGovernment.GetName]. A living ruler set aside without election, without death and without ordinary succession seldom admits of a simple explanation, and the official account has satisfied few. Diplomats are watching the appointments to the ministries and the movements of the garrison for some clue as to what passed behind closed doors, and whether the new administration rests upon consent or upon the bayonet."
  news_events_world.8.f: "POLITICAL ANALYSIS: A living ruler removed without an election, a death, or an ordinary succession rarely leaves a simple explanation behind him."
  news_events_world.9.t_presidential: "[ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName] of the [ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting] Wins [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting] Presidential Election"
  news_events_world.9.d_presidential: "The [ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting] has carried the election in [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], and [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName] takes the presidency. Candidates of the party polled [ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetCurrentVotingPowerShare|%1] of the votes cast. The result has been received with celebration in some quarters and open dismay in others, and the defeated interests are already disputing the conduct of the poll in several districts. Foreign governments are studying the outcome for what it may portend in diplomacy, in trade, in military policy, and in the wider temper of one of the foremost powers of the age."
  news_events_world.9.t_party: "[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting] Triumphant in [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting] Elections"
  news_events_world.9.d_party: "The [ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting] has emerged the strongest at the close of the campaign in [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], its candidates polling [ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetCurrentVotingPowerShare|%1] of the votes cast. Committee rooms in the great towns were still counting well past midnight, and in more than one borough the result is contested. Governments, investors and political movements abroad are now weighing what the new balance of parties may mean for policy at home and for the country's conduct abroad, and whether the ministry that emerges can command a working majority for any length of time."
  news_events_world.9.t_government: "[ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting] to Lead the Government of [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.9.d_government: "The [ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting] stands as the principal party in the government of [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag] following the election, having taken [ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetCurrentVotingPowerShare|%1] of the votes cast. Where the Crown remains above the contest, an election may reshape the whole balance of power beneath it without disturbing the head of state at all. Foreign governments and men of business are watching the new ministry closely, for the composition of a cabinet has often proved a surer guide to a country's intentions than any speech from the throne."
  news_events_world.9.t: "The Election in [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting] Concludes"
  news_events_world.9.d: "An election has concluded in [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], a country whose weight in the world makes the result an international event rather than a domestic contest. The returns have been telegraphed to every capital in Europe within hours of their declaration. Governments and political movements abroad are studying the balance of parties and the position of [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName], whose government may yet influence diplomacy, trade, the disposition of fleets and armies, and the broader temper of the age. At home, the work of forming an administration now begins in earnest."
  news_events_world.9.f: "ELECTION DESK: Party headquarters are celebrating, disputing and recounting in equal measure. The result will be read abroad as a clue to the country's next diplomatic and commercial direction."
  news_events_world.10.t_drought: "Drought Grips [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_drought: "The rains have failed across [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], where some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] souls depend upon the harvest. Fields lie parched, the reservoirs sink lower by the week, and farmers are cutting back their planting in expectation of the worst. Graziers drive their beasts further each day in search of water, and the corn dealers have begun marking up their futures accordingly. Relief committees are forming in the market towns. Should the dry weather hold through the season, a poor year may deepen into something a great deal worse, and the burden will fall first upon those least able to bear it."
  news_events_world.10.t_flood: "Great Flood in [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]; Many Feared Lost"
  news_events_world.10.d_flood: "The rivers have broken their banks across [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], drowning farms, roads and whole settlements in a district of some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] inhabitants. Bridges and rail embankments are being inspected for damage while rescue parties struggle toward communities cut off entirely by the water. Livestock losses are reported to be severe and the winter stores of many families are ruined outright. The damage to the crops and to the transport of the region will be felt in the markets long after the flood itself has receded from the fields."
  news_events_world.10.t_frost: "Bitter Frost Blights [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_frost: "An exceptional frost has settled over [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Growers report blackened fields and ruined orchards, the cold having reached crops already well advanced in their season. In a district supporting some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] people, the loss of a single harvest is no small matter. Merchants expect shortages in the worst-hit parishes before the month is out, and the farmers wait to learn whether a later planting can recover any part of what has been lost, or whether the year must simply be written off and endured."
  news_events_world.10.t_wildfire: "Wildfires in [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] cause evacuations"
  news_events_world.10.d_wildfire: "Fire is advancing through [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], driving families from their homes and threatening farms, timber and the roads between them. Smoke has darkened whole districts and the sun is reported red at midday. Local authorities are organising firebreaks with such crews as can be mustered, and the militia has been called upon in several parishes. With some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] people living in the affected state, the losses to property, pasture and standing timber may weigh upon the region long after the last of the flames is beaten out."
  news_events_world.10.t_hailstorm: "Hailstorm Ruins the Harvest in [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_hailstorm: "A violent hailstorm has swept [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], shredding the standing corn and breaking roofs, glass and the backs of exposed livestock. Farmers walk fields that stood near to harvest only hours before and find them beaten flat. In a state of some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] inhabitants, even a local destruction of crops is felt quickly in the price of bread and in the incomes of the countryside. The insurers are already receiving claims, and the parish authorities are counting the cost to those who carried no insurance at all."
  news_events_world.10.t_locust_swarm: "Locusts Descend Upon [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_locust_swarm: "Dense swarms of locusts have fallen upon [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], stripping the fields faster than the parishes can defend them. Granaries are being guarded day and night while farmers burn, beat and smoke the creatures away from what still stands. The swarms are reported to darken the sky at their passing. With some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] people in the affected districts, officials fear that want will follow close behind the insects should the plague persist or spread into the neighbouring agricultural country."
  news_events_world.10.t_heatwave: "Punishing Heat Settles Over [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_heatwave: "A punishing heat has gripped [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Wells are drawn low, livestock are dying in the fields, and the crops wilt under a sun that will not relent. The towns report deaths among the old and the very young, and the water carts are working from dawn until dark. The authorities of a state numbering some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] people are watching the health of the population as anxiously as the state of the harvest, knowing that prolonged heat strains food, water and transport at the same moment."
  news_events_world.10.t_disease_outbreak: "Blight Spreads Through [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_disease_outbreak: "A disease is spreading through the fields and herds of [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Inspectors are labouring to identify the affected land and stock before the contagion reaches the next district. Quarantine and slaughter may yet preserve the wider harvest, but they promise immediate ruin to the farmers whose beasts are condemned and whose fields are closed. In a state of some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] inhabitants, the consequence will be felt not only by the growers but by every household that buys at market."
  news_events_world.10.t_extreme_winds: "Tempest Leaves a Path of Ruin Through [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_extreme_winds: "Extreme winds have battered [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], tearing at roofs, trees, telegraph wires and standing crops alike. Road and rail traffic is slowed while crews clear the debris from the principal routes, and communication with several parishes has been interrupted entirely. Across a state of some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] people, the greatest loss is likely to come not from any single dramatic calamity but from the interruption of transport and harvest together, at the very season when both can least afford delay."
  news_events_world.10.t_torrential_rains: "Torrential Rains Drown the Fields of [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_torrential_rains: "Rain is falling without cease across [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], saturating the fields and flooding the low roads and river margins. Farmers fear that standing water will rot the crop in the ground even where the villages themselves remain dry. Merchants are watching the rail and market roads with mounting concern. In a district of some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] inhabitants, a wet season at harvest can cost as dearly as any storm, for the loss comes quietly and is not discovered until the sacks are opened."
  news_events_world.10.t_pollinator_surge: "Remarkable Season for the Orchards of [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_pollinator_surge: "Farmers across [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] report an extraordinary abundance of bees and other pollinating insects. Orchards and flowering crops are setting fruit at a rate seldom seen within living memory, and the older men of the parishes are consulted daily as to whether they recall its equal. Hopes are high for a generous harvest should the weather hold. In a state of some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] people, a strong season would ease the price of food and lift rural incomes well beyond the farms where the phenomenon began."
  news_events_world.10.t_optimal_sunlight: "A Golden Season in [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_optimal_sunlight: "An unusually favourable season of sun is blessing [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Farmers report vigorous growth and excellent prospects for those crops that ask for long, clear days. Traders are already preparing for heavier harvest traffic and the carriers have begun engaging additional waggons. In a district of some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] inhabitants, a full harvest is felt in every market and every household. The growers caution only that the skies must hold as they are for some weeks yet before the promise can be counted upon."
  news_events_world.10.t_moderate_rainfall: "Kindly Rains Bless [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_moderate_rainfall: "Steady and moderate rain has come to [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] at the most favourable moment of the growing season. The fields are drinking without the drowning that heavier storms bring, and the older farmers pronounce themselves satisfied, which is praise indeed. Across a state of some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] people, the prospect of a strong yield has already steadied the corn markets. Merchants are making room in their warehouses for a fuller flow of grain and produce than they had thought to expect this year."
  news_events_world.10.t_tsunami: "Great Wave Devastates the Coast of [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_tsunami: "A great wave has struck the coast of [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], driving destruction through the harbours and the low-lying settlements. Word from the shoreline remains fragmentary while rescue parties search the wreckage and a number of vessels are reported missing with all hands. With some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] people living in the affected state, the toll in lives cannot yet be reckoned, and the disruption to coastal trade threatens to persist long after the immediate work of rescue is finished."
  news_events_world.10.t_earthquake: "Earthquake Levels Towns in [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_earthquake: "A powerful earthquake has shaken [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], throwing down buildings and breaking roads, railways and water works. Rescue parties dig through the rubble by lamplight while further shocks hamper the search for the missing and drive the survivors into the open ground. Whole districts are reported in ruins. In a state numbering some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] inhabitants, even a limited zone of destruction may produce a heavy toll of life and a burden of reconstruction lasting years."
  news_events_world.10.t_calm_waters: "Calm Seas Favour the Ports of [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_calm_waters: "Exceptionally calm waters are reported about the coast of [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Fishing fleets and coastal shipping are working with few delays and the harbours are handling cargo under the happiest conditions the masters can remember. Should the pattern hold, merchants expect fewer losses at sea and a modest easing in the rates of insurance. For a populous coastal state of some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] people, a quiet season upon the water is felt directly in the price and supply of fish and imported goods alike."
  news_events_world.10.t_fog: "Dense Fog Blinds [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_fog: "A heavy fog has settled over [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], reducing visibility upon the roads, the railways and the water alike. Ships creep toward harbour with leadsmen sounding, and the trains move with the greatest caution between the signal boxes. The immediate danger is collision, and several minor accidents are already reported. Across a district of some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] inhabitants, a lasting fog will delay every delivery and disrupt the ordinary commerce of the towns."
  news_events_world.10.t_cyclone: "Cyclone Strikes [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_cyclone: "A cyclone is crossing [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] with destructive wind and drenching rain. Coastal communities report buildings unroofed, trees uprooted and communications severed, while the authorities scramble to provide shelter for those driven from their homes. With some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] people in the path of the storm, the combination of flood and wind raises fears of a calamity whose effects will be counted in months rather than weeks, and whose full extent will not be known until the wires are restored."
  news_events_world.10.t_ice: "Hard Ice Locks [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_ice: "Severe ice has taken hold across [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. The roads and railways grow treacherous, the waterways slow and in places stop altogether, and exposed crops and livestock suffer bitterly in the cold. Coal is moving badly at the very moment it is most wanted. Merchants warn that in a state of some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] people the interruption of transport may cost as dearly as the direct losses in the fields, should the freeze not break before the stores are exhausted."
  news_events_world.10.t_rough_waters: "Rough Seas Close the Harbours of [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_rough_waters: "Rough water is disrupting the coast of [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. The fishing boats remain in harbour, merchantmen delay their sailing, and the port authorities have posted warnings of dangerous approaches. Several vessels are overdue. For a coastal state of some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] inhabitants, repeated interruption at sea is quickly felt in the price of food, in the cost of insurance and in the movement of every imported article upon which the towns have come to depend."
  news_events_world.10.t_strong_winds: "Persistent Gales Harry [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_strong_winds: "Persistent strong winds are sweeping [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Exposed farms and transport routes are taking damage, and sailors and harbour officials alike are contending with difficult conditions along the whole coast. The gales are not everywhere destructive, but their duration is beginning to interfere with harvest work, with local travel and with the regular movement of goods. In a district of some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] people, such interference is felt in the markets within days."
  news_events_world.10.t_tropical_storm: "Tropical Storm Bears Down on [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_tropical_storm: "A tropical storm has moved into [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], bringing heavy rain, high wind and dangerous seas. The authorities are warning the low-lying communities while the ports reduce their traffic and farmers labour to secure what crops and stock they can. With some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] residents in the affected state, even a storm falling short of a cyclone may cause widespread disruption to shelter, to the harvest and to the coasting trade upon which many of the smaller settlements depend."
  news_events_world.10.t_fallback: "Extraordinary Conditions Reported in [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_fallback: "An extraordinary turn of weather is affecting [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] in [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Officials are gathering reports from the farms, the transport offices and the local markets to determine whether the effects are to be counted a calamity or a blessing, and the early accounts are contradictory. Because some [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] people live in the affected state, even a temporary change in the conditions of harvest may carry consequences well beyond the districts first touched by it."
  news_events_world.10.f: "FROM THE AFFECTED DISTRICT: Farmers and local officials describe ruined harvests, disrupted transport and anxious markets. Early reports remain incomplete, and the true scale of the losses may not be known for weeks."
  news_events_world.11.t: "Revolution in [ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.11.d: "A revolutionary rising has broken out against [ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFlag]. The rebels have organised themselves as [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetNameNoFlag] and proclaim a [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetGovernment.GetName] in place of the old order. Barricades have gone up in the working districts and portions of the garrison are reported to have gone over. The quarrel has passed from agitation into an armed contest for the state itself. Neighbouring governments are watching with undisguised anxiety to see whether the existing regime can survive the challenge, and what example a success would set beyond its borders."
  news_events_world.11.f: "FROM OUR CORRESPONDENT: Barricades are appearing faster than proclamations can be printed. Residents describe neighbourhoods where authority changes from street to street and rumour travels faster than any official order."
  news_events_world.12.t: "Revolutionaries Triumphant in [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.12.d: "The revolutionaries have won the civil war in [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFlag], and the machinery of a great state passes into the hands of a [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetGovernment.GetName] under [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetRuler.GetFullName]. The victory will be felt far beyond the country's borders, heartening its friends and alarming its enemies in equal measure. Foreign capitals will judge the victors not by their proclamations but by the laws they impose, the debts they acknowledge and the treaties they choose to honour. The first months of the new government will settle a great deal that the fighting did not."
  news_events_world.12.f: "ANALYSIS: Victory gives the revolutionaries the ministries, but not of itself the bureaucracy, the army, or the confidence of the public. Their first days in power may prove as decisive as the fighting that brought them there."
  news_events_world.13.t: "The Purchase of [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.13.d: "By the [ROOT.Var('news_world_13_news_treaty_ref').GetTreaty.GetNameNoFormatting], [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetName] has passed from [ROOT.Var('news_world_13_news_state_giver_ref').GetCountry.GetNameNoFlag] to [ROOT.Var('news_world_13_news_state_taker_ref').GetCountry.GetNameNoFlag]. The transferred territory is home to some [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetPopulationSize|D] people, which makes this no mere adjustment of the map. Administration, property, military access and the standing of the inhabitants must all now be settled, and the neighbouring governments are already reckoning what the new frontier means for their own security. The residents themselves were not consulted in the matter."
  news_events_world.13.f: "FROM THE FRONTIER: Residents wait to learn which laws, taxes and officials will follow the new flag. For those living upon the transferred land, a signature in a distant capital is an immediate change of government."
  news_events_world.14.t: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFormatting] Names [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFormatting] its Rival"
  news_events_world.14.d: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFlag] and [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFlag] have entered upon a declared rivalry. Two states of the first consequence have placed themselves in open competition, and the declaration is expected to harden alignments across the continent. Ambassadors remain at their posts, but the ordinary courtesies have grown notably cooler. Every future dispute between them, however small, will now be read in the light of this hostility, and questions that might once have been settled quietly between officials will be fought out in public before an attentive world."
  news_events_world.14.f: "FOREIGN DESK: Diplomats expect every future dispute between the two rivals to be interpreted through this new hostility, even questions that yesterday might have been settled quietly."
  news_events_world.15.t: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFormatting] Surrenders to [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetAdjectiveNoFormatting] Armed Forces"
  news_events_world.15.d: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFlag] has ceased to exist as an independent state, its remaining territory absorbed by [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag] under the terms enforced through the [ROOT.Var('news_world_15_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]. A government has been struck from the roll of nations, its ministries dissolved and its representatives abroad left without a country to serve. [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag] now bears the burden of the conquered land and its people, while the neighbouring powers consider whether this settles the quarrel or merely begets the next one."
  news_events_world.15.f: "FROM THE FORMER CAPITAL: Government signs are coming down and officials are deciding whether to serve the new authorities. A state may vanish from the maps faster than local loyalties disappear."
  news_events_world.16.t: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetLastNameNoFormatting] Succeeds to Power in [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.16.d: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetFullName], aged [ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetAge], has succeeded to the leadership of [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFlag] upon the death of the previous ruler. The country is governed as a [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetGovernment.GetName]. Because the state ranks among the foremost powers, diplomats are already taking the measure of the new ruler's friendships, convictions and capacity to secure authority during the vulnerable opening of a reign. The court speaks of continuity; the embassies are less certain, and their despatches home will be read with unusual care."
  news_events_world.16.f: "PALACE DESK: Courtiers speak publicly of continuity, but every succession reshuffles access and influence. Foreign ambassadors are already studying who stands closest to the new ruler."
  news_events_world.17.t: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFormatting] and [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFormatting] Enter an Alliance"
  news_events_world.17.d: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFlag] and [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFlag] have entered into the [ROOT.Var('news_world_17_news_treaty_ref').GetTreaty.GetNameNoFormatting], binding themselves in formal alliance. The terms have been published in part, though it is widely assumed that further understandings exist which have not been laid before any parliament. Military planners and rival governments are examining the commitments with the closest attention, for an alliance of this weight can transform the calculations of a future crisis and turn a local quarrel into a general war before either signatory has time to reconsider."
  news_events_world.17.f: "MILITARY ANALYSIS: An alliance matters most before the first shot is fired. General staffs will now redraw their plans on the assumption that war with one signatory may mean war with both."
  news_events_world.18.t: "The New Government of [ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.18.d: "[ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFlag] has enacted [ROOT.Var('news_world_18_news_new_law_ref').GetLaw.GetName], a change great enough to alter the very structure of the state. The country is now governed as a [ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetGovernment.GetName]. Foreign capitals are reconsidering their relations with the new order, while at home its friends celebrate and its enemies prepare for consequences they have long predicted. Lawyers and civil servants are already at work upon the practical business of the transformation, for titles, ministries and procedures that seemed permanent a week ago must now be rewritten entire."
  news_events_world.18.f: "CONSTITUTIONAL DESK: Lawyers and civil servants are working through the practical consequences of the new order. Titles, ministries and old procedures that once seemed permanent may now require rewriting."
  news_events_world.19.t: "The Tumultuous Situation in [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetNameNoFormatting] Grips Local Economy as State Falls Into Instablity"
  news_events_world.19.d: "Severe disorder is reported throughout [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetName], within [ROOT.Var('news_world_19_news_source_country_ref').GetCountry.GetNameNoFlag], a district numbering some [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetPopulationSize|D] inhabitants. Strikes, disturbances and the organisation of discontent have reached a pitch that threatens ordinary administration. Shops are closing early, public meetings draw crowds far beyond their announced purpose, and the constabulary has been reinforced from neighbouring counties. Should the agitation continue, it may weaken the government's hand considerably and disturb the commerce of the wider country."
  news_events_world.19.f: "FROM THE STREETS: Shopkeepers report closing early, and public meetings are drawing unusually large crowds. The authorities insist order can be restored, but residents say the tension is visible long before any riot begins."
  news_events_world.20.t: "Recession in [ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.20.d: "[ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFlag] has suffered a sharp and sudden contraction of its commerce. The national product has fallen from some £[ROOT.Var('news_world_20_news_recession_previous_gdp_value').GetValue|D] to £[ROOT.Var('news_world_20_news_recession_current_gdp_value').GetValue|D], a decline of [ROOT.Var('news_world_20_news_recession_drop_value').GetValue|%1] within the month. Order books are thinning, credit is tightening, and manufacturers speak of weaker demand than they have known in years. Working men fear for their wages and their places, while foreign markets watch anxiously for the contagion to spread through trade and investment into houses that believed themselves secure."
  news_events_world.20.f: "MARKETS: Bankers and manufacturers search for signs that the contraction is temporary. One analyst warns that confidence may recover quickly, until dismissals and failed firms turn a bad month into a lasting slump."
  news_events_world.21.t: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFormatting] Reaches 1 Billion GDP"
  news_events_world.21.d: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFlag] has become the first nation in the world to pass one thousand millions of pounds in annual product, the figure standing at approximately £[ROOT.Var('news_world_21_news_billion_gdp_value').GetValue|D] when the reckoning was made. The concentration of manufacture, trade and purchasing power now assembled there sets a mark against which every rival must measure itself. Economists dispute what the achievement truly signifies, and it says nothing of who receives the wealth, but it announces an industrial scale that no government can any longer afford to ignore."
  news_events_world.21.f: "FINANCIAL DESK: Economists already dispute what the achievement truly means. It says little of who receives the wealth, but it announces an industrial scale that rivals cannot ignore."
  news_events_world.22.t: "[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFormatting] Proclaims New International Agreement"
  news_events_world.22.d: "A new bloc has been formed under [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFlag]: [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName], gathered about the [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetIdentity.GetName] principle and numbering [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers] member states at its founding. Other governments are examining its charter and its membership with considerable care, for such an association may redirect trade, alliance and political influence across whole regions. Whether it proves a durable instrument or a convenient arrangement of the moment will not be known until its members are tested by a crisis none of them chose."
  news_events_world.22.f: "DIPLOMATIC ANALYSIS: New blocs often advertise unity before they have been tested by a real crisis. Foreign ministries will watch the first disagreement between members more closely than the founding ceremony."
  news_events_world.23.t: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFormatting] Defaults Upon its Debts!"
  news_events_world.23.d: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFlag] has failed upon its obligations. At the moment of default the public principal stood at approximately £[ROOT.Var('news_world_23_news_default_principal_value').GetValue|D], against a credit limit of £[ROOT.Var('news_world_23_news_default_credit_limit_value').GetValue|D]. Creditors face heavy losses and the state's future borrowing will come dearer, if it comes at all. Foreign banks and governments are watching for contagion, for political disorder, and for any sign that the treasury can no longer sustain the army and administration upon which the government's authority rests."
  news_events_world.23.f: "FINANCIAL DESK: Bondholders are pricing politics as much as arithmetic. A negotiated settlement could restore confidence; a prolonged default may make every future loan dearer long after the crisis has passed."
  news_events_world.24.t: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFormatting] Takes its Place Among the Great Powers"
  news_events_world.24.d: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFlag] has risen into the first rank of nations, its annual product now standing at roughly £[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetGDP|D]. The promotion reflects a formidable accumulation of wealth, arms and influence, and grants the state a voice in the great diplomatic questions of the day. The established powers are already reckoning whether to court the newcomer as an ally or to reckon with it as a rival, and the newcomer itself may find that recognition brings obligations as heavy as the privileges it confers."
  news_events_world.24.f: "FOREIGN DESK: Invitations, protocol and diplomatic calculation will change almost at once. The newcomer may find that recognition brings not only influence but the expectation of taking sides in quarrels once thought distant."
  news_events_world.25.t: "The Decline of [ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.25.d: "[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFlag] has fallen from the first rank of powers, its annual product now reckoned at roughly £[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetGDP|D]. The change is more than ceremonial: it announces a diminished capacity to command attention and to shape the balance of the world. At home, ministers face pressure to restore the strength and standing that has been lost, and the opposition will not want for material. Abroad, former partners may be expected to bargain rather harder than they did a year ago."
  news_events_world.25.f: "ANALYSIS: The loss of standing will be felt in conference rooms before it is visible upon any map. Former partners may bargain harder, while rivals test whether the decline is temporary or lasting."
  news_events_world.26.t: "[ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFormatting]'s Leadership Contested"
  news_events_world.26.d: "A struggle for mastery has begun within [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName], an association of [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers] member states. [ROOT.Var('news_world_26_news_bloc_contender_ref').GetCountry.GetNameNoFlag] has raised a challenge against [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFlag], the present leader. Officials insist that ordinary cooperation continues undisturbed, though delegations are counting their supporters with unusual care. A prolonged contest may divide several governments at once and invite outside powers to profit by the confusion, as has happened often enough before."
  news_events_world.26.f: "INSIDE THE BLOC: Officials insist that ordinary cooperation continues, but delegations are counting supporters with unusual care. A leadership contest fought without armies can still divide allies into rival camps."
  news_events_world.27.t: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFormatting] Seizes Leadership of Alliance"
  news_events_world.27.d: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFlag] has bested [ROOT.Var('news_world_27_news_bloc_loser_ref').GetCountry.GetNameNoFlag] for the leadership of [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetName], an association numbering [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetNumMembers] member states. Governments throughout the organisation are weighing whether the change will bind them closer together or provoke resistance among those who stood by the former leader. The contest is finished, but the loyalties it exposed are not so easily settled, and the new leader inherits colleagues who would plainly have preferred another outcome."
  news_events_world.27.f: "DIPLOMATIC DESK: The contest is finished, but loyalties may not be. The new leader inherits an organisation containing governments that would have preferred the loser."
  news_events_world.28.t: "[ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFormatting] and [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFormatting] Part Ways"
  news_events_world.28.d: "The [ROOT.Var('news_world_28_news_treaty_ref').GetTreaty.GetNameNoFormatting], which bound [ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFlag] to [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFlag], has been dissolved. The rupture removes an important commitment and obliges both governments to reconsider their military planning and their footing in any future crisis. Each capital has issued a statement of regret couched in terms that persuade nobody. Their rivals are already studying the breach for the opportunities it may offer, and the question now is where the former partners look for security, and who is prepared to replace what has been lost."
  news_events_world.28.f: "FOREIGN DESK: Diplomats describe the rupture as more significant than the formal cancellation. The question now is where the two former partners look for security, and who is prepared to replace the relationship."
  news_events_world.29.t: "PANIC! Global Shortage of [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] !"
  news_events_world.29.d: "A severe want of [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] has taken hold of the world market, and prices have climbed far beyond anything the trade considers ordinary. Demand upon the market stood at some [ROOT.Var('news_world_29_news_shortage_imports_value').GetValue|D] against only [ROOT.Var('news_world_29_news_shortage_exports_value').GetValue|D] offered for sale, a pressure of [ROOT.Var('news_world_29_news_shortage_pressure_value').GetValue|2] to one. Manufacturers, merchants and governments are all scrambling to secure what stocks remain, and the higher cost is working its way into every industry that depends upon the article."
  news_events_world.29.f: "MARKETS: Buyers report contracts rewritten by the hour. One broker described the scramble for [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] as a market in which having money no longer guarantees supply."
  news_events_world.30.t: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] and [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] Redraw the Map"
  news_events_world.30.d_exchange: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] and [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] have concluded an exchange of territory. [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting], home to some [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D] people, passes from [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] to [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting], while [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting], with some [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D] inhabitants, moves in the opposite direction. Borders have been redrawn by agreement rather than by war, and the inhabitants of both provinces wake to find themselves the subjects of a different government."
  news_events_world.30.d_a_to_b: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] has agreed to transfer [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting] to [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]. The territory contains some [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D] people, who were not consulted in the matter. Administration, taxation and security must now be reordered under the new sovereign, and questions of property, language and local office will occupy the lawyers for years. The neighbouring governments are studying a change of frontier accomplished by negotiation rather than by force of arms, and drawing their own conclusions."
  news_events_world.30.d_b_to_a: "[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] has agreed to transfer [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting] to [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]. The territory contains some [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D] people, who were not consulted in the matter. Administration, taxation and security must now be reordered under the new sovereign, and questions of property, language and local office will occupy the lawyers for years. The neighbouring governments are studying a change of frontier accomplished by negotiation rather than by force of arms, and drawing their own conclusions."
  news_events_world.30.f: "FROM THE FRONTIER: Surveyors may move the line in days, but residents must live with the consequences for years. Traders, landowners and local officials are already asking which rules survive the transfer."
  news_events_world.31.t: "Workers Strike in [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]!"
  news_events_world.31.d_nationwide: "A wave of strikes is sweeping [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] from end to end. Work has stopped in the manufactories and upon the public works while organised labour presses its demands against masters and ministers alike. The stoppage is now large enough to touch the production of the whole country, and the newspapers of every party are agreed upon nothing except its seriousness. There are fears that continued confrontation will breed radicalism and force the government to choose between concession and repression, neither of which it can undertake without cost."
  news_events_world.31.d_mining: "A great strike of miners has broken out in [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], with [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] at the heart of the disruption. The men have left the pits amid bitter feeling, and the flow of coal and metal into industry is threatened at the very season when demand is highest. Masters and ministers are pressed to settle before want spreads from the pit-head into the factories and the railways. The colliery districts report their own committees keeping order, which the authorities find as troubling as any disorder would be."
  news_events_world.31.d_industrial: "The factory hands have walked out in [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], with [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] among the principal centres of the strike. Production stands interrupted as labourers and machinists press their demands for wages and hours. The masters warn of orders missed, works standing idle and contracts that will go abroad and not return, while the union men argue that the stoppage proves precisely the point they have long urged: that the country runs upon the labour of those who are least consulted about how it is governed."
  news_events_world.31.d_railway: "The railwaymen are out in [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], with the disruption centred upon [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]. A long stoppage threatens far more than the lines themselves: the factories depend upon the trains for fuel and material, the cities for their food, and the army for its movement. Perishable goods are already spoiling in the sidings. Ministers are pressed to restore the service or come to terms before the paralysis spreads, and there is open talk in some quarters of operating the railways by other means entirely."
  news_events_world.31.d_movement: "The workers of [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] have begun a strike of plainly political character in [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]. The stoppage belongs to a wider movement rather than to any single grievance of the workshop, and it carries the quarrels of the factory floor directly into national politics. The masters fear the example will spread to other cities, while the organisers hope that visible disruption will oblige the government to treat with them as a political force and not merely as a disturbance to be policed."
  news_events_world.31.d: "A considerable strike has broken out in [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], drawing the attention of the whole country to wages, hours and the condition of the working man. The disruption is grave enough to alarm ministers and manufacturers, who fear that a long stoppage will cut production and encourage imitation elsewhere. Subscriptions are being raised for the strikers' families in several towns. The government's response may determine whether the dispute ends in negotiation, in repression, or in a wider wave of unrest than any party intends."
  news_events_world.31.f: "FROM THE PICKET LINE: The organisers insist the stoppage will continue until real concessions are made, while the masters warn that every idle shift deepens the cost and emboldens workers elsewhere to join them."

  ## Reader responses, one per story.
  news_events_world.1.a: "Let us hope wiser heads prevail."
  news_events_world.2.a: "The affair grows larger by the day."
  news_events_world.3.a: "God help them both."
  news_events_world.4.a: "A quarrel between unequals is soon settled."
  news_events_world.5.a: "Bayonets make a poor foundation."
  news_events_world.6.a: "A wicked business."
  news_events_world.7.a: "May he rest."
  news_events_world.8.a: "There is more to this than the papers say."
  news_events_world.9.a: "The people have spoken."
  news_events_world.10.a: "A hard season for the countryside."
  news_events_world.11.a: "The streets will decide it now."
  news_events_world.12.a: "The old order is finished."
  news_events_world.13.a: "Bought and sold like an estate."
  news_events_world.14.a: "Two dogs and one bone."
  news_events_world.15.a: "Struck from the map entirely."
  news_events_world.16.a: "Long may he reign."
  news_events_world.17.a: "Signatures today, soldiers tomorrow."
  news_events_world.18.a: "The constitution is remade."
  news_events_world.19.a: "The authorities had ample warning."
  news_events_world.20.a: "Lean years ahead."
  news_events_world.21.a: "The workshop of the world indeed."
  news_events_world.22.a: "A new arrangement of the powers."
  news_events_world.23.a: "The creditors will not forget this."
  news_events_world.24.a: "A new voice at the table."
  news_events_world.25.a: "Every empire has its evening."
  news_events_world.26.a: "Allies quarrel as bitterly as enemies."
  news_events_world.27.a: "The matter is settled, for now."
  news_events_world.28.a: "So much for perpetual friendship."
  news_events_world.29.a: "Prices will be felt in every household."
  news_events_world.30.a: "Borders moved with a pen, for once."
  news_events_world.31.a: "The working man has made himself heard."
  news_events_world.32.t: "The [ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting] Back Down!"
  news_events_world.32.d: "[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetNameNoFormatting] has backed down in its diplomatic confrontation with [ROOT.Var('news_world_32_news_backdown_target_ref').GetCountry.GetNameNoFormatting], yielding the principal demand rather than carry the dispute to war. What had been presented as a test of national resolve has ended at the conference table, and foreign chancelleries are already weighing what the retreat may mean for [ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting] prestige."
  news_events_world.32.f: "DIPLOMATIC DESK: Telegrams from the foreign capitals report immediate relief that war has been avoided. At home, however, opponents of the government are already asking whether peace was purchased at too dear a price."
  news_events_world.32.a: "So ends the crisis."

