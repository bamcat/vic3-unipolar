l_english:

 smd_news_un.1.t:0 "UN Imposes Sanctions on [ROOT.Var('smd_news_un_1_news_source_country_ref').GetCountry.GetNameNoFormatting]"
 smd_news_un.1.d:0 "The United Nations General Assembly has voted to impose sanctions on [ROOT.Var('smd_news_un_1_news_source_country_ref').GetCountry.GetNameNoFlag]. The measures target the country's banks and financial sector and are expected to choke off foreign investment and slow construction for years to come. Officials in [ROOT.Var('smd_news_un_1_news_event_state_ref').GetState.GetName] have denounced the vote as interference in their internal affairs. Supporters of the motion say the government left the world no choice, while critics warn that ordinary citizens will bear the heaviest cost."
 smd_news_un.1.f:0 "FROM THE UNITED NATIONS: Delegates filed out of the chamber in silence after the vote, and several ambassadors were seen in urgent conversation with their capitals before the session had even closed."
 smd_news_un.1.a:0 "The world has spoken."
 smd_news_un.2.t:0 "UN Condemns [ROOT.Var('smd_news_un_2_news_source_country_ref').GetCountry.GetNameNoFormatting]"
 smd_news_un.2.d:0 "The United Nations General Assembly has passed a resolution formally condemning [ROOT.Var('smd_news_un_2_news_source_country_ref').GetCountry.GetNameNoFlag]. The vote carries no immediate penalties, but it is a heavy blow to the country's international standing and is likely to make foreign investors more cautious. Officials in [ROOT.Var('smd_news_un_2_news_event_state_ref').GetState.GetName] have rejected the resolution as one-sided. Diplomats say the vote is a warning, and that sanctions may follow if the government does not change course."
 smd_news_un.2.f:0 "FROM THE UNITED NATIONS: The resolution passed after hours of heated debate, and the delegation of the condemned country walked out of the chamber before the result was announced."
 smd_news_un.2.a:0 "A rebuke from the world."
