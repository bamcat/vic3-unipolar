l_english:
 UNI_NS_TITLE: "INTERESTING NATIONS"
 UNI_NS_START_HEADER: "Free Selection"
 UNI_NS_START_HINT: "Begin the campaign and choose any nation on the map."
 UNI_NS_START_TOOLTIP: "Start the campaign and select your nation from the world map."

 UNI_NS_USA_NAME: "United States"
 UNI_NS_USA_TAGLINE: "The sole superpower."
 UNI_NS_USA_BODY: "The Soviet Union is gone and Washington stands alone atop the international order. The Gulf War has demonstrated American arms to a watching world, and the question is no longer who leads but what that leadership is for. At home a recession and an election year complicate the triumph."
 UNI_NS_USA_STATS: "The War on Drugs · The September 11 Attacks · War on Terror"

 UNI_NS_RUS_NAME: "Russian Federation"
 UNI_NS_RUS_TAGLINE: "An empire dissolved."
 UNI_NS_RUS_BODY: "The Union dissolved in December and Russia inherited its debts, its arsenal and its humiliation. Prices were freed in January and savings evaporated with them. Fourteen republics are gone, the army is coming home to nowhere, and reformers and the old guard are already at each other's throats."
 UNI_NS_RUS_STATS: "The Chechen Conflicts · Wild 90s"

 UNI_NS_PRC_NAME: "China"
 UNI_NS_PRC_TAGLINE: "The Grand People's Republic"
 UNI_NS_PRC_BODY: "Four years of retrenchment after Tiananmen end with an old man's walk through Shenzhen. The Southern Tour settles the argument: reform accelerates, the special economic zones multiply, and growth becomes the party's claim to legitimacy. Political liberalisation is not on offer."
 UNI_NS_PRC_STATS: "The One China Policy · Deng Xiaoping's Southern Tour"

 UNI_NS_BHT_NAME: "Republic of India"
 UNI_NS_BHT_TAGLINE: "A billion people enter the world market."
 UNI_NS_BHT_BODY: "A balance of payments crisis forced the gold reserves onto a plane to London and the reforms followed within months. Tariffs fall, licensing is scrapped and the rupee is devalued. The arsenal is small but real, the neighbourhood is hostile, and the coalition holding Delhi is fragile."
 UNI_NS_BHT_STATS: ""

 UNI_NS_JPN_NAME: "Japan"
 UNI_NS_JPN_TAGLINE: "An economic miracle"
 UNI_NS_JPN_BODY: "Land and equities have collapsed from their 1989 peak and the banks are carrying losses they will not admit for years. Japan remains the world's second economy and its foremost creditor, but the machinery that built that position has begun to seize, and the political settlement is cracking with it."
 UNI_NS_JPN_STATS: ""

 UNI_NS_GER_NAME: "Germany"
 UNI_NS_GER_TAGLINE: "A nation united"
 UNI_NS_GER_BODY: "Two years after unification the eastern Länder are an industrial ruin on the federal balance sheet. The solidarity surcharge bites, the Bundesbank holds rates high, and Maastricht asks Germany to surrender the mark. The largest economy in Europe is also its most anxious."
 UNI_NS_GER_STATS: "European Union"

 UNI_NS_GBR_NAME: "United Kingdom"
 UNI_NS_GBR_TAGLINE: "The post-Thatcher settlement"
 UNI_NS_GBR_BODY: "Major has won an election few expected him to and inherits a recession, a divided party and a currency pegged above what the market believes it is worth. Defending the pound is draining the reserves. The coal industry is finished, the Union question is reopening, and Europe splits the Conservatives."
 UNI_NS_GBR_STATS: "The Troubles in Northern Ireland · European Union"

 UNI_NS_FRA_NAME: "French Republic"
 UNI_NS_FRA_TAGLINE: "Maastricht goes to referendum"
 UNI_NS_FRA_BODY: "Mitterrand has staked his final term on European integration and must now ask the electorate to ratify it. The franc fort holds the currency to the mark at the cost of unemployment. Farmers are in the streets over agricultural reform and the Socialists face annihilation at the next legislative."
 UNI_NS_FRA_STATS: "European Union"

 UNI_NS_CAN_NAME: "Canada"
 UNI_NS_CAN_TAGLINE: "Quebec is asked again, and answers again."
 UNI_NS_CAN_BODY: "The Charlottetown Accord is the second attempt to settle the constitutional question and it will go to the people in October. Free trade with the Americans is being extended southward to Mexico. The recession has been deep, the deficit is large, and national unity is genuinely in doubt."
 UNI_NS_CAN_STATS: "The Quebec Situation"

 UNI_NS_BRZ_NAME: "Brazil"
 UNI_NS_BRZ_TAGLINE: "Inflation in the largest South-American economy"
 UNI_NS_BRZ_BODY: "Collor came to power promising to slay inflation and is leaving it under investigation for corruption. Prices are rising faster than the currency can be renamed. Rio hosts the Earth Summit while the accounts burn, and the military's return to barracks is recent enough to be worth watching."
 UNI_NS_BRZ_STATS: ""

 UNI_NS_SAF_NAME: "South Africa"
 UNI_NS_SAF_TAGLINE: "Apartheid comes to an end"
 UNI_NS_SAF_BODY: "De Klerk has asked his electorate whether to keep talking and received a decisive yes. Mandela is out, the ANC is legal, and CODESA grinds through the terms of transfer while Boipatong and the townships supply the violence that could still wreck it. The old order is legislating its own abolition."
 UNI_NS_SAF_STATS: ""
