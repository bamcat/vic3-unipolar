l_russian:
 GDP_TOOLTIP:0 "#header #tooltippable_name [Country.GetAdjective]ий#! [concept_gdp]#!\n@money![Country.MakeScope.ScriptValue('cwp_gdp')|Dv] (#u #tooltippable #tooltip:[Country.GetTooltipTag],COUNTRY_GDP_OWNERSHIP_TOOLTIP [Country.GetDomesticallyOwnedGDPFraction|%1b]#!#!#!) принадлежащего стране ВВП ([Country.GetGDPRanking])\n@money![Country.MakeScope.ScriptValue('cwp_gdp_per_capita')|2*v] [Concept('concept_gdp_per_capita', 'ВВП на душу населения')] ([Country.GetGDPPerCapitaRanking])"
 COUNTRY_GDP_OWNERSHIP_TOOLTIP:0 "#header [concept_gdp_ownership] [Country.GetAltName('RU_CL_RP')]#!\n#u [Country.GetDomesticallyOwnedGDPFraction|%1b]#! (@money![Country.GetGDP|Dv]) принадлежащего стране ВВП\n$TOOLTIP_DELIMITER$\n[SelectLocalization(IsZero_CFixedPoint(Country.GetForeignOwnedGDPFraction), 'NO_FOREIGNLY_OWNED_PERCENTAGE', 'COUNTRY_FOREIGNLY_OWNED_PERCENTAGE')]\n\n[SelectLocalization(IsZero_CFixedPoint(Country.GetGDPOwnedInForeignCountries), 'NO_OWNED_FOREIGN_GDP_BY_COUNTRY', 'OWNED_FOREIGN_GDP_BY_COUNTRY')]"

 COUNTRY_ALL_GDP:0 "@money!#v [Country.GetGDPWithOwnershipsInForeignCountries|D]#!"
 DOMESTIC_COUNTRY_GDP:0 "@money!#v [Country.GetGDP|D]#!"
 FOREIGN_COUNTRY_GDP:0 "@money!#u [Country.GetGDPOwnedInForeignCountries|Db]#!"
 COUNTRY_ALL_OWNERSHIP:0 "#u [Country.GetDomesticallyOwnedGDPFraction|%1b]#![ConcatIfNeitherEmpty(' + ', AddLocalizationIf(NotZero_CFixedPoint(Country.GetGDPOwnedInForeignCountries), 'FOREIGN_COUNTRY_GDP'))]"

 COUNTRY_POPULATION:0 "#title [Concept('concept_pop', 'Население')]#!:\n#variable [Country.MakeScope.ScriptValue('smd_population')|Dv]#!"
 COUNTRY_GDP:0 "#title $GDP_SHORT$#!:\n#variable @money![Country.MakeScope.ScriptValue('cwp_gdp')|Dv]#!"

 ERROR_DEER_TOOLTIP:0 "#header О боже!#!\n#instruction ЛКМ#!, чтобы открыть журнал ошибок\n#instruction ПКМ#!, чтобы убрать сообщение (пока вновь что-нибудь не сломается)"
 ERROR_MANUL_TOOLTIP:0 "#header Читайте манула!#!\n#instruction ЛКМ#!, чтобы открыть журнал ошибок\n#instruction ПКМ#!, чтобы убрать сообщение (пока вновь что-нибудь не сломается)"

 OH_DEER:0 "«#italic О боже, у нас#! #bold [ErrorDeer.NumberOrErrors|v]#! #italic ошибок!#!»"
 ERROR_MANUL:0 "#italic У нас#! #bold [ErrorDeer.NumberOrErrors|v]#! #italic ошибок?! Надо ознакомиться с манулом!#!"
 ERROR_DEER_SLOW_TICK_OPERATIONS:0 "#header Медленные операции#!"

 EXPENSES_GOVERNMENT_BUILDING_GOODS:0 "$TAB$#tooltippable #tooltip:[GetPlayer.GetTooltipTag],GOVERNMENT_BUILDINGS_EXPENSES_BREAKDOWN,GovernmentGoodsExpenseTooltip #N @money!-[GetPlayer.GetGovernmentGoodsExpenses|D-]#!#!#! на [Concept('concept_budget_goods_for_government_buildings', 'товары для правительственных сооружений')]\n$TAB$#tooltippable;tooltip:SMD_HEALTHCARE_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_healthcare_expense_value')|D-]#!#!#! [concept_smd_healthcare]\n$TAB$#tooltippable;tooltip:SMD_EDUCATION_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_education_expense_value')|D-]#!#!#! [concept_smd_education]\n$TAB$#tooltippable;tooltip:SMD_POLICE_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_police_expense_value')|D-]#!#!#! [concept_smd_police]"

 LITERACY_UNINCORPORATED_TOOLTIP:0 "\n$TOOLTIP_DELIMITER$\nС учётом [Concept('concept_unincorporated_state', 'невключённых областей')] #variable [Country.GetNumTotalLiteratePops|*]#! из #variable [Country.GetTotalPopulation|*]#! ([Country.GetTotalLiteracyRate|%v]) [Concept('concept_pop', 'гр. населения')] в #variable [Country.GetAltName('RU_CL_PP')]#! являются грамотными ([Country.GetTotalLiteracyRanking])"

 POP_TOOLTIP:0 "#tooltip_header [Concept('concept_pop', 'Население')]#!\nТекущее: [Country.MakeScope.ScriptValue('smd_population')|Dv] ([Country.GetPopulationRanking])\n[Country.GetPopGrowthDesc]$POP_TOOLTIP_DELAYED$"

 SMD_HEALTHCARE_EXPENSE_TOOLTIP:0 "#header Расходы: [concept_smd_healthcare]#!\nТекущие затраты на государственную систему здравоохранения. Зависят прежде всего от числа уровней здания «$building_government_administration$» ([concept_bureaucracy]), а также от уровня инвестиций в [concept_institution], численности населения (без группы «$peasants$») и среднего показателя «[concept_sol]».\nТекущие ежемесячные затраты: @money!-[GetPlayer.MakeScope.ScriptValue('smd_healthcare_expense_value')|D-]#!"

 SMD_EDUCATION_EXPENSE_TOOLTIP:0 "#header Расходы: [concept_smd_education]#!\nТекущие затраты на государственное образование. Зависят прежде всего от числа уровней здания «$building_government_administration$» ([concept_bureaucracy]), а также от уровня инвестиций в [concept_institution], численности населения (без группы «$peasants$») и среднего показателя «[concept_sol]».\nТекущие ежемесячные затраты: @money!-[GetPlayer.MakeScope.ScriptValue('smd_education_expense_value')|D-]#!"

 SMD_POLICE_EXPENSE_TOOLTIP:0 "#header Расходы: [concept_smd_police]#!\nТекущие затраты на охрану правопорядка. Зависят прежде всего от числа уровней здания «$building_government_administration$» ([concept_bureaucracy]), а также от уровня инвестиций в [concept_institution], численности населения (без группы «$peasants$») и среднего показателя «[concept_sol]».\nТекущие ежемесячные затраты: @money!-[GetPlayer.MakeScope.ScriptValue('smd_police_expense_value')|D-]#!"
