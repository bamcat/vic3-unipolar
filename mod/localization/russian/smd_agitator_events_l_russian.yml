l_russian:
 smd_agitators.1.t:0 "Тупак Шакур мёртв"
 smd_agitators.1.d:0 "В ночь на 7 сентября 1996 года [SCOPE.sCharacter('smd_tupac_scope').GetFullName] получил четыре пулевых ранения, когда сидел в машине на красном светофоре в Лас-Вегасе. 13 сентября он скончался от ран в возрасте 25 лет. Стрелявший скрылся, обвинения никому не предъявлены. По всей стране поклонники собираются, чтобы почтить его память."
 smd_agitators.1.f:0 "Его четвёртый альбом, All Eyez on Me, вышел в начале этого года."
 smd_agitators.1.a:0 "Голос, который заставили замолчать"
