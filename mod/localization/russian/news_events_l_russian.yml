l_russian:

 news.1.t:0 "Примечательное событие"
 news.1.d:0 "Тестовая газетная вырезка. Если это выглядит как газета, с названием издания вашей страны наверху, статьёй на бумаге и БЕЗ тёмной рамки или строки заголовка вокруг окна, значит, этот тип окна работает. Его также по-прежнему можно должно быть перетаскивать."
 news.1.f:0 "Наши корреспонденты готовы к работе."
 news.1.a:0 "Важнейшая новость!"

 news.2.t:0 "РЕВОЛЮЦИЯ В РОССИИ"
 news.2.d:0 "[ROOT.Var('news_test_2_news_attacker_ref').GetCountry.GetNameNoFlag] официально объявила войну государству [ROOT.Var('news_test_2_news_defender_ref').GetCountry.GetNameNoFlag]. Вдоль границы мобилизуются войска, а канцелярии великих держав с серьёзной тревогой следят за происходящим. Дипломаты отозваны, биржи охвачены смятением. Наши корреспонденты направляются к месту боевых действий, а новые подробности ожидаются с вечерней почтой. Дипломаты отозваны, биржи охвачены смятением. Наши корреспонденты направляются к месту боевых действий, а новые подробности ожидаются с вечерней почтой. Дипломаты отозваны, биржи охвачены смятением. Наши корреспонденты направляются к месту боевых действий, а новые подробности ожидаются с вечерней почтой."
 news.2.f:0 "Там, где дипломатия потерпела неудачу, говорят пушки."
 news.2.a:0 "Поистине тяжёлые вести."
