l_russian:
 smd_amendment_rural_levies:0 "Сельские поборы"
 smd_amendment_rural_levies_desc:0 "Помимо сельскохозяйственного налога, волостные и деревенские власти взимают с крестьянских дворов сборы, зерновые квоты и трудовую повинность, чтобы содержать местные школы, дороги и чиновников. Сильнее всего это бьёт по беднейшим крестьянам."
 smd_amendment_rural_levies_modifier:0 "Сельские поборы"
 smd_amendment_rural_levies_modifier_desc:0 "Местные сборы и трудовая повинность приносят деньги из деревни ценой недовольства крестьян."
