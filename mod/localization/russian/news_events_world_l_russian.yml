l_russian:
  news_events_world.1.t: "[ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFormatting] и [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFormatting] на грани войны!"
  news_events_world.1.d: "[ROOT.Var('news_world_1_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] поставила [ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFlag] и [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFlag] в открытое противостояние. Две ведущие державы эпохи теперь стоят друг против друга в формальном споре, и европейские канцелярии охвачены невиданной за многие годы деятельностью. Курьеры круглые сутки следуют между столицами, биржи лихорадит, а офицерские клубы почти не говорят ни о чём другом. Будет ли спор улажен переговорами или перерастёт в войну, зависит от требований ближайших недель, передвижения войск к границе и того, какие правительства решат поддержать каждую сторону."
  news_events_world.1.f: "ДИПЛОМАТИЧЕСКИЙ ОТДЕЛ: Посланники обеих сторон, как сообщается, работают далеко за полночь. Один иностранный наблюдатель назвал атмосферу вежливой на публике и откровенно враждебной за закрытыми дверями."
  news_events_world.2.t: "КРИЗИС! Между [ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFormatting] и [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.2.d: "[ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFlag] бросила весь свой вес в [ROOT.Var('news_world_2_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] против [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFlag]. Держава первого ранга решила вмешаться в спор, который иначе мог бы остаться региональным, и её вступление полностью меняет характер кризиса. Ссора соседей превратилась в вопрос для всего концерта наций. Министерства иностранных дел внимательно изучают заявленные требования и новые обязательства, а меньшие правительства региона тихо решают, какую сторону они меньше всего могут позволить себе обидеть."
  news_events_world.2.f: "АНАЛИЗ: То, что начиналось как региональная ссора, теперь занимает все крупнейшие внешнеполитические ведомства; малые правительства молча решают, кого они могут позволить себе раздражить."
  news_events_world.3.t: "ВОЙНА! Между [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFormatting] и [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFormatting]!"
  news_events_world.3.d: "[ROOT.Var('news_world_3_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] перешла от дипломатии к открытой войне между [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFlag] и [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFlag]. Послы отозваны, резервисты вызваны в части, биржи охвачены беспорядком. С рассвета у призывных пунктов стоят толпы, а железнодорожные компании передали подвижной состав военным ведомствам. Торговцы уже спрашивают, какие порты и маршруты останутся открыты и по какой цене можно будет застраховать груз, пока правительства континента оценивают обязательства по своим договорам."
  news_events_world.3.f: "С ФРОНТА: Обычные расписания уступают воинским эшелонам, к боям идут резервисты, боеприпасы и лошади. Купцы уже выясняют, какие порты и пути останутся безопасными."
  news_events_world.4.t: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFormatting] начинает вторжение в [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.4.d: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFlag] вступила в войну против [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFlag] в рамках [ROOT.Var('news_world_4_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]. Неравенство сил очевидно, и в столицах уже говорят о быстрой и дешёвой победе. Другие призывают к осторожности. Наши военные корреспонденты напоминают, сколько раз расстояния, трудная местность, болезни и скрытое вмешательство третьих держав унижали армии, казавшиеся подавляющими на бумаге, и как редко кампании, начатые самоуверенными прогнозами, завершались в обещанный срок."
  news_events_world.4.f: "ВОЕННЫЙ ОТДЕЛ: На бумаге перевес может быть огромным, но расстояние, рельеф и иностранное вмешательство погубили немало кампаний, считавшихся лёгкими."
  news_events_world.5.t: "Государственный переворот в [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.5.d: "Политический порядок в [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFlag] был свергнут силой. Власть теперь принадлежит [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetRuler.GetFullName], а государство будет управляться как [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetGovernment.GetName]. Министерства, телеграфные конторы и главные железнодорожные станции были заняты ещё до рассвета. Последует ли армия за новыми хозяевами в провинциях так же покорно, как в столице, будут ли соблюдаться законы и международные договоры и смирятся ли отстранённые партии, пока никто не может сказать с уверенностью."
  news_events_world.5.f: "ЭКСКЛЮЗИВ ИЗ СТОЛИЦЫ: Жители сообщают о солдатах у министерств, вокзалов и телеграфа. К утру, рассказал один служащий, форма уже сменилась, но никто не мог объяснить, чьи именно приказы выполняются."
  news_events_world.6.t: "[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] государства [ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFormatting] убит"
  news_events_world.6.d: "[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_6_character_ref').GetCharacter.GetFullName], в возрасте [ROOT.Var('news_world_6_character_ref').GetCharacter.GetAge] лет, был убит покушавшимся во время правления [ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFlag]. Убийство главы государства вызвало немедленный шок: министры спешат обезопасить столицу, гарнизон и казну и хотя бы сохранить видимость преемственности. Иностранные правительства требуют заверений, что договоры и военное командование остаются неизменными. Поиск заговора только начался, и каждой фракции важно, на кого падёт обвинение."
  news_events_world.6.f: "ОТДЕЛ БЕЗОПАСНОСТИ: Следователи ищут сообщников, пока министры пытаются доказать, что государство остаётся под контролем. Главный вопрос, действовал ли убийца один или за ним стоит фракция, готовая к следующему шагу."
  news_events_world.7.t: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullNameNoFormatting] умер; [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFormatting] в трауре"
  news_events_world.7.d: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullName] умер в возрасте [ROOT.Var('news_world_7_character_ref').GetCharacter.GetAge] лет, находясь у власти в [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFlag]. Государственные здания затянуты чёрной тканью, магазины столицы закрыли ставни. Наследование теперь пойдёт по порядку, установленному законом и обычаем, а министры говорят о преемственности. Но каждая иностранная канцелярия задаёт один и тот же вопрос: изменит ли новый правитель союзы, политику или равновесие фракций вокруг трона."
  news_events_world.7.f: "ИЗ СТОЛИЦЫ: Толпы ждут новостей о наследовании, государственные здания покрывают траурным полотном. За церемониями министры уже борются за то, кто определит смысл нового правления."
  news_events_world.8.t: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetLastNameNoFormatting] свергнут в [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.8.d: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetFullName] был отстранён от власти в [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFlag] ещё при жизни, а [ROOT.Var('news_world_8_new_ruler_ref').GetCharacter.GetFullName] принял управление государством. Страна будет управляться как [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetGovernment.GetName]. Отстранение живого правителя без выборов, смерти или обычного наследования редко имеет простое объяснение, и официальная версия удовлетворила немногих. Дипломаты следят за назначениями и движениями гарнизона, пытаясь понять, что происходило за закрытыми дверями и основана ли новая власть на согласии или на штыках."
  news_events_world.8.f: "ПОЛИТИЧЕСКИЙ АНАЛИЗ: Живой правитель, отстранённый без выборов, смерти или обычной преемственности, почти никогда не оставляет простой истории."
  news_events_world.9.t_presidential: "[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting] побеждает на [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting] президентских выборах"
  news_events_world.9.d_presidential: "[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting] победила на выборах в [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], и [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName] становится президентом. Кандидаты партии получили [ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetCurrentVotingPowerShare|%1] голосов. В одних кругах результат встречен празднованием, в других, открытым унынием, а проигравшие уже оспаривают процедуру голосования в ряде округов. Иностранные правительства изучают исход выборов как возможный знак будущего курса в дипломатии, торговле и военной политике."
  news_events_world.9.t_party: "[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting] торжествует на [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting] выборах"
  news_events_world.9.d_party: "[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting] стала сильнейшей силой по итогам кампании в [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], набрав [ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetCurrentVotingPowerShare|%1] голосов. В крупных городах подсчёт продолжался далеко за полночь, а в нескольких округах результаты оспариваются. Правительства, инвесторы и политические движения за рубежом оценивают, что новое соотношение партий означает для внутренней и внешней политики и сможет ли будущий кабинет удержать рабочее большинство."
  news_events_world.9.t_government: "[ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting] возглавит правительство [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.9.d_government: "После выборов [ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting] стала главной правительственной партией в [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], получив [ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetCurrentVotingPowerShare|%1] голосов. Там, где Корона остаётся над партийной борьбой, выборы могут полностью изменить баланс власти под ней, не затронув главу государства. Иностранные правительства и деловые круги внимательно следят за новым кабинетом: его состав нередко говорит о намерениях страны больше, чем любая тронная речь."
  news_events_world.9.t: "Выборы в [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting] завершены"
  news_events_world.9.d: "Выборы завершились в [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], чьё мировое значение превращает итог в международное событие. Результаты телеграфировали в европейские столицы в течение нескольких часов. Правительства и политические движения за рубежом изучают расстановку партий и положение [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName], чьё правительство может повлиять на дипломатию, торговлю, флот и армию. В самой стране начинается формирование новой администрации."
  news_events_world.9.f: "ИЗБИРАТЕЛЬНЫЙ ОТДЕЛ: Партийные штабы одновременно празднуют, спорят и пересчитывают. За рубежом результат читают как намёк на следующий дипломатический и торговый курс страны."
  news_events_world.10.t_drought: "Засуха охватила [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_drought: "Дожди не пришли в [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], где около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек зависят от урожая. Поля пересохли, водоёмы мелеют, крестьяне сокращают посевы. Скотоводы гонят стада всё дальше в поисках воды, торговцы зерном повышают цены, в рыночных городах создаются комитеты помощи. Если сухая погода сохранится, плохой год может превратиться в серьёзное бедствие."
  news_events_world.10.t_flood: "Большое наводнение в [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]; многие считаются погибшими"
  news_events_world.10.d_flood: "Реки вышли из берегов по всему [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], затопив фермы, дороги и целые поселения в районе с населением около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D]. Проверяются мосты и железнодорожные насыпи, спасатели пытаются добраться до отрезанных водой общин. Потери скота велики, зимние запасы многих семей уничтожены. Ущерб урожаю и транспорту будет ощущаться на рынках ещё долго после схода воды."
  news_events_world.10.t_frost: "Лютый мороз губит [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_frost: "Необычайный мороз накрыл [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Земледельцы сообщают о почерневших полях и погибших садах: холод ударил по уже развившимся посевам. В районе, кормящем около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек, потеря одного урожая имеет серьёзные последствия. Купцы ждут дефицита в наиболее пострадавших приходах ещё до конца месяца."
  news_events_world.10.t_wildfire: "Пожары в [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] вынуждают к эвакуации"
  news_events_world.10.d_wildfire: "Огонь распространяется по [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], вынуждая семьи покидать дома и угрожая хозяйствам, лесам и дорогам. Дым затемнил целые округа, солнце в полдень выглядит красным. Власти создают противопожарные полосы и вызывают ополчение. При населении около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек ущерб имуществу, пастбищам и лесу будет ощущаться ещё долго после тушения пожаров."
  news_events_world.10.t_hailstorm: "Град уничтожает урожай в [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_hailstorm: "Сильнейший град прошёл над [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], разбив посевы, крыши, стёкла и травмировав скот. Поля, ещё несколько часов назад готовые к жатве, лежат прибитыми к земле. В государстве с населением около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек даже локальная гибель урожая быстро отражается на цене хлеба и доходах деревни. Страховые компании уже получают заявления о потерях."
  news_events_world.10.t_locust_swarm: "Саранча обрушилась на [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_locust_swarm: "Плотные рои саранчи обрушились на [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], уничтожая поля быстрее, чем жители способны их защитить. Амбары охраняют круглые сутки, крестьяне жгут и дымят, пытаясь отогнать насекомых. Рои, как сообщается, затемняют небо. При населении около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] власти опасаются, что вслед за насекомыми придёт голод."
  news_events_world.10.t_heatwave: "Изнуряющая жара накрыла [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_heatwave: "Изнуряющая жара охватила [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Колодцы мелеют, скот гибнет, посевы вянут под беспощадным солнцем. В городах сообщают о смертях стариков и маленьких детей, водовозы работают с рассвета до темноты. Власти государства с населением около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек следят за здоровьем людей столь же тревожно, как за состоянием урожая."
  news_events_world.10.t_disease_outbreak: "Мор распространяется по [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_disease_outbreak: "Болезнь распространяется по полям и стадам [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Инспекторы стараются определить поражённые земли и скот прежде, чем зараза перейдёт в следующий округ. Карантин и забой могут спасти остальную часть урожая, но означают немедленное разорение для затронутых хозяев. В государстве с населением около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] последствия почувствуют все покупатели на рынке."
  news_events_world.10.t_extreme_winds: "Буря оставляет полосу разрушений в [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_extreme_winds: "Ураганные ветры ударили по [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], срывая крыши, валя деревья, обрывая телеграф и уничтожая посевы. Дорожное и железнодорожное движение замедлено, несколько приходов полностью лишены связи. В государстве с населением около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек крупнейший ущерб может прийти не от одной катастрофы, а от одновременного срыва транспорта и жатвы."
  news_events_world.10.t_torrential_rains: "Ливни топят поля [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_torrential_rains: "Дождь без конца льёт над [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], насыщая почву и затапливая низкие дороги и берега рек. Земледельцы боятся, что стоячая вода сгноит урожай в земле даже там, где деревни остаются сухими. Купцы тревожно следят за железными и рыночными дорогами. В районе с населением около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек мокрый сезон во время жатвы может стоить не меньше любой бури."
  news_events_world.10.t_pollinator_surge: "Необычайный сезон в садах [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_pollinator_surge: "Фермеры по всему [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] сообщают о необычайном изобилии пчёл и других опылителей. Сады и цветущие культуры завязывают плоды в количестве, какого не помнят старожилы. Если погода сохранится, ожидается щедрый урожай. Для государства с населением около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек хороший сезон снизит цены на продовольствие и поднимет сельские доходы."
  news_events_world.10.t_optimal_sunlight: "Золотой сезон в [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_optimal_sunlight: "Необычайно благоприятное солнце стоит над [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Зерно и фрукты хорошо созревают, земледельцы ожидают урожая выше обычного, если погода сохранится. Торговцы уже готовятся к большему потоку грузов. В районе с населением около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек богатый урожай почувствуют каждый рынок и каждый дом."
  news_events_world.10.t_moderate_rainfall: "Благодатные дожди над [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_moderate_rainfall: "Ровный умеренный дождь пришёл в [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] в самый благоприятный момент сезона. Поля получают влагу без разрушительных ливней, и даже старые крестьяне довольны. В государстве с населением около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек перспектива хорошего урожая уже успокоила зерновые рынки, а купцы освобождают склады под больший поток продукции."
  news_events_world.10.t_tsunami: "Огромная волна опустошает побережье [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_tsunami: "Огромная волна ударила по побережью [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], разрушив порты и низинные поселения. Сведения с берега обрывочны, спасатели ищут людей среди обломков, несколько судов пропали со всей командой. При населении около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек число жертв пока невозможно определить, а прибрежная торговля останется нарушенной ещё долго."
  news_events_world.10.t_earthquake: "Землетрясение разрушает города в [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_earthquake: "Сильное землетрясение потрясло [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], обрушив здания и повредив дороги, железные дороги и водопровод. Спасатели разбирают завалы при лампах, повторные толчки мешают поискам и вынуждают жителей оставаться на открытом месте. Целые кварталы лежат в руинах. В государстве с населением около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек даже ограниченная зона разрушений может привести к большим жертвам и многолетнему восстановлению."
  news_events_world.10.t_calm_waters: "Спокойное море благоприятствует портам [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_calm_waters: "У побережья [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag] установилось необычайно спокойное море. Рыбаки и каботаж работают почти без задержек, порты обрабатывают грузы в лучших условиях за многие годы. Если так продолжится, купцы ожидают меньше потерь и более дешёвое страхование. Для прибрежного государства с населением около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек спокойный сезон напрямую отражается на цене рыбы и привозных товаров."
  news_events_world.10.t_fog: "Густой туман ослепляет [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_fog: "Густой туман накрыл [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], ограничив видимость на дорогах, железных дорогах и воде. Суда медленно идут к портам, поезда движутся с крайней осторожностью. Главная опасность, столкновения; уже сообщается о нескольких небольших авариях. В районе с населением около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек затяжной туман задержит поставки и нарушит обычную торговлю."
  news_events_world.10.t_cyclone: "Циклон обрушился на [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_cyclone: "Циклон проходит через [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], неся разрушительный ветер и ливни. Прибрежные поселения сообщают о сорванных крышах, поваленных деревьях и оборванной связи, власти ищут убежище для лишившихся жилья. При населении около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек сочетание ветра и наводнения грозит бедствием, последствия которого будут измеряться месяцами."
  news_events_world.10.t_ice: "Сильный лёд сковал [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_ice: "Сильное обледенение охватило [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Дороги и железные дороги опасны, водные пути замедлились или остановились, посевы и скот страдают от холода. Уголь перевозится плохо именно тогда, когда он особенно нужен. В государстве с населением около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек транспортные перебои могут стоить не меньше прямых потерь в полях."
  news_events_world.10.t_rough_waters: "Штормовое море закрывает порты [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_rough_waters: "Штормовое море нарушает жизнь побережья [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Рыбацкие лодки остаются в портах, торговые суда откладывают выход, портовые власти предупреждают об опасных подходах; несколько кораблей опаздывают. Для прибрежного государства с населением около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек повторные задержки быстро сказываются на ценах продовольствия, страховании и импорте."
  news_events_world.10.t_strong_winds: "Продолжительные штормы терзают [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_strong_winds: "Сильные устойчивые ветры метут [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Открытые хозяйства и транспортные пути повреждены, моряки и портовые службы борются с тяжёлыми условиями по всему побережью. Ветер не везде разрушителен, но его продолжительность уже мешает жатве, местным поездкам и движению товаров. В районе с населением около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек это отражается на рынках за считанные дни."
  news_events_world.10.t_tropical_storm: "Тропический шторм приближается к [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_tropical_storm: "Тропический шторм вошёл в [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], неся сильный дождь, ветер и опасное море. Власти предупреждают низинные поселения, порты сокращают движение, крестьяне стараются спасти урожай и скот. При населении около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек даже шторм слабее циклона способен широко нарушить жильё, урожай и каботажную торговлю."
  news_events_world.10.t_fallback: "Необычные условия в [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_fallback: "Необычная перемена погоды влияет на [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Власти собирают сведения с ферм, транспортных служб и рынков, пытаясь понять, считать ли последствия бедствием или благом; первые сообщения противоречивы. Поскольку в регионе живёт около [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] человек, даже временное изменение условий урожая может иметь последствия далеко за пределами первых затронутых районов."
  news_events_world.10.f: "ИЗ ПОСТРАДАВШЕГО РАЙОНА: Крестьяне и местные власти описывают погибшие урожаи, перебои транспорта и тревожные рынки. Первые сведения неполны, и истинный размер потерь может выясниться лишь через недели."
  news_events_world.11.t: "Революция в [ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.11.d: "Против [ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFlag] вспыхнуло революционное восстание. Мятежники организовались как [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetNameNoFlag] и провозглашают [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetGovernment.GetName] вместо старого порядка. В рабочих кварталах выросли баррикады, часть гарнизона, по сообщениям, перешла на сторону восставших. Спор вышел за рамки агитации и превратился в вооружённую борьбу за само государство. Соседние правительства с нескрываемой тревогой следят, выдержит ли существующий режим и какой пример победа революции подаст за границей."
  news_events_world.11.f: "ОТ НАШЕГО КОРРЕСПОНДЕНТА: Баррикады появляются быстрее, чем успевают печатать прокламации. Жители описывают кварталы, где власть меняется от улицы к улице, а слухи движутся быстрее официальных приказов."
  news_events_world.12.t: "Революционеры победили в [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.12.d: "Революционеры выиграли гражданскую войну в [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFlag], и машина крупного государства переходит в руки [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetGovernment.GetName] под руководством [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetRuler.GetFullName]. Победа будет ощущаться далеко за пределами страны, ободряя друзей и тревожа врагов. Иностранные столицы будут судить победителей не по прокламациям, а по законам, которые они введут, долгам, которые признают, и договорам, которые решат соблюдать. Первые месяцы новой власти решат многое из того, чего не решила война."
  news_events_world.12.f: "АНАЛИЗ: Победа даёт революционерам министерства, но не автоматически бюрократию, армию и доверие общества. Первые дни у власти могут оказаться столь же важны, как бои, которые привели их туда."
  news_events_world.13.t: "Покупка [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.13.d: "По [ROOT.Var('news_world_13_news_treaty_ref').GetTreaty.GetNameNoFormatting] [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetName] перешёл от [ROOT.Var('news_world_13_news_state_giver_ref').GetCountry.GetNameNoFlag] к [ROOT.Var('news_world_13_news_state_taker_ref').GetCountry.GetNameNoFlag]. На переданной территории живёт около [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetPopulationSize|D] человек, так что это не просто правка карты. Теперь предстоит решить вопросы управления, собственности, военного доступа и положения жителей, а соседние правительства уже подсчитывают, что новая граница означает для их безопасности. Самих жителей никто не спрашивал."
  news_events_world.13.f: "С ГРАНИЦЫ: Жители ждут, какие законы, налоги и чиновники придут вместе с новым флагом. Для тех, кто живёт на переданной земле, подпись в далёкой столице означает мгновенную смену власти."
  news_events_world.14.t: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFormatting] объявляет [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFormatting] своим соперником"
  news_events_world.14.d: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFlag] и [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFlag] вступили в объявленное соперничество. Два государства первого значения поставили себя в открытое противостояние, и декларация, вероятно, укрепит разделение лагерей по всему континенту. Послы остаются на местах, но обычная вежливость заметно охладела. Каждый будущий спор, каким бы малым он ни был, теперь будет рассматриваться через призму этой вражды, а вопросы, которые раньше решались тихо между чиновниками, будут разыгрываться публично перед всем миром."
  news_events_world.14.f: "МЕЖДУНАРОДНЫЙ ОТДЕЛ: Дипломаты ожидают, что любой будущий спор между соперниками будут объяснять новой враждой, даже если ещё вчера его можно было урегулировать незаметно."
  news_events_world.15.t: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFormatting] сдаётся [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetAdjectiveNoFormatting] войскам"
  news_events_world.15.d: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFlag] перестала существовать как независимое государство; оставшаяся территория поглощена [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag] на условиях, навязанных через [ROOT.Var('news_world_15_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]. Одно правительство вычеркнуто из числа наций, его министерства распущены, представители за рубежом остались без страны. [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag] теперь несёт бремя завоёванной земли и её населения, а соседние державы размышляют, положило ли это конец спору или только породило следующий."
  news_events_world.15.f: "ИЗ БЫВШЕЙ СТОЛИЦЫ: Государственные вывески снимают, чиновники решают, будут ли служить новым властям. Государство может исчезнуть с карт быстрее, чем исчезают местные привязанности."
  news_events_world.16.t: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetLastNameNoFormatting] приходит к власти в [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.16.d: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetFullName], в возрасте [ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetAge] лет, возглавил [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFlag] после смерти предыдущего правителя. Страна управляется как [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetGovernment.GetName]. Поскольку государство относится к ведущим державам, дипломаты уже оценивают связи, убеждения и способность нового правителя закрепить власть в уязвимый начальный период. Двор говорит о преемственности; посольства менее уверены и будут читать каждое сообщение с особой тщательностью."
  news_events_world.16.f: "ДВОРЦОВЫЙ ОТДЕЛ: Придворные публично говорят о преемственности, но любая смена власти перераспределяет доступ и влияние. Иностранные послы уже выясняют, кто ближе всего к новому правителю."
  news_events_world.17.t: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFormatting] и [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFormatting] заключают союз"
  news_events_world.17.d: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFlag] и [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFlag] вступили в [ROOT.Var('news_world_17_news_treaty_ref').GetTreaty.GetNameNoFormatting], связав себя формальным союзом. Условия опубликованы лишь частично, и широко предполагается существование дополнительных договорённостей, не вынесенных на обсуждение парламентов. Военные планировщики и соперничающие правительства внимательно изучают обязательства: союз такого веса способен полностью изменить расчёты будущего кризиса и превратить местную ссору в общую войну прежде, чем любой из подписантов успеет передумать."
  news_events_world.17.f: "ВОЕННЫЙ АНАЛИЗ: Союз важнее всего до первого выстрела. Генеральные штабы теперь будут планировать исходя из того, что война с одним подписантом может означать войну с обоими."
  news_events_world.18.t: "Новое правительство [ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.18.d: "[ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFlag] приняла [ROOT.Var('news_world_18_news_new_law_ref').GetLaw.GetName], изменение, достаточно крупное, чтобы перестроить саму структуру государства. Страна теперь управляется как [ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetGovernment.GetName]. Иностранные столицы пересматривают отношения с новым порядком, дома его сторонники празднуют, а противники готовятся к последствиям, которые давно предсказывали. Юристы и чиновники уже разбирают практические детали преобразования: титулы, министерства и процедуры, казавшиеся постоянными ещё неделю назад, приходится переписывать."
  news_events_world.18.f: "КОНСТИТУЦИОННЫЙ ОТДЕЛ: Юристы и служащие разбирают практические последствия новой системы. Титулы, министерства и старые порядки, прежде считавшиеся вечными, могут потребовать полной переработки."
  news_events_world.19.t: "Беспорядки в [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetNameNoFormatting] бьют по экономике и расшатывают порядок"
  news_events_world.19.d: "Серьёзные беспорядки охватили [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetName] в [ROOT.Var('news_world_19_news_source_country_ref').GetCountry.GetNameNoFlag], район с населением около [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetPopulationSize|D] человек. Забастовки, волнения и организованное недовольство достигли уровня, угрожающего обычному управлению. Магазины закрываются раньше, публичные собрания собирают толпы намного больше заявленных, полиция получила подкрепления. Если агитация продолжится, она способна заметно ослабить правительство и нарушить торговлю всей страны."
  news_events_world.19.f: "С УЛИЦ: Владельцы магазинов говорят, что закрываются раньше, а публичные собрания необычайно многолюдны. Власти обещают восстановить порядок, но жители утверждают, что напряжение видно задолго до начала любого бунта."
  news_events_world.20.t: "Рецессия в [ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.20.d: "[ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFlag] пережила резкое и внезапное сокращение хозяйственной активности. Национальный продукт упал примерно с £[ROOT.Var('news_world_20_news_recession_previous_gdp_value').GetValue|D] до £[ROOT.Var('news_world_20_news_recession_current_gdp_value').GetValue|D], то есть на [ROOT.Var('news_world_20_news_recession_drop_value').GetValue|%1] за месяц. Заказы редеют, кредит дорожает, промышленники говорят о самой слабой за многие годы потребности. Рабочие опасаются за зарплаты и места, а зарубежные рынки тревожно следят, не перекинется ли кризис через торговлю и инвестиции."
  news_events_world.20.f: "РЫНКИ: Банкиры и промышленники ищут признаки того, что спад временный. Один аналитик предупреждает: доверие может вернуться быстро, пока увольнения и банкротства не превратят плохой месяц в долгую депрессию."
  news_events_world.21.t: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFormatting] достигает ВВП в 1 миллиард"
  news_events_world.21.d: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFlag] стала первой страной мира, чей годовой продукт превысил тысячу миллионов фунтов; при подсчёте он составлял около £[ROOT.Var('news_world_21_news_billion_gdp_value').GetValue|D]. Сосредоточение промышленности, торговли и покупательной способности задаёт новую планку для всех соперников. Экономисты спорят, что именно означает это достижение, и цифра ничего не говорит о распределении богатства, но промышленный масштаб уже невозможно игнорировать."
  news_events_world.21.f: "ФИНАНСОВЫЙ ОТДЕЛ: Экономисты уже спорят о настоящем значении достижения. Оно мало говорит о том, кому достаётся богатство, но заявляет о масштабе промышленности, который соперники не могут игнорировать."
  news_events_world.22.t: "[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFormatting] провозглашает новое международное соглашение"
  news_events_world.22.d: "Под руководством [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFlag] сформирован новый блок: [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName], основанный вокруг принципа [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetIdentity.GetName] и насчитывающий [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers] государств-членов. Другие правительства внимательно изучают его устав и состав, поскольку такое объединение способно перенаправить торговлю, союзы и политическое влияние целых регионов. Будет ли оно прочным инструментом или временным удобством, станет ясно лишь в кризисе, которого его участники не выбирали."
  news_events_world.22.f: "ДИПЛОМАТИЧЕСКИЙ АНАЛИЗ: Новые блоки часто демонстрируют единство до первой настоящей проверки. Иностранные ведомства будут следить за первым разногласием членов внимательнее, чем за церемонией основания."
  news_events_world.23.t: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFormatting] объявляет дефолт по долгам!"
  news_events_world.23.d: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFlag] не выполнила свои обязательства. На момент дефолта основная сумма государственного долга составляла примерно £[ROOT.Var('news_world_23_news_default_principal_value').GetValue|D] при кредитном лимите £[ROOT.Var('news_world_23_news_default_credit_limit_value').GetValue|D]. Кредиторы понесут тяжёлые потери, будущие займы станут дороже, если вообще будут доступны. Иностранные банки и правительства следят за распространением кризиса, политическими волнениями и признаками того, что казна больше не способна содержать армию и администрацию."
  news_events_world.23.f: "ФИНАНСОВЫЙ ОТДЕЛ: Владельцы облигаций оценивают политику не меньше, чем арифметику. Договорённость может вернуть доверие; затяжной дефолт сделает каждый будущий заём дороже ещё долгие годы."
  news_events_world.24.t: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFormatting] входит в число великих держав"
  news_events_world.24.d: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFlag] поднялась в первый ранг наций, её годовой продукт теперь составляет около £[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetGDP|D]. Повышение отражает огромную концентрацию богатства, вооружений и влияния и даёт государству голос в важнейших дипломатических вопросах. Старые великие державы уже решают, искать ли дружбы нового участника или готовиться к соперничеству, а он сам может обнаружить, что признание приносит обязанности не легче привилегий."
  news_events_world.24.f: "МЕЖДУНАРОДНЫЙ ОТДЕЛ: Приглашения, протокол и дипломатические расчёты изменятся почти немедленно. Новая держава узнает, что признание означает не только влияние, но и ожидание занимать сторону в прежде далёких спорах."
  news_events_world.25.t: "Упадок [ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.25.d: "[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFlag] выпала из первого ряда держав, её годовой продукт теперь оценивается примерно в £[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetGDP|D]. Изменение не просто церемониально: оно означает меньшую способность заставлять мир считаться с собой и формировать международное равновесие. Дома министры испытывают давление с требованием вернуть утраченную силу и положение; за рубежом прежние партнёры, вероятно, будут торговаться жёстче, чем год назад."
  news_events_world.25.f: "АНАЛИЗ: Потеря статуса будет заметна в переговорных комнатах раньше, чем на картах. Бывшие партнёры станут жёстче, а соперники проверят, временный ли это упадок."
  news_events_world.26.t: "Лидерство [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFormatting] оспорено"
  news_events_world.26.d: "Внутри [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName], объединения из [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers] государств, началась борьба за первенство. [ROOT.Var('news_world_26_news_bloc_contender_ref').GetCountry.GetNameNoFlag] бросила вызов [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFlag], нынешнему лидеру. Чиновники уверяют, что обычное сотрудничество продолжается, но делегации необычно тщательно считают сторонников. Затяжная борьба может одновременно расколоть несколько правительств и дать внешним державам возможность воспользоваться путаницей."
  news_events_world.26.f: "ВНУТРИ БЛОКА: Чиновники утверждают, что сотрудничество идёт как прежде, но делегации тщательно считают сторонников. Борьба за лидерство без армий всё равно способна разделить союзников на лагеря."
  news_events_world.27.t: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFormatting] захватывает руководство союзом"
  news_events_world.27.d: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFlag] одолела [ROOT.Var('news_world_27_news_bloc_loser_ref').GetCountry.GetNameNoFlag] в борьбе за руководство [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetName], объединением из [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetNumMembers] государств. Правительства внутри организации оценивают, сплотит ли смена руководства союз или вызовет сопротивление среди тех, кто поддерживал прежнего лидера. Борьба завершена, но выявленные ею лояльности не исчезают так легко."
  news_events_world.27.f: "ДИПЛОМАТИЧЕСКИЙ ОТДЕЛ: Борьба окончена, но не обязательно раскол. Новый лидер получает организацию, где часть правительств предпочла бы победителя с другой стороны."
  news_events_world.28.t: "[ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFormatting] и [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFormatting] расходятся"
  news_events_world.28.d: "[ROOT.Var('news_world_28_news_treaty_ref').GetTreaty.GetNameNoFormatting], связывавший [ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFlag] и [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFlag], расторгнут. Разрыв снимает важное обязательство и заставляет оба правительства пересмотреть военные планы и положение в будущих кризисах. Обе столицы выпустили заявления о сожалении, которым мало кто верит. Соперники уже изучают открывшиеся возможности; теперь вопрос в том, где бывшие партнёры будут искать безопасность и кто готов заменить утраченную связь."
  news_events_world.28.f: "МЕЖДУНАРОДНЫЙ ОТДЕЛ: Дипломаты считают сам разрыв важнее формальной отмены договора. Теперь главное, где бывшие партнёры будут искать безопасность и кто готов занять освободившееся место."
  news_events_world.29.t: "ПАНИКА! Мировой дефицит [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting]!"
  news_events_world.29.d: "Мировой рынок охвачен острой нехваткой [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting], и цены поднялись намного выше обычного. Спрос составлял около [ROOT.Var('news_world_29_news_shortage_imports_value').GetValue|D], тогда как на продажу было предложено лишь [ROOT.Var('news_world_29_news_shortage_exports_value').GetValue|D], давление [ROOT.Var('news_world_29_news_shortage_pressure_value').GetValue|2] к одному. Промышленники, торговцы и правительства спешат обеспечить оставшиеся запасы, а удорожание уже проходит по всем отраслям, зависящим от товара."
  news_events_world.29.f: "РЫНКИ: Покупатели сообщают, что контракты переписывают каждый час. Один брокер назвал гонку за [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] рынком, где даже наличие денег больше не гарантирует поставку."
  news_events_world.30.t: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] и [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] перекраивают карту"
  news_events_world.30.d_exchange: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] и [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] договорились об обмене территориями. [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting], где живёт около [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D] человек, переходит от [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] к [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting], а [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting] с примерно [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D] жителей идёт в обратном направлении. Границы изменены соглашением, а не войной, и жители обеих провинций просыпаются под властью другого правительства."
  news_events_world.30.d_a_to_b: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] согласилась передать [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting] государству [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]. На территории живёт около [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D] человек, которых никто не спрашивал. Управление, налоги и безопасность должны быть перестроены под нового суверена; вопросы собственности, языка и местных должностей займут юристов на годы. Соседние правительства изучают изменение границы, достигнутое переговорами, а не оружием."
  news_events_world.30.d_b_to_a: "[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] согласилась передать [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting] государству [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]. На территории живёт около [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D] человек, которых никто не спрашивал. Управление, налоги и безопасность должны быть перестроены под нового суверена; вопросы собственности, языка и местных должностей займут юристов на годы. Соседние правительства изучают изменение границы, достигнутое переговорами, а не оружием."
  news_events_world.30.f: "С ГРАНИЦЫ: Землемеры могут сдвинуть линию за несколько дней, но жителям придётся жить с последствиями годами. Торговцы, землевладельцы и местные чиновники уже выясняют, какие правила переживут передачу."
  news_events_world.31.t: "ЗАБАСТОВКА! Рабочие объединяются в [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]!"
  news_events_world.31.d_nationwide: "Волна забастовок охватила [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] от края до края. Работа остановлена на фабриках и общественных стройках, организованные рабочие выдвигают требования хозяевам и министрам. Масштаб остановки уже затрагивает производство всей страны, и газеты всех партий согласны только в одном, положение серьёзно. Есть опасение, что затяжное противостояние усилит радикализм и заставит правительство выбирать между уступками и репрессиями."
  news_events_world.31.d_mining: "Крупная забастовка шахтёров вспыхнула в [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], с [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] в центре событий. Люди покинули шахты, и поток угля и металла в промышленность оказался под угрозой в момент особенно высокого спроса. Хозяев и министров требуют договориться, прежде чем нехватка перейдёт от шахт к фабрикам и железным дорогам. В горных районах собственные комитеты рабочих поддерживают порядок, что тревожит власти почти не меньше беспорядка."
  news_events_world.31.d_industrial: "Фабричные рабочие прекратили работу в [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], а [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] стал одним из главных центров стачки. Производство прервано, рабочие и машинисты требуют повышения зарплат и сокращения рабочего дня. Хозяева предупреждают о потерянных заказах и контрактах, которые уйдут за границу; профсоюзы отвечают, что забастовка доказывает их давний тезис: страна держится на труде тех, кого меньше всего спрашивают о том, как ею управлять."
  news_events_world.31.d_railway: "Железнодорожники бастуют в [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], особенно сильно в [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]. Долгая остановка грозит не только железным дорогам: фабрикам нужны поезда для топлива и материалов, городам, для продовольствия, армии, для передвижения. Скоропортящиеся товары уже портятся на запасных путях. Министров требуют восстановить движение или договориться, пока паралич не распространился."
  news_events_world.31.d_movement: "Рабочие [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] начали явно политическую забастовку в [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]. Остановка относится к более широкому движению, а не к одной фабричной жалобе, и переносит споры цехов прямо в национальную политику. Хозяева боятся, что пример распространится на другие города, а организаторы надеются, что видимый ущерб заставит правительство говорить с ними как с политической силой, а не только как с нарушителями порядка."
  news_events_world.31.d: "Значительная забастовка вспыхнула в [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], привлекая внимание всей страны к зарплатам, рабочему времени и положению рабочего человека. Нарушения достаточно серьёзны, чтобы встревожить министров и промышленников, опасающихся долгой остановки производства и подражания в других местах. В нескольких городах собирают помощь семьям бастующих. Реакция правительства может решить, закончится ли спор переговорами, репрессией или более широкой волной волнений."
  news_events_world.31.f: "С ПИКЕТА: Организаторы обещают продолжать забастовку до реальных уступок, а хозяева предупреждают, что каждая простаивающая смена увеличивает цену конфликта и воодушевляет рабочих в других местах."

  ## Reader responses, one per story.
  news_events_world.1.a: "Будем надеяться, что благоразумие восторжествует."
  news_events_world.2.a: "Дело разрастается с каждым днём."
  news_events_world.3.a: "Да поможет Бог обеим сторонам."
