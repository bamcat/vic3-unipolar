  news_events_world.22.a: "Новая расстановка сил."
  news_events_world.23.a: "Кредиторы этого не забудут."
  news_events_world.24.a: "Новый голос за столом."
  news_events_world.25.a: "У каждой империи бывает вечер."
  news_events_world.26.a: "Союзники ссорятся не менее горько, чем враги."
