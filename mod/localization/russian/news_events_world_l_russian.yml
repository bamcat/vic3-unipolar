  news_events_world.32.t: "[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting] сторона отступает!"
  news_events_world.32.d: "[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetNameNoFormatting] отступила в дипломатическом противостоянии с [ROOT.Var('news_world_32_news_backdown_target_ref').GetCountry.GetNameNoFormatting], уступив главное требование вместо того, чтобы довести спор до войны. То, что подавалось как испытание национальной решимости, закончилось за столом переговоров, и иностранные канцелярии уже оценивают, что этот отход означает для [ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting] престижа."
  news_events_world.32.f: "ДИПЛОМАТИЧЕСКИЙ ОТДЕЛ: Телеграммы из иностранных столиц сообщают об облегчении: войны удалось избежать. Однако дома противники правительства уже спрашивают, не слишком ли дорого была куплена мирная развязка."
  news_events_world.32.a: "Так закончился кризис."

