l_braz_por:
 GDP_TOOLTIP:0 "#header [concept_gdp] [Country.GetAdjective]#!\n@money![Country.MakeScope.ScriptValue('cwp_gdp')|Dv] (#u #tooltippable #tooltip:[Country.GetTooltipTag],COUNTRY_GDP_OWNERSHIP_TOOLTIP [Country.GetDomesticallyOwnedGDPFraction|%1b]#!#!#!) de $concept_gdp_short$ de propriedade doméstica ([Country.GetGDPRanking])\n@money![Country.MakeScope.ScriptValue('cwp_gdp_per_capita')|2*v] de [Concept('concept_gdp_per_capita', '$concept_gdp_per_capita_short$')] ([Country.GetGDPPerCapitaRanking])"
 COUNTRY_GDP_OWNERSHIP_TOOLTIP:0 "#header [concept_gdp_ownership] no país [Country.GetName]#!\n#u [Country.GetDomesticallyOwnedGDPFraction|%1b]#! (@money![Country.GetGDP|Dv]) de $concept_gdp_short$ de propriedade doméstica\n$TOOLTIP_DELIMITER$\n[SelectLocalization(IsZero_CFixedPoint(Country.GetForeignOwnedGDPFraction), 'NO_FOREIGNLY_OWNED_PERCENTAGE', 'COUNTRY_FOREIGNLY_OWNED_PERCENTAGE')]\n\n[SelectLocalization(IsZero_CFixedPoint(Country.GetGDPOwnedInForeignCountries), 'NO_OWNED_FOREIGN_GDP_BY_COUNTRY', 'OWNED_FOREIGN_GDP_BY_COUNTRY')]"

 COUNTRY_ALL_GDP:0 "@money!#v [Country.GetGDPWithOwnershipsInForeignCountries|D]#!"
 DOMESTIC_COUNTRY_GDP:0 "@money!#v [Country.GetGDP|D]#!"
 FOREIGN_COUNTRY_GDP:0 "@money!#u [Country.GetGDPOwnedInForeignCountries|Db]#!"
 COUNTRY_ALL_OWNERSHIP:0 "#u [Country.GetDomesticallyOwnedGDPFraction|%1b]#![ConcatIfNeitherEmpty(' + ', AddLocalizationIf(NotZero_CFixedPoint(Country.GetGDPOwnedInForeignCountries), 'FOREIGN_COUNTRY_GDP'))]"

 COUNTRY_POPULATION:0 "#title [Concept('concept_pop', '$concept_population$')]#!:\n#variable [Country.MakeScope.ScriptValue('smd_population')|Dv]#!"
 COUNTRY_GDP:0 "#title $GDP_SHORT$#!:\n#variable @money![Country.MakeScope.ScriptValue('cwp_gdp')|Dv]#!"

 ERROR_DEER_TOOLTIP:0 "#header Minha Nossa!#!\n#instruction Clique com o botão esquerdo#! para abrir o Registro de Erros\n#instruction Clique com o botão direito#! para afastá-lo (até que ele se irrite outra vez)"
 ERROR_MANUL_TOOLTIP:0 "#header Leia o Manul!#!\n#instruction Clique com o botão esquerdo#! para abrir o Registro de Erros\n#instruction Clique com o botão direito#! para afastá-lo (até que ele se irrite outra vez)"

 OH_DEER:0 "\"#italic Minha nossa, temos#! #bold [ErrorDeer.NumberOrErrors|v]#! #italic erro(s)!#!\""
 ERROR_MANUL:0 "#italic Nós temos#! #bold [ErrorDeer.NumberOrErrors|v]#! #italic erro(s)?! Vou ler o manul!#!"
 ERROR_DEER_SLOW_TICK_OPERATIONS:0 "#header Operações Lentas#!"

 EXPENSES_GOVERNMENT_BUILDING_GOODS:0 "$TAB$#tooltippable #tooltip:[GetPlayer.GetTooltipTag],GOVERNMENT_BUILDINGS_EXPENSES_BREAKDOWN,GovernmentGoodsExpenseTooltip #N @money!-[GetPlayer.GetGovernmentGoodsExpenses|D-]#!#!#! [concept_budget_goods_for_government_buildings]\n$TAB$#tooltippable;tooltip:SMD_HEALTHCARE_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_healthcare_expense_value')|D-]#!#!#! [concept_smd_healthcare]\n$TAB$#tooltippable;tooltip:SMD_EDUCATION_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_education_expense_value')|D-]#!#!#! [concept_smd_education]\n$TAB$#tooltippable;tooltip:SMD_POLICE_EXPENSE_TOOLTIP #N @money!-[GetPlayer.MakeScope.ScriptValue('smd_police_expense_value')|D-]#!#!#! [concept_smd_police]"

 LITERACY_UNINCORPORATED_TOOLTIP:0 "\n$TOOLTIP_DELIMITER$\nConsiderando também [Concept('concept_unincorporated_state', '$concept_unincorporated_states$')], #variable [Country.GetNumTotalLiteratePops|*]#! de #variable [Country.GetTotalPopulation|*]#! ([Country.GetTotalLiteracyRate|%v]) dos [Concept('concept_pop', '$concept_pops$')] no país #variable [Country.GetName]#! são instruídos ([Country.GetTotalLiteracyRanking])"

 POP_TOOLTIP:0 "#tooltip_header [Concept('concept_pop', '$concept_population$')]#!\nAtual: [Country.MakeScope.ScriptValue('smd_population')|Dv] ([Country.GetPopulationRanking])\n[Country.GetPopGrowthDesc]$POP_TOOLTIP_DELAYED$"

 SMD_HEALTHCARE_EXPENSE_TOOLTIP:0 "#header Despesas com [concept_smd_healthcare]#!\nO custo de funcionamento do sistema de saúde estatal. Depende principalmente do número de níveis de $building_government_administration$ que você mantém ([concept_bureaucracy]), além do nível de investimento da [concept_institution], da sua população (sem contar $peasants$) e do seu [concept_sol] médio.\nCusto mensal atual: @money!-[GetPlayer.MakeScope.ScriptValue('smd_healthcare_expense_value')|D-]#!"

 SMD_EDUCATION_EXPENSE_TOOLTIP:0 "#header Despesas com [concept_smd_education]#!\nO custo de funcionamento da educação pública. Depende principalmente do número de níveis de $building_government_administration$ que você mantém ([concept_bureaucracy]), além do nível de investimento da [concept_institution], da sua população (sem contar $peasants$) e do seu [concept_sol] médio.\nCusto mensal atual: @money!-[GetPlayer.MakeScope.ScriptValue('smd_education_expense_value')|D-]#!"

 SMD_POLICE_EXPENSE_TOOLTIP:0 "#header Despesas com [concept_smd_police]#!\nO custo de funcionamento das forças policiais. Depende principalmente do número de níveis de $building_government_administration$ que você mantém ([concept_bureaucracy]), além do nível de investimento da [concept_institution], da sua população (sem contar $peasants$) e do seu [concept_sol] médio.\nCusto mensal atual: @money!-[GetPlayer.MakeScope.ScriptValue('smd_police_expense_value')|D-]#!"
