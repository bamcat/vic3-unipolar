  news_events_world.1.t3: "As Potências se Dividem: [ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFormatting] Contra [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.2.t2: "Ultimato Entregue: [ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFormatting] Confronta [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFormatting]"
