l_braz_por:
  news_events_world.1.t: "[ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFormatting] e [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFormatting] à Beira da Guerra!"
  news_events_world.1.d: "A [ROOT.Var('news_world_1_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] colocou [ROOT.Var('news_world_1_news_country_a_ref').GetCountry.GetNameNoFlag] e [ROOT.Var('news_world_1_news_country_b_ref').GetCountry.GetNameNoFlag] em confronto aberto. Duas das principais potências da época agora se encaram em uma disputa formal, e as chancelarias da Europa entraram em um estado de atividade que não se via havia anos. Mensageiros circulam entre as capitais a todas as horas, as bolsas estão instáveis e os clubes militares falam de pouco mais. Se a disputa será resolvida pela negociação ou endurecerá até a guerra dependerá das exigências apresentadas nas próximas semanas, dos movimentos de tropas rumo à fronteira e de quais governos escolherão apoiar cada lado quando chegar o acerto de contas."
  news_events_world.1.f: "MESA DIPLOMÁTICA: Diz-se que os enviados dos dois lados trabalham muito além da meia-noite. Um observador estrangeiro descreveu o ambiente como cortês em público e inequivocamente hostil em privado."
  news_events_world.2.t: "CRISE! Entre [ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFormatting] e [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.2.d: "[ROOT.Var('news_world_2_news_clean_gp_ref').GetCountry.GetNameNoFlag] lançou todo o seu peso na [ROOT.Var('news_world_2_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] contra [ROOT.Var('news_world_2_news_other_country_ref').GetCountry.GetNameNoFlag]. Uma potência de primeira ordem decidiu envolver-se numa disputa que de outro modo poderia ter permanecido regional, e sua entrada muda por completo o caráter da crise. O que era uma querela entre vizinhos tornou-se uma questão para todo o concerto das nações. Os ministérios das Relações Exteriores estudam atentamente as exigências declaradas e quaisquer novos compromissos, enquanto os governos menores da região avaliam, em silêncio e sem publicidade, qual lado podem menos se dar ao luxo de ofender antes que a questão seja encerrada."
  news_events_world.2.f: "ANÁLISE: O que começou como uma disputa regional agora exige a atenção de todos os grandes ministérios das Relações Exteriores; governos menores decidem discretamente qual lado podem se dar ao luxo de desagradar."
  news_events_world.3.t: "GUERRA! Entre [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFormatting] e [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFormatting]!"
  news_events_world.3.d: "A [ROOT.Var('news_world_3_news_diplomatic_play_ref').GetDiplomaticPlay.GetName] ultrapassou a diplomacia e transformou-se em guerra aberta entre [ROOT.Var('news_world_3_news_country_a_ref').GetCountry.GetNameNoFlag] e [ROOT.Var('news_world_3_news_country_b_ref').GetCountry.GetNameNoFlag]. Embaixadores foram chamados de volta, reservistas convocados aos seus depósitos e as bolsas lançadas em desordem. Os escritórios de recrutamento registram multidões desde o amanhecer e as companhias ferroviárias colocaram seu material rodante à disposição dos ministérios da Guerra. Comerciantes já perguntam quais portos e rotas permanecerão abertos, e a que custo de seguro, enquanto governos de todo o continente avaliam quais obrigações seus tratados poderão agora lhes impor."
  news_events_world.3.f: "DO FRONT: Horários ferroviários dão lugar a cronogramas militares enquanto reservistas, munição e cavalos seguem para a zona de combate. Comerciantes já perguntam quais portos e rotas permanecerão seguros."
  news_events_world.4.t: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFormatting] Invade [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.4.d: "[ROOT.Var('news_world_4_news_clean_gp_ref').GetCountry.GetNameNoFlag] entrou em campanha contra [ROOT.Var('news_world_4_news_other_country_ref').GetCountry.GetNameNoFlag] na [ROOT.Var('news_world_4_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]. A disparidade entre os dois beligerantes é evidente para qualquer observador, e há quem nas capitais já fale de uma conclusão rápida e barata. Outros recomendam cautela. Nossos correspondentes militares lembram quantas vezes distância, terreno difícil, doença e a intervenção discreta de terceiros humilharam uma força que parecia esmagadora no papel, e quão raramente uma campanha iniciada sob previsões confiantes terminou dentro da estação prometida por seus autores."
  news_events_world.4.f: "MESA MILITAR: O desequilíbrio no papel pode ser considerável, mas nossos correspondentes alertam que distância, terreno e intervenção estrangeira já arruinaram muitas campanhas tidas como fáceis."
  news_events_world.5.t: "Golpe de Estado em [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.5.d: "A ordem política de [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetNameNoFlag] foi derrubada pela força. A autoridade agora repousa nas mãos de [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetRuler.GetFullName], e o Estado será governado como [ROOT.Var('news_world_5_news_source_country_ref').GetCountry.GetGovernment.GetName]. Ministérios, escritórios telegráficos e as principais estações ferroviárias foram tomados antes do amanhecer. Se o exército seguirá os novos senhores nas províncias tão prontamente quanto na capital, se as leis e tratados existentes serão respeitados e se os partidos depostos se submeterão ou recorrerão às armas são perguntas que ninguém na capital ainda consegue responder com segurança."
  news_events_world.5.f: "EXCLUSIVO DA CAPITAL: Moradores relatam soldados posicionados nos ministérios, nas estações e nos escritórios telegráficos. Pela manhã, disse-nos um funcionário, os uniformes haviam mudado, mas ninguém sabia de quem vinham as ordens."
  news_events_world.6.t: "[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] de [ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFormatting] é Assassinado"
  news_events_world.6.d: "[ROOT.Var('news_world_6_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_6_character_ref').GetCharacter.GetFullName], aos [ROOT.Var('news_world_6_character_ref').GetCharacter.GetAge] anos, foi morto por um assassino enquanto governava [ROOT.Var('news_world_6_news_source_country_ref').GetCountry.GetNameNoFlag]. O assassinato de um chefe de Estado provocou choque imediato, com ministros apressando-se para assegurar a capital, a guarnição e o tesouro e preservar ao menos a aparência de continuidade. Governos estrangeiros buscam garantias de que tratados e comandos militares permanecerão inalterados. A busca pela conspiração por trás do atentado apenas começou, e todas as facções do país têm interesse em saber sobre quem recairá a culpa."
  news_events_world.6.f: "MESA DE SEGURANÇA: Investigadores procuram cúmplices enquanto ministros correm para provar que o Estado continua sob controle. A pergunta sem resposta é se o assassino agiu sozinho ou em nome de uma facção à espera do próximo movimento."
  news_events_world.7.t: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullNameNoFormatting] Morreu; [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFormatting] Está de Luto"
  news_events_world.7.d: "[ROOT.Var('news_world_7_character_ref').GetCharacter.GetPrimaryRoleTitle] [ROOT.Var('news_world_7_character_ref').GetCharacter.GetFullName] morreu aos [ROOT.Var('news_world_7_character_ref').GetCharacter.GetAge] anos enquanto governava [ROOT.Var('news_world_7_news_source_country_ref').GetCountry.GetNameNoFlag]. Panos negros pendem dos edifícios públicos e as lojas da capital fecharam suas portas. A sucessão passa agora ao mecanismo previsto pelo costume e pela lei, e os ministros falam em uníssono de continuidade e política estável. Contudo, em privado, todas as chancelarias estrangeiras fazem a mesma pergunta: se a mudança alterará alianças, políticas ou o equilíbrio entre as facções que há tanto tempo cercam o trono e agora o encontram novamente ocupado."
  news_events_world.7.f: "DA CAPITAL: Multidões aguardam notícias da sucessão enquanto panos negros são pendurados nos prédios públicos. Por trás das cerimônias, ministros já disputam a definição do significado do próximo reinado."
  news_events_world.8.t: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetLastNameNoFormatting] Derrubado em [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.8.d: "[ROOT.Var('news_world_8_previous_ruler_ref').GetCharacter.GetFullName] foi removido do poder em [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetNameNoFlag] ainda em vida, e [ROOT.Var('news_world_8_new_ruler_ref').GetCharacter.GetFullName] assumiu as rédeas do Estado. O país será governado como [ROOT.Var('news_world_8_news_source_country_ref').GetCountry.GetGovernment.GetName]. Um governante vivo afastado sem eleição, sem morte e sem sucessão ordinária raramente admite explicação simples, e o relato oficial convenceu poucos. Diplomatas observam as nomeações ministeriais e os movimentos da guarnição em busca de pistas sobre o que ocorreu a portas fechadas e se a nova administração repousa sobre consentimento ou sobre a baioneta."
  news_events_world.8.f: "ANÁLISE POLÍTICA: Um governante vivo removido sem eleição, morte ou sucessão ordinária raramente deixa uma explicação simples para trás."
  news_events_world.9.t_presidential: "[ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting] Vence a Eleição Presidencial [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting]"
  news_events_world.9.d_presidential: "O [ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetNameNoFormatting] venceu a eleição em [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], e [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName] assume a presidência. Os candidatos do partido obtiveram [ROOT.Var('news_world_9_news_election_presidential_party_ref').GetParty.GetCurrentVotingPowerShare|%1] dos votos. O resultado foi recebido com celebração em alguns círculos e franco desalento em outros, e os interesses derrotados já contestam a condução da votação em vários distritos. Governos estrangeiros estudam o resultado pelo que pode anunciar na diplomacia, no comércio, na política militar e no ânimo geral de uma das principais potências da época."
  news_events_world.9.t_party: "[ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting] Triunfa nas Eleições [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetAdjectiveNoFormatting]"
  news_events_world.9.d_party: "O [ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetNameNoFormatting] emergiu como a força mais poderosa ao fim da campanha em [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], com seus candidatos obtendo [ROOT.Var('news_world_9_news_election_leading_party_ref').GetParty.GetCurrentVotingPowerShare|%1] dos votos. Comitês nas grandes cidades continuaram contando votos muito depois da meia-noite e, em mais de um distrito, o resultado é contestado. Governos, investidores e movimentos políticos no exterior avaliam o que o novo equilíbrio partidário significará para a política interna e para a conduta externa do país, e se o ministério que surgir conseguirá manter uma maioria funcional por muito tempo."
  news_events_world.9.t_government: "[ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting] Liderará o Governo de [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.9.d_government: "O [ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetNameNoFormatting] aparece como o principal partido do governo de [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag] após a eleição, tendo recebido [ROOT.Var('news_world_9_news_election_government_party_ref').GetParty.GetCurrentVotingPowerShare|%1] dos votos. Onde a Coroa permanece acima da disputa, uma eleição pode alterar por completo o equilíbrio de poder abaixo dela sem mudar o chefe de Estado. Governos estrangeiros e homens de negócios observam atentamente o novo ministério, pois a composição de um gabinete muitas vezes revela as intenções de um país melhor do que qualquer discurso do trono."
  news_events_world.9.t: "Concluída a Eleição em [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.9.d: "Uma eleição terminou em [ROOT.Var('news_world_9_news_source_country_ref').GetCountry.GetNameNoFlag], país cujo peso mundial torna o resultado um acontecimento internacional, e não apenas uma disputa doméstica. Os resultados foram telegrafados a todas as capitais da Europa poucas horas depois de anunciados. Governos e movimentos políticos no exterior estudam o equilíbrio dos partidos e a posição de [ROOT.Var('news_world_9_new_ruler_ref').GetCharacter.GetFullName], cujo governo ainda poderá influenciar diplomacia, comércio, disposição de frotas e exércitos e o clima mais amplo da época. Em casa, começa de fato o trabalho de formar uma administração."
  news_events_world.9.f: "MESA ELEITORAL: As sedes partidárias celebram, contestam e recontam em igual medida. No exterior, o resultado será lido como indício da próxima direção diplomática e comercial do país."
  news_events_world.10.t_drought: "Seca Castiga [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_drought: "As chuvas falharam em [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], onde cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] pessoas dependem da colheita. Os campos estão ressequidos, os reservatórios baixam a cada semana e agricultores reduzem o plantio esperando o pior. Criadores levam o gado cada vez mais longe em busca de água, comerciantes de cereais já elevam seus preços e comitês de socorro começam a se formar. Se o tempo seco persistir durante a estação, um ano ruim poderá transformar-se em algo muito pior, atingindo primeiro quem menos pode suportar o prejuízo."
  news_events_world.10.t_flood: "Grande Enchente em [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]; Muitos Temidos Mortos"
  news_events_world.10.d_flood: "Os rios transbordaram em [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], inundando fazendas, estradas e povoados inteiros numa região de cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitantes. Pontes e aterros ferroviários são inspecionados enquanto equipes de resgate tentam alcançar comunidades totalmente isoladas pela água. As perdas de gado são graves e muitas famílias perderam suas reservas de inverno. Os danos às lavouras e ao transporte continuarão a ser sentidos nos mercados muito depois de as águas recuarem."
  news_events_world.10.t_frost: "Geada Severa Devasta [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_frost: "Uma geada excepcional cobriu [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Agricultores relatam campos escurecidos e pomares arruinados, pois o frio atingiu culturas já avançadas na estação. Numa região que sustenta cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] pessoas, perder uma única colheita não é pouca coisa. Comerciantes esperam escassez nas áreas mais atingidas antes do fim do mês, enquanto os lavradores aguardam para saber se um novo plantio poderá recuperar parte das perdas."
  news_events_world.10.t_wildfire: "Incêndios Florestais em [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting] Forçam Evacuações"
  news_events_world.10.d_wildfire: "O fogo avança por [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], expulsando famílias de casa e ameaçando fazendas, madeira e estradas. A fumaça escureceu distritos inteiros e o sol é descrito como vermelho ao meio-dia. Autoridades locais organizam aceiros e convocam a milícia onde possível. Com cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] pessoas no estado afetado, as perdas de propriedade, pastagem e madeira poderão pesar sobre a região muito depois de apagadas as últimas chamas."
  news_events_world.10.t_hailstorm: "Chuva de Granizo Arruína a Colheita em [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_hailstorm: "Uma violenta tempestade de granizo varreu [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], despedaçando cereais em pé e quebrando telhados, vidros e animais expostos. Agricultores caminham por campos que há poucas horas estavam quase prontos para a colheita e agora estão achatados. Num estado com cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitantes, até uma destruição localizada se reflete rapidamente no preço do pão e na renda rural. Seguradoras já recebem pedidos de indenização, e autoridades paroquiais contam o custo para quem não possuía seguro algum."
  news_events_world.10.t_locust_swarm: "Nuvens de Gafanhotos Caem sobre [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_locust_swarm: "Enxames densos de gafanhotos caíram sobre [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], despindo os campos mais depressa do que as comunidades conseguem defendê-los. Celeiros são vigiados dia e noite enquanto agricultores queimam, batem e fumegam os insetos para afastá-los do que ainda resta. Diz-se que os enxames escurecem o céu. Com cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] pessoas nas áreas atingidas, autoridades temem que a fome siga de perto os insetos caso a praga persista ou avance para regiões agrícolas vizinhas."
  news_events_world.10.t_heatwave: "Calor Implacável Toma [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_heatwave: "Um calor implacável tomou [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Poços baixam, animais morrem nos campos e as plantações murcham sob um sol sem trégua. As cidades registram mortes entre idosos e crianças pequenas, e carroças de água trabalham do amanhecer ao anoitecer. As autoridades de um estado com cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] pessoas observam a saúde pública com tanta ansiedade quanto a colheita, sabendo que o calor prolongado pressiona comida, água e transporte ao mesmo tempo."
  news_events_world.10.t_disease_outbreak: "Praga se Espalha por [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_disease_outbreak: "Uma doença está se espalhando pelos campos e rebanhos de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Inspetores tentam identificar terras e animais afetados antes que o contágio alcance o distrito seguinte. Quarentena e abate talvez preservem a colheita mais ampla, mas significam ruína imediata para os agricultores cujos animais forem condenados e cujas terras forem fechadas. Num estado de cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitantes, a consequência será sentida não apenas pelos produtores, mas por todas as famílias que compram no mercado."
  news_events_world.10.t_extreme_winds: "Tempestade Deixa Rastro de Ruína em [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_extreme_winds: "Ventos extremos açoitaram [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], arrancando telhados, árvores, fios telegráficos e plantações. O tráfego rodoviário e ferroviário está lento enquanto equipes retiram destroços, e várias comunidades perderam toda comunicação. Num estado de cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] pessoas, a maior perda talvez venha não de uma única calamidade espetacular, mas da interrupção simultânea do transporte e da colheita quando ambos menos podem sofrer atraso."
  news_events_world.10.t_torrential_rains: "Chuvas Torrenciais Afogam os Campos de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_torrential_rains: "Chove sem cessar em [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], encharcando os campos e alagando estradas baixas e margens dos rios. Agricultores temem que a água parada apodreça a safra no solo mesmo onde as aldeias permaneçam secas. Comerciantes observam com crescente preocupação as ferrovias e estradas dos mercados. Numa região de cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitantes, uma estação úmida durante a colheita pode custar tanto quanto qualquer tempestade, pois a perda ocorre silenciosamente."
  news_events_world.10.t_pollinator_surge: "Estação Extraordinária nos Pomares de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_pollinator_surge: "Agricultores de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], relatam uma abundância extraordinária de abelhas e outros polinizadores. Pomares e culturas em flor estão formando frutos numa proporção rara na memória dos vivos. Há grande esperança de uma colheita generosa se o tempo continuar favorável. Num estado de cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] pessoas, uma estação forte reduziria o preço dos alimentos e elevaria a renda rural muito além das fazendas onde o fenômeno começou."
  news_events_world.10.t_optimal_sunlight: "Uma Estação Dourada em [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_optimal_sunlight: "Condições de sol excepcionalmente favoráveis prevalecem em [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Cereais e frutas amadurecem bem, e os agricultores falam de uma safra acima do comum se o tempo se mantiver. Comerciantes já se preparam para maior movimento na época da colheita e contratam carroças adicionais. Numa região de cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitantes, uma colheita abundante é sentida em todos os mercados e lares, embora os produtores alertem que ainda são necessárias várias semanas de bom tempo."
  news_events_world.10.t_moderate_rainfall: "Chuvas Benéficas Abençoam [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_moderate_rainfall: "Chuvas regulares e moderadas chegaram a [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], no momento mais favorável da estação de crescimento. Os campos recebem água sem os estragos das grandes tempestades, e até os agricultores mais antigos se dizem satisfeitos. Num estado de cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] pessoas, a perspectiva de boa produção já estabilizou o mercado de cereais. Comerciantes abrem espaço nos armazéns para um fluxo maior de grãos e produtos do que esperavam neste ano."
  news_events_world.10.t_tsunami: "Grande Onda Devasta a Costa de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_tsunami: "Uma grande onda atingiu a costa de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], levando destruição aos portos e aos povoados baixos. As notícias da costa continuam fragmentárias enquanto equipes de resgate vasculham os destroços e diversos navios são dados como desaparecidos com toda a tripulação. Com cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] pessoas no estado afetado, ainda não é possível calcular o número de mortos, e a interrupção do comércio costeiro deverá persistir muito depois do trabalho imediato de salvamento."
  news_events_world.10.t_earthquake: "Terremoto Arrasa Cidades em [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_earthquake: "Um poderoso terremoto sacudiu [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], derrubando edifícios e rompendo estradas, ferrovias e sistemas de água. Equipes de resgate cavam os escombros à luz de lampiões enquanto novos tremores dificultam a busca pelos desaparecidos e empurram sobreviventes para áreas abertas. Distritos inteiros são descritos como ruínas. Num estado com cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitantes, mesmo uma zona limitada de destruição pode causar grande perda de vidas e anos de reconstrução."
  news_events_world.10.t_calm_waters: "Mares Calmos Favorecem os Portos de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_calm_waters: "Águas excepcionalmente calmas são registradas na costa de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Frotas pesqueiras e navegação costeira trabalham com poucos atrasos, e os portos movimentam carga em condições que os capitães mal recordam ter visto. Se o padrão persistir, comerciantes esperam menos perdas no mar e algum alívio nos seguros. Para um estado costeiro de cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] pessoas, uma estação tranquila nas águas se reflete diretamente no preço e no abastecimento de peixe e mercadorias importadas."
  news_events_world.10.t_fog: "Nevoeiro Denso Cega [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_fog: "Um nevoeiro pesado caiu sobre [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], reduzindo a visibilidade nas estradas, ferrovias e águas. Navios avançam lentamente em direção aos portos e trens circulam com extrema cautela. O perigo imediato é de colisões, e vários acidentes menores já são relatados. Numa região de cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitantes, um nevoeiro prolongado atrasará entregas e perturbará o comércio cotidiano das cidades."
  news_events_world.10.t_cyclone: "Ciclone Atinge [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_cyclone: "Um ciclone atravessa [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], com ventos destrutivos e chuva torrencial. Comunidades costeiras relatam telhados arrancados, árvores derrubadas e comunicações cortadas, enquanto as autoridades buscam abrigo para os desalojados. Com cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] pessoas no caminho da tempestade, a combinação de enchente e vento desperta temores de uma calamidade cujos efeitos serão contados em meses, não semanas."
  news_events_world.10.t_ice: "Gelo Severo Paralisa [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_ice: "Gelo severo tomou [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Estradas e ferrovias tornam-se perigosas, cursos d'água diminuem ou param completamente e lavouras e animais sofrem no frio. O carvão circula mal justamente quando é mais necessário. Comerciantes alertam que, num estado de cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] pessoas, a interrupção do transporte poderá custar tanto quanto as perdas diretas nos campos se o gelo não ceder antes que as reservas se esgotem."
  news_events_world.10.t_rough_waters: "Mar Revolto Fecha os Portos de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_rough_waters: "O mar revolto perturba a costa de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Barcos de pesca permanecem no porto, navios mercantes adiam a partida e as autoridades alertam para aproximações perigosas; várias embarcações estão atrasadas. Num estado costeiro de cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] habitantes, interrupções repetidas no mar logo aparecem no preço dos alimentos, no custo dos seguros e na circulação de todos os artigos importados de que as cidades dependem."
  news_events_world.10.t_strong_winds: "Vendavais Persistentes Castigam [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_strong_winds: "Ventos fortes e persistentes varrem [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Fazendas expostas e rotas de transporte sofrem danos, e marinheiros e autoridades portuárias enfrentam condições difíceis em toda a costa. Os vendavais não são destrutivos em toda parte, mas sua duração começa a atrapalhar a colheita, as viagens locais e o fluxo regular de mercadorias. Numa região de cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] pessoas, essas interrupções chegam aos mercados em questão de dias."
  news_events_world.10.t_tropical_storm: "Tempestade Tropical Avança sobre [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_tropical_storm: "Uma tempestade tropical entrou em [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag], trazendo chuva forte, ventos intensos e mar perigoso. As autoridades alertam comunidades baixas, os portos reduzem o tráfego e agricultores tentam proteger plantações e animais. Com cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] moradores no estado afetado, mesmo uma tempestade abaixo da força de um ciclone pode causar grande perturbação à moradia, à colheita e ao comércio costeiro."
  news_events_world.10.t_fallback: "Condições Extraordinárias em [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.10.d_fallback: "Uma mudança extraordinária do tempo afeta [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetName], em [ROOT.Var('news_world_10_news_source_country_ref').GetCountry.GetNameNoFlag]. Autoridades reúnem relatos de fazendas, transportes e mercados para decidir se os efeitos constituem calamidade ou benefício, e os primeiros informes são contraditórios. Como cerca de [ROOT.Var('news_world_10_news_event_state_ref').GetState.GetPopulationSize|D] pessoas vivem no estado afetado, até uma alteração temporária nas condições da colheita poderá ter consequências muito além dos primeiros distritos atingidos."
  news_events_world.10.f: "DO DISTRITO AFETADO: Agricultores e autoridades locais descrevem colheitas arruinadas, transporte interrompido e mercados apreensivos. Os primeiros relatos ainda são incompletos, e a verdadeira escala das perdas talvez só seja conhecida dentro de semanas."
  news_events_world.11.t: "Revolução em [ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.11.d: "Uma insurreição revolucionária eclodiu contra [ROOT.Var('news_world_11_news_source_country_ref').GetCountry.GetNameNoFlag]. Os rebeldes organizaram-se como [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetNameNoFlag] e proclamam um [ROOT.Var('news_world_11_news_rebel_country_ref').GetCountry.GetGovernment.GetName] no lugar da velha ordem. Barricadas surgiram nos bairros operários e partes da guarnição teriam passado para o outro lado. A disputa deixou a agitação e tornou-se uma luta armada pelo próprio Estado. Governos vizinhos observam com ansiedade indisfarçável para saber se o regime atual sobreviverá ao desafio e que exemplo uma vitória revolucionária daria além das fronteiras."
  news_events_world.11.f: "DE NOSSO CORRESPONDENTE: Barricadas aparecem mais rápido do que proclamações podem ser impressas. Moradores descrevem bairros onde a autoridade muda de rua para rua e os rumores correm mais depressa do que qualquer ordem oficial."
  news_events_world.12.t: "Revolucionários Triunfam em [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.12.d: "Os revolucionários venceram a guerra civil em [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetNameNoFlag], e a máquina de um grande Estado passa às mãos de um [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetGovernment.GetName] sob [ROOT.Var('news_world_12_news_source_country_ref').GetCountry.GetRuler.GetFullName]. A vitória será sentida muito além das fronteiras, animando aliados e alarmando inimigos em igual medida. Capitais estrangeiras julgarão os vencedores não pelas proclamações, mas pelas leis que impuserem, pelas dívidas que reconhecerem e pelos tratados que escolherem honrar. Os primeiros meses do novo governo decidirão muito do que a luta não decidiu."
  news_events_world.12.f: "ANÁLISE: A vitória entrega aos revolucionários os ministérios, mas não automaticamente a burocracia, o exército nem a confiança do público. Seus primeiros dias no poder podem ser tão decisivos quanto os combates que os levaram até lá."
  news_events_world.13.t: "A Compra de [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetNameNoFormatting]"
  news_events_world.13.d: "Pelo [ROOT.Var('news_world_13_news_treaty_ref').GetTreaty.GetNameNoFormatting], [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetName] passou de [ROOT.Var('news_world_13_news_state_giver_ref').GetCountry.GetNameNoFlag] para [ROOT.Var('news_world_13_news_state_taker_ref').GetCountry.GetNameNoFlag]. O território transferido abriga cerca de [ROOT.Var('news_world_13_news_event_state_ref').GetState.GetPopulationSize|D] pessoas, portanto não se trata de mero ajuste no mapa. Administração, propriedade, acesso militar e a situação dos habitantes precisam agora ser definidos, e os governos vizinhos já calculam o que a nova fronteira significa para sua própria segurança. Os moradores não foram consultados sobre o assunto."
  news_events_world.13.f: "DA FRONTEIRA: Os moradores esperam para saber quais leis, impostos e autoridades acompanharão a nova bandeira. Para quem vive na terra transferida, uma assinatura numa capital distante significa uma mudança imediata de governo."
  news_events_world.14.t: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFormatting] Declara [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFormatting] seu Rival"
  news_events_world.14.d: "[ROOT.Var('news_world_14_news_country_a_ref').GetCountry.GetNameNoFlag] e [ROOT.Var('news_world_14_news_country_b_ref').GetCountry.GetNameNoFlag] entraram em rivalidade declarada. Dois Estados de primeira importância colocaram-se em competição aberta, e espera-se que a declaração endureça os alinhamentos pelo continente. Os embaixadores permanecem em seus postos, mas as cortesias habituais tornaram-se visivelmente mais frias. Toda disputa futura entre ambos, por menor que seja, será agora lida à luz dessa hostilidade, e questões que antes poderiam ser resolvidas discretamente entre funcionários serão travadas em público diante de um mundo atento."
  news_events_world.14.f: "MESA INTERNACIONAL: Diplomatas esperam que toda disputa futura entre os dois rivais seja interpretada através dessa nova hostilidade, inclusive questões que ontem poderiam ter sido resolvidas em silêncio."
  news_events_world.15.t: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFormatting] se Rende às Forças [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetAdjectiveNoFormatting]"
  news_events_world.15.d: "[ROOT.Var('news_world_15_news_annexed_country_ref').GetCountry.GetNameNoFlag] deixou de existir como Estado independente, e seu território restante foi absorvido por [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag] nos termos impostos pela [ROOT.Var('news_world_15_news_diplomatic_play_ref').GetDiplomaticPlay.GetName]. Um governo foi riscado do rol das nações, seus ministérios dissolvidos e seus representantes no exterior ficaram sem país a servir. [ROOT.Var('news_world_15_news_annexer_ref').GetCountry.GetNameNoFlag] agora assume o peso da terra conquistada e de seu povo, enquanto as potências vizinhas avaliam se isso encerra a disputa ou apenas prepara a seguinte."
  news_events_world.15.f: "DA ANTIGA CAPITAL: Placas governamentais estão sendo retiradas e funcionários decidem se servirão às novas autoridades. Um Estado pode desaparecer dos mapas mais rapidamente do que desaparecem as lealdades locais."
  news_events_world.16.t: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetLastNameNoFormatting] Assume o Poder em [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.16.d: "[ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetFullName], aos [ROOT.Var('news_world_16_new_ruler_ref').GetCharacter.GetAge] anos, sucedeu à liderança de [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetNameNoFlag] após a morte do governante anterior. O país é governado como [ROOT.Var('news_world_16_news_source_country_ref').GetCountry.GetGovernment.GetName]. Como o Estado está entre as principais potências, diplomatas já avaliam as amizades, convicções e a capacidade do novo governante de assegurar autoridade no início vulnerável de um reinado. A corte fala em continuidade; as embaixadas estão menos certas, e suas mensagens para casa serão lidas com atenção incomum."
  news_events_world.16.f: "MESA DO PALÁCIO: Cortesãos falam publicamente em continuidade, mas toda sucessão redistribui acesso e influência. Embaixadores estrangeiros já estudam quem está mais próximo do novo governante."
  news_events_world.17.t: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFormatting] e [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFormatting] Concluem uma Aliança"
  news_events_world.17.d: "[ROOT.Var('news_world_17_news_country_a_ref').GetCountry.GetNameNoFlag] e [ROOT.Var('news_world_17_news_country_b_ref').GetCountry.GetNameNoFlag] ingressaram no [ROOT.Var('news_world_17_news_treaty_ref').GetTreaty.GetNameNoFormatting], ligando-se por uma aliança formal. Os termos foram publicados apenas em parte, embora se suponha amplamente que existam entendimentos adicionais que não foram apresentados a qualquer parlamento. Planejadores militares e governos rivais examinam os compromissos com a máxima atenção, pois uma aliança desse peso pode transformar os cálculos de uma crise futura e converter uma disputa local em guerra geral antes que qualquer signatário tenha tempo de reconsiderar."
  news_events_world.17.f: "ANÁLISE MILITAR: Uma aliança importa mais antes do primeiro tiro. Os estados-maiores agora redesenharão seus planos supondo que uma guerra contra um signatário poderá significar guerra contra ambos."
  news_events_world.18.t: "O Novo Governo de [ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.18.d: "[ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetNameNoFlag] promulgou [ROOT.Var('news_world_18_news_new_law_ref').GetLaw.GetName], mudança grande o bastante para alterar a própria estrutura do Estado. O país agora é governado como [ROOT.Var('news_world_18_news_source_country_ref').GetCountry.GetGovernment.GetName]. Capitais estrangeiras reconsideram suas relações com a nova ordem, enquanto em casa seus partidários celebram e seus adversários se preparam para consequências que há muito previam. Juristas e funcionários públicos já trabalham nos aspectos práticos da transformação, pois títulos, ministérios e procedimentos que uma semana atrás pareciam permanentes agora precisam ser inteiramente reescritos."
  news_events_world.18.f: "MESA CONSTITUCIONAL: Juristas e funcionários públicos enfrentam as consequências práticas da nova ordem. Títulos, ministérios e antigos procedimentos que pareciam permanentes talvez precisem ser reescritos."
  news_events_world.19.t: "Tumulto em [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetNameNoFormatting] Paralisa a Economia Local e Aprofunda a Instabilidade"
  news_events_world.19.d: "Graves desordens são registradas em [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetName], dentro de [ROOT.Var('news_world_19_news_source_country_ref').GetCountry.GetNameNoFlag], região com cerca de [ROOT.Var('news_world_19_news_event_state_ref').GetState.GetPopulationSize|D] habitantes. Greves, distúrbios e a organização do descontentamento chegaram a ponto de ameaçar a administração comum. Lojas fecham cedo, reuniões públicas atraem multidões muito maiores do que o anunciado e a polícia recebeu reforços dos distritos vizinhos. Se a agitação continuar, poderá enfraquecer consideravelmente o governo e perturbar o comércio do país em escala mais ampla."
  news_events_world.19.f: "DAS RUAS: Comerciantes relatam que fecham mais cedo, e reuniões públicas atraem multidões incomuns. As autoridades insistem que a ordem pode ser restaurada, mas os moradores dizem que a tensão é visível muito antes de qualquer motim começar."
  news_events_world.20.t: "Recessão em [ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.20.d: "[ROOT.Var('news_world_20_news_source_country_ref').GetCountry.GetNameNoFlag] sofreu uma contração brusca e repentina de sua atividade comercial. O produto nacional caiu de cerca de £[ROOT.Var('news_world_20_news_recession_previous_gdp_value').GetValue|D] para £[ROOT.Var('news_world_20_news_recession_current_gdp_value').GetValue|D], uma queda de [ROOT.Var('news_world_20_news_recession_drop_value').GetValue|%1] em apenas um mês. As carteiras de pedidos encolhem, o crédito aperta e fabricantes falam de uma demanda mais fraca do que viam havia anos. Trabalhadores temem pelos salários e pelos empregos, enquanto mercados estrangeiros observam ansiosos para saber se o contágio se espalhará pelo comércio e pelos investimentos."
  news_events_world.20.f: "MERCADOS: Banqueiros e industriais procuram sinais de que a contração seja temporária. Um analista alerta que a confiança pode se recuperar rapidamente, até demissões e falências transformarem um mês ruim numa depressão duradoura."
  news_events_world.21.t: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFormatting] Alcança PIB de 1 Bilhão"
  news_events_world.21.d: "[ROOT.Var('news_world_21_news_source_country_ref').GetCountry.GetNameNoFlag] tornou-se a primeira nação do mundo a ultrapassar mil milhões de libras em produto anual, com o valor em aproximadamente £[ROOT.Var('news_world_21_news_billion_gdp_value').GetValue|D] quando realizado o cálculo. A concentração de manufatura, comércio e poder de compra ali reunida estabelece uma marca pela qual todos os rivais terão de se medir. Economistas discordam sobre o verdadeiro significado da conquista, e ela nada diz sobre quem recebe a riqueza, mas anuncia uma escala industrial que nenhum governo pode mais ignorar."
  news_events_world.21.f: "MESA FINANCEIRA: Economistas já discutem o que a conquista realmente significa. Ela diz pouco sobre quem recebe a riqueza, mas anuncia uma escala industrial que os rivais não podem ignorar."
  news_events_world.22.t: "[ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFormatting] Proclama Novo Acordo Internacional"
  news_events_world.22.d: "Um novo bloco foi formado sob [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetNameNoFlag]: [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName], reunido em torno do princípio [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetIdentity.GetName] e contando com [ROOT.Var('news_world_22_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers] Estados-membros em sua fundação. Outros governos examinam sua carta e seus integrantes com grande atenção, pois uma associação desse tipo pode redirecionar comércio, alianças e influência política em regiões inteiras. Se será um instrumento duradouro ou uma conveniência do momento só se saberá quando os membros forem testados por uma crise que nenhum deles escolheu."
  news_events_world.22.f: "ANÁLISE DIPLOMÁTICA: Novos blocos costumam anunciar unidade antes de serem testados por uma crise real. Ministérios estrangeiros observarão o primeiro desacordo entre os membros com mais atenção do que a cerimônia de fundação."
  news_events_world.23.t: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFormatting] Dá Calote em suas Dívidas!"
  news_events_world.23.d: "[ROOT.Var('news_world_23_news_source_country_ref').GetCountry.GetNameNoFlag] deixou de cumprir suas obrigações. No momento do calote, o principal da dívida pública era de aproximadamente £[ROOT.Var('news_world_23_news_default_principal_value').GetValue|D], diante de um limite de crédito de £[ROOT.Var('news_world_23_news_default_credit_limit_value').GetValue|D]. Credores enfrentam grandes perdas e os futuros empréstimos do Estado serão mais caros, se vierem a existir. Bancos e governos estrangeiros observam sinais de contágio, desordem política e qualquer indício de que o tesouro já não consegue sustentar o exército e a administração de que depende a autoridade governamental."
  news_events_world.23.f: "MESA FINANCEIRA: Detentores de títulos estão precificando política tanto quanto aritmética. Um acordo negociado pode restaurar a confiança; um calote prolongado poderá encarecer todo empréstimo futuro por muito tempo após a crise."
  news_events_world.24.t: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFormatting] Assume seu Lugar Entre as Grandes Potências"
  news_events_world.24.d: "[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetNameNoFlag] ascendeu à primeira categoria das nações, com produto anual de cerca de £[ROOT.Var('news_world_24_news_source_country_ref').GetCountry.GetGDP|D]. A promoção reflete um formidável acúmulo de riqueza, armas e influência e concede ao Estado voz nas grandes questões diplomáticas do dia. As potências estabelecidas já avaliam se devem cortejar o recém-chegado como aliado ou considerá-lo rival, enquanto ele próprio poderá descobrir que o reconhecimento traz obrigações tão pesadas quanto os privilégios que concede."
  news_events_world.24.f: "MESA INTERNACIONAL: Convites, protocolo e cálculos diplomáticos mudarão quase de imediato. O recém-chegado poderá descobrir que o reconhecimento traz não apenas influência, mas a expectativa de tomar partido em disputas antes consideradas distantes."
  news_events_world.25.t: "O Declínio de [ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFormatting]"
  news_events_world.25.d: "[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetNameNoFlag] caiu da primeira categoria das potências, com seu produto anual agora calculado em cerca de £[ROOT.Var('news_world_25_news_source_country_ref').GetCountry.GetGDP|D]. A mudança é mais do que cerimonial: anuncia uma capacidade reduzida de exigir atenção e moldar o equilíbrio mundial. Em casa, ministros enfrentam pressão para restaurar a força e o prestígio perdidos, e a oposição terá material de sobra. No exterior, antigos parceiros provavelmente negociarão de forma muito mais dura do que faziam há um ano."
  news_events_world.25.f: "ANÁLISE: A perda de posição será sentida nas salas de conferência antes de aparecer em qualquer mapa. Antigos parceiros poderão negociar com mais dureza, enquanto rivais testam se o declínio é temporário ou duradouro."
  news_events_world.26.t: "Liderança de [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFormatting] é Contestada"
  news_events_world.26.d: "Começou uma disputa pelo comando de [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetName], associação de [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetPowerBloc.GetNumMembers] Estados-membros. [ROOT.Var('news_world_26_news_bloc_contender_ref').GetCountry.GetNameNoFlag] lançou um desafio contra [ROOT.Var('news_world_26_news_bloc_leader_ref').GetCountry.GetNameNoFlag], o atual líder. Autoridades insistem que a cooperação normal continua sem perturbação, embora as delegações contem seus apoiadores com cuidado incomum. Uma disputa prolongada poderá dividir vários governos de uma só vez e convidar potências externas a explorar a confusão, como tantas vezes ocorreu antes."
  news_events_world.26.f: "DENTRO DO BLOCO: Autoridades insistem que a cooperação cotidiana continua, mas as delegações contam apoiadores com cuidado incomum. Uma disputa de liderança travada sem exércitos ainda pode dividir aliados em campos rivais."
  news_events_world.27.t: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFormatting] Toma a Liderança da Aliança"
  news_events_world.27.d: "[ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetNameNoFlag] superou [ROOT.Var('news_world_27_news_bloc_loser_ref').GetCountry.GetNameNoFlag] pela liderança de [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetName], associação com [ROOT.Var('news_world_27_news_bloc_winner_ref').GetCountry.GetPowerBloc.GetNumMembers] Estados-membros. Governos de toda a organização avaliam se a mudança os unirá mais estreitamente ou provocará resistência entre os que apoiaram o antigo líder. A disputa terminou, mas as lealdades que revelou não se resolvem tão facilmente, e o novo líder herda colegas que claramente preferiam outro resultado."
  news_events_world.27.f: "MESA DIPLOMÁTICA: A disputa terminou, mas talvez não as lealdades. O novo líder herda uma organização que contém governos que teriam preferido o derrotado."
  news_events_world.28.t: "[ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFormatting] e [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFormatting] Seguem Caminhos Separados"
  news_events_world.28.d: "O [ROOT.Var('news_world_28_news_treaty_ref').GetTreaty.GetNameNoFormatting], que ligava [ROOT.Var('news_world_28_news_country_a_ref').GetCountry.GetNameNoFlag] a [ROOT.Var('news_world_28_news_country_b_ref').GetCountry.GetNameNoFlag], foi dissolvido. A ruptura remove um compromisso importante e obriga ambos os governos a reconsiderar seus planos militares e sua posição em qualquer crise futura. Cada capital publicou uma declaração de pesar em termos que não convencem ninguém. Seus rivais já estudam a brecha pelas oportunidades que poderá oferecer, e a pergunta agora é onde os antigos parceiros buscarão segurança e quem está disposto a substituir o que foi perdido."
  news_events_world.28.f: "MESA INTERNACIONAL: Diplomatas descrevem a ruptura como mais importante do que o cancelamento formal. A questão agora é onde os dois antigos parceiros buscarão segurança e quem está disposto a substituir a relação perdida."
  news_events_world.29.t: "PÂNICO! Escassez Global de [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting]!"
  news_events_world.29.d: "Uma grave falta de [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] tomou o mercado mundial, e os preços subiram muito além do que o comércio considera normal. A demanda no mercado ficou em cerca de [ROOT.Var('news_world_29_news_shortage_imports_value').GetValue|D] contra apenas [ROOT.Var('news_world_29_news_shortage_exports_value').GetValue|D] oferecidos à venda, uma pressão de [ROOT.Var('news_world_29_news_shortage_pressure_value').GetValue|2] para um. Fabricantes, comerciantes e governos correm para garantir os estoques restantes, e o custo mais alto já se espalha por todas as indústrias que dependem do artigo."
  news_events_world.29.f: "MERCADOS: Compradores relatam contratos reescritos de hora em hora. Um corretor descreveu a corrida por [ROOT.Var('news_world_29_news_shortage_good_ref').GetGoods.GetNameNoFormatting] como um mercado em que ter dinheiro já não garante fornecimento."
  news_events_world.30.t: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] e [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] Redesenham o Mapa"
  news_events_world.30.d_exchange: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] e [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] concluíram uma troca de territórios. [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting], lar de cerca de [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D] pessoas, passa de [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] para [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting], enquanto [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting], com cerca de [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D] habitantes, segue no sentido oposto. As fronteiras foram redesenhadas por acordo, e não por guerra, e os habitantes das duas províncias acordam súditos de outro governo."
  news_events_world.30.d_a_to_b: "[ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting] concordou em transferir [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetNameNoFormatting] para [ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting]. O território contém cerca de [ROOT.Var('news_world_30_news_trade_state_a_ref').GetState.GetPopulationSize|D] pessoas, que não foram consultadas. Administração, tributação e segurança precisam agora ser reorganizadas sob o novo soberano, enquanto questões de propriedade, idioma e cargos locais ocuparão juristas por anos. Governos vizinhos estudam uma mudança de fronteira alcançada pela negociação em vez da força e tiram suas próprias conclusões."
  news_events_world.30.d_b_to_a: "[ROOT.Var('news_world_30_news_country_b_ref').GetCountry.GetNameNoFormatting] concordou em transferir [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetNameNoFormatting] para [ROOT.Var('news_world_30_news_country_a_ref').GetCountry.GetNameNoFormatting]. O território contém cerca de [ROOT.Var('news_world_30_news_trade_state_b_ref').GetState.GetPopulationSize|D] pessoas, que não foram consultadas. Administração, tributação e segurança precisam agora ser reorganizadas sob o novo soberano, enquanto questões de propriedade, idioma e cargos locais ocuparão juristas por anos. Governos vizinhos estudam uma mudança de fronteira alcançada pela negociação em vez da força e tiram suas próprias conclusões."
  news_events_world.30.f: "DA FRONTEIRA: Agrimensores podem mover a linha em dias, mas os moradores viverão com as consequências por anos. Comerciantes, proprietários e autoridades locais já perguntam quais regras sobrevivem à transferência."
  news_events_world.31.t: "GREVE! Trabalhadores se Unem em [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]!"
  news_events_world.31.d_nationwide: "Uma onda de greves percorre [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting] de ponta a ponta. O trabalho parou nas fábricas e nas obras públicas enquanto o movimento operário organizado pressiona patrões e ministros com suas exigências. A paralisação já é grande o bastante para atingir a produção de todo o país, e os jornais de todos os partidos só concordam quanto à sua gravidade. Há temor de que o confronto prolongado alimente o radicalismo e force o governo a escolher entre concessão e repressão, nenhuma das quais pode ser feita sem custo."
  news_events_world.31.d_mining: "Uma grande greve de mineiros eclodiu em [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], com [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] no centro da paralisação. Os homens deixaram as minas em meio a forte ressentimento, ameaçando o fluxo de carvão e metal para a indústria justamente quando a demanda é maior. Patrões e ministros são pressionados a chegar a um acordo antes que a escassez passe da boca da mina às fábricas e ferrovias. Nos distritos mineiros, comitês próprios mantêm a ordem, o que inquieta as autoridades tanto quanto qualquer desordem."
  news_events_world.31.d_industrial: "Operários das fábricas cruzaram os braços em [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], com [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] entre os principais centros da greve. A produção está interrompida enquanto trabalhadores e maquinistas exigem melhores salários e jornadas. Os patrões alertam para encomendas perdidas, fábricas paradas e contratos que irão para o exterior; os sindicalistas respondem que a paralisação prova precisamente aquilo que há muito defendem: o país funciona graças ao trabalho de quem menos é consultado sobre como ele é governado."
  news_events_world.31.d_railway: "Os ferroviários entraram em greve em [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], com a perturbação concentrada em [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting]. Uma paralisação longa ameaça muito mais do que as linhas: fábricas dependem dos trens para combustível e materiais, cidades para alimentos e o exército para seus movimentos. Mercadorias perecíveis já apodrecem nos desvios. Ministros são pressionados a restaurar o serviço ou chegar a um acordo antes que a paralisia se espalhe, e há quem fale abertamente em operar as ferrovias por outros meios."
  news_events_world.31.d_movement: "Os trabalhadores de [ROOT.Var('news_world_31_news_event_state_ref').GetState.GetNameNoFormatting] iniciaram uma greve de caráter claramente político em [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting]. A paralisação pertence a um movimento mais amplo, e não a uma única queixa da oficina, levando as disputas do chão de fábrica diretamente à política nacional. Os patrões temem que o exemplo se espalhe a outras cidades, enquanto os organizadores esperam que a perturbação visível obrigue o governo a tratá-los como força política, e não apenas como distúrbio a ser policiado."
  news_events_world.31.d: "Uma greve considerável eclodiu em [ROOT.Var('news_world_31_news_source_country_ref').GetCountry.GetNameNoFormatting], chamando a atenção de todo o país para salários, jornadas e a condição do trabalhador. A perturbação é grave o bastante para alarmar ministros e industriais, que temem que uma longa paralisação reduza a produção e inspire imitação em outros lugares. Em várias cidades levantam-se fundos para as famílias dos grevistas. A resposta do governo poderá decidir se a disputa termina em negociação, repressão ou numa onda de agitação mais ampla do que qualquer partido pretende."
  news_events_world.31.f: "DO PIQUETE: Os organizadores insistem que a paralisação continuará até que sejam feitas concessões reais, enquanto os patrões alertam que cada turno ocioso aumenta os custos e encoraja trabalhadores de outros lugares a aderir."

