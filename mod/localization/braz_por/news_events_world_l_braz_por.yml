  news_events_world.32.t: "Os [ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting] Recuam!"
  news_events_world.32.d: "[ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetNameNoFormatting] recuou em seu confronto diplomático com [ROOT.Var('news_world_32_news_backdown_target_ref').GetCountry.GetNameNoFormatting], cedendo à principal exigência em vez de levar a disputa à guerra. O que havia sido apresentado como um teste de determinação nacional terminou à mesa de conferência, e chancelarias estrangeiras já avaliam o que a retirada poderá significar para o prestígio [ROOT.Var('news_world_32_news_backdown_country_ref').GetCountry.GetAdjectiveNoFormatting]."
  news_events_world.32.f: "MESA DIPLOMÁTICA: Telegramas das capitais estrangeiras relatam alívio imediato por a guerra ter sido evitada. Em casa, porém, adversários do governo já perguntam se a paz foi comprada por um preço alto demais."
  news_events_world.32.a: "Assim termina a crise."

