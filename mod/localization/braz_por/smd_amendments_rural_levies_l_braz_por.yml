 smd_amendment_rural_levies:0 "Tributos rurais"
 smd_amendment_rural_levies_desc:0 "Além do imposto agrícola, os governos de distritos e aldeias cobram taxas, cotas de grãos e trabalho obrigatório das famílias camponesas para pagar escolas, estradas e funcionários locais. O fardo recai mais sobre os camponeses mais pobres."
 smd_amendment_rural_levies_modifier:0 "Tributos rurais"
 smd_amendment_rural_levies_modifier_desc:0 "Taxas distritais e trabalho obrigatório arrecadam dinheiro no campo à custa da boa vontade camponesa."
