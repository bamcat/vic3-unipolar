l_braz_por:
 smd_agitators.1.t:0 "Tupac Shakur está morto"
 smd_agitators.1.d:0 "Na noite de 7 de setembro de 1996, [SCOPE.sCharacter('smd_tupac_scope').GetFullName] foi atingido por quatro tiros enquanto estava em um carro parado num sinal vermelho em Las Vegas. Ele morreu em decorrência dos ferimentos em 13 de setembro, aos 25 anos. O atirador fugiu e ninguém foi acusado. Por todo o país, fãs se reuniram para homenageá-lo."
 smd_agitators.1.f:0 "Seu quarto álbum, All Eyez on Me, havia sido lançado no início daquele ano."
 smd_agitators.1.a:0 "Uma voz silenciada"
