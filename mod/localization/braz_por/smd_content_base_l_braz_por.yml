 state_pop_support_movement_liberal_add_desc:0 "Muda a atração pop para o movimento liberal."
 state_pop_support_movement_liberal_conservative_add_desc:0 "Muda a atração pop para o movimento Liberal Conservador."
 state_pop_support_movement_libertarian_add_desc:0 "Muda a atração pop para o movimento libertário."
