 great_polarization_complete_header:0 "A Grande Polarização termina se a crise for desfeita, ou se os Estados Unidos entrar em guerra civil."

 je_second_american_civil_war_reason:0 "Os Estados Unidos entraram numa nova guerra civil. Esta entrada de diário é um andaime para o próximo passe de design, onde os países regionais americanos separatistas serão criados e feitos para lutar uns contra os outros."
 second_american_civil_war_placeholder_tt:0 "Placeholder: criar países americanos, exércitos e guerras de ruptura no próximo passo de implementação."

 great_polarization.2.t:0 "Tiro em massa politicamente motivado"
 great_polarization.2.d:0 "Um tiroteio em massa ligado à retórica política extremista chocou o país. As facções concorrentes argumentam imediatamente sobre a culpa, segurança, liberdades civis e ideologia."
 great_polarization.2.f:0 "Os mortos estão de luto. A narrativa é disputada antes dos funerais começarem."
 great_polarization.2.a:0 "O ultraje alimenta a divisão."
 great_polarization.2.b:0 "Procure uma resposta bipartidária séria."

 great_polarization.3.t:0 "Tentativa de Assassinato"
 great_polarization.3.d:0 "Uma tentativa de assassinato de uma figura política levantou receios de que a violência política está se tornando normalizada."
 great_polarization.3.f:0 "O tiro falhou seu alvo, mas atingiu a república."
 great_polarization.3.a:0 "O país recua."
 great_polarization.3.b:0 "Expandir a segurança de protecção."

 great_polarization.4.t:0 "Aborrecimento Algorítmico"
 great_polarization.4.d:0 "Plataformas de mídia social têm amplificado o ultraje político, expondo milhões de pessoas a conteúdos radicais, redes de conspiração e contramobilização de identidade."
 great_polarization.4.f:0 "A alimentação não convence. Aumenta."
 great_polarization.4.a:0 "A máquina de ultrajes acelera."
 great_polarization.4.b:0 "Plataformas de pressão moderadas."

 great_polarization.5.t:0 "Uma onda de exposição"
 great_polarization.5.d:0 "Uma onda de alegações públicas contra figuras poderosas desencadeou um julgamento nacional sobre abuso, gênero e hipocrisia institucional."
 great_polarization.5.f:0 "O que tinha sido sussurrado é agora pesquisável."
 great_polarization.5.a:0 "O julgamento se espalha."
 great_polarization.5.b:0 "Construir canais institucionais para a responsabilização."

 great_polarization.6.t:0 "Minorias Destinadas"
 great_polarization.6.d:0 "Um surto de hostilidade em relação às comunidades minoritárias desencadeou protestos, contra-protestos e um renovado debate sobre racismo, identidade e pertença nacional."
 great_polarization.6.f:0 "Para alguns, é uma reação. Para outros, é sobrevivência."
 great_polarization.6.a:0 "As ruas enchem novamente."
 great_polarization.6.b:0 "Condene a reação e reduza a temperatura."

 great_polarization.20.t:0 "As Quedas de Temperatura"
 great_polarization.20.d:0 "A polarização não desapareceu, mas a espiral mais perigosa foi interrompida. As instituições políticas recuperaram alguma legitimidade."
 great_polarization.20.f:0 "Uma república sobrevive não porque seus cidadãos concordem, mas porque o suficiente deles aceitam perder."
 great_polarization.20.a:0 "A união dura."

 great_polarization.21.t:0 "O Dividido Entretido"
 great_polarization.21.d:0 "A crise imediata não explodiu na guerra civil, mas a polarização tornou-se incorporada na vida política americana."
 great_polarization.21.f:0 "A febre não diminuiu. Tornou-se crónico."
 great_polarization.21.a:0 "O novo normal."

 great_polarization_baseline_desc:0 "A atmosfera política é cada vez mais radicalizada e reativa."

