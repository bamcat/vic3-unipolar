l_braz_por:

 news.1.t:0 "Uma Ocorrência Notável"
 news.1.d:0 "Um recorte de teste. Se isto aparecer como um jornal, com o cabeçalho de seu país no alto, a matéria impressa sobre papel e SEM moldura escura ou barra de título ao redor da janela, então o tipo de janela está funcionando. Ela também deve continuar podendo ser arrastada."
 news.1.f:0 "Nossos correspondentes estão a postos."
 news.1.a:0 "Notícia de primeira!"

 news.2.t:0 "REVOLUÇÃO NA RÚSSIA"
 news.2.d:0 "[ROOT.Var('news_test_2_news_attacker_ref').GetCountry.GetNameNoFlag] declarou formalmente guerra a [ROOT.Var('news_test_2_news_defender_ref').GetCountry.GetNameNoFlag]. Tropas estão sendo mobilizadas ao longo da fronteira, e as chancelarias das grandes potências observam com grave preocupação. Diplomatas foram chamados de volta e as bolsas mergulharam em tumulto. Nossos correspondentes seguem para o teatro da guerra, e novos detalhes são esperados pelo correio da noite. Diplomatas foram chamados de volta e as bolsas mergulharam em tumulto. Nossos correspondentes seguem para o teatro da guerra, e novos detalhes são esperados pelo correio da noite. Diplomatas foram chamados de volta e as bolsas mergulharam em tumulto. Nossos correspondentes seguem para o teatro da guerra, e novos detalhes são esperados pelo correio da noite."
 news.2.f:0 "Os canhões falam onde a diplomacia fracassou."
 news.2.a:0 "Notícia grave, sem dúvida."
